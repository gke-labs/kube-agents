reviewers:
  # The default reviewers
  defaults:
    - repository-owners # group

  # Reviewer groups each of which has a list of GitHub usernames
  groups:
    repository-owners:
      - bradhoekstra
      - jayantid
      - toshiowang
      - dshnayder
    waw-leads:
      - fatoshoti
      - mateuszklinowski
      - mplakhtiy
    # Mirrors the eval-crew alias in OWNERS_ALIASES: only it can /approve a
    # change under bench/tasks/ or to hack/ci-eval-pr.sh (#1546). Widen both
    # together, and only with root approvers: a mixed pull request routes
    # here alone, and its reviewer has to be able to clear the rest of it too.
    eval-crew:
      - jayantid

files:
  # Keys are glob expressions.
  # You can assign groups defined above as well as GitHub usernames.
  "**":
    - repository-owners # group
  "k8s-operator/**":
    - waw-leads
  ".github/workflows/k8s-operator-test.yml":
    - waw-leads
  ".github/workflows/staging-deploy.yml":
    - waw-leads
  # Listed after "**" so the last match sends these to the only approvers
  # who can clear them. The author is never requested, so eval-crew's own
  # pull requests fall back to the defaults for their lgtm.
  "bench/tasks/**":
    - eval-crew
  "hack/ci-eval-pr.sh":
    - eval-crew

options:
  ignore_draft: true
  ignored_keywords:
    - DO NOT REVIEW
  enable_group_assignment: false

  # Randomly pick reviewers up to this number.
  # Do not set this option if you'd like to assign all matching reviewers.
  number_of_reviewers: 1

  # If it's true, the last matching files-change pattern takes the most precedence (CODEOWNERS-compatible)
  # See https://github.com/necojackarc/auto-request-review/pull/80 for more details.
  last_files_match_only: true
