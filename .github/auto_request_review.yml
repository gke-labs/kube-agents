reviewers:
  # The default reviewers
  defaults:
    - repository-owners # group
    - repository-reviewers # group

  # Reviewer groups each of which has a list of GitHub usernames
  groups:
    repository-owners:
      - bradhoekstra
      - jayantid
      - toshiowang
      - dshnayder
      - bnaylor
      - haoxuw
    # Reviewers who are not root approvers. Prow takes their lgtm because
    # OWNERS lists them under `reviewers` (scripts/test_request_reviewers.py
    # pins that), but their approval cannot produce `approved`, so
    # scripts/request_reviewers.py draws from this group only when the
    # author's own approval already covers every changed file -- a root
    # approver's pull request, which needs lgtm alone. Any other pull request
    # takes an approver, at equal weight otherwise. Someone who becomes a root
    # approver moves to repository-owners; the same test pins that.
    repository-reviewers:
      - lapis2002
      - stalhaali
      - Fuxiao-Gao
    # Mirrors the eval-crew alias in OWNERS_ALIASES: only it can /approve a
    # change to hack/eval/presubmit-cases.txt or hack/eval/blocking-roster.txt
    # (#1546; hack/OWNERS). Keep the two lists identical. A mixed pull request
    # routes here alone, so a member who is not a root approver can clear the
    # roster half and the rest still waits on a root approver's /approve.
    eval-crew:
      - jayantid
      - lapis2002

files:
  # Keys are glob expressions.
  # You can assign groups defined above as well as GitHub usernames.
  "**":
    - repository-owners # group
    - repository-reviewers # group
  # Listed after "**" so the last match sends these to the only approvers
  # who can clear them. The author is never requested, so eval-crew's own
  # pull requests fall back to the defaults for their lgtm.
  "hack/eval/presubmit-cases.txt":
    - eval-crew
  "hack/eval/blocking-roster.txt":
    - eval-crew

options:
  ignore_draft: true
  ignored_keywords:
    - DO NOT REVIEW
  enable_group_assignment: false

  # Randomly pick reviewers up to this number.
  # Do not set this option if you'd like to assign all matching reviewers.
  number_of_reviewers: 1

  # If it's true, the last matching files-change pattern takes the most precedence (CODEOWNERS-compatible)
  # See https://github.com/necojackarc/auto-request-review/pull/80 for more details.
  last_files_match_only: true

  # Robots that review under an ordinary user account rather than a GitHub
  # App, so nothing else tells them from a person. Their reviews never count
  # as a verdict when deciding whether a pull request already has a human
  # reviewer: one re-reviews every push and files its follow-ups as
  # COMMENTED, so a CHANGES_REQUESTED it once filed would otherwise stand
  # for the life of the pull request and the check-run path would never
  # request a human. A review request outstanding to one of them is not a
  # reviewer already asked, either. Bare logins, as GitHub shows them: the
  # comparison is exact, and the script refuses any other shape at load.
  # Quote a login that is all digits or a YAML word such as yes, no, on or
  # off, or YAML reads it as a number or a boolean and the script refuses it
  # by name.
  robot_accounts:
    - kyber775
