name: Reusable Deploy Agent

on:
  workflow_call:
    inputs:
      target_environment:
        required: true
        type: string
        description: "The GitHub environment to use for variables (e.g., autopush, staging)"
      image_tag:
        required: true
        type: string
        description: "The Docker image tag to deploy (e.g. commit SHA or 'latest')"
      checkout_sha:
        required: true
        type: string
        description: "Immutable commit SHA to check out. Must be a SHA, not a branch or tag ref: a mutable ref lets the deployed code differ from the code that passed validation."

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
      MODEL_DEFAULT_NAME: ${{ vars.MODEL_DEFAULT_NAME }}
      MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
      GOOGLE_CHAT_MODE: ${{ vars.GOOGLE_CHAT_MODE }}
      NAMESPACE: "kubeagents-system"
    steps:
      - name: Verify Env Variables
        run: |
          for var in GCP_PROJECT_ID GCP_REGION GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT GKE_CLUSTER_NAME MODEL_DEFAULT_NAME MODEL_PROVIDER GOOGLE_CHAT_MODE; do
            if [ -z "${!var}" ]; then
              echo "::error::Required environment variable $var is not set."
              exit 1
            fi
          done

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    environment: ${{ inputs.target_environment }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
      MODEL_DEFAULT_NAME: ${{ vars.MODEL_DEFAULT_NAME }}
      MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
      GOOGLE_CHAT_ENABLED: ${{ vars.GOOGLE_CHAT_ENABLED }}
      GOOGLE_CHAT_MODE: ${{ vars.GOOGLE_CHAT_MODE }}
      CHAT_SUB_NAME: ${{ vars.CHAT_SUB_NAME }}
      CHAT_TOPIC_NAME: ${{ vars.CHAT_TOPIC_NAME }}
      ALLOWED_USERS: ${{ vars.ALLOWED_USERS }}
      SLACK_ENABLED: ${{ vars.SLACK_ENABLED }}
      SLACK_ALLOWED_USERS: ${{ vars.SLACK_ALLOWED_USERS }}
      SLACK_HOME_CHANNEL: ${{ vars.SLACK_HOME_CHANNEL }}
      SLACK_HOME_CHANNEL_NAME: ${{ vars.SLACK_HOME_CHANNEL_NAME }}
      NAMESPACE: "kubeagents-system"
      GITHUB_ORG: ${{ vars.GH_ORG }}
      GITHUB_REPO: ${{ vars.GH_REPO }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "k8s-operator/go.mod"
          cache-dependency-path: "k8s-operator/go.sum"

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          token_format: "access_token"
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to GKE
        uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER_NAME }}
          location: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set Image Env
        env:
          REPO_NAME: ${{ github.repository }}
          PACKAGE_NAME: "platform-agent"
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          REPO_DOWNCASE=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
          echo "AGENT_IMAGE=ghcr.io/${REPO_DOWNCASE}/${PACKAGE_NAME}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${INPUT_IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Perform Agent Redeployment
        env:
          AGENT_IMAGE: "${{ env.AGENT_IMAGE }}"
          IMAGE_TAG: "${{ env.IMAGE_TAG }}"
        run: |
          # Helm re-tags the agent image on the live release; the operator
          # reconciles the PlatformAgent CR and rolls the Deployment.
          # --reset-then-reuse-values keeps the release's own values while
          # letting the checkout's chart defaults refresh — plain
          # --reuse-values would snapshot old defaults into the release
          # config and shadow every later default bump. An
          # environment without the release predates the Terraform + Helm
          # engine and needs a one-time re-install from the composition.
          if ! helm status kube-agents -n kubeagents-system >/dev/null 2>&1; then
            echo "::error::No Helm release 'kube-agents' in kubeagents-system — this environment predates the Terraform + Helm engine and must be re-installed from terraform/examples/full-install before redeploys can run."
            exit 1
          fi
          echo "Redeploying platform-agent via helm upgrade with image: ${AGENT_IMAGE}:${IMAGE_TAG}"
          ./scripts/helm_upgrade_retry.sh kube-agents charts/kube-agents -n kubeagents-system \
            --reset-then-reuse-values --set "platformAgent.deployment.image.tag=${IMAGE_TAG}" --wait --timeout 10m

      - name: Verify Agent Deployment Rollout
        run: |
          # This is the only step that waits for the agent to come up. The
          # helm --wait above returns in seconds because the chart's resource
          # is the PlatformAgent CR, not the Deployment: the CR is ready
          # immediately and the operator reconciles it into
          # platform-agent-gateway afterwards, so --wait never watches the
          # slow part.
          #
          # 180s was under the cold-start cost and failed deploys that had
          # actually succeeded. On Autopilot a rollout onto a scaled-down node
          # pays node scale-up plus an agent image pull before the container
          # even starts: measured 215s in autopush and 259s in staging, the
          # latter spending 212s of it pre-Initialized. Both reported red
          # while the pod went Ready moments later.
          #
          # 900s, and it has to stay inside the ordering tests/test_hindsight_probes.py
          # records: startupProbe budget < rollout gate < progressDeadlineSeconds.
          # The gateway's agentAPIProbe(10, 60) sanctions a 605s cold boot, and
          # the repo's own derivation adds a 240s pull allowance on top, giving
          # 845s; 900 rounds that up. The ceiling is the gateway Deployment's
          # progressDeadlineSeconds, which the operator now pins at 1200s —
          # above that the Deployment reports ProgressDeadlineExceeded and this
          # wait returns early however long it was given.
          echo "Waiting for rollout of platform-agent-gateway deployment..."
          if ! kubectl rollout status deployment/platform-agent-gateway -n "$NAMESPACE" --timeout=900s; then
            echo "::error::Rollout failed! Printing debug logs..."
            kubectl describe deployment/platform-agent-gateway -n "$NAMESPACE" || true
            kubectl get pods -n "$NAMESPACE" -l app=platform-agent-gateway || true
            kubectl describe pods -n "$NAMESPACE" -l app=platform-agent-gateway || true
            kubectl logs -n "$NAMESPACE" -l app=platform-agent-gateway --all-containers --tail=50 || true
            exit 1
          fi
