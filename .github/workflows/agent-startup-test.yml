name: Agent Startup Tests

# Unit tests for the Python that runs during agent container startup. That logic decides
# what each Hermes profile's config.yaml ends up containing, and it fails silently — a
# profile keeps stale limits, or loses ones it should have, and the symptom surfaces much
# later as an agent that stops mid-task. The operator's Go tests do not reach it, and the
# AgentPlugin e2e suite needs a live GKE cluster, so without this job nothing checks it on
# a pull request.
#
# The discover pattern is test_*.py, which matches the tests/test_*.py suites and
# deliberately does NOT match tests/e2e/**/*_e2e_test.py — those need a cluster.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A re-push supersedes this pull request's earlier run instead of stacking a
# second full set of checks behind it. Runs that are not from a pull request
# fall back to github.run_id, which is unique, so each sits alone in its own
# group and none is ever cancelled. A shared key would not be safe there:
# GitHub holds only one run pending per group, so a burst of merges to main
# would lose the runs in the middle before they started.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Run Agent Startup Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            startup:
              - "deploy/shared/**"
              # The scaffold helpers the entrypoint calls, and the runtime path that
              # scaffolds a cluster profile long after startup — the same config and
              # plugin-linking logic, reached from the other direction.
              - "agents/platform/scripts/profile_scaffold.py"
              - "agents/platform/scripts/cluster_agent_profile.py"
              # The startup path a replicas > 1 Pod takes instead of the
              # entrypoint: the operator gives the sandbox a `command`, so this
              # script starts Hermes and owns the umask that keeps the shared
              # PVC writable from the credential sidecar. test_startup_umask.py
              # asserts that; it has to run when the file it asserts on changes.
              - "k8s-operator/internal/controller/leader_elect.py"
              # The install shell test_agent_iam_ceiling.py executes for real:
              # it sources common.sh and runs installer_common.sh's
              # permission-set gate, so that no built-in permission set grants
              # the agent GSA a role authorizing it through IAM regardless of
              # its Kubernetes RBAC.
              - "install.sh"
              - "k8s-operator/scripts/common.sh"
              - "k8s-operator/scripts/installer_common.sh"
              # The other half of that assertion: the Terraform composition is
              # what turns the answer into IAM bindings.
              - "terraform/examples/full-install/*.tf"
              # The agent-RBAC admission policies and the two things that
              # deliver them: test_admission_policy_shipped.py asserts that the
              # chart and the manual install each apply them. INSTALL.md is one
              # of those paths, not documentation about one — `make deploy` does
              # not install the policies, so on the manual path that kubectl
              # apply line IS the control, and deleting it in a docs-only PR
              # must not be silent.
              - "k8s-operator/config/admission/**"
              - "charts/kube-agents/templates/agent-rbac-admission-policy.yaml"
              - "charts/kube-agents/values.yaml"
              - "INSTALL.md"
              - "tests/test_*.py"
              # tests/test_operator_makefile.py asserts on the recipes this
              # Makefile prints; a Makefile-only change must run it or the
              # deploy contract it guards can revert unnoticed.
              - "k8s-operator/Makefile"
              # tests/test_ci_gitops_repo.py extracts and runs the GitOps
              # repository resolution out of this script. Its whole subject is
              # what happens when resolution FAILS, which a green presubmit
              # never exercises, so the guard has to follow the script.
              - "hack/ci-deploy.sh"
              - ".github/workflows/agent-startup-test.yml"

      - name: Set up Python
        if: steps.filter.outputs.startup == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".agent-python-version"

      # PyYAML is the only dependency: the tests use stdlib unittest so they run
      # anywhere the agent image does, without adding a test framework to the repo.
      - name: Install dependencies
        if: steps.filter.outputs.startup == 'true'
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Run tests
        if: steps.filter.outputs.startup == 'true'
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check entrypoint syntax
        if: steps.filter.outputs.startup == 'true'
        run: sh -n deploy/shared/docker-entrypoint.sh
