name: Agent Startup Tests

# Unit tests for the Python that runs during agent container startup. That logic decides
# what each Hermes profile's config.yaml ends up containing, and it fails silently — a
# profile keeps stale limits, or loses ones it should have, and the symptom surfaces much
# later as an agent that stops mid-task. The operator's Go tests do not reach it, and the
# AgentPlugin e2e suite needs a live GKE cluster, so without this job nothing checks it on
# a pull request.
#
# The suite has since grown beyond startup: tests/ is also where deployment-time security
# invariants are asserted against the shell and manifests that carry them, because those
# have no other home that runs on a pull request. This is the ONLY job that runs the
# top-level tests/ directory — make test-python's globs cover agents/, deploy/docker/patches/
# and scripts/, not tests/ — so a control asserted there and missing from the filter below
# is a control whose regression test never starts.
#
# The filter must therefore cover every file the suite reads. It currently does, and adding
# an assertion about a new file means adding that file here. To re-check rather than trust
# this comment, list what the suite actually opens:
#
#   python3 - <<'EOF'
#   import os, pathlib, sys, unittest
#   root = pathlib.Path.cwd(); seen = set()
#   sys.addaudithook(lambda e, a: e == "open" and isinstance(a[0], (str, bytes, os.PathLike))
#       and seen.add(os.fsdecode(a[0])))
#   unittest.TextTestRunner(verbosity=0).run(
#       unittest.TestLoader().discover("tests", pattern="test_*.py"))
#   print("\n".join(sorted(f for f in seen if str(root) in os.path.abspath(f))))
#   EOF
#
# A few entries below are deliberately broader than what the suite opens (the scaffold
# helpers): running too often is safe, not running is not.
#
# The discover pattern is test_*.py, which matches the tests/test_*.py suites and
# deliberately does NOT match tests/e2e/**/*_e2e_test.py — those need a cluster.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Agent Startup Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            startup:
              - "deploy/shared/**"
              # The scaffold helpers the entrypoint calls, and the runtime path that
              # scaffolds a cluster profile long after startup — the same config and
              # plugin-linking logic, reached from the other direction.
              - "agents/platform/scripts/profile_scaffold.py"
              - "agents/platform/scripts/cluster_agent_profile.py"
              # The startup path a replicas > 1 Pod takes instead of the
              # entrypoint: the operator gives the sandbox a `command`, so this
              # script starts Hermes and owns the umask that keeps the shared
              # PVC writable from the credential sidecar. test_startup_umask.py
              # asserts that; it has to run when the file it asserts on changes.
              - "k8s-operator/internal/controller/leader_elect.py"
              # The provisioning shell the suite executes for real: test_agent_iam_ceiling.py
              # sources common.sh and lifts get_platform_agent_roles out of the IAM step to
              # check that no built-in permission set grants the agent GSA a role that
              # authorizes it through IAM regardless of its Kubernetes RBAC. Without these
              # two paths, re-adding the admin bundle would not start the job that catches it.
              - "k8s-operator/scripts/common.sh"
              - "k8s-operator/scripts/provision_04_gcp_iam.sh"
              # The agent-RBAC admission policies and the three things that deliver
              # them: test_admission_policy_shipped.py asserts that the chart, the
              # provisioning script, and the manual install each apply them, so
              # deleting any delivery path has to start this job. INSTALL.md is one
              # of those paths, not documentation about one — `make deploy` does not
              # install the policies, so on the manual path that kubectl apply line
              # IS the control, and deleting it in a docs-only PR must not be silent.
              - "k8s-operator/config/admission/**"
              - "k8s-operator/scripts/provision_03_gcp_gke_operator.sh"
              - "charts/kube-agents/templates/agent-rbac-admission-policy.yaml"
              - "charts/kube-agents/values.yaml"
              - "INSTALL.md"
              - "tests/test_*.py"
              # tests/test_operator_makefile.py asserts on the recipes this
              # Makefile prints; a Makefile-only change must run it or the
              # deploy contract it guards can revert unnoticed.
              - "k8s-operator/Makefile"
              - ".github/workflows/agent-startup-test.yml"

      - name: Set up Python
        if: steps.filter.outputs.startup == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # PyYAML is the only dependency: the tests use stdlib unittest so they run
      # anywhere the agent image does, without adding a test framework to the repo.
      - name: Install dependencies
        if: steps.filter.outputs.startup == 'true'
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Run tests
        if: steps.filter.outputs.startup == 'true'
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check entrypoint syntax
        if: steps.filter.outputs.startup == 'true'
        run: sh -n deploy/shared/docker-entrypoint.sh
