name: "Shared: Reconcile Environment"

# Applies terraform/examples/full-install to an environment that already exists,
# or reports what applying it would change.
#
# This is the in-place half of #1117. deploy-environment.yml is the other half:
# it destroys the environment and builds it again, which is right for `rc` and
# `nightly` — they exist to prove an install works from nothing — and wrong for
# `autopush`, `autopush-next` and `staging`, which people live-test against and
# which hold state nobody wants rebuilt nightly.
#
# In-place is also the only path that exercises what a real user upgrading an
# existing install goes through. Nothing else in CI covers it.

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      github_environment:
        description: "GitHub environment supplying the GCP project, region, cluster and install settings"
        required: true
        type: string
      mode:
        description: "plan (read-only) or apply"
        required: true
        type: string
      image_tag:
        description: "Image tag to reconcile to. Empty holds the images where they are: a plan uses the tag Terraform state records, an apply keeps the one the install is running."
        required: false
        default: ""
        type: string
      lease_policy:
        description: "What an apply does when the live-test lease is held: defer, fail or ignore"
        required: false
        default: "defer"
        type: string
      # For an environment that may not be provisioned yet: when the GitHub
      # environment does not exist, or exists without GCP_PROJECT_ID, the run
      # posts a notice and reports `skipped` instead of failing on the strict
      # render. Off by default, because on an environment that should exist a
      # missing one is the failure. A caller drops it once the environment is
      # provisioned, so that clearing its variables reds the run again.
      skip_unconfigured:
        description: "Skip, rather than fail, when the GitHub environment or its GCP_PROJECT_ID is missing"
        required: false
        default: false
        type: boolean
    outputs:
      result:
        description: "planned, applied, deferred, failed, or skipped (skip_unconfigured only)"
        value: ${{ jobs.reconcile.outputs.result || jobs.preflight.outputs.result }}
      drift:
        description: "true, false or unknown — only meaningful for mode: plan"
        value: ${{ jobs.reconcile.outputs.drift }}
  #checkov:skip=CKV_GHA_7:Standalone launch has to name the environment and the mode
  workflow_dispatch:
    inputs:
      github_environment:
        description: "GitHub environment to reconcile"
        required: true
        type: choice
        options:
          - "autopush"
          - "autopush-next"
          - "staging"
          - "rc"
          - "nightly"
      mode:
        description: "plan (read-only) or apply"
        required: true
        default: "plan"
        type: choice
        options:
          - "plan"
          - "apply"
      image_tag:
        description: "Image tag to reconcile to (optional; keeps the running tag when empty)"
        required: false
        default: ""
        type: string
      lease_policy:
        description: "What to do when somebody is live-testing against this install"
        required: false
        default: "fail"
        type: choice
        options:
          - "fail"
          - "defer"
          - "ignore"

jobs:
  # Asks whether the GitHub environment exists before any job binds it, because
  # binding a missing environment creates it, empty and unprotected. Only under
  # skip_unconfigured; otherwise it answers yes without asking, and the bound
  # job below fails as it always did.
  preflight:
    name: find ${{ inputs.github_environment }}
    if: github.repository == 'gke-labs/kube-agents'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # GET /repos/{repo}/environments/{name}.
      actions: read
    outputs:
      exists: ${{ steps.exists.outputs.exists }}
      result: ${{ steps.exists.outputs.result }}
    steps:
      - name: Check the GitHub environment exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET: ${{ inputs.github_environment }}
          SKIP_UNCONFIGURED: ${{ inputs.skip_unconfigured }}
        run: |
          set -euo pipefail
          if [ "${SKIP_UNCONFIGURED}" != "true" ]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # 404 is the one answer that means "not provisioned yet". Anything
          # else that is not 200 is an API failure, and skipping on it would
          # report an unreachable environment as an absent one. A transient
          # failure -- a 5xx, a 403 or 429 rate limit, or curl failing to get
          # an answer at all (000) -- is retried with backoff first, so one
          # blip does not red the deploy; the last answer still decides.
          max_attempts=5
          first_backoff_seconds=2
          request_timeout_seconds=20
          backoff="${first_backoff_seconds}"
          attempt=1
          while :; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              --max-time "${request_timeout_seconds}" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${REPOSITORY}/environments/${TARGET}")" || code="000"
            case "${code}" in
              000 | 403 | 429 | 5??) ;;
              *) break ;;
            esac
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              break
            fi
            echo "GET environments/${TARGET} returned HTTP ${code} (attempt ${attempt}/${max_attempts}); retrying in ${backoff}s."
            sleep "${backoff}"
            attempt=$((attempt + 1))
            backoff=$((backoff * 2))
          done
          case "${code}" in
            200)
              echo "exists=true" >> "${GITHUB_OUTPUT}"
              ;;
            404)
              echo "::notice title=${TARGET} is not provisioned::The GitHub environment '${TARGET}' does not exist yet, so there is nothing to reconcile. Skipped; a repository admin creates it."
              echo "exists=false" >> "${GITHUB_OUTPUT}"
              echo "result=skipped" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "::error title=Could not look up ${TARGET}::GET environments/${TARGET} returned HTTP ${code} (000 means no response) after ${attempt} attempt(s), so whether the environment exists is unknown."
              exit 1
              ;;
          esac

  reconcile:
    name: ${{ inputs.mode }} ${{ inputs.github_environment }}
    needs: preflight
    # A fork inherits workflow_dispatch but none of the credentials, and this
    # one authenticates to GCP. Repeated on the job rather than left to cascade.
    if: github.repository == 'gke-labs/kube-agents' && needs.preflight.outputs.exists == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    # Shared with deploy-environment.yml's group for the same environment, so a
    # reconcile and a teardown-and-rebuild of the same cluster can never run at
    # once. Not shared with the redeploy workflows: GitHub queues only one
    # pending run per group, so a group they all sat in would let them evict
    # each other. reconcile_environment.sh waits those out by asking the API
    # instead.
    concurrency:
      group: ${{ inputs.github_environment }}-environment
      cancel-in-progress: false
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      # `gh run list`, for the in-flight redeploy check.
      actions: read
    outputs:
      result: ${{ steps.configured.outputs.skip == 'true' && 'skipped' || steps.reconcile.outputs.result }}
      drift: ${{ steps.reconcile.outputs.drift }}
      plan_log: ${{ steps.reconcile.outputs.plan_log }}
    env:
      CLOUDSDK_PYTHON: "/usr/bin/python3"

    steps:
      # The other half of skip_unconfigured: an environment that exists but
      # has no GCP_PROJECT_ID has not been pointed at a project yet. Every
      # step after this one is gated on it.
      - name: Check the environment is configured
        id: configured
        env:
          TARGET: ${{ inputs.github_environment }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          SKIP_UNCONFIGURED: ${{ inputs.skip_unconfigured }}
        run: |
          if [ "${SKIP_UNCONFIGURED}" = "true" ] && [ -z "${GCP_PROJECT_ID}" ]; then
            echo "::notice title=${TARGET} is not configured::The GitHub environment '${TARGET}' has no GCP_PROJECT_ID variable, so it is not pointed at a project yet. Skipped."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout repository
        if: steps.configured.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The revision being reconciled TO, not the one the caller happens to
          # sit on. `upgrade.sh --image-tag=X` refuses a checkout whose HEAD is
          # not X (verify_local_source_ref), and the nightly's whole job is to
          # promote a candidate OLDER than the commit it was dispatched from --
          # so without this, every staging reconcile exits 1 on a version
          # mismatch before applying anything. Worse than a red job: the
          # nightly's promotion job is deliberately decoupled from this one's
          # outcome, so the tag would still be pushed and staging's images would
          # move with its infrastructure left exactly as stale as before.
          #
          # It is also the right thing on its own terms. An environment runs one
          # commit: its images, its Helm values and its Terraform composition
          # come from the same tree, and reconciling the candidate's images with
          # main's composition would be a combination nothing has ever tested.
          #
          # Empty is the tagless case -- autopush, and every plan -- where
          # actions/checkout falls back to the caller's ref, which is what those
          # want: main's composition, images left where they are.
          ref: ${{ inputs.image_tag }}
          persist-credentials: false

      - name: Authenticate to GCP via Workload Identity Federation (WIF)
        if: steps.configured.outputs.skip != 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        if: steps.configured.outputs.skip != 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "579.0.0"
          install_components: "beta,gke-gcloud-auth-plugin"

      # terraform_wrapper: false for the reason deploy-environment.yml records —
      # lifecycle.sh reads terraform's stdout directly, and the wrapper re-prints
      # it. Here it matters twice over: `plan -detailed-exitcode` reports drift
      # through its exit code, and the wrapper does not preserve one.
      - name: Set up Terraform
        if: steps.configured.outputs.skip != 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Reconcile
        id: reconcile
        if: steps.configured.outputs.skip != 'true'
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
          # Configured in GitHub Environment Variables (vars.KUBE_AGENTS_KUBECTL_TIMEOUT).
          # Overrides the default 8s kubectl timeout in live_test_lease.py to accommodate
          # cold runner gke-gcloud-auth-plugin WIF token exchange and TLS handshake to GKE (#1465).
          KUBE_AGENTS_KUBECTL_TIMEOUT: ${{ vars.KUBE_AGENTS_KUBECTL_TIMEOUT }}
          RECONCILE_MODE: ${{ inputs.mode }}
          GITHUB_ENVIRONMENT: ${{ inputs.github_environment }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          LEASE_POLICY: ${{ inputs.lease_policy }}
          GH_TOKEN: ${{ github.token }}
          # Every install setting, under the names render_install_env.sh maps.
          # An environment missing one of the required ones fails there, naming
          # all of them at once — see #1117 §1, where autopush and staging were
          # found carrying almost none of these.
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
          CLUSTER_MODE: ${{ vars.CLUSTER_MODE }}
          REGISTRY_PREFIX: ${{ vars.REGISTRY_PREFIX }}
          THIRD_PARTY_REGISTRY_PREFIX: ${{ vars.THIRD_PARTY_REGISTRY_PREFIX }}
          NAMESPACE: ${{ vars.NAMESPACE }}
          MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
          MODEL_DEFAULT_NAME: ${{ vars.MODEL_DEFAULT_NAME }}
          VERTEX_PROJECT_ID: ${{ vars.VERTEX_PROJECT_ID }}
          VERTEX_LOCATION: ${{ vars.VERTEX_LOCATION }}
          GOOGLE_CHAT_ENABLED: ${{ vars.GOOGLE_CHAT_ENABLED }}
          GOOGLE_CHAT_MODE: ${{ vars.GOOGLE_CHAT_MODE }}
          GOOGLE_CHAT_HOME_CHANNEL: ${{ vars.GOOGLE_CHAT_HOME_CHANNEL }}
          CHAT_TOPIC_NAME: ${{ vars.CHAT_TOPIC_NAME }}
          CHAT_SUB_NAME: ${{ vars.CHAT_SUB_NAME }}
          ALLOWED_USERS: ${{ vars.ALLOWED_USERS }}
          SLACK_ENABLED: ${{ vars.SLACK_ENABLED }}
          SLACK_ALLOWED_USERS: ${{ vars.SLACK_ALLOWED_USERS }}
          SLACK_HOME_CHANNEL: ${{ vars.SLACK_HOME_CHANNEL }}
          SLACK_HOME_CHANNEL_NAME: ${{ vars.SLACK_HOME_CHANNEL_NAME }}
          # Not install.env keys, and deliberately so: an empty allowlist is
          # already what makes the operator admit everyone. These say that the
          # empty one is intended, which is the difference between an open
          # install and a variable somebody cleared by accident.
          GOOGLE_CHAT_ALLOW_ALL_USERS: ${{ vars.GOOGLE_CHAT_ALLOW_ALL_USERS }}
          SLACK_ALLOW_ALL_USERS: ${{ vars.SLACK_ALLOW_ALL_USERS }}
          ENABLE_GVISOR: ${{ vars.ENABLE_GVISOR }}
          ENABLE_GKE_BACKUP_PLAN: ${{ vars.ENABLE_GKE_BACKUP_PLAN }}
          ENABLE_PUBSUB_PLATFORM: ${{ vars.ENABLE_PUBSUB_PLATFORM }}
          ENABLE_STOCKOUT_INVESTIGATOR: ${{ vars.ENABLE_STOCKOUT_INVESTIGATOR }}
          # Unset leaves the key out of install.env and the shipped default (true)
          # answers for it, which is the behaviour either way. It is here so that
          # an environment CAN say false: the renderer rewrites install.env on
          # every reconcile, so a line added to that file by hand does not survive
          # to the next run and this variable is the only durable opt-out.
          ENABLE_DRIFT_DETECTOR: ${{ vars.ENABLE_DRIFT_DETECTOR }}
          PLATFORM_AGENT_PERMISSION_SET: ${{ vars.PLATFORM_AGENT_PERMISSION_SET }}
          PLATFORM_AGENT_CUSTOM_ROLES: ${{ vars.PLATFORM_AGENT_CUSTOM_ROLES }}
          # The PlatformAgent's spec.mode. Unset or `today` renders no key, so
          # an environment that does not set it renders the file it always
          # did; anything but today or next is refused by the renderer. The
          # installer reads the key, so a full upgrade renders the mode into
          # the chart: this is how a long-lived environment's declared mode
          # reaches its cluster, and how one a rebuild left on today returns.
          PLATFORM_AGENT_MODE: ${{ vars.PLATFORM_AGENT_MODE }}
          MEMORY_PROVIDER: ${{ vars.MEMORY_PROVIDER }}
          USER_PROFILE_ENABLED: ${{ vars.USER_PROFILE_ENABLED }}
          HERMES_DASHBOARD_ENABLED: ${{ vars.HERMES_DASHBOARD_ENABLED }}
          KMS_KEYRING: ${{ vars.KMS_KEYRING }}
          KMS_KEY: ${{ vars.KMS_KEY }}
          # GITOPS_, not GH_ORG/GH_REPO: that pair names the RELEASE repository,
          # and pointing the minter at it would scope a live GitHub App token at
          # this repository. deploy-environment.yml carries the same warning.
          GITOPS_ORG: ${{ vars.GITOPS_ORG }}
          GITOPS_REPO: ${{ vars.GITOPS_REPO }}
          GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
        run: ./scripts/release/reconcile_environment.sh

      # The plan text, for the drift report to quote and for a human to read
      # once the job log has aged out. Safe to publish: every credential
      # variable in terraform/examples/full-install/variables.tf carries
      # `sensitive = true`, so terraform renders them as `(sensitive value)`.
      # Adding an unmarked credential variable would change that — tests/
      # test_reconcile_environment.py asserts the marking so it cannot happen
      # quietly.
      #
      # always(), because a failed plan is the artifact worth having.
      - name: Upload the plan
        if: always() && steps.reconcile.outputs.plan_log != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reconcile-${{ inputs.github_environment }}-${{ inputs.mode }}
          path: ${{ steps.reconcile.outputs.plan_log }}
          if-no-files-found: warn
          retention-days: 14
