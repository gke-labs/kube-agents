name: Docs Deploy

# Publishes docs/site to GitHub Pages.
#
# By default this workflow only fires on push to main, so it's inert on
# forks until you (a) enable Pages in repo settings with source = "GitHub
# Actions", and (b) trigger it manually the first time via the Actions
# tab. After that, every push to main republishes.
#
# On the upstream `gke-labs/kube-agents` repo, Pages is enabled and the
# site is live at https://gke-labs.github.io/kube-agents/.

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "docs/site/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: docs/site

      - name: Build site
        run: npm run build
        working-directory: docs/site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
