name: Documentation Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# A re-push supersedes this pull request's earlier run instead of stacking a
# second full set of checks behind it. Runs that are not from a pull request
# fall back to github.run_id, which is unique, so each sits alone in its own
# group and none is ever cancelled. A shared key would not be safe there:
# GitHub holds only one run pending per group, so a burst of merges to main
# would lose the runs in the middle before they started.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docs-check:
    name: Documentation Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tables that mirror jobs.json, images.json, the skill frontmatter, or
      # the provisioning scripts must match their source, as must the
      # collapsed-family roster derived from the docs map.
      - name: Generated tables are current
        run: make docs-check-generated

      # Relative links must resolve. Catches paths broken by moved files.
      - name: Relative links resolve
        run: make docs-check-links

      # Identifiers must match the source of truth (service accounts,
      # namespace, Go toolchain and cert-manager versions).
      - name: Terminology matches source
        run: make docs-check-terminology

      # Every tracked .md/.mdx must have an inventory entry in the docs map,
      # and every path the map claims must exist. Catches added, moved,
      # renamed, or deleted docs that the hand-maintained map missed.
      - name: Documentation map covers every doc
        run: make docs-check-map

      # AGENTS.md and CLAUDE.md are loaded into every agent session before the
      # first prompt, so their size is a cost paid by every task here. Nothing
      # about that is visible in a diff, and the file quietly tripled in nine
      # days before anyone noticed.
      - name: Agent instruction files fit the context budget
        run: make docs-check-context-budget
