name: Operator Tests

# The two triggers filter in different places, and they have to.
#
# On a pull request the filtering is the `Detect changes` step below, because
# `Run Controller Tests` is a required check: a workflow that `paths:` declines
# to start posts no check at all, and branch protection waits for it forever.
# The job therefore always runs and skips its own steps -- which means it
# reports `success` on a pull request that ran no tests. That is fine there,
# since the check only has to not block.
#
# On a push to main it is not fine. A run that tested nothing and reported
# success is indistinguishable, in the run list and to anything reading the API,
# from a run that tested everything and passed. That is how #812 hid: main was
# red from 277de10, and the commits that followed which touched no Go each posted
# a green `Operator Tests` without compiling a line of it, so the push history
# reads red (2654), green (2655), red (2657), red (2658), then four greens before
# the real fix at 2700. `main-broken-notify.yml` reads that history to decide
# whether main has recovered, and would have believed every one of those greens.
#
# So the push trigger filters with `paths:` instead: a commit that touches
# nothing here produces no run at all, and an absent run cannot lie. Keep this
# list and the `operator:` filter below identical.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "k8s-operator/**"
      - "agents/platform/scripts/**"
      - ".github/workflows/k8s-operator-test.yml"
  workflow_dispatch:

# A re-push supersedes this pull request's earlier run instead of stacking a
# second full set of checks behind it. Runs that are not from a pull request
# fall back to github.run_id, which is unique, so each sits alone in its own
# group and none is ever cancelled. A shared key would not be safe there:
# GitHub holds only one run pending per group, so a burst of merges to main
# would lose the runs in the middle before they started.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Run Controller Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            operator:
              - "k8s-operator/**"
              - "agents/platform/scripts/**"
              - ".github/workflows/k8s-operator-test.yml"

      - name: Set up Go
        if: steps.filter.outputs.operator == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "k8s-operator/go.mod"
          cache: true
          cache-dependency-path: "k8s-operator/go.sum"

      # `make -C k8s-operator test` depends on test-python, which discovers the
      # tests under agents/platform/scripts as well as the operator's own. Those
      # modules import fastapi, mcp and the rest at module scope, so without this
      # the discovery reports an ImportError rather than running them. Read from
      # requirements-test.txt for the same reason python-tests.yml does: so the
      # two jobs and `make test-python-deps` cannot drift apart.
      #
      # This became load-bearing when test-python moved from a hand-maintained
      # list of four files to discovery -- the list never named the modules that
      # need these packages, which is precisely why it was stale.
      - name: Install the third-party imports the Python tests need
        if: steps.filter.outputs.operator == 'true'
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-test.txt

      # The deployment targets apply the committed manifests rather than
      # regenerating them, so nothing at deploy time would notice config/
      # drifting from the API types. Catch it here instead.
      #
      # The manifests diff is byte-equality against prettier-formatted output,
      # so the prettier version is pinned: a new release that changes YAML
      # formatting would otherwise fail this gate on every operator PR until
      # someone commits a reformat. Keep the pin in lockstep with prettier.yml.
      #
      # The api/ diff runs `generate` but ignores the licence-header year,
      # which `generate` stamps from the current date (YEAR ?= $(shell date
      # +%Y)) — without -I this step would fail every operator PR from
      # 1 January onward on output that is not stale. Nothing else checks
      # committed deepcopy: `make test` regenerates before compiling, so a
      # stale DeepCopyInto that still compiles is invisible to the test job.
      #
      # git add --intent-to-add makes untracked files (a newly generated CRD
      # for a new API type) visible to git diff, which reports tracked files
      # only.
      - name: Verify generated manifests are up to date
        if: steps.filter.outputs.operator == 'true'
        run: |
          npm install -g prettier@3.9.6
          make -C k8s-operator manifests
          git add --intent-to-add -A -- k8s-operator/config
          if ! git diff --exit-code -- k8s-operator/config; then
            echo "::error::Committed manifests are out of date, or your local prettier differs from the version this gate pins above. Run 'make -C k8s-operator manifests' with that prettier version and commit the result."
            exit 1
          fi
          make -C k8s-operator generate
          git add --intent-to-add -A -- k8s-operator/api
          if ! git diff --exit-code -I'Copyright [0-9]{4}\.' -- k8s-operator/api; then
            echo "::error::Generated deepcopy is out of date. Run 'make -C k8s-operator generate' and commit the result."
            exit 1
          fi

      - name: Run Tests
        if: steps.filter.outputs.operator == 'true'
        run: make -C k8s-operator test
