name: Operator Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Controller Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            operator:
              - "k8s-operator/**"
              - "agents/platform/scripts/**"
              - ".github/workflows/k8s-operator-test.yml"

      - name: Set up Go
        if: steps.filter.outputs.operator == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "k8s-operator/go.mod"
          cache: true
          cache-dependency-path: "k8s-operator/go.sum"

      # The deployment targets apply the committed manifests rather than
      # regenerating them, so nothing at deploy time would notice config/
      # drifting from the API types. Catch it here instead.
      #
      # Scoped to `manifests` and config/ deliberately. `generate` stamps
      # YEAR ?= $(shell date +%Y) into the deepcopy licence header, so diffing
      # k8s-operator/api would fail every operator PR from 1 January onward on
      # output that is not stale. config/ carries no year, and it is what the
      # deploy targets actually apply.
      - name: Verify generated manifests are up to date
        if: steps.filter.outputs.operator == 'true'
        run: |
          make -C k8s-operator manifests
          if ! git diff --exit-code -- k8s-operator/config; then
            echo "::error::Committed manifests are out of date. Run 'make -C k8s-operator manifests' and commit the result."
            exit 1
          fi

      - name: Run Tests
        if: steps.filter.outputs.operator == 'true'
        run: make -C k8s-operator test
