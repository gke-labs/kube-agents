name: Autopush Redeploy Integrations

on:
  push:
    branches:
      - main
    paths:
      - "k8s-operator/config/integrations/**"
      - "k8s-operator/scripts/provision_09_deploy_litellm.sh"
      - "k8s-operator/scripts/provision_10_deploy_github_minter.sh"
      - "k8s-operator/Makefile"
  workflow_dispatch:
    inputs:
      deploy_litellm:
        description: "Redeploy LiteLLM Integration"
        type: boolean
        default: true
      deploy_github:
        description: "Redeploy GitHub Minter Integration"
        type: boolean
        default: true

concurrency:
  group: autopush-redeploy-integrations
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  call-deploy:
    # inherit, not an explicit mapping: the called workflow's jobs read
    # GH_APP_ID, an environment secret. A `uses:` job cannot declare an
    # environment, so mapping the secrets here would evaluate them in this job,
    # pass GH_APP_ID through empty, and silently skip the minter deploy.
    secrets: inherit
    uses: ./.github/workflows/reusable-deploy-integrations.yml # zizmor: ignore[secrets-inherit]
    with:
      target_environment: "autopush"
      force_deploy: ${{ github.event_name == 'workflow_dispatch' }}
      checkout_sha: ${{ github.sha }}
