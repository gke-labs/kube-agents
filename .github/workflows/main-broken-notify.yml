name: Notify on Broken Main

# Open a `ci:main-broken` issue when a required check fails on main, keep it
# current while main stays broken, and close it when the check passes again.
# `scripts/notify_broken_main.py` holds the reasoning and the issue format; this
# file is the trigger and the guards.
#
# No setup: it writes with the workflow's own GITHUB_TOKEN and creates the label
# the first time it needs one. Issues opened with GITHUB_TOKEN do not trigger
# further workflows, so this cannot start a loop.
#
# `workflows:` matches on the workflow's `name:`, not its filename, and a rename
# there silently stops this from firing. The scheduled sweep goes red when a
# watched name matches no workflow, which catches an edit in place; a file
# moved and renamed together leaves a listed ghost carrying the old name, which
# the sweep cannot tell from a quiet workflow. The sweep carries the same list
# as `WATCHED_WORKFLOWS` in the script, because a workflow cannot read its own
# triggers, so the list exists three times: here, there
# (`scripts/test_notify_broken_main.py` fails when the two disagree), and as
# the required-check roster `BROKEN_MAIN_WATCHED_WORKFLOWS` in
# `scripts/test_integration_contracts.py`.
#
# What may go on the list: a workflow whose green on a push to main is a
# statement about the tree, not about the push. The script depends on that and
# cannot check it -- see its docstring. Every workflow below rebuilds or
# re-checks everything it covers on every run it starts, and `Operator Tests`
# only starts on a push that touches an operator path.
#
# `Documentation Checks` and `Python Unit Tests` joined the list after both sat
# red on main for thirteen hours (2026-09-03 20:54Z to 2026-09-04 10:34Z,
# gke-labs/kube-agents#1223) with sixteen merges landing on top and no
# `ci:main-broken` issue filed: they became required contexts on 2026-09-02,
# after this list was written, and nothing revisited it. Each runs its whole
# suite on every push with no `paths:` filter.
#
# `Python Unit Tests` also carries `Run Bench Harness Tests`, which is not a
# required context, so watching at run level files an issue when only that job
# is red. That job resolves devops-bench and its dependencies at run time, so a
# resolver outage during a push run would file an issue naming an innocent
# commit. Accepted: the alternative is not watching the suite that took
# thirteen hours to notice. `Validate Repo Structure` is the same shape with
# both jobs required -- `validate`, and `prompt-assets`, which reports the
# `Agent instructions cite assets that exist` context.
#
# `Prettier Check` is required and deliberately absent. It scopes itself to the
# files the push changed, so its green says those files are formatted and
# nothing about the rest of the tree: a bad `docs/a.md` would go red, and the
# next merge touching only Go would go green and close the issue with an
# innocent commit named as the fix. Whole-tree prettier is not the fix either --
# files under `.agents/skills/` have never been formatted, so it would be red
# from the first run. Prettier is also the check least exposed to the stale-base
# merge this exists to catch: it reads file contents, which a stale merge base
# does not change. `cla/google` is an external app with no run to watch, and
# `Validate Conventional Commit PR Title` runs only on pull requests, so it has
# no push run to watch either.

on:
  # zizmor: ignore[dangerous-triggers] - workflow_run is only dangerous when it checks
  # out the triggering run's code; this checks out the ref it runs from (the default
  # branch, except under a write-gated dispatch), acts only for push-to-main runs of
  # this repository, and passes the event nothing but a run id.
  workflow_run:
    workflows:
      - Actionlint
      - Docker Build
      - Documentation Checks
      - Operator Tests
      - Python Unit Tests
      - Validate Repo Structure
    types: [completed]
  # The backstop for an event that is never delivered -- a dropped
  # `workflow_run`, a runner outage -- and for anything the group below drops:
  # every watched workflow is reconciled against its newest completed push run
  # that said anything.
  # Cheap enough to run often: a few reads per watched workflow, and a
  # reconciliation that finds the issues already right writes nothing.
  schedule:
    - cron: "*/15 * * * *"
  #checkov:skip=CKV_GHA_7:One boolean, dry_run, which decides whether the sweep writes; nothing is built and no input is interpolated into a shell
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print what the sweep would file and file nothing
        type: boolean
        default: true

# Push-to-main event runs are serialised per watched workflow. Two merges
# landing together would otherwise both read the same history, reach the same
# answer, and race to open the same issue -- nothing in the API refuses the
# second one.
#
# `cancel-in-progress: false` does not mean nothing is dropped: GitHub holds at
# most one run pending per group, and a third arrival cancels the one waiting.
# So a burst of merges loses notify runs, and on 2026-09-16 it lost the only one
# whose triggering run was red, on the timing (#1681): the survivors deferred
# to it and main went unreported for nearly fifteen hours. That is survivable
# now because every notify run reconciles against the newest run of its
# workflow that said anything rather than the one that woke it: the last
# arrival in a group is never cancelled, it
# runs after every push run of the burst has finished, and it files whatever the
# newest of them says.
#
# That holds only if nothing else enters the group. `workflow_run` fires for
# every completion of a watched workflow, pull-request runs included -- several
# of those per push run -- and the group is evaluated before the job's `if:`
# skips them. Keyed on the workflow alone, a pull-request run's notify arriving
# mid-burst would cancel the pending push run's notify and then skip itself,
# leaving the red to the sweep. So the key repeats the push-to-main half of
# the `if:`'s test: a push run on main joins its workflow's group, and anything
# else gets a group of its own that cancels nothing. The `if:` below filters nothing by
# conclusion for the same reason: a cancelled run's notify can be the last
# arrival, and it reconciles as well as any other.
#
# Sweeps (the schedule and a dispatch) share a group of their own: one sweep at
# a time is all the serialisation they need, and holding an event run behind a
# sweep, or a sweep behind a burst, would buy nothing. A sweep and an event run
# can therefore both handle a fresh red at once and briefly open the same
# issue twice; the next reconciliation of either kind
# closes the duplicate as superseded, and the sweep guarantees there is one.
# The other direction -- a sweep that read a green history a moment before a
# red finished, closing the issue the red's event run just opened -- is what
# the script's rule that a green closes only older episodes is for.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name != 'workflow_run' && 'sweep' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.workflow_id || github.run_id) }}
  cancel-in-progress: false

permissions: {}

jobs:
  notify:
    name: Notify on Broken Main
    # The repository guard is required of any credentialed workflow that starts
    # on its own (AGENTS.md, Pull Request Hygiene): a fork inherits the trigger
    # and none of the secrets, so without it every fork sync mails its owner.
    #
    # `conclusion` is deliberately not filtered at all. A success can be the
    # recovery that closes a breakage, a cancelled run's notify can be the one
    # arrival of a burst the concurrency group keeps, and the script reads the
    # workflow's newest run that said anything rather than this one in any case.
    if: >-
      github.repository == 'gke-labs/kube-agents' &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the script
      # The triggering run, the workflow list, each workflow's run history,
      # and any run an issue links to.
      actions: read
      issues: write # open, update and close the tracking issue, and its label
    steps:
      # The default branch on every trigger but a dispatch, which checks out the
      # ref it was dispatched from -- the way to try a branch's script, with
      # `dry_run` set until it has earned the right to write.
      - name: Checkout the script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The run id and nothing else. The script reads the conclusion, the
      # commit and the history back from the API rather than trusting the
      # event payload for them, so a stale or spoofed field cannot change what
      # gets filed.
      # `MAIN_BROKEN_ANNOTATE` turns a refusal to write into a warning
      # annotation on this job; the script's unit tests run without it.
      - name: Report on the run
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIN_BROKEN_ANNOTATE: "true"
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 scripts/notify_broken_main.py --run-id "$RUN_ID"

      # No run to start from: the schedule and a manual dispatch reconcile
      # every watched workflow against its newest completed push run that said
      # anything.
      # `DRY_RUN` is the dispatch's one input, a boolean that GitHub renders
      # as the string "true"; the schedule has no inputs and always writes.
      - name: Sweep every watched workflow
        if: github.event_name != 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIN_BROKEN_ANNOTATE: "true"
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 scripts/notify_broken_main.py --sweep --dry-run
          else
            python3 scripts/notify_broken_main.py --sweep
          fi
