name: Installer Cross-OS Validation Matrix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "install.sh"
      - "uninstall.sh"
      - "upgrade.sh"
      # The three scripts source their defaults, validators, and the tfvars
      # generator from these helpers, so a change there must run this gate too.
      - "install.defaults.env"
      - "scripts/installer/installer_common.sh"
      - "scripts/installer/min_versions.sh"
      - "scripts/installer/gke_dns_endpoint.sh"
      - ".github/workflows/installer-matrix-test.yml"
  push:
    branches: [main]

permissions:
  contents: read

# A re-push supersedes this pull request's earlier run instead of stacking a
# second full set of checks behind it. Runs that are not from a pull request
# fall back to github.run_id, which is unique, so each sits alone in its own
# group and none is ever cancelled. A shared key would not be safe there:
# GitHub holds only one run pending per group, so a burst of merges to main
# would lose the runs in the middle before they started.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-installer:
    name: Validate Host OS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install deterministic dry-run command stubs
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/kube-agents-test-bin"
          cat > "$RUNNER_TEMP/kube-agents-test-bin/gcloud" <<'EOF'
          #!/usr/bin/env bash
          case "$*" in
            "config get-value account") echo "ci@example.com" ;;
            "config get-value project") echo "ci-test-project" ;;
            "config get-value compute/region") echo "us-central1" ;;
            "auth print-access-token") echo "test-access-token" ;;
            # ADC absent on purpose: install.sh's dry-run then skips the
            # terraform plan preview and stops at validate — both stubbed.
            "auth application-default print-access-token") exit 1 ;;
            projects\ describe*) echo "123456789012" ;;
            secrets\ versions\ access*) echo "test-model-key" ;;
            config\ set\ project*) ;;
            # The tfvars generator's liveness probes: no cluster, no state.
            # The describe stub must fail the way real gcloud does — a
            # NOT_FOUND on stderr — because the generator only reads that as
            # "cluster absent" and refuses to guess on any other failure
            # (guessing is how a transient error plans a live cluster's
            # replacement). STUB_LIVE_AUTOPILOT=true flips it to a live
            # Autopilot cluster for the adoption assertion below; unset
            # everywhere else, so every other step sees the absent cluster.
            container\ clusters\ describe*)
              if [ "${STUB_LIVE_AUTOPILOT:-}" = "true" ]; then echo "True"; exit 0; fi
              echo "ERROR: (gcloud.container.clusters.describe) NOT_FOUND: Not found." >&2; exit 1 ;;
            # Real get-credentials leaves a kubeconfig context behind, and the
            # generator gates both its Secret recovery and its live Hindsight
            # probe on the current context naming this cluster. A no-op stub
            # leaves none, so the probe can never ask, and an adoption run
            # refuses rather than guess the memory store away -- correct
            # behaviour against a stub that was lying about the fetch.
            # STUB_NO_CREDENTIALS=true is the other real outcome, the operator
            # having no access to the cluster; it clears the record so a later
            # step cannot inherit a context this run never obtained.
            container\ clusters\ get-credentials*)
              case "$*" in *--help*) exit 0 ;; esac
              if [ "${STUB_NO_CREDENTIALS:-}" = "true" ]; then
                rm -f "$RUNNER_TEMP/kube-agents-stub-context"
                echo "ERROR: (gcloud.container.clusters.get-credentials) ResponseError: code=403, message=Required \"container.clusters.get\" permission." >&2
                exit 1
              fi
              printf 'gke_ci-test-project_us-central1_ci-test-cluster\n' \
                > "$RUNNER_TEMP/kube-agents-stub-context" ;;
            # The minter gate's key-version probe: no ENABLED version.
            kms\ keys\ versions\ list*) exit 0 ;;
            storage\ cat*) exit 1 ;;
            *) echo "Unexpected gcloud invocation: $*" >&2; exit 1 ;;
          esac
          EOF
          chmod +x "$RUNNER_TEMP/kube-agents-test-bin/gcloud"
          # Silent success is how the installer reads "nothing there", and that
          # is what every dry run here wants from kubectl but one call: the
          # current context, which exists only once something fetched
          # credentials. Answering it unset unconditionally would make the
          # generator's Hindsight probe permanently unable to ask.
          cat > "$RUNNER_TEMP/kube-agents-test-bin/kubectl" <<'EOF'
          #!/usr/bin/env bash
          if [ "$*" = "config current-context" ]; then
            # What real kubectl does with no context: nothing on stdout, exit 1.
            [ -f "$RUNNER_TEMP/kube-agents-stub-context" ] || exit 1
            cat "$RUNNER_TEMP/kube-agents-stub-context"
          fi
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/kube-agents-test-bin/kubectl"
          for tool in gh helm gke-gcloud-auth-plugin; do
            printf '#!/usr/bin/env bash\nexit 0\n' > "$RUNNER_TEMP/kube-agents-test-bin/$tool"
            chmod +x "$RUNNER_TEMP/kube-agents-test-bin/$tool"
          done
          # terraform is stubbed like the cloud CLIs: the dry run asserts the
          # installer's own flow (install.env → interview → terraform.tfvars →
          # validate/plan), not Terraform's. validate.yml runs the real
          # terraform validate over the composition the generated tfvars feed.
          cat > "$RUNNER_TEMP/kube-agents-test-bin/terraform" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            init|validate|plan) exit 0 ;;
            version|--version) echo "Terraform v1.15.8" ;;
            *) echo "Unexpected terraform invocation: $*" >&2; exit 1 ;;
          esac
          EOF
          chmod +x "$RUNNER_TEMP/kube-agents-test-bin/terraform"

      # The stub PATH is scoped to the dry-run steps only: exporting it via
      # $GITHUB_PATH would shadow the real kubectl in the Kind validation
      # steps below and turn them into no-ops.
      - name: Validate Dry-Run Installer (Non-Interactive)
        run: |
          PATH="$RUNNER_TEMP/kube-agents-test-bin:$PATH" ./install.sh --dry-run -y --gcp-project-id="ci-test-project" --gke-cluster-name="ci-test-cluster" --gcp-region="us-central1" --image-tag="$GITHUB_SHA"

      - name: Validate Dry-Run Teardown (Non-Interactive)
        run: |
          PATH="$RUNNER_TEMP/kube-agents-test-bin:$PATH" ./uninstall.sh --dry-run -y --gcp-project-id="ci-test-project" --gke-cluster-name="ci-test-cluster" --gcp-region="us-central1"

      # upgrade.sh upgrades an install, and a preview that cannot name one is
      # worth nothing: with no install.env anywhere the run now stops on the
      # same refusal a real upgrade gives, so this step has to bring the
      # configuration an installed cluster would have. It comes from
      # KUBE_AGENTS_INSTALL_ENV in $RUNNER_TEMP rather than a file in the
      # checkout, because the assertion below requires that no dry run leaves
      # an install.env there.
      - name: Validate Dry-Run Upgrade (Non-Interactive)
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/upgrade-install.env" <<'EOF'
          PROJECT_ID="ci-test-project"
          CLUSTER_NAME="ci-test-cluster"
          REGION="us-central1"
          EOF
          KUBE_AGENTS_INSTALL_ENV="$RUNNER_TEMP/upgrade-install.env" \
            PATH="$RUNNER_TEMP/kube-agents-test-bin:$PATH" \
            ./upgrade.sh --dry-run -y --upgrade-mode=full --gcp-project-id="ci-test-project" --image-tag="$GITHUB_SHA"

          # Negative control: the same preview with nothing to read must refuse
          # rather than report. This run is from a checkout, which looks only at
          # KUBE_AGENTS_INSTALL_ENV, the checkout and the working directory --
          # $HOME/kube-agents is consulted only by a run from outside one. HOME
          # is moved anyway so the control does not rest on that.
          refusal_log="$RUNNER_TEMP/upgrade-refusal.log"
          set +e
          env HOME="$RUNNER_TEMP/empty-home" PATH="$RUNNER_TEMP/kube-agents-test-bin:$PATH" \
            ./upgrade.sh --dry-run -y --upgrade-mode=full --gcp-project-id="ci-test-project" --image-tag="$GITHUB_SHA" \
            > "$refusal_log" 2>&1
          refusal_status=$?
          set -e
          if [ "$refusal_status" -eq 0 ]; then
            echo "a preview with no install.env reported a plan instead of refusing:" >&2
            cat "$refusal_log" >&2
            exit 1
          fi
          grep -q "Refusing to upgrade without the installation's configuration" "$refusal_log"

      # The gcloud stub answers NOT_FOUND, so every dry run here takes the
      # fresh-create path — the one case where --gke-cluster-mode has a say. That
      # makes the generated tfvars the whole assertion.
      - name: Validate Dry-Run Installer Cluster Mode
        run: |
          set -euo pipefail
          tfvars="terraform/examples/full-install/terraform.tfvars"
          for mode in standard autopilot; do
            PATH="$RUNNER_TEMP/kube-agents-test-bin:$PATH" ./install.sh --dry-run -y \
              --gcp-project-id="ci-test-project" --gke-cluster-name="ci-test-cluster" \
              --gcp-region="us-central1" --gke-cluster-mode="$mode" --image-tag="$GITHUB_SHA"
            if ! grep -qE "^cluster_mode[[:space:]]+= \"${mode}\"\$" "$tfvars"; then
              echo "--gke-cluster-mode=${mode} did not reach terraform.tfvars:" >&2
              grep cluster_mode "$tfvars" >&2
              exit 1
            fi
          done

          # Adoption: the live cluster's shape overrules --gke-cluster-mode.
          #
          # This used to assert the same thing about vars.sh, because the
          # installer wrote the probed shape back there and upgrade.sh and
          # uninstall.sh regenerated from it -- a vars.sh naming the other
          # shape turned a later regeneration into a cluster replacement.
          # There is no such file and no such writeback now: every front door
          # re-probes through write_tfvars_from_state, so the generated tfvars
          # is the whole contract. terraform.tfvars is also what CI can check
          # on a dry run, which deliberately creates no install.env.
          STUB_LIVE_AUTOPILOT=true PATH="$RUNNER_TEMP/kube-agents-test-bin:$PATH" \
            ./install.sh --dry-run -y --gcp-project-id="ci-test-project" \
            --gke-cluster-name="ci-test-cluster" --gcp-region="us-central1" \
            --gke-cluster-mode="standard" --image-tag="$GITHUB_SHA"
          if ! grep -qE "^cluster_mode[[:space:]]+= \"autopilot\"\$" "$tfvars"; then
            echo "the live Autopilot cluster did not overrule --gke-cluster-mode=standard:" >&2
            grep -iE "cluster_mode" "$tfvars" >&2
            exit 1
          fi

          # The same adoption, with no access to the cluster. MEMORY is the one
          # key whose absence costs data rather than re-creatable
          # infrastructure, so a run that cannot ask whether the Hindsight store
          # is deployed must stop: continuing would generate
          # memory_provider = "multiuser_memory" and the apply would delete the
          # hindsight-postgresql StatefulSet and its database.
          refusal_log="$RUNNER_TEMP/install-memory-refusal.log"
          set +e
          STUB_NO_CREDENTIALS=true STUB_LIVE_AUTOPILOT=true \
            PATH="$RUNNER_TEMP/kube-agents-test-bin:$PATH" \
            ./install.sh --dry-run -y --gcp-project-id="ci-test-project" \
            --gke-cluster-name="ci-test-cluster" --gcp-region="us-central1" \
            --gke-cluster-mode="standard" --image-tag="$GITHUB_SHA" \
            > "$refusal_log" 2>&1
          refusal_status=$?
          set -e
          if [ "$refusal_status" -eq 0 ]; then
            echo "an adoption run that could not ask the cluster generated tfvars anyway:" >&2
            cat "$refusal_log" >&2
            exit 1
          fi
          grep -q "Cannot tell whether this cluster runs the Hindsight memory store" "$refusal_log"

          # And the way out the refusal names has to work, or it is a dead end:
          # stating the answer gets the same unreachable run through, and the
          # answer reaches the tfvars rather than the default.
          MEMORY=off STUB_NO_CREDENTIALS=true STUB_LIVE_AUTOPILOT=true \
            PATH="$RUNNER_TEMP/kube-agents-test-bin:$PATH" \
            ./install.sh --dry-run -y --gcp-project-id="ci-test-project" \
            --gke-cluster-name="ci-test-cluster" --gcp-region="us-central1" \
            --gke-cluster-mode="standard" --image-tag="$GITHUB_SHA"
          if ! grep -qE "^memory_provider[[:space:]]+= \"none\"\$" "$tfvars"; then
            echo "MEMORY=off did not reach terraform.tfvars:" >&2
            grep memory_provider "$tfvars" >&2
            exit 1
          fi

          # A dry run must not leave an install.env behind: it provisions
          # nothing, so it has no install to record.
          if [ -f install.env ]; then
            echo "--dry-run created install.env, which describes an install that was never made" >&2
            exit 1
          fi

      - name: Create Ephemeral Kind Kubernetes Cluster (Linux)
        if: runner.os == 'Linux'
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: kube-agents-ci

      - name: Validate Live Kind Kubernetes API Context
        if: runner.os == 'Linux'
        run: |
          kubectl get nodes
          kubectl cluster-info
