name: Staging Redeploy Integrations

on:
  push:
    tags:
      # staging_<ts>_<sha>, which scripts/release/common.sh's staging_tag_for_rc
      # derives from the validated rc_* candidate tag.
      - "staging_*"

# The payload here is a `helm upgrade` on the shared `kube-agents` release.
# Cancelling one mid-flight strands the release in pending-upgrade and every
# later deploy fails until someone rolls it back by hand, so a running deploy
# is never cancelled. A queued one has not reached the cluster and is safe to
# supersede.
#
# Keep this group one component wide. GitHub holds only a single run pending
# per group, so a group shared with the sibling redeploys would let them evict
# each other and silently drop a deploy. They contend on the release lock
# instead, which scripts/helm_upgrade_retry.sh waits out.
concurrency:
  group: staging-redeploy-integrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # github.sha on a tag push is the new value of the ref, and the promotion tags
  # are annotated, so it is the tag object's SHA rather than the commit's. The
  # deploy below checks it out. Peel it once here.
  resolve-commit:
    if: github.repository == 'gke-labs/kube-agents'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ steps.peel.outputs.commit_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Peel the promotion tag to its commit
        id: peel
        run: ./scripts/release/peel_tag_commit.sh

  call-deploy:
    needs: resolve-commit
    # A fork inherits the tag trigger but none of the deploy credentials, so a
    # staging_* tag pushed there would fail and mail the fork owner.
    if: github.repository == 'gke-labs/kube-agents'
    permissions:
      contents: read
      id-token: write
    # inherit, not an explicit mapping: the called workflow's jobs read
    # GH_APP_ID, an environment secret. A `uses:` job cannot declare an
    # environment, so mapping the secrets here would evaluate them in this job,
    # pass GH_APP_ID through empty, and silently skip the minter deploy.
    secrets: inherit
    uses: ./.github/workflows/reusable-deploy-integrations.yml # zizmor: ignore[secrets-inherit]
    with:
      target_environment: "staging"
      force_deploy: true
      checkout_sha: ${{ needs.resolve-commit.outputs.commit_sha }}
