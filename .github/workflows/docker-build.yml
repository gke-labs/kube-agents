name: Docker Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load tags
        run: cat tags.env >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # platforms: linux/amd64 on every deploy/docker/Dockerfile build: the images
      # deploy to amd64 GKE nodes, and the multi-arch bases otherwise resolve to
      # whatever the runner is (#560). Redundant on today's amd64 runners; load-bearing
      # the day the runner label changes.
      - name: Build Platform Agent
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: platform
          platforms: linux/amd64
          push: false
          tags: platform-agent:latest
          build-args: |
            HERMES_AGENT_TAG=${{ env.HERMES_AGENT_TAG }}

      # Runs the shared-state gate against the image just built. The `platform` layers are
      # already in the buildx cache from the step above, so this adds a COPY, a RUN and a
      # few seconds rather than a second build. A wrong decision here means one container
      # erasing another's plugin links on a shared volume, and the symptom surfaces far
      # away — as a worker exiting with "Unknown skill(s)" — so it is worth failing the PR
      # for. The host-side unit tests cannot reach it: see the stage comment in the
      # Dockerfile.
      - name: Verify entrypoint shared-state gate (in-image)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: entrypoint-gate-test
          platforms: linux/amd64
          push: false
          # load, unlike before: the step below re-runs this stage's check as a
          # container rather than as a build RUN, and needs the image in the daemon.
          load: true
          tags: entrypoint-gate-test:latest
          build-args: |
            HERMES_AGENT_TAG=${{ env.HERMES_AGENT_TAG }}

      # The same check again, against the rootfs the operator actually gives the pod.
      # The RUN above cannot cover this: a build layer is writable by definition, so it
      # proves the entrypoint works but says nothing about whether it needs the write.
      # readOnlyRootFilesystem turns any such write into EROFS at container start, and
      # the entrypoint runs a script this repo does not own (upstream's stage2-hook.sh),
      # so "it only writes under $HERMES_HOME and /tmp" has to be tested rather than read
      # off the source. Cheap, because the image is already in the daemon from the load.
      #
      # --tmpfs stands in for the two writable mounts the Deployment provides: the data
      # PVC at $PLATFORM_AGENT_HOME, which the check already relocates under /tmp, and the
      # tmp-scratch emptyDir. size=2g matches that volume's sizeLimit, so a case that
      # outgrows the real volume fails here too; exec because the check's HA-handoff case
      # runs a wrapper script from the scratch tree, and Docker's default tmpfs is noexec.
      - name: Verify entrypoint under a read-only root filesystem
        run: |
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,exec,mode=1777,size=2g \
            --entrypoint /usr/local/bin/entrypoint-gate-check \
            entrypoint-gate-test:latest

      # load: true, like the gate-test build above and unlike the first one, so the
      # next step has an image to inspect. It costs a transfer from the buildx cache
      # into the daemon, which is why only the two builds with a step that runs the
      # image pay for it.
      - name: Build Credential Sidecar
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: credential-proxy
          platforms: linux/amd64
          push: false
          load: true
          tags: credential-proxy:latest
          build-args: |
            HERMES_AGENT_TAG=${{ env.HERMES_AGENT_TAG }}

      # The step above cannot catch this and neither can the GHCR publish: both
      # build with buildx, which has no layer-depth limit. Cloud Build uses the
      # classic Docker daemon, whose overlay2 driver stops at 128 -- so without
      # this check an over-budget image is discovered on main, after merge, as a
      # failed publish to Artifact Registry (#658).
      - name: Check image layer budget
        run: python3 scripts/check_image_layers.py --image credential-proxy:latest

      - name: Build Replay Proxy
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: examples/inference-replay/replay-proxy
          push: false
          tags: replay-proxy:latest
