name: "Shared: Deploy Environment"

permissions:
  contents: read

on:
  #checkov:skip=CKV_GHA_7:Standalone launch requires the candidate tag or commit SHA and the environment to build
  workflow_dispatch:
    inputs:
      github_environment:
        description: "GitHub environment supplying the GCP project, region and cluster"
        required: true
        type: choice
        options:
          - "rc"
          - "nightly"
          # autopush and staging are here as the escape hatch for when an
          # in-place reconcile cannot converge — #1117's Option B. They are
          # long-lived and this workflow DESTROYS what it finds, so they are
          # dispatch-only and guarded by confirm_destroy below.
          # `Shared: Reconcile Environment` is the routine way to move these
          # two, and the nightly runs it.
          - "autopush"
          - "staging"
      rc_tag:
        description: "Release Candidate Tag or Commit SHA (Mandatory for standalone launch)"
        required: true
        type: string
      confirm_destroy:
        description: "For autopush/staging only: type the environment name to confirm the teardown"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      # The GitHub Actions environment, and nothing else: it renders straight
      # into the job's `environment:` key below, and its values are `rc` and
      # `nightly`. Named for what it is rather than `target_environment`, because
      # the E2E workflows select a set of test files with a value drawn from the
      # same two words — that input is `test_suite` for the same reason.
      #
      # required, with NO default. A `default: rc` would mean a nightly caller
      # that omits the input silently tears down and rebuilds the RC
      # environment, which is the one failure mode worth making impossible. The
      # cost is an explicit argument at each call site.
      github_environment:
        description: "GitHub environment supplying the GCP project, region and cluster"
        required: true
        type: string
      rc_tag:
        description: "Release Candidate Tag or Commit SHA"
        required: true
        type: string
    secrets:
      GEMINI_API_KEY:
        description: "Gemini API Key"
        required: true

jobs:
  deploy-environment:
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    # One lock per environment, derived from the same input. `rc` still yields
    # `rc-environment`, so the RC pipeline's serialisation is unchanged, and the
    # nightly pipeline takes `nightly-environment` instead of contending for a
    # cluster it does not deploy to.
    concurrency:
      group: ${{ inputs.github_environment }}-environment
      cancel-in-progress: false
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      CLOUDSDK_PYTHON: "/usr/bin/python3"

    steps:
      # First, before the checkout, because everything after it costs minutes
      # and this is a typo check.
      #
      # `rc` and `nightly` exist to be destroyed and are not gated. The other
      # two are what agents live-test against and what the demo installs run
      # on; a teardown there takes the cluster, every AgentPlugin and Secret on
      # it, and any evidence somebody was midway through gathering. Nothing
      # about picking an environment from a dropdown communicates that, so the
      # confirmation is a second, deliberate act.
      - name: Confirm a long-lived environment teardown
        # Keyed on the input, not on github.event_name. Inside a called
        # workflow that context reports the ORIGINATING event, so a future
        # workflow_call from a scheduled parent that targeted a long-lived
        # environment would skip both guards and destroy it unannounced. No
        # caller passes these two today; the gate is what keeps that true.
        if: inputs.github_environment == 'autopush' || inputs.github_environment == 'staging'
        env:
          TARGET: ${{ inputs.github_environment }}
          CONFIRM: ${{ inputs.confirm_destroy }}
        run: |
          if [ "${CONFIRM}" != "${TARGET}" ]; then
            echo "::error title=Teardown not confirmed::This DESTROYS the '${TARGET}' cluster and everything on it, including any live validation in progress. Re-run with confirm_destroy set to '${TARGET}'. To move '${TARGET}' without destroying it, run 'Shared: Reconcile Environment' with mode: apply instead."
            exit 1
          fi
          echo "==> Teardown of '${TARGET}' confirmed."

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve Commit SHA from Release Tag
        id: resolve_target
        env:
          RC_TAG: ${{ inputs.rc_tag }}
          GH_ORG: ${{ vars.GH_ORG }}
          GH_REPO: ${{ vars.GH_REPO }}
        run: ./scripts/release/resolve_rc_tag.sh

      # This replaces the workspace with the candidate's tree, so every script
      # below runs the candidate's copy rather than this workflow's. The workflow
      # YAML itself still comes from the caller's ref — a local `uses:` resolves
      # there — which is why the provisioning step has to cope with a candidate
      # whose scripts predate a rename.
      - name: Checkout repository at exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve_target.outputs.commit_sha }}
          persist-credentials: false

      - name: Validate & Log Deployment Configuration Summary
        env:
          RC_TAG: ${{ steps.resolve_target.outputs.rc_tag }}
          COMMIT_SHA: ${{ steps.resolve_target.outputs.commit_sha }}
          IMAGE_TAG: ${{ steps.resolve_target.outputs.commit_sha }}
          REGISTRY_PREFIX: ${{ vars.REGISTRY_PREFIX }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CHAT_ENABLED: ${{ vars.GOOGLE_CHAT_ENABLED }}
          GOOGLE_CHAT_MODE: ${{ vars.GOOGLE_CHAT_MODE }}
          CHAT_TOPIC_NAME: ${{ vars.CHAT_TOPIC_NAME }}
          MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
          MODEL_DEFAULT_NAME: ${{ vars.MODEL_DEFAULT_NAME }}
          ENABLE_GVISOR: ${{ vars.ENABLE_GVISOR }}
          ENABLE_GKE_BACKUP_PLAN: ${{ vars.ENABLE_GKE_BACKUP_PLAN }}
          PLATFORM_AGENT_PERMISSION_SET: ${{ vars.PLATFORM_AGENT_PERMISSION_SET }}
          MEMORY_PROVIDER: ${{ vars.MEMORY_PROVIDER }}
          USER_PROFILE_ENABLED: ${{ vars.USER_PROFILE_ENABLED }}
          ENABLE_PUBSUB_PLATFORM: ${{ vars.ENABLE_PUBSUB_PLATFORM }}
          ENABLE_STOCKOUT_INVESTIGATOR: ${{ vars.ENABLE_STOCKOUT_INVESTIGATOR }}
        run: ./scripts/release/validate_and_log_deploy_summary.sh

      - name: Authenticate to GCP via Workload Identity Federation (WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "579.0.0"
          install_components: "beta,gke-gcloud-auth-plugin"

      # A teardown that lands mid-validation destroys somebody's evidence and
      # the ConfigMap recording that they held the lease, in the same breath —
      # the lease lives in the namespace on the cluster this is about to remove.
      # Refusing rather than deferring is right for a manual act: name who is on
      # the cluster and let the operator decide.
      #
      # Only the long-lived environments. `rc` and `nightly` are rebuilt every
      # pipeline run and nobody live-tests against them.
      - name: Refuse while somebody is live-testing
        if: inputs.github_environment == 'autopush' || inputs.github_environment == 'staging'
        env:
          TARGET: ${{ inputs.github_environment }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
          AGENT_NAMESPACE: ${{ vars.AGENT_NAMESPACE }}
          NAMESPACE: ${{ vars.NAMESPACE }}
        run: |
          set -euo pipefail
          # The workspace here is the CANDIDATE's tree (see the checkout step
          # above), and render_install_env.sh only exists from the commit that
          # added it. Every rc_*_validated tag older than that resolves to a
          # tree without it, so say which of the two things went wrong rather
          # than letting `No such file or directory` stand for both.
          #
          # No `if [ -f ]` fallthrough: skipping the check and carrying on to
          # the teardown is the silent half of this, and the whole point of the
          # step is to refuse. Pass a post-merge commit SHA as rc_tag — the
          # input takes one — to rebuild from a tree that has the script.
          if [ ! -f ./scripts/release/render_install_env.sh ]; then
            echo "::error title=This candidate predates the live-test lease check::The commit being deployed has no scripts/release/render_install_env.sh, so this job cannot name the install to ask whether its lease is held — and it will not tear '${TARGET}' down without asking. Re-run with rc_tag set to a commit SHA at or after the one that added that script."
            exit 1
          fi
          # Not --strict: this only has to name the install, and a missing
          # install setting is the reconcile path's problem, not the lease's.
          ./scripts/release/render_install_env.sh install.env
          gcloud container clusters get-credentials "${GKE_CLUSTER_NAME}" \
            --location "${GCP_REGION}" --project "${GCP_PROJECT_ID}"
          status="$(python3 scripts/live_test_lease.py status --json)"
          echo "${status}"
          # Proceed only on a positive "free". `status --json` reports
          # `unreachable` as its own state precisely because a cluster that
          # could not be asked has not answered "no" — and refusing to grep for
          # "held" is what keeps a transient API-server error from reading as
          # an idle cluster and destroying somebody's live validation.
          if ! printf '%s' "${status}" | grep -q '"state": "free"'; then
            echo "::error title=The live-test lease is held, or could not be read::Refusing to tear down '${TARGET}'. A held lease means somebody is live-testing against it and a teardown destroys their evidence mid-run; an unreadable one means this job cannot tell. Ask the holder to release it (scripts/live_test_lease.py release), wait for it to expire, or fix the cluster access this job reported above."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "k8s-operator/go.mod"
          cache-dependency-path: "k8s-operator/go.sum"

      # The teardown half of the step below needs this. install.sh auto-installs
      # terraform, but only once it is already running — uninstall.sh installs
      # nothing and refuses without it, so before this step existed the RC
      # teardown failed on every run and the pipeline reinstalled over the
      # surviving environment.
      #
      # terraform_wrapper: false is load-bearing. The wrapper replaces terraform
      # with a script that re-prints stdout and stderr for its outputs, and
      # lifecycle.sh reads terraform's stdout directly — `terraform console` for
      # resolved variables and `terraform state list` for what exists. Left on,
      # those captures pick up the wrapper's copy as well as the real output.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Provision Environment in GCP
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
          IMAGE_TAG: ${{ steps.resolve_target.outputs.commit_sha }}
          REGISTRY_PREFIX: ${{ vars.REGISTRY_PREFIX }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
          GOOGLE_CHAT_ENABLED: ${{ vars.GOOGLE_CHAT_ENABLED }}
          GOOGLE_CHAT_MODE: ${{ vars.GOOGLE_CHAT_MODE }}
          CHAT_TOPIC_NAME: ${{ vars.CHAT_TOPIC_NAME }}
          MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
          MODEL_DEFAULT_NAME: ${{ vars.MODEL_DEFAULT_NAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENABLE_GVISOR: ${{ vars.ENABLE_GVISOR }}
          ENABLE_GKE_BACKUP_PLAN: ${{ vars.ENABLE_GKE_BACKUP_PLAN }}
          PLATFORM_AGENT_PERMISSION_SET: ${{ vars.PLATFORM_AGENT_PERMISSION_SET }}
          MEMORY_PROVIDER: ${{ vars.MEMORY_PROVIDER }}
          USER_PROFILE_ENABLED: ${{ vars.USER_PROFILE_ENABLED }}
          ENABLE_PUBSUB_PLATFORM: ${{ vars.ENABLE_PUBSUB_PLATFORM }}
          ENABLE_STOCKOUT_INVESTIGATOR: ${{ vars.ENABLE_STOCKOUT_INVESTIGATOR }}
          # The GitOps repository the agent targets, and the one the token minter
          # scopes its tokens to. Deliberately NOT vars.GH_ORG/vars.GH_REPO: that
          # pair names the RELEASE repository, so reusing it here would scope a
          # live GitHub App token at this repository. GITOPS_REPO is bare —
          # installer_common.sh composes "${GITOPS_ORG}/${GITOPS_REPO}".
          #
          # The installer's own names, passed straight through. Until #1026 this
          # read `GITHUB_ORG: ${{ vars.GITOPS_ORG }}`, a mapping that looked like
          # a mistake and invited someone to "fix" it to vars.GH_ORG — which is
          # precisely how a live App token gets scoped at the release repository.
          #
          # These three and GITHUB_APP_ID must all be set before the minter is
          # provisioned at all (write_tfvars_from_state's three-way guard); with
          # any empty, the install is byte-identical to one without a minter. The
          # pair must also match what the E2E suite probes, since a token minted
          # for one repository does not authenticate against another — which is
          # why e2e-run.yml reads the same two variables rather than
          # tests/e2e/e2e_config.yaml pinning them. That workflow still passes
          # them as GITHUB_ORG/GITHUB_REPO, because those are the E2E suite's own
          # variable names for the repository a test acts on.
          GITOPS_ORG: ${{ vars.GITOPS_ORG }}
          GITOPS_REPO: ${{ vars.GITOPS_REPO }}
          # The old names as well, for the same reason as the
          # provision_rc_environment.sh fallback in the run block below: this
          # step executes the checked-out candidate's scripts, and every
          # candidate predating the GITOPS_* rename reads GITHUB_ORG/GITHUB_REPO
          # — with those empty and GITHUB_APP_ID set, its half-configured-minter
          # guard refuses the deploy outright. On a post-rename tree GITOPS_*
          # wins and these two are ignored. Delete them alongside that fallback.
          GITHUB_ORG: ${{ vars.GITOPS_ORG }}
          GITHUB_REPO: ${{ vars.GITOPS_REPO }}
          GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
          # Optional, and the lesser of the two routes. Importing the App's private
          # key into the minter's KMS key by hand is the better one: the key ring
          # survives every teardown, so the import is a one-off and the signing
          # material never enters Actions. This is the bootstrap path — set it and
          # provision_environment.sh writes it to a private temporary file,
          # because install.sh takes a path (GITHUB_PEM_PATH) and never a value.
          # Either way the import is skipped once the key has an enabled version.
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # Unset (the default) reports a failed teardown as an annotation and a
          # job-summary entry and provisions on top of whatever survived; truthy
          # makes it a hard stop. Whether a candidate validated against stale
          # state or a blocked release is the worse outcome changes week to week,
          # so it is a variable rather than a constant.
          #
          # Set it on each GitHub environment this workflow is called with,
          # alongside GCP_PROJECT_ID and the rest. `vars` resolves environment
          # over repository over organization, so a repository-level one also
          # works and is the easier of the two to set by accident.
          TEARDOWN_STRICT: ${{ vars.TEARDOWN_STRICT }}
          # Everything below is what `render_install_env.sh`'s MAPPING carries
          # and this step used not to. Both paths read the same GitHub
          # environment, so a setting missing here is not "defaulted on the
          # rebuild" — it is a rebuild that installs something different from
          # what the reconcile would have applied, with nothing in the run
          # saying so.
          #
          # ALLOWED_USERS is why this is not cosmetic. install.sh seeds
          # PARAM_ALLOWED_USERS from the environment and an absent list is not
          # "no opinion": it renders `google_chat_allowed_users = []`, the
          # chart omits the key, and the operator reads an absent list as
          # allow-all. A rebuild of a long-lived environment without it opens
          # the install to the whole domain, which is the one omission here
          # that WIDENS access rather than removing a feature.
          #
          # No flags for any of these: install.sh reads them from the
          # environment, the same mechanism the GITOPS_* pair above already
          # relies on.
          ALLOWED_USERS: ${{ vars.ALLOWED_USERS }}
          # Not install settings — the empty allowlist is already what produces
          # allow-all. Their only job is to let an operator SAY that the open
          # allowlist is intended, which is what the guard in
          # provision_environment.sh asks for. Same pair, same purpose, as in
          # reconcile-environment.yml.
          GOOGLE_CHAT_ALLOW_ALL_USERS: ${{ vars.GOOGLE_CHAT_ALLOW_ALL_USERS }}
          SLACK_ALLOW_ALL_USERS: ${{ vars.SLACK_ALLOW_ALL_USERS }}
          # Turns that guard on. `rc` and `nightly` are torn down and rebuilt
          # every run and carry no allowlist by design, so they stay exempt —
          # the same long-lived/ephemeral split `render_install_env.sh` draws
          # with --strict.
          LONG_LIVED_ENVIRONMENT: ${{ (inputs.github_environment == 'autopush' || inputs.github_environment == 'staging') && 'true' || '' }}
          SLACK_ENABLED: ${{ vars.SLACK_ENABLED }}
          SLACK_ALLOWED_USERS: ${{ vars.SLACK_ALLOWED_USERS }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
          SLACK_HOME_CHANNEL: ${{ vars.SLACK_HOME_CHANNEL }}
          SLACK_HOME_CHANNEL_NAME: ${{ vars.SLACK_HOME_CHANNEL_NAME }}
          CLUSTER_MODE: ${{ vars.CLUSTER_MODE }}
          VERTEX_PROJECT_ID: ${{ vars.VERTEX_PROJECT_ID }}
          VERTEX_LOCATION: ${{ vars.VERTEX_LOCATION }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHAT_SUB_NAME: ${{ vars.CHAT_SUB_NAME }}
          KMS_KEYRING: ${{ vars.KMS_KEYRING }}
          KMS_KEY: ${{ vars.KMS_KEY }}
          PLATFORM_AGENT_CUSTOM_ROLES: ${{ vars.PLATFORM_AGENT_CUSTOM_ROLES }}
          HERMES_DASHBOARD_ENABLED: ${{ vars.HERMES_DASHBOARD_ENABLED }}
          THIRD_PARTY_REGISTRY_PREFIX: ${{ vars.THIRD_PARTY_REGISTRY_PREFIX }}
          # The installer's own spelling, from the CI-side name — the same
          # translation render_install_env.sh's `NAMESPACE:AGENT_NAMESPACE`
          # mapping makes. The bare NAMESPACE fallback is staging's spelling.
          NAMESPACE: ${{ vars.AGENT_NAMESPACE || vars.NAMESPACE }}
        # provision_environment.sh is this change's name for what candidates up
        # to and including rc_2608310656_cf038a2_validated carry as
        # provision_rc_environment.sh. get_latest_validated_rc_tag has no recency
        # window, so the nightly pipeline resolves one of those until the RC
        # pipeline validates a post-merge commit — and calling the new name in
        # that tree aborts with "No such file or directory". The old script reads
        # strictness under the old variable name only.
        #
        # Delete this fallback once no rc_*_validated tag predates the rename.
        run: |
          if [ -f ./scripts/release/provision_environment.sh ]; then
            ./scripts/release/provision_environment.sh
          else
            echo "==> Candidate predates the provision_environment.sh rename; running provision_rc_environment.sh."
            RC_TEARDOWN_STRICT="${TEARDOWN_STRICT}" ./scripts/release/provision_rc_environment.sh
          fi
