name: "Shared: Deploy Environment"

permissions:
  contents: read

on:
  #checkov:skip=CKV_GHA_7:Standalone launch requires the candidate tag or commit SHA and the environment to build
  workflow_dispatch:
    inputs:
      github_environment:
        description: "GitHub environment supplying the GCP project, region and cluster"
        required: true
        type: choice
        options:
          - "rc"
          - "nightly"
          # autopush, autopush-next and staging are here as the escape hatch
          # for when an in-place reconcile cannot converge — #1117's Option B.
          # They are long-lived and this workflow DESTROYS what it finds, so
          # they are dispatch-only and guarded by confirm_destroy below.
          # `Shared: Reconcile Environment` is the routine way to move them.
          #
          # autopush-next is refused `mode: next` here like the other two: a
          # long-lived environment's mode is its PLATFORM_AGENT_MODE variable,
          # applied by the reconcile path, not this input. A rebuild installs
          # today and the next reconcile moves it to the declared mode.
          - "autopush"
          - "autopush-next"
          - "staging"
      rc_tag:
        description: "Release Candidate Tag or Commit SHA (Mandatory for standalone launch)"
        required: true
        type: string
      confirm_destroy:
        description: "For autopush/autopush-next/staging only: type the environment name to confirm the teardown"
        required: false
        default: ""
        type: string
      mode:
        description: "The PlatformAgent's spec.mode to install: today, or next (the unsupported A2A stack)"
        required: false
        default: "today"
        type: choice
        options:
          - "today"
          - "next"
  workflow_call:
    inputs:
      # The GitHub Actions environment, and nothing else: it renders straight
      # into the job's `environment:` key below, and its values are `rc` and
      # `nightly`. Named for what it is rather than `target_environment`, because
      # the E2E workflows select a set of test files with a value drawn from the
      # same two words — that input is `test_suite` for the same reason.
      #
      # required, with NO default. A `default: rc` would mean a nightly caller
      # that omits the input silently tears down and rebuilds the RC
      # environment, which is the one failure mode worth making impossible. The
      # cost is an explicit argument at each call site.
      github_environment:
        description: "GitHub environment supplying the GCP project, region and cluster"
        required: true
        type: string
      rc_tag:
        description: "Release Candidate Tag or Commit SHA"
        required: true
        type: string
      # The PlatformAgent's spec.mode, `today` or `next`. Defaulted, unlike the
      # two above, because `today` is what every caller installed before the
      # input existed and the default changes nothing: the provisioning script
      # sees no PLATFORM_AGENT_MODE at all. `next` reaches install.sh, which
      # renders it, and the script then waits for the stack it renders
      # (platform_agent_mode.sh).
      mode:
        description: "The PlatformAgent's spec.mode to install: today or next"
        required: false
        default: "today"
        type: string
    secrets:
      GEMINI_API_KEY:
        description: "Gemini API Key"
        required: true

jobs:
  deploy-environment:
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    # One lock per environment, derived from the same input. `rc` still yields
    # `rc-environment`, so the RC pipeline's serialisation is unchanged, and the
    # nightly pipeline takes `nightly-environment` instead of contending for a
    # cluster it does not deploy to.
    concurrency:
      group: ${{ inputs.github_environment }}-environment
      cancel-in-progress: false
    # `next` adds the mode switch's wait to the install's: the agent rolls
    # again, and Ready waits on the bus, the callout and the provisioning Job.
    # `today` keeps the 60 it always had.
    timeout-minutes: ${{ inputs.mode == 'next' && 90 || 60 }}
    permissions:
      contents: read
      id-token: write
    env:
      CLOUDSDK_PYTHON: "/usr/bin/python3"

    steps:
      # First, before the checkout, because everything after it costs minutes
      # and this is a typo check.
      #
      # `rc` and `nightly` exist to be destroyed and are not gated. The
      # others are what agents live-test against and what the demo installs run
      # on; a teardown there takes the cluster, every AgentPlugin and Secret on
      # it, and any evidence somebody was midway through gathering. Nothing
      # about picking an environment from a dropdown communicates that, so the
      # confirmation is a second, deliberate act.
      - name: Confirm a long-lived environment teardown
        # Keyed on the input, not on github.event_name. Inside a called
        # workflow that context reports the ORIGINATING event, so a future
        # workflow_call from a scheduled parent that targeted a long-lived
        # environment would skip both guards and destroy it unannounced. No
        # caller passes these today; the gate is what keeps that true.
        if: inputs.github_environment == 'autopush' || inputs.github_environment == 'autopush-next' || inputs.github_environment == 'staging'
        env:
          TARGET: ${{ inputs.github_environment }}
          CONFIRM: ${{ inputs.confirm_destroy }}
        run: |
          if [ "${CONFIRM}" != "${TARGET}" ]; then
            echo "::error title=Teardown not confirmed::This DESTROYS the '${TARGET}' cluster and everything on it, including any live validation in progress. Re-run with confirm_destroy set to '${TARGET}'. To move '${TARGET}' without destroying it, run 'Shared: Reconcile Environment' with mode: apply instead."
            exit 1
          fi
          echo "==> Teardown of '${TARGET}' confirmed."

      # Also before the checkout, and for the same reason. A `workflow_call`
      # input is a free string, so this is where a caller's typo stops; the
      # dispatch form offers the two values only.
      #
      # Unconditional, and matched in shell. A GitHub expression compares
      # strings case-insensitively, so an `if:` on the input would skip this
      # for `TODAY` and let it reach the candidate's exact-match check only
      # after the checkout, auth and setup. Exactly '', `today` and `next`
      # pass; '' is today, as it is to the scripts. The steps only `next`
      # needs read this step's `next` output rather than the input.
      #
      # `next` is refused on autopush, autopush-next and staging, matched
      # case-insensitively like the two guards above. A long-lived
      # environment's mode is its PLATFORM_AGENT_MODE variable, which the
      # reconcile path renders into the chart; this input is not consulted
      # for it, so a rebuild installs today and the next reconcile moves the
      # environment to its declared mode. provision_environment.sh refuses it
      # as well.
      - name: Check the PlatformAgent mode
        id: mode
        env:
          MODE: ${{ inputs.mode }}
          TARGET: ${{ inputs.github_environment }}
        run: |
          case "${MODE}" in
            "" | today)
              echo "next=false" >> "${GITHUB_OUTPUT}"
              exit 0
              ;;
            next) ;;
            *)
              echo "::error title=Not a PlatformAgent mode::mode is '${MODE}'. The PlatformAgent's spec.mode takes exactly today or next, lowercase; pass one of those, or leave the input unset for today."
              exit 1
              ;;
          esac
          case "$(printf '%s' "${TARGET}" | tr '[:upper:]' '[:lower:]')" in
            autopush | autopush-next | staging)
              echo "::error title=spec.mode next is for the ephemeral environments::Refusing mode next on '${TARGET}', a long-lived environment: its mode is its PLATFORM_AGENT_MODE variable, applied by the reconcile path, not this input. A rebuild installs today and the next reconcile moves it to the declared mode. Use rc or nightly for next."
              exit 1
              ;;
          esac
          echo "next=true" >> "${GITHUB_OUTPUT}"
          echo "==> Installing with spec.mode: ${MODE}."

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve Commit SHA from Release Tag
        id: resolve_target
        env:
          RC_TAG: ${{ inputs.rc_tag }}
          GH_ORG: ${{ vars.GH_ORG }}
          GH_REPO: ${{ vars.GH_REPO }}
        run: ./scripts/release/resolve_rc_tag.sh

      # This replaces the workspace with the candidate's tree, so every script
      # below runs the candidate's copy rather than this workflow's. The workflow
      # YAML itself still comes from the caller's ref — a local `uses:` resolves
      # there — which is why the provisioning step has to cope with a candidate
      # whose scripts predate a rename.
      - name: Checkout repository at exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve_target.outputs.commit_sha }}
          persist-credentials: false

      # The scripts below are the candidate's, and a candidate older than
      # platform_agent_mode.sh ignores PLATFORM_AGENT_MODE: it would install
      # `today` and the run would report `next` validated. Refused here, before
      # the teardown, rather than discovered from the tests. Skipped unless
      # the mode check passed `next`; every candidate installs today.
      - name: Confirm the candidate can install the mode
        if: steps.mode.outputs.next == 'true'
        env:
          MODE: ${{ inputs.mode }}
        run: |
          if [ ! -f scripts/release/platform_agent_mode.sh ]; then
            echo "::error title=This candidate predates the mode input::The commit being deployed has no scripts/release/platform_agent_mode.sh, so its provisioning script would ignore mode '${MODE}' and install today. Re-run with rc_tag set to a commit at or after the one that added it, or with mode today."
            exit 1
          fi

      - name: Validate & Log Deployment Configuration Summary
        env:
          RC_TAG: ${{ steps.resolve_target.outputs.rc_tag }}
          COMMIT_SHA: ${{ steps.resolve_target.outputs.commit_sha }}
          IMAGE_TAG: ${{ steps.resolve_target.outputs.commit_sha }}
          REGISTRY_PREFIX: ${{ vars.REGISTRY_PREFIX }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CHAT_ENABLED: ${{ vars.GOOGLE_CHAT_ENABLED }}
          GOOGLE_CHAT_MODE: ${{ vars.GOOGLE_CHAT_MODE }}
          CHAT_TOPIC_NAME: ${{ vars.CHAT_TOPIC_NAME }}
          MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
          MODEL_DEFAULT_NAME: ${{ vars.MODEL_DEFAULT_NAME }}
          ENABLE_GVISOR: ${{ vars.ENABLE_GVISOR }}
          ENABLE_GKE_BACKUP_PLAN: ${{ vars.ENABLE_GKE_BACKUP_PLAN }}
          PLATFORM_AGENT_PERMISSION_SET: ${{ vars.PLATFORM_AGENT_PERMISSION_SET }}
          MEMORY_PROVIDER: ${{ vars.MEMORY_PROVIDER }}
          USER_PROFILE_ENABLED: ${{ vars.USER_PROFILE_ENABLED }}
          ENABLE_PUBSUB_PLATFORM: ${{ vars.ENABLE_PUBSUB_PLATFORM }}
          ENABLE_STOCKOUT_INVESTIGATOR: ${{ vars.ENABLE_STOCKOUT_INVESTIGATOR }}
          ENABLE_DRIFT_DETECTOR: ${{ vars.ENABLE_DRIFT_DETECTOR }}
        run: ./scripts/release/validate_and_log_deploy_summary.sh

      - name: Authenticate to GCP via Workload Identity Federation (WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "579.0.0"
          install_components: "beta,gke-gcloud-auth-plugin"

      # A teardown that lands mid-validation destroys somebody's evidence and
      # the ConfigMap recording that they held the lease, in the same breath —
      # the lease lives in the namespace on the cluster this is about to remove.
      # Refusing rather than deferring is right for a manual act: name who is on
      # the cluster and let the operator decide.
      #
      # Only the long-lived environments. `rc` and `nightly` are rebuilt every
      # pipeline run and nobody live-tests against them.
      - name: Refuse while somebody is live-testing
        if: inputs.github_environment == 'autopush' || inputs.github_environment == 'autopush-next' || inputs.github_environment == 'staging'
        env:
          # Configured in GitHub Environment Variables (vars.KUBE_AGENTS_KUBECTL_TIMEOUT).
          # Overrides the default 8s kubectl timeout in live_test_lease.py to accommodate
          # cold runner gke-gcloud-auth-plugin WIF token exchange and TLS handshake to GKE (#1465).
          KUBE_AGENTS_KUBECTL_TIMEOUT: ${{ vars.KUBE_AGENTS_KUBECTL_TIMEOUT }}
          TARGET: ${{ inputs.github_environment }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
          NAMESPACE: ${{ vars.NAMESPACE }}
          # No PLATFORM_AGENT_MODE here. This step runs only on the long-lived
          # environments, where the mode check refuses `next`, so the only values
          # that could reach it render no key anyway. The reconcile path
          # (reconcile-environment.yml) is the one that carries the key into a
          # long-lived environment's install.env, from vars.PLATFORM_AGENT_MODE.
        run: |
          set -euo pipefail
          # The workspace here is the CANDIDATE's tree (see the checkout step
          # above), and render_install_env.sh only exists from the commit that
          # added it. Every rc_*_validated tag older than that resolves to a
          # tree without it, so say which of the two things went wrong rather
          # than letting `No such file or directory` stand for both.
          #
          # No `if [ -f ]` fallthrough: skipping the check and carrying on to
          # the teardown is the silent half of this, and the whole point of the
          # step is to refuse. Pass a post-merge commit SHA as rc_tag — the
          # input takes one — to rebuild from a tree that has the script.
          if [ ! -f ./scripts/release/render_install_env.sh ]; then
            echo "::error title=This candidate predates the live-test lease check::The commit being deployed has no scripts/release/render_install_env.sh, so this job cannot name the install to ask whether its lease is held — and it will not tear '${TARGET}' down without asking. Re-run with rc_tag set to a commit SHA at or after the one that added that script."
            exit 1
          fi
          # Not --strict: this only has to name the install, and a missing
          # install setting is the reconcile path's problem, not the lease's.
          ./scripts/release/render_install_env.sh install.env
          # The lease ConfigMap lives on the cluster this is about to destroy.
          # A project with no cluster yet has nothing to ask and nothing to
          # tear down: that is how a long-lived environment is first created,
          # and the install below builds it from nothing. Only a
          # genuine NOT_FOUND is that case (the same policy as the installer's
          # create-or-adopt decision; this step's match is its own, stricter
          # one, on gcloud's `code=404`). Any other failure to read the
          # cluster -- a 403, a network error -- still fails closed, because a
          # cluster that could not be read has not answered "absent". A
          # project whose Kubernetes Engine API is still disabled answers
          # SERVICE_DISABLED, which is named rather than read as a blind
          # teardown: the project setup script enables the API, and the
          # installer's own probe would refuse the same answer minutes later.
          #
          # NOT_FOUND alone is not enough. The teardown finds an install by
          # project and cluster name (uninstall.sh's resolve_state_location),
          # with no location in the question, so a wrong GCP_REGION variable
          # would 404 here while the install's state, and the live cluster it
          # describes, exist. Proceeding would destroy that cluster without
          # its lease ever having been read. So the same state object the
          # uninstaller probes, derived from the same defaults
          # (install.defaults.env; the object name is installer_common.sh's
          # TF_STATE_OBJECT; no KUBE_AGENTS_STATE_BUCKET or _PREFIX override
          # reaches this path), is read too, and what it records decides:
          #   - no state: a project nothing was ever applied to;
          #   - state that records no cluster: an earlier attempt that failed
          #     before the cluster existed, which the retry has to get past;
          #   - state that records THIS cluster (project and name, as the
          #     installer's tf_state_has_cluster matches it: state accretes
          #     across runs, and an entry naming another cluster is not
          #     ownership of this one) at this location: the cluster is gone,
          #     nothing can hold its lease, and the teardown's own stale-state
          #     path clears the rest;
          #   - state that records this cluster elsewhere: the coordinates
          #     are wrong, and the cluster is probably alive. Refuse;
          #   - state that records any other cluster, with or without this
          #     one: a destroy of that state takes every cluster in it. Refuse.
          # The absence pattern is a copy of GCS_OBJECT_ABSENT_PATTERN
          # (installer_common.sh), pinned by a test.
          if ! describe_err="$(gcloud container clusters describe "${GKE_CLUSTER_NAME}" \
                --location "${GCP_REGION}" --project "${GCP_PROJECT_ID}" \
                --format='value(name)' 2>&1 >/dev/null)"; then
            if printf '%s' "${describe_err}" | grep -Eq 'SERVICE_DISABLED|has not been used in project'; then
              echo "::error title=${TARGET}'s project has the Kubernetes Engine API disabled::gcloud could not describe '${GKE_CLUSTER_NAME}' in '${GCP_PROJECT_ID}' because container.googleapis.com is not enabled there, so whether a cluster exists is unknown. Enable it first (scripts/dev/setup-gcp-github-wif.sh does, as part of the project setup) and re-run. ${describe_err}"
              exit 1
            fi
            if ! printf '%s' "${describe_err}" | grep -Eq 'code=404|NOT_FOUND'; then
              echo "::error title=Could not read ${TARGET}'s cluster::gcloud could not describe '${GKE_CLUSTER_NAME}' in '${GCP_PROJECT_ID}', and the answer was not NOT_FOUND, so whether the cluster exists is unknown. Refusing to tear down blind. ${describe_err}"
              exit 1
            fi
            # shellcheck disable=SC1091
            . ./install.defaults.env
            if [ -z "${DEFAULT_TF_STATE_BUCKET_SUFFIX:-}" ] || [ -z "${DEFAULT_TF_STATE_PREFIX_ROOT:-}" ]; then
              echo "::error title=This candidate predates the state-location defaults::No cluster '${GKE_CLUSTER_NAME}' in '${GCP_PROJECT_ID}', and the commit being deployed has no DEFAULT_TF_STATE_BUCKET_SUFFIX or DEFAULT_TF_STATE_PREFIX_ROOT in install.defaults.env, so this job cannot name the install's Terraform state to check that nothing is here. Re-run with rc_tag set to a commit SHA at or after the one that added those defaults."
              exit 1
            fi
            state_object="gs://${GCP_PROJECT_ID}${DEFAULT_TF_STATE_BUCKET_SUFFIX}/${DEFAULT_TF_STATE_PREFIX_ROOT}/${GKE_CLUSTER_NAME}/default.tfstate"
            state_err_file="$(mktemp "${RUNNER_TEMP:-/tmp}/state-probe.XXXXXX")"
            trap 'rm -f "${state_err_file}"' EXIT
            state_rc=0
            state_json="$(gcloud storage cat "${state_object}" 2>"${state_err_file}")" || state_rc=$?
            if [ "${state_rc}" -ne 0 ]; then
              state_err="$(cat "${state_err_file}")"
              if ! printf '%s' "${state_err}" | grep -qiE 'matched no objects|NotFoundException|HTTPError 404|not found|does not exist'; then
                echo "::error title=Could not read ${TARGET}'s Terraform state::No cluster '${GKE_CLUSTER_NAME}' in '${GCP_PROJECT_ID}', and the state probe at ${state_object} failed for a reason other than absence, so whether an install exists is unknown. Refusing to tear down blind. ${state_err}"
                exit 1
              fi
              echo "::notice title=${TARGET} has no cluster yet::No cluster '${GKE_CLUSTER_NAME}' in '${GCP_PROJECT_ID}' and no Terraform state at ${state_object}, so there is no live-test lease to ask and nothing to tear down. The install builds it from nothing."
              exit 0
            fi
            # Prints one line: `none` (no cluster in the state), `other <names>`
            # (clusters in the state that are not this one, whether or not this
            # one is there too), or the locations the state records this
            # cluster at.
            if ! recorded="$(printf '%s' "${state_json}" | STATE_PROJECT="${GCP_PROJECT_ID}" STATE_CLUSTER="${GKE_CLUSTER_NAME}" python3 -c '
          import json, os, sys
          state = json.load(sys.stdin)
          want_project, want_name = os.environ["STATE_PROJECT"], os.environ["STATE_CLUSTER"]
          clusters = [inst.get("attributes") or {}
                      for res in state.get("resources", [])
                      if res.get("mode") == "managed" and res.get("type") == "google_container_cluster"
                      for inst in res.get("instances", [])]
          mine = [c for c in clusters
                  if c.get("name") == want_name and c.get("project", want_project) == want_project]
          others = sorted({c.get("name", "?") for c in clusters if c not in mine})
          if not clusters:
              print("none")
          elif others:
              print("other " + " ".join(others))
          else:
              print(" ".join(sorted({c.get("location", "") for c in mine} - {""})))
          ')"; then
              echo "::error title=Could not read ${TARGET}'s Terraform state::No cluster '${GKE_CLUSTER_NAME}' in '${GCP_PROJECT_ID}', and the object at ${state_object} could not be read as Terraform state, so whether an install exists is unknown. Refusing to tear down blind."
              exit 1
            fi
            case "${recorded}" in
              none)
                echo "::notice title=${TARGET} has no cluster yet::No cluster '${GKE_CLUSTER_NAME}' in '${GCP_PROJECT_ID}'. Terraform state at ${state_object} is from an earlier attempt and records no cluster, so there is no live-test lease to ask. The teardown clears what that attempt left and the install builds the rest."
                exit 0
                ;;
              "other "*)
                echo "::error title=${TARGET}'s Terraform state belongs to another cluster::No cluster '${GKE_CLUSTER_NAME}' in '${GCP_PROJECT_ID}', but the Terraform state at ${state_object} records a different cluster (${recorded#other }). A teardown would destroy that cluster without its lease having been read. Refusing; sort out whose state this is before rebuilding."
                exit 1
                ;;
              "${GCP_REGION}")
                echo "::notice title=${TARGET}'s cluster is gone::Terraform state at ${state_object} records cluster '${GKE_CLUSTER_NAME}' at '${GCP_REGION}', where there is none, so nothing can hold its live-test lease. The teardown clears the stale state and the install builds it again."
                exit 0
                ;;
              *)
                echo "::error title=${TARGET}'s cluster was not found but its install was::No cluster '${GKE_CLUSTER_NAME}' at location '${GCP_REGION}' in '${GCP_PROJECT_ID}', but Terraform state at ${state_object} records it at '${recorded}'. The coordinates do not match the install -- check GCP_REGION on the GitHub environment -- and a teardown would find the live cluster through its state without its lease having been read. Refusing."
                exit 1
                ;;
            esac
          fi
          gcloud container clusters get-credentials "${GKE_CLUSTER_NAME}" \
            --location "${GCP_REGION}" --project "${GCP_PROJECT_ID}"
          status="$(python3 scripts/live_test_lease.py status --json)"
          echo "${status}"
          # Proceed only on a positive "free". `status --json` reports
          # `unreachable` as its own state precisely because a cluster that
          # could not be asked has not answered "no" — and refusing to grep for
          # "held" is what keeps a transient API-server error from reading as
          # an idle cluster and destroying somebody's live validation.
          if ! printf '%s' "${status}" | grep -q '"state": "free"'; then
            echo "::error title=The live-test lease is held, or could not be read::Refusing to tear down '${TARGET}'. A held lease means somebody is live-testing against it and a teardown destroys their evidence mid-run; an unreadable one means this job cannot tell. Ask the holder to release it (scripts/live_test_lease.py release), wait for it to expire, or fix the cluster access this job reported above."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "k8s-operator/go.mod"
          cache-dependency-path: "k8s-operator/go.sum"

      # The teardown half of the step below needs this. install.sh auto-installs
      # terraform, but only once it is already running — uninstall.sh installs
      # nothing and refuses without it, so before this step existed the RC
      # teardown failed on every run and the pipeline reinstalled over the
      # surviving environment.
      #
      # terraform_wrapper: false is load-bearing. The wrapper replaces terraform
      # with a script that re-prints stdout and stderr for its outputs, and
      # lifecycle.sh reads terraform's stdout directly — `terraform console` for
      # resolved variables and `terraform state list` for what exists. Left on,
      # those captures pick up the wrapper's copy as well as the real output.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Provision Environment in GCP
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
          IMAGE_TAG: ${{ steps.resolve_target.outputs.commit_sha }}
          # The input, under the installer's name for it. The script clears it
          # for `today`, so uninstall.sh and install.sh inherit nothing new.
          PLATFORM_AGENT_MODE: ${{ inputs.mode }}
          REGISTRY_PREFIX: ${{ vars.REGISTRY_PREFIX }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
          GOOGLE_CHAT_ENABLED: ${{ vars.GOOGLE_CHAT_ENABLED }}
          GOOGLE_CHAT_MODE: ${{ vars.GOOGLE_CHAT_MODE }}
          GOOGLE_CHAT_HOME_CHANNEL: ${{ vars.GOOGLE_CHAT_HOME_CHANNEL }}
          CHAT_TOPIC_NAME: ${{ vars.CHAT_TOPIC_NAME }}
          MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
          MODEL_DEFAULT_NAME: ${{ vars.MODEL_DEFAULT_NAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENABLE_GVISOR: ${{ vars.ENABLE_GVISOR }}
          ENABLE_GKE_BACKUP_PLAN: ${{ vars.ENABLE_GKE_BACKUP_PLAN }}
          PLATFORM_AGENT_PERMISSION_SET: ${{ vars.PLATFORM_AGENT_PERMISSION_SET }}
          MEMORY_PROVIDER: ${{ vars.MEMORY_PROVIDER }}
          USER_PROFILE_ENABLED: ${{ vars.USER_PROFILE_ENABLED }}
          ENABLE_PUBSUB_PLATFORM: ${{ vars.ENABLE_PUBSUB_PLATFORM }}
          ENABLE_STOCKOUT_INVESTIGATOR: ${{ vars.ENABLE_STOCKOUT_INVESTIGATOR }}
          # Unset takes install.sh's default, which is on. Here so that a rebuilt
          # environment can decline it, matching what the reconcile path reads.
          ENABLE_DRIFT_DETECTOR: ${{ vars.ENABLE_DRIFT_DETECTOR }}
          # The GitOps repository the agent targets, and the one the token minter
          # scopes its tokens to. Deliberately NOT vars.GH_ORG/vars.GH_REPO: that
          # pair names the RELEASE repository, so reusing it here would scope a
          # live GitHub App token at this repository. GITOPS_REPO is bare —
          # installer_common.sh composes "${GITOPS_ORG}/${GITOPS_REPO}".
          #
          # The installer's own names, passed straight through. Until #1026 this
          # read `GITHUB_ORG: ${{ vars.GITOPS_ORG }}`, a mapping that looked like
          # a mistake and invited someone to "fix" it to vars.GH_ORG — which is
          # precisely how a live App token gets scoped at the release repository.
          #
          # These three and GITHUB_APP_ID must all be set before the minter is
          # provisioned at all (write_tfvars_from_state's three-way guard); with
          # any empty, the install is byte-identical to one without a minter. The
          # pair must also match what the E2E suite probes, since a token minted
          # for one repository does not authenticate against another — which is
          # why e2e-run.yml reads the same two variables rather than
          # tests/e2e/e2e_config.yaml pinning them. That workflow still passes
          # them as GITHUB_ORG/GITHUB_REPO, because those are the E2E suite's own
          # variable names for the repository a test acts on.
          GITOPS_ORG: ${{ vars.GITOPS_ORG }}
          GITOPS_REPO: ${{ vars.GITOPS_REPO }}
          # The old names as well, for the same reason as the
          # provision_rc_environment.sh fallback in the run block below: this
          # step executes the checked-out candidate's scripts, and every
          # candidate predating the GITOPS_* rename reads GITHUB_ORG/GITHUB_REPO
          # — with those empty and GITHUB_APP_ID set, its half-configured-minter
          # guard refuses the deploy outright. On a post-rename tree GITOPS_*
          # wins and these two are ignored. Delete them alongside that fallback.
          GITHUB_ORG: ${{ vars.GITOPS_ORG }}
          GITHUB_REPO: ${{ vars.GITOPS_REPO }}
          GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
          # Unset (the default) reports a failed teardown as an annotation and a
          # job-summary entry and provisions on top of whatever survived; truthy
          # makes it a hard stop. Whether a candidate validated against stale
          # state or a blocked release is the worse outcome changes week to week,
          # so it is a variable rather than a constant.
          #
          # Set it on each GitHub environment this workflow is called with,
          # alongside GCP_PROJECT_ID and the rest. `vars` resolves environment
          # over repository over organization, so a repository-level one also
          # works and is the easier of the two to set by accident.
          TEARDOWN_STRICT: ${{ vars.TEARDOWN_STRICT }}
          # Everything below is what `render_install_env.sh`'s MAPPING carries
          # and this step used not to. Both paths read the same GitHub
          # environment, so a setting missing here is not "defaulted on the
          # rebuild" — it is a rebuild that installs something different from
          # what the reconcile would have applied, with nothing in the run
          # saying so.
          #
          # ALLOWED_USERS is why this is not cosmetic. install.sh seeds
          # PARAM_ALLOWED_USERS from the environment and an absent list is not
          # "no opinion": it renders `google_chat_allowed_users = []`, the
          # chart omits the key, and the operator reads an absent list as
          # allow-all. A rebuild of a long-lived environment without it opens
          # the install to the whole domain, which is the one omission here
          # that WIDENS access rather than removing a feature.
          #
          # Most of these reach install.sh from the environment, the same
          # mechanism the GITOPS_* pair above already relies on. The exceptions
          # are the ones provision_environment.sh turns into flags before it
          # calls the installer: ALLOWED_USERS, NAMESPACE, CLUSTER_MODE and the
          # SLACK_* set. A flag beats whatever the rendered install.env says
          # (the chat flags excepted: install.sh refuses one that disagrees with
          # the rendered file, and the render this job makes carries no chat
          # key), which is why that script passes them that way -- so for
          # those, this block is the source and the flag is the route, not an
          # alternative to it.
          ALLOWED_USERS: ${{ vars.ALLOWED_USERS }}
          # Not install settings — the empty allowlist is already what produces
          # allow-all. Their only job is to let an operator SAY that the open
          # allowlist is intended, which is what the guard in
          # provision_environment.sh asks for. Same pair, same purpose, as in
          # reconcile-environment.yml.
          GOOGLE_CHAT_ALLOW_ALL_USERS: ${{ vars.GOOGLE_CHAT_ALLOW_ALL_USERS }}
          SLACK_ALLOW_ALL_USERS: ${{ vars.SLACK_ALLOW_ALL_USERS }}
          # Turns that guard on. `rc` and `nightly` are torn down and rebuilt
          # every run and carry no allowlist by design, so they stay exempt —
          # the same long-lived/ephemeral split `render_install_env.sh` draws
          # with --strict.
          LONG_LIVED_ENVIRONMENT: ${{ (inputs.github_environment == 'autopush' || inputs.github_environment == 'autopush-next' || inputs.github_environment == 'staging') && 'true' || '' }}
          SLACK_ENABLED: ${{ vars.SLACK_ENABLED }}
          SLACK_ALLOWED_USERS: ${{ vars.SLACK_ALLOWED_USERS }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
          SLACK_HOME_CHANNEL: ${{ vars.SLACK_HOME_CHANNEL }}
          SLACK_HOME_CHANNEL_NAME: ${{ vars.SLACK_HOME_CHANNEL_NAME }}
          CLUSTER_MODE: ${{ vars.CLUSTER_MODE }}
          VERTEX_PROJECT_ID: ${{ vars.VERTEX_PROJECT_ID }}
          VERTEX_LOCATION: ${{ vars.VERTEX_LOCATION }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHAT_SUB_NAME: ${{ vars.CHAT_SUB_NAME }}
          KMS_KEYRING: ${{ vars.KMS_KEYRING }}
          KMS_KEY: ${{ vars.KMS_KEY }}
          PLATFORM_AGENT_CUSTOM_ROLES: ${{ vars.PLATFORM_AGENT_CUSTOM_ROLES }}
          HERMES_DASHBOARD_ENABLED: ${{ vars.HERMES_DASHBOARD_ENABLED }}
          THIRD_PARTY_REGISTRY_PREFIX: ${{ vars.THIRD_PARTY_REGISTRY_PREFIX }}
          NAMESPACE: ${{ vars.NAMESPACE }}
        # provision_environment.sh is this change's name for what candidates up
        # to and including rc_2608310656_cf038a2_validated carry as
        # provision_rc_environment.sh. get_latest_validated_rc_tag has no recency
        # window, so the nightly pipeline resolves one of those until the RC
        # pipeline validates a post-merge commit — and calling the new name in
        # that tree aborts with "No such file or directory". The old script reads
        # strictness under the old variable name only.
        #
        # Delete this fallback once no rc_*_validated tag predates the rename.
        run: |
          if [ -f ./scripts/release/provision_environment.sh ]; then
            ./scripts/release/provision_environment.sh
          else
            echo "==> Candidate predates the provision_environment.sh rename; running provision_rc_environment.sh."
            RC_TEARDOWN_STRICT="${TEARDOWN_STRICT}" ./scripts/release/provision_rc_environment.sh
          fi
