name: Publish to GCP Artifact Registry

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish-gcp:
    runs-on: ubuntu-latest
    if: github.repository == 'gke-labs/kube-agents'
    permissions:
      contents: read
      id-token: write
    env:
      GCP_REGISTRY: us-docker.pkg.dev/kube-agents-prow/kube-agents
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load tags
        run: cat tags.env >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          workload_identity_provider: projects/125393897113/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-actions@kube-agents-prow.iam.gserviceaccount.com

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build and Push Platform Agent (GCP Cloud Build)
        id: gcp-platform
        # _GIT_SHA is the revision stamp cloudbuild.yaml turns into
        # /opt/build-info.json and the OCI revision label. Its substitution
        # default is an empty string, so omitting it here builds silently and
        # produces an image the self-improvement runner refuses to investigate.
        # _IMAGE_SOURCE is the repository the source came from, for the OCI
        # source label -- derived from the workflow's own repository rather than
        # hardcoded, so a fork's images do not point at gke-labs.
        run: |
          gcloud builds submit \
            --config=deploy/docker/cloudbuild.yaml \
            --substitutions="_IMAGE_URI=$GCP_REGISTRY/platform-agent:$GITHUB_SHA,_IMAGE_URI_LATEST=$GCP_REGISTRY/platform-agent:latest,_TARGET=platform,_HERMES_AGENT_TAG=$HERMES_AGENT_TAG,_GIT_SHA=$GITHUB_SHA,_IMAGE_SOURCE=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY,_BUILDCACHE_URI=$GCP_REGISTRY/platform-agent:buildcache,_KUBE_AGENTS_VERSION=$GITHUB_SHA" \
            .
          DIGEST=$(gcloud artifacts docker images describe "$GCP_REGISTRY/platform-agent:$GITHUB_SHA" --format="value(image_summary.digest)")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          # A dropped substitution fails silently -- the Dockerfile defaults
          # GIT_SHA to empty and the build succeeds -- so read the stamp back
          # off what was pushed rather than trusting the line above.
          #
          # Detection, not prevention: cloudbuild.yaml publishes through
          # `images:`, so `:latest` has already moved by the time this runs and
          # a failure here means revert and republish. Holding the tag back
          # would mean dropping `_IMAGE_URI_LATEST` from that config, which
          # scripts/dev/dev_rebuild_agent.sh also drives -- more
          # blast radius than this branch should take on.
          #
          # Both places it lands, because they are two separate Dockerfile
          # instructions. The label is what registries and provenance scanners
          # read; /opt/build-info.json is what the self-improvement runner reads,
          # and it is the one that decides whether a deployed pod can file
          # anything. A gate on the label alone stays green if the `RUN printf`
          # that writes the file is deleted, typo'd, or moved out from under the
          # ARG, and every pod then falls back to report-only. The image is
          # already pulled for the label check, so the file check is free.
          REF="$GCP_REGISTRY/platform-agent@$DIGEST"
          docker pull --quiet "$REF" >/dev/null
          REVISION=$(docker inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "$REF")
          if [ "$REVISION" != "$GITHUB_SHA" ]; then
            echo "::error::$REF carries revision label '$REVISION', expected '$GITHUB_SHA'. The _GIT_SHA substitution did not reach the image." >&2
            exit 1
          fi
          FILE_REVISION=$(docker run --rm --entrypoint cat "$REF" /opt/build-info.json | jq -r '.revision // ""')
          if [ "$FILE_REVISION" != "$GITHUB_SHA" ]; then
            echo "::error::$REF carries /opt/build-info.json revision '$FILE_REVISION', expected '$GITHUB_SHA'. The self-improvement runner reads that file, not the label, and would treat this image as unstamped." >&2
            exit 1
          fi
          # _IMAGE_SOURCE travels in the same substitution string as _GIT_SHA and
          # is just as silently droppable, so check it here rather than leave one
          # of the pair unguarded.
          SOURCE=$(docker inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' \
            "$REF")
          if [ "$SOURCE" != "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" ]; then
            echo "::error::$REF carries source label '$SOURCE', expected '$GITHUB_SERVER_URL/$GITHUB_REPOSITORY'. The _IMAGE_SOURCE substitution did not reach the image, and a provenance scanner will not find this repository from it." >&2
            exit 1
          fi
          echo "revision stamp OK in both the label and /opt/build-info.json: $GITHUB_SHA (source $SOURCE)"

      - name: Build and Push Replay Proxy (GCP Cloud Build)
        id: gcp-replay-proxy
        run: |
          gcloud builds submit examples/inference-replay/replay-proxy \
            --tag="$GCP_REGISTRY/replay-proxy:$GITHUB_SHA"
          gcloud artifacts docker tags add \
            "$GCP_REGISTRY/replay-proxy:$GITHUB_SHA" \
            "$GCP_REGISTRY/replay-proxy:latest"
          DIGEST=$(gcloud artifacts docker images describe "$GCP_REGISTRY/replay-proxy:$GITHUB_SHA" --format="value(image_summary.digest)")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Build and Push Credential Sidecar (GCP Cloud Build)
        id: gcp-credential-proxy
        run: |
          gcloud builds submit \
            --config=deploy/docker/cloudbuild.yaml \
            --substitutions="_IMAGE_URI=$GCP_REGISTRY/credential-proxy:$GITHUB_SHA,_IMAGE_URI_LATEST=$GCP_REGISTRY/credential-proxy:latest,_TARGET=credential-proxy,_HERMES_AGENT_TAG=$HERMES_AGENT_TAG,_GIT_SHA=$GITHUB_SHA,_IMAGE_SOURCE=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY,_BUILDCACHE_URI=$GCP_REGISTRY/credential-proxy:buildcache" \
            .
          DIGEST=$(gcloud artifacts docker images describe "$GCP_REGISTRY/credential-proxy:$GITHUB_SHA" --format="value(image_summary.digest)")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          # The same read-back the platform build does, for a reason that build
          # does not have: this stage descends from the Hermes base image, which
          # carries an org.opencontainers.image.revision of its own. A dropped
          # substitution here does not leave the label empty -- it leaves an
          # upstream commit sha in place, which reads as this repository's
          # provenance and resolves to nothing in it. Label only: the sidecar
          # writes no /opt/build-info.json, because the file exists for the
          # self-improvement runner, which reads the agent image.
          REF="$GCP_REGISTRY/credential-proxy@$DIGEST"
          docker pull --quiet "$REF" >/dev/null
          REVISION=$(docker inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "$REF")
          if [ "$REVISION" != "$GITHUB_SHA" ]; then
            echo "::error::$REF carries revision label '$REVISION', expected '$GITHUB_SHA'. The _GIT_SHA substitution did not reach the sidecar, and an inherited label from the base image is what a scanner will read instead." >&2
            exit 1
          fi
          echo "sidecar revision stamp OK: $GITHUB_SHA"

      - name: Build and Push Pubsub Platform Plugin (GCP Cloud Build)
        id: gcp-pubsub-platform
        run: |
          gcloud builds submit agentplugins/pubsub-platform \
            --tag="$GCP_REGISTRY/pubsub-platform:$GITHUB_SHA"
          gcloud artifacts docker tags add \
            "$GCP_REGISTRY/pubsub-platform:$GITHUB_SHA" \
            "$GCP_REGISTRY/pubsub-platform:latest"
          DIGEST=$(gcloud artifacts docker images describe "$GCP_REGISTRY/pubsub-platform:$GITHUB_SHA" --format="value(image_summary.digest)")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Build and Push GKE Stockout Investigator Plugin (GCP Cloud Build)
        id: gcp-stockout-investigator
        run: |
          gcloud builds submit agentplugins/gke-stockout-investigator \
            --tag="$GCP_REGISTRY/gke-stockout-investigator:$GITHUB_SHA"
          gcloud artifacts docker tags add \
            "$GCP_REGISTRY/gke-stockout-investigator:$GITHUB_SHA" \
            "$GCP_REGISTRY/gke-stockout-investigator:latest"
          DIGEST=$(gcloud artifacts docker images describe "$GCP_REGISTRY/gke-stockout-investigator:$GITHUB_SHA" --format="value(image_summary.digest)")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the images
        env:
          PLATFORM_DIGEST: ${{ steps.gcp-platform.outputs.digest }}
          REPLAY_PROXY_DIGEST: ${{ steps.gcp-replay-proxy.outputs.digest }}
          CREDENTIAL_PROXY_DIGEST: ${{ steps.gcp-credential-proxy.outputs.digest }}
          PUBSUB_PLATFORM_DIGEST: ${{ steps.gcp-pubsub-platform.outputs.digest }}
          STOCKOUT_INVESTIGATOR_DIGEST: ${{ steps.gcp-stockout-investigator.outputs.digest }}
        run: |
          cosign sign --yes "$GCP_REGISTRY/platform-agent@$PLATFORM_DIGEST"
          cosign sign --yes "$GCP_REGISTRY/replay-proxy@$REPLAY_PROXY_DIGEST"
          cosign sign --yes "$GCP_REGISTRY/credential-proxy@$CREDENTIAL_PROXY_DIGEST"
          cosign sign --yes "$GCP_REGISTRY/pubsub-platform@$PUBSUB_PLATFORM_DIGEST"
          cosign sign --yes "$GCP_REGISTRY/gke-stockout-investigator@$STOCKOUT_INVESTIGATOR_DIGEST"
