name: Publish to GCP Artifact Registry

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish-gcp:
    runs-on: ubuntu-latest
    if: github.repository == 'gke-labs/kube-agents'
    permissions:
      contents: read
      id-token: write
    env:
      GCP_REGISTRY: us-docker.pkg.dev/kube-agents-prow/kube-agents
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load tags
        run: cat tags.env >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          workload_identity_provider: projects/125393897113/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-actions@kube-agents-prow.iam.gserviceaccount.com

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build and Push Platform Agent (GCP Cloud Build)
        id: gcp-platform
        run: |
          gcloud builds submit \
            --config=deploy/docker/cloudbuild.yaml \
            --substitutions="_IMAGE_URI=$GCP_REGISTRY/platform-agent:$GITHUB_SHA,_IMAGE_URI_LATEST=$GCP_REGISTRY/platform-agent:latest,_TARGET=platform,_HERMES_AGENT_TAG=$HERMES_AGENT_TAG,_BUILDCACHE_URI=$GCP_REGISTRY/platform-agent:buildcache,_KUBE_AGENTS_VERSION=$GITHUB_SHA" \
            .
          DIGEST=$(gcloud artifacts docker images describe "$GCP_REGISTRY/platform-agent:$GITHUB_SHA" --format="value(image_summary.digest)")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Build and Push Replay Proxy (GCP Cloud Build)
        id: gcp-replay-proxy
        run: |
          gcloud builds submit examples/inference-replay/replay-proxy \
            --tag="$GCP_REGISTRY/replay-proxy:$GITHUB_SHA"
          gcloud artifacts docker tags add \
            "$GCP_REGISTRY/replay-proxy:$GITHUB_SHA" \
            "$GCP_REGISTRY/replay-proxy:latest"
          DIGEST=$(gcloud artifacts docker images describe "$GCP_REGISTRY/replay-proxy:$GITHUB_SHA" --format="value(image_summary.digest)")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Build and Push Credential Sidecar (GCP Cloud Build)
        id: gcp-credential-proxy
        run: |
          gcloud builds submit \
            --config=deploy/docker/cloudbuild.yaml \
            --substitutions="_IMAGE_URI=$GCP_REGISTRY/credential-proxy:$GITHUB_SHA,_IMAGE_URI_LATEST=$GCP_REGISTRY/credential-proxy:latest,_TARGET=credential-proxy,_HERMES_AGENT_TAG=$HERMES_AGENT_TAG,_BUILDCACHE_URI=$GCP_REGISTRY/credential-proxy:buildcache" \
            .
          DIGEST=$(gcloud artifacts docker images describe "$GCP_REGISTRY/credential-proxy:$GITHUB_SHA" --format="value(image_summary.digest)")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Build and Push Agent Sandbox (GCP Cloud Build)
        id: gcp-agent-sandbox
        run: |
          gcloud builds submit \
            --config=deploy/sandbox/cloudbuild.yaml \
            --substitutions="_IMAGE_URI=$GCP_REGISTRY/agent-sandbox:$GITHUB_SHA,_IMAGE_URI_LATEST=$GCP_REGISTRY/agent-sandbox:latest" \
            .
          DIGEST=$(gcloud artifacts docker images describe "$GCP_REGISTRY/agent-sandbox:$GITHUB_SHA" --format="value(image_summary.digest)")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Build and Push Pubsub Platform Plugin (GCP Cloud Build)
        id: gcp-pubsub-platform
        run: |
          gcloud builds submit agentplugins/pubsub-platform \
            --tag="$GCP_REGISTRY/pubsub-platform:$GITHUB_SHA"
          gcloud artifacts docker tags add \
            "$GCP_REGISTRY/pubsub-platform:$GITHUB_SHA" \
            "$GCP_REGISTRY/pubsub-platform:latest"
          DIGEST=$(gcloud artifacts docker images describe "$GCP_REGISTRY/pubsub-platform:$GITHUB_SHA" --format="value(image_summary.digest)")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Build and Push GKE Stockout Investigator Plugin (GCP Cloud Build)
        id: gcp-stockout-investigator
        run: |
          gcloud builds submit agentplugins/gke-stockout-investigator \
            --tag="$GCP_REGISTRY/gke-stockout-investigator:$GITHUB_SHA"
          gcloud artifacts docker tags add \
            "$GCP_REGISTRY/gke-stockout-investigator:$GITHUB_SHA" \
            "$GCP_REGISTRY/gke-stockout-investigator:latest"
          DIGEST=$(gcloud artifacts docker images describe "$GCP_REGISTRY/gke-stockout-investigator:$GITHUB_SHA" --format="value(image_summary.digest)")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the images
        env:
          PLATFORM_DIGEST: ${{ steps.gcp-platform.outputs.digest }}
          REPLAY_PROXY_DIGEST: ${{ steps.gcp-replay-proxy.outputs.digest }}
          CREDENTIAL_PROXY_DIGEST: ${{ steps.gcp-credential-proxy.outputs.digest }}
          AGENT_SANDBOX_DIGEST: ${{ steps.gcp-agent-sandbox.outputs.digest }}
          PUBSUB_PLATFORM_DIGEST: ${{ steps.gcp-pubsub-platform.outputs.digest }}
          STOCKOUT_INVESTIGATOR_DIGEST: ${{ steps.gcp-stockout-investigator.outputs.digest }}
        run: |
          cosign sign --yes "$GCP_REGISTRY/platform-agent@$PLATFORM_DIGEST"
          cosign sign --yes "$GCP_REGISTRY/replay-proxy@$REPLAY_PROXY_DIGEST"
          cosign sign --yes "$GCP_REGISTRY/credential-proxy@$CREDENTIAL_PROXY_DIGEST"
          cosign sign --yes "$GCP_REGISTRY/agent-sandbox@$AGENT_SANDBOX_DIGEST"
          cosign sign --yes "$GCP_REGISTRY/pubsub-platform@$PUBSUB_PLATFORM_DIGEST"
          cosign sign --yes "$GCP_REGISTRY/gke-stockout-investigator@$STOCKOUT_INVESTIGATOR_DIGEST"
