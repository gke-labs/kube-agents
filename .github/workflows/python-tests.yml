name: Python Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# A re-push supersedes this pull request's earlier run instead of stacking a
# second full set of checks behind it. Runs that are not from a pull request
# fall back to github.run_id, which is unique, so each sits alone in its own
# group and none is ever cancelled. A shared key would not be safe there:
# GitHub holds only one run pending per group, so a burst of merges to main
# would lose the runs in the middle before they started.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Run Python Unit Tests
    runs-on: ubuntu-latest

    env:
      # platform_mcp_server writes its per-thread kubeconfigs under $HERMES_HOME,
      # which defaults to the in-container path /opt/data. A runner cannot create
      # that, so point it at the workspace instead.
      HERMES_HOME: ${{ github.workspace }}/.hermes-home

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Read from requirements-test.txt rather than spelled out here, so this
      # job and `make test-python-deps` cannot drift into disagreeing about
      # what the suite needs. The reasoning for each entry is in that file.
      - name: Install the third-party imports the modules under test need
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-test.txt

      # Deliberately unfiltered. The suite runs in seconds, and a paths filter
      # is precisely what kept these tests from running: k8s-operator-test.yml
      # filters on `k8s-operator/**`, so a change to a skill helper script
      # never started a job at all.
      - name: Run Python unit tests
        run: make test-python

  # Separate job because bench/tests is pytest-native and cannot run under the
  # unittest discovery `make test-python` uses -- it sat outside every glob and
  # had never once run in CI. Installing bench/ resolves devops-bench from the
  # git SHA pinned in bench/pyproject.toml.
  bench-tests:
    name: Run Bench Harness Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install bench and its test runner
        run: |
          python3 -m pip install --upgrade pip
          make test-bench-deps

      - name: Run the bench harness tests
        run: make test-bench

  # Report-only for now: it posts numbers on the pull request and blocks
  # nothing. The blocking rules (diff-coverage floor, no-test detector, total
  # ratchet) turn on in stages once a baseline of merged-PR data exists --
  # first the no-test detector, then the floor and the ratchet, with the
  # thresholds set from the observed distribution rather than this file.
  #
  # The job also runs on pushes to main -- measurement only, no diff, no
  # comment. Those runs are what give the total ratchet a per-commit baseline
  # and the coverage-check floor a number measured in CI rather than on a
  # laptop; without them "commit the first green run's total" has no run to
  # read.
  coverage:
    name: Coverage report
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    env:
      HERMES_HOME: ${{ github.workspace }}/.hermes-home

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # diff-cover diffs against the merge base, which a shallow clone
          # does not have.
          fetch-depth: 0
          # Nothing after checkout needs git credentials (diff-cover diffs
          # locally, gh reads GH_TOKEN from the env), and this job executes
          # the pull request's own Makefile and tests -- don't leave a token
          # on disk for them to read.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the third-party imports the modules under test need
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-test.txt

      # COVERAGE_SKIP_GO=1: k8s-operator-test.yml already runs the Go suite,
      # and the envtest setup is not worth repeating for a report-only job.
      # `make coverage` tolerates failing test directories by design -- the
      # `test` job above is the gate, this one is the meter.
      - name: Measure coverage
        run: make coverage COVERAGE_SKIP_GO=1

      # fnmatch quirk: diff-cover matches exclusions against the basename and
      # then the ABSOLUTE path (diff_cover/diff_reporter.py, _is_path_excluded),
      # so a bare repo-relative pattern matches nothing and fails open. A `*`
      # prefix with no slash matches under absolute-path semantics AND under
      # plain relative matching -- diff-cover is deliberately unpinned in
      # requirements-test.txt, so the patterns must not depend on which of the
      # two an upstream release uses.
      #
      # The same six paths are omitted in .coveragerc, so the diff number and
      # the repository total in the comment are computed over one file set --
      # otherwise a PR adding uncovered lines under an excluded path reads
      # 100% on the diff while dragging down a total the floor is blind to.
      - name: Diff coverage against the merge base
        if: github.event_name == 'pull_request'
        env:
          # Through the environment rather than interpolated into the script:
          # zizmor flags template expansion inside `run:` as an injection
          # surface, and the env var is inert text to the shell parser.
          BASE_REF: ${{ github.base_ref }}
        run: |
          diff-cover coverage.xml \
            --compare-branch "origin/${BASE_REF}" \
            --markdown-report diff-cover.md \
            --fail-under 0 \
            --exclude \
              "*deploy/docker/patches/verify_*.py" \
              "*deploy/docker/patches/kanban*.py" \
              "*deploy/docker/patches/cron*.py" \
              "*deploy/docker/patches/channel_directory_threads*.py" \
              "*deploy/docker/patches/slack_code_emphasis*.py" \
              "*examples/*"

      # One sticky comment rewritten in place, never a new comment per push.
      # Plain gh api rather than a third-party action: the logic is ten lines,
      # and it is one less pinned SHA to keep current.
      #
      # Same-repo pull requests only, and not Dependabot's: on a fork PR
      # GitHub forces the token to read-only whatever `permissions:` asks
      # for, and it does the same when the actor is dependabot[bot] even on
      # a same-repo branch -- either way the POST would 403 and red a job
      # whose whole point is to block nothing. Those runs get the artifact
      # upload below instead.
      - name: Post the coverage comment
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          marker='<!-- coverage-report -->'
          total=$(COVERAGE_ROOT="$PWD" COVERAGE_FILE="$PWD/.coverage-data/.coverage" \
                  python3 -m coverage report --rcfile=.coveragerc --format=total)
          {
            echo "$marker"
            echo "## Coverage"
            echo
            echo "Repository total (Python): **${total}%**"
            echo
            # GitHub caps a comment body at 65,536 characters; a huge PR's
            # diff-cover table can exceed it, and a 422 here reds the job.
            head -c 60000 diff-cover.md
            echo
            echo "_Report-only: nothing here blocks this pull request yet._"
          } > comment.md
          # Only consider comments this workflow's identity wrote: anyone can
          # start a comment with the marker, and PATCHing theirs would render
          # the report under their name. tail rather than head: tail reads to
          # EOF, so it cannot SIGPIPE a still-paginating gh under a pipefail
          # shell; there is at most one matching comment either way.
          cid=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                --jq ".[] | select(.user.login == \"github-actions[bot]\")
                          | select(.body | startswith(\"$marker\")) | .id" | tail -1)
          if [ -n "$cid" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$cid" -F body=@comment.md
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@comment.md
          fi

      # The copy of the report for every run the comment step skips: fork
      # PRs, Dependabot, and the measurement-only pushes to main.
      - name: Upload the diff coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diff-cover-report
          path: |
            diff-cover.md
            coverage.xml
          if-no-files-found: ignore
