name: Python Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A re-push supersedes this pull request's earlier run instead of stacking a
# second full set of checks behind it. Runs that are not from a pull request
# fall back to github.run_id, which is unique, so each sits alone in its own
# group and none is ever cancelled. A shared key would not be safe there:
# GitHub holds only one run pending per group, so a burst of merges to main
# would lose the runs in the middle before they started.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # This job runs everything the Makefile's PYTHON_TEST_DIRS globs discover,
  # which since the integration seam tier left probation includes
  # tests/integration as well as the unit suites. The tier used to have a job
  # of its own, and that job is gone: its only purpose was to keep a young,
  # unproven suite from redding an already-gating check, and it finished its
  # probation without a failure. Folding it in rather than keeping it alongside
  # leaves one check for branch protection to require instead of two, and stops
  # every pull request paying for the same 31 tests twice.
  #
  # The coverage report used to be a second job for the same reason and was
  # folded in the same way. It ran `make coverage`, which is `make test-python`
  # with `coverage run` in place of `python3` -- the same 5638 tests, over the
  # same directories, on a second runner, costing a full duplicate suite on
  # every pull request and push. Running the gate under instrumentation gets
  # both the verdict and the number out of one execution. It also makes the
  # mirroring the Makefile's coverage target is built around structural rather
  # than hand-maintained: the meter cannot drift into measuring a different
  # suite from the gate when it *is* the gate.
  #
  # COVERAGE_STRICT=1 is what makes that safe. `make coverage` on its own
  # tolerates a failing directory by design, so without the flag this job would
  # report success on a red suite.
  #
  # The coverage half is report-only and blocks nothing on its own: the
  # blocking rules (diff-coverage floor, no-test detector, total ratchet) turn
  # on in stages once a baseline of merged-PR data exists, with thresholds set
  # from the observed distribution rather than this file. The job runs on
  # pushes to main and merge-queue runs too -- measurement only, no diff, no
  # comment; the push runs are
  # what give the total ratchet a per-commit baseline measured in CI rather
  # than on a laptop.
  #
  # Keeping it report-only takes deliberate work now that it shares a job with
  # a required context: a job fails if any step fails, so a coverage tool that
  # errors would red the merge gate with every test passing. diff-cover is
  # unpinned on purpose (see the exclusion-pattern comment below), which makes
  # it the likeliest thing here to break on someone else's release. Its two
  # steps in the `test` job below are therefore continue-on-error -- a broken
  # report costs the comment, not the merge. What is left able to fail the
  # required check is the suite itself, coverage.py writing and joining its
  # data, a shard that did not finish, and the bench harness job, which are
  # the things that should.
  #
  # The sweep runs as three shards on three runners (`test-shard`), and `test`
  # joins their coverage and carries the required check's name. On one runner
  # the sweep took about 18 minutes, most of every merge-queue build, while its
  # longest single file takes five; three shards of the heavy-first order come
  # out at about six minutes each. The Makefile's PYTHON_TEST_SHARD says how a
  # shard picks its files.
  test-shard:
    name: Run Python Unit Tests (shard ${{ matrix.shard }}/3)
    # Pinned, not ubuntu-latest: on 2026-10-26 ubuntu-latest moved to 26.04,
    # where hack/ci-env.sh's `tail -c` byte caps let more than the cap
    # through and bash names a piped script's frame "bash" rather than
    # install.sh, so the four tests that hold those behaviours fail. Move off the pin once they pass
    # there (#3952).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Every shard runs to the end: a red file in one shard must not cancel
      # the others, whose verdicts and coverage the join below still needs.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    # No pull-requests: write here, deliberately. This job runs the pull
    # request's own Makefile and tests, and on a fork PR the token is
    # read-only whatever this block asks for -- which in this repository is
    # every PR, since branches live on forks. The comment is posted by
    # coverage-comment.yml on the workflow_run trigger, which runs in the
    # base repository's context; a shard hands its coverage to the `test` job,
    # and that job hands the report to the poster.
    permissions:
      contents: read

    env:
      # platform_mcp_server writes its per-thread kubeconfigs under $HERMES_HOME,
      # which defaults to the in-container path /opt/data. A runner cannot create
      # that, so point it at the workspace instead.
      HERMES_HOME: ${{ github.workspace }}/.hermes-home

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The default depth: the sweep reads no history (the agent-image
          # job runs the same sweep at this depth), and diff-cover, which
          # does, runs in the `test` job. Nothing after checkout needs git
          # credentials, and this job
          # executes the pull request's own Makefile and tests -- don't
          # leave a token on disk for them to read.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          # Keyed on both files the install step below reads: the test list
          # and the console file it pulls in with -r. The install itself is
          # the same command either way; a hit spares the wheel downloads,
          # about a minute per job at the runner's egress. The key changes
          # only when one of those files does, and the action saves nothing
          # on a hit, so a release of one of the unpinned packages is fetched
          # on every run until the next edit to either file refreshes the set.
          cache-dependency-path: |
            requirements-test.txt
            admin_console/requirements.txt

      # Not for a Go suite -- k8s-operator-test.yml owns those. This job's
      # sweep includes tests/integration, and its injector seam
      # compiles and runs the real Go client from
      # k8s-operator/cmd/k8s-event-watcher against the live Python server.
      # That whole class is decorated `skipUnless(GO)`, so a runner without a
      # toolchain does not fail: it skips four tests and prints OK. This step
      # is what stops the strongest cross-language test in the repository from
      # being silently absent from the job that gates on it.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: k8s-operator/go.mod
          cache-dependency-path: k8s-operator/go.sum

      # Same reason as Go above: chart-rendering suites in tests/
      # (test_quota_preflight.py, test_values_schema.py, test_helm_plugins.py,
      # test_litellm_redaction.py, and others) are decorated `skipUnless(helm)`,
      # so without a helm binary on the runner they skip silently while the job
      # reports green.
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      # Read from requirements-test.txt rather than spelled out here, so this
      # job and `make test-python-deps` cannot drift into disagreeing about
      # what the suite needs. The reasoning for each entry is in that file.
      - name: Install the third-party imports the modules under test need
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-test.txt

      # Deliberately unfiltered. The unit suites run in seconds and the seam
      # tier in well under a minute, and a paths filter is precisely what kept
      # these tests from running: k8s-operator-test.yml
      # filters on `k8s-operator/**`, so a change to a skill helper script
      # never started a job at all.
      #
      # COVERAGE_SKIP_GO=1: k8s-operator-test.yml already runs the Go suite,
      # and the envtest setup is not worth repeating to measure it twice. That
      # switch is about not re-measuring the operator's own Go suite, and is
      # not in tension with the toolchain installed above, which is what a
      # Python seam test shells out to.
      #
      # COVERAGE_STRICT=1: fail the job when a test directory fails. Without
      # it `make coverage` reports the number and exits 0 whatever the tests
      # did, which for the required check would mean reporting success on a
      # red suite.
      #
      # PYTHON_TEST_SHARD: this job's third of the sweep. Its coverage and its
      # list of failing files go to the join in `test` below. Set in the
      # environment, not on make's command line: a command-line value also
      # travels in MAKEFLAGS into every make the tests start.
      - name: Run Python unit tests under coverage
        env:
          PYTHON_TEST_SHARD: ${{ matrix.shard }}/3
        run: make coverage COVERAGE_SKIP_GO=1 COVERAGE_STRICT=1

      # !cancelled() rather than success(): a shard with a red file still
      # hands its coverage and its failing-file list to the join, which is
      # where the required check decides.
      - name: Upload this shard's coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage-shard-${{ matrix.shard }}
          path: |
            .coverage-data/.coverage
            .coverage-data/failed-files.txt
          # .coverage is a dot file, which the action leaves out by default.
          include-hidden-files: true
          if-no-files-found: error
          # Long enough for "Re-run failed jobs" days later: the join needs
          # the passed shards' data as well as the re-run shard's.
          retention-days: 7

  # The required `Run Python Unit Tests` check: joins the three shards'
  # coverage into one coverage.xml and one total, and holds COVERAGE_STRICT
  # over every shard's failing files. `always()` rather than the default
  # `success()` or `!cancelled()`: a red shard, or a run cancelled while the
  # shards ran, would otherwise skip this job, and a skipped job reports
  # success to a required check, so the queue could merge with no tests run.
  # The cost is a red join on a run that was cancelled, such as a pull
  # request's run superseded by a newer push. The last step also fails unless
  # every shard succeeded, so a shard that died before it uploaded anything
  # cannot pass either. The join also needs the bench job below: the queue
  # re-tests every combined tree, and a bench red there must hold the merge,
  # which a job outside the required context cannot do on its own.
  test:
    name: Run Python Unit Tests
    needs: [test-shard, bench-tests]
    if: ${{ always() }}
    runs-on: ubuntu-24.04 # pinned, as the test-shard job above says
    timeout-minutes: 15

    # As for the shards: no pull-requests: write; the comment is posted by
    # coverage-comment.yml from this job's artifact.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # diff-cover diffs against the merge base, which a shallow clone
          # does not have.
          fetch-depth: 0
          persist-credentials: false

      # No pip cache: the shards' cache holds the whole test set, and this job
      # installs two packages.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      # The two tools alone: nothing here imports the code under test. Both
      # are unpinned in requirements-test.txt as here, so a coverage release
      # between the shards' install and this one could change the data
      # schema; combine then fails, which fails the check closed.
      - name: Install coverage and diff-cover
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install coverage diff-cover

      - name: Download the shards' coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-coverage-shard-*
          path: .coverage-data

      # COVERAGE_STRICT=1: fail when any shard's sweep had a failing file. The
      # target also fails when a shard's directory, data or failing-file list
      # is missing, so a shard that wrote nothing reads as red, not green.
      - name: Join the shards' coverage
        run: make coverage-merge COVERAGE_SHARD_COUNT=3 COVERAGE_STRICT=1

      # !cancelled() rather than success(): COVERAGE_STRICT makes the step
      # above fail on a red suite, and a red pull request still wants its
      # coverage numbers. The Makefile runs the strict check last, after
      # combine/xml/report, so coverage.xml is on disk either way.
      #
      # fnmatch quirk: diff-cover matches exclusions against the basename and
      # then the ABSOLUTE path (diff_cover/diff_reporter.py, _is_path_excluded),
      # so a bare repo-relative pattern matches nothing and fails open. A `*`
      # prefix with no slash matches under absolute-path semantics AND under
      # plain relative matching -- diff-cover is deliberately unpinned in
      # requirements-test.txt, so the patterns must not depend on which of the
      # two an upstream release uses.
      #
      # The same six paths are omitted in .coveragerc, so the diff number and
      # the repository total in the comment are computed over one file set --
      # otherwise a PR adding uncovered lines under an excluded path reads
      # 100% on the diff while dragging down a total the floor is blind to.
      - name: Diff coverage against the merge base
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          # Through the environment rather than interpolated into the script:
          # zizmor flags template expansion inside `run:` as an injection
          # surface, and the env var is inert text to the shell parser.
          BASE_REF: ${{ github.base_ref }}
        run: |
          diff-cover coverage.xml \
            --compare-branch "origin/${BASE_REF}" \
            --markdown-report diff-cover.md \
            --fail-under 0 \
            --exclude \
              "*deploy/docker/patches/verify_*.py" \
              "*deploy/docker/patches/kanban*.py" \
              "*deploy/docker/patches/cron*.py" \
              "*deploy/docker/patches/channel_directory_threads*.py" \
              "*deploy/docker/patches/slack_code_emphasis*.py" \
              "*examples/*"

      # The hand-off to coverage-comment.yml, which posts the sticky PR
      # comment from the base repository's context (this job's fork token
      # cannot). The PR number rides inside the artifact because the
      # workflow_run event on the poster's side does not reliably carry it
      # for fork PRs; the poster validates it before use rather than
      # trusting it. Skipped on the measurement-only pushes to main and on
      # merge-queue runs: neither has a PR to hand off to, and the poster
      # ignores runs without one.
      - name: Write the comment hand-off data
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          echo "$PR" > pr-number.txt
          COVERAGE_ROOT="$PWD" COVERAGE_FILE="$PWD/.coverage-data/.coverage" \
            python3 -m coverage report --rcfile=.coveragerc --format=total \
            > coverage-total.txt

      - name: Upload the diff coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diff-cover-report
          path: |
            diff-cover.md
            coverage.xml
            pr-number.txt
            coverage-total.txt
          if-no-files-found: ignore

      - name: Every shard and the bench job succeeded
        if: ${{ always() }}
        env:
          SHARDS: ${{ needs.test-shard.result }}
          BENCH: ${{ needs.bench-tests.result }}
        run: |
          if [ "$SHARDS" != "success" ]; then
            echo "::error::The test shards ended '$SHARDS', not success."
            exit 1
          fi
          if [ "$BENCH" != "success" ]; then
            echo "::error::The bench harness tests ended '$BENCH', not success."
            exit 1
          fi

  # The same sweep once more on the interpreter the platform agent image runs.
  # `.python-version` is CI's Python and the one the coverage job above measures
  # on; `.agent-python-version` is the Python inside the image built from
  # deploy/docker/Dockerfile, which inherits it from the upstream Hermes base,
  # and it is where agents/platform/scripts, deploy/shared and the agent plugins
  # actually execute. Until the two agree, a suite that passes on one and not
  # the other is a bug this job exists to show. It is plain `make test-python`,
  # no coverage: the number comes from the job above, and measuring it twice
  # would say nothing new. Not a required check, so a red here does not hold a
  # merge; it does fail this workflow's run, and on a push to main that files
  # a main-broken issue like any other job here, which is the point: a suite
  # that passes on 3.12 and not on the interpreter the agent runs is a break.
  #
  # This replaced agent-startup-test.yml and agentplugins-test.yml, which ran
  # tests/ and the plugin suites on this interpreter and nothing else; this job
  # runs every directory in PYTHON_TEST_DIRS on it.
  test-agent-python:
    name: Run Python Unit Tests on the agent image's Python
    runs-on: ubuntu-24.04 # pinned, as the test-shard job above says
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      HERMES_HOME: ${{ github.workspace }}/.hermes-home
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the agent image's Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".agent-python-version"
          cache: "pip"
          # Keyed on both files the install step below reads: the test list
          # and the console file it pulls in with -r. The install itself is
          # the same command either way; a hit spares the wheel downloads,
          # about a minute per job at the runner's egress. The key changes
          # only when one of those files does, and the action saves nothing
          # on a hit, so a release of one of the unpinned packages is fetched
          # on every run until the next edit to either file refreshes the set.
          cache-dependency-path: |
            requirements-test.txt
            admin_console/requirements.txt

      # Go and Helm for the same reason the coverage job installs them: the
      # injector seam and the chart-rendering suites skip silently without them.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: k8s-operator/go.mod
          cache-dependency-path: k8s-operator/go.sum

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Install the third-party imports the modules under test need
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-test.txt

      - name: Run the Python unit tests
        run: make test-python

  # Separate job because bench/tests is pytest-native and cannot run under the
  # unittest discovery `make test-python` uses -- it sat outside every glob and
  # had never once run in CI. Installing bench/ resolves devops-bench from the
  # git SHA pinned in bench/pyproject.toml. The required join above needs this
  # job, so a red here holds the merge.
  bench-tests:
    name: Run Bench Harness Tests
    runs-on: ubuntu-24.04 # pinned, as the test-shard job above says
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install bench and its test runner
        run: |
          python3 -m pip install --upgrade pip
          make test-bench-deps

      - name: Run the bench harness tests
        run: make test-bench
