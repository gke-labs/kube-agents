name: Python Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# A re-push supersedes this pull request's earlier run instead of stacking a
# second full set of checks behind it. Runs that are not from a pull request
# fall back to github.run_id, which is unique, so each sits alone in its own
# group and none is ever cancelled. A shared key would not be safe there:
# GitHub holds only one run pending per group, so a burst of merges to main
# would lose the runs in the middle before they started.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Run Python Unit Tests
    runs-on: ubuntu-latest

    env:
      # platform_mcp_server writes its per-thread kubeconfigs under $HERMES_HOME,
      # which defaults to the in-container path /opt/data. A runner cannot create
      # that, so point it at the workspace instead.
      HERMES_HOME: ${{ github.workspace }}/.hermes-home

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Read from requirements-test.txt rather than spelled out here, so this
      # job and `make test-python-deps` cannot drift into disagreeing about
      # what the suite needs. The reasoning for each entry is in that file.
      - name: Install the third-party imports the modules under test need
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-test.txt

      # Deliberately unfiltered. The suite runs in seconds, and a paths filter
      # is precisely what kept these tests from running: k8s-operator-test.yml
      # filters on `k8s-operator/**`, so a change to a skill helper script
      # never started a job at all.
      - name: Run Python unit tests
        run: make test-python

  # Separate job because bench/tests is pytest-native and cannot run under the
  # unittest discovery `make test-python` uses -- it sat outside every glob and
  # had never once run in CI. Installing bench/ resolves devops-bench from the
  # git SHA pinned in bench/pyproject.toml.
  bench-tests:
    name: Run Bench Harness Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install bench and its test runner
        run: |
          python3 -m pip install --upgrade pip
          make test-bench-deps

      - name: Run the bench harness tests
        run: make test-bench
