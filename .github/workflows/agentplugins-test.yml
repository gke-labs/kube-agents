name: Agent Plugin Tests

# Unit tests for the plugins under agentplugins/. These ship as their own OCI images and
# run inside the agent as Hermes plugins, so nothing about them is exercised by the
# operator's Go tests or by the agent startup suite — and their failures are quiet ones: a
# Pub/Sub route that filters out every alert, or deduplicates two unrelated incidents into
# one, looks exactly like a calm day.
#
# The loop below also picks up agentplugins/lib/tests, which is not a plugin: it covers the
# image plumbing both installers share, where a wrong answer is quieter still — a content
# tag that fails to move means the installer republishes nothing and the edit never reaches
# a cluster, on a deployment that reports healthy.
#
# The discover pattern is test_*.py, which deliberately does NOT match the
# *_e2e_test.py suites next to them. Those publish real messages to a real topic and need
# a live deployment; run one by hand, for example:
#
#   KUBE_CONTEXT=... GCP_PROJECT_ID=... \
#     python3 agentplugins/pubsub-platform/tests/dedup_e2e_test.py

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A re-push supersedes this pull request's earlier run instead of stacking a
# second full set of checks behind it. Runs that are not from a pull request
# fall back to github.run_id, which is unique, so each sits alone in its own
# group and none is ever cancelled. A shared key would not be safe there:
# GitHub holds only one run pending per group, so a burst of merges to main
# would lose the runs in the middle before they started.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Run Agent Plugin Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            plugins:
              - "agentplugins/**"
              - ".github/workflows/agentplugins-test.yml"

      - name: Set up Python
        if: steps.filter.outputs.plugins == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".agent-python-version"

      # PyYAML is the only dependency: the tests use stdlib unittest so they run anywhere
      # the agent image does, without adding a test framework to the repo.
      - name: Install dependencies
        if: steps.filter.outputs.plugins == 'true'
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Run plugin unit tests
        if: steps.filter.outputs.plugins == 'true'
        run: |
          set -euo pipefail
          ran=0
          for dir in agentplugins/*/tests; do
            [ -d "$dir" ] || continue
            compgen -G "$dir/test_*.py" > /dev/null || continue
            # One discovery pass per plugin, each in its own process: two plugins may both
            # ship a tests/test_dedup.py, and a single pass would import only one of them.
            echo "::group::$dir"
            python -m unittest discover -s "$dir" -p 'test_*.py' -v
            echo "::endgroup::"
            ran=1
          done
          if [ "$ran" -eq 0 ]; then
            echo "No agent plugin tests found — expected at least one agentplugins/*/tests/test_*.py"
            exit 1
          fi

      # The scenario harness and installers are shell, and a syntax error in them only
      # shows up when someone runs a demo against a live cluster.
      - name: Check plugin shell scripts
        if: steps.filter.outputs.plugins == 'true'
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r script; do
            bash -n "$script"
            found=$((found + 1))
          done < <(find agentplugins -name '*.sh' -type f)
          echo "checked $found shell script(s)"
