name: RC Step 4 - Validate Candidate Commit

permissions:
  contents: read

on:
  #checkov:skip=CKV_GHA_7:Standalone launch requires release candidate tag or commit SHA input
  workflow_dispatch:
    inputs:
      rc_tag:
        description: "Release Candidate Tag or Commit SHA (Mandatory)"
        required: true
        type: string
  workflow_call:
    inputs:
      rc_tag:
        description: "Release Candidate Tag or Commit SHA"
        required: true
        type: string
    secrets:
      RELEASE_BOT_TOKEN:
        description: "Release Bot PAT Token"
        required: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    environment: rc
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN }}

      - name: Resolve Commit SHA from Release Tag
        id: resolve_target
        env:
          RC_TAG: ${{ inputs.rc_tag }}
          GH_ORG: ${{ vars.GH_ORG }}
          GH_REPO: ${{ vars.GH_REPO }}
        run: ./scripts/release/resolve_rc_tag.sh

      - name: Checkout repository at exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve_target.outputs.commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN }}

      - name: Validate Release Candidate Commit
        env:
          COMMIT_SHA: ${{ steps.resolve_target.outputs.commit_sha }}
          RC_TAG: ${{ steps.resolve_target.outputs.rc_tag }}
          GH_ORG: ${{ vars.GH_ORG }}
          GH_REPO: ${{ vars.GH_REPO }}
        run: ./scripts/release/tag_validated_release.sh
