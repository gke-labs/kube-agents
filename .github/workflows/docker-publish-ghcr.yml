name: Publish to GHCR

on:
  push:
    branches: [main]

# Queue rather than cancel: every publish should complete, but not interleave.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-ghcr:
    runs-on: ubuntu-latest
    if: github.repository == 'gke-labs/kube-agents'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load tags
        run: cat tags.env >> "$GITHUB_ENV"

      - name: Downcase repository name
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          echo "IMAGE_REPOSITORY=$(echo "$GITHUB_REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Platform Agent (GHCR)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-platform
        env:
          # Pinned off, not merely left at its default. With BUILDX_GIT_LABELS
          # set, buildx overwrites org.opencontainers.image.revision with the
          # VCS sha of the build context after the Dockerfile has set it from
          # GIT_SHA. Here the two coincide, so the check below would keep
          # passing while proving nothing about whether the build arg reached
          # the image -- which is exactly the sentence its error message claims.
          # Anyone turning the variable on repository-wide for provenance would
          # disarm the gate silently; this line keeps the claim true.
          BUILDX_GIT_LABELS: "false"
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: platform
          # The images deploy to amd64 GKE nodes; the multi-arch bases otherwise
          # resolve to whatever the runner is (#560).
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/platform-agent:latest
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/platform-agent:${{ github.sha }}
          # GIT_SHA is the revision stamp deploy/docker/Dockerfile writes into
          # /opt/build-info.json and the OCI revision label. Without it a
          # published image cannot say which commit it is, and the
          # self-improvement runner refuses to investigate rather than guess at
          # `main` -- so an unstamped publish makes the feature permanently inert
          # on every install that pulls from here. IMAGE_SOURCE is the OCI source
          # label ghcr follows to link the package to a repository; it comes from
          # the workflow's own repository so a fork's images name the fork.
          # KUBE_AGENTS_VERSION is the commit SHA the image is tagged with: it
          # becomes the version in the User-Agent the agent's remote MCP calls
          # carry, so a request in a Google API log names the exact image. All
          # three ARGs sit at the end of the Dockerfile, so a changing SHA
          # invalidates one ~100-byte layer and nothing above it.
          # Keep these lines free of `#`: the action parses the block verbatim.
          build-args: |
            HERMES_AGENT_TAG=${{ env.HERMES_AGENT_TAG }}
            GIT_SHA=${{ github.sha }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            KUBE_AGENTS_VERSION=${{ github.sha }}

      - name: Detect a missing revision stamp (after publish)
        # Named for what it is. The build step above has `push: true`, so by the
        # time this runs both tags are live and this cannot hold a bad image
        # back -- it reddens the job and tells whoever reads it that `:latest`
        # needs a revert and a republish. Making it a real gate means building
        # without pushing, verifying, then pushing, and the GCP workflow beside
        # it cannot follow: that path publishes through `images:` in
        # deploy/docker/cloudbuild.yaml, which scripts/dev/
        # dev_rebuild_agent.sh also drives. Splitting the tag there changes the
        # dev rebuild too, which is more blast radius than this branch should
        # carry for a check that has caught nothing yet.
        #
        # The build args above are the only thing standing between a published
        # image and one the self-improvement runner refuses to investigate, and
        # a dropped `build-args` line fails silently: the Dockerfile defaults
        # both to empty and the build succeeds. Read the labels back off what was
        # actually pushed.
        #
        # Labels only, from the registry manifest -- no pull. The other half of
        # the stamp, /opt/build-info.json, is what the runner actually reads, and
        # it is verified in docker-publish-gcp.yml, which pulls the image anyway.
        # Both workflows build the same Dockerfile from the same commit on the
        # same push, so a deleted or misplaced `RUN printf` reddens that job on
        # the same commit. Reading the file here as well would cost a ~1.2 GB
        # pull per publish, on a runner already holding the buildx cache, to
        # cover only the case where the two workflows have drifted apart.
        run: |
          REF="ghcr.io/$IMAGE_REPOSITORY/platform-agent:${{ github.sha }}"
          REVISION=$(docker buildx imagetools inspect "$REF" \
            --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}')
          if [ "$REVISION" != "${{ github.sha }}" ]; then
            echo "::error::$REF carries revision '$REVISION', expected '${{ github.sha }}'. The GIT_SHA build arg did not reach the image." >&2
            exit 1
          fi
          SOURCE=$(docker buildx imagetools inspect "$REF" \
            --format '{{ index .Image.Config.Labels "org.opencontainers.image.source" }}')
          if [ "$SOURCE" != "${{ github.server_url }}/${{ github.repository }}" ]; then
            echo "::error::$REF carries source '$SOURCE', expected '${{ github.server_url }}/${{ github.repository }}'. The IMAGE_SOURCE build arg did not reach the image, and ghcr will not link the package to this repository." >&2
            exit 1
          fi
          echo "revision stamp OK: $REVISION (source $SOURCE)"

      - name: Build and Push Replay Proxy (GHCR)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-replay-proxy
        with:
          context: examples/inference-replay/replay-proxy
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/replay-proxy:latest
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/replay-proxy:${{ github.sha }}

      - name: Build and Push Credential Sidecar (GHCR)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-credential-proxy
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: credential-proxy
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/credential-proxy:latest
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/credential-proxy:${{ github.sha }}
          # Keep these lines free of `#`: the action parses the block verbatim.
          build-args: |
            HERMES_AGENT_TAG=${{ env.HERMES_AGENT_TAG }}
            GIT_SHA=${{ github.sha }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}

      - name: Detect a missing sidecar revision stamp (after publish)
        # Post-publish for the same reason as the platform check above.
        # Separate from it because this image is built
        # three steps later, and for a reason that check does not have: the
        # sidecar descends from the Hermes base image, which carries a revision
        # label of its own. A dropped build arg here does not leave the label
        # empty -- it leaves an upstream commit sha in place, which reads as
        # this repository's provenance and resolves to nothing in it.
        run: |
          REF="ghcr.io/$IMAGE_REPOSITORY/credential-proxy:${{ github.sha }}"
          REVISION=$(docker buildx imagetools inspect "$REF" \
            --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}')
          if [ "$REVISION" != "${{ github.sha }}" ]; then
            echo "::error::$REF carries revision '$REVISION', expected '${{ github.sha }}'. The GIT_SHA build arg did not reach the sidecar, and an inherited label from the base image is what a scanner will read instead." >&2
            exit 1
          fi
          echo "sidecar revision stamp OK: $REVISION"

      - name: Build and Push Pubsub Platform Plugin (GHCR)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-pubsub-platform
        with:
          context: agentplugins/pubsub-platform
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/pubsub-platform:latest
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/pubsub-platform:${{ github.sha }}

      - name: Build and Push GKE Stockout Investigator Plugin (GHCR)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-stockout-investigator
        with:
          context: agentplugins/gke-stockout-investigator
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/gke-stockout-investigator:latest
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/gke-stockout-investigator:${{ github.sha }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the images
        env:
          PLATFORM_DIGEST: ${{ steps.build-platform.outputs.digest }}
          REPLAY_PROXY_DIGEST: ${{ steps.build-replay-proxy.outputs.digest }}
          CREDENTIAL_PROXY_DIGEST: ${{ steps.build-credential-proxy.outputs.digest }}
          PUBSUB_PLATFORM_DIGEST: ${{ steps.build-pubsub-platform.outputs.digest }}
          STOCKOUT_INVESTIGATOR_DIGEST: ${{ steps.build-stockout-investigator.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/$IMAGE_REPOSITORY/platform-agent@$PLATFORM_DIGEST"
          cosign sign --yes "ghcr.io/$IMAGE_REPOSITORY/replay-proxy@$REPLAY_PROXY_DIGEST"
          cosign sign --yes "ghcr.io/$IMAGE_REPOSITORY/credential-proxy@$CREDENTIAL_PROXY_DIGEST"
          cosign sign --yes "ghcr.io/$IMAGE_REPOSITORY/pubsub-platform@$PUBSUB_PLATFORM_DIGEST"
          cosign sign --yes "ghcr.io/$IMAGE_REPOSITORY/gke-stockout-investigator@$STOCKOUT_INVESTIGATOR_DIGEST"
