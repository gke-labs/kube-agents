name: Publish Images to GHCR

on:
  push:
    # Release lines too: a backport merged onto `release/<X.Y>` needs the
    # SHA-tagged images every rung of the release ladder checks for, and this is
    # the only workflow that publishes them. The pattern admits the line shape
    # alone: not the legacy per-release `release/<X.Y.Z>` branches of 0.1.0–0.7.0,
    # and not a misnamed `release/x`. Which release-branch pushes actually build
    # is the `decide` job's question. `:latest` still follows `main` alone; see
    # the `tags:` blocks below.
    branches: [main, "release/[0-9]+.[0-9]+"]

# Queue rather than cancel: every publish should complete, but not interleave.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  decide:
    name: Decide whether this push builds
    runs-on: ubuntu-latest
    if: github.repository == 'gke-labs/kube-agents'
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `main` always builds. A release branch builds only for a merge Tide
      # pushed (which also keeps out the GA tagger's stamped commit, pushed as
      # the release App), and never for a commit whose images already exist:
      # image tags are mutable, and rebuilding a commit `main` already
      # published would replace the manifests its validation was earned
      # against. The rules and their reasons are the script's.
      - name: Decide
        id: decide
        run: ./scripts/release/decide_image_publish.sh

  publish-operator:
    name: Publish Controller to GHCR
    runs-on: ubuntu-latest
    needs: decide
    if: github.repository == 'gke-labs/kube-agents' && needs.decide.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Downcase repository name
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          echo "IMAGE_REPOSITORY=$(echo "$GITHUB_REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Controller (GHCR)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-controller
        with:
          context: k8s-operator
          file: k8s-operator/Dockerfile
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/k8s-operator:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/k8s-operator:${{ github.sha }}
          build-args: |
            VERSION=latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Controller Image (GHCR)
        env:
          CONTROLLER_DIGEST: ${{ steps.build-controller.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/$IMAGE_REPOSITORY/k8s-operator@$CONTROLLER_DIGEST"

  publish-agents:
    name: Publish Agent Images to GHCR
    runs-on: ubuntu-latest
    needs: decide
    if: github.repository == 'gke-labs/kube-agents' && needs.decide.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load tags
        run: cat tags.env >> "$GITHUB_ENV"

      - name: Downcase repository name
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          echo "IMAGE_REPOSITORY=$(echo "$GITHUB_REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Platform Agent (GHCR)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-platform
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: platform
          # The images deploy to amd64 GKE nodes; the multi-arch bases otherwise
          # resolve to whatever the runner is (#560).
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/platform-agent:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/platform-agent:${{ github.sha }}
          # KUBE_AGENTS_VERSION is the commit SHA the image is tagged with: it
          # becomes the version in the User-Agent the agent's remote MCP calls
          # carry, so a request in a Google API log names the exact image.
          build-args: |
            HERMES_AGENT_TAG=${{ env.HERMES_AGENT_TAG }}
            KUBE_AGENTS_VERSION=${{ github.sha }}

      - name: Build and Push Replay Proxy (GHCR)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-replay-proxy
        with:
          context: examples/inference-replay/replay-proxy
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/replay-proxy:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/replay-proxy:${{ github.sha }}

      - name: Build and Push Credential Sidecar (GHCR)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-credential-proxy
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: credential-proxy
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/credential-proxy:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/credential-proxy:${{ github.sha }}
          build-args: |
            HERMES_AGENT_TAG=${{ env.HERMES_AGENT_TAG }}

      - name: Build and Push Agent Sandbox (GHCR)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-agent-sandbox
        with:
          context: .
          file: deploy/sandbox/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/agent-sandbox:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/agent-sandbox:${{ github.sha }}

      - name: Build and Push Pubsub Platform Plugin (GHCR)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-pubsub-platform
        with:
          context: agentplugins/pubsub-platform
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/pubsub-platform:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/pubsub-platform:${{ github.sha }}

      - name: Build and Push GKE Stockout Investigator Plugin (GHCR)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-stockout-investigator
        with:
          context: agentplugins/gke-stockout-investigator
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/gke-stockout-investigator:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/gke-stockout-investigator:${{ github.sha }}

      # The A2A next stack: the gateway, the callout, the verifier and the
      # console built from the a2a/ module root, the worker from the repository
      # root (it copies the broker shim from agents/platform/scripts; each
      # Dockerfile's header says which) and the Hermes bridge sidecar, which is
      # FROM the platform-agent image this same job pushed under this commit's
      # tag, never a registry default (a2a/Dockerfile.hermes-bridge refuses to
      # build without the arg). Hence its place after the platform step. The
      # operator derives the five it renders from its own image, else from
      # the agent image it resolves (registry and tag), so the tags here are
      # what a next install at this commit pulls.
      - name: Build and Push A2A Gateway (GHCR)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-a2a-gateway
        with:
          context: a2a
          file: a2a/Dockerfile.gateway
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/a2a-gateway:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/a2a-gateway:${{ github.sha }}

      - name: Build and Push A2A Worker (GHCR)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-a2a-worker
        with:
          context: .
          file: a2a/Dockerfile.worker
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/a2a-worker:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/a2a-worker:${{ github.sha }}

      - name: Build and Push A2A Auth Callout (GHCR)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-a2a-authcallout
        with:
          context: a2a
          file: a2a/Dockerfile.authcallout
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/a2a-authcallout:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/a2a-authcallout:${{ github.sha }}

      - name: Build and Push A2A Console (GHCR)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-a2a-console
        with:
          context: a2a
          file: a2a/Dockerfile.console
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/a2a-console:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/a2a-console:${{ github.sha }}

      - name: Build and Push A2A Capability Verifier (GHCR)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-a2a-verifier
        with:
          context: a2a
          file: a2a/Dockerfile.verifier
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/a2a-verifier:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/a2a-verifier:${{ github.sha }}

      - name: Build and Push Hermes Bridge (GHCR)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-hermes-bridge
        with:
          context: a2a
          file: a2a/Dockerfile.hermes-bridge
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/hermes-bridge:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/hermes-bridge:${{ github.sha }}
          build-args: |
            PLATFORM_AGENT_IMAGE=ghcr.io/${{ env.IMAGE_REPOSITORY }}/platform-agent:${{ github.sha }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Agent Images (GHCR)
        env:
          PLATFORM_DIGEST: ${{ steps.build-platform.outputs.digest }}
          REPLAY_PROXY_DIGEST: ${{ steps.build-replay-proxy.outputs.digest }}
          CREDENTIAL_PROXY_DIGEST: ${{ steps.build-credential-proxy.outputs.digest }}
          AGENT_SANDBOX_DIGEST: ${{ steps.build-agent-sandbox.outputs.digest }}
          PUBSUB_PLATFORM_DIGEST: ${{ steps.build-pubsub-platform.outputs.digest }}
          STOCKOUT_INVESTIGATOR_DIGEST: ${{ steps.build-stockout-investigator.outputs.digest }}
          A2A_GATEWAY_DIGEST: ${{ steps.build-a2a-gateway.outputs.digest }}
          A2A_WORKER_DIGEST: ${{ steps.build-a2a-worker.outputs.digest }}
          A2A_AUTHCALLOUT_DIGEST: ${{ steps.build-a2a-authcallout.outputs.digest }}
          A2A_CONSOLE_DIGEST: ${{ steps.build-a2a-console.outputs.digest }}
          A2A_VERIFIER_DIGEST: ${{ steps.build-a2a-verifier.outputs.digest }}
          HERMES_BRIDGE_DIGEST: ${{ steps.build-hermes-bridge.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/$IMAGE_REPOSITORY/platform-agent@$PLATFORM_DIGEST"
          cosign sign --yes "ghcr.io/$IMAGE_REPOSITORY/replay-proxy@$REPLAY_PROXY_DIGEST"
          cosign sign --yes "ghcr.io/$IMAGE_REPOSITORY/credential-proxy@$CREDENTIAL_PROXY_DIGEST"
          cosign sign --yes "ghcr.io/$IMAGE_REPOSITORY/agent-sandbox@$AGENT_SANDBOX_DIGEST"
          cosign sign --yes "ghcr.io/$IMAGE_REPOSITORY/pubsub-platform@$PUBSUB_PLATFORM_DIGEST"
          cosign sign --yes "ghcr.io/$IMAGE_REPOSITORY/gke-stockout-investigator@$STOCKOUT_INVESTIGATOR_DIGEST"
          cosign sign --yes "ghcr.io/$IMAGE_REPOSITORY/a2a-gateway@$A2A_GATEWAY_DIGEST"
          cosign sign --yes "ghcr.io/$IMAGE_REPOSITORY/a2a-worker@$A2A_WORKER_DIGEST"
          cosign sign --yes "ghcr.io/$IMAGE_REPOSITORY/a2a-authcallout@$A2A_AUTHCALLOUT_DIGEST"
          cosign sign --yes "ghcr.io/$IMAGE_REPOSITORY/a2a-console@$A2A_CONSOLE_DIGEST"
          cosign sign --yes "ghcr.io/$IMAGE_REPOSITORY/a2a-verifier@$A2A_VERIFIER_DIGEST"
          cosign sign --yes "ghcr.io/$IMAGE_REPOSITORY/hermes-bridge@$HERMES_BRIDGE_DIGEST"
