# The name is what autopush-deploy.yml's `workflow_run` trigger matches, so it
# stays though the images go to two registries.
name: Publish Images to GHCR

on:
  push:
    # Release lines too: a backport merged onto `release/<X.Y>` needs the
    # SHA-tagged images every rung of the release ladder checks for, and this is
    # the only workflow that publishes them. The pattern admits the line shape
    # alone: not the legacy per-release `release/<X.Y.Z>` branches of 0.1.0–0.7.0,
    # and not a misnamed `release/x`. Which release-branch pushes actually build
    # is the `decide` job's question. `:latest` still follows `main` alone; see
    # the `tags:` blocks below.
    branches: [main, "release/[0-9]+.[0-9]+"]

# Queue rather than cancel: every publish should complete, but not interleave.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Every image is pushed twice by the one build, so both registries hold it at
# one digest: to GHCR, and to the candidate repository, which an environment
# or the release reads commit images from when its registry variable names it.
# The images are there before this workflow completes, which is the event
# autopush-deploy.yml starts on. The signatures
# stay on the GHCR references: nothing verifies a commit image's signature,
# and a signing step that failed against a second registry would fail a
# publish whose images are already in place.
env:
  CANDIDATE_REGISTRY_PREFIX: us-docker.pkg.dev/kube-agents-prow/kube-agents-candidates
  CANDIDATE_REGISTRY_HOST: us-docker.pkg.dev

jobs:
  decide:
    name: Decide whether this push builds
    runs-on: ubuntu-latest
    if: github.repository == 'gke-labs/kube-agents'
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `main` always builds. A release branch builds only for a merge Tide
      # pushed (which also keeps out the GA tagger's stamped commit, pushed as
      # the release App), and never for a commit whose images already exist:
      # image tags are mutable, and rebuilding a commit `main` already
      # published would replace the manifests its validation was earned
      # against. The rules and their reasons are the script's.
      - name: Decide
        id: decide
        run: ./scripts/release/decide_image_publish.sh

  publish-operator:
    name: Publish Controller to GHCR
    runs-on: ubuntu-latest
    needs: decide
    if: github.repository == 'gke-labs/kube-agents' && needs.decide.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Downcase repository name
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          echo "IMAGE_REPOSITORY=$(echo "$GITHUB_REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # Base images and the builder image through mirror.gcr.io, as in
      # docker-build.yml: Docker Hub's per-IP anonymous limit failed five publishes
      # on main on 2026-10-09 (#2870).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config: .github/buildkitd.toml
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The identity copy-candidate-images.yml writes the candidate repository
      # with. Its credentials file lands in the workspace, which is a build
      # context below; .dockerignore keeps it out of every image.
      - name: Authenticate to Google Cloud for the candidate registry
        id: candidate-registry-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          workload_identity_provider: projects/125393897113/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-actions@kube-agents-prow.iam.gserviceaccount.com

      - name: Log in to the candidate registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.CANDIDATE_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.candidate-registry-auth.outputs.access_token }}

      - name: Build and Push Controller
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-controller
        with:
          context: k8s-operator
          file: k8s-operator/Dockerfile
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/k8s-operator:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/k8s-operator:${{ github.sha }}
            ${{ env.CANDIDATE_REGISTRY_PREFIX }}/k8s-operator:${{ github.sha }}
          build-args: |
            VERSION=latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign Controller Image (GHCR)
        env:
          CONTROLLER_DIGEST: ${{ steps.build-controller.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/$IMAGE_REPOSITORY/k8s-operator@$CONTROLLER_DIGEST"

  publish-agents:
    name: Publish Agent Images to GHCR
    runs-on: ubuntu-latest
    needs: decide
    if: github.repository == 'gke-labs/kube-agents' && needs.decide.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load tags
        run: cat tags.env >> "$GITHUB_ENV"

      - name: Downcase repository name
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          echo "IMAGE_REPOSITORY=$(echo "$GITHUB_REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # Base images and the builder image through mirror.gcr.io, as in
      # docker-build.yml: Docker Hub's per-IP anonymous limit failed five publishes
      # on main on 2026-10-09 (#2870).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config: .github/buildkitd.toml
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The identity copy-candidate-images.yml writes the candidate repository
      # with. Its credentials file lands in the workspace, which is a build
      # context below; .dockerignore keeps it out of every image.
      - name: Authenticate to Google Cloud for the candidate registry
        id: candidate-registry-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          workload_identity_provider: projects/125393897113/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-actions@kube-agents-prow.iam.gserviceaccount.com

      - name: Log in to the candidate registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.CANDIDATE_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.candidate-registry-auth.outputs.access_token }}

      - name: Build and Push Platform Agent
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-platform
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: platform
          # The images deploy to amd64 GKE nodes; the multi-arch bases otherwise
          # resolve to whatever the runner is (#560).
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/platform-agent:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/platform-agent:${{ github.sha }}
            ${{ env.CANDIDATE_REGISTRY_PREFIX }}/platform-agent:${{ github.sha }}
          # KUBE_AGENTS_VERSION is the commit SHA the image is tagged with: it
          # becomes the version in the User-Agent the agent's remote MCP calls
          # carry, so a request in a Google API log names the exact image.
          build-args: |
            HERMES_AGENT_TAG=${{ env.HERMES_AGENT_TAG }}
            KUBE_AGENTS_VERSION=${{ github.sha }}

      - name: Build and Push Replay Proxy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-replay-proxy
        with:
          context: examples/inference-replay/replay-proxy
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/replay-proxy:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/replay-proxy:${{ github.sha }}
            ${{ env.CANDIDATE_REGISTRY_PREFIX }}/replay-proxy:${{ github.sha }}

      - name: Build and Push Credential Sidecar
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-credential-proxy
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: credential-proxy
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/credential-proxy:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/credential-proxy:${{ github.sha }}
            ${{ env.CANDIDATE_REGISTRY_PREFIX }}/credential-proxy:${{ github.sha }}
          build-args: |
            HERMES_AGENT_TAG=${{ env.HERMES_AGENT_TAG }}

      - name: Build and Push Kube Proxy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-kube-proxy
        with:
          context: .
          file: deploy/kube-proxy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/kube-proxy:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/kube-proxy:${{ github.sha }}
            ${{ env.CANDIDATE_REGISTRY_PREFIX }}/kube-proxy:${{ github.sha }}
          # The SHA it is tagged with, for `k8s-api-proxy --version` and the startup log.
          build-args: |
            KUBE_AGENTS_VERSION=${{ github.sha }}

      - name: Build and Push Agent Sandbox
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-agent-sandbox
        with:
          context: .
          file: deploy/sandbox/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/agent-sandbox:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/agent-sandbox:${{ github.sha }}
            ${{ env.CANDIDATE_REGISTRY_PREFIX }}/agent-sandbox:${{ github.sha }}

      - name: Build and Push Pubsub Platform Plugin
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-pubsub-platform
        with:
          context: agentplugins/pubsub-platform
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/pubsub-platform:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/pubsub-platform:${{ github.sha }}
            ${{ env.CANDIDATE_REGISTRY_PREFIX }}/pubsub-platform:${{ github.sha }}

      - name: Build and Push GKE Stockout Investigator Plugin
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-stockout-investigator
        with:
          context: agentplugins/gke-stockout-investigator
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/gke-stockout-investigator:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/gke-stockout-investigator:${{ github.sha }}
            ${{ env.CANDIDATE_REGISTRY_PREFIX }}/gke-stockout-investigator:${{ github.sha }}

      # The A2A next stack: the gateway, the callout, the verifier, the
      # AgentProfile dispatcher, the console and the Teams inbound receiver built from the a2a/ module root, the worker from the repository
      # root (it copies the broker shim from agents/platform/scripts; each
      # Dockerfile's header says which) and the Hermes bridge sidecar, which is
      # FROM the platform-agent image this same job pushed under this commit's
      # tag, never a registry default (a2a/Dockerfile.hermes-bridge refuses to
      # build without the arg). Hence its place after the platform step. The
      # operator derives the seven it renders from its own image, else from
      # the agent image it resolves (registry and tag), so the tags here are
      # what a next install at this commit pulls.
      - name: Build and Push A2A Gateway
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-a2a-gateway
        with:
          context: a2a
          file: a2a/Dockerfile.gateway
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/a2a-gateway:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/a2a-gateway:${{ github.sha }}
            ${{ env.CANDIDATE_REGISTRY_PREFIX }}/a2a-gateway:${{ github.sha }}

      - name: Build and Push A2A Worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-a2a-worker
        with:
          context: .
          file: a2a/Dockerfile.worker
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/a2a-worker:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/a2a-worker:${{ github.sha }}
            ${{ env.CANDIDATE_REGISTRY_PREFIX }}/a2a-worker:${{ github.sha }}

      # The cluster agent's persona image (#3658): the persona directory is
      # the build context, and the image's /files is what a profile worker
      # pod mounts at /persona.
      - name: Build and Push Cluster Persona
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-persona-cluster
        with:
          context: agents/cluster/persona
          file: a2a/Dockerfile.persona-cluster
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/persona-cluster:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/persona-cluster:${{ github.sha }}
            ${{ env.CANDIDATE_REGISTRY_PREFIX }}/persona-cluster:${{ github.sha }}

      # The GKE Support Agent's persona image: the persona directory is the
      # build context, and the image's /files is what a profile worker pod
      # mounts at /persona.
      - name: Build and Push TSE Persona
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-persona-tse
        with:
          context: agents/tse/persona
          file: a2a/Dockerfile.persona-tse
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/persona-tse:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/persona-tse:${{ github.sha }}
            ${{ env.CANDIDATE_REGISTRY_PREFIX }}/persona-tse:${{ github.sha }}

      # The fleet-audit AgentProfile's persona image (#5623), the same shape:
      # text only, since its report scripts are in the worker image.
      - name: Build and Push Fleet Audit Persona
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-persona-fleet-audit
        with:
          context: agents/fleet-audit/persona
          file: a2a/Dockerfile.persona-fleet-audit
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/persona-fleet-audit:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/persona-fleet-audit:${{ github.sha }}
            ${{ env.CANDIDATE_REGISTRY_PREFIX }}/persona-fleet-audit:${{ github.sha }}

      - name: Build and Push A2A Auth Callout
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-a2a-authcallout
        with:
          context: a2a
          file: a2a/Dockerfile.authcallout
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/a2a-authcallout:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/a2a-authcallout:${{ github.sha }}
            ${{ env.CANDIDATE_REGISTRY_PREFIX }}/a2a-authcallout:${{ github.sha }}

      - name: Build and Push A2A Console
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-a2a-console
        with:
          context: a2a
          file: a2a/Dockerfile.console
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/a2a-console:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/a2a-console:${{ github.sha }}
            ${{ env.CANDIDATE_REGISTRY_PREFIX }}/a2a-console:${{ github.sha }}

      - name: Build and Push A2A Teams Inbound Receiver
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-a2a-teams-inbound
        with:
          context: a2a
          file: a2a/Dockerfile.teams-inbound
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/a2a-teams-inbound:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/a2a-teams-inbound:${{ github.sha }}
            ${{ env.CANDIDATE_REGISTRY_PREFIX }}/a2a-teams-inbound:${{ github.sha }}

      - name: Build and Push A2A Capability Verifier
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-a2a-verifier
        with:
          context: a2a
          file: a2a/Dockerfile.verifier
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/a2a-verifier:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/a2a-verifier:${{ github.sha }}
            ${{ env.CANDIDATE_REGISTRY_PREFIX }}/a2a-verifier:${{ github.sha }}

      - name: Build and Push A2A Profile Dispatcher
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-a2a-dispatcher
        with:
          context: a2a
          file: a2a/Dockerfile.dispatcher
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/a2a-dispatcher:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/a2a-dispatcher:${{ github.sha }}
            ${{ env.CANDIDATE_REGISTRY_PREFIX }}/a2a-dispatcher:${{ github.sha }}

      - name: Build and Push Hermes Bridge
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-hermes-bridge
        with:
          context: a2a
          file: a2a/Dockerfile.hermes-bridge
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/hermes-bridge:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/hermes-bridge:${{ github.sha }}
            ${{ env.CANDIDATE_REGISTRY_PREFIX }}/hermes-bridge:${{ github.sha }}
          build-args: |
            PLATFORM_AGENT_IMAGE=ghcr.io/${{ env.IMAGE_REPOSITORY }}/platform-agent:${{ github.sha }}

      - name: Build and Push Web Console
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-web-console
        with:
          context: a2a
          file: a2a/Dockerfile.web-console
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/web-console:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/web-console:${{ github.sha }}
            ${{ env.CANDIDATE_REGISTRY_PREFIX }}/web-console:${{ github.sha }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign Agent Images (GHCR)
        env:
          PLATFORM_DIGEST: ${{ steps.build-platform.outputs.digest }}
          REPLAY_PROXY_DIGEST: ${{ steps.build-replay-proxy.outputs.digest }}
          CREDENTIAL_PROXY_DIGEST: ${{ steps.build-credential-proxy.outputs.digest }}
          KUBE_PROXY_DIGEST: ${{ steps.build-kube-proxy.outputs.digest }}
          AGENT_SANDBOX_DIGEST: ${{ steps.build-agent-sandbox.outputs.digest }}
          PUBSUB_PLATFORM_DIGEST: ${{ steps.build-pubsub-platform.outputs.digest }}
          STOCKOUT_INVESTIGATOR_DIGEST: ${{ steps.build-stockout-investigator.outputs.digest }}
          A2A_GATEWAY_DIGEST: ${{ steps.build-a2a-gateway.outputs.digest }}
          A2A_WORKER_DIGEST: ${{ steps.build-a2a-worker.outputs.digest }}
          PERSONA_CLUSTER_DIGEST: ${{ steps.build-persona-cluster.outputs.digest }}
          PERSONA_TSE_DIGEST: ${{ steps.build-persona-tse.outputs.digest }}
          PERSONA_FLEET_AUDIT_DIGEST: ${{ steps.build-persona-fleet-audit.outputs.digest }}
          A2A_AUTHCALLOUT_DIGEST: ${{ steps.build-a2a-authcallout.outputs.digest }}
