name: Publish to GHCR

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

# Queue rather than cancel: every publish should complete, but not interleave.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-ghcr:
    runs-on: ubuntu-latest
    if: github.repository == 'gke-labs/kube-agents'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load tags
        run: cat tags.env >> "$GITHUB_ENV"

      - name: Downcase repository name
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          echo "IMAGE_REPOSITORY=$(echo "$GITHUB_REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Platform Agent (GHCR)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-platform
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: platform
          # The images deploy to amd64 GKE nodes; the multi-arch bases otherwise
          # resolve to whatever the runner is (#560).
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref_type == 'branch' && format('ghcr.io/{0}/platform-agent:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/platform-agent:${{ github.sha }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/{0}/platform-agent:{1}', env.IMAGE_REPOSITORY, github.ref_name) || '' }}
          build-args: |
            HERMES_AGENT_TAG=${{ env.HERMES_AGENT_TAG }}

      - name: Build and Push Replay Proxy (GHCR)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-replay-proxy
        with:
          context: examples/inference-replay/replay-proxy
          push: true
          tags: |
            ${{ github.ref_type == 'branch' && format('ghcr.io/{0}/replay-proxy:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/replay-proxy:${{ github.sha }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/{0}/replay-proxy:{1}', env.IMAGE_REPOSITORY, github.ref_name) || '' }}

      - name: Build and Push Credential Sidecar (GHCR)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-credential-proxy
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: credential-proxy
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref_type == 'branch' && format('ghcr.io/{0}/credential-proxy:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/credential-proxy:${{ github.sha }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/{0}/credential-proxy:{1}', env.IMAGE_REPOSITORY, github.ref_name) || '' }}
          build-args: |
            HERMES_AGENT_TAG=${{ env.HERMES_AGENT_TAG }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the images
        env:
          PLATFORM_DIGEST: ${{ steps.build-platform.outputs.digest }}
          REPLAY_PROXY_DIGEST: ${{ steps.build-replay-proxy.outputs.digest }}
          CREDENTIAL_PROXY_DIGEST: ${{ steps.build-credential-proxy.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/$IMAGE_REPOSITORY/platform-agent@$PLATFORM_DIGEST"
          cosign sign --yes "ghcr.io/$IMAGE_REPOSITORY/replay-proxy@$REPLAY_PROXY_DIGEST"
          cosign sign --yes "ghcr.io/$IMAGE_REPOSITORY/credential-proxy@$CREDENTIAL_PROXY_DIGEST"
