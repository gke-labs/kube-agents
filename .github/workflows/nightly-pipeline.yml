name: "Nightly: Pipeline"

# Builds a nightly environment from nothing, runs the full E2E matrix on it,
# and — if the matrix passes — applies that same composition to the two
# long-lived environments and promotes the candidate to staging, before
# destroying the nightly environment again.
#
# The two reconcile steps are what keeps the long-lived environments current.
# `rc` and `nightly` are rebuilt from terraform/examples/full-install every run
# and so always match main; `autopush` and `staging` are never rebuilt, so
# without a reconcile they receive image tags and nothing else and end up
# running last month's infrastructure while reporting themselves as main —
# #1117 found both of them a month behind. They reconcile HERE, after the
# matrix, rather than on their own schedule: applying
# a composition that has not been proved from scratch to an environment people
# live-test against is worse than leaving it stale.
#
# Nothing in it touches the RC environment. The three jobs that touch the
# nightly cluster — deploy, the matrix, teardown — bind `nightly` and take the
# `nightly-environment` lock, so none of them queues behind or races the
# three-hourly RC pipeline. Step 1 binds `nightly` for its variables without
# taking the lock; the promotion only pushes a Git tag, so it does neither; and
# the reconciles take their own environments' locks.
#
# Dispatch-only on purpose: turning the schedule on is its own decision and its
# own reviewable change. Exercise it by hand against the nightly project until it
# is boring, then add `cron: "0 2 * * *"`.

permissions:
  contents: read

on:
  #checkov:skip=CKV_GHA_7:Optional candidate override; the pipeline resolves the newest validated candidate when omitted
  workflow_dispatch:
    inputs:
      rc_tag:
        description: "Candidate rc_*_validated tag to test (optional; newest is used when omitted)"
        required: false
        default: ""
        type: string

# Distinct from the `nightly-environment` lock the called workflows take. That
# one is acquired and released three times over — by the deploy, the matrix and
# the teardown, whatever their step numbers happen to be — so a
# workflow pointed at the `nightly` environment can interleave in a gap. This
# group is held for the whole run, and it is what keeps the only thing that
# drives the environment end to end, another nightly, out of those gaps.
concurrency:
  group: nightly-pipeline
  cancel-in-progress: false

jobs:
  step-1-resolve-candidate:
    name: Step 1 - Resolve Promotion Candidate
    # A fork inherits workflow_dispatch but none of the credentials. The guard
    # repeats on each job rather than relying on the skip cascading through
    # `needs`: an `always()` added to a later job would silently un-guard it.
    if: github.repository == 'gke-labs/kube-agents'
    runs-on: ubuntu-latest
    # Bound for GH_ORG, GH_REPO and REGISTRY_PREFIX — which repository the tag
    # graph is read from, and where the candidate images are looked for. Resolving
    # those from a different scope than the deploy job would verify one registry
    # and install from another. An unbound job resolves every `vars.*` to empty in
    # silence, and GH_ORG and GH_REPO have no fallback.
    #
    # REGISTRY_PREFIX is set at no scope, so it arrives empty and
    # get_registry_prefix falls back to DEFAULT_REGISTRY_PREFIX. Binding is what
    # lets an environment override that, not what supplies it.
    environment: nightly
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      rc_tag: ${{ steps.resolve.outputs.rc_tag }}
      staging_tag: ${{ steps.resolve.outputs.staging_tag }}
      skip_pipeline: ${{ steps.resolve.outputs.skip_pipeline }}
      skip_promotion: ${{ steps.resolve.outputs.skip_promotion }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the newest validated candidate
        id: resolve
        env:
          RC_TAG: ${{ inputs.rc_tag }}
          GH_ORG: ${{ vars.GH_ORG }}
          GH_REPO: ${{ vars.GH_REPO }}
        run: ./scripts/release/resolve_promotion_candidate.sh

      # The candidate was validated hours or days ago and its images are what
      # the environment installs. A retention sweep or a registry problem
      # between then and now must fail here, before a cluster is built.
      - name: Verify candidate images are still in GHCR
        if: steps.resolve.outputs.skip_pipeline != 'true'
        env:
          COMMIT_SHA: ${{ steps.resolve.outputs.commit_sha }}
          GH_ORG: ${{ vars.GH_ORG }}
          GH_REPO: ${{ vars.GH_REPO }}
          REGISTRY_PREFIX: ${{ vars.REGISTRY_PREFIX }}
        run: ./scripts/release/verify_candidate_images.sh

      - name: Record what this run will do
        env:
          COMMIT_SHA: ${{ steps.resolve.outputs.commit_sha }}
          RC_TAG: ${{ steps.resolve.outputs.rc_tag }}
          STAGING_TAG: ${{ steps.resolve.outputs.staging_tag }}
          SKIP_PIPELINE: ${{ steps.resolve.outputs.skip_pipeline }}
          SKIP_PROMOTION: ${{ steps.resolve.outputs.skip_promotion }}
          SKIP_REASON: ${{ steps.resolve.outputs.skip_reason }}
        run: ./scripts/release/record_nightly_candidate_summary.sh

  step-2-deploy-env:
    name: Step 2 - Provision Nightly Environment
    needs: step-1-resolve-candidate
    if: |
      github.repository == 'gke-labs/kube-agents' &&
      needs.step-1-resolve-candidate.outputs.skip_pipeline != 'true'
    # `inherit` for the reason rc-release-pipeline.yml's step 2 records: the
    # called job declares an `environment:` and reads environment secrets
    # (GH_APP_ID, GH_APP_PRIVATE_KEY, GEMINI_API_KEY) from it. A `uses:` job
    # cannot declare an environment, so an explicit mapping here resolves at
    # repository scope and forwards empties.
    uses: ./.github/workflows/deploy-environment.yml # zizmor: ignore[secrets-inherit]
    permissions:
      contents: read
      id-token: write
    with:
      github_environment: "nightly"
      rc_tag: ${{ needs.step-1-resolve-candidate.outputs.commit_sha }}
    secrets: inherit

  step-3-run-e2e-matrix:
    name: Step 3 - Run Nightly E2E Matrix
    needs: [step-1-resolve-candidate, step-2-deploy-env]
    if: |
      github.repository == 'gke-labs/kube-agents' &&
      needs.step-1-resolve-candidate.outputs.skip_pipeline != 'true'
    uses: ./.github/workflows/e2e-run.yml # zizmor: ignore[secrets-inherit]
    permissions:
      contents: read
      id-token: write
    with:
      github_environment: "nightly"
      commit_sha: ${{ needs.step-1-resolve-candidate.outputs.commit_sha }}
      # The gate is only what has already passed on a real cluster. `rc` — Agent
      # API health, the fleet-audit ledger across all streams, and stockout
      # scenario 04 — runs on every RC pipeline and passes there. Gating on a
      # suite with no green run behind it means the first red night says nothing
      # about whether the candidate or the suite is bad, and staging stops moving
      # either way. Promote a suite in once it earns it; the bar is a green
      # nightly run with it in the optional list.
      blocking_suite: "rc"
      # Together these cover every file `nightly` holds that `rc` does not:
      # agentplugins_e2e_test.py, gchat_agent_test.py, and the stockout file
      # across every scenario rather than the one the gate pins.
      optional_suites: "agent-plugin,gchat,stockout-full"
      # Double the RC gate's 60: the same fixed provisioning cost, but all five
      # test files rather than one suite's worth.
      timeout_minutes: 120
    secrets: inherit

  step-4-reconcile-staging:
    name: Step 4 - Reconcile Staging Infrastructure
    needs: [step-1-resolve-candidate, step-3-run-e2e-matrix]
    # The implicit success() on `needs` is the gate, and it is the whole point
    # of putting this here rather than on a schedule: promoting a composition
    # that has not been proved from scratch into an environment agents live-test
    # against is strictly worse than leaving that environment stale.
    if: |
      github.repository == 'gke-labs/kube-agents' &&
      needs.step-1-resolve-candidate.outputs.skip_pipeline != 'true'
    # BEFORE the promotion job pushes its tag, deliberately. That tag starts
    # staging-redeploy-{agent,controller,integrations}.yml, all three of which
    # `helm upgrade` the same release the composition's helm_release.kube_agents
    # owns — so a reconcile running alongside them either fails on the release
    # lock or has its work re-tagged out from under it. Applying first and
    # tagging second leaves nothing to race: the redeploys then set image tags
    # the apply has already set.
    #
    # Staging as well as autopush, because the promotion below moves staging's
    # IMAGES and nothing else: reconciling autopush alone would leave staging's
    # INFRASTRUCTURE exactly as stale. That is #1117 §9.
    uses: ./.github/workflows/reconcile-environment.yml # zizmor: ignore[secrets-inherit]
    permissions:
      contents: read
      id-token: write
      actions: read
    with:
      github_environment: "staging"
      mode: "apply"
      # The candidate, because that is what this pipeline is promoting. autopush
      # below is the opposite case and passes nothing.
      image_tag: ${{ needs.step-1-resolve-candidate.outputs.commit_sha }}
      # A nightly that stops because somebody is live-testing has cost nothing:
      # the next one reconciles, and the drift report says so until one does.
      lease_policy: "defer"
    secrets: inherit

  step-5-promote-to-staging:
    name: Step 5 - Promote Candidate to Staging
    needs:
      [
        step-1-resolve-candidate,
        step-3-run-e2e-matrix,
        step-4-reconcile-staging,
      ]
    # step-4 is in `needs` for ORDER, not for outcome. The reconcile has to
    # finish before the tag is pushed — that tag starts three `helm upgrade`s on
    # the release `helm_release.kube_agents` owns, and applying into them races —
    # but a reconcile that FAILS must not take the image promotion with it.
    # The ways the reconcile can go red are wider than "the composition is bad":
    # a missing GitHub variable, an unreadable lease, a rotated minter key. None
    # of those says anything about the candidate, so coupling them would mean
    # every nightly silently dropping a promotion the matrix had just earned.
    #
    # `always() && !cancelled()` is what decouples it, and it removes the
    # implicit success() on every other `needs` along with it — so the matrix and
    # candidate gates are restated explicitly below rather than inherited. A red
    # matrix still promotes nothing.
    #
    # skip_promotion — the candidate already carries a staging tag — is checked on
    # the STEPS below rather than here, so the job runs and succeeds whenever its
    # gates pass. Gating the job would skip it, and a skipped job skips everything
    # that `needs` it.
    if: |
      always() && !cancelled() &&
      github.repository == 'gke-labs/kube-agents' &&
      needs.step-1-resolve-candidate.result == 'success' &&
      needs.step-3-run-e2e-matrix.result == 'success' &&
      needs.step-1-resolve-candidate.outputs.skip_pipeline != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # RELEASE_BOT_TOKEN, not GITHUB_TOKEN. A tag pushed with the default token
      # triggers no workflow, so staging-redeploy-*.yml would never start and
      # the promotion would go green having deployed nothing.
      - name: Checkout repository
        if: needs.step-1-resolve-candidate.outputs.skip_promotion != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN }}

      - name: Tag the candidate for staging
        if: needs.step-1-resolve-candidate.outputs.skip_promotion != 'true'
        env:
          COMMIT_SHA: ${{ needs.step-1-resolve-candidate.outputs.commit_sha }}
          RC_TAG: ${{ needs.step-1-resolve-candidate.outputs.rc_tag }}
          STAGING_TAG: ${{ needs.step-1-resolve-candidate.outputs.staging_tag }}
        run: ./scripts/release/tag_staging_promotion.sh

      - name: Record that nothing was promoted
        if: needs.step-1-resolve-candidate.outputs.skip_promotion == 'true'
        env:
          RC_TAG: ${{ needs.step-1-resolve-candidate.outputs.rc_tag }}
        run: |
          echo "Candidate ${RC_TAG} already carries a staging tag; the matrix ran, nothing was pushed." \
            >> "${GITHUB_STEP_SUMMARY}"

  step-6-reconcile-autopush:
    name: Step 6 - Reconcile Autopush Infrastructure
    needs: [step-1-resolve-candidate, step-3-run-e2e-matrix]
    # Same gate as staging's: only a composition the matrix has just built from
    # nothing and passed against gets applied to an environment people work in.
    if: |
      github.repository == 'gke-labs/kube-agents' &&
      needs.step-1-resolve-candidate.outputs.skip_pipeline != 'true'
    uses: ./.github/workflows/reconcile-environment.yml # zizmor: ignore[secrets-inherit]
    permissions:
      contents: read
      id-token: write
      actions: read
    with:
      github_environment: "autopush"
      mode: "apply"
      # No image tag, which is the difference from staging above. autopush
      # tracks main's TIP — every GHCR publish redeploys it — while this
      # pipeline is holding a candidate that was validated hours or days ago.
      # Passing that candidate would roll autopush's images backwards. Empty
      # makes this converge the infrastructure and leave the images alone.
      image_tag: ""
      lease_policy: "defer"
    secrets: inherit

  step-7-teardown-env:
    name: Step 7 - Tear Down Nightly Environment
    # The implicit success() on `needs` is the gate: a failure in resolve, deploy
    # or the matrix leaves the environment standing to be examined live. The `if:`
    # below adds to that check rather than replacing it — an `always()` here would
    # remove it and start destroying the environments this exists to preserve.
    #
    # The promotion and the two reconciles are deliberately absent from the list,
    # and for the same reason: none of them touches the NIGHTLY cluster, and
    # depending on them would strand a GKE cluster that nothing else reclaims —
    # this pipeline has no schedule, so there is no next run to clean up after
    # it. A staging apply that fails must not leave the nightly environment
    # standing. Running them concurrently is safe: this job holds the
    # nightly-environment lock and they hold their own environments'.
    needs: [step-1-resolve-candidate, step-2-deploy-env, step-3-run-e2e-matrix]
    if: |
      github.repository == 'gke-labs/kube-agents' &&
      needs.step-1-resolve-candidate.outputs.skip_pipeline != 'true'
    uses: ./.github/workflows/teardown-environment.yml
    permissions:
      contents: read
      id-token: write
    with:
      github_environment: "nightly"
      rc_tag: ${{ needs.step-1-resolve-candidate.outputs.commit_sha }}
