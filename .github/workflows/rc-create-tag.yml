name: "RC: Create Candidate Tag"

permissions:
  contents: read

on:
  #checkov:skip=CKV_GHA_7:Standalone launch requires target commit SHA and release candidate tag inputs
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Target Commit SHA to tag (Mandatory)"
        required: true
        type: string
      rc_tag:
        description: "Release Candidate Tag (Optional, Default: Auto-generated rc_YYMMDDHHMM)"
        required: false
        type: string
  workflow_call:
    inputs:
      commit_sha:
        description: "Target Commit SHA to tag (Optional for automated schedule, Mandatory for manual runs)"
        required: false
        type: string
      rc_tag:
        description: "Release Candidate Tag (Optional, Default: Auto-generated rc_YYMMDDHHMM)"
        required: false
        type: string
      is_scheduled:
        description: "Flag indicating whether run was triggered by automated cron schedule"
        required: false
        type: boolean
        default: false
    secrets:
      RELEASE_BOT_APP_PRIVATE_KEY:
        description: "Release Bot GitHub App Private Key"
        required: false
    outputs:
      commit_sha:
        value: ${{ jobs.create-tag.outputs.commit_sha }}
      rc_tag:
        value: ${{ jobs.create-tag.outputs.rc_tag }}
      skip_rc:
        value: ${{ jobs.create-tag.outputs.skip_rc }}

jobs:
  create-tag:
    runs-on: ubuntu-latest
    environment: rc
    permissions:
      contents: write
      # For the Google login the image check takes when the registry is an
      # Artifact Registry repository. A caller has to grant it too
      # (rc-release-pipeline.yml): a called workflow cannot hold a permission
      # its caller did not pass.
      id-token: write
    outputs:
      commit_sha: ${{ steps.resolve_target.outputs.commit_sha }}
      rc_tag: ${{ steps.resolve_target.outputs.rc_tag }}
      skip_rc: ${{ steps.resolve_target.outputs.skip_rc }}

    steps:
      - name: Generate Release Bot Token
        id: release-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}

      # Only when the environment's registry is an Artifact Registry
      # repository: the steps below that look for a commit's images then ask
      # that registry as the environment's deploy identity, which has to
      # hold read on it (registry_image_exists asks Artifact Registry over
      # its API with the job's Google credential, before docker). With
      # REGISTRY_PREFIX unset the check asks GHCR, which answers without a
      # login, and these two steps are skipped.
      - name: Authenticate to Google Cloud for the image check
        if: contains(vars.REGISTRY_PREFIX, '-docker.pkg.dev/')
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK for the image check
        if: contains(vars.REGISTRY_PREFIX, '-docker.pkg.dev/')
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Resolve Commit SHA and Tag Name
        id: resolve_target
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          RC_TAG: ${{ inputs.rc_tag }}
          IS_SCHEDULED: ${{ inputs.is_scheduled }}
          GH_ORG: ${{ vars.GH_ORG }}
          GH_REPO: ${{ vars.GH_REPO }}
          REGISTRY_PREFIX: ${{ vars.REGISTRY_PREFIX }}
        run: ./scripts/release/resolve_rc_tag.sh

      - name: Verify Prebuilt Container Images Exist in Registry
        if: steps.resolve_target.outputs.skip_rc != 'true'
        env:
          COMMIT_SHA: ${{ steps.resolve_target.outputs.commit_sha }}
          REGISTRY_PREFIX: ${{ vars.REGISTRY_PREFIX }}
        run: ./scripts/release/verify_candidate_images.sh

      - name: Create Git Tag & Push
        if: steps.resolve_target.outputs.skip_rc != 'true'
        env:
          COMMIT_SHA: ${{ steps.resolve_target.outputs.commit_sha }}
          RC_TAG: ${{ steps.resolve_target.outputs.rc_tag }}
          GH_ORG: ${{ vars.GH_ORG }}
          GH_REPO: ${{ vars.GH_REPO }}
        run: ./scripts/release/create_release_tag.sh
