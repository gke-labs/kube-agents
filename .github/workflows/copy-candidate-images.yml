name: Copy Images to the Candidate Repository

# Copies a published commit's images (not rebuilt) from GHCR into the candidate
# repository in Artifact Registry, under the same `:<sha>` tags and at the same
# digests, for a commit that is on GHCR and not there.
#
# "Publish Images to GHCR" pushes every commit it builds to the candidate
# repository itself, so nothing starts this on its own. A dispatch copies one
# commit by hand: one published by a release line whose own copy of the publish
# workflow pushes to GHCR, or a `main` commit published before the workflow
# pushed to the candidate repository.
# A copy is not signed: the publish workflow signs what it pushes itself.

on:
  #checkov:skip=CKV_GHA_7:A hand-started copy has to name the commit whose images it copies
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full commit SHA whose published images to copy"
        required: true
        type: string

permissions:
  contents: read

# One group per commit: a copy is never displaced by another commit's, and two
# for the same commit run one after the other.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  copy:
    name: Copy Images to the Candidate Repository
    runs-on: ubuntu-latest
    # A dispatch for a commit that was never published is not an error: the
    # script says it has nothing to copy.
    if: github.repository == 'gke-labs/kube-agents'
    # Room for a first copy with no layer in the destination yet; a commit
    # after it shares most of its layers and takes a fraction of this.
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      COMMIT_SHA: ${{ inputs.commit_sha }}
      CANDIDATE_REGISTRY_PREFIX: us-docker.pkg.dev/kube-agents-prow/kube-agents-candidates
    steps:
      # The scripts are the default branch's, on a dispatch from another ref
      # too (a dispatch still runs that ref's copy of this file), and never
      # the published commit's: this run holds a Google credential, and the
      # commit is only read for its image list, which the fetch below makes
      # available.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # The shape is checked here as well as in the script, because the fetch
      # comes first and a dispatch's input is free text.
      - name: Fetch the published commit
        run: |
          if ! [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Not a commit SHA::'$COMMIT_SHA' is not a full 40-character commit SHA."
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$COMMIT_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config: .github/buildkitd.toml
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          workload_identity_provider: projects/125393897113/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-actions@kube-agents-prow.iam.gserviceaccount.com

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Copy the images
        run: ./scripts/release/copy_candidate_images.sh "$COMMIT_SHA" "$CANDIDATE_REGISTRY_PREFIX"
