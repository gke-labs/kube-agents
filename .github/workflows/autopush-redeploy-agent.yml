name: Autopush Redeploy Agent

on:
  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["Publish to GHCR"]
    types:
      - completed

concurrency:
  group: autopush-redeploy-agent
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  call-deploy:
    # head_repository pins the triggering run to this repository: head_branch
    # alone would also match a fork branch that happens to be named "main".
    # The event clause narrows to the maintainer-only triggers a publisher may
    # declare, so adding a pull_request trigger upstream cannot reach this job.
    if: |
      github.repository == 'gke-labs/kube-agents' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main'
    uses: ./.github/workflows/reusable-deploy-agent.yml
    with:
      target_environment: "autopush"
      image_tag: ${{ github.event.workflow_run.head_sha }}
      checkout_sha: ${{ github.event.workflow_run.head_sha }}
