name: Autopush Redeploy Controller

on:
  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["Publish Controller to GHCR"]
    types:
      - completed

# The payload here is a `helm upgrade` on the shared `kube-agents` release.
# Cancelling one mid-flight strands the release in pending-upgrade and every
# later deploy fails until someone rolls it back by hand, so a running deploy
# is never cancelled. A queued one has not reached the cluster and is safe to
# supersede.
#
# Keep this group one component wide. GitHub holds only a single run pending
# per group, so a group shared with the sibling redeploys would let them evict
# each other and silently drop a deploy. They contend on the release lock
# instead, which scripts/helm_upgrade_retry.sh waits out.
concurrency:
  group: autopush-redeploy-controller
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  call-deploy:
    # head_repository pins the triggering run to this repository: head_branch
    # alone would also match a fork branch that happens to be named "main".
    # The event clause covers both triggers the publisher declares; dropping
    # workflow_dispatch would stop a manual publish from autodeploying.
    permissions:
      contents: read
      id-token: write
    if: |
      github.repository == 'gke-labs/kube-agents' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main'
    uses: ./.github/workflows/reusable-deploy-controller.yml
    with:
      target_environment: "autopush"
      image_tag: ${{ github.event.workflow_run.head_sha }}
      checkout_sha: ${{ github.event.workflow_run.head_sha }}
