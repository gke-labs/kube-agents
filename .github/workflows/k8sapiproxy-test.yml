name: k8s-api-proxy Tests

# gofmt, go vet and go test -race for the k8s-api-proxy/ Go module. No cluster
# and no credentials. A test that needs a real API server adds setup-envtest
# here in the same change, and fails rather than skips when the binaries are
# missing.
#
# The trigger arrangement is a2a-test.yml's, for the reasons its header
# comment gives: `Run k8s-api-proxy Tests` is a required check, so on a pull
# request and in the merge queue the job always starts and the `Detect changes`
# step decides whether to test, which keeps unrelated changes unblocked; on a
# push to main the `paths:` filter decides instead, which is what lets
# main-broken-notify.yml read the push history. Keep the `paths:` list and the
# `k8sapiproxy:` filter below identical; tests/test_push_paths_match_change_filter.py
# fails when they differ.
#
# gosec runs here, inside the required check, for the reason the header of
# k8s-operator-test.yml gives. This module declares no gosec of its own, so the
# binary is built from k8s-operator/go.mod's pin, which makes that module's
# go.mod and go.sum inputs of this check: a gosec bump there runs it here,
# instead of leaving a new finding for the next proxy pull request to inherit.
on:
  pull_request:
    branches: [main, "release/**"]
  merge_group:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "k8s-api-proxy/**"
      - "k8s-operator/go.mod"
      - "k8s-operator/go.sum"
      - ".github/workflows/k8sapiproxy-test.yml"
  workflow_dispatch:

# a2a-test.yml's concurrency block; its comment says why the key falls back to
# github.run_id.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Cap @actions/cache's wait on one cache segment so a restore the service
  # refuses costs a step about a minute, not the default ten. The rule, the
  # trade-off and the test that holds it: .agents/rules/github_actions.md,
  # "Cap the Actions cache segment download wait".
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"

jobs:
  test:
    name: Run k8s-api-proxy Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: k8s-api-proxy

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # No token, so the action diffs with git: .agents/rules/github_actions.md,
          # "Detect changed files with git, not the API".
          token: ""
          filters: |
            k8sapiproxy:
              - "k8s-api-proxy/**"
              - "k8s-operator/go.mod"
              - "k8s-operator/go.sum"
              - ".github/workflows/k8sapiproxy-test.yml"

      - name: Set up Go
        if: steps.filter.outputs.k8sapiproxy == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "k8s-api-proxy/go.mod"
          # Both modules: the gosec step below builds from the operator's.
          cache-dependency-path: |
            k8s-api-proxy/go.sum
            k8s-operator/go.sum

      - name: Check formatting
        if: steps.filter.outputs.k8sapiproxy == 'true'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        if: steps.filter.outputs.k8sapiproxy == 'true'
        run: go vet ./...

      # No exclusions: the G703/G706 reasoning in k8s-operator-test.yml is
      # about the operator's argv, not this module's.
      - name: Run gosec
        if: steps.filter.outputs.k8sapiproxy == 'true'
        run: |
          go -C ../k8s-operator build -o "$RUNNER_TEMP/gosec" github.com/securego/gosec/v2/cmd/gosec
          "$RUNNER_TEMP/gosec" ./...

      - name: Test
        if: steps.filter.outputs.k8sapiproxy == 'true'
        run: go test -race -count=1 ./...
