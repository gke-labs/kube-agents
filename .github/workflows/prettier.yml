name: Prettier Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    branches: [main]

# A re-push supersedes this pull request's earlier run instead of stacking a
# second full set of checks behind it. Runs that are not from a pull request
# fall back to github.run_id, which is unique, so each sits alone in its own
# group and none is ever cancelled. A shared key would not be safe there:
# GitHub holds only one run pending per group, so a burst of merges to main
# would lose the runs in the middle before they started.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install Prettier
        # Pinned: the manifests gate in k8s-operator-test.yml asserts
        # byte-equality against this version's output. Bump both together.
        run: npm install prettier@3.9.6

      - name: Run Prettier Check on changed files
        env:
          BASE_REF: ${{ github.base_ref }}
          # Set only on a merge-queue run, where github.base_ref is empty.
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ -n "$MERGE_GROUP_BASE_SHA" ]; then
            BASE="$MERGE_GROUP_BASE_SHA"
          else
            git fetch origin "$BASE_REF"
            BASE="origin/$BASE_REF"
          fi
          mapfile -t CHANGED_FILES < <(git diff --name-only --diff-filter=d "$BASE...HEAD" | grep -E '\.md$|\.yaml$|\.yml$' || true)
          if [ "${#CHANGED_FILES[@]}" -gt 0 ]; then
            printf 'Checking files:\n'
            printf '%s\n' "${CHANGED_FILES[@]}"
            npx prettier --check "${CHANGED_FILES[@]}"
          else
            echo "No markdown or YAML files changed."
          fi
