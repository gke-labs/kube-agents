name: Prettier Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install Prettier
        # Pinned: the manifests gate in k8s-operator-test.yml asserts
        # byte-equality against this version's output. Bump both together.
        run: npm install prettier@3.9.6

      - name: Run Prettier Check on changed files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          mapfile -t CHANGED_FILES < <(git diff --name-only --diff-filter=d "origin/$BASE_REF...HEAD" | grep -E '\.md$|\.yaml$|\.yml$' || true)
          if [ "${#CHANGED_FILES[@]}" -gt 0 ]; then
            printf 'Checking files:\n'
            printf '%s\n' "${CHANGED_FILES[@]}"
            npx prettier --check "${CHANGED_FILES[@]}"
          else
            echo "No markdown or YAML files changed."
          fi
