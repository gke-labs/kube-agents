name: Publish Controller to GHCR

on:
  push:
    branches: [main]
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

# Queue rather than cancel: every publish should complete, but not interleave.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish-controller-ghcr:
    runs-on: ubuntu-latest
    if: github.repository == 'gke-labs/kube-agents'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Downcase repository name
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          echo "IMAGE_REPOSITORY=$(echo "$GITHUB_REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Controller Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-controller
        with:
          context: k8s-operator
          file: k8s-operator/Dockerfile
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # :latest only ever tracks main. Gating on the ref (not ref_type)
          # keeps a workflow_dispatch run from a non-main branch from
          # republishing :latest with unreviewed code.
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/k8s-operator:latest', env.IMAGE_REPOSITORY) || '' }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/k8s-operator:${{ github.sha }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/{0}/k8s-operator:{1}', env.IMAGE_REPOSITORY, github.ref_name) || '' }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        env:
          CONTROLLER_DIGEST: ${{ steps.build-controller.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/$IMAGE_REPOSITORY/k8s-operator@$CONTROLLER_DIGEST"
