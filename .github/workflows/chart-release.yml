name: Publish Helm Charts to OCI (GHCR)

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

# Queue rather than cancel re-runs of the same tag. Different tags still run
# in parallel, which is fine: each publishes its own immutable chart version.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-charts:
    runs-on: ubuntu-latest
    if: github.repository == 'gke-labs/kube-agents'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Log in to GHCR via Helm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Lint, Package and Push Canonical Chart
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          REPO_DOWNCASE=$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          # Required harness values have no defaults; lint needs stand-ins.
          helm lint charts/kube-agents \
            --set platformAgent.harness.clusterName=ci-cluster \
            --set platformAgent.harness.location=us-central1 \
            --set platformAgent.harness.projectId=ci-project
          mkdir -p /tmp/charts
          helm package charts/kube-agents --version "$VERSION" --app-version "$VERSION" --destination /tmp/charts
          # Capture the pushed digest so the sign step can sign exactly this
          # artifact rather than whatever the mutable version tag points at.
          # (Guarded assignment: under set -e a plain VAR=$(...) would exit
          # before the output could be echoed on failure.)
          if ! PUSH_OUTPUT=$(helm push "/tmp/charts/kube-agents-${VERSION}.tgz" "oci://ghcr.io/${REPO_DOWNCASE}/charts" 2>&1); then
            echo "$PUSH_OUTPUT"
            echo "helm push failed" >&2
            exit 1
          fi
          echo "$PUSH_OUTPUT"
          CHART_DIGEST=$(echo "$PUSH_OUTPUT" | awk '/^Digest:/ {print $2}')
          if [ -z "$CHART_DIGEST" ]; then
            echo "could not extract chart digest from helm push output" >&2
            exit 1
          fi
          echo "CHART_DIGEST=$CHART_DIGEST" >> "$GITHUB_ENV"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Helm's registry login lands in Helm's own config file, which cosign
      # does not read; cosign needs credentials in the Docker keychain.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign the chart
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          REPO_DOWNCASE=$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes "ghcr.io/${REPO_DOWNCASE}/charts/kube-agents@${CHART_DIGEST}"
