name: Validate Repo Structure

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # A job of its own rather than a step in `validate` below, for two reasons.
  # It needs none of that job's setup -- no Helm, no Terraform, no pip, just the
  # preinstalled python3 -- so it reports in seconds instead of waiting behind
  # them. And a step would be masked: a broken `terraform fmt` means these
  # findings never print, the author fixes Terraform, pushes, and only then
  # discovers the prompt errors. A separate job gets its own status line and
  # cannot be hidden by a failure it has nothing to do with.
  #
  # Deliberately unfiltered. A paths filter is precisely what kept the Python
  # suite from running at all (see python-tests.yml), and a check on prose that
  # only starts when prose changes would miss the rename that broke it -- that
  # rename lands in a directory name.
  prompt-assets:
    name: Agent instructions cite assets that exist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Findings are emitted as GitHub annotations as well as to stderr, so a
      # broken reference lands on the line that holds it in Files Changed. This
      # layer has no human reader at review time; a red check the author has to
      # go digging in a log for is most of the way to no check at all.
      - name: Check prompt assets
        run: make prompt-check

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Structure
        run: make validate

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Check chart CRD/RBAC copies are in sync
        run: make chart-check

      - name: Check the install surfaces agree
        run: make iac-parity-check

      - name: Validate Helm Chart
        run: |
          # clusterName/location/projectId are required values with no
          # defaults, so lint and render need them set.
          SET_FLAGS=(
            --set platformAgent.harness.clusterName=ci-cluster
            --set platformAgent.harness.location=us-central1
            --set platformAgent.harness.projectId=ci-project
          )
          helm lint charts/kube-agents "${SET_FLAGS[@]}"
          helm template test-release charts/kube-agents "${SET_FLAGS[@]}" > /dev/null
          # Render again with explicit image tags to cover the override path.
          helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            --set operator.image.tag=v9.9.9 \
            --set platformAgent.deployment.image.tag=v9.9.9 > /dev/null
          # Rendering without the required values must fail.
          if helm template test-release charts/kube-agents > /dev/null 2>&1; then
            echo "expected 'required' guards to fail the render" >&2
            exit 1
          fi

          # kube-agents.compactFields keeps `false` and `0` — the whole reason
          # it exists over `with`, and the one thing here no other check covers.
          # A regression drops an explicit `dashboardEnabled: false` from the CR,
          # the CRD default of `true` applies, and the render stays valid YAML:
          # lint passes, iac-parity-check passes (it reads values.yaml, not the
          # render), and the dashboard comes up on an install that asked for it
          # off.
          # --show-only isolates the CR: `memory:` also appears in every
          # resources block, and matching one of those would make this pass for
          # the wrong reason.
          rendered=$(helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            --show-only templates/platform-agent-cr.yaml \
            --set platformAgent.harness.hermes.dashboardEnabled=false \
            --set platformAgent.harness.memory.enabled=false \
            --set platformAgent.deployment.availability.replicas=0)
          for expected in "dashboardEnabled: false" "memoryEnabled: false" "replicas: 0"; do
            if ! grep -qF "$expected" <<<"$rendered"; then
              echo "compactFields dropped '$expected' from the rendered CR" >&2
              exit 1
            fi
          done

          # ...and the parent key disappears when every child is unset, which is
          # what lets callers write `{{- with (include ...) }}`. hermes is not in
          # this list: it carries a mandatory apiServerSecretRef and so always
          # renders — only the optional fields inside it are compacted.
          if helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            --show-only templates/platform-agent-cr.yaml \
            | grep -qE "^\s+(memory|availability):"; then
            echo "an all-unset parent block still rendered" >&2
            exit 1
          fi

          # Webhooks: off by default, fully wired when on.
          if helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            | grep -qE "WebhookConfiguration|kind: Certificate"; then
            echo "webhook objects rendered while operator.webhooks.enabled=false" >&2
            exit 1
          fi
          webhooks=$(helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            --set operator.webhooks.enabled=true)
          for expected in \
            "kind: MutatingWebhookConfiguration" \
            "kind: ValidatingWebhookConfiguration" \
            "kind: Certificate" \
            "kind: Issuer" \
            "cert-manager.io/inject-ca-from:" \
            "containerPort: 10250" \
            "/tmp/k8s-webhook-server/serving-certs"; do
            if ! grep -qF "$expected" <<<"$webhooks"; then
              echo "webhook render is missing '$expected'" >&2
              exit 1
            fi
          done
          if ! grep -qF 'value: "true"' <<<"$(grep -A1 ENABLE_WEBHOOKS <<<"$webhooks")"; then
            echo "ENABLE_WEBHOOKS did not follow operator.webhooks.enabled" >&2
            exit 1
          fi

          # failurePolicy=Fail on a fresh install that also creates the CR
          # deadlocks (Helm registers the webhooks before the operator holds a
          # certificate), so the chart must refuse to render it.
          if helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            --set operator.webhooks.enabled=true \
            --set operator.webhooks.failurePolicy=Fail > /dev/null 2>&1; then
            echo "expected the fresh-install failurePolicy=Fail guard to fire" >&2
            exit 1
          fi
          # The same combination is fine without the CR, and on an upgrade.
          helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            --set operator.webhooks.enabled=true \
            --set operator.webhooks.failurePolicy=Fail \
            --set platformAgent.enabled=false > /dev/null
          helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            --set operator.webhooks.enabled=true \
            --set operator.webhooks.failurePolicy=Fail --is-upgrade > /dev/null

          # The pre-delete cleanup hook: on by default, gone when disabled, and
          # carrying the `|| true` that keeps a wait timeout from failing the
          # hook and aborting the uninstall — the hook's whole contract.
          hook=$(helm template test-release charts/kube-agents "${SET_FLAGS[@]}")
          for expected in \
            "helm.sh/hook: pre-delete" \
            "|| true"; do
            if ! grep -qF "$expected" <<<"$hook"; then
              echo "cleanup hook render is missing '$expected'" >&2
              exit 1
            fi
          done
          if helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            --set platformAgent.cleanupHook.enabled=false \
            | grep -qF "helm.sh/hook: pre-delete"; then
            echo "cleanup hook rendered while platformAgent.cleanupHook.enabled=false" >&2
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"

      - name: Enable Terraform plugin cache
        # Terraform does not tilde-expand TF_PLUGIN_CACHE_DIR, so the path
        # must be absolute — set it from $HOME at runtime.
        run: |
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.terraform.d/plugin-cache"

      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles('terraform/modules/*/versions.tf', 'terraform/examples/*/providers.tf') }}

      - name: Validate Terraform Modules
        run: |
          terraform fmt -check -recursive terraform/
          for dir in terraform/modules/* terraform/examples/*; do
            if [ -d "$dir" ]; then
              echo "Validating $dir..."
              (cd "$dir" && terraform init -backend=false && terraform validate)
            fi
          done
