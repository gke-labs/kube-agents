# Each ecosystem below names its directories explicitly and batches everything
# it finds into one grouped pull request. Both are deliberate.
#
# Globbed directories (`/**/*`) recreate #763: pip's parser follows the
# `-r admin_console/requirements.txt` include at the root, so a root job and an
# `/admin_console` job edit the same file and open two pull requests for one
# change. Add a directory only after checking that no other entry already
# reaches the manifest it holds.
#
# Without `groups`, five ecosystems at five pull requests each is a ceiling of
# 25 open at once -- 20 of them arrived in three minutes the first time this
# config ran. A catch-all group per ecosystem makes that one pull request per
# ecosystem per week.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # Every go.mod in the tree is listed here by path. A new one is added to this
  # list by hand rather than picked up by a glob (see #763 above).
  - package-ecosystem: "gomod"
    directories:
      - "/k8s-operator"
      - "/a2a"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "ci"
    groups:
      gomod:
        patterns:
          - "*"

  # "/" covers requirements-test.txt and, through its `-r` include,
  # admin_console/requirements.txt -- naming /admin_console as well is what
  # opened #763 and #764 for the same httpx bump. /bench is left out on
  # purpose: bench/pyproject.toml pins devops-bench to a git SHA that its own
  # comment says to bump deliberately.
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/tests/e2e"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "ci"
    # There is no mcp rule here any more, and its absence is deliberate.
    # requirements-test.txt used to hold `mcp<2` to match a runtime image on
    # 1.28.1, and this list carried a `>=2` ignore because #751 widened that
    # ceiling to <3 and nothing caught it. Hermes v2026.8.19 moved the base to
    # mcp 2.0.0, hermes-agent's own code and our three servers were ported to
    # `mcp.server.MCPServer` with it (#800), and the constraint is now a `>=2`
    # floor. Re-adding the old ignore would pin the package to the 1.x line the
    # image no longer has. What stops a silent regression now is
    # agents/platform/scripts/test_mcp_package_contract.py, which fails by name
    # rather than falling back to a stub.
    #
    # admin_console/requirements.txt caps websockets below 17. The cap was
    # Streamlit's: 1.62.0 required websockets<17,>=12.0.0, and raising the
    # floor past it did not go merely untested -- it made the file
    # unresolvable. #830 hit it and restored the cap; #1002 proposed
    # `websockets>=17.0.1,<18` anyway and pip answered ResolutionImpossible,
    # taking the Python unit tests with it. Streamlit 1.65.0, the console's
    # floor, allows websockets<18, so the cap is now ours and its lift is a
    # change of its own, with a run of the console's proxy on the 17 line;
    # until then the rule stays. `versions` and not `update-types`: a
    # semver-major comparison needs a resolved current version, and the cap is
    # a bare range rather than an `==` pin, so there is none. Remove this rule
    # and lift the pin in one change.
    #
    # admin_console/requirements.txt also caps streamlit below 1.66.0: that
    # release keeps AppTest page state between runs and the console's
    # connect-job UI tests fail on it, so a grouped bump that reaches it drags
    # the whole python group red. Same `versions` form as above, since this
    # cap is a bare range too. Remove this rule and that cap in one change,
    # once the console's tests pass on the new line; that lift is independent
    # of the websockets one.
    ignore:
      - dependency-name: "websockets"
        versions:
          - ">=17"
      - dependency-name: "streamlit"
        versions:
          - ">=1.66"
    groups:
      python:
        patterns:
          - "*"

  # The docs site holds the only package.json with dependencies to update. The
  # gke-app-onboarding scaffold's declares none, so the old glob covered it
  # without ever having anything to propose.
  - package-ecosystem: "npm"
    directory: "/docs/site"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "ci"
    groups:
      npm:
        patterns:
          - "*"

  # This directory holds a literal FROM pin that images.json does not cover:
  # an alpine base in an e2e fixture. The gke-app-onboarding skill's Dockerfile
  # also has a literal pin, but it is generated from google/skills plus a patch
  # (scripts/skill_overlay.py), so a bump there edits that patch; a Dependabot
  # PR against the generated file would fail `make skills-check`.
  #
  # Every other Dockerfile is either out of reach or excluded on purpose. The
  # images this repository builds interpolate two ARGs each
  # (`FROM ${GOLANG_IMAGE}:${GOLANG_VERSION}`), which the Docker updater cannot
  # resolve; images.json and `make mirror-images` own those pins. The
  # agentplugins Dockerfiles are `FROM busybox:musl@sha256:…`, a literal digest
  # the updater could move, and are left out because images.json owns that pin
  # (its `busybox` entry) and `make images-check` holds the three copies in
  # step; a bump lands in all of them at once, by hand. Naming the
  # directory, rather than globbing, is what keeps this from recreating #763.
  - package-ecosystem: "docker"
    directories:
      - "/tests/e2e/operator/templates/plugin_src"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "ci"
    groups:
      docker:
        patterns:
          - "*"
