# zizmor: ignore[dependabot-cooldown]
version: 2
# zizmor: ignore[dependabot-cooldown]
updates: # zizmor: ignore[dependabot-cooldown]
  # GitHub Actions Workflows
  # zizmor: ignore[dependabot-cooldown]
  - package-ecosystem: "github-actions" # zizmor: ignore[dependabot-cooldown]
    # zizmor: ignore[dependabot-cooldown]
    directory: "/"
    # zizmor: ignore[dependabot-cooldown]
    schedule: # zizmor: ignore[dependabot-cooldown]
      # zizmor: ignore[dependabot-cooldown]
      interval: "weekly" # zizmor: ignore[dependabot-cooldown]
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"

