{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ default (printf "%s-stockout-credentials" .Release.Name) .Values.secret.name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  key.json: {{ .Values.secret.gcpServiceAccountKey | b64enc | quote }}
{{- end }}
