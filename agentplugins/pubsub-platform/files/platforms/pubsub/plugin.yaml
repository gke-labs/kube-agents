name: pubsubplatform
label: PubSub
kind: platform
version: 1.0.0
description: >
  Google Cloud Pub/Sub platform adapter for Hermes Agent.
  Listens to Pub/Sub subscriptions and routes alert notifications
  to specific agent runs.
author: Nous Research
requires_env: []
# No credential: the adapter pulls through the credential broker's Pub/Sub
# relay (PUBSUB_RELAY_URL, set by the operator), on the install's identity.
optional_env: []
