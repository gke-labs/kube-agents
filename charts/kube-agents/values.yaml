# Cluster-wide ValidatingAdmissionPolicies that backstop agent RBAC at apply
# time: read verbs only, no Secrets, and no cluster-scoped binding to a
# namespace-tier agent ServiceAccount. Read the header of
# templates/agent-rbac-admission-policy.yaml before relying on them — notably,
# they cannot check the rules of a *referenced* Role, and the content policy is
# evadable by a manifest that carries neither the `kube-agents/tier` label nor
# the `*-agent` naming convention.
#
# You do not need to turn this off for an old cluster: the template also checks
# `.Capabilities.KubeVersion` and renders nothing below Kubernetes 1.30, where
# the policy API is not yet v1 and the objects would fail to apply. Turn it off
# for a second kube-agents release in a cluster that already has these — they
# are cluster singletons with fixed names, so Helm refuses the second install on
# ownership rather than duplicating them.
#
# What the policies do and do not enforce is in the header of
# templates/agent-rbac-admission-policy.yaml. Read it before relying on them:
# on a default install with no GitOps overlay, the content policy matches
# nothing the operator creates.
admissionPolicy:
  enabled: true

global:
  # Registry prefix for the images built from this repo (operator, agent,
  # credential proxy). Empty leaves them on the public defaults below.
  #
  # Setting this rewrites every image onto the prefix keeping the trailing
  # name only, which is the layout `make mirror-images` writes:
  #   ghcr.io/gke-labs/kube-agents/platform-agent
  #     -> registry.example.com/kube-agents/platform-agent
  # It also reaches the images the chart does not render itself — the agent
  # and logging-sidecar references the operator resolves at runtime — so a
  # PlatformAgent created without an explicit spec.deployment.image still
  # pulls from the mirror.
  imageRegistry: ""
  # Registry prefix for images this project does not build (LiteLLM,
  # fluent-bit). Defaults to imageRegistry; set it only when the mirror keeps
  # third-party images under a different path.
  thirdPartyImageRegistry: ""
  # Secrets holding credentials for a mirror that has to be authenticated to
  # (Harbor, Artifactory). Leave empty when the nodes can read it themselves —
  # an Artifact Registry in the same project, or a pull-through cache.
  #
  # An entry is either a bare name or the {name: <secret>} map Kubernetes' own
  # PodSpec uses; both render the same. Anything else fails the render rather
  # than reaching a pod, because a Secret reference that does not resolve is a
  # silent fallback to an anonymous pull.
  #
  # Referenced, not created: each Secret must already exist in the namespace of
  # the pod that needs it. That is the release namespace for everything this
  # chart renders, and the agent's own namespace for a PlatformAgent written
  # elsewhere against the IMAGE_PULL_SECRETS default below — imagePullSecrets
  # is a name, not a cross-namespace reference, so a fleet default needs the
  # Secret in every namespace that runs an agent. Create the namespace and the
  # Secret before installing, since a pod that cannot pull cannot wait for one
  # to appear:
  #
  #   kubectl create namespace kubeagents-system
  #   kubectl create secret docker-registry regcred -n kubeagents-system \
  #     --docker-server=registry.example.com --docker-username=... --docker-password=...
  #
  # This reaches every pod of the release AND the agent pods the operator
  # renders later: it is passed on as IMAGE_PULL_SECRETS on the controller
  # manager and set on the PlatformAgent CR. A PlatformAgent that sets
  # spec.deployment.imagePullSecrets itself replaces this rather than adding
  # to it.
  #
  # It does NOT reach the cert-manager release that
  # terraform/examples/full-install installs alongside — a separate release of
  # an upstream chart, on the same terms as imageRegistry.
  imagePullSecrets: []

operator:
  enabled: true
  # Extra environment variables for the controller manager. The image
  # overrides the operator reads (PLATFORM_AGENT_IMAGE, FLUENT_BIT_IMAGE) are
  # rendered from global.imageRegistry and the image values below, so a
  # mirrored install does not need to hand-write them; anything set here is
  # appended afterwards and therefore still wins.
  extraEnv: []
  image:
    repository: ghcr.io/gke-labs/kube-agents/k8s-operator
    tag: "" # defaults to Chart.appVersion
    pullPolicy: IfNotPresent
  replicaCount: 1
  podDisruptionBudget:
    # Renders maxUnavailable: 1 at any replicaCount. The budget is deliberately
    # not configurable: minAvailable is the shape that deadlocks node drains,
    # and the audit SOP this project ships rules it out at every replica count
    # (obtainability_audit_sop.md 3.3).
    enabled: true
  # Admission webhooks for the PlatformAgent CR — defaulting, validation, and
  # delete protection, mirroring k8s-operator/config/webhook. Without them the
  # CRD's CEL rules and OpenAPI defaults still apply; everything the webhook
  # adds on top does not.
  webhooks:
    # Off by default, unlike the kustomize install path. The webhooks need a
    # serving certificate, cert-manager is what issues it, and the chart cannot
    # install cert-manager for you: a release that shipped a Certificate into a
    # cluster without the CRD would fail at apply time for every existing user.
    # terraform/examples/full-install installs cert-manager and turns this on.
    enabled: false
    certManager:
      # Render the self-signed Issuer, the Certificate, and the
      # cert-manager.io/inject-ca-from annotation that fills in each webhook
      # configuration's caBundle. This is the only certificate source the chart
      # knows how to build, and it needs cert-manager's CRDs to already exist in
      # the cluster.
      #
      # Turning it off leaves the Service, the webhook configurations, and the
      # manager's cert mount in place and makes the certificate somebody else's
      # job: provide a Secret named <release>-webhook-certs holding tls.crt and
      # tls.key valid for <release>-webhook-service.<namespace>.svc, and inject
      # the matching caBundle into both webhook configurations. Neither is
      # rendered here, so a mistake cannot fail the install — and under the
      # default failurePolicy of Ignore it does not fail admission either: the
      # API server's call to the webhook fails and the object is admitted
      # anyway, with validation and defaulting silently skipped. Set
      # failurePolicy=Fail if you want a broken certificate to surface as
      # rejected admissions instead.
      enabled: true
    # What the API server does when the webhook is unreachable.
    #
    # `Ignore` here where the kustomize copy says `Fail`, and the reason is Helm's
    # apply order rather than a difference of opinion about safety. Helm applies
    # Mutating/ValidatingWebhookConfiguration before both the Certificate and the
    # PlatformAgent CR, so on a fresh install the webhooks are registered while
    # the operator is still waiting for a cert cert-manager has not issued yet.
    # Under `Fail` the API server would then reject this chart's own PlatformAgent
    # CR and the install would deadlock every time. The kustomize path did not
    # hit this because its operator deploy waited for the operator to be
    # Available before a later step applied the CR.
    #
    # What `Ignore` costs: a PlatformAgent written while the operator is down is
    # admitted without the webhook's defaulting and validation. The CRD's CEL
    # rules and OpenAPI defaults still apply, and the operator's own fallbacks
    # cover the fields the mutating webhook would have set.
    #
    # Set `Fail` for the kustomize guarantee. It is safe in a release that does
    # not also create the CR (platformAgent.enabled=false), and after the first
    # install once the operator is serving.
    failurePolicy: Ignore
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

telemetry:
  # Where OpenTelemetry signals go. One setting, three consumers: the PlatformAgent CR,
  # the LiteLLM gateway's exporter, and the NetworkPolicy that has to allow the egress.
  # They move together on purpose — a release where the agent exports to one collector
  # and the policy only opens the other's namespace drops every span.
  #
  #   ""      the chart decides nothing. The CR omits spec.telemetry, so the operator
  #           discovers an in-cluster collector and falls back to the GKE managed one;
  #           LiteLLM and the NetworkPolicy keep the GKE managed collector.
  #   set     pins all three. Setting it also SUPPRESSES operator discovery, because a
  #           chart that has already answered the question must not be second-guessed.
  #
  # Give the base URL of an OTLP/HTTP receiver — the per-signal path ("/v1/traces") is
  # appended by the exporters. A gRPC-only collector (port 4317) will not work.
  otlpEndpoint: ""
  # The namespace the NetworkPolicy opens OTLP egress to. Derived from otlpEndpoint when
  # it names an in-cluster Service (<svc>.<ns>.svc.cluster.local); set it explicitly for
  # any endpoint that is not a cluster-local Service name, or the render fails rather
  # than emit a policy that blocks the collector you just configured.
  collectorNamespace: ""

litellm:
  # The agent's baked default model endpoint is
  # http://litellm.kubeagents-system.svc.cluster.local/v1 (see
  # deploy/shared/defaults/config.yaml), so a working install needs this
  # gateway. Disable only if you run your own LiteLLM (or point the agent
  # elsewhere). Mirrors k8s-operator/config/integrations/litellm/base.
  # NOTE: the namespace in that endpoint is baked — installing the release
  # into any namespace other than kubeagents-system leaves the agent unable
  # to reach the gateway rendered here.
  enabled: true
  # LLM-call telemetry to the GKE Managed OpenTelemetry collector
  # (Cloud Trace/Logging). Off by default: on clusters without the collector
  # (no gke-managed-otel namespace — e.g. a fresh gke-cluster-module cluster)
  # the otel callback's DNS failure aborts every LLM request. Enable it once
  # the managed collector exists; the NetworkPolicy already allows the egress.
  otel: false
  # model-default routes to <modelProvider>/<modelDefaultName>. Providers:
  # gemini, anthropic, openai, vertex_ai. The provider's API key must exist in
  # the credentials Secret — except vertex_ai, which authenticates with
  # Workload Identity instead.
  modelProvider: gemini
  # Empty selects the per-provider default (mirrors common.sh).
  modelDefaultName: ""
  # modelProvider: vertex_ai only. The gateway calls
  # projects/<projectId>/locations/<location> as a GSA reached through Workload
  # Identity, so the chart always creates this KSA — no operator reconciles it.
  vertex:
    serviceAccountName: kubeagents-litellm
    #   iam.gke.io/gcp-service-account: <GSA>@<project>.iam.gserviceaccount.com
    serviceAccountAnnotations: {}
    # projectId empty defaults to platformAgent.harness.projectId. location
    # empty defaults to "global", not the harness location: a model is only
    # callable from a location that serves it, and the cluster's is often not
    # one — on a zonal cluster it is not even a valid Vertex location. The
    # global endpoint gives no in-region ML processing guarantee, and a Model
    # Garden partner model may be served only from specific regions; set a
    # region here for either reason.
    projectId: ""
    location: ""
  # Keep in step with the kustomize base
  # (k8s-operator/config/integrations/litellm/base/deployment.yaml), which is
  # the dev copy of this gateway.
  image:
    repository: ghcr.io/berriai/litellm
    # Keep in step with images.json, which is what `make mirror-images`
    # copies: a chart pinned to a version the mirror was never populated with
    # is an ImagePullBackOff. This pin sat a release behind the kustomize base
    # for exactly that reason.
    tag: v1.96.2
    pullPolicy: IfNotPresent
  replicaCount: 2
  # Rollout strategy — the canonical home for this argument. The chart template
  # and examples/litellm-gemini defer here directly; the kustomize base defers
  # to the template, which defers on to this. Unlike
  # podDisruptionBudget below this one is configurable, because the right answer
  # depends on something the chart cannot see: whether a namespace ResourceQuota
  # has room for a surge Pod.
  #
  # maxUnavailable: 0 is the zero-downtime shape, and it makes the surge Pod
  # mandatory — under a full quota the old ReplicaSet may not shrink, the surge
  # Pod is refused with FailedCreate, and the rollout stalls rather than
  # completing (#749).
  #
  # The default of 1 lets the Deployment replace in place, and that trade is
  # taken on every install rather than only quota-constrained ones: at 0 a
  # rollout cost no serving capacity at all, and at 1 the old ReplicaSet gives up
  # a slot as soon as it starts. At the default replicaCount of 2 one replica
  # keeps serving throughout. At replicaCount 1 there is no second replica, so a
  # rollout becomes a real gap for as long as the new Pod takes to pass its
  # startupProbe — up to the 3 minutes that probe sanctions.
  #
  # Set maxUnavailable to 0 on an install with quota headroom that would rather a
  # rollout stall than drop a request; keep 1 anywhere a baseline quota is applied
  # as policy. Both at 0 is rejected in any spelling — 0, "0", 0%, 0.0 — and the
  # template fails the render rather than letting it reach the cluster, where the
  # API server would reject it anyway.
  #
  # Emptying a fencepost rather than setting it (`--set …maxUnavailable=`, or
  # `maxUnavailable: ""`, or removing the key) resolves to the 1 below, not to
  # nothing. Rendering it empty would hand Kubernetes its own 25% default, which
  # rounds down to 0 at replicaCount 2 — the stall above, reached silently. Keep
  # these two literals in step with that fallback in templates/litellm.yaml.
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 1
  podDisruptionBudget:
    # Renders maxUnavailable: 1 at any replicaCount. The budget is deliberately
    # not configurable: minAvailable is the shape that deadlocks node drains,
    # and the audit SOP this project ships rules it out at every replica count
    # (obtainability_audit_sop.md 3.3).
    enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 2Gi
  # NetworkPolicy and GKE managed-Prometheus PodMonitoring for the gateway;
  # disable podMonitoring off-GKE — the PodMonitoring CRD is GKE-managed, and
  # helm template/lint cannot catch its absence: a non-GKE install fails at
  # apply time.
  networkPolicy: true
  podMonitoring: true

# The Hindsight memory store: the API the agents call for long-term memory,
# the Postgres/pgvector StatefulSet behind it, a NetworkPolicy standing in for
# the database's deliberate lack of a password, and a PodMonitoring. Mirrors
# k8s-operator/config/integrations/hindsight.
hindsight:
  # Tri-state. true/false is an answer; null (the default) follows
  # platformAgent.harness.memory.provider, so the providers that need the
  # store (kube_agents_memory, hindsight) get it and everything else — the
  # default multiuser_memory included — renders nothing. That coupling is the
  # point: an install cannot select hindsight memory and silently receive no
  # store to back it.
  enabled: null
  api:
    # Keep in step with images.json (`make mirror-images` copies from it).
    # Pinned by digest as well as tag; a mirrored install pulls the copy by
    # tag, because that is what mirror-images pushes.
    image:
      repository: ghcr.io/vectorize-io/hindsight-api
      tag: "0.9.1@sha256:24a079bead8aa58e45d728bf535ea727bfe559d8784024b6b9f89d56646954ab"
      pullPolicy: IfNotPresent
    # Recall is CPU-bound on the in-process cross-encoder reranker; see the
    # template before raising these — more CPU has been measured to buy
    # nothing on e2-standard-4, and a request of 4 CPUs never schedules there.
    resources:
      requests:
        cpu: "2"
        memory: 1Gi
      limits:
        cpu: "4"
        memory: 4Gi
  postgresql:
    # Upstream publishes only a floating `latest`; the digest is the real pin.
    # The images.json entry is named hindsight-postgresql, which is where a
    # mirror holds the copy.
    image:
      repository: docker.io/ankane/pgvector
      tag: "latest@sha256:956744bd14e9cbdf639c61c2a2a7c7c2c48a9c8cdd42f7de4ac034f4e96b90f8"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    # volumeClaimTemplate size. Immutable once the StatefulSet exists.
    storage: 8Gi
  # Disable podMonitoring off-GKE, same caveat as litellm.podMonitoring.
  networkPolicy: true
  podMonitoring: true
  podDisruptionBudget:
    # Renders maxUnavailable: 1 for both store workloads. Deliberately not
    # configurable, same rationale as operator.podDisruptionBudget.
    enabled: true

# The GitHub token minter (minty): mints short-lived GitHub App tokens for
# the GitOps workflow, called by the credential proxy. This is the Kubernetes
# half only; the GCP half — the minter GSA, its Workload Identity binding,
# and the import-only KMS signing key — is terraform/modules/github-minter,
# and the App's private key must be imported into that key before the
# Deployment passes its readiness probe.
githubMinter:
  enabled: false
  # GitOps org and repository the minty rule scopes tokens to. Required when
  # enabled.
  org: ""
  repo: ""
  # GitHub App ID. Set, the chart creates the github-app-credentials Secret;
  # empty, that Secret must already exist in the release namespace.
  appId: ""
  # KSA/GSA pair for Workload Identity; defaults mirror
  # terraform/modules/kube-agents-iam, so the binding it creates targets the
  # KSA the chart renders.
  ksaName: kubeagents-github-minter
  gsaName: kubeagents-github-minter-gsa
  # The GSA email allowed to request platform-agent-scope tokens. Empty
  # derives kubeagents-platform-gsa@<harness.projectId>.iam.gserviceaccount.com.
  allowedServiceAccount: ""
  kms:
    # Defaults mirror terraform/modules/github-minter.
    keyring: github-token-minter-keyring
    key: github-token-minter-key
    # The ENABLED version holding the imported App key. "1" is right unless
    # the key has been rotated or re-imported.
    keyVersion: "1"
    # Empty derives the region from platformAgent.harness.location (zone
    # suffix stripped) — KMS rings are regional.
    location: ""
  # Keep in step with images.json.
  image:
    repository: us-docker.pkg.dev/abcxyz-artifacts/docker-images/github-token-minter-server
    tag: v2.7.1-amd64
    pullPolicy: IfNotPresent
  replicaCount: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  networkPolicy: true
  podDisruptionBudget:
    # Renders maxUnavailable: 1 at any replicaCount. Deliberately not
    # configurable, same rationale as operator.podDisruptionBudget.
    enabled: true

# The logging sidecar the operator injects into every agent pod. The chart
# never renders this container itself — it passes the reference to the
# operator as FLUENT_BIT_IMAGE — but the pin has to live somewhere the mirror
# can be pointed at, so it lives here and in images.json.
fluentBit:
  image:
    repository: docker.io/fluent/fluent-bit
    tag: "5.1.0"

platformAgent:
  enabled: true
  name: platform-agent
  harness:
    # Required — the install fails fast when these are left empty.
    clusterName: ""
    location: ""
    projectId: ""
    # Hermes runtime knobs. `null` omits the field from the CR so the CRD's
    # own default applies — dashboardEnabled therefore lands `true` unless an
    # install pins it, so set it explicitly when it must not float with the
    # CRD default.
    hermes:
      dashboardEnabled: null
      pluginsDebug: null
      agentHome: "" # CRD default: /opt/data
    # Agent memory persistence. `null`/"" omit each field so the CRD's own
    # defaults apply.
    # Hindsight-backed providers (kube_agents_memory, hindsight) need the
    # Hindsight API server and Postgres, which the chart renders automatically
    # when one is selected here (see the hindsight block above). The default
    # multiuser_memory needs none of that.
    memory:
      enabled: null # CRD default: false
      provider: "" # CRD default: multiuser_memory
      userProfileEnabled: null # CRD default: false
  deployment:
    image:
      repository: ghcr.io/gke-labs/kube-agents/platform-agent
      tag: "" # defaults to Chart.appVersion
      # Always is load-bearing for the Terraform composition, whose image_tag
      # defaults to "latest": under IfNotPresent a node with a cached "latest"
      # never picks up a new build.
      #
      # Set IfNotPresent when you pin `tag` to a release: on an immutable tag
      # Always only adds a registry round-trip per pod start, and turns an
      # unreachable ghcr.io during a reschedule into ImagePullBackOff instead of
      # a start from the node's cache. See the chart README.
      pullPolicy: Always
    availability:
      # Number of agent pods. `null` omits the field; the operator defaults to 1.
      replicas: null
      # RuntimeClass for the agent pod. Set to "gvisor" for GKE Sandbox kernel
      # isolation — on a Standard cluster that needs the sandbox node pool the
      # gke-cluster module's enable_gvisor_node_pool creates; Autopilot ships
      # the RuntimeClass natively. Empty omits the field.
      runtimeClassName: ""
    # Extra environment for the agent container, applied after the operator's own
    # values so it overrides them. Telemetry is the case this exists for, though
    # a cluster with no collector no longer needs it: when discovery completes
    # and finds none, the operator itself omits the endpoint and sets
    # OTEL_SDK_DISABLED=true, and reports `None` in
    # status.telemetry.otlpEndpointSource.
    #
    # What is left for this field is the cases the operator will not decide —
    # discovery switched off with OTEL_COLLECTOR_DISCOVERY=false, an endpoint
    # pinned through telemetry.otlpEndpoint, or a collector that exists but that
    # you do not want this agent exporting to:
    #
    #   env:
    #     - name: OTEL_SDK_DISABLED
    #       value: "true"
    #
    # Prefer telemetry.otlpEndpoint when you do have a collector; this is the
    # off switch, not the way to point at one.
    env: []
  # pre-delete hook that removes the PlatformAgent CR and waits for the operator
  # to clear its finalizer, before Helm deletes the operator itself. Without it,
  # `helm uninstall` and `terraform destroy` strand the CR and hang the namespace
  # in Terminating — the manual "delete the CR first" step the READMEs used to
  # require. Best-effort by design: the hook exits 0 even on timeout, because a
  # failed pre-delete hook aborts the entire uninstall.
  cleanupHook:
    enabled: true
    # Needs kubectl AND a shell: the `|| true` that keeps a wait timeout from
    # failing the hook (and with it the whole uninstall) needs `sh -c`, which
    # rules out the distroless registry.k8s.io/kubectl. Skew of a minor or two
    # is fine for a delete.
    #
    # Third-party, so it follows global.thirdPartyImageRegistry: an uninstall
    # on an air-gapped cluster otherwise fails to pull the very hook that keeps
    # the namespace from hanging in Terminating. The pin is mirrored from
    # images.json like every other third-party image.
    image:
      repository: docker.io/alpine/k8s
      tag: "1.34.9"
    # How long to wait for the finalizer to clear.
    timeout: 120s
    # Bounds the Job itself (image pull, scheduling) above that wait.
    activeDeadlineSeconds: 300
  security:
    # Kubernetes ServiceAccount the agent pod runs as. The Workload Identity
    # binding must target this KSA (see the chart README); the default matches
    # PLATFORM_AGENT_KSA_NAME in k8s-operator/scripts/common.sh.
    # Ownership: with serviceAccountAnnotations set, the OPERATOR creates and
    # manages the KSA; with no annotations, the operator treats it as
    # user-managed and the CHART creates it instead.
    serviceAccountName: kubeagents-platform-agent
    # Annotations applied to that KSA, e.g. for Workload Identity:
    #   iam.gke.io/gcp-service-account: <GSA>@<project>.iam.gserviceaccount.com
    serviceAccountAnnotations: {}
  credentials:
    # Secret holding the agent's credential keys: API_SERVER_KEY plus the
    # model-provider key(s) (ANTHROPIC_API_KEY / GEMINI_API_KEY /
    # OPENAI_API_KEY) and optional SLACK_BOT_TOKEN / SLACK_APP_TOKEN. It must
    # exist in the release namespace before the agent pod can start.
    secretName: platform-agent-secrets
    # Convenience for dev installs: create the Secret from `data` below.
    # Prefer a pre-created Secret (external secret management) in production.
    #
    # Two further keys are read from this Secret and generated rather than
    # required, because nobody has to choose their value:
    #   SESSION_KV_API_KEY  bearer token for the pod-local Session KV server
    #   SESSION_KV_SALT     HMAC salt for pseudonymising chat identities
    # With create=true they are generated on install and carried forward on
    # upgrade. With create=false (the production path) they come from whatever
    # created the Secret — the terraform/examples/full-install composition
    # generates them.
    # If they are absent the pod still starts, but not everything in it does:
    #   - the in-pod k8s-event-watcher treats an empty SESSION_KV_API_KEY as
    #     fatal and exits on every start, so NO cluster events are watched.
    #     The container stays Ready, so its log is the only place this shows.
    #   - the Session KV server refuses every authenticated request with a 503,
    #     losing chat-thread resolution and incident lookup.
    #   - identity hashing falls back to a per-pod random salt with a warning.
    # Upgrading an install that predates these keys is the case that hits this:
    # add them to the existing Secret (upgrade.sh backfills them additively).
    create: false
    data: {}
  integration:
    github:
      # Target GitOps repository for the GitHub integration (owner/repo or
      # URL). Empty leaves the GitHub integration unconfigured.
      gitRepo: ""
    googleChat:
      # Requires the Chat Pub/Sub backend (terraform/modules/chat-pubsub).
      # projectId is taken from
      # platformAgent.harness.projectId.
      enabled: false
      topicName: platform-agent-chat-events
      subscriptionName: platform-agent-chat-events-sub
      # Empty list = all users allowed.
      allowedUsers: []
      homeChannel: ""
      # "default" (quiet) or "debug" (full verbosity).
      mode: default
    slack:
      # Bot/app tokens are read from credentials.secretName under the
      # SLACK_BOT_TOKEN / SLACK_APP_TOKEN keys.
      enabled: false
      allowedUsers: []
      homeChannel: ""
      homeChannelName: ""
