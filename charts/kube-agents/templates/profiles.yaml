# This template renders the built-in optional `tse` (GKE Support Agent)
# AgentProfile custom resource when both `.Values.platformAgent.enabled` and
# `.Values.profiles.tse.enabled` are true.
# Its persona is agents/tse/persona, published as the persona-tse image. The
# parameters are the persona's own (agents/tse/persona/persona.yaml), in its
# order, for the same reason as the cluster profile's below; the gateway routes
# a task that names a cluster only to a profile that declares all three.
{{- if and .Values.platformAgent.enabled .Values.profiles .Values.profiles.tse .Values.profiles.tse.enabled }}
{{- $tse := .Values.profiles.tse -}}
{{- $defaultTag := (.Values.platformAgent.deployment.image.tag | default .Chart.AppVersion) | toString -}}
{{- $personaRepo := include "kube-agents.imageRepository" (dict "repository" $tse.persona.image.repository "registry" (include "kube-agents.imageRegistry" .)) -}}
{{- $personaTag := ($tse.persona.image.tag | default $defaultTag) | toString -}}
{{- $harnessRepo := include "kube-agents.imageRepository" (dict "repository" $tse.harness.image.repository "registry" (include "kube-agents.imageRegistry" .)) -}}
{{- $harnessTag := ($tse.harness.image.tag | default $defaultTag) | toString }}
---
apiVersion: kubeagents.x-k8s.io/v1alpha1
kind: AgentProfile
metadata:
  name: {{ "tse" | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-agents.labels" . | nindent 4 }}
spec:
  description: {{ $tse.description | quote }}
  persona:
    image: {{ printf "%s:%s" $personaRepo $personaTag | quote }}
  harness:
    image: {{ printf "%s:%s" $harnessRepo $harnessTag | quote }}
    model: {{ $tse.harness.model | quote }}
    maxTurns: {{ $tse.harness.maxTurns }}
    type: core-agent {{- /* harness A/B twin only */}}
  bus:
    {{- with $tse.bus.publishTopics }}
    publishTopics:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $tse.bus.subscribeTopics }}
    subscribeTopics:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  identity: {}
  parameters:
    - name: project
      required: true
    - name: cluster
      required: true
    - name: location
      required: true
  lifecycle:
    activeDeadlineSeconds: {{ $tse.lifecycle.activeDeadlineSeconds }}
    ttlSecondsAfterFinished: {{ $tse.lifecycle.ttlSecondsAfterFinished }}
  concurrency: {{ $tse.concurrency }}
  resources:
    {{- toYaml $tse.resources | nindent 4 }}
{{- end }}
{{- /*
The generic cluster agent (#3658): one AgentProfile for every cluster in scope,
with the target named per task by the project, cluster and location
parameters. Its persona is agents/cluster/persona, published as the
persona-cluster image, and its worker pods come from the profile dispatcher,
so no pod runs it until the dispatcher, the worker and the pool land (#4148,
#4483, #4484) and the operator runs them (on by default; operator.profileDispatcher). The parameters
are the persona's own (agents/cluster/persona/persona.yaml), in its order, and
not values: the design has the worker refuse a task when the two lists differ
(docs/designs/spec-subagent-profiles.md), and tests/test_optional_profiles.py
holds them equal until it does.
*/}}
{{- if and .Values.platformAgent.enabled .Values.profiles .Values.profiles.cluster .Values.profiles.cluster.enabled }}
{{- $cluster := .Values.profiles.cluster -}}
{{- $defaultTag := (.Values.platformAgent.deployment.image.tag | default .Chart.AppVersion) | toString -}}
{{- $personaRepo := include "kube-agents.imageRepository" (dict "repository" $cluster.persona.image.repository "registry" (include "kube-agents.imageRegistry" .)) -}}
{{- $personaTag := ($cluster.persona.image.tag | default $defaultTag) | toString -}}
{{- $harnessRepo := include "kube-agents.imageRepository" (dict "repository" $cluster.harness.image.repository "registry" (include "kube-agents.imageRegistry" .)) -}}
{{- $harnessTag := ($cluster.harness.image.tag | default $defaultTag) | toString }}
---
apiVersion: kubeagents.x-k8s.io/v1alpha1
kind: AgentProfile
metadata:
  name: {{ "cluster" | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-agents.labels" . | nindent 4 }}
spec:
  description: {{ $cluster.description | quote }}
  persona:
    image: {{ printf "%s:%s" $personaRepo $personaTag | quote }}
  harness:
    image: {{ printf "%s:%s" $harnessRepo $harnessTag | quote }}
    model: {{ $cluster.harness.model | quote }}
    maxTurns: {{ $cluster.harness.maxTurns }}
    type: core-agent {{- /* harness A/B twin only */}}
  identity: {}
  allowedTiers:
    {{- toYaml $cluster.allowedTiers | nindent 4 }}
  {{- /* A profile pinned to the task's cluster is a per-cluster variant of
  this one, so it takes the task. tse and other specialists don't set this:
  addressed by name, they keep their own persona on a pinned cluster. */}}
  {{- include "kube-agents.agentProfileFieldGuard" (dict "value" "profiles.cluster.enabled" "field" "yieldToPinned") }}
  yieldToPinned: true
  parameters:
    - name: project
      required: true
    - name: cluster
      required: true
    - name: location
      required: true
  lifecycle:
    activeDeadlineSeconds: {{ $cluster.lifecycle.activeDeadlineSeconds }}
    ttlSecondsAfterFinished: {{ $cluster.lifecycle.ttlSecondsAfterFinished }}
  concurrency: {{ $cluster.concurrency }}
  resources:
    {{- toYaml $cluster.resources | nindent 4 }}
{{- end }}
{{- /*
The fleet-audit profile (#5623, #5620): the parent of the install's fleet-wide
scheduled audits and of onboarding's first inventory. Its persona is
agents/fleet-audit/persona, published as the persona-fleet-audit image; its
report scripts are in the worker image (/opt/kube-agents/scripts/fleet-audit). It takes no
target: it runs fleet-wide, and each cluster's checks run as a delegated
cluster task. Its one parameter, dry_run, marks a shadow run. Off by default: no schedule runs on it until the
onboarding PR renders one. Delegation from a profile task will need the
profile's opt-in (spec.delegates, #6789), set by whichever of #6789 and the
onboarding PR lands second.
*/}}
{{- define "kube-agents.fleetAuditProfileDefaults" -}}
description: >-
  Fleet-wide audit runner: hands each in-scope cluster's read-only checks
  to the cluster profile as one delegated task per cluster, collects their
  results, and composes the audit's findings and report. Never reads or
  changes a cluster itself.
persona:
  image:
    repository: ghcr.io/gke-labs/kube-agents/persona-fleet-audit
    tag: ""
harness:
  image:
    repository: ghcr.io/gke-labs/kube-agents/a2a-worker
    tag: ""
  model: model-default
  maxTurns: 120
allowedTiers:
  - unattended
lifecycle:
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 600
concurrency: 1
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi
{{- end }}
{{- if and .Values.platformAgent.enabled .Values.profiles .Values.profiles.fleetAudit .Values.profiles.fleetAudit.enabled }}
{{- /* values.yaml's profiles.fleetAudit block, under what the install sets: a
`helm upgrade --reuse-values` from a release before this key carries only the
keys someone set (enabled, say), never the chart's defaults.
tests/test_optional_profiles.py holds the defaults here equal to values.yaml's. */}}
{{- $fa := mergeOverwrite (include "kube-agents.fleetAuditProfileDefaults" . | fromYaml) (deepCopy .Values.profiles.fleetAudit) -}}
{{- $defaultTag := (.Values.platformAgent.deployment.image.tag | default .Chart.AppVersion) | toString -}}
{{- $personaRepo := include "kube-agents.imageRepository" (dict "repository" $fa.persona.image.repository "registry" (include "kube-agents.imageRegistry" .)) -}}
{{- $personaTag := ($fa.persona.image.tag | default $defaultTag) | toString -}}
{{- $harnessRepo := include "kube-agents.imageRepository" (dict "repository" $fa.harness.image.repository "registry" (include "kube-agents.imageRegistry" .)) -}}
{{- $harnessTag := ($fa.harness.image.tag | default $defaultTag) | toString }}
---
apiVersion: kubeagents.x-k8s.io/v1alpha1
kind: AgentProfile
metadata:
  name: {{ "fleet-audit" | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-agents.labels" . | nindent 4 }}
spec:
  description: {{ $fa.description | quote }}
  persona:
    image: {{ printf "%s:%s" $personaRepo $personaTag | quote }}
  harness:
    image: {{ printf "%s:%s" $harnessRepo $harnessTag | quote }}
    model: {{ $fa.harness.model | quote }}
    maxTurns: {{ $fa.harness.maxTurns }}
  identity: {}
  allowedTiers:
    {{- toYaml $fa.allowedTiers | nindent 4 }}
  {{- /* The persona's own parameters (agents/fleet-audit/persona/persona.yaml),
  as for the cluster profile above: dry_run marks a shadow run. */}}
  parameters:
    - name: dry_run
      required: false
  lifecycle:
    activeDeadlineSeconds: {{ $fa.lifecycle.activeDeadlineSeconds }}
    ttlSecondsAfterFinished: {{ $fa.lifecycle.ttlSecondsAfterFinished }}
  concurrency: {{ $fa.concurrency }}
  resources:
    {{- toYaml $fa.resources | nindent 4 }}
{{- end }}
