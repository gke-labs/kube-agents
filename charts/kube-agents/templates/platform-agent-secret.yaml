{{- if and .Values.platformAgent.enabled .Values.platformAgent.credentials.create }}
{{- if not (hasKey (.Values.platformAgent.credentials.data | default dict) "API_SERVER_KEY") }}
{{- fail "platformAgent.credentials.create=true requires an API_SERVER_KEY entry in platformAgent.credentials.data — without it the agent pod cannot start" }}
{{- end }}
{{- /* Two pod-scoped values the operator injects but no operator asks for: the
     Session KV bearer token and the identity-hashing salt. Both are generated
     here when absent, and both must survive `helm upgrade` — a new salt breaks
     correlation between a user's old and new sessions, and a new token 401s the
     event watcher until every container holding the old one restarts. `lookup`
     reads the Secret already in the cluster to carry the existing values
     forward. It returns empty under `helm template` and `--dry-run`, so a
     rendered-only manifest shows a fresh value; that is expected. */}}
{{- $supplied := .Values.platformAgent.credentials.data | default dict }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace .Values.platformAgent.credentials.secretName) }}
{{- $existingData := (get ($existing | default dict) "data") | default dict }}
{{- $generated := dict }}
{{- range $key := (list "SESSION_KV_API_KEY" "SESSION_KV_SALT") }}
  {{- if not (hasKey $supplied $key) }}
    {{- if hasKey $existingData $key }}
      {{- $_ := set $generated $key (get $existingData $key | b64dec) }}
    {{- else }}
      {{- $_ := set $generated $key (randAlphaNum 48) }}
    {{- end }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.platformAgent.credentials.secretName | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    {{- include "kube-agents.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* toString+quote: a numeric- or boolean-looking credential would
       otherwise render unquoted and be rejected by the API server. */}}
  {{- range $key, $value := $supplied }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
  {{- range $key, $value := $generated }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
