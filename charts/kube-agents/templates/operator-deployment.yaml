{{- if .Values.operator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-operator
    {{- include "kube-agents.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      {{- include "kube-agents.operatorSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kube-agents.operatorSelectorLabels" . | nindent 8 }}
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      serviceAccountName: {{ .Release.Name }}-operator-sa
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          command:
            - /manager
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=0
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          env:
            # The manager reads this as a string and treats anything other than
            # the literal "false" as on (os.Getenv("ENABLE_WEBHOOKS") != "false"
            # in k8s-operator/cmd/main.go), so it must render quoted. Off by
            # default because the webhooks need cert-manager and
            # the chart cannot install it; turning them on without it fails at
            # apply time on the missing Certificate CRD. See the chart README.
            - name: ENABLE_WEBHOOKS
              value: {{ .Values.operator.webhooks.enabled | quote }}
            {{- with .Values.operator.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: 8081
              name: health
              protocol: TCP
            {{- if .Values.operator.webhooks.enabled }}
            # 10250, not controller-runtime's default 9443: it is the only non-443 port
            # GKE's automatic control-plane-to-node firewall rule permits, so a private
            # cluster reaches the webhook without a per-cluster VPC rule. See DefaultPort
            # in k8s-operator/internal/webhook/platformagent_webhook.go. Keep in sync
            # with the Service targetPort in operator-webhooks.yaml.
            - containerPort: 10250
              name: webhook-server
              protocol: TCP
            {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          {{- if .Values.operator.webhooks.enabled }}
          volumeMounts:
            # controller-runtime's default CertDir. The manager is started
            # without --webhook-cert-path, so this exact path is what it reads
            # (k8s-operator/cmd/main.go overrides it only when that flag is given).
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: cert
              readOnly: true
          {{- end }}
      {{- if .Values.operator.webhooks.enabled }}
      volumes:
        - name: cert
          secret:
            defaultMode: 420
            secretName: {{ include "kube-agents.webhookCertSecretName" . }}
      {{- end }}
{{- end }}
