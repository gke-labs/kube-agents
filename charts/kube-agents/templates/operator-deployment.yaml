{{- if .Values.operator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-operator
    {{- include "kube-agents.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      {{- include "kube-agents.operatorSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kube-agents.operatorSelectorLabels" . | nindent 8 }}
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      serviceAccountName: {{ .Release.Name }}-operator-sa
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          command:
            - /manager
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=0
          image: "{{ include "kube-agents.imageRepository" (dict "repository" .Values.operator.image.repository "registry" (include "kube-agents.imageRegistry" .)) }}:{{ .Values.operator.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          env:
            # Chart installs ship no webhook Service, certificate, or
            # Mutating/ValidatingWebhookConfiguration, so the admission
            # webhooks must stay off — enabling them without that wiring
            # crashes the manager (no cert mount, nothing serving :9443).
            - name: ENABLE_WEBHOOKS
              value: "false"
            # The two images the operator resolves for pods the chart never
            # renders: an agent Deployment whose PlatformAgent omits
            # spec.deployment.image, and the logging sidecar it injects into
            # every agent pod. Without these a mirrored install still reaches
            # ghcr.io and Docker Hub at reconcile time, long after `helm
            # install` reported success. CREDENTIAL_PROXY_IMAGE is absent by
            # design — the operator derives that sidecar from the agent image
            # by swapping the trailing name, so it follows the value below.
            - name: PLATFORM_AGENT_IMAGE
              value: "{{ include "kube-agents.imageRepository" (dict "repository" .Values.platformAgent.deployment.image.repository "registry" (include "kube-agents.imageRegistry" .)) }}:{{ .Values.platformAgent.deployment.image.tag | default .Chart.AppVersion }}"
            - name: FLUENT_BIT_IMAGE
              value: "{{ include "kube-agents.imageRepository" (dict "repository" .Values.fluentBit.image.repository "registry" (include "kube-agents.thirdPartyImageRegistry" .)) }}:{{ .Values.fluentBit.image.tag }}"
            {{- /* Last occurrence of a name wins in a container's env, so an
                   operator.extraEnv entry still overrides anything above. */}}
            {{- with .Values.operator.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: 8081
              name: health
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
{{- end }}
