{{- if .Values.operator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-operator
    {{- include "kube-agents.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      {{- include "kube-agents.operatorSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kube-agents.operatorSelectorLabels" . | nindent 8 }}
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      serviceAccountName: {{ .Release.Name }}-operator-sa
      {{- with (include "kube-agents.imagePullSecrets" .) }}
      {{- . | nindent 6 }}
      {{- end }}
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          command:
            - /manager
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=0
          image: "{{ include "kube-agents.imageRepository" (dict "repository" .Values.operator.image.repository "registry" (include "kube-agents.imageRegistry" .)) }}:{{ .Values.operator.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          env:
            # The manager reads this as a string and treats anything other than
            # the literal "false" as on (os.Getenv("ENABLE_WEBHOOKS") != "false"
            # in k8s-operator/cmd/main.go), so it must render quoted. Off by
            # default because the webhooks need cert-manager and
            # the chart cannot install it; turning them on without it fails at
            # apply time on the missing Certificate CRD. See the chart README.
            - name: ENABLE_WEBHOOKS
              value: {{ .Values.operator.webhooks.enabled | quote }}
            # The three images the operator resolves for pods the chart never
            # renders: an agent Deployment whose PlatformAgent omits
            # spec.deployment.image, the shell sandbox StatefulSet it renders
            # beside every agent pod, and the logging sidecar it injects into
            # that pod. Without these a mirrored install still reaches ghcr.io
            # and Docker Hub at reconcile time, long after `helm install`
            # reported success. CREDENTIAL_PROXY_IMAGE is absent by design —
            # the operator derives the broker image from the agent image by
            # swapping the trailing name, so it follows the value below. The
            # sandbox does not: it is a separate repository, so it is named.
            - name: PLATFORM_AGENT_IMAGE
              value: "{{ include "kube-agents.imageRepository" (dict "repository" .Values.platformAgent.deployment.image.repository "registry" (include "kube-agents.imageRegistry" .)) }}:{{ .Values.platformAgent.deployment.image.tag | default .Chart.AppVersion }}"
            {{- /* `| default dict` and the repository fallback because
                   agentSandbox is a key this chart gained: a caller that
                   renders it against an older release's values -- `helm upgrade
                   --reuse-values` does exactly that -- reaches this line with
                   .Values.agentSandbox nil, and a bare field access on nil is a
                   template error that aborts the upgrade after the new CRDs
                   have already been applied. The same guard
                   platform-agent-cr.yaml uses for harness.experimental.

                   The repository fallback repeats values.yaml's default because
                   a nil agentSandbox has no repository either, and there is no
                   way to read a chart default that the release did not carry.
                   Keep the two in step. */}}
            {{- $sandboxImage := (.Values.agentSandbox | default dict).image | default dict }}
            - name: AGENT_SANDBOX_IMAGE
              value: "{{ include "kube-agents.imageRepository" (dict "repository" ($sandboxImage.repository | default "ghcr.io/gke-labs/kube-agents/agent-sandbox") "registry" (include "kube-agents.imageRegistry" .)) }}:{{ $sandboxImage.tag | default .Chart.AppVersion }}"
            - name: FLUENT_BIT_IMAGE
              value: "{{ include "kube-agents.imageRepository" (dict "repository" .Values.fluentBit.image.repository "registry" (include "kube-agents.thirdPartyImageRegistry" .)) }}:{{ .Values.fluentBit.image.tag }}"
            {{- /* The pull identity for those same pods. Redundant for the CR
                   this release renders, which carries the secrets itself, and
                   load-bearing for any OTHER PlatformAgent written against this
                   install: without it that agent reaches an authenticated
                   mirror with no credentials at all. */}}
            {{- with (include "kube-agents.imagePullSecretNames" .) }}
            - name: IMAGE_PULL_SECRETS
              value: {{ . | quote }}
            {{- end }}
            {{- /* Last occurrence of a name wins in a container's env, so an
                   operator.extraEnv entry still overrides anything above. */}}
            {{- with .Values.operator.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: 8081
              name: health
              protocol: TCP
            {{- if .Values.operator.webhooks.enabled }}
            # 10250, not controller-runtime's default 9443: it is the only non-443 port
            # GKE's automatic control-plane-to-node firewall rule permits, so a private
            # cluster reaches the webhook without a per-cluster VPC rule. See DefaultPort
            # in k8s-operator/internal/webhook/platformagent_webhook.go. Keep in sync
            # with the Service targetPort in operator-webhooks.yaml.
            - containerPort: 10250
              name: webhook-server
              protocol: TCP
            {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          {{- if .Values.operator.webhooks.enabled }}
          volumeMounts:
            # controller-runtime's default CertDir. The manager is started
            # without --webhook-cert-path, so this exact path is what it reads
            # (k8s-operator/cmd/main.go overrides it only when that flag is given).
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: cert
              readOnly: true
          {{- end }}
      {{- if .Values.operator.webhooks.enabled }}
      volumes:
        - name: cert
          secret:
            defaultMode: 420
            secretName: {{ include "kube-agents.webhookCertSecretName" . }}
      {{- end }}
{{- end }}
