{{- if .Values.platformAgent.enabled }}
apiVersion: kubeagents.x-k8s.io/v1alpha1
kind: PlatformAgent
metadata:
  name: {{ .Values.platformAgent.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    {{- include "kube-agents.labels" . | nindent 4 }}
spec:
  harness:
    clusterName: {{ required "platformAgent.harness.clusterName is required" .Values.platformAgent.harness.clusterName | quote }}
    location: {{ required "platformAgent.harness.location is required" .Values.platformAgent.harness.location | quote }}
    projectId: {{ required "platformAgent.harness.projectId is required" .Values.platformAgent.harness.projectId | quote }}
    {{- /*
      Every optional field below goes through kube-agents.compactFields, which
      drops null and "" but keeps `false` and `0`, and which renders nothing at
      all when the whole group is unset — so the parent key disappears with its
      children instead of being guarded by a hand-maintained `or`.
    */}}
    {{- $hermes := .Values.platformAgent.harness.hermes | default dict }}
    hermes:
      apiServerSecretRef:
        name: {{ .Values.platformAgent.credentials.secretName | quote }}
        key: API_SERVER_KEY
      {{- with include "kube-agents.compactFields" (dict
            "dashboardEnabled" $hermes.dashboardEnabled
            "pluginsDebug" $hermes.pluginsDebug
            "agentHome" $hermes.agentHome) }}
      {{- . | nindent 6 }}
      {{- end }}
    {{- $memory := .Values.platformAgent.harness.memory | default dict }}
    {{- with include "kube-agents.compactFields" (dict
          "memoryEnabled" $memory.enabled
          "provider" $memory.provider
          "userProfileEnabled" $memory.userProfileEnabled) }}
    memory:
      {{- . | nindent 6 }}
    {{- end }}
    {{- $tuning := deepCopy (.Values.platformAgent.harness.tuning | default dict) }}
    {{- if and .Values.plugins (and .Values.plugins.stockoutInvestigator .Values.plugins.stockoutInvestigator.enabled) }}
    {{- $defaultStockoutTuning := dict "maxInProgress" 3 "platform" (dict "apiMaxRetries" 8 "maxTurns" 200) "cluster" (dict "apiMaxRetries" 8 "maxTurns" 150) }}
    {{- $tuning = merge $tuning $defaultStockoutTuning }}
    {{- end }}
    {{- if or (hasKey $tuning "maxInProgress") $tuning.platform $tuning.cluster $tuning.default }}
    tuning:
      {{- if hasKey $tuning "maxInProgress" }}
      maxInProgress: {{ $tuning.maxInProgress }}
      {{- end }}
      {{- with $tuning.default }}
      default:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tuning.platform }}
      platform:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tuning.cluster }}
      cluster:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- $sandbox := (.Values.platformAgent.harness.experimental | default dict).shellSandbox | default dict }}
    {{- /*
      The shell sandbox is not optional. The operator refuses
      shellSandbox.enabled: false with Degraded/ShellSandboxCannotBeDisabled and
      leaves the running workload alone, so a chart that rendered it would install
      cleanly and then sit Degraded with no Helm error to read. Fail at template
      time instead, where the message reaches the person running the upgrade.
    */}}
    {{- if and (kindIs "bool" $sandbox.enabled) (not $sandbox.enabled) }}
    {{- fail "platformAgent.harness.experimental.shellSandbox.enabled: false is not supported -- the operator refuses it. Remove the key or set it true." }}
    {{- end }}
    {{- with include "kube-agents.compactFields" (dict
          "enabled" $sandbox.enabled
          "image" $sandbox.image
          "runtimeClassName" $sandbox.runtimeClassName) }}
    experimental:
      shellSandbox:
        {{- . | nindent 8 }}
    {{- end }}
  deployment:
    image: {{ include "kube-agents.imageRepository" (dict "repository" .Values.platformAgent.deployment.image.repository "registry" (include "kube-agents.imageRegistry" .)) | quote }}
    tag: {{ .Values.platformAgent.deployment.image.tag | default .Chart.AppVersion | quote }}
    imagePullPolicy: {{ .Values.platformAgent.deployment.image.pullPolicy }}
    {{- /*
      Set on the CR as well as on the operator's IMAGE_PULL_SECRETS default,
      even though either alone would cover this agent. The CR is the layer a
      reader looks at when a pull fails, and it is the layer that survives the
      operator being redeployed by something other than this chart.
    */}}
    {{- with (include "kube-agents.imagePullSecrets" .) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- $availability := .Values.platformAgent.deployment.availability | default dict }}
    {{- with include "kube-agents.compactFields" (dict
          "replicas" $availability.replicas
          "runtimeClassName" $availability.runtimeClassName) }}
    availability:
      {{- . | nindent 6 }}
    {{- end }}
    {{- /*
      The operator applies spec.deployment.env AFTER its own container env, so
      anything set here wins. That is the only way to reach settings the operator
      computes rather than exposes — OTEL_SDK_DISABLED being the one that matters
      in practice. The operator now sets it itself when discovery establishes the
      cluster has no collector, so this is for the cases it will not decide:
      discovery switched off, a pinned endpoint, or a collector you would rather
      this agent did not export to.
    */}}
    {{- with .Values.platformAgent.deployment.env }}
    env:
      {{- /*
        `value` is quoted rather than passed through toYaml because the CRD types
        it as a string: `--set ...value=true` yields a YAML boolean, which the API
        server rejects. valueFrom is a structured EnvVarSource, so it goes through
        untouched.
      */}}
      {{- range . }}
      - name: {{ .name | quote }}
        {{- if hasKey . "value" }}
        value: {{ .value | quote }}
        {{- end }}
        {{- with .valueFrom }}
        valueFrom:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
    {{- end }}
  security:
    serviceAccountName: {{ .Values.platformAgent.security.serviceAccountName | quote }}
    {{- with .Values.platformAgent.security.serviceAccountAnnotations }}
    serviceAccountAnnotations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.platformAgent.security.scopedServiceAccounts }}
    scopedServiceAccounts:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- /*
      Both fields or neither. The operator reads a half-filled block as absent and
      keeps the proxy on the metadata server, which is safe but silent: the install
      asked for federation and did not get it, and the only symptom is a placement
      nobody looks at. Fail here instead.
    */}}
    {{- $wif := .Values.platformAgent.security.workloadIdentityFederation | default dict }}
    {{- if or $wif.audience $wif.serviceAccountEmail }}
    {{- if not (and $wif.audience $wif.serviceAccountEmail) }}
    {{- fail "platformAgent.security.workloadIdentityFederation needs both audience and serviceAccountEmail, or neither" }}
    {{- end }}
    workloadIdentityFederation:
      audience: {{ $wif.audience | quote }}
      serviceAccountEmail: {{ $wif.serviceAccountEmail | quote }}
    {{- end }}
  {{- /*
    `with`, not `if`: an empty value must OMIT the field, not render it as "". Omitting is
    what leaves the operator free to discover a collector; an explicit "" would look like
    a decision the chart made.
  */}}
  {{- with .Values.telemetry.otlpEndpoint }}
  telemetry:
    otlpEndpoint: {{ . | quote }}
  {{- end }}
  {{- with .Values.platformAgent.networkPolicy }}
  networkPolicy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- $integ := .Values.platformAgent.integration }}
  {{- if or (and $integ.github (or $integ.github.org $integ.github.gitRepo)) $integ.googleChat.enabled $integ.slack.enabled $integ.teams.enabled }}
  integration:
    {{- if and $integ.github (or $integ.github.org $integ.github.gitRepo) }}
    github:
      {{- if $integ.github.org }}
      org: {{ $integ.github.org | quote }}
      {{- end }}
      {{- if $integ.github.gitRepo }}
      gitRepo: {{ $integ.github.gitRepo | quote }}
      {{- end }}
    {{- end }}
    {{- if $integ.googleChat.enabled }}
    googleChat:
      enabled: true
      projectId: {{ .Values.platformAgent.harness.projectId | quote }}
      topicName: {{ required "platformAgent.integration.googleChat.topicName is required when googleChat is enabled" $integ.googleChat.topicName | quote }}
      subscriptionName: {{ required "platformAgent.integration.googleChat.subscriptionName is required when googleChat is enabled" $integ.googleChat.subscriptionName | quote }}
      {{- with $integ.googleChat.allowedUsers }}
      allowedUsers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $integ.googleChat.homeChannel }}
      homeChannel: {{ . | quote }}
      {{- end }}
      mode: {{ $integ.googleChat.mode | default "default" | quote }}
    {{- end }}
    {{- if $integ.slack.enabled }}
    slack:
      enabled: true
      # The CRD requires both token refs when Slack is enabled; they point
      # into the credentials Secret by convention.
      botTokenSecretRef:
        name: {{ .Values.platformAgent.credentials.secretName | quote }}
        key: SLACK_BOT_TOKEN
      appTokenSecretRef:
        name: {{ .Values.platformAgent.credentials.secretName | quote }}
        key: SLACK_APP_TOKEN
      {{- with $integ.slack.allowedUsers }}
      allowedUsers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $integ.slack.homeChannel }}
      homeChannel: {{ . | quote }}
      {{- end }}
      {{- with $integ.slack.homeChannelName }}
      homeChannelName: {{ . | quote }}
      {{- end }}
    {{- end }}
    {{- if $integ.teams.enabled }}
    teams:
      enabled: true
      appIdSecretRef:
        name: {{ .Values.platformAgent.credentials.secretName | quote }}
        key: TEAMS_APP_ID
      appPasswordSecretRef:
        name: {{ .Values.platformAgent.credentials.secretName | quote }}
        key: TEAMS_APP_PASSWORD
      {{- with $integ.teams.tenantId }}
      tenantId: {{ . | quote }}
      {{- end }}
      {{- with $integ.teams.allowedUsers }}
      allowedUsers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $integ.teams.allowAllUsers }}
      allowAllUsers: {{ $integ.teams.allowAllUsers }}
      {{- end }}
      {{- with $integ.teams.homeChannel }}
      homeChannel: {{ . | quote }}
      {{- end }}
      {{- with $integ.teams.serviceUrl }}
      serviceUrl: {{ . | quote }}
      {{- end }}
      {{- if hasKey $integ.teams "adaptiveCards" }}
      adaptiveCards: {{ $integ.teams.adaptiveCards }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
