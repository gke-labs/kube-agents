{{- if .Values.platformAgent.enabled }}
apiVersion: kubeagents.x-k8s.io/v1alpha1
kind: PlatformAgent
metadata:
  name: {{ .Values.platformAgent.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    {{- include "kube-agents.labels" . | nindent 4 }}
  {{- $annotations := dict }}
  {{- with .Values.platformAgent.annotations }}
  {{- $annotations = deepCopy . }}
  {{- end }}
  {{- /*
    Two keys the operator reads are also derived from chart values, and the value
    wins because it drives the rest of the release too: litellm.networkPolicy is
    the static render gate, telemetry.collectorNamespace the static policy's
    egress namespace. A platformAgent.annotations entry that disagrees with the
    value it duplicates fails the render rather than being overwritten in silence.
  */}}
  {{- $litellmPolicyKey := "kubeagents.x-k8s.io/enable-litellm-network-policy" }}
  {{- if and .Values.litellm (not .Values.litellm.networkPolicy) }}
  {{- with get $annotations $litellmPolicyKey }}
  {{- /* The operator reads this value trimmed and case-insensitively; agree with it. */}}
  {{- if ne (toString . | trim | lower) "false" }}
  {{- fail (printf "platformAgent.annotations[%q]=%q contradicts litellm.networkPolicy=false, which stamps it \"false\". Drop the annotation or set litellm.networkPolicy=true." $litellmPolicyKey (toString .)) }}
  {{- end }}
  {{- end }}
  {{- $_ := set $annotations $litellmPolicyKey "false" }}
  {{- end }}
  {{- $collectorNamespaceKey := "kubeagents.x-k8s.io/otlp-collector-namespace" }}
  {{- with .Values.telemetry.collectorNamespace }}
  {{- with get $annotations $collectorNamespaceKey }}
  {{- if ne (toString .) $.Values.telemetry.collectorNamespace }}
  {{- fail (printf "platformAgent.annotations[%q]=%q contradicts telemetry.collectorNamespace=%q. Set telemetry.collectorNamespace alone; the chart stamps the annotation from it." $collectorNamespaceKey (toString .) $.Values.telemetry.collectorNamespace) }}
  {{- end }}
  {{- end }}
  {{- $_ := set $annotations $collectorNamespaceKey . }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  harness:
    clusterName: {{ required "platformAgent.harness.clusterName is required" .Values.platformAgent.harness.clusterName | quote }}
    location: {{ required "platformAgent.harness.location is required" .Values.platformAgent.harness.location | quote }}
    projectId: {{ required "platformAgent.harness.projectId is required" .Values.platformAgent.harness.projectId | quote }}
    {{- /*
      Every optional field below goes through kube-agents.compactFields, which
      drops null and "" but keeps `false` and `0`, and which renders nothing at
      all when the whole group is unset — so the parent key disappears with its
      children instead of being guarded by a hand-maintained `or`.
    */}}
    {{- $hermes := .Values.platformAgent.harness.hermes | default dict }}
    hermes:
      apiServerSecretRef:
        name: {{ .Values.platformAgent.credentials.secretName | quote }}
        key: API_SERVER_KEY
      {{- with include "kube-agents.compactFields" (dict
            "dashboardEnabled" $hermes.dashboardEnabled
            "pluginsDebug" $hermes.pluginsDebug
            "agentHome" $hermes.agentHome) }}
      {{- . | nindent 6 }}
      {{- end }}
    {{- $memory := .Values.platformAgent.harness.memory | default dict }}
    {{- with include "kube-agents.compactFields" (dict
          "memoryEnabled" $memory.enabled
          "provider" $memory.provider
          "userProfileEnabled" $memory.userProfileEnabled) }}
    memory:
      {{- . | nindent 6 }}
    {{- end }}
    {{- $drift := .Values.platformAgent.harness.driftDetector | default dict }}
    {{- /*
      Rendered only when an install says something about it, which is why
      `enabled: null` rather than `false` is the value shipped: the CRD already
      defaults it off, and a chart that wrote the default would make every
      install look like one that had considered drift detection and declined.
    */}}
    {{- with include "kube-agents.compactFields" (dict
          "enabled" $drift.enabled
          "subscription" $drift.subscription
          "gitopsManagers" $drift.gitopsManagers) }}
    driftDetector:
      {{- . | nindent 6 }}
    {{- end }}
    {{- $tuning := deepCopy (.Values.platformAgent.harness.tuning | default dict) }}
    {{- if and .Values.plugins (and .Values.plugins.stockoutInvestigator .Values.plugins.stockoutInvestigator.enabled) }}
    {{- $defaultStockoutTuning := dict "maxInProgress" 3 "platform" (dict "apiMaxRetries" 8 "maxTurns" 200) "cluster" (dict "apiMaxRetries" 8 "maxTurns" 150) }}
    {{- $tuning = merge $tuning $defaultStockoutTuning }}
    {{- end }}
    {{- if or (hasKey $tuning "maxInProgress") $tuning.platform $tuning.cluster $tuning.default }}
    tuning:
      {{- if hasKey $tuning "maxInProgress" }}
      maxInProgress: {{ $tuning.maxInProgress }}
      {{- end }}
      {{- with $tuning.default }}
      default:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tuning.platform }}
      platform:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tuning.cluster }}
      cluster:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- $sandbox := (.Values.platformAgent.harness.experimental | default dict).shellSandbox | default dict }}
    {{- /*
      The shell sandbox is not optional. The operator refuses
      shellSandbox.enabled: false with Degraded/ShellSandboxCannotBeDisabled and
      leaves the running workload alone, so a chart that rendered it would install
      cleanly and then sit Degraded with no Helm error to read. Fail at template
      time instead, where the message reaches the person running the upgrade.
    */}}
    {{- if and (kindIs "bool" $sandbox.enabled) (not $sandbox.enabled) }}
    {{- fail "platformAgent.harness.experimental.shellSandbox.enabled: false is not supported -- the operator refuses it. Remove the key or set it true." }}
    {{- end }}
    {{- with include "kube-agents.compactFields" (dict
          "enabled" $sandbox.enabled
          "image" $sandbox.image
          "runtimeClassName" $sandbox.runtimeClassName) }}
    experimental:
      shellSandbox:
        {{- . | nindent 8 }}
    {{- end }}
  deployment:
    image: {{ include "kube-agents.imageRepository" (dict "repository" .Values.platformAgent.deployment.image.repository "registry" (include "kube-agents.imageRegistry" .)) | quote }}
    tag: {{ .Values.platformAgent.deployment.image.tag | default .Chart.AppVersion | quote }}
    imagePullPolicy: {{ .Values.platformAgent.deployment.image.pullPolicy }}
    {{- /*
      Set on the CR as well as on the operator's IMAGE_PULL_SECRETS default,
      even though either alone would cover this agent. The CR is the layer a
      reader looks at when a pull fails, and it is the layer that survives the
      operator being redeployed by something other than this chart.
    */}}
    {{- with (include "kube-agents.imagePullSecrets" .) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- $availability := .Values.platformAgent.deployment.availability | default dict }}
    {{- with include "kube-agents.compactFields" (dict
          "replicas" $availability.replicas
          "runtimeClassName" $availability.runtimeClassName) }}
    availability:
      {{- . | nindent 6 }}
    {{- end }}
    {{- /*
      The operator applies spec.deployment.env AFTER its own container env, so
      anything set here wins. That is the only way to reach settings the operator
      computes rather than exposes — OTEL_SDK_DISABLED being the one that matters
      in practice. The operator now sets it itself when discovery establishes the
      cluster has no collector, so this is for the cases it will not decide:
      discovery switched off, a pinned endpoint, or a collector you would rather
      this agent did not export to.
    */}}
    {{- with .Values.platformAgent.deployment.env }}
    env:
      {{- /*
        `value` is quoted rather than passed through toYaml because the CRD types
        it as a string: `--set ...value=true` yields a YAML boolean, which the API
        server rejects. valueFrom is a structured EnvVarSource, so it goes through
        untouched.
      */}}
      {{- range . }}
      - name: {{ .name | quote }}
        {{- if hasKey . "value" }}
        value: {{ .value | quote }}
        {{- end }}
        {{- with .valueFrom }}
        valueFrom:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- /*
      Checked here, on the operator's defaults with the override merged over
      them, for the reason the shell sandbox's guard above gives: an override
      the operator refuses would install cleanly and sit Degraded, the proxy at
      its defaults, with no Helm error to read. So the render fails on what the
      operator refuses and the values alone decide (ValidateCredentialProxyResources
      in k8s-operator/internal/controller/credential_proxy_validation.go): a
      key the CRD does not declare, which the API server would prune silently
      (`limit:` for `limits:`), claims, a resource name the container does not
      declare, a negative quantity, a zero limit, a memory limit under the
      floor, and a request above its limit. The zero, floor and crossed-pair
      checks compare float64 figures strictly (kube-agents.quantityExact), which
      Sprig scales in decimal arithmetic, so 1005m equals 1.005. That matches
      the operator's Quantity.Cmp for every decimal value the chart admits: a
      quantity with more than 15 significant digits is refused before these
      run. The residues, a binary-suffixed value within float64 rounding of a
      decimal one and digits below a nano-unit, are in quantityExact's comment. The
      defaults and the floor are kube-agents.credentialProxyDefaults and
      kube-agents.credentialProxyMemoryFloorBytes. A quantity outside the
      CRD's grammar, or inside it in a form resource.ParseQuantity does not read
      (a fractional exponent), fails the render naming the key: dropping it
      would skip the checks above while the CRD admitted it. The checks that
      read no parsed value live in kube-agents.credentialProxyResourcesCheck,
      which the quota preflight calls too; the rest follow here.
    */}}
    {{- $proxyPrefix := "platformAgent.deployment.credentialProxy.resources" }}
    {{- $proxyResources := ((.Values.platformAgent.deployment.credentialProxy | default dict).resources) | default dict }}
    {{- include "kube-agents.credentialProxyResourcesCheck" $proxyResources }}
    {{- /*
      Rendered only when a key is set. An empty block would write
      `credentialProxy: {resources: {}}` onto every CR, which an API server
      serving a CRD from before the field prunes silently and a reader mistakes
      for an override. The operator merges what is here over its defaults per
      key, so a block carrying only limits.memory is complete as written.

      Each quantity is quoted rather than passed through toYaml, for the reason
      env[].value is above: a values file's `cpu: 1.5` arrives as a float, and
      the CRD types a quantity as int-or-string, so the API server refuses the
      bare number. An unset leaf is skipped by kube-agents.compactFields' rule:
      null (`memory: null`, Helm's way to drop a key) or the empty string, which
      the CRD's quantity pattern refuses. A map holding nothing else writes no
      block either.
    */}}
    {{- $proxyQuantities := dict }}
    {{- range $side := list "limits" "requests" }}
      {{- $set := dict }}
      {{- range $name, $quantity := (index $proxyResources $side) | default dict }}
        {{- if not (or (kindIs "invalid" $quantity) (and (kindIs "string" $quantity) (eq $quantity ""))) }}
          {{- $_ := set $set $name $quantity }}
        {{- end }}
      {{- end }}
      {{- if $set }}
        {{- $_ := set $proxyQuantities $side $set }}
      {{- end }}
    {{- end }}
    {{- $proxyDefaults := include "kube-agents.credentialProxyDefaults" . | fromJson }}
    {{- $proxyFloor := include "kube-agents.credentialProxyMemoryFloorBytes" . | int64 }}
    {{- $proxyMerged := dict "requests" (dict) "limits" (dict) }}
    {{- $proxyRendered := dict "requests" (dict) "limits" (dict) }}
    {{- range $side := list "requests" "limits" }}
      {{- range $name, $raw := index $proxyDefaults $side }}
        {{- $_ := set (index $proxyMerged $side) $name $raw }}
      {{- end }}
    {{- end }}
    {{- range $side, $set := $proxyQuantities }}
      {{- range $name, $quantity := $set }}
        {{- $raw := toString $quantity | trim }}
        {{- $_ := set (index $proxyMerged $side) $name $raw }}
        {{- $_ := set (index $proxyRendered $side) $name $raw }}
      {{- end }}
    {{- end }}
    {{- if $proxyQuantities }}
    {{- $proxyParsed := dict "requests" (dict) "limits" (dict) }}
    {{- range $side, $set := $proxyMerged }}
      {{- range $name, $raw := $set }}
        {{- if eq $name "cpu" }}
        {{- $_ := set (index $proxyParsed $side) $name (include "kube-agents.parseCpuMillis" $raw | int64) }}
        {{- else }}
        {{- $_ := set (index $proxyParsed $side) $name (include "kube-agents.parseBytes" $raw | int64) }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- /* Every check below compares the quantityExact figures, never the
           integers above: parseCpuMillis and parseBytes round (a milli-byte limit
           half a byte under the floor rounds up onto it), and the operator
           compares the quantities themselves. */}}
    {{- range $name, $rawLimit := $proxyMerged.limits }}
      {{- if eq (include "kube-agents.quantityExact" (dict "raw" $rawLimit "cpu" (eq $name "cpu") "key" (printf "%s.limits.%s" $proxyPrefix $name)) | float64) 0.0 }}
      {{- fail (printf "%s.limits.%s is %s; a limit of zero leaves the container none, and the operator refuses it. Omit the key to keep the default (%s)" $proxyPrefix $name $rawLimit (index $proxyDefaults.limits $name)) }}
      {{- end }}
    {{- end }}
    {{- if and (hasKey $proxyMerged.limits "memory") (lt (include "kube-agents.quantityExact" (dict "raw" $proxyMerged.limits.memory "cpu" false "key" (printf "%s.limits.memory" $proxyPrefix)) | float64) (float64 $proxyFloor)) }}
    {{- fail (printf "%s.limits.memory is %s, under the %dMi floor at which the credential proxy's child memory budget admits two commands at once; below it the broker turns the budget off, and the operator refuses it. Set at least %dMi" $proxyPrefix $proxyMerged.limits.memory (div $proxyFloor 1048576) (div $proxyFloor 1048576)) }}
    {{- end }}
    {{- range $name, $rawRequest := $proxyMerged.requests }}
      {{- if hasKey $proxyMerged.limits $name }}
      {{- $isCpu := eq $name "cpu" }}
      {{- $request := include "kube-agents.quantityExact" (dict "raw" $rawRequest "cpu" $isCpu "key" (printf "%s.requests.%s" $proxyPrefix $name)) | float64 }}
      {{- $limit := include "kube-agents.quantityExact" (dict "raw" (index $proxyMerged.limits $name) "cpu" $isCpu "key" (printf "%s.limits.%s" $proxyPrefix $name)) | float64 }}
      {{- if gt $request $limit }}
      {{- $setRequest := hasKey ((index $proxyQuantities "requests") | default dict) $name }}
      {{- $setLimit := hasKey ((index $proxyQuantities "limits") | default dict) $name }}
      {{- $req := index $proxyMerged.requests $name }}
      {{- $lim := index $proxyMerged.limits $name }}
      {{- if and $setRequest $setLimit }}
      {{- fail (printf "%s.requests.%s (%s) exceeds limits.%s (%s); a request above its limit is refused by the API server, and by the operator" $proxyPrefix $name $req $name $lim) }}
      {{- else if $setRequest }}
      {{- fail (printf "%s.requests.%s (%s) exceeds the operator's default limits.%s (%s), which the override does not raise; set limits.%s as well" $proxyPrefix $name $req $name $lim $name) }}
      {{- else }}
      {{- fail (printf "%s.limits.%s (%s) is below the operator's default requests.%s (%s), which the override does not lower; set requests.%s as well" $proxyPrefix $name $lim $name $req $name) }}
      {{- end }}
      {{- end }}
      {{- end }}
    {{- end }}
    {{- end }}
    {{- /*
      The same CRD guard as the scoped pool's below, for the same reason:
      `helm upgrade` never applies crds/, and an API server serving a CRD from
      before spec.deployment.credentialProxy admits the CR with the block
      pruned. The proxy keeps the operator's defaults while the release record
      carries the override, and nothing says so. `lookup` is empty under
      `helm template`, so the guard fires only against a live install.
    */}}
    {{- if $proxyQuantities }}
    {{- $crd := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "platformagents.kubeagents.x-k8s.io" }}
    {{- if $crd }}
    {{- $deploymentProps := dict }}
    {{- range $crd.spec.versions }}
    {{- if .storage }}
    {{- $deploymentProps = dig "schema" "openAPIV3Schema" "properties" "spec" "properties" "deployment" "properties" (dict) . }}
    {{- end }}
    {{- end }}
    {{- if not (hasKey $deploymentProps "credentialProxy") }}
    {{- fail "platformAgent.deployment.credentialProxy.resources is set, but the installed PlatformAgent CRD predates spec.deployment.credentialProxy and helm upgrade does not update CRDs; apply charts/kube-agents/crds/ first (kubectl apply --server-side -f charts/kube-agents/crds/, or run upgrade.sh, which does). Otherwise the API server prunes the value silently while the release record keeps it" }}
    {{- end }}
    {{- end }}
    credentialProxy:
      resources:
        {{- range $side := keys $proxyQuantities | sortAlpha }}
        {{ $side }}:
          {{- $set := index $proxyRendered $side }}
          {{- range $name := keys $set | sortAlpha }}
          {{ $name }}: {{ index $set $name | quote }}
          {{- end }}
        {{- end }}
    {{- end }}
  security:
    serviceAccountName: {{ .Values.platformAgent.security.serviceAccountName | quote }}
    {{- with .Values.platformAgent.security.serviceAccountAnnotations }}
    serviceAccountAnnotations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- /*
      Rendered when the pool is armed or carries members, and omitted otherwise, so
      the default values render the CR the operator reads as "no pool" rather than a
      present block with the switch off. `enabled` is the arming rule on the CR; the
      list alone arms nothing, which is why a populated list with the switch off is
      still rendered: the mapping is declared, visible in the CR, and inert. Armed
      with no members fails here, as the CRD's own rule would at apply, so the
      message names the value rather than the CR field.
    */}}
    {{- $pool := .Values.platformAgent.security.scopedServiceAccountPool | default dict }}
    {{- if and $pool.enabled (not $pool.serviceAccounts) }}
    {{- fail "platformAgent.security.scopedServiceAccountPool.enabled requires at least one serviceAccounts entry; the broker refuses to start on an empty pool" }}
    {{- end }}
    {{- /*
      An armed pool also needs a CRD that knows the field. `helm upgrade` never
      applies crds/, and an API server serving a CRD from before the pool admits
      the CR with the block pruned: the operator reads no pool, the broker starts
      with it off, and every cluster read runs on the agent's own identity while
      the release record says "armed". `lookup` sees the installed CRD on a live
      install and nothing under `helm template`, so the guard fires exactly where
      the pruning would. Only the armed case is guarded: a disabled block pruned
      the same way changes nothing.
    */}}
    {{- if $pool.enabled }}
    {{- $crd := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "platformagents.kubeagents.x-k8s.io" }}
    {{- if $crd }}
    {{- $props := dict }}
    {{- range $crd.spec.versions }}
    {{- if eq .name "v1alpha1" }}
    {{- $props = dig "schema" "openAPIV3Schema" "properties" "spec" "properties" "security" "properties" (dict) . }}
    {{- end }}
    {{- end }}
    {{- if not (hasKey $props "scopedServiceAccountPool") }}
    {{- fail "platformAgent.security.scopedServiceAccountPool.enabled needs a PlatformAgent CRD that has the field, and helm upgrade does not update CRDs; apply charts/kube-agents/crds/ first (kubectl apply --server-side -f charts/kube-agents/crds/)" }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- if or $pool.enabled $pool.serviceAccounts }}
    scopedServiceAccountPool:
      enabled: {{ $pool.enabled | default false }}
      {{- with $pool.serviceAccounts }}
      serviceAccounts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- /*
      Both fields or neither. The operator reads a half-filled block as absent and
      keeps the proxy on the metadata server, which is safe but silent: the install
      asked for federation and did not get it, and the only symptom is a placement
      nobody looks at. Fail here instead.
    */}}
    {{- $wif := .Values.platformAgent.security.workloadIdentityFederation | default dict }}
    {{- if or $wif.audience $wif.serviceAccountEmail }}
    {{- if not (and $wif.audience $wif.serviceAccountEmail) }}
    {{- fail "platformAgent.security.workloadIdentityFederation needs both audience and serviceAccountEmail, or neither" }}
    {{- end }}
    workloadIdentityFederation:
      audience: {{ $wif.audience | quote }}
      serviceAccountEmail: {{ $wif.serviceAccountEmail | quote }}
    {{- end }}
  {{- /*
    Rendered whenever the install carries the value, empty lists included, and never
    through compactFields or `with`, which would drop an emptied block: the reconcile
    reads a present block with an empty projects list as the declaration that drops
    projects, and an absent block as no declaration at all
    (docs/designs/multi-project-scope.md §7). `kindIs "map"` is the test because the
    default is null and a null user value deletes the key, both of which render no
    block, while `{}` is a present map that `with` would skip. The two container lists
    and the two selector lists render only when the value carries the key: Helm patches
    the CR from the difference between rendered manifests, so a release record written
    before the chart knew the keys must re-render without them, or the first retag onto
    this chart would patch `folders: []` (or `sharedVpcHosts: []`) over a list declared
    on the CR by hand and retire its members. The composition always passes all four
    keys, so on that path they always render.
  */}}
  {{- $scope := .Values.platformAgent.scope }}
  {{- if kindIs "map" $scope }}
  {{- $scopeExclude := $scope.exclude | default dict }}
  scope:
    projects: {{ $scope.projects | default list | toJson }}
    {{- if hasKey $scope "folders" }}
    folders: {{ $scope.folders | default list | toJson }}
    {{- end }}
    {{- if hasKey $scope "organizations" }}
    organizations: {{ $scope.organizations | default list | toJson }}
    {{- end }}
    {{- if hasKey $scope "sharedVpcHosts" }}
    sharedVpcHosts: {{ $scope.sharedVpcHosts | default list | toJson }}
    {{- end }}
    {{- if hasKey $scope "metricsScopes" }}
    metricsScopes: {{ $scope.metricsScopes | default list | toJson }}
    {{- end }}
    {{- /*
      The cap renders only when the value carries it, for the same reason as the lists
      above: a release record from before the chart knew the key must not patch the
      CRD's default over a cap set on the CR by hand. The composition always passes it.
    */}}
    {{- if hasKey $scope "maxProjects" }}
    maxProjects: {{ $scope.maxProjects | int }}
    {{- end }}
    exclude:
      projects: {{ $scopeExclude.projects | default list | toJson }}
      clusters: {{ $scopeExclude.clusters | default list | toJson }}
  {{- end }}
  {{- /*
    `with`, not `if`: an empty value must OMIT the field, not render it as "". Omitting is
    what leaves the operator free to discover a collector; an explicit "" would look like
    a decision the chart made.
  */}}
  {{- with .Values.telemetry.otlpEndpoint }}
  telemetry:
    otlpEndpoint: {{ . | quote }}
  {{- end }}
  {{- with .Values.platformAgent.networkPolicy }}
  networkPolicy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- $integ := .Values.platformAgent.integration }}
  {{- /* Runs the forge checks, and fails, before anything is written. */}}
  {{- $providers := include "kube-agents.forgeProviders" . }}
  {{- $forges := $integ.forges | default list }}
  {{- $repos := $integ.repositories | default list }}
  {{- /* `gitRepo: None` alone still renders, as it does without forges. */}}
  {{- $githubSet := and $integ.github (or $integ.github.org $integ.github.gitRepo) }}
  {{- /*
  A declaration the deprecated `github` block can express renders as that
  block, whichever spelling the values file used: one GitHub forge with no
  credentialsRef, and at most one repository on it, the GitOps one, with no
  namespace of its own. `helm upgrade` never touches crds/, so an install
  upgraded that way still serves the CRD it was first installed with, and a
  schema without `forges` prunes it: the CR loses its repositories and
  nothing reports it. The alias carries everything such a declaration says
  except the host, and every host GitHub serves is the same forge, which
  kube-agents.forgeProviders has already checked.

  Only a repository the operator would accept for GitHub folds: `name`,
  `owner/name`, or an http(s), ssh or git URL, a schemeless host or an scp
  remote on github.com, www.github.com or ssh.github.com, with no port, naming
  `owner/name`, in the grammar the operator applies. Scheme and host fold
  case, as the operator's do; a URL's userinfo, a token included, is
  printable ASCII with no `[` or `]` (the operator refuses whitespace, control
  characters, and a bracket in a URL's userinfo)
  and ends at its last `@` unless a `#` or `?` comes first (which ends the authority, so the
  host is not github.com), and a schemeless user is not empty; and a run of `/` around the path, which the
  operator trims, is allowed, except that an scp remote's colon takes at most
  one (`github.com://` reads to the operator as a scheme separator). Anything else -- another host, a deeper path,
  an owner GitHub would not accept, a name that is `.`, `..` or `.git`, or
  still ends in `.git`, once its `.git` suffix is dropped, a name over GitHub's
  100 characters, or one that starts with `-`, a GitHub host followed
  only by `/` (`github.com/`; `github.com` and `/github.com` are a name), a value over the CRD's
  2048 characters -- would be refused by the
  operator against `github.gitRepo`, a key the values file never set, and a forge with neither a namespace nor a repository
  would fold into no key at all. Those render as the lists, so the refusal
  names the entry the administrator wrote. A credentialsRef with an empty name
  is unset, as values.yaml's example writes it. A repository that sets
  baseBranch renders as the lists too: the alias has nowhere to put it.
  */}}
  {{- $pinned := false }}
  {{- range $repos }}
  {{- if .baseBranch }}
  {{- $pinned = true }}
  {{- end }}
  {{- end }}
  {{- $asAlias := false }}
  {{- if eq (len $forges) 1 }}
  {{- $f := first $forges }}
  {{- $onlyGitOps := true }}
  {{- range $repos }}
  {{- if or (ne .role "gitops") .namespace }}
  {{- $onlyGitOps = false }}
  {{- end }}
  {{- end }}
  {{- $plain := true }}
  {{- $repo := "" }}
  {{- with $repos }}
  {{- $repo = (first .).repository | default "" }}
  {{- $owner := `[a-zA-Z0-9]([a-zA-Z0-9-]{0,37}[a-zA-Z0-9])?/` }}
  {{- $github := `(?i:(https?|ssh|git)://([!-"$-.0->@-Z\\^-~]*@)?((www|ssh)\.)?github\.com/+|([!-"$-.0-9;->@-~]+@)?((www|ssh)\.)?github\.com(:/?|/+))` }}
  {{- $name := trimSuffix ".git" (base $repo) }}
  {{- $plain = and (le (len $repo) 2048) (regexMatch (printf `^(%s%s|/*(%s)?)[A-Za-z0-9_.][A-Za-z0-9_.-]*/*$` $github $owner $owner) $repo) (not (has $name (list "" "." ".." ".git"))) (le (len $name) 100) (not (hasSuffix ".git" $name)) (not (and (hasSuffix "/" $repo) (has (lower (trimAll "/" $repo)) (list "github.com" "www.github.com" "ssh.github.com")))) }}
  {{- end }}
  {{- $asAlias = and (eq ($f.provider | default "github") "github") (not ($f.credentialsRef | default dict).name) (le (len $repos) 1) $onlyGitOps (not $pinned) $plain (or $f.namespace $repo) }}
  {{- end }}
  {{- $aliasOrg := "" }}
  {{- $aliasRepo := "" }}
  {{- if $asAlias }}
  {{- $aliasOrg = (first $forges).namespace | default "" }}
  {{- with $repos }}
  {{- $aliasRepo = (first .).repository | default "" }}
  {{- end }}
  {{- end }}
  {{- $listed := and (or $forges $repos) (not $asAlias) }}
  {{- /*
  Anything else needs the list fields, which a CRD from before them would
  prune the same way. `lookup` sees the installed CRD on a live install and
  sees nothing under `helm template`, so the guard fires exactly where the
  pruning would happen. repositories[].baseBranch is newer than the lists, and
  a CRD that prunes it leaves the broker enforcing no base with nothing to say
  so, so it gets the same guard.
  */}}
  {{- if $listed }}
  {{- $crd := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "platformagents.kubeagents.x-k8s.io" }}
  {{- if $crd }}
  {{- $props := dict }}
  {{- range $crd.spec.versions }}
  {{- if eq .name "v1alpha1" }}
  {{- $props = dig "schema" "openAPIV3Schema" "properties" "spec" "properties" "integration" "properties" (dict) . }}
  {{- end }}
  {{- end }}
  {{- if not (hasKey $props "forges") }}
  {{- fail "platformAgent.integration.forges needs a PlatformAgent CRD that has the field, and helm upgrade does not update CRDs; apply charts/kube-agents/crds/ first (kubectl apply --server-side -f charts/kube-agents/crds/)" }}
  {{- end }}
  {{- if and $pinned (not (hasKey (dig "repositories" "items" "properties" (dict) $props) "baseBranch")) }}
  {{- fail "platformAgent.integration.repositories[].baseBranch needs a PlatformAgent CRD that has the field, and helm upgrade does not update CRDs; apply charts/kube-agents/crds/ first (kubectl apply --server-side -f charts/kube-agents/crds/)" }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if or (and $asAlias (or $aliasOrg $aliasRepo)) $listed $githubSet $integ.googleChat.enabled $integ.slack.enabled $integ.teams.enabled }}
  integration:
    {{- if and $asAlias (or $aliasOrg $aliasRepo) }}
    github:
      {{- with $aliasOrg }}
      org: {{ . | quote }}
      {{- end }}
      {{- with $aliasRepo }}
      gitRepo: {{ . | quote }}
      {{- end }}
    {{- else if $listed }}
    {{- with $forges }}
    forges:
      {{- range . }}
      - name: {{ .name | quote }}
        provider: {{ .provider | default "github" | quote }}
        {{- with .host }}
        host: {{ . | quote }}
        {{- end }}
        {{- with .namespace }}
        namespace: {{ . | quote }}
        {{- end }}
        {{- with (.credentialsRef | default dict).name }}
        credentialsRef:
          name: {{ . | quote }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- with $repos }}
    repositories:
      {{- range . }}
      - forge: {{ .forge | quote }}
        repository: {{ .repository | quote }}
        {{- with .namespace }}
        namespace: {{ . | quote }}
        {{- end }}
        role: {{ .role | quote }}
        {{- with .baseBranch }}
        baseBranch: {{ . | quote }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- else if $githubSet }}
    github:
      {{- if $integ.github.org }}
      org: {{ $integ.github.org | quote }}
      {{- end }}
      {{- if $integ.github.gitRepo }}
      gitRepo: {{ $integ.github.gitRepo | quote }}
      {{- end }}
    {{- end }}
    {{- if $integ.googleChat.enabled }}
    googleChat:
      enabled: true
      projectId: {{ .Values.platformAgent.harness.projectId | quote }}
      topicName: {{ required "platformAgent.integration.googleChat.topicName is required when googleChat is enabled" $integ.googleChat.topicName | quote }}
      subscriptionName: {{ required "platformAgent.integration.googleChat.subscriptionName is required when googleChat is enabled" $integ.googleChat.subscriptionName | quote }}
      {{- with $integ.googleChat.allowedUsers }}
      allowedUsers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $integ.googleChat.homeChannel }}
      homeChannel: {{ . | quote }}
      {{- end }}
      mode: {{ $integ.googleChat.mode | default "default" | quote }}
    {{- end }}
    {{- if $integ.slack.enabled }}
    slack:
      enabled: true
      # The CRD requires both token refs when Slack is enabled; they point
      # into the credentials Secret by convention.
      botTokenSecretRef:
        name: {{ .Values.platformAgent.credentials.secretName | quote }}
        key: SLACK_BOT_TOKEN
      appTokenSecretRef:
        name: {{ .Values.platformAgent.credentials.secretName | quote }}
        key: SLACK_APP_TOKEN
      {{- with $integ.slack.allowedUsers }}
      allowedUsers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $integ.slack.homeChannel }}
      homeChannel: {{ . | quote }}
      {{- end }}
      {{- with $integ.slack.homeChannelName }}
      homeChannelName: {{ . | quote }}
      {{- end }}
    {{- end }}
    {{- if $integ.teams.enabled }}
    teams:
      enabled: true
      appIdSecretRef:
        name: {{ .Values.platformAgent.credentials.secretName | quote }}
        key: TEAMS_APP_ID
      appPasswordSecretRef:
        name: {{ .Values.platformAgent.credentials.secretName | quote }}
        key: TEAMS_APP_PASSWORD
      {{- with $integ.teams.tenantId }}
      tenantId: {{ . | quote }}
      {{- end }}
      {{- with $integ.teams.allowedUsers }}
      allowedUsers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $integ.teams.allowAllUsers }}
      allowAllUsers: {{ $integ.teams.allowAllUsers }}
      {{- end }}
      {{- with $integ.teams.homeChannel }}
      homeChannel: {{ . | quote }}
      {{- end }}
      {{- with $integ.teams.serviceUrl }}
      serviceUrl: {{ . | quote }}
      {{- end }}
      {{- if hasKey $integ.teams "adaptiveCards" }}
      adaptiveCards: {{ $integ.teams.adaptiveCards }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
