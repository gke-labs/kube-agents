{{- /*
The chart's pods in the release namespace, with their rollout surge pods
(kube-agents.chartQuotaPods), for the operator's next-mode session quota (#4883). The chart
also stamps this count on the PlatformAgent it renders, as the
kubeagents.x-k8s.io/a2a-quota-chart-pods annotation, and the annotation wins. This copy is
for a PlatformAgent written by hand in a release with platformAgent.enabled=false, which
still runs the operator, LiteLLM, Hindsight and the minter here: when the CR carries no
annotation, the operator reads this from its own namespace, rather than counting its
default. It doesn't read it from any other namespace. A fixed name, since the operator
looks it up by name; it holds the value to the annotation's cap and reports one it
discards.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: a2a-quota-chart-pods
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: a2a-quota-chart-pods
    {{- include "kube-agents.labels" . | nindent 4 }}
data:
  pods: {{ include "kube-agents.chartQuotaPods" . | quote }}
