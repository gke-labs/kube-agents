  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-operator
    {{- include "kube-agents.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  # Cluster-scoped: the namespace component prevents two same-named releases
  # in different namespaces from colliding.
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-operator-role
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-operator
    {{- include "kube-agents.labels" . | nindent 4 }}
rules:
