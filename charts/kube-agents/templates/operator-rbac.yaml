---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-operator-rolebinding
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-operator
    {{- include "kube-agents.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-operator-role
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-operator-sa
    namespace: {{ .Release.Namespace }}
# The namespaced half of the operator's generated RBAC: the Role document in
# k8s-operator/config/rbac/role.yaml, which carries the write verbs on every
# namespaced kind the operator renders (Secrets, Deployments, ConfigMaps,
# Roles, ...). The operator writes them in the namespace of the PlatformAgent
# it reconciles, which this chart places in the release namespace, and in that
# namespace's profile namespace under mode next (profiles-namespace.yaml
# creates it), so the Role and its RoleBinding render once per namespace from
# the one rules block `make chart-sync` splices. The ClusterRole above holds
# the reads alone. docs/designs/operator-namespaced-write-verbs.md.
{{- $operatorRoleNamespaces := list .Release.Namespace }}
{{- if and .Values.platformAgent.enabled (eq (toString .Values.platformAgent.mode) "next") }}
{{- $operatorRoleNamespaces = append $operatorRoleNamespaces (printf "%s-profiles" .Release.Namespace) }}
{{- end }}
{{- range $operatorRoleNamespace := $operatorRoleNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-operator-namespaced-role
  namespace: {{ $operatorRoleNamespace }}
  labels:
    app.kubernetes.io/name: {{ $.Chart.Name }}-operator
    {{- include "kube-agents.labels" $ | nindent 4 }}
rules:
  # BEGIN GENERATED NAMESPACED RULES from k8s-operator/config/rbac/role.yaml — do not edit by hand; run `make chart-sync`.
  - apiGroups:
      - ""
    resources:
      - configmaps
      - persistentvolumeclaims
      - pods
      - resourcequotas
      - secrets
      - serviceaccounts
      - services
    verbs:
      - create
      - delete
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - ""
    resources:
      - podtemplates
    verbs:
      - create
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
    verbs:
      - create
      - delete
      - patch
      - update
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - delete
      - patch
      - update
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - delete
      - patch
      - update
  - apiGroups:
      - kubeagents.x-k8s.io
    resources:
      - dispatchjobtemplates
    verbs:
      - create
      - delete
      - patch
      - update
  - apiGroups:
      - networking.gke.io
    resources:
      - fqdnnetworkpolicies
    verbs:
      - create
      - delete
      - patch
      - update
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - create
      - delete
      - patch
      - update
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - create
      - delete
      - patch
      - update
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
      - roles
    verbs:
      - create
      - delete
      - patch
      - update
  # END GENERATED NAMESPACED RULES
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-operator-namespaced-rolebinding
  namespace: {{ $operatorRoleNamespace }}
  labels:
    app.kubernetes.io/name: {{ $.Chart.Name }}-operator
    {{- include "kube-agents.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Name }}-operator-namespaced-role
subjects:
  - kind: ServiceAccount
    name: {{ $.Release.Name }}-operator-sa
    namespace: {{ $.Release.Namespace }}
{{- end }}
---
# Namespaced counterpart of config/rbac/leader_election_role.yaml: the lease
# write verbs and create/patch on events are in the operator's namespaced
# Role above, bound in the release namespace, which is where the controller
# runs its election and where its recorder writes. Kept as its own object to
# match the kustomize install's scope, where the leader-election Role is one.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-operator-leader-election-role
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-operator
    {{- include "kube-agents.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-operator-leader-election-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-operator
    {{- include "kube-agents.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-operator-leader-election-role
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-operator-sa
    namespace: {{ .Release.Namespace }}
{{- end }}
