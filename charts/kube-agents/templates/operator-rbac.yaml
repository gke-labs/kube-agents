      - list
      - watch
  - apiGroups:
      - kubeagents.x-k8s.io
    resources:
      - agentplugins/status
    verbs:
      - get
      - patch
  - apiGroups:
      - kubeagents.x-k8s.io
    resources:
      - agentprofiles
    verbs:
      - get
      - list
      - patch
      - watch
  - apiGroups:
      - kubeagents.x-k8s.io
    resources:
      - agentprofiles/status
    verbs:
      - get
      - update
  - apiGroups:
      - kubeagents.x-k8s.io
    resources:
      - dispatchjobtemplates
    verbs:
      - get
      - list
  - apiGroups:
      - kubeagents.x-k8s.io
    resources:
      - platformagents
    verbs:
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - kubeagents.x-k8s.io
    resources:
