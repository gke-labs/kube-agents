{{- /*
The profile namespace (#3655). AgentProfile workers and their ServiceAccounts
run in <release namespace>-profiles, so profile work never takes a session
slot. The chart creates it, not the operator: creating and deleting Namespaces
is a cluster-scoped grant that can't be narrowed by name on create, and the
operator only needs rights inside this one, which its namespaced grants
already give it. It renders the namespace's quota and network policy
(k8s-operator/internal/controller/agentprofile_namespace.go). Rendered only
for mode next, the only mode that runs profiles. Uninstalling the release
deletes it and everything in it. The operator only trusts a namespace of this
name that carries the component label and the release-namespace annotation
below, so a namespace that merely shares the name is not admitted to the bus.
*/}}
{{- if and .Values.platformAgent.enabled (eq (toString .Values.platformAgent.mode) "next") }}
{{- $name := printf "%s-profiles" .Release.Namespace }}
{{- if gt (len $name) 63 }}
{{- fail (printf "the profile namespace %q is longer than 63 characters; install into a release namespace of 54 characters or fewer" $name) }}
{{- end }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $name | quote }}
  annotations:
    {{- /* The operator requires this and the component label before it treats
    the namespace as the profile namespace. Helm sets the annotation itself on
    install; it is written here too for a `helm template | kubectl apply`. */}}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: profiles
    {{- include "kube-agents.labels" . | nindent 4 }}
{{- end }}
