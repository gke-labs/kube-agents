# tse - the GKE Support Agent (Technical Solutions Engineer) persona, as an AgentProfile.
#
# Models a customer-side Google Cloud Technical Solutions Engineer (TSE) for L1
# GKE support case deflection and structured incident triage (docs/designs/spec-subagent-profiles.md).
#
# Applied to a `mode: next` install, the operator renders this profile's
# ServiceAccount, its bus identity and its agent card. Under the AgentProfile
# dispatcher, a profile worker pod runs each task with the persona-tse image
# mounted at /persona (agents/tse/persona). A task names its target cluster with
# the project, location and cluster parameters, in the persona's order, and the
# credential broker holds the task's kubectl and gcloud calls to it.
# Project-wide questions wait on #5424.
apiVersion: kubeagents.x-k8s.io/v1alpha1
kind: AgentProfile
metadata:
  name: tse
spec:
  description: >-
    Customer-side GKE Technical Solutions Engineer (TSE) for L1 support case
    deflection and cross-layer incident triage. Performs read-only diagnostics
    across Kubernetes (kubectl) and GCP control-plane telemetry (Cloud Logging,
    Cloud Monitoring, GKE operations) using sanitized Google Cloud support
    skills, returning either a grounded Root Cause Analysis with a proposed
    GitOps fix or a redacted Google Cloud Support Escalation Bundle.

  persona:
    # agents/tse/persona: manifest, instructions, MCP servers and the TSE skill.
    image: <registry>/kube-agents/persona-tse:2026.08

  harness:
    image: <registry>/kube-agents/agent-worker:2026.08
    model: model-default
    maxTurns: 90

  bus:
    # Read-only on the blackboard: reads standing cluster/upgrade state and
    # returns its Root Cause Analysis or Escalation Bundle in the task result.
    subscribeTopics:
      - shared.blueprint
      - agent.platform.upgrade-readiness

  identity: {}
    # Operator-created KSA with zero RoleBindings; the worker's kubectl, gcloud
    # and developer_knowledge reads go through the credential broker.

  parameters:
    - name: project
      required: true
    - name: cluster
      required: true
    - name: location
      required: true

  lifecycle:
    activeDeadlineSeconds: 1800
    ttlSecondsAfterFinished: 600

  concurrency: 2

  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 2Gi }
