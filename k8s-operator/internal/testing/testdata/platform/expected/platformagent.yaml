apiVersion: v1
data:
  leader_elect.py: <OMITTED_FOR_TESTS>
  managed-config.yaml: |
    approvals:
      cron_mode: approve
    display:
      platforms:
        google_chat:
          busy_ack_detail: false
          interim_assistant_messages: false
          long_running_notifications: true
          memory_notifications: "off"
          tool_progress: "off"
    model:
      api_key: none
      api_mode: chat_completions
      base_url: http://litellm.kubeagents-system.svc.cluster.local/v1
      default: model-default
      model: model-default
      provider: custom
    platforms:
      google_chat:
        enabled: true
        typing_status_text: Kage is thinking…
      slack:
        enabled: false
        extra:
          rich_blocks: true
  managed.env: |
    GOOGLE_CHAT_RELAY_URL=http://127.0.0.1:8765
    GOOGLE_CHAT_PROJECT_ID=kube-agents-gkedemos
    GOOGLE_CHAT_SUBSCRIPTION_NAME=projects/kube-agents-gkedemos/subscriptions/kubeagents-google-chat-events-sub
    GOOGLE_CHAT_ALLOWED_USERS=
    GOOGLE_CHAT_ALLOW_ALL_USERS=true
    GATEWAY_ALLOWED_USERS=
    GATEWAY_ALLOW_ALL_USERS=false
  profile-platform.overlay.yaml: |
    memory:
      provider: ""
