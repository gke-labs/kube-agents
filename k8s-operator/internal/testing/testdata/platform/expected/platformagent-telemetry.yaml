  managed-config.yaml: |
    approvals:
      cron_mode: approve
    display: {}
    model:
      api_key: none
      api_mode: chat_completions
      base_url: http://litellm.kubeagents-system.svc.cluster.local/v1
      default: model-default
      model: model-default
      provider: custom
    platforms:
      google_chat:
        enabled: false
      slack:
        enabled: false
        extra:
          rich_blocks: true
      teams:
        enabled: false
        extra:
          adaptive_cards: true
    terminal:
      backend: ssh
      lifetime_seconds: 2592000
      ssh_host: platformagent-shell-0.platformagent-shell.kubeagents-system.svc.cluster.local
      ssh_key: /etc/sandbox-ssh/id_ed25519
      ssh_port: 2222
      ssh_user: agent
      workspace_root: /opt/data
  managed.env: |
    API_SERVER_KEY=cluster-internal-trusted
    KUBEAGENTS_MODE=today
  profile-platform.overlay.yaml: |
    memory:
      provider: ""
