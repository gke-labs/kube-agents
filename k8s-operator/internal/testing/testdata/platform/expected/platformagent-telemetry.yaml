spec:
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: node-local-dns
        - ipBlock:
            cidr: 169.254.20.10/32
        - ipBlock:
            cidr: 169.254.169.254/32
        - ipBlock:
            cidr: 10.96.0.10/32
    - ports:
        - port: 8765
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app: platformagent-credential-proxy
              kubeagents.x-k8s.io/component: credential-proxy
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: platformagent-gateway
      ports:
        - port: 2222
          protocol: TCP
  podSelector:
    matchLabels:
      app: platformagent-shell
  policyTypes:
    - Ingress
    - Egress
