              name: event-watcher-ksa-token
              readOnly: true
            - mountPath: /etc/gitops
              name: gitops-state-volume
              readOnly: true
      securityContext:
        fsGroup: 10000
        runAsNonRoot: true
        runAsUser: 10000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kubeagents-platform-agent
