apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: platformagent-shell
    app.kubernetes.io/instance: kubeagents-system-platformagent
    app.kubernetes.io/managed-by: platformagent-controller
    app.kubernetes.io/name: platform-agent
    app.kubernetes.io/part-of: kube-agents
  name: platformagent-shell
  namespace: kubeagents-system
  ownerReferences:
    - apiVersion: kubeagents.x-k8s.io/v1alpha1
      blockOwnerDeletion: true
      controller: true
      kind: PlatformAgent
      name: platformagent
      uid: ""
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  replicas: 1
  selector:
    matchLabels:
      app: platformagent-shell
      app.kubernetes.io/instance: kubeagents-system-platformagent
      app.kubernetes.io/managed-by: platformagent-controller
      app.kubernetes.io/name: platform-agent
      app.kubernetes.io/part-of: kube-agents
  serviceName: platformagent-shell
  template:
    metadata:
      annotations:
        kubeagents.x-k8s.io/settings-config-hash: <SHA256_FOR_TESTS>
      labels:
        app: platformagent-shell
        app.kubernetes.io/instance: kubeagents-system-platformagent
        app.kubernetes.io/managed-by: platformagent-controller
        app.kubernetes.io/name: platform-agent
        app.kubernetes.io/part-of: kube-agents
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: CREDENTIAL_PROXY_URL
              value: http://platformagent-credential-proxy.kubeagents-system.svc.cluster.local:8765
            - name: CREDENTIAL_PROXY_TOKEN_FILE
              value: /var/run/secrets/kubeagents/credential-proxy/token
          image: ghcr.io/gke-labs/kube-agents/agent-sandbox:latest
          name: shell
          ports:
            - containerPort: 2222
              name: ssh
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 5
            tcpSocket:
              port: 2222
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 200m
              memory: 512Mi
          securityContext:
            capabilities:
              drop:
                - NET_RAW
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /etc/ssh-authorized
              name: authorized-keys
              readOnly: true
            - mountPath: /opt/data
              name: data
            - mountPath: /var/lib/sandbox-sshd
              name: sshd
            - mountPath: /home/agent/.hermes
              name: hermes-sync-block
              readOnly: true
            - mountPath: /var/run/secrets/kubeagents/credential-proxy
              name: credential-proxy-token
              readOnly: true
            - mountPath: /opt/data/SETTINGS.md
              name: settings
              readOnly: true
              subPath: SETTINGS.md
      enableServiceLinks: false
      serviceAccountName: platformagent-shell
      shareProcessNamespace: false
      volumes:
        - name: authorized-keys
          secret:
            items:
              - key: authorized_keys
                path: authorized_keys
            secretName: platformagent-shell-authorized-keys
        - configMap:
            name: platformagent-settings
            optional: true
          name: settings
        - emptyDir: {}
          name: hermes-sync-block
        - name: credential-proxy-token
          projected:
            defaultMode: 292
            sources:
              - serviceAccountToken:
                  audience: kubeagents-credential-proxy
                  expirationSeconds: 3600
                  path: token
  updateStrategy: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
      status: {}
    - metadata:
        name: sshd
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
      status: {}
status:
  availableReplicas: 0
  replicas: 0
