            - name: CREDENTIAL_PROXY_A2A_CHAT_AUDIENCE
              value: kubeagents-credential-proxy-a2a-chat
          image: ghcr.io/gke-labs/kube-agents/credential-proxy:latest
          imagePullPolicy: IfNotPresent
          name: envoy-credential-proxy
          ports:
            - containerPort: 8765
              name: cred-proxy
            - containerPort: 8766
              name: cred-metrics
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: cred-proxy
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "1"
              ephemeral-storage: 2Gi
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /etc/credential-proxy/policy.json
              name: credential-proxy-policy
              readOnly: true
              subPath: policy.json
            - mountPath: /tmp
              name: credential-proxy-tmp
            - mountPath: /var/lib/credential-proxy
              name: credential-proxy-state
            - mountPath: /var/run/credential-proxy
              name: credential-proxy-runtime
            - mountPath: /var/run/event-watcher
              name: event-watcher-kubeconfig
            - mountPath: /var/run/secrets/kubeagents/serviceaccount
              name: credential-proxy-ksa-token
              readOnly: true
            - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              name: event-watcher-ksa-token
              readOnly: true
            - mountPath: /etc/gitops
              name: gitops-state-volume
              readOnly: true
      securityContext:
        fsGroup: 10000
        runAsNonRoot: true
        runAsUser: 10000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kubeagents-platform-agent
      volumes:
        - configMap:
            name: platformagent-credential-proxy-policy
          name: credential-proxy-policy
        - emptyDir:
            sizeLimit: 2Gi
          name: credential-proxy-tmp
        - emptyDir:
            sizeLimit: 5Gi
          name: credential-proxy-state
        - emptyDir:
            medium: Memory
            sizeLimit: 16Mi
          name: credential-proxy-runtime
        - emptyDir:
            medium: Memory
            sizeLimit: 1Mi
          name: event-watcher-kubeconfig
        - name: credential-proxy-ksa-token
          projected:
            defaultMode: 256
            sources:
              - serviceAccountToken:
                  audience: kubeagents-credential-proxy
                  expirationSeconds: 3600
                  path: token
        - name: event-watcher-ksa-token
          projected:
            defaultMode: 256
            sources:
              - serviceAccountToken:
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  items:
                    - key: ca.crt
                      path: ca.crt
                  name: kube-root-ca.crt
              - downwardAPI:
                  items:
                    - fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
                      path: namespace
        - configMap:
            defaultMode: 420
            name: platformagent-gitops-state
          name: gitops-state-volume
status: {}
