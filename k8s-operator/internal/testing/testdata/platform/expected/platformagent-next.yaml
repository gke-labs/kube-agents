          imagePullPolicy: IfNotPresent
          name: envoy-credential-proxy
          ports:
            - containerPort: 8765
              name: cred-proxy
            - containerPort: 8766
              name: cred-metrics
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: cred-proxy
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "1"
              ephemeral-storage: 2Gi
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /etc/credential-proxy/policy.json
              name: credential-proxy-policy
              readOnly: true
              subPath: policy.json
            - mountPath: /tmp
              name: credential-proxy-tmp
            - mountPath: /var/lib/credential-proxy
              name: credential-proxy-state
            - mountPath: /var/run/credential-proxy
              name: credential-proxy-runtime
            - mountPath: /var/run/event-watcher
