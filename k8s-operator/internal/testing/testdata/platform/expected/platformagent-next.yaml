apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: platformagent-shell
    app.kubernetes.io/instance: kubeagents-system-platformagent
    app.kubernetes.io/managed-by: platformagent-controller
    app.kubernetes.io/name: platform-agent
    app.kubernetes.io/part-of: kube-agents
  name: platformagent-shell
  namespace: kubeagents-system
  ownerReferences:
    - apiVersion: kubeagents.x-k8s.io/v1alpha1
      blockOwnerDeletion: true
      controller: true
      kind: PlatformAgent
      name: platformagent
      uid: ""
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  replicas: 1
  selector:
    matchLabels:
      app: platformagent-shell
      app.kubernetes.io/instance: kubeagents-system-platformagent
      app.kubernetes.io/managed-by: platformagent-controller
      app.kubernetes.io/name: platform-agent
      app.kubernetes.io/part-of: kube-agents
  serviceName: platformagent-shell
  template:
    metadata:
      annotations:
        kubeagents.x-k8s.io/settings-config-hash: <SHA256_FOR_TESTS>
      labels:
        app: platformagent-shell
        app.kubernetes.io/instance: kubeagents-system-platformagent
        app.kubernetes.io/managed-by: platformagent-controller
        app.kubernetes.io/name: platform-agent
        app.kubernetes.io/part-of: kube-agents
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: CREDENTIAL_PROXY_URL
              value: http://platformagent-credential-proxy.kubeagents-system.svc.cluster.local:8765
            - name: CREDENTIAL_PROXY_TOKEN_FILE
              value: /var/run/secrets/kubeagents/credential-proxy/token
            - name: GKE_PROJECT_ID
              value: example-project
            - name: GKE_CLUSTER_NAME
              value: cluster-a
            - name: GKE_LOCATION
              value: us-central1-a
            - name: KUBE_CONTEXT_NAME
              value: gke_example-project_us-central1-a_cluster-a
            - name: KUBEAGENTS_SCOPE_DECLARED
              value: "false"
            - name: SANDBOX_IMAGE_TREES
              value: read-only-mounts
            - name: SANDBOX_HOME_ROOTS
              value: . profiles/platform
          image: ghcr.io/gke-labs/kube-agents/agent-sandbox:latest
          name: shell
          ports:
            - containerPort: 2222
              name: ssh
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 5
            tcpSocket:
              port: 2222
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 200m
              memory: 512Mi
          securityContext:
            capabilities:
              drop:
                - NET_RAW
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /etc/ssh-authorized
              name: authorized-keys
              readOnly: true
            - mountPath: /opt/data
              name: data
            - mountPath: /var/lib/sandbox-sshd
              name: sshd
            - mountPath: /home/agent/.hermes
              name: hermes-sync-block
              readOnly: true
            - mountPath: /var/run/secrets/kubeagents/credential-proxy
              name: credential-proxy-token
              readOnly: true
            - mountPath: /opt/data/SETTINGS.md
              name: settings
              readOnly: true
              subPath: SETTINGS.md
            - mountPath: /etc/gitops
              name: gitops-state-volume
              readOnly: true
            - mountPath: /opt/data/profiles
              name: data
              subPath: profiles
            - mountPath: /opt/data/profiles/platform
              name: data
              subPath: profiles/platform
            - mountPath: /opt/data/skills
