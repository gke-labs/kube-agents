apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/instance: kubeagents-system-platformagent
    app.kubernetes.io/managed-by: platformagent-controller
    app.kubernetes.io/name: platform-agent
    app.kubernetes.io/part-of: a2a-next
    kubeagents.x-k8s.io/a2a-component: nats-config
  name: platformagent-a2a-nats-config
  namespace: kubeagents-system
  ownerReferences:
    - apiVersion: kubeagents.x-k8s.io/v1alpha1
      blockOwnerDeletion: true
      controller: true
      kind: PlatformAgent
      name: platformagent
      uid: ""
stringData:
  nats.conf: |
    # PLAYGROUND POSTURE (stage 1): single-node R1 JetStream (production: 3-node
    # R3), no audit exporter, no breaker, gateway sweep as the only janitor. Each
    # has a decided design in the specs (spec-nats-deployment.md); none gates
    # letting people play.
    #
    # Authentication is NOT on that list any more. The auth callout is armed: a
    # client presents a projected Kubernetes ServiceAccount token, the callout
    # validates it against the cluster with a TokenReview, and answers with the
    # permission set the operator mapped that identity to. Session pods go through
    # it, and a session's grants are derived from the pod the API server attested
    # rather than read from a map, so two sessions on one account cannot reach each
    # other.
    #
    # The users that remain static below are of two kinds, and each says which it
    # is where it is defined. Some have nothing to present: a browser, an operator
    # at a port-forward, the callout itself, which cannot authenticate through
    # itself. The rest have a ServiceAccount and could move tomorrow, but no client
    # that sends a token yet - moving the identity before the program that uses it
    # would refuse the workload at connect.

    server_name: platformagent-a2a-nats
    port: 4222
    http: 8222

    # TLS on the client listener, required of every connection: the server
    # advertises tls_required, so a client that dials nats:// is told to upgrade
    # and one that cannot verify this certificate is refused. The serving pair is
    # the operator-minted one in the platformagent-a2a-nats-tls Secret,
    # mounted as a directory (platformagent_a2a_tls.go). The monitoring port above
    # stays plain HTTP: it carries health and stats, not payloads or tokens.
    tls {
      cert_file: "/etc/nats-tls/tls.crt"
      key_file: "/etc/nats-tls/tls.key"
    }

    # A ServiceAccount token travels inside the client's CONNECT frame, and the
    # default max_control_line of 4096 bounds that whole frame - measured, the
    # usable room for the token itself is around 3920 bytes once the rest of the
    # CONNECT JSON is accounted for. A plain projected token fits with room to
    # spare; one bound to several audiences, from a client with a long name, does
    # not. The failure is not graceful: the server closes the connection with
    # "Maximum Control Line Exceeded" before authentication happens at all, so it
    # reads as the bus refusing a workload rather than as a size limit.
    max_control_line: 65536

    # Websocket listener for the console page and the read-only web user.
    #
    # TLS, from the same serving pair as the client listener (the tls block
    # above): the CONNECT frame carries a password, so the pod-network leg from
    # the console server is encrypted and verified against the bus CA. The
    # Service is ClusterIP, so nothing OUTSIDE the cluster reaches this listener.
    # An ingress NetworkPolicy fences the pod network too: 4222 from the
    # enumerated bus clients, 9222 from the console server alone, and no
    # pod-network peer for 8222. The console server is admitted because it is the
    # page's proxy. A browser reaches it through a kubectl port-forward and it
    # forwards the websocket here over wss, with the browser's headers intact. It
    # is not an in-cluster door for anything else. A port-forward straight to
    # 9222 still enters from the node, which NetworkPolicy does not govern, but it
    # now needs a TLS client that trusts the bus CA and names the Service as its
    # server name: a browser cannot, so the page always goes through the console.
    #
    # The origin allow-list is the console server's origin as the browser sees it
    # through the documented port-forward. The proxy forwards Origin unchanged,
    # so the list still applies. WebSockets are exempt from CORS, and for as long
    # as a port-forward runs, every page the operator's browser visits can try to
    # open a socket through it.
    #
    # allowed_origins, NOT same_origin: same_origin compares the browser's Origin
    # against the Host this listener sees, and behind the proxy that is the bus's
    # own service name, which no browser page is served from. A CLI or Node client
    # sends no Origin header at all, which both settings permit.
    #
    # Origin is browser-asserted, so this stops a browser page and nothing else.
    # The boundary is the grant lists below.
    websocket {
      port: 9222
      tls {
        cert_file: "/etc/nats-tls/tls.crt"
        key_file: "/etc/nats-tls/tls.key"
      }
      allowed_origins: ["http://localhost:8080", "http://127.0.0.1:8080"]
    }

    jetstream {
      store_dir: /data
      # Under the 40Gi PV; the stream max_bytes caps (20+5+1+1 GiB) plus KV live
      # inside this.
      max_file_store: 34359738368
    }
    accounts {
      # AUTH: the auth callout service and nothing else.
      #
      # A dedicated account, and that is a boundary rather than tidiness. The
      # server publishes each authorization request into THIS account and takes
      # the first answer that comes back on the reply inbox — and it does not
      # check that the answer's outer envelope was signed by the configured
      # issuer (measured; the inner user JWT's signature IS checked). So anything
      # able to publish into this account's $SYS._INBOX.> and win the race can
      # answer an authorization request. It could not forge a grant without the
      # issuer seed, but it could refuse one. Nothing else belongs in here.
      AUTH {
        users [
          {
            # The callout cannot authenticate through itself, so it is exempt via
            # auth_users below and carries a password. This permission pair is
            # the entire surface it needs: read the requests, answer them.
            user: callout
            password: "<GENERATED:platformagent-a2a-nats-creds/callout-password>"
            permissions {
              subscribe { allow = [ "$SYS.REQ.USER.AUTH" ] }
              publish { allow = [ "$SYS._INBOX.>" ] }
            }
          }
        ]
      }
      APP {
        jetstream: enabled
        users [
          # task requester, chat-session supervisor, session-registry owner.
          # STATIC, and this one is a sequencing fact rather than a property of
          # the gateway. It has a ServiceAccount and could authenticate with it
          # tomorrow; what it does not yet have is a client that presents a token
          # instead of a password, because the gateway program lands separately
          # from this render. Moving the identity before the program that uses it
          # would refuse the gateway at connect on every install.
          # Its $JS.API grant is scoped to what it emits, by name and by verb
          # (#1666): INFO, CONSUMER.CREATE, CONSUMER.MSG.NEXT and DIRECT.GET on
          # TASKS, and INFO, DIRECT.GET and consumer create/delete on
          # KV_session-state, its own registry, and on KV_feedback, the kept
          # answer ratings. So no STREAM.DELETE, PURGE,
          # UPDATE or MSG.DELETE on any stream - one STREAM.DELETE.TASKS here
          # used to destroy every task's history and the five consumers on it -
          # no CONSUMER.DELETE on TASKS, and nothing at all on DIRECTORY, the
          # topic streams or the other two buckets.
          {
            user: gateway
            password: "<GENERATED:platformagent-a2a-nats-creds/gateway-password>"
            permissions {
              publish {
                allow = [
                  "a2a.tasks.*.*.in",
                  "a2a.tasks.*.*.supervisor",
                  "$KV.session-state.>",
                  "$KV.feedback.>",
                  "chat.console.*.out",
                  "chat.notify.reply.agent.>",
                  "$KV.cap.root.*",
                  "chat.board",
                  "$JS.API.STREAM.INFO.TASKS",
                  "$JS.API.CONSUMER.CREATE.TASKS.>",
                  "$JS.API.CONSUMER.MSG.NEXT.TASKS.*",
                  "$JS.API.DIRECT.GET.TASKS.>",
                  "$JS.API.STREAM.INFO.KV_session-state",
                  "$JS.API.DIRECT.GET.KV_session-state.>",
                  "$JS.API.CONSUMER.CREATE.KV_session-state.>",
                  "$JS.API.CONSUMER.DELETE.KV_session-state.*",
                  "$JS.API.STREAM.INFO.KV_feedback",
                  "$JS.API.DIRECT.GET.KV_feedback.>",
                  "$JS.API.CONSUMER.CREATE.KV_feedback.>",
                  "$JS.API.CONSUMER.DELETE.KV_feedback.*",
                  "$JS.ACK.TASKS.>",
                  "$JS.FC.>",
                  "_INBOX.gateway.>"
                ]
                deny = [
                  "$JS.API.*.*.KV_cap",
                  "$JS.API.*.*.KV_cap.>",
                  "$JS.API.*.*.*.KV_cap",
                  "$JS.API.*.*.*.KV_cap.>"
                ]
              }
              subscribe {
                allow = [
                  "a2a.tasks.*.*.events",
                  "a2a.tasks.*.*.supervisor",
                  "a2a.agents.>",
                  "agents.hb.>",
                  "$KV.session-state.>",
                  "$KV.feedback.>",
                  "chat.console.*.in",
                  "chat.notify.gchat",
                  "chat.notify.slack",
                  "chat.notify.console",
                  "chat.board.reply.gateway.>",
                  "_INBOX.gateway.>"
                ]
                deny = [
                  "$KV.cap.>"
                ]
              }
            }
          }
          # the Hermes bridge sidecar: executor for the `platform` addressee only.
          # STATIC because it shares the agent pod, and a ServiceAccount token names a
          # pod rather than a container — a callout identity here would be the agent
          # container's grants and this one's added together, which is the credential
          # the retired `worker` user was. Its WRITE is narrowed to one addressee:
          # publishing another's events is refused. Its READ is not. The JetStream
          # grants below name the TASKS stream, and both DIRECT.GET and a consumer's
          # filter_subject reach every addressee on it, so a holder of this password
          # can read every session's prompts. `worker` held the identical two grants.
          {
            user: bridge
            password: "<GENERATED:platformagent-a2a-nats-creds/bridge-password>"
            permissions {
              publish {
                allow = [
                  "a2a.tasks.platform.*.events",
                  "$KV.runtime-state.>",
                  "$JS.API.STREAM.INFO.TASKS",
                  "$JS.API.CONSUMER.CREATE.TASKS.>",
                  "$JS.API.CONSUMER.MSG.NEXT.TASKS.*",
                  "$JS.API.DIRECT.GET.TASKS.>",
                  "$JS.API.STREAM.INFO.KV_runtime-state",
                  "$JS.API.CONSUMER.CREATE.KV_runtime-state.>",
                  "$JS.API.CONSUMER.DELETE.KV_runtime-state.*",
                  "$JS.ACK.TASKS.>",
                  "$JS.FC.>",
                  "_INBOX.bridge.>",
                  "a2a.cap.verify.platform",
                  "chat.board.reply.gateway.>"
                ]
                deny = [
                  "$JS.API.*.*.KV_cap",
                  "$JS.API.*.*.KV_cap.>",
                  "$JS.API.*.*.*.KV_cap",
                  "$JS.API.*.*.*.KV_cap.>"
                ]
              }
              subscribe {
                allow = [
                  "a2a.tasks.platform.*.in",
                  "$KV.runtime-state.>",
                  "a2a.cap.reply.platform.>",
                  "chat.board",
                  "_INBOX.bridge.>"
                ]
                deny = [
                  "$KV.cap.>"
                ]
              }
            }
          }
          # hand-applied seed tooling. STATIC because it is applied rather than
          # rendered: it exists on installs today, and removing its user would refuse
          # it at connect the next time it ran. The rendered provisioner beside it
          # does the same job through the callout.
          # Its $JS.API grant is scoped to the streams that provisioning creates, by
          # name and by verb (#1306): CREATE and INFO on those and nothing else, so no
          # RESTORE, no MSG.DELETE or PURGE, no CONSUMER.CREATE and no STREAM.DELETE.
          # No ack grant either - seed creates no consumers, so one would be pure
          # unused capability to +TERM other principals' deliveries (the same deletion
          # the web user got).
          # Seed also reads no topics. "a2a topics read" is a stream API call
          # (GetLastMsgForSubject, so $JS.API.DIRECT.GET.<stream>.<subject> on these
          # streams, or STREAM.MSG.GET as the fallback) and the scoped grant below
          # refuses both. Nothing runs it as seed: the seed tooling does writes and
          # info checks only, and the a2a CLI runs in the agent pod as agent.
          {
            user: seed
            password: "<GENERATED:platformagent-a2a-nats-creds/seed-password>"
            permissions {
              publish {
                allow = [
                  "a2a.topics.agent.platform.upgrade-readiness",
                  "a2a.topics.agent.platform.topology-skew",
                  "a2a.topics.shared.blueprint",
                  "a2a.topics.shared.annotations",
                  "$JS.API.INFO",
                  "$JS.API.STREAM.NAMES",
                  "$JS.API.STREAM.CREATE.TASKS",
                  "$JS.API.STREAM.INFO.TASKS",
                  "$JS.API.STREAM.CREATE.DIRECTORY",
                  "$JS.API.STREAM.INFO.DIRECTORY",
                  "$JS.API.STREAM.CREATE.TOPICS-STATE",
                  "$JS.API.STREAM.INFO.TOPICS-STATE",
                  "$JS.API.STREAM.CREATE.TOPICS-JOURNAL",
                  "$JS.API.STREAM.INFO.TOPICS-JOURNAL",
                  "$JS.API.STREAM.CREATE.KV_runtime-state",
                  "$JS.API.STREAM.INFO.KV_runtime-state",
                  "$JS.API.STREAM.CREATE.KV_session-state",
                  "$JS.API.STREAM.INFO.KV_session-state",
                  "$JS.API.STREAM.CREATE.KV_cap",
                  "$JS.API.STREAM.INFO.KV_cap",
                  "$JS.API.STREAM.CREATE.KV_feedback",
                  "$JS.API.STREAM.INFO.KV_feedback",
                  "_INBOX.seed.>"
                ]
              }
              subscribe {
                allow = [
                  "a2a.topics.>",
                  "_INBOX.seed.>"
                ]
              }
            }
          }
          # the read surface, and one of the two credentials published to a
          # browser by design - console is the other. STATIC permanently: a browser holds no ServiceAccount token and
          # there is no mechanism by which it could. Read-only is not expressible as
          # a subject list - JetStream puts the reach in the request BODY - so the JS
          # API grants are enumerated per stream and there is no ack grant.
          {
            user: web
            password: "<GENERATED:platformagent-a2a-nats-creds/web-password>"
            permissions {
              publish {
                allow = [
                  "$JS.API.INFO",
                  "$JS.API.STREAM.INFO.TASKS",
                  "$JS.API.STREAM.INFO.DIRECTORY",
                  "$JS.API.STREAM.INFO.TOPICS-STATE",
                  "$JS.API.STREAM.INFO.TOPICS-JOURNAL",
                  "$JS.API.CONSUMER.CREATE.TASKS.>",
                  "$JS.API.CONSUMER.CREATE.DIRECTORY.>",
                  "$JS.API.CONSUMER.CREATE.TOPICS-STATE.>",
                  "$JS.API.CONSUMER.CREATE.TOPICS-JOURNAL.>",
                  "$JS.API.CONSUMER.INFO.TASKS.*",
                  "$JS.API.CONSUMER.INFO.DIRECTORY.*",
                  "$JS.API.CONSUMER.INFO.TOPICS-STATE.*",
                  "$JS.API.CONSUMER.INFO.TOPICS-JOURNAL.*",
                  "$JS.API.CONSUMER.MSG.NEXT.TASKS.*",
                  "$JS.API.CONSUMER.MSG.NEXT.DIRECTORY.*",
                  "$JS.API.CONSUMER.MSG.NEXT.TOPICS-STATE.*",
                  "$JS.API.CONSUMER.MSG.NEXT.TOPICS-JOURNAL.*",
                  "_INBOX.web.>"
                ]
              }
              subscribe {
                allow = [
                  "a2a.>",
                  "_INBOX.web.>"
                ]
                deny = [
                  "a2a.cap.>"
                ]
              }
            }
          }
          # the web console: web's read surface plus one publish, chat.console.*.in,
          # which is the gateway's console adapter's inbound subject. STATIC for
          # web's reason. No JetStream verb on any KV_* stream: STREAM.INFO's
          # subjects_filter would list every key.
          {
            user: console
            password: "<GENERATED:platformagent-a2a-nats-creds/console-password>"
            permissions {
              publish {
                allow = [
                  "$JS.API.INFO",
                  "$JS.API.STREAM.INFO.TASKS",
                  "$JS.API.STREAM.INFO.DIRECTORY",
                  "$JS.API.STREAM.INFO.TOPICS-STATE",
                  "$JS.API.STREAM.INFO.TOPICS-JOURNAL",
                  "$JS.API.CONSUMER.CREATE.TASKS.>",
                  "$JS.API.CONSUMER.CREATE.DIRECTORY.>",
                  "$JS.API.CONSUMER.CREATE.TOPICS-STATE.>",
                  "$JS.API.CONSUMER.CREATE.TOPICS-JOURNAL.>",
                  "$JS.API.CONSUMER.INFO.TASKS.*",
                  "$JS.API.CONSUMER.INFO.DIRECTORY.*",
                  "$JS.API.CONSUMER.INFO.TOPICS-STATE.*",
                  "$JS.API.CONSUMER.INFO.TOPICS-JOURNAL.*",
                  "$JS.API.CONSUMER.MSG.NEXT.TASKS.*",
                  "$JS.API.CONSUMER.MSG.NEXT.DIRECTORY.*",
                  "$JS.API.CONSUMER.MSG.NEXT.TOPICS-STATE.*",
                  "$JS.API.CONSUMER.MSG.NEXT.TOPICS-JOURNAL.*",
                  "chat.console.*.in",
                  "_INBOX.console.>"
                ]
              }
              subscribe {
                allow = [
                  "a2a.>",
                  "chat.console.*.out",
                  "_INBOX.console.>"
                ]
                deny = [
                  "a2a.cap.>"
                ]
              }
            }
          }
        ]
      }
      # $SYS: human operators and monitoring only; no agent authenticates here.
      SYS {
        users [
          # human operators and monitoring. No agent ever authenticates here.
          # STATIC: the holder is a person with a port-forward or a scrape config.
          {
            user: sys
            password: "<GENERATED:platformagent-a2a-nats-creds/sys-password>"
          }
        ]
      }
    }
    system_account: SYS

    # The auth callout: who a connection is, decided against the cluster that
    # issued its identity rather than against a password this file rendered.
    #
    # What changes for a client: it presents a projected ServiceAccount token
    # instead of a password, the callout validates that token with a TokenReview
    # against the local API server, and the grants it gets back are the ones the
    # operator rendered for that ServiceAccount. What does NOT change is where
    # enforcement happens — the permission set still arrives before the connection
    # is usable, and the server still refuses on it without consulting any
    # application code.
    authorization {
      # Two seconds, and this is a ceiling rather than a preference.
      #
      # The server starts a first-ping timer on a connection that has not yet
      # authenticated, at roughly two seconds. If the callout has not answered by
      # then the client receives a PING where the Go client library requires a
      # PONG, and it aborts the connect reporting "expected 'PONG', got 'PING'" —
      # which names nothing about authorization and sends whoever is debugging it
      # to the network layer. Measured: at timeout 2 the failure is a clean
      # Authorization Violation at a predictable deadline; at 3 or above it is
      # that message instead. A merely SLOW callout hits it too, so the real
      # budget for a TokenReview round trip is under two seconds whatever this
      # number says.
      timeout: 2

      auth_callout {
        # Public halves only. The seeds live in the callout's own Secret, read by
        # the callout Deployment and nothing else. The issuer signs the user JWTs
        # that carry the permissions this server enforces, so its holder can mint a
        # user with any grants at all — including publish on $KV.cap.root.> and read
        # on $KV.cap.>, which is the whole capability store. See the callout-keys
        # Secret for the custody note.
        issuer: <GENERATED:platformagent-a2a-callout-keys/issuer-public>
        account: AUTH

        # The request carries the client's raw ServiceAccount token, so it is
        # encrypted in flight to the callout. Note the server does not require the
        # RESPONSE to be encrypted even with this set, so response confidentiality
        # is the callout's own discipline rather than something enforced here.
        xkey: <GENERATED:platformagent-a2a-callout-keys/xkey-public>

        # Exempt from the callout: authenticated from this file, by username.
        #
        # This is a bypass and not a fallback — a listed user with a wrong
        # password is refused statically and never reaches the callout at all.
        # The list is the callout itself, which cannot authenticate through
        # itself, plus every identity marked STATIC above. The session entry is
        # absent exactly because it is not one: a session pod presents a
        # pod-bound ServiceAccount token and the callout scopes it to its own
        # task. Do not read this list as the session path.
        #
        # A name is here for one of three reasons, and each identity's own comment
        # above says which. It can hold no projected token at all — the browser's
        # two credentials, web and console, the $SYS login held by a person, the
        # seed tooling that is applied rather than run. Or it is a sidecar, which
        # a ServiceAccount token cannot name apart from the container beside it —
        # the bridge, whose own comment above says what a callout entry there
        # would merge. Or it could move and has not: gateway, which is the
        # remaining migration. The first two reasons are permanent; only the
        # third is a migration.
        auth_users: [ callout, gateway, bridge, seed, web, console, sys ]
      }
    }
---
