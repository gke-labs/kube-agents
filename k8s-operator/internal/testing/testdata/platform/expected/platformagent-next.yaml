    matchLabels:
      app: platformagent-credential-proxy
      kubeagents.x-k8s.io/component: credential-proxy
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kubeagents.x-k8s.io/proxy-policy-hash: <SHA256_FOR_TESTS>
      labels:
        app: platformagent-credential-proxy
        app.kubernetes.io/instance: kubeagents-system-platformagent
        app.kubernetes.io/managed-by: platformagent-controller
