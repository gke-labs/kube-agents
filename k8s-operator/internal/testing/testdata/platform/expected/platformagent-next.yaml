            name: platformagent-settings
          name: settings-volume
        - configMap:
            defaultMode: 420
            name: platformagent-gitops-state
          name: gitops-state-volume
        - emptyDir:
            sizeLimit: 2Gi
          name: tmp-scratch
        - emptyDir:
            sizeLimit: 2Gi
          name: credential-proxy-tmp
        - emptyDir:
            medium: Memory
            sizeLimit: 1Mi
          name: event-watcher-kubeconfig
        - name: event-watcher-ksa-token
          projected:
            defaultMode: 256
            sources:
              - serviceAccountToken:
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  items:
                    - key: ca.crt
                      path: ca.crt
                  name: kube-root-ca.crt
              - downwardAPI:
                  items:
                    - fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
                      path: namespace
        - name: agent-credential-proxy-token
          projected:
            defaultMode: 256
            sources:
              - serviceAccountToken:
                  audience: kubeagents-credential-proxy-chat
                  expirationSeconds: 3600
                  path: token
        - name: watcher-credential-proxy-token
          projected:
            defaultMode: 256
            sources:
              - serviceAccountToken:
                  audience: kubeagents-credential-proxy-watcher
                  expirationSeconds: 3600
                  path: token
        - name: a2a-bus-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: a2a-bus
                  expirationSeconds: 3600
                  path: token
        - configMap:
            name: platformagent-a2a-nats-ca-bundle
            optional: true
          name: a2a-nats-ca
        - name: sandbox-ssh-secret
          secret:
            defaultMode: 292
            items:
              - key: SANDBOX_SSH_PRIVATE_KEY
                path: id_ed25519
            optional: true
            secretName: platform-agent-secrets
        - emptyDir: {}
          name: sandbox-ssh
status: {}
