            - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              name: event-watcher-ksa-token
              readOnly: true
            - mountPath: /opt/data
              name: platform-agent-data-vol
            - mountPath: /var/run/secrets/kubeagents/watcher-proxy
              name: watcher-credential-proxy-token
              readOnly: true
      securityContext:
        fsGroup: 10000
        runAsGroup: 10000
        runAsNonRoot: true
        runAsUser: 10000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: platformagent-gateway-agent
      volumes:
        - name: platform-agent-data-vol
          persistentVolumeClaim:
            claimName: platformagent-data
        - configMap:
            defaultMode: 493
            name: platformagent-config
          name: platform-agent-config-vol
        - configMap:
            defaultMode: 292
            items:
              - key: managed-config.yaml
                path: config.yaml
              - key: managed.env
