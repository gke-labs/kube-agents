            defaultMode: 292
            items:
              - key: SANDBOX_SSH_PRIVATE_KEY
                path: id_ed25519
            optional: true
            secretName: platform-agent-secrets
        - emptyDir:
            sizeLimit: 1Mi
          name: sandbox-ssh
