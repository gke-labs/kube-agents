apiVersion: v1
data:
  leader_elect.py: <OMITTED_FOR_TESTS>
  managed-config.yaml: |
    approvals:
      cron_mode: approve
    display:
      platforms:
        google_chat:
          busy_ack_detail: false
          interim_assistant_messages: false
          long_running_notifications: true
          memory_notifications: "off"
          tool_progress: "off"
    hooks:
      outbound:
      - events:
        - pre_tool_call
        - post_tool_call
        - post_api_request
        name: a2a-bridge-activity
        secret_env: A2A_ACTIVITY_SECRET
        timeout: 10
        url: http://127.0.0.1:8651/hermes/tool-events
    kanban:
      max_in_progress: 6
    model:
      api_key: none
      api_mode: chat_completions
      base_url: http://inference-gateway.kubeagents-system.svc.cluster.local/v1
      default: model-default
      model: model-default
      provider: custom
    platforms:
      google_chat:
        enabled: false
      slack:
        enabled: false
        extra:
          rich_blocks: true
      teams:
        enabled: false
        extra:
          adaptive_cards: true
    terminal:
      backend: ssh
      lifetime_seconds: 2592000
      ssh_host: platformagent-shell-0.platformagent-shell.kubeagents-system.svc.cluster.local
      ssh_key: /etc/sandbox-ssh/id_ed25519
      ssh_port: 2222
      ssh_user: agent
      workspace_root: /opt/data
  managed.env: |
    API_SERVER_KEY=cluster-internal-trusted
    HERMES_HOME_MODE=2770
    KUBEAGENTS_MODE=next
    KUBEAGENTS_SCOPE_FILE=/etc/kube-agents/scope.json
    RECONCILE_PROJECT=
    GKE_PROJECT_ID=example-project
    STALL_WATCH_EXCLUDE_NAMESPACES=
    STALL_WATCH_MIN_AGE_MINUTES=
    STALL_WATCH_KINDS=
    PUBSUB_RELAY_URL=
    PUBSUB_RELAY_PROJECT=example-project
  profile-platform.overlay.yaml: |
    memory:
      provider: ""
  scope.json: |
    {
      "present": false,
      "projects": [],
      "folders": [],
      "organizations": [],
      "sharedVpcHosts": [],
      "metricsScopes": [],
      "maxProjects": 100,
      "exclude": {
        "projects": [],
        "clusters": []
      }
    }
