              value: broker
            - name: CREDENTIAL_PROXY_ENVOY_ADDRESS
              value: 0.0.0.0
            - name: CREDENTIAL_PROXY_AUTH_MODE
              value: serviceaccount
            - name: CREDENTIAL_PROXY_AUDIENCE
              value: kubeagents-credential-proxy
            - name: CREDENTIAL_PROXY_CHAT_AUDIENCE
              value: kubeagents-credential-proxy-chat
