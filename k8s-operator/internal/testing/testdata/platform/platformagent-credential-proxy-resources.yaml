apiVersion: kubeagents.x-k8s.io/v1alpha1
kind: PlatformAgent
metadata:
  name: platformagent
  namespace: kubeagents-system
spec:
  # Golden fixture: platformagent-tagged.yaml plus a credential-proxy
  # ephemeral-storage limit above the 8Gi default, and nothing else. The
  # operator grows the proxy's state emptyDir by the headroom above the
  # default (10Gi - 8Gi = 2Gi on top of the 5Gi default, so 7Gi) and keeps the
  # /tmp emptyDir at 2Gi; tests/test_manifest_resource_parity.py reads this
  # golden to check that the grown volumes still fit under the raised limit.
  # 10Gi is the largest override that gate admits: the proxy declares no
  # ephemeral-storage request, so the pod requests the limit, and Autopilot
  # admits at most 10Gi of ephemeral-storage per pod. Diff this against
  # platformagent-tagged.yaml's expected output and the whole of what the
  # override renders is the proxy container's limits.ephemeral-storage and the
  # state volume's sizeLimit.
  harness:
    clusterName: "cluster-a"
    location: "us-central1-a"
    projectId: "example-project"
    hermes:
      dashboardEnabled: true
      pluginsDebug: false
      apiServerSecretRef:
        name: "platformagent-secrets"
        key: "api-key"
  deployment:
    image: "ghcr.io/gke-labs/kube-agents/platform-agent:v9.9.9"
    tag: "latest"
    imagePullPolicy: "IfNotPresent"
    credentialProxy:
      resources:
        limits:
          ephemeral-storage: "10Gi"
  security:
    serviceAccountName: "kubeagents-platform-agent"
    serviceAccountAnnotations:
      iam.gke.io/gcp-service-account: "kubeagents-platform-gsa@kube-agents-gkedemos.iam.gserviceaccount.com"
  integration:
    googleChat:
      enabled: true
      mode: "default"
      projectId: "kube-agents-gkedemos"
      topicName: "kubeagents-google-chat-events"
      subscriptionName: "kubeagents-google-chat-events-sub"
