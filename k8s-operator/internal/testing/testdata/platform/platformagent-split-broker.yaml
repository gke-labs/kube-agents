apiVersion: kubeagents.x-k8s.io/v1alpha1
kind: PlatformAgent
metadata:
  name: platformagent
  namespace: kubeagents-system
spec:
  # Golden fixture for spec.security.splitCredentialBrokerPod: the credential
  # broker in a Deployment and Service of its own. Everything else is the same
  # shape as the tagged fixture, so a diff between the two expected outputs is
  # exactly what the gate changes.
  #
  # The gate is off by default because the broker still runs commands in a
  # directory the agent owns, which couples the two Pods to one filesystem.
  # That is being removed rather than worked around; see the field's
  # documentation in common_types.go.
  #
  # eventWatcher.enabled: false is the second half of the only split
  # configuration the operator will render. The watcher is hosted in the
  # credential container and delivers over the agent Pod's loopback, so the
  # split strands it and validateCredentialBrokerSplit refuses the combination.
  # It is also the one intentional difference from the tagged fixture beyond
  # the split itself, so a diff between the two expected outputs carries
  # EVENT_WATCHER_ENABLED as well.
  harness:
    clusterName: "cluster-a"
    location: "us-central1-a"
    projectId: "example-project"
    eventWatcher:
      enabled: false
    hermes:
      dashboardEnabled: true
      pluginsDebug: false
      apiServerSecretRef:
        name: "platformagent-secrets"
        key: "api-key"
  deployment:
    image: "ghcr.io/gke-labs/kube-agents/platform-agent:v9.9.9"
    tag: "latest"
    imagePullPolicy: "IfNotPresent"
  security:
    serviceAccountName: "kubeagents-platform-agent"
    serviceAccountAnnotations:
      iam.gke.io/gcp-service-account: "kubeagents-platform-gsa@kube-agents-gkedemos.iam.gserviceaccount.com"
    splitCredentialBrokerPod: true
  integration:
    googleChat:
      enabled: true
      mode: "default"
      projectId: "kube-agents-gkedemos"
      topicName: "kubeagents-google-chat-events"
      subscriptionName: "kubeagents-google-chat-events-sub"
    slack:
      enabled: false
      botToken: ""
      appToken: ""
      allowedUsers: []
      homeChannel: ""
      homeChannelName: ""
