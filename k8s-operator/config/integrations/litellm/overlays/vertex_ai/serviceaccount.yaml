# Cluster half of the Workload Identity pair created by provision_04_gcp_iam.sh.
# The annotation must match that GSA exactly or token exchange fails with a 403
# that names neither side.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${LITELLM_KSA_NAME}
  annotations:
    iam.gke.io/gcp-service-account: ${LITELLM_GSA_NAME}@${PROJECT_ID}.iam.gserviceaccount.com
