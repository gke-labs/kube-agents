resources:
  - ../../base

configMapGenerator:
  - name: litellm-config
    behavior: replace
    files:
      - config.yaml

patches:
  - target:
      kind: NetworkPolicy
      name: litellm-policy
    patch: |-
      - op: add
        path: /spec/egress/-
        value:
          ports:
            - port: 8000
              protocol: TCP
          to:
            - podSelector:
                matchLabels:
                  app: vllm-gemma

labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: litellm
      app.kubernetes.io/instance: litellm
      app.kubernetes.io/part-of: kube-agents
      app.kubernetes.io/managed-by: kustomize
