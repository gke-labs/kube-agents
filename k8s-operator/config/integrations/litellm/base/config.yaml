model_list:
  - model_name: model-default
    litellm_params:
      model: ${MODEL_PROVIDER}/${MODEL_DEFAULT_NAME}
  - model_name: hermes-agent
    litellm_params:
      model: ${MODEL_PROVIDER}/${MODEL_DEFAULT_NAME}
  - model_name: ${MODEL_DEFAULT_NAME}
    litellm_params:
      model: ${MODEL_PROVIDER}/${MODEL_DEFAULT_NAME}
litellm_settings:
  callbacks:
    - otel
    - prometheus
    - litellm_thinking_replay_callback.proxy_handler_instance
  # /metrics stays open to the scrape, which sends no key; see the chart's
  # kube-agents.litellmConfig.
  require_auth_for_metrics_endpoint: false
# Caller authentication: the hook beside this file (a copy of the chart's
# files/litellm_caller_auth.py) admits each caller by its key. The master key
# comes from the environment (deployment.yaml), so this file carries none.
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  custom_auth: litellm_caller_auth.caller_auth
# No prompt-caching breakpoints here: on Gemini, LiteLLM turns them into Vertex
# explicit context caching (a cachedContents list before every call, and a
# create whenever the cached prefix is new), and a create Vertex holds past its request credential's life
# fails the turn. Gemini's implicit caching needs no markers. The breakpoints
# are in overlays/anthropic, for the Anthropic-family provider only.
