model_list:
  - model_name: model-default
    litellm_params:
      model: ${MODEL_PROVIDER}/${MODEL_DEFAULT_NAME}
  - model_name: hermes-agent
    litellm_params:
      model: ${MODEL_PROVIDER}/${MODEL_DEFAULT_NAME}
  - model_name: ${MODEL_DEFAULT_NAME}
    litellm_params:
      model: ${MODEL_PROVIDER}/${MODEL_DEFAULT_NAME}
litellm_settings:
  callbacks:
    - otel
    - prometheus
    - litellm_thinking_replay_callback.proxy_handler_instance
# No prompt-caching breakpoints here: on Gemini, LiteLLM turns them into Vertex
# explicit context caching (a cachedContents list and create before every
# generate call), and a create Vertex holds past its request credential's life
# fails the turn. Gemini's implicit caching needs no markers. The breakpoints
# are in overlays/anthropic, for the Anthropic-family provider only.
