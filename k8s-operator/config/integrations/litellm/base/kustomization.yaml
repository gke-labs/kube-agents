resources:
  - deployment.yaml
  - service.yaml
  - podmonitoring.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: litellm-config
    files:
      - config.yaml

# See config/default/kustomization.yaml for why includeSelectors stays false.
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: litellm
      app.kubernetes.io/instance: litellm
      app.kubernetes.io/part-of: kube-agents
      app.kubernetes.io/managed-by: kustomize
