resources:
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - podmonitoring.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: litellm-config
    files:
      - config.yaml
      # A copy of charts/kube-agents/files/litellm_thinking_replay_callback.py
      # (kustomize loads nothing outside this directory); its header says why.
      - litellm_thinking_replay_callback.py

# See config/default/kustomization.yaml for why includeSelectors stays false.
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: litellm
      app.kubernetes.io/instance: litellm
      app.kubernetes.io/part-of: kube-agents
      app.kubernetes.io/managed-by: kustomize
