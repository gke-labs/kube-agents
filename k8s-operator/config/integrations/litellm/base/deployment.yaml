apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Kept in step with charts/kube-agents/templates/litellm.yaml, which owns
      # the rationale: maxUnavailable is 1 rather than 0 so a namespace
      # ResourceQuota with no room for a surge Pod cannot stall the rollout
      # (#749).
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
      annotations:
        # The ConfigMap's generated name hashes the *un-substituted* template, so
        # it is identical for every provider and a model switch leaves the running
        # pods serving the old one. Stamping the resolved provider/model here makes
        # the pod template itself change, which is what triggers the rollout.
        kubeagents.x-k8s.io/model-config: ${MODEL_PROVIDER}/${MODEL_DEFAULT_NAME}
    spec:
      containers:
        - name: litellm-container
          # Substituted by the deploy-litellm target; the pin lives in
          # images.json so a mirrored install and `make mirror-images` cannot
          # disagree about which LiteLLM version to copy.
          image: ${LITELLM_IMAGE}
          args: ["--config", "/app/config.yaml", "--port", "8080"]
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "2Gi"
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-agent-secrets
                  key: GEMINI_API_KEY
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-agent-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-agent-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: LITELLM_OTEL_V2
              value: "true"
            - name: LITELLM_OTEL_INTEGRATION_ENABLE_METRICS
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://opentelemetry-collector.gke-managed-otel.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_SERVICE_NAME
              value: litellm
          ports:
            - containerPort: 8080
          # Mirrors charts/kube-agents/templates/litellm.yaml, which carries the
          # rationale: with no probes the Service advertises an endpoint ~50s
          # before uvicorn binds :8080, and the agent's first task after a cold
          # boot dies on `[Errno 111] Connection refused`.
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config-volume
              mountPath: /app/config.yaml
              subPath: config.yaml
      volumes:
        - name: config-volume
          configMap:
            name: litellm-config
