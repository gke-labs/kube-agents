resources:
  - pvc.yaml
  - deployment.yaml
  - service-gateway.yaml
  - service.yaml

configMapGenerator:
  - name: inference-replay-config
    literals:
      - mode=off
    options:
      disableNameSuffixHash: true

# See config/default/kustomization.yaml for why includeSelectors stays false.
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: inference-replay
      app.kubernetes.io/instance: inference-replay
      app.kubernetes.io/part-of: kube-agents
      app.kubernetes.io/managed-by: kustomize
