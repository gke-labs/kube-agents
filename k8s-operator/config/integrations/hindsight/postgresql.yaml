apiVersion: v1
kind: Service
metadata:
  name: hindsight-postgresql
  labels:
    app.kubernetes.io/name: hindsight
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hindsight
    app.kubernetes.io/component: postgresql
  ports:
    - name: postgresql
      protocol: TCP
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hindsight-postgresql
  labels:
    app.kubernetes.io/name: hindsight
    app.kubernetes.io/component: postgresql
spec:
  serviceName: hindsight-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hindsight
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hindsight
        app.kubernetes.io/component: postgresql
    spec:
      containers:
        - name: postgresql
          # pgvector supplies the vector extension Hindsight's embeddings need.
          # Pinned by digest: upstream rebuilds a version tag in place when the
          # Postgres base is patched, so without this a pod reschedule can move the
          # database to a Postgres minor nobody chose. The pin lives in images.json
          # and the deploy target resolves it here, which is what lets a mirrored
          # install redirect it — and images.json is also where the constraints on
          # the tag are written, so read them there before changing it.
          image: ${HINDSIGHT_POSTGRES_IMAGE}
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: hindsight
            - name: POSTGRES_DB
              value: hindsight
            # A subdirectory, not the mount root: the RWO volume arrives with a
            # lost+found entry and initdb refuses a non-empty data directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            # No password. This database is reachable only from the Hindsight
            # API pod (see networkpolicy.yaml) and holds nothing that is not
            # already in the agent's context, so a credential here would buy
            # nothing and cost an install step: a password has to be generated
            # somewhere, agree between two keys, and be rotated by someone.
            #
            # Note this is read by initdb and written into pg_hba.conf *once*.
            # Flipping it on an existing volume does nothing — the data
            # directory keeps whatever auth method it was created with.
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
          # Readiness only, deliberately: the Service above publishes this pod's
          # address the moment the container starts, and initdb takes several
          # seconds on a fresh volume, so the Hindsight API otherwise races the
          # database on first install. A *liveness* probe on Postgres is the
          # opposite of helpful — a busy database that misses a check gets
          # restarted mid-transaction.
          #
          # -h 127.0.0.1 is what makes this probe close that race rather than
          # look like it does. The postgres entrypoint runs a *temporary* server
          # while it applies extensions and init scripts, and that server sets
          # listen_addresses='' — it answers on the Unix socket only. A bare
          # pg_isready connects over that socket and so reports ready during
          # initialisation, minutes before the real server accepts a TCP
          # connection; measured on this image, the socket says ready for the
          # entire time the init scripts run while 127.0.0.1 is still refused.
          # The API connects over TCP, so TCP is what has to be probed.
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - 127.0.0.1
                - -U
                - hindsight
                - -d
                - hindsight
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        volumeMode: Filesystem
        resources:
          requests:
            storage: 8Gi
