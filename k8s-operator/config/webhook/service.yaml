apiVersion: v1
kind: Service
metadata:
  name: webhook-service
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: kube-agents-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  ports:
    # port 443 is what the *WebhookConfiguration clientConfig resolves to; targetPort is
    # what actually travels the VPC, and so is the port GKE's control-plane-to-node
    # firewall rule has to permit. See DefaultPort in
    # internal/webhook/platformagent_webhook.go.
    - port: 443
      protocol: TCP
      targetPort: 10250
  selector:
    control-plane: controller-manager
