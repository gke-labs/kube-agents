# Adds namespace to all resources.
namespace: kubeagents-system

# Value of this field is prepended to the
# names of all resources, e.g. a deployment named
# "wordpress" becomes "alices-wordpress".
# Note that it should also match with the prefix (text before '-') of the namespace
# field above.
namePrefix: kubeagents-

resources:
  - ../crd
  - ../rbac
  - ../manager
  - ../webhook
  - ../certmanager

# The Kubernetes recommended labels, so everything this project installs is
# selectable with -l app.kubernetes.io/part-of=kube-agents. See
# https://kubernetes.io/docs/concepts/overview/working-with-objects/common-labels/
#
# includeSelectors must stay false: the controller-manager Deployment selector
# is immutable, so adding to it would break every existing install.
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: kube-agents-operator
      app.kubernetes.io/instance: kube-agents-operator
      app.kubernetes.io/part-of: kube-agents
      app.kubernetes.io/managed-by: kustomize

patches:
  - path: webhookcainjection_patch.yaml

replacements:
  - source:
      kind: Certificate
      group: cert-manager.io
      version: v1
      fieldPath: metadata.name
    targets:
      - select:
          kind: MutatingWebhookConfiguration
        fieldPaths:
          - metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: "/"
          index: 1
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: "/"
          index: 1
  - source:
      kind: Certificate
      group: cert-manager.io
      version: v1
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: MutatingWebhookConfiguration
        fieldPaths:
          - metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: "/"
          index: 0
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: "/"
          index: 0
  - source:
      kind: Service
      version: v1
      name: webhook-service
      fieldPath: metadata.name
    targets:
      - select:
          kind: Certificate
          group: cert-manager.io
          version: v1
        fieldPaths:
          - spec.dnsNames.0
        options:
          delimiter: "."
          index: 0
      - select:
          kind: Certificate
          group: cert-manager.io
          version: v1
        fieldPaths:
          - spec.dnsNames.1
        options:
          delimiter: "."
          index: 0
  - source:
      kind: Service
      version: v1
      name: webhook-service
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: Certificate
          group: cert-manager.io
          version: v1
        fieldPaths:
          - spec.dnsNames.0
        options:
          delimiter: "."
          index: 1
      - select:
          kind: Certificate
          group: cert-manager.io
          version: v1
        fieldPaths:
          - spec.dnsNames.1
        options:
          delimiter: "."
          index: 1
