apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: kube-agents-operator
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: kube-agents-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: kube-agents-operator
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: kube-agents-operator
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - command:
            - /manager
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=0
          image: controller:latest
          name: manager
          env:
            - name: ENABLE_WEBHOOKS
              value: "true"
            # Private-registry installs: uncomment (or patch via kustomize) to
            # point the images the operator deploys at your own registry.
            # PLATFORM_AGENT_IMAGE is the default agent image when a
            # PlatformAgent CR omits spec.deployment.image; the credential-proxy
            # image is derived from the agent image unless
            # CREDENTIAL_PROXY_IMAGE is set explicitly. AGENT_SANDBOX_IMAGE is
            # the shell sandbox StatefulSet's image, which is not derived —
            # it is a separate repository — and is overridden per agent by
            # spec.harness.experimental.shellSandbox.image.
            # - name: PLATFORM_AGENT_IMAGE
            #   value: "registry.example.com/kube-agents/platform-agent:latest"
            # - name: CREDENTIAL_PROXY_IMAGE
            #   value: "registry.example.com/kube-agents/credential-proxy:latest"
            # - name: AGENT_SANDBOX_IMAGE
            #   value: "registry.example.com/kube-agents/agent-sandbox:latest"
            # - name: FLUENT_BIT_IMAGE
            #   value: "registry.example.com/mirror/fluent-bit:5.1.1"
            # IMAGE_PULL_SECRETS is the pull identity for those images, as
            # comma-separated names of Secrets that must already exist in each
            # agent's namespace. Needed only for a registry the nodes cannot
            # read on their own; a PlatformAgent's
            # spec.deployment.imagePullSecrets replaces it rather than adding
            # to it.
            # - name: IMAGE_PULL_SECRETS
            #   value: "regcred"
          ports:
            - containerPort: 8081
              name: health
              protocol: TCP
            # 10250, not controller-runtime's default 9443: it is the only non-443 port
            # GKE's automatic control-plane-to-node firewall rule permits, so a private
            # cluster reaches the webhook without a per-cluster VPC rule. See DefaultPort
            # in internal/webhook/platformagent_webhook.go. Keep in sync with the Service
            # targetPort in config/webhook/service.yaml.
            - containerPort: 10250
              name: webhook-server
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: cert
              readOnly: true
      serviceAccountName: controller
      terminationGracePeriodSeconds: 10
      volumes:
        - name: cert
          secret:
            defaultMode: 420
            secretName: kubeagents-webhook-certs
