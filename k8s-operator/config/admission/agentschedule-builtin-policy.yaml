# Admission control on what makes an AgentSchedule built-in: one ValidatingAdmissionPolicy and its
# binding.
#
# This file is the source of truth. charts/kube-agents/templates/agentschedule-builtin-admission-policy.yaml
# holds a generated copy (`make chart-sync`, verified by `make chart-check`), and the chart is what
# the install engine applies. Edit it here. It is not in config/default's kustomization, like the
# other policies under config/admission.
#
# WHY. The schedule reconciler (agentschedule_controller.go, agentScheduleOrigin) reads a schedule
# as built-in when the install's PlatformAgent is its controller and its
# `kubeagents.x-k8s.io/origin` label reads `builtin`. A built-in schedule runs at the unattended tier
# and may write a built-in audit's report stream, so its baseline decides which findings count as
# new. Whoever creates an AgentSchedule sets both its labels and its owner references, so RBAC alone
# can't keep a principal that may write schedules from making one built-in. Design section 6's
# broker policy keeps the broker to `origin: user`; this one keeps every principal but the
# operator, which renders the built-in schedules, from making or unmaking a built-in.
#
# WHAT IT CHECKS, for a CREATE or UPDATE of an AgentSchedule by anyone but the operator's
# ServiceAccount (or the garbage collector, below):
#
#   1. The origin label doesn't become, or stop being, `builtin`: a create may not carry it, and an
#      update may not add it, change it to it, or change or remove it where it was.
#   2. The controller reference doesn't change, whatever kind it names: a create may not carry
#      one, and an update may not add, change or remove one. Every kind, not only PlatformAgent,
#      because the reconciler's controller check matches on the owner's uid alone.
#   3. A built-in schedule's spec doesn't change, except spec.suspend: what it runs, on which
#      profile, when and where its report goes are the operator's. Suspending it stays open. The
#      supported way to pause a built-in is PlatformAgent.spec.schedules.overrides, which the
#      operator writes into spec.suspend; with no override for it, a suspend set here stands.
#
# Anything else passes, so a person may still annotate a built-in schedule (`run-now`) or
# edit a user schedule. A built-in schedule written before this policy existed isn't refused for
# that alone: its label, reference and spec pass unchanged. The reconciler is what keeps one the operator
# didn't write from running as built-in.
#
# The operator's identities are listed below (both install paths; the chart's copy names
# `<release>-operator-sa` in the release namespace, hack/sync-chart-manifests.sh, the same
# substitution agent-rbac-policy.yaml takes). DELETE is not matched: deleting a schedule makes
# nothing built-in, and the garbage collector deletes a PlatformAgent's schedules.
#
# agentschedule_builtin_policy_envtest_test.go runs this file in a real API server.
#
# Requires Kubernetes >= 1.30, where ValidatingAdmissionPolicy reached v1.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kube-agents-agentschedule-builtin
  labels:
    app.kubernetes.io/name: kube-agents
    app.kubernetes.io/part-of: kube-agents
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["kubeagents.x-k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["agentschedules"]
  matchConditions:
    # Two operator usernames, as agent-rbac-policy.yaml lists: the kustomize path (INSTALL.md
    # Method 2, config/default's `namePrefix: kubeagents-` on SA `controller`) runs it as
    # `kubeagents-controller`; the chart runs it as `<release>-operator-sa` in the release
    # namespace, and hack/sync-chart-manifests.sh rewrites the second entry to that. The garbage
    # collector is exempt too: orphaning a PlatformAgent's schedules (`kubectl delete --cascade=orphan`)
    # has it remove their controller reference, and refusing that would leave the PlatformAgent
    # stuck terminating. It only ever removes references.
    - name: is-not-the-operator-or-the-garbage-collector
      expression: >-
        !(request.userInfo.username in [
          'system:serviceaccount:kubeagents-system:kubeagents-controller',
          'system:serviceaccount:kubeagents-system:kube-agents-operator-sa',
          'system:serviceaccount:kube-system:generic-garbage-collector'])
  variables:
    - name: originKey
      expression: "'kubeagents.x-k8s.io/origin'"
    - name: newOrigin
      expression: >-
        has(object.metadata.labels) && variables.originKey in object.metadata.labels ?
        object.metadata.labels[variables.originKey] : ''
    - name: oldOrigin
      expression: >-
        request.operation == 'UPDATE' && has(oldObject.metadata.labels) &&
        variables.originKey in oldObject.metadata.labels ?
        oldObject.metadata.labels[variables.originKey] : ''
    # Every controller reference, whatever its kind: the reconciler's controller
    # check (metav1.IsControlledBy) matches on the uid alone, so a reference
    # that names another kind but carries the PlatformAgent's uid counts too.
    - name: newControllers
      expression: >-
        has(object.metadata.ownerReferences) ?
        object.metadata.ownerReferences.filter(r, has(r.controller) && r.controller)
          .map(r, r.apiVersion + '/' + r.kind + '/' + r.name + '/' + r.uid) : []
    - name: oldControllers
      expression: >-
        request.operation == 'UPDATE' && has(oldObject.metadata.ownerReferences) ?
        oldObject.metadata.ownerReferences.filter(r, has(r.controller) && r.controller)
          .map(r, r.apiVersion + '/' + r.kind + '/' + r.name + '/' + r.uid) : []
  validations:
    - expression: >-
        variables.newOrigin == variables.oldOrigin ||
        (variables.newOrigin != 'builtin' && variables.oldOrigin != 'builtin')
      message: "only the operator may set, change or remove an AgentSchedule's kubeagents.x-k8s.io/origin: builtin label"
      reason: Forbidden
    - expression: "variables.newControllers == variables.oldControllers"
      message: "only the operator may add, change or remove an AgentSchedule's controller reference"
      reason: Forbidden
    # A built-in schedule's spec is the operator's too: what it runs, on which profile, when and
    # where its report goes all run at the unattended tier and write the audit's report stream.
    # Annotations (run-now) and the rest of the metadata still pass.
    # spec.suspend is the exception: PlatformAgent.spec.schedules.overrides is the supported way
    # to set it, and with no override a suspend set directly stands.
    - expression: >-
        variables.oldOrigin != 'builtin' ||
        (object.spec.all(k, k == 'suspend' || (k in oldObject.spec && object.spec[k] == oldObject.spec[k])) &&
         oldObject.spec.all(k, k == 'suspend' || k in object.spec))
      message: "only the operator may change a built-in AgentSchedule's spec (spec.suspend excepted)"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kube-agents-agentschedule-builtin
  labels:
    app.kubernetes.io/name: kube-agents
    app.kubernetes.io/part-of: kube-agents
spec:
  policyName: kube-agents-agentschedule-builtin
  validationActions: ["Deny"]
