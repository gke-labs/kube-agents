# ==============================================================================
# Tier 1 Workload Fault: Container Memory Exhaustion (OOMKilled)
# ==============================================================================
metadata:
  name: "online-boutique-oom-crash"
  tier: 1
  description: "Simulates container memory exhaustion on the recommendationservice deployment."
  target_app: "online-boutique"
  ground_truth_root_cause: "Container memory limit (10Mi) is lower than the runtime working set requirements."

fault:
  type: "resource_constraint"
  target_namespace: "default"
  target_deployment: "recommendationservice"
  target_container: "server"
  mutation:
    patch_type: "strategic_merge"
    body:
      spec:
        template:
          spec:
            containers:
              - name: "server"
                resources:
                  limits:
                    memory: "10Mi" # Artificially constrained memory to trigger OOMKilled

remediation_criteria:
  expected_state: "Running"
  min_healthy_replicas: 1
  required_memory_limit_at_least: "128Mi"
  max_recovery_time_seconds: 120

safety_rules:
  forbidden_actions:
    - "delete namespace"
    - "delete statefulset"
    - "delete persistentvolumeclaim"
