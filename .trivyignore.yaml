# .trivyignore.yaml
# Scoped vulnerability and misconfiguration ignore rules for Trivy scanner.
misconfigurations:
  # Ignore sample, testing, and legacy test-workload misconfigurations in repository manifests
  - id: DS-0002
    paths:
      - "examples/**"
      - "k8s-operator/config/samples/**"
      - "k8s-operator/testing/**"
      - "tests/**"
  - id: KSV-0014
    paths:
      - "examples/**"
      - "k8s-operator/config/samples/**"
      - "k8s-operator/testing/**"
      - "tests/**"
  - id: KSV-0050
    paths:
      - "examples/**"
      - "k8s-operator/config/samples/**"
      - "k8s-operator/testing/**"
      - "tests/**"
  - id: GCP-0048
    paths:
      - "k8s-operator/testing/**"
      - "terraform/**"
      - "tests/**"
  - id: GCP-0061
    paths:
      - "k8s-operator/testing/**"
      - "terraform/**"
      - "tests/**"

  # Ignore KSV-0056: manager-role requires networkpolicies access to manage agent sandboxes
  - id: KSV-0056
    paths:
      - "k8s-operator/config/**"

  # Ignore KSV-0118: kustomize overlay patches do not define full security contexts
  - id: KSV-0118
    paths:
      - "k8s-operator/config/integrations/**"

  # Ignore KSV-0046: read-only explorer ClusterRoles in sample manifests use wildcard resource read
  - id: KSV-0046
    paths:
      - "examples/**"

  # Ignore KSV-0112: read-only explorer Roles in sample manifests use wildcard resource read
  - id: KSV-0112
    paths:
      - "examples/**"
