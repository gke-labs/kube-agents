# .trivyignore.yaml
# Scoped vulnerability and misconfiguration ignore rules for Trivy scanner.
misconfigurations:
  # Ignore sample, testing, plugin and persona data bundles, and legacy test-workload misconfigurations in repository manifests.
  # A persona image (a2a/Dockerfile.persona-*) is data under /files on busybox, like a plugin image: its only process is the
  # staging copy, which runs under the worker pod's non-root, restricted securityContext.
  - id: DS-0002
    paths:
      - "agentplugins/**"
      - "a2a/Dockerfile.persona-*"
      - "examples/**"
      - "k8s-operator/internal/testing/**"
      - "k8s-operator/testing/**"
      - "tests/**"
  - id: KSV-0014
    paths:
      - "examples/**"
      - "k8s-operator/config/integrations/**"
      - "k8s-operator/internal/testing/**"
      - "k8s-operator/testing/**"
      - "tests/**"
  - id: KSV-0050
    paths:
      - "examples/**"
      - "k8s-operator/config/integrations/**"
      - "k8s-operator/internal/testing/**"
      - "k8s-operator/testing/**"
      - "tests/**"
  # Ignore GCP-0048 and GCP-0061: quickstart companion module uses public control plane for direct developer kubectl access without bastion
  - id: GCP-0048
    paths:
      - "k8s-operator/internal/testing/**"
      - "k8s-operator/testing/**"
      - "terraform/examples/full-install/**"
      - "terraform/modules/gke-cluster/**"
      - "tests/**"
  - id: GCP-0061
    paths:
      - "k8s-operator/internal/testing/**"
      - "k8s-operator/testing/**"
      - "terraform/examples/full-install/**"
      - "terraform/modules/gke-cluster/**"
      - "tests/**"

  # Ignore DS-0002 on the sandbox image only. It has no USER line because sshd
  # is the entrypoint, and sshd has to start as root: privilege separation and
  # the setuid into the session account both need it, and neither is optional.
  # The account model is in the image rather than in a USER line -- every
  # session lands on `agent` (uid 1000) or uid 1001, never on root, and
  # sshd_config's PermitRootLogin no is what enforces that. A USER line here
  # would stop sshd from starting rather than harden anything.
  - id: DS-0002
    paths:
      - "deploy/sandbox/**"

  # Ignore KSV-0056: manager-role requires networkpolicies access to manage agent sandboxes
  - id: KSV-0056
    paths:
      - "k8s-operator/config/rbac/**"

  # Ignore KSV-0041: callers need Secret verbs on the manager role, and trivy
  # cannot scope an exemption to one rule -- `paths` globs are its whole
  # vocabulary -- so exempting either exempts the whole rbac directory. The
  # read verbs stay on the ClusterRole, and KSV-0041 flags a ClusterRole that
  # names secrets with any of them. The write verbs are the namespaced Role
  # document in role.yaml (the marker carries `namespace=`), bound in the
  # install namespace; a Role is KSV-0113 (MEDIUM), under the scan's threshold.
  #
  #   - `get`: checkShellSandboxKeys asks whether the sandbox's authorized-keys
  #     Secret exists, so the CR can report a missing one instead of leaving the
  #     pod in ContainerCreating with the cause on an object nobody is looking
  #     at. It reads no value out of a Secret.
  #   - `get`: stampSecretEnvHash digests the Secret material the agent pods read
  #     as environment onto their pod templates, so a rotated key rolls the pod
  #     instead of being ignored until something else restarts it. This one does
  #     read values; only their HMAC-SHA256 digest, keyed by the UIDs of the
  #     Secrets read, leaves the controller, and the digest goes on an object
  #     the operator already writes.
  #   - create/update/patch/delete, in the install namespace only: under
  #     `mode: next` the operator generates and repairs the A2A NATS credential
  #     and config Secrets, and ensureKubeProxyTLSSecret manages the
  #     `<agent>-kube-proxy-tls` Secret, owner-referenced to the PlatformAgent.
  #     Every write names a Secret in the namespace of the PlatformAgent being
  #     reconciled, which both install paths make the install namespace.
  #   - list/watch: held cluster-wide only so the operator can grant read-only
  #     `get`/`list`/`watch` on `secrets` in `buildMinimalPlatformRole`
  #     (`kubeagents:minimal:<ns>:<name>`) without Kubernetes RBAC escalation
  #     errors; the operator itself reads Secrets by name through a2aReader and
  #     never lists or watches Secrets.
  #
  # tests/test_operator_secrets_grant.py is what replaces the check: it pins the
  # verb set of each document and the two markers, forbids controller
  # SecretList/watch calls, and fails if this exemption widens past the rbac
  # and golden expected directories.
  - id: KSV-0041
    paths:
      - "k8s-operator/config/rbac/**"
      - "k8s-operator/internal/testing/testdata/platform/expected/**"

  # Ignore KSV-0118: sample manifests, testdata, and kustomize overlays do not define full security contexts
  - id: KSV-0118
    paths:
      - "examples/**"
      - "k8s-operator/config/integrations/**"
      - "k8s-operator/internal/testing/**"
      - "k8s-operator/testing/**"
      - "tests/**"

  # Ignore KSV-0046: read-only explorer ClusterRoles in sample manifests use wildcard resource read
  - id: KSV-0046
    paths:
      - "examples/**"

  # Ignore KSV-0112: read-only explorer Roles in sample manifests use wildcard resource read
  - id: KSV-0112
    paths:
      - "examples/**"
  # Ignore KSV-0014 and KSV-0118 on the GitOps fix-cycle pilot's task manifests
  # only (gke-labs/kube-agents#1307). They are devops-bench's b-0011 and b-0022b
  # workloads as the benchmark ships them, rendered byte for byte into the
  # per-run GitOps repository the agent is graded on, so a hardened copy would
  # change the task; they run in a throwaway task cluster the stack creates and
  # destroys per run, never in an install.
  - id: KSV-0014
    paths:
      - "bench/tf/prebuilt/gitops-fix-cycle/manifests/**"
  - id: KSV-0118
    paths:
      - "bench/tf/prebuilt/gitops-fix-cycle/manifests/**"
  # Ignore KSV-0014 and KSV-0118 on the A2A gateway's conformance fixture
  # only. It is a generated extract of the rendered gateway's ingress surface
  # (its three NetworkPolicies, the pod's labels and the container's declared
  # ports, nothing else) that tests/conformance reads, not a manifest anything applies; the
  # Deployment it was cut from carries the hardened pod and container security
  # contexts (buildA2AGatewayDeployment, hardenedSecurityContext), which the
  # extract leaves out on purpose.
  - id: KSV-0014
    paths:
      - "k8s-operator/internal/controller/testdata/a2a-gateway-ingress.yaml"
  - id: KSV-0118
    paths:
      - "k8s-operator/internal/controller/testdata/a2a-gateway-ingress.yaml"
  # Ignore GCP-0053 and GCP-0061 on the seeded fleet only: the public control
  # plane with a 0.0.0.0/0 authorized-networks block (seeded-a/-b) and the
  # absent block (seeded-c) are deliberately planted eval fixtures -- the
  # drift scenario's outlier and the declared 2.10 background findings in
  # bench/tf/fleet/README.md's accepted-background section. Do not "fix"
  # them; the scenarios assert on them.
  - id: GCP-0053
    paths:
      - "bench/tf/fleet/**"
  - id: GCP-0061
    paths:
      - "bench/tf/fleet/**"
