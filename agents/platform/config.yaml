# MCP Servers configuration.
#
# Every server here is `lazy: true` — tools register from the profile's schema
# cache at startup and the child process spawns on first use. The reasoning, and
# what it costs, is on `mcp_servers` in deploy/shared/defaults/config.yaml, which
# this file is merged onto at image build.
mcp_servers:
  # The per-server breakdown behind that, measured on this profile: each kanban
  # card is a fresh `hermes` process, and eager MCP boot made every one of them
  # spawn these children before its first model call — `import mcp` alone is
  # ~1.4s for platform_control, each node proxy ~0.7s bundle load plus ADC/TLS,
  # ~2-4s total per worker and worse under fan-out CPU contention, paid even by
  # workers that never call an MCP tool (measured on the 2026-08-07 sleep-task
  # runs: 18-27s spawn-to-first-turn with 3 concurrent workers). The schema
  # cache is write-through, refreshed on every real connect; a cold cache
  # (fresh install) falls back to an eager connect for that one run and warms
  # the cache for the rest.
  platform_control:
    command: "/opt/hermes/.venv/bin/python3"
    # ${HERMES_HOME}, not /opt/data: the shared scripts directory is
    # $HERMES_HOME/scripts (docker-entrypoint.sh copies /opt/defaults/scripts
    # there), and HERMES_HOME is PLATFORM_AGENT_HOME when the CR sets
    # spec.harness.hermes.agentHome. Hardcoding /opt/data made this argv point
    # at a file that does not exist under a custom home, so platform_control
    # died at startup and the Platform Agent lost every platform_* tool. Same
    # bug, same fix as the router entry in agents/chat/config.yaml.
    # tools/mcp_tool.py `_interpolate_env_vars` expands it, the same expansion
    # the `env` block below already relies on.
    args:
      - "${HERMES_HOME}/scripts/platform_mcp_server.py"
    # Still needed under lazy: it now bounds the first *tool call* rather than
    # startup, and platform_mcp_server.py is the slow one to come up.
    connect_timeout: 120
    lazy: true
    # 5-minute timeout to support long GKE reasoning chains
    timeout: 300
    env:
      KUBERNETES_SERVICE_HOST: "${KUBERNETES_SERVICE_HOST}"
      KUBERNETES_SERVICE_PORT: "${KUBERNETES_SERVICE_PORT}"
      HERMES_HOME: "${HERMES_HOME}"
      GOOGLE_CHAT_PROJECT_ID: "${GOOGLE_CHAT_PROJECT_ID}"
      GOOGLE_CHAT_SUBSCRIPTION_NAME: "${GOOGLE_CHAT_SUBSCRIPTION_NAME}"
      GOOGLE_CLOUD_PROJECT: "${GOOGLE_CLOUD_PROJECT}"
      GCP_PROJECT_ID: "${GCP_PROJECT_ID}"
      # Hermes hands a stdio MCP server only a safe baseline (PATH, HOME, …) plus the
      # keys named here (`_build_safe_env` in hermes `tools/mcp_tool.py`), so without
      # this line the `hermes send` behind send_notification has no home channel and
      # every alert-driven report dies with "No home channel set" — silently, since the
      # investigation still opens its PR. /sethome does not cover it: that writes the
      # default profile's .env, while a kanban worker runs against this profile's.
      # Requires spec.integration.googleChat.homeChannel, still hardcoded to "" in
      # platform-agent.yaml.template. Two alternatives would remove this entry: fan the
      # channel out to every profile's .env, or have the pubsub adapter open a chat
      # thread the worker replies into, which needs no home channel at all. The second is
      # harder than it looks — send_notification only builds a threaded target when it
      # can read chat_id and thread_id back from the session-KV server (hardcoded
      # http://127.0.0.1:8699/v1/sessions/<id>/metadata, served out of that server's
      # session_metadata table), so the adapter has to land both values there, either by
      # writing another component's private schema from a separately versioned plugin
      # image or by adding an endpoint to the agent image; and the board, not the
      # adapter, picks the worker's session id, so the id must travel in the card body
      # for the agent to quote back on every call.
      GOOGLE_CHAT_HOME_CHANNEL: "${GOOGLE_CHAT_HOME_CHANNEL}"
      # The Slack half of the same entry. send_notification builds a
      # `slack:<channel>` target from this and falls back to a bare `slack` when
      # it reads empty, which is the "No home channel set" failure above wearing
      # a different platform name. The operator does put the value on the
      # container (platformagent_manifests.go), so only the allowlist was
      # missing. test_mcp_env_contract.py is what catches this class of gap.
      SLACK_HOME_CHANNEL: "${SLACK_HOME_CHANNEL}"
      API_SERVER_KEY: "${API_SERVER_KEY}"
      # The bearer token for the loopback Session KV server on 8699. The
      # allowlist above is the whole environment this subprocess gets, so
      # without this line send_notification cannot read chat_id/thread_id back
      # (every alert-driven report loses its thread and falls back to the home
      # channel) and never POSTs the incident report at all — both silently,
      # since the 401 surfaces only as a stderr line. Not API_SERVER_KEY: that
      # value is the loopback sentinel `cluster-internal-trusted`.
      SESSION_KV_API_KEY: "${SESSION_KV_API_KEY}"
      # platform_mcp_server.py resolves the session-KV database from this, and
      # its code default happens to equal the value the operator sets on the
      # container, so leaving it undeclared has been harmless. Declared so the
      # two cannot drift apart in silence: the child receives only what this
      # block names, so if the operator's path ever moves, an undeclared
      # variable would leave the server reading a database nothing writes.
      SESSION_KV_DB_PATH: "${SESSION_KV_DB_PATH}"
  # A remote MCP endpoint, proxied over stdio by mcp-remote. The explicit
  # timeout is a backstop: unpatched, mcp-remote drops the request id when the
  # remote answers non-2xx, so the client parks for the whole 300s default.
  # deploy/docker/patches/apply_mcp_remote_forward_errors.py fixes that at build
  # time and carries the full analysis; this bounds the damage if it ever stops
  # applying. Healthy calls to this endpoint measure 0.47-0.48s.
  #
  # The whole entry is redundant with the shared defaults — the build-time merge
  # unions the two — but repeating it here keeps this file from reading as if
  # gke were the one server without these settings.
  gke:
    command: "node"
    args:
      - "/opt/mcp-remote/dist/proxy.js"
      - "https://container.googleapis.com/mcp"
    lazy: true
    connect_timeout: 30
    timeout: 60

# Explicitly list platform_toolsets
# platform_toolsets is a reserved framework key in Hermes.
#
# These lists are UNIONED with the shared defaults', not replaced —
# deploy/docker/merge_configs.py merges two lists as
# `list(dict.fromkeys(a + b))`. So an entry removed here but left in
# deploy/shared/defaults/config.yaml comes back at image build. Both copies of
# `mcp-agent_common` had to go; see the note above that file's `mcp_servers`.
#
# `memory` is a GATE for the memory provider, not a tool grant:
# inject_memory_provider_tools() bails unless it is listed, and that injection is
# the only path by which the provider's tools reach the model. It is on both keys
# because a kanban worker resolves its toolsets from `cli`
# (_resolve_worker_cli_toolsets in hermes_cli/kanban_db.py) while the API server
# path uses `api_server`; a specialist reached either way must see the same
# memory. Which tools that actually yields is decided by the provider — under
# `memory.read_only` below it is the two read tools and nothing else.
#
# The toolset also surfaces Hermes' own built-in `memory` tool (MEMORY.md /
# USER.md), whose check_fn is unconditional. It is inert here for the same reason
# it is on the Chat Agent: `memory_enabled: false` leaves agent._memory_store as
# None and tools/memory_tool.py short-circuits on a null store. That flag is what
# keeps this profile read-only in fact and not only in the provider — flipping it
# would hand a writable file store to an agent whose whole design here is that it
# cannot write.
platform_toolsets:
  cli:
    - hermes-cli
    - mcp-platform_control
    - mcp-developer_knowledge
    - mcp-gke
    - memory
  api_server:
    - hermes-api-server
    - mcp-platform_control
    - mcp-developer_knowledge
    - mcp-gke
    - memory

# Top-level `toolsets` gates the kanban orchestrator surface: the kanban tools
# live in the core pool (surfaced via hermes-cli/hermes-api-server), and their
# check_fn requires "kanban" here for a non-worker (orchestrator) profile. This
# lets the Platform Agent create/route kanban cards for delegation. (Workers get
# the kanban tools automatically via HERMES_KANBAN_TASK.) It does not restrict
# any other tools.
toolsets:
  - kanban

# Per-turn tool-calling iteration budget. Hermes defaults to 90, which the fleet
# audits outgrow: the cost audit runs ten checks against every cluster and the
# drift audit nineteen, plus enumeration, the SOP read, and the publish harness.
# Three separate runs died on `Iteration budget exhausted (90/90)` — reported as
# a `timed_out` kanban event, though the run was actively heartbeating and no
# clock ran out. 250 is roughly triple the observed near-miss.
#
# This belongs here rather than in the operator's generated root config because
# both ways an audit can start read *this* file and not the root one: a cron run
# on this profile's own roster (agents/platform/cron/jobs.json) is executed with
# the profile active, and a kanban worker is spawned with HERMES_HOME pinned to
# the profile. Scoping it here leaves the Chat Agent and the per-cluster Cluster
# Agents on the default 90, where nothing has ever approached the ceiling.
agent:
  max_turns: 250

# Per-turn web_search ceiling. Hermes defaults to 50, and the docstring on that
# default is right about interactive sessions: fifty searches in one turn is
# pathological. It is not right about a kanban worker. Those are spawned
# non-goal-mode, so `chat -q` gives the whole card exactly one turn, and the
# per-turn cap is really a per-card research budget.
#
# Card t_d3efabef ("Evaluate Config Connector Setup Patterns") hit that ceiling
# on all four of its runs — 208 searches, 173 of them successful, 38 minutes,
# nothing delivered. It was researching a topic honestly; fifty sources is a
# thin answer for it, not a runaway loop.
#
# 200 is a ceiling, not a target: a card that reaches it is misbehaving and
# should be stopped. Never set 0 (unlimited) — the cap is the backstop, and the
# reason those four runs produced nothing was the *exit path* taken when it
# fired, which is fixed in deploy/docker/patches/kanban_guardrail_exit.py.
# Raising this alone would only move when the failure happens.
#
# Scoped here for the same reason as max_turns above: both dispatch paths read
# the profile config.yaml, so this leaves the Chat Agent and the per-cluster
# Cluster Agents on the stock 50, where nothing has come close.
tool_loop_guardrails:
  loop_caps:
    max_web_searches: 200

# Shared memory, read-only.
#
# PERSONAL memory is still impossible here and always will be: it keys off the
# gateway identity (agent._user_id), which only the Chat Agent has. The kanban
# dispatcher spawns workers with no human attached, so every personal write from
# here landed in one anonymous bucket. The provider fails closed on that by
# itself — with no user identity it recalls `scope:shared` only.
#
# SHARED memory is readable, because withholding it did not stop this agent
# needing the corpus; it stopped it getting the corpus *from a curated source*.
# Measured across ten probes, a specialist with no sanctioned route improvised
# five, the worst of which was a 79,815-byte fork of the shared corpus written
# into its own skill file, reloaded into context on every invocation, curated by
# nobody and auditable by nobody. A stale private copy is a worse outcome than a
# read.
#
# `read_only: true` is what keeps this one-way. It removes `memory_retain` from
# the schemas the model sees, refuses the call if it is made anyway, and turns
# off automatic capture. A specialist that could write shared memory could
# launder its own derived-from-prior-runs conclusions into the corpus as facts;
# what it concludes is a finding for its result, not a recorded fact.
#
# `memory_enabled: false` is not a contradiction of the provider being on: it
# gates only the built-in file store, and the provider loads off `provider`
# alone. See the note on the toolset gate above.
#
# `provider` here is a default, not the decision. The operator overwrites it from
# spec.harness.memory.provider through this profile's overlay (memoryOverlay in
# k8s-operator/internal/controller/platformagent_manifests.go), because the choice
# belongs to the install and this file is baked into the image. It writes an empty
# value for any provider that cannot be made read-only and scoped by tag — a
# per-user file provider has no identity to key on here. The value below is what a
# run without the operator gets, and it is empty for that same reason: the default
# store is the per-user file one, which a specialist cannot use, so a specialist
# with nobody to ask reads its facts from the kanban card instead. An install that
# chooses `hindsight` is what fills this in.
#
# See docs/designs/memory.md and agents/chat/config.yaml (the front door, where
# writes do happen).
memory:
  memory_enabled: false
  provider: ""
  read_only: true
  user_profile_enabled: false

# The Platform Agent is no longer the chat ingress (the Chat Agent / `default`
# profile owns that), so the session_store / session_otel_bridge ingress plugins
# move to the Chat Agent. Keep otel for observability parity and tool_call_audit
# to audit this privileged specialist's tool calls.
plugins:
  enabled:
    - hermes_otel
    - tool_call_audit
    - incident_context
