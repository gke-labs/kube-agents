kind: no-pdb
# What kube-agents calls these fixes in text it writes.
name: disruption-budget fixes
# The dial's row for the kind, and the environment the row counts merges in.
title: Disruption budgets
dial_environment: dev
owner: platform
# The end-to-end case that grades the fix on the cluster after it merges; empty
# until that case exists.
eval_case: ""
