# Chat Agent profile config (self-contained; the `default` profile).
#
# This is the config.yaml for the front-door Chat Agent — the `default` Hermes
# profile that receives all chat ingress. It is written to
# /opt/chat-template/config.yaml at build time and is the BASE from which
# docker-entrypoint.sh rebuilds the default profile home's config.yaml
# ($HERMES_HOME/config.yaml) on every start.
#
# It is deliberately NOT merged with deploy/shared/defaults/config.yaml: the
# merge helper only unions keys, so it could never REMOVE the cloud/cluster tools
# from shared defaults. The whole point of the Chat Agent is a minimal, low-
# privilege front door, so its config must be self-contained.
#
# THE LIVE FILE HAS THREE AUTHORS, and this is only one of them:
#
#   1. this file, the base;
#   2. the operator's render (k8s-operator renderConfigYAML), delivered as the
#      ConfigMap key profile-default.overlay.yaml and merged on top;
#   3. the running agent, which writes to its own config — /sethome records the
#      home channel, the monitoring policy mints monitoring.install_id.
#
# deploy/shared/default_profile_config.py reconciles the three with a three-way
# merge: the operator wins any key it and the runtime both changed, the runtime
# keeps its own edits everywhere else. The file is NOT mounted from the ConfigMap;
# it was once, and that made it read-only, which is what made /sethome fail.
#
# Keep this file and renderConfigYAML in sync in BOTH directions. Lists are
# unioned, so an entry dropped from one side survives in the other — removing a
# toolset or plugin means removing it here AND there. The operator's
# TestRenderConfigYAMLListsMatchChatConfig fails when the two diverge.
#
# TOOL LOCKDOWN — the Chat Agent's job is to analyze a message, choose the best
# specialist, delegate, and proxy the chat session. It has NO runtime tools of its
# own (no gcloud/kubectl/terminal/files/skills/code-exec). Its delegation surface:
#   - `mcp-router` (list_agents): discovery only — lists the dynamic specialist
#     roster so the Chat Agent can pick the right kanban `assignee`. (The old
#     synchronous `ask_agent` relay was removed: it blocked up to 300s with no
#     visible progress. All delegation is now kanban-only.)
#   - `kanban`: async delegation for ALL substantive work — Hermes auto-subscribes
#     this chat thread and posts the specialist's progress back to it as each step
#     completes, with no blocking timeout.
#   - `kube_agents_memory`: per-user + shared memory. The Chat Agent is the ONLY
#     place a human identity exists (agent._user_id comes from the gateway), so
#     it is the only profile that can scope memory per user. See the `memory`
#     note below.
# Enforcement layers:
#   1. `platform_toolsets` lists ONLY `mcp-router` + `kanban` + `memory` (no
#      `hermes-cli`/`hermes-api-server` base bundles, which would grant
#      terminal/file/exec). `memory` here is a GATE, not a tool — see below.
#   2. `toolsets` (top-level) also lists `kanban` — a SECOND gate the kanban tools'
#      check_fn reads to expose the orchestrator surface (kanban_create/list/…).
#   3. `agent.disabled_toolsets` is a denylist applied LAST for EVERY platform key
#      (incl. `google_chat`, the real ingress key). It strips everything except the
#      delegation surface and the `memory` gate, even if a base bundle is ever
#      reintroduced. `memory` must stay OUT of it — see the note on that list.

model:
  provider: custom
  model: model-default
  default: model-default
  base_url: http://litellm.kubeagents-system.svc.cluster.local/v1
  api_key: none

# MCP Servers configuration. Routing/relay surface only.
#
# `args` must stay BYTE-IDENTICAL to renderConfigYAML's, which is why it is a
# ${HERMES_HOME} placeholder and not a path. Lists are unioned by the merge (see
# the header), and a command line is the one kind of list a union corrupts
# rather than extends: two differing entries become two argv words, and python3
# runs the first. Hardcoding /opt/data made them differ under a custom
# spec.harness.hermes.agentHome, where /opt/data/scripts/router_server.py does
# not exist — the entrypoint copies /opt/defaults into the custom home — so the
# router MCP died at startup and the Chat Agent had no roster to delegate
# against.
#
# The placeholder is also what makes THIS file correct on its own, which it has
# to be: the entrypoint seeds a fresh PVC straight from it, before the operator's
# overlay is merged. HERMES_HOME is exported by docker-entrypoint.sh line 5 and
# resolved in `args` by tools/mcp_tool.py `_interpolate_env_vars`, the same
# expansion the `env` block below already depends on.
mcp_servers:
  router:
    command: "/opt/hermes/.venv/bin/python3"
    args:
      - "${HERMES_HOME}/scripts/router_server.py"
    env:
      HERMES_HOME: "${HERMES_HOME}"

# Explicitly list platform_toolsets (reserved Hermes key). ONLY the router MCP —
# no base tool bundle. `mcp-<name>` here maps to `mcp_servers.<name>` above.
# NOTE: Hermes logs a benign one-time warning per platform ("no valid toolsets
# configured (unknown name(s): mcp-router) - tools will be unavailable", issue
# #38798). It is cosmetic: that check only validates *native* toolset names and
# ignores the MCP passthrough, which DOES load the router (verified). Router-only
# is the intended state.
#
# `memory` here is a GATE for the memory provider, not a tool grant. The check
# is provider-agnostic: it applies to whatever `memory.provider` names below.
# The two things that read it:
#   - hermes_cli.tools_config._get_platform_tools() resolves this list for the
#     session's platform key, then subtracts `agent.disabled_toolsets` LAST.
#     What survives becomes agent.enabled_toolsets.
#   - agent_init then calls inject_memory_provider_tools(), which bails unless
#     memory_provider_tools_enabled(agent.enabled_toolsets) sees "memory"
#     (agent/memory_manager.py). That injection is the ONLY path by which the
#     provider's tools reach the model.
# So `memory` must be listed HERE and must NOT be listed in disabled_toolsets.
# Listing it in both nets to off — the subtraction wins, the gate fails, and the
# provider loads but is never exposed. The denylist below has a matching note.
#
# The price of leaving the toolset on is that the built-in `memory` tool also
# appears alongside the provider's `memory_retain`/`memory_recall`/
# `memory_reflect` tools. It is inert:
# `memory_enabled: false` leaves agent._memory_store as None, and
# tools/memory_tool.py short-circuits on a null store with "Memory is not
# available", touching no disk.
platform_toolsets:
  cli:
    - mcp-router
    - kanban
    - memory
  api_server:
    - mcp-router
    - kanban
    - memory
  # Real Google Chat ingress resolves under the `google_chat` platform key; pin
  # it to the delegation surface too so it never falls back to a full base bundle.
  google_chat:
    - mcp-router
    - kanban
    - memory

# Second gate for the kanban orchestrator surface (kanban_create/list/…): the
# kanban tools' check_fn reads this top-level key, distinct from platform_toolsets.
toolsets:
  - kanban

# Kanban chat-transparency machinery (both default True upstream; pinned so a
# future default change can't silently disable delegated-progress in chat).
kanban:
  dispatch_in_gateway: true
  auto_subscribe_on_create: true
  # Dispatcher tick. Upstream defaults to 60s, which added a 0-60s (median ~38s)
  # dead wait to every delegation before the worker was claimed.
  dispatch_interval_seconds: 5
  # Which terminal events wake this agent for a follow-up turn. Upstream wakes
  # on all five and offers no way to say otherwise; the image patches that key
  # in (deploy/docker/patches/kanban_notifier.py).
  #
  # `completed` is deliberately absent. The notifier has already delivered the
  # worker's own status line and its full `result` to the thread by the time it
  # wakes anyone, so the woken turn just re-reads the card and paraphrases a
  # message the user is looking at — 5.9s and 32,460 input tokens on task
  # t_c31a1f00, for nothing. Worse than nothing, now: the answer the notifier
  # posts is verbatim, and a paraphrase of it can only lose detail.
  #
  # The failure kinds stay: they deliver a terse status line and no more, and
  # the front door genuinely has to decide what to do about them.
  #
  # This key governs push-capable adapters only. The notifier skips its own
  # send() for an adapter with no push channel (the API server) because that
  # send can only fail, and there the wake self-post IS the delivery — so the
  # patch ignores this list on that path and wakes on all five. Otherwise a
  # card completing over the API server would be announced to nobody.
  wake_on_events:
    - gave_up
    - crashed
    - timed_out
    - blocked
  # Board-wide worker cap. Upstream leaves this unbounded, and a worker is a full
  # agent process holding a few hundred MiB for the length of its task — so a burst
  # of cards spawns processes until the cgroup OOM killer takes them, which kills a
  # child rather than the container and so produces no restart and no event.
  #
  # On an operator-managed install this line is overwritten: the operator renders
  # the same value into its config ConfigMap and the entrypoint force-syncs that
  # over this file. It is here for the install that runs the image without the
  # operator, which would otherwise be the only one left uncapped. The operator's
  # defaultKanbanMaxInProgress is authoritative; keep the two the same.
  max_in_progress: 2

# Denylist applied last for every platform key — the authoritative guarantee that
# the front door cannot touch the system. Everything except the delegation
# surface (mcp-router + kanban) is off.
agent:
  # This file is not merged with deploy/shared/defaults/config.yaml (see the
  # header), so the probe has to be turned off again here. Rationale lives in
  # that file; in short, it spawns four interpreters to publish a
  # Python-toolchain line that is factually wrong on this image.
  environment_probe: false
  disabled_toolsets:
    - terminal # shell / gcloud / kubectl / command execution + process mgmt
    - file # read_file / write_file / patch / search_files
    - skills # skills_list / skill_view / skill_manage
    - code_execution # execute_code
    - delegation # delegate_task (the Chat Agent delegates via mcp-router, not this)
    - browser
    - computer_use
    - cronjob
    - web
    - search
    - x_search
    - vision
    - video
    - image_gen
    - video_gen
    - tts
    - todo
    # NOTE: `memory` is deliberately absent from this denylist. Adding it back
    # removes "memory" from agent.enabled_toolsets, which fails the gate in
    # inject_memory_provider_tools() and silently kills the memory provider —
    # it still loads and logs that it registered its tools, but they never
    # reach the model. See the platform_toolsets note above.
    - session_search
    - project
    - homeassistant
    - discord
    - discord_admin
    - spotify

# Google Chat ingress presentation. The platform itself is enabled/seeded from
# env at runtime; this block only overrides the adapter's default "thinking"
# marker card text ("Hermes is thinking…") with our product name. Kept in sync
# with the operator's renderConfigYAML, which is merged over this file on the
# deployed default profile and wins any key both set.
platforms:
  google_chat:
    typing_status_text: "Kage is thinking…"
  # Slack egress presentation. `enabled` is the operator's to set, from the CR's
  # spec.integration.slack.
  #
  # This block is one of the two copies the header warns about, and the one that
  # does NOT run on a deployed agent: the operator's rendered config.yaml is
  # subPath-mounted straight over $HERMES_HOME/config.yaml, so the file below is
  # what the adapter reads only where nothing mounts over it — a local `docker
  # run`, or a profile started off the image alone. Setting `rich_blocks` here
  # and nowhere else changes nothing in a cluster. Its twin is
  # renderConfigYAML in k8s-operator/internal/controller/platformagent_manifests.go
  # (search `Platforms.Slack.Extra`), pinned by TestBuildConfigMapSlackRichBlocks.
  # Change one, change both.
  slack:
    extra:
      # Render outbound messages as Block Kit rather than a flat mrkdwn string.
      #
      # SlackAdapter.format_message already rewrites the inline markdown an
      # agent emits — `**bold**` → `*bold*`, `[label](url)` → `<url|label>`,
      # `# Heading` → `*Heading*` — so prose has always arrived readable. What
      # it cannot rewrite is structure, because flat mrkdwn has none: a pipe
      # table goes out as literal `|---|` rows, `---` stays three hyphens, a
      # heading flattens into bold with no hierarchy, and a nested list loses
      # its indentation. Every fleet report this harness delivers is exactly
      # that shape — the kanban notifier hands a card's whole `result` to
      # adapter.send(), tables and all.
      #
      # With this on, block_kit.render_blocks turns those into real `header`
      # blocks, `divider`s, `rich_text_list`s that keep their nesting, and
      # native `table` blocks with per-column alignment.
      #
      # Safe by construction, in three ways. A `text` fallback always ships
      # alongside the blocks, so notifications, screen readers and old clients
      # are unaffected. The renderer returns None — and the adapter falls back
      # to the flat string — for anything it cannot express: over Slack's
      # 50-block cap, or a table past 100 rows / 20 columns / 10k cell chars
      # (that one degrades to aligned monospace first). And a message long
      # enough to be split across chunks skips blocks entirely. A six-section,
      # six-table report measures 26 blocks, so the reports that motivated this
      # are well inside the cap.
      #
      # Note for anyone editing a persona: this expects STANDARD markdown as
      # its input. Teaching an agent to emit Slack mrkdwn directly would defeat
      # both this renderer and format_message.
      rich_blocks: true

# Memory. The built-in MEMORY.md/USER.md store stays off; the
# `kube_agents_memory` provider (agents/chat/plugins/memory/kube_agents_memory/)
# replaces it and is the ONLY memory on this profile. It wraps one bundled
# Hindsight instance talking HTTP to a self-hosted Hindsight API, and keeps every
# user's memories in a single bank (`bank_id` in
# $HERMES_HOME/hindsight/config.json), separated by a scope tag: `user:<id>`
# taken from the gateway identity (agent._user_id, threaded in by agent_init) for
# private facts, `scope:shared` for organisation-wide ones. Recall asks for the
# current user's tag plus the shared tag and nothing else comes back.
#
# The wrapper exists because Hindsight cannot be configured to do this on its
# own: `{user}` substitution is applied to `bank_id` and to no other setting, so
# a configured `retain_tags: "user:{user_id}"` would tag every user with that
# literal string. See docs/designs/memory.md for what the wrapper
# pins and why each one is load-bearing.
#
# Personal memory runs in Hindsight's `hybrid` memory_mode: it recalls into the
# prompt each turn and retains at session end on its own, so neither the persona
# nor the operator has to instruct the model to use it. Shared memory is read the
# same way but never auto-retains — everyone can see it, so it takes deliberate
# writes only (`memory_retain` with scope "shared"). Recall depth for both is
# `recall_budget` in the same config.json (low|mid|high; unset leaves Hindsight's
# own default of mid).
#
# There is no bulk-load path into the shared corpus, by design: it fills from
# conversation one deliberate write at a time, the same way personal memory
# does. Nothing expires on its own,
# and nothing prunes it either: agents/chat/scripts/memory_ttl_curator.py exists
# for that but is shelved and on no schedule (see
# docs/designs/memory.md).
#
# The bank's mission and its retain strategies — what it holds, and what is worth
# extracting into it under each scope — are provisioned by the provider itself
# when a session starts. Hindsight's `bank_mission` config key is read into an
# attribute the plugin never uses, so a mission can only be set through the API;
# doing it at session start means there is no install step, and a deleted bank or
# a rebuilt Hindsight database comes back correctly on its own.
#
# This is the only profile that gets the provider in a WRITABLE form: specialists
# are spawned by the kanban dispatcher and carry no human identity, so their writes
# would all land in one anonymous bucket. The provider fails closed on exactly that
# case — with no user_id there is no personal scope, and auto-retain is switched off
# entirely. They do get the same provider under `read_only: true`, which is why
# agents/platform/config.yaml names it too.
#
# `provider` here is a default, not the decision. On an operator-deployed pod this
# whole file is replaced by the rendered ConfigMap, which carries the install's
# choice from spec.harness.memory.provider; the value below is what a run without
# the operator gets. It names the file store, matching the CRD default, so that a
# bare `hermes` run needs no service outside the pod. See
# docs/designs/memory.md#choosing-a-provider.
#
# It also fails closed in shared Google Chat threads. build_session_key()
# (gateway/session.py) omits the participant id inside a thread unless
# `thread_sessions_per_user` is on, so everyone posting in a thread would share
# one cached Agent and therefore one identity. The provider detects that and
# serves shared memory only, so personal memory is DM-only by design.
memory:
  memory_enabled: false
  user_profile_enabled: false
  provider: multiuser_memory

# Chat ingress plugins live with the front door (session_store persists the
# gateway session; the otel bridge and tool-call audit ride along).
# bootstrap_onboarding hooks pre_llm_call on the first human turn, and
# legacy_slash_commands hooks pre_gateway_dispatch on every inbound message.
# Both act on a human typing at the front door, so they go where those messages
# land — this profile.
#
# `incident_context` belongs here for the same reason, even though it is COPYed
# from agents/platform/plugins: the pod runs one gateway and it is homed at this
# profile, so a reply typed in a Slack or Google Chat incident thread arrives
# here. Enabling it on the platform profile alone leaves its pre_gateway_dispatch
# hook with nothing to hook. It resolves from /opt/hermes/plugins, the bundled
# directory Hermes scans for every profile, not from this profile's plugins/.
# Two pre_gateway_dispatch plugins on one profile also share a turn, and the
# first to rewrite decides what the second sees — the reason `incident_context`
# steps aside for a leading `/`, leaving the slash-command unwrap the raw text.
plugins:
  enabled:
    - hermes_otel
    - session_store
    - session_otel_bridge
    - tool_call_audit
    - incident_context
    - bootstrap_onboarding
    - legacy_slash_commands
    # Injects the routable-specialist roster into every turn, so choosing an
    # `assignee` costs no tool call. See defaults/plugins/agent_roster/README.md.
    # The operator writes the deployed copy of this list; keep the two in sync
    # (k8s-operator/internal/controller/platformagent_manifests.go).
    - agent_roster
