# The one server is on the credential broker's MCP relay, which applies its
# own tool policy (agents/platform/scripts/mcp_policy.py) and holds a profile
# worker to Developer Knowledge's two document reads (PROFILE_SERVER_TOOLS).
# The include list keeps the model's offer to the same two: answer_query's
# small daily quota is shared by every agent of an install. There is no gke
# server: its tools name a project and cluster in their arguments, and the
# relay has no per-task target check, so kubectl and gcloud, which the broker
# holds to the task's target, are this agent's way into the cluster.
servers:
  developer_knowledge:
    broker: developer_knowledge
    include:
      - search_documents
      - get_documents
