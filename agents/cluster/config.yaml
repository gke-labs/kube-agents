# Cluster Agent profile config (self-contained template).
#
# This file is the config.yaml for a per-cluster Cluster Agent Hermes profile.
# Unlike the Platform Agent's config, it is NOT merged with deploy/shared/defaults
# at build time — it is copied verbatim into a scaffolded profile home by
# scripts/cluster_agent_profile.py, so it must be self-contained.
#
# Scoping vs the Platform Agent:
#   - Only the read-only `gke` MCP + `developer_knowledge` are exposed.
#   - The `platform_control` (provisioning/Config-Connector) MCP server is
#     intentionally omitted — a Cluster Agent diagnoses, it does not provision.
#     Nor does it delegate, but nothing has to be withheld for that any more:
#     the `agent_common` A2A server is no longer declared for any profile.
#   - KUBECONFIG is pinned to the target cluster at scaffold time by
#     cluster_agent_profile.py, which writes `KUBECONFIG=<home>/kubeconfig.yaml`
#     into the profile's `.env`. A dispatcher-spawned worker (`hermes -p <name>`)
#     loads that `.env` on startup, so kubectl targets this cluster.

model:
  provider: custom
  model: model-default
  default: model-default
  base_url: http://inference-gateway.kubeagents-system.svc.cluster.local/v1
  api_key: none

# Model-call deadlines for the gateway above. Hermes reads them per provider
# (hermes_cli/timeouts.py). stale_timeout_seconds is the base of both stale
# detectors: a stream with no first chunk, or no chunk for that long, and a
# non-streamed call with no answer; then Hermes drops the stream and retries.
# It is 600s because Gemini thinks in silence on this path: with the request
# shape Hermes sends, no reasoning deltas stream, and a hard prompt measured
# 140-210s before its first chunk, so a shorter bound would cut off healthy
# long thinks, and every retry would repeat the same think.
# request_timeout_seconds is the per-read socket timeout (and the stream read
# timeout), not a cap on a whole call; the chart's LiteLLM sets no timeout of
# its own. A call that stalls is retried inside each of Hermes' 3 attempts
# (agent.api_max_retries) until five stale kills in a row trip its breaker, so
# a persistent stall costs five or six 600s windows before the turn fails; a
# one-off stall recovers at the first 600s kill.
providers:
  custom:
    stale_timeout_seconds: 600
    request_timeout_seconds: 900

# MCP Servers configuration. Read-only diagnostics surface only.
mcp_servers:
  # Remote MCP endpoints, proxied over stdio by mcp-remote. The explicit
  # timeouts are a backstop: unpatched, mcp-remote drops the request id when the
  # remote answers non-2xx, so the client parks for the whole 300s default.
  # deploy/docker/patches/apply_mcp_remote_forward_errors.py fixes that at build
  # time and carries the full analysis; this bounds the damage if it ever stops
  # applying. Healthy calls to these endpoints measure 0.47-0.48s.
  # `lazy: true`: register tools from the per-profile schema cache without
  # spawning the node proxy; the child starts on first actual tool call.
  # Cluster-agent kanban workers are fresh processes per card and were paying
  # both proxy spawns at boot whether or not the card touched an MCP tool. See
  # the fuller note in agents/platform/config.yaml.
  #
  # `--header User-Agent: …` names this product, the build it came from and its
  # execution mode, so the API team serving the endpoint can attribute the traffic;
  # deploy/shared/defaults/config.yaml carries the full rationale. The string is
  # the same one the Platform Agent sends, character for character.
  developer_knowledge:
    command: "node"
    args:
      - "/opt/mcp-remote/dist/proxy.js"
      - "--header"
      - "User-Agent: kube-agents/${KUBE_AGENTS_VERSION} (daemon)"
      - "https://developerknowledge.googleapis.com/mcp"
    lazy: true
    connect_timeout: 30
    timeout: 60
  gke:
    command: "node"
    args:
      - "/opt/mcp-remote/dist/proxy.js"
      - "--header"
      - "User-Agent: kube-agents/${KUBE_AGENTS_VERSION} (daemon)"
      - "https://container.googleapis.com/mcp"
    lazy: true
    connect_timeout: 30
    timeout: 60
    # Read tools only, as an allowlist: this server bypasses the credential
    # broker, so the list is what keeps its write tools out of the model's
    # reach. deploy/shared/defaults/config.yaml carries the full rationale; the
    # list is the same one, name for name.
    tools:
      include:
        - check_k8s_auth
        - describe_k8s_resource
        - get_cluster
        - get_k8s_cluster_info
        - get_k8s_logs
        - get_k8s_resource
        - get_k8s_rollout_status
        - get_k8s_version
        - get_node_pool
        - get_operation
        - list_clusters
        - list_k8s_api_resources
        - list_k8s_events
        - list_node_pools
        - list_operations

# Explicitly list platform_toolsets (reserved Hermes key) to bypass the upstream
# loader prefix-mapping bug. Scoped: no mcp-platform_control.
platform_toolsets:
  cli:
    - hermes-cli
    - mcp-developer_knowledge
    - mcp-gke
  api_server:
    - hermes-api-server
    - mcp-developer_knowledge
    - mcp-gke

# No memory provider. Per-user memory scopes its store by the gateway identity
# (agent._user_id), and a Cluster Agent is only ever spawned by the kanban
# dispatcher, which carries no human identity — so its writes would all collapse
# into one anonymous bucket. Per-user memory lives on the Chat Agent only (see
# agents/chat/config.yaml); this agent gets its context from the kanban card.
memory:
  memory_enabled: false
  user_profile_enabled: false

# Enable DuckDuckGo web search (useful for looking up error signatures).
web:
  backend: "ddgs"

plugins:
  enabled:
    - hermes_otel

# This template is copied verbatim into /opt/cluster-template rather than merged
# with deploy/shared/defaults/config.yaml, so the probe has to be turned off
# again here. Rationale lives in that file; in short, it spawns four interpreters
# to publish a Python-toolchain line that is factually wrong on this image.
agent:
  environment_probe: false

# Per-file character cap on context files (SOUL.md, AGENTS.md) in the system
# prompt; rationale lives in agents/platform/config.yaml, which pins the same
# value. SOUL.md here sits just under Hermes's 20,000 fallback, so without the pin
# the next edit to it would start cutting its middle. Cluster profiles already on
# the volume get this key from the entrypoint's back-fill in the cluster loop.
context_file_max_chars: 100000

# Auxiliary tasks: disable Hermes auxiliary title generation (issue #2523).
# After turn 1, Hermes fires a background _generate_session_title call with
# reasoning_config: {enabled: false} (reasoning_effort: "minimal"). On Vertex AI
# Gemini 3.x Flash, LiteLLM maps this to thinkingLevel: "minimal", which Vertex
# rejects with HTTP 400 (unsupported thinking level). On Claude models, LiteLLM
# maps "minimal" to thinking budget 1024, burning reasoning tokens on every session.
# While the admin console Chat page and Hermes dashboard sidecar display session
# titles when available (falling back to user message preview), disabling titling
# avoids runtime 400 errors and token waste across all profiles.
auxiliary:
  title_generation:
    enabled: false
