# The domains the Platform Agent operates in, as data. Each is a job area with
# its own SOP, cron stream, and journeys (the testing-strategy design document,
# in review, is the source of the list; until it lands this file is
# self-contained).
#
# Every bench case claims one of these with a top-level `domain: <slug>` in its
# task.yaml; scripts/validate_bench_cases.py rejects a case that claims none.
# A case no row describes gets a new row here, not an exemption.
#
# Each row carries, besides `slug`, `name` and `journey`:
#   owner    the GitHub login (no at sign) who answers for the domain's cases
#            as a set: what is covered, what is missing, what a red means.
#            A case's own `owner:`, when set, is first for that case's bugs;
#            without one the case falls to this owner (bench/CONTRIBUTING.md).
#   backup   the GitHub login who covers when the owner is out; not the owner.
#   meaning  one plain sentence saying what the domain checks, for a reader
#            who does not know the code.
# scripts/test_domain_coverage.py fails on a row missing owner, backup or
# meaning, or whose backup is its owner. One optional key:
#   new      `true` on a row whose cases have no nightly data yet, so the
#            weekly health email (scripts/eval_dashboard/weekly_email.py)
#            does not refuse to render over it. Remove it once the cases run.
#
# scripts/test_domain_coverage.py reads this file and fails when a domain has
# no bench task carrying a deterministic verification_spec -- the rule "a
# domain with no blocking scenario is uncovered, not passing" as a build
# failure rather than a sentence in a document.
#
# A task claims a domain with a top-level `domain: <slug>` field in its
# task.yaml. It counts as covering the domain only when it also carries a
# non-empty verification_spec AND is a name on hack/eval/blocking-roster.txt.
# Covered means able to red every pull request: a nightly-only task, or a
# presubmit seat held out of the roster (the exception section in
# hack/eval/presubmit-cases.txt), leaves its domain uncovered until its
# roster line lands.
#
# `allowlist` names the domains that are known-uncovered today, one record
# each with an owner, an issue and an expiry date (the fields are described
# above the list). Delete entries as Phase 2 ACTIVATES scenarios; the lint
# refuses an uncovered domain that is not listed (a regression), a listed
# domain that is covered (a stale entry hiding progress), and a record
# missing a field or running past the expiry cap. The shrinking allowlist is the tier-2 progress
# metric of the testing implementation plan, as line coverage is the tier-1
# one.
#
# PROBES AND THE CANARY, because the journey lines below assume it: the
# 2026-08-26 measurement (bench/tasks/DRAFTS.md) put a full audit sweep at
# 600-1300s per domain, which six domains cannot spend inside one presubmit.
# So in presubmit each audit domain is covered by a PROBE -- a targeted
# question about that domain's planted defect, answered from observed
# evidence and graded on the reply -- while the audit-SOP machinery itself
# (dispatch, delegation, token minter, ledger write) was exercised end to end
# by exactly one audit kept as a canary, under the `fleet-audits` domain,
# until 2026-09-22, when the presubmit became the blocking roster only and
# the never-admitted canary moved to the nightly with the other full audits
# (hack/eval/nightly-cases.txt), and back into the presubmit file, held out,
# on 2026-09-29 (#2013); only a roster line counts as coverage.

# Not a domain, and no case claims it: who a nightly eval failure caused by
# infrastructure (pool projects, seeded fleet, CI, Prow) is filed to. Area
# ownership of that infrastructure stays in docs/ownership.md.
infra_owner: lapis2002
infra_backup: jayantid

domains:
  - slug: chat-and-routing
    name: Chat and routing
    owner: toshiowang
    backup: jayantid
    meaning: Answers questions about the fleet and hands work to the right specialist.
    journey: Ask the fleet a question; routed to the right specialist, answered from observed evidence
  - slug: reliability
    name: Reliability (obtainability-audit)
    owner: stalhaali
    backup: dshnayder
    meaning: Checks whether workloads survive maintenance, such as a node drain.
    journey: A targeted probe asks whether the planted workload survives a drain and answers from observed evidence
  - slug: capacity
    name: Capacity (stockout-prevention)
    owner: haoxuw
    backup: stalhaali
    meaning: Checks whether node pools can take more load, and names what blocks them.
    journey: A targeted probe asks whether the pinned pool can absorb load and names the cap that stops it
  - slug: cost
    name: Cost (fleet-wide-cost-analysis)
    owner: Fuxiao-Gao
    backup: haoxuw
    meaning: Finds idle resources you are paying for.
    journey: A targeted probe names the node pool running no workloads right now, from live reads
  - slug: security
    name: Security (compliance-audit, ai-security-audit)
    owner: jayantid
    backup: lapis2002
    meaning: Finds risky access, such as an over-broad admin grant, and refuses unsafe self-changes.
    journey: A targeted probe asks whether the planted RBAC binding is appropriately scoped and names the over-grant
  - slug: upgrades
    name: Upgrades (security-patch-orchestrator, upgrade-retrospective)
    owner: haoxuw
    backup: toshiowang
    meaning: Checks whether clusters are current and safe to upgrade.
    journey: A targeted probe asks whether a control plane is current and reports the lag it actually read
  - slug: consistency
    name: Consistency (fleet-consistency-drift)
    owner: lapis2002
    backup: dshnayder
    meaning: Spots a cluster configured differently from its peers.
    journey: A targeted probe compares one cluster's configuration against its live peers and names the differing facet
  - slug: fleet-audits
    name: Fleet audits (SOP machinery)
    owner: toshiowang
    backup: dshnayder
    meaning: Runs a scheduled audit end to end and files a report people can act on.
    journey: "A scheduled audit SOP runs end to end: delegates to a worker, sweeps the fleet, and files a ledger issue a human can act on"
  - slug: remediation
    name: Remediation (fleet-audit cron remediation, RCA chat prompt via submit-suggestion)
    owner: Fuxiao-Gao
    backup: dshnayder
    meaning: Proposes fixes as pull requests; never applies them directly.
    journey: A proposed fix lands as a pull request; nothing applied directly
  - slug: cluster-debugging
    name: Cluster debugging
    owner: bradhoekstra
    backup: Fuxiao-Gao
    meaning: Diagnoses a broken workload without changing anything.
    journey: Debugs a workload; the Cluster Agent stays read-only and inside its own cluster
  - slug: incident-triage
    name: Incident triage (autoops)
    owner: stalhaali
    backup: bradhoekstra
    meaning: Turns a warning event into a root cause and fix options for a person to approve.
    # Not "and a pull request". The pull request is real but downstream and
    # someone else's: _triage_task_body in agents/platform/scripts/
    # session_kv_server.py ends the triage card at a report whose last bullet
    # asks a human to reply "apply", and says in as many words that the agent
    # holding the GitOps write path opens the PR, "not you, and not from this
    # card". Opening it is the remediation domain's journey, one row above.
    journey: A warning event is triaged to a root cause and remediation options a human authorizes, never a cluster write
  - slug: observability
    name: Observability (the agent's and the fleet's metrics, traces and alerting)
    owner: bradhoekstra
    backup: jayantid
    meaning: Checks that metrics, traces and alerts are wired up and readable.
    journey: A question about scraping, trace latency or an alert policy is answered from the live configuration, or written to the observability skill's guidance
  - slug: source-control
    name: Source control (forge and version-control work)
    owner: dshnayder
    backup: lapis2002
    meaning: Works with issues, pull requests, review feedback and branches on the code forge.
    journey: An issue, pull request, review comment or branch is read and written through the version-control verbs, never a credentialed clone or a forge CLI in the sandbox

# Known-uncovered; empty is Phase 2's exit criterion. agent-kanban-smoke
# covers chat-and-routing; cluster-debugging came off first
# among the Phase 2 domains, in #939. Reliability, capacity, security,
# upgrades and cost are covered by domain probes, upgrades again since 2026-10-23
# (its probe was nightly-only from 2026-10-16, #3269; consistency's was
# demoted on 2026-10-21, #3598, below) --
# see the header above for why probes rather than six full audits.
# remediation's one roster case, pdb-remediation-pr, was nightly-only from
# 2026-10-17 (#3120) until 2026-10-26, when it took its roster line back
# after #3145 seeded the manifest it needs.
# incident-triage came off in #1045, once bench/tf/prebuilt/autoops-incident
# gave autoops-warning-event-triage an incident to triage (note that
# gpu-stress-test-diagnosis never covered it, being a chat-prompted
# post-incident RCA rather than event-fired triage), went back on when that
# case moved to the nightly (2026-09-03), and came off again on 2026-09-22
# when incident-triage-oom-event-probe took a roster seat (#1023).
# source-control came off on 2026-10-23, when vcs-spent-branch-reuse took a
# roster seat on its nightly record.
#
# An entry goes back on here only alongside a scenario that stopped running,
# or arrives with a new row whose cases have no roster line yet. A roster
# edit that leaves a domain with no blocking case must, in the same pull
# request, seat a stand-in case from that domain on the roster, keep the
# demoted case on the presubmit as a held-out seat (which still covers
# nothing here), or add a record below (docs/eval-gate-roster.md,
# "Demoting a flaky case").
#
# Each record carries:
#   slug      the domain, as in its row above.
#   since     the date (YYYY-MM-DD) the domain lost its last blocking case.
#   issue     the number of the open issue that says how coverage comes back.
#   owner     the GitHub login who brings it back; the domain row's owner
#             unless someone else took it. Must be in the root OWNERS file.
#   expires   the date the record stops excusing the gap: at most 14 days
#             after `since`, unless `why` says why it is longer. Past
#             `expires` (by the UTC date) pull requests are not blocked; the
#             CI-health bot escalates to the owner on the record's issue
#             (scripts/domain_allowlist.py finds expired records). Moving the
#             date is an edit to this line in a pull request, so the record
#             shows who moved it and why.
#   why       required only when `expires` is more than 14 days after
#             `since`: one sentence saying why.
#   held_out  optional: a case of this domain still running on the presubmit
#             as a held-out seat (the last section of
#             hack/eval/presubmit-cases.txt). It runs on every pull request
#             but cannot red one, so it does not cover the domain.
allowlist:
  # fleet-audits: the domain's one case, the compliance-rbac-overgrant
  # canary, was never admitted (demoted 2026-09-02 on #1171) and moved to the
  # nightly on 2026-09-22 (#1023). Since 2026-09-29 it is seated held out in
  # hack/eval/presubmit-cases.txt (#2013 step 2, the documented exception to
  # the blocking-only rule). Delete this record in the pull request that adds
  # its roster line (#2013 step 4, after three clean days). incident-triage
  # sat here from 2026-09-03 to 2026-09-22 for the same shape of reason.
  - slug: fleet-audits
    since: 2026-09-22
    issue: 2013
    expires: 2026-11-09
    why: "Uncovered before records expired; the first dated expiry, set on 2026-10-26, is 14 days from that day, and #2013 lists four product defects to fix before the canary can take a roster line."
    held_out: compliance-rbac-overgrant
  # consistency: the domain's one presubmit case,
  # consistency-authorized-networks-probe, was demoted to the nightly on
  # 2026-10-21 (#3604) after it failed about 30% of repetitions on the Gemini
  # setup on unrelated pull requests: Vertex 429s (#3399, #3448) and real
  # misses where the agent read seeded-c's leftover authorized-networks block
  # as configured. Delete this record in the pull request that restores it,
  # or a stand-in such as consistency-drift-outlier, to the roster.
  - slug: consistency
    since: 2026-10-21
    issue: 3598
    expires: 2026-11-04
  # observability: every case claiming it has been a nightly case since the
  # row was added (#3437), so it has never had a roster case. Delete this
  # record in the pull request that gives the domain a roster line.
  # source-control sat here beside it until vcs-spent-branch-reuse took its
  # roster line on 2026-10-23.
  - slug: observability
    since: 2026-10-19
    issue: 3980
    expires: 2026-11-09
    why: "Uncovered before records expired; the first dated expiry, set on 2026-10-26, is 14 days from that day, and no observability case is near the admission bar yet, so #3980 asks for a fixed or new case."
