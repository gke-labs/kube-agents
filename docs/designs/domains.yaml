# The eleven domains the Platform Agent operates in, as data. Each is a job
# area with its own SOP, cron stream, and journeys (the testing-strategy design
# document, in review, is the source of the list; until it lands this file is
# self-contained).
#
# scripts/test_domain_coverage.py reads this file and fails when a domain has
# no bench task carrying a deterministic verification_spec -- the rule "a
# domain with no blocking scenario is uncovered, not passing" as a build
# failure rather than a sentence in a document.
#
# A task claims a domain with a top-level `domain: <slug>` field in its
# task.yaml. It counts as covering the domain only when it also carries a
# non-empty verification_spec AND is a name on hack/eval/blocking-roster.txt.
# Covered means able to red every pull request: a nightly-only task, or a
# presubmit seat held out of the roster (the exception section in
# hack/eval/presubmit-cases.txt), leaves its domain uncovered until its
# roster line lands.
#
# `allowlist` names the domains that are known-uncovered today. Delete entries
# as Phase 2 ACTIVATES scenarios; the lint refuses both an uncovered domain that
# is not listed (a regression) and a listed domain that is covered (a stale
# entry hiding progress). The shrinking allowlist is the tier-2 progress
# metric of the testing implementation plan, as line coverage is the tier-1
# one.
#
# PROBES AND THE CANARY, because the journey lines below assume it: the
# 2026-08-26 measurement (bench/tasks/DRAFTS.md) put a full audit sweep at
# 600-1300s per domain, which six domains cannot spend inside one presubmit.
# So in presubmit each audit domain is covered by a PROBE -- a targeted
# question about that domain's planted defect, answered from observed
# evidence and graded on the reply -- while the audit-SOP machinery itself
# (dispatch, delegation, token minter, ledger write) was exercised end to end
# by exactly one audit kept as a canary, under the `fleet-audits` domain,
# until 2026-09-22, when the presubmit became the blocking roster only and
# the never-admitted canary moved to the nightly with the other full audits
# (hack/eval/nightly-cases.txt), and back into the presubmit file, held out,
# on 2026-09-25 (#2013); only a roster line counts as coverage.

domains:
  - slug: chat-and-routing
    name: Chat and routing
    journey: Ask the fleet a question; routed to the right specialist, answered from observed evidence
  - slug: reliability
    name: Reliability (obtainability-audit)
    journey: A targeted probe asks whether the planted workload survives a drain and answers from observed evidence
  - slug: capacity
    name: Capacity (stockout-prevention)
    journey: A targeted probe asks whether the pinned pool can absorb load and names the cap that stops it
  - slug: cost
    name: Cost (fleet-wide-cost-analysis)
    journey: A targeted probe names the node pool running no workloads right now, from live reads
  - slug: security
    name: Security (compliance-audit, ai-security-audit)
    journey: A targeted probe asks whether the planted RBAC binding is appropriately scoped and names the over-grant
  - slug: upgrades
    name: Upgrades (security-patch-orchestrator)
    journey: A targeted probe asks whether a control plane is current and reports the lag it actually read
  - slug: consistency
    name: Consistency (fleet-consistency-drift)
    journey: A targeted probe compares one cluster's configuration against its live peers and names the differing facet
  - slug: fleet-audits
    name: Fleet audits (SOP machinery)
    journey: "A scheduled audit SOP runs end to end: delegates to a worker, sweeps the fleet, and files a ledger issue a human can act on"
  - slug: remediation
    name: Remediation (fleet-audit cron remediation, RCA chat prompt via submit-suggestion)
    journey: A proposed fix lands as a pull request; nothing applied directly
  - slug: cluster-debugging
    name: Cluster debugging
    journey: Debugs a workload; the Cluster Agent stays read-only and inside its own cluster
  - slug: incident-triage
    name: Incident triage (autoops)
    # Not "and a pull request". The pull request is real but downstream and
    # someone else's: _triage_task_body in agents/platform/scripts/
    # session_kv_server.py ends the triage card at a report whose last bullet
    # asks a human to reply "apply", and says in as many words that the agent
    # holding the GitOps write path opens the PR, "not you, and not from this
    # card". Opening it is the remediation domain's journey, one row above.
    journey: A warning event is triaged to a root cause and remediation options a human authorizes, never a cluster write

# Known-uncovered. Two entries; empty is Phase 2's exit criterion. The two
# kanban probes cover chat-and-routing; cluster-debugging came off first
# among the Phase 2 domains, in #939. Reliability, capacity, security,
# upgrades, consistency and cost are covered by the six domain probes --
# see the header above for why probes rather than six full audits.
# incident-triage came off in #1045, once bench/tf/prebuilt/autoops-incident
# gave autoops-warning-event-triage an incident to triage (note that
# gpu-stress-test-diagnosis never covered it, being a chat-prompted
# post-incident RCA rather than event-fired triage), went back on when that
# case moved to the nightly (2026-09-03), and came off again on 2026-09-22
# when incident-triage-oom-event-probe took a roster seat (#1023).
#
# An entry goes back on here only alongside a scenario that stopped running.
allowlist:
  # fleet-audits, since 2026-09-22 (#1023): the domain's one case, the
  # compliance-rbac-overgrant canary, was never admitted (demoted 2026-09-02
  # on #1171) and moved to the nightly that day. Since 2026-09-25 it is seated
  # held out in hack/eval/presubmit-cases.txt (#2013 step 2, the documented
  # exception to the blocking-only rule): it runs on every pull request,
  # cannot red one on a graded failure, and covers nothing here. Delete this
  # entry in the pull request that adds its roster line (#2013 step 4, after
  # three clean days), or when the coverage contract formally recognizes the
  # nightly tier (#1175). incident-triage sat here from 2026-09-03 to
  # 2026-09-22 for the same shape of reason.
  - fleet-audits
  # remediation, since 2026-09-22 (#1023): the same decision, and neither of
  # the domain's two writers holds a seat. rca-remediation-pr was demoted
  # 2026-09-02 (#1189) and moved to hack/eval/nightly-cases.txt with the
  # other held-out cases that day; the promotion of pdb-remediation-pr
  # proposed the same day was withdrawn before merge, because the record it
  # cited (12/12 on the four graded nights 2026-09-16 to 09-20) was graded
  # by report_contains, which #1780 (merged 2026-09-21) replaced with
  # pull_request_opened, and no graded run of the case under the new check
  # exists yet. Delete this entry when a remediation case is admitted on a
  # nightly record built under pull_request_opened (#1189's bar for rca,
  # docs/eval-gate-roster.md's entry for pdb).
  - remediation
