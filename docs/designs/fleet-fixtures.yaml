# The seeded fleet's planted defects, as data, addressed by ROLE.
#
# THE ROLE VOCABULARY IS NOT DEFINED HERE. `bench/tf/fleet/fixtures.json` owns
# it: it sits beside the Terraform that plants the fixtures, and it is what
# hack/fleet-kubeconfigs.sh resolves a role against at run time and what a
# task.yaml check's `fixture_role:` names. Every slug below with a `slot` must
# appear there with the same slot, and scripts/validate_bench_cases.py fails
# the build when one does not -- two catalogues of the same fixtures that can
# disagree about what a role is called are worse than either alone.
#
# What this file adds on top of that catalogue is the part fixtures.json does
# not carry: the day-N availability gate below, and the fixtures that are not
# on a cluster at all (`orphan-disks`, `startup-fail-vm`, `rotated-console-vm`,
# `world-open-ingress`, `declared-mtu-peering`, `declared-orphan-snapshot` and
# `orphan-snapshot` are
# project-scoped, so they have no cluster slot). fixtures.json carries all but
# `orphan-disks` as project-scoped roles (`cluster_slot: null`), which the runner
# probes in the project with gcloud; `orphan-disks` is in this file alone. A
# project-scoped role in fixtures.json must appear here with `slot: null`.
#
# A case names a fixture by role and never by a cluster name or a project id.
# Each eval project carries its own set of clusters (`bench/tf/fleet/`,
# `var.cluster_prefix` defaults to "seeded", so the live names are
# seeded-a to seeded-d), and a case written against one project has to run unchanged
# against the next. The slot letter is the addressable thing; the name is a
# rendering of it.
#
# scripts/validate_bench_cases.py reads this file and rejects a task.yaml whose
# `fixtures:` list names a role that is in neither catalogue, unless the case
# is parked in FIXTURE_NOT_READY on the issue that plants it. docs/designs/
# bench-fleet-catalog.md is the prose contract; bench/tf/fleet/ is the
# implementation and the source of every object name below.
#
# `available_from_day` is days after the stack is applied, and it is the SOP's
# own age gate rather than a provisioning delay: recreating a fixture restarts
# its clock, because creationTimestamp is server-set and immutable (and so is
# the status.completionTime of a finished Job). The clock
# runs per project, so a fleet-wide assertion holds only from the most recently
# applied project's date.

# The cluster slots. `slot` is what a case addresses; `suffix` is what
# the Terraform appends to var.cluster_prefix to render the live name.
slots:
  - slot: a
    suffix: a
    carries: The seeded namespaces, the two defect node pools, the declared zonal pool and the pool that names a missing reservation
  - slot: b
    suffix: b
    carries: The held-back control plane, and the upgrade-readiness drain defects
  - slot: c
    suffix: c
    carries: The configuration outlier, on the control plane and its default pool, and the ComputeClass fixtures
  - slot: d
    suffix: d
    carries: Nodes in two zones, and the zonal-skew workloads

fixtures:
  - role: rbac-overgrant
    slot: a
    available_from_day: 0
    objects:
      - clusterrolebinding/debug-binding
    namespace: seeded-security
    defect: >-
      Cluster-scoped ClusterRoleBinding granting cluster-admin to the default
      ServiceAccount in seeded-security. Cluster-scoped deliberately: the
      compliance SOP reads clusterrolebindings only.

  - role: no-pdb-workload
    slot: a
    available_from_day: 0
    objects:
      - deployment/checkout-gateway
    namespace: seeded-reliability
    defect: >-
      Two replicas with no PodDisruptionBudget. Two rather than one because the
      reliability SOP flags spec.replicas >= 2 only.

  - role: declared-no-pdb-workload
    slot: a
    available_from_day: 0
    objects:
      - deployment/notification-relay
    namespace: seeded-intent
    defect: >-
      Two replicas with no PodDisruptionBudget, in a namespace with no
      NetworkPolicy: two postures the same knowledge/ note in the pool project's
      GitOps repository declares on purpose. A second such workload so the
      declaration silences none of the cases that grade checkout-gateway.

  - role: declared-token-workload
    slot: a
    available_from_day: 0
    objects:
      - deployment/token-reader
      - deployment/token-sidecar
      - serviceaccount/default
    namespace: seeded-token
    defect: >-
      Two one-replica Deployments on the namespace's default ServiceAccount
      with the token mounted, behind a default-deny NetworkPolicy. The
      knowledge/ note declares token-reader on purpose and not token-sidecar,
      so the compliance audit must keep the sibling's fix off the shared
      ServiceAccount the declared workload's token comes from.

  - role: declared-overrequest-workload
    slot: a
    available_from_day: 0
    objects:
      - deployment/burst-ingest
    namespace: seeded-headroom
    defect: >-
      Two pause replicas requesting 10m / 128Mi each and using almost none of
      the memory, behind a budget and a default-deny policy: the waste audit's
      overrequest posture, which the same knowledge/ note declares on
      purpose. The one declarable cost check with no multi-day age gate, so
      the posture is observable on apply day; its case still needs a ledger,
      which the generated-name family's findings supply from their first
      hour, before the idle pool's day 7.

  - role: generated-name-family
    slot: a
    available_from_day: 0
    objects:
      - deployment/calibration-eb84fcb6-cb5b-4a66-ae6e-76d9f868a0d6
      - deployment/calibration-374472b8-d3be-4c23-879f-9a44a5775c2b
      - deployment/calibration-20192efa-2b20-4f64-87c3-a3919cdcd132
    namespace: seeded-family
    defect: >-
      Three Deployments named calibration-<uuid>, the shape a spawner leaves,
      with one common app.kubernetes.io/part-of label and no owner reference.
      Each is two pause replicas requesting 10m / 128Mi and using almost none
      of the memory, behind a budget and a default-deny policy: the waste
      audit's overrequest posture on objects whose names no repository file
      declares. The names are literals in the stack, the same on every
      project. No multi-day age gate.

  - role: generated-name-job-family
    slot: a
    available_from_day: 7
    objects:
      - job/reindex-8daede4e-4620-426c-9e07-58f5f0505f39
      - job/reindex-1657c63c-8745-4ba0-a6a9-1d4365c43041
      - job/reindex-55fe5b6f-82b7-4fef-bfe3-877e9e5200b2
    namespace: seeded-family
    defect: >-
      Three finished Jobs named reindex-<uuid>, the shape a spawner leaves,
      with one common app.kubernetes.io/part-of label, no owner reference
      and no ttlSecondsAfterFinished, so each one stays after it ran. The
      waste audit's terminal-pods check files a finished Job once its
      status.completionTime is 7 days old, so the role is not ready, rather
      than drifted, until then. The names are literals in the stack, the
      same on every project.

  - role: long-name-replaced-pod
    slot: a
    available_from_day: 1
    objects:
      - deployment/settlement-batch-reconciliation-exporter-for-partner-feeds
      - configmap/long-name-pod-cycle
      - serviceaccount/long-name-pod-cycle
      - role/long-name-pod-cycle
      - rolebinding/long-name-pod-cycle
    namespace: seeded-long-name
    defect: >-
      One Deployment whose name has 58 characters, so Kubernetes cuts the
      names of its pods: the name and 5 generated characters, with no hash
      between them. Its one pod is idle until 18:00 UTC, then uses its CPU
      limit and holds 64Mi for 11 minutes, then deletes itself through the
      API with a Role that can delete pods in this namespace only. The live
      pod is then idle, and the pod of the day before is a replaced pod with
      a peak above the bar of the waste audit's overrequest check. The first
      replaced pod exists one day after the plant. The Deployment has no
      verdict from 18:00 to about 19:11 UTC.

  - role: cpu-burst-and-flat
    slot: a
    available_from_day: 0
    objects:
      - deployment/cpu-flat
      - deployment/cpu-burst
      - configmap/cpu-cycle
    namespace: seeded-cpu-cycle
    defect: >-
      Two Deployments whose real CPU use is in the manifest. cpu-flat uses
      the CPU all the time, held by its limit at its 100m request: the
      control. cpu-burst uses the CPU for 45 seconds at the start of each 10
      minutes, held by its limit at its 200m request: in a bucket of 300
      seconds the burst reads as 15% of the request, under the bar of the
      waste audit's overrequest check, and in a bucket of 60 seconds as 37%
      or more. No multi-day age gate: the check reads a pod after one hour.

  - role: guaranteed-qos-workload
    slot: a
    available_from_day: 0
    objects:
      - deployment/ledger-writer
    namespace: seeded-qos
    defect: >-
      Two replicas whose container sets requests equal to limits (10m /
      32Mi), so the pods are Guaranteed QoS and a lower request lowers the
      limit with it. The container burns its 10m CPU limit, so it is
      throttled there already. A request cut has to name this dependency;
      the waste audit never names the workload (CPU in use, both dimensions
      under its resize floor).

  - role: stalled-controller
    slot: a
    available_from_day: 0
    objects:
      - deployment/inventory-api
    namespace: seeded-stall
    defect: >-
      One Deployment whose container reads a ConfigMap that does not exist
      through envFrom. Its pods sit in CreateContainerConfigError and the
      Deployment never progresses, with no crash and no restart.

  - role: crashloop-workload
    slot: a
    available_from_day: 0
    objects:
      - deployment/payments-api
    namespace: seeded-debug
    defect: A deterministic OOMKilled crashloop.

  - role: hpa-saturated
    slot: a
    available_from_day: 0
    objects:
      - nodepool/pinned-inference-pool
      - deployment/inference-server
      - horizontalpodautoscaler/inference-server
    namespace: seeded-capacity
    defect: >-
      A single-zone pool whose autoscaler is pinned at min = max = 1, hosting a
      workload whose HPA (min 1, max 10) settles above what the pool can
      schedule, leaving a standing Pending backlog. Node label and taint
      seeded-role=pinned-inference keep anything else off it -- the taint value
      is not the role slug, see bench-fleet-catalog.md. The desired replica
      count is not stable across projects (measured 3/2/3 on 2026-08-24), so
      assert the pin and the unmet demand and never a number.

  - role: declared-single-zone-pool
    slot: a
    available_from_day: 0
    objects:
      - nodepool/declared-zonal-pool
    namespace: null
    defect: >-
      A single-zone autoscaling pool (min 0, max 2) held at zero nodes behind
      the taint seeded-role=declared-zonal, so it is the stockout SOP's 3.9
      zone-locked posture and never its at-ceiling arm. Not a defect: the pool
      project's GitOps knowledge/ note declares it on purpose, and the capacity
      audit lists it under Declared intent rather than as a finding.
      pinned-inference-pool cannot play this part, since its backlog is the
      defect stockout-pinned-pool grades.

  - role: missing-reservation-pool
    slot: a
    available_from_day: 0
    objects:
      - nodepool/missing-reservation-pool
    namespace: null
    defect: >-
      A pool with no autoscaling, held at zero nodes behind the taint
      seeded-role=missing-reservation, that consumes one named reservation
      (SPECIFIC_RESERVATION) while no reservation of that name exists in any
      zone of the project. GKE reports the pool RUNNING and refuses the first
      node it would add, so the pool can never grow. The stack plants no
      reservation: the missing one is the defect. Zero nodes cost nothing.

  - role: deprecated-api-caller
    slot: a
    available_from_day: 0
    objects:
      - cronjob/legacy-endpoints-writer
      - service/legacy-endpoints-lane
      - endpoints/legacy-endpoints-lane
    namespace: seeded-deprecation
    defect: >-
      A CronJob on a dedicated ServiceAccount that merge-patches an annotation
      onto a hand-written Endpoints v1 object every ten minutes. Endpoints is
      deprecated and still served (the fleet README says since when), so on
      every fleet master each write is audit-stamped k8s.io/deprecated=true
      with no k8s.io/removed-release label and no Recommender insight; a case
      reads the trail by principal plus methodName, never by the label alone,
      because kube-system's endpoint-controller is stamped the same way. The
      first run is a Job the apply waits on, so day 0 already has an entry.
      The writer refuses to write below 1.33, so a master that old shows as a
      retained failed Job rather than as a silent fixture.

  - role: idle-nodepool
    slot: a
    available_from_day: 7
    objects:
      - nodepool/idle-batch-pool
    defect: >-
      A node pool with zero non-system pods, held that way by the
      seeded-role=idle-batch NoSchedule taint. The cost SOP's idle-nodepool
      check refuses pools created less than 7 days ago, and the GKE node pool
      resource exposes no creation timestamp at all, so pool age is inferred
      from node boot-disk time and a rolling node recreation resets the gate.
      The least dependable fixture here.

  - role: startup-fail-vm
    slot: null # Project-scoped, in var.zone; not attached to any cluster.
    available_from_day: 0
    objects:
      - instance/startup-fail-<prefix>
    defect: >-
      A standalone e2-micro, startup-fail-<prefix>, whose startup script
      exits 1 on every boot. The guest agent prints the failure line once
      per boot, and the serial buffer rotates it out within about three
      weeks, so each reconcile resets the VM to print it again.

  - role: rotated-console-vm
    slot: null # Project-scoped, in var.zone; not attached to any cluster.
    available_from_day: 0
    objects:
      - instance/serial-flood-<prefix>
    defect: >-
      A standalone e2-micro, serial-flood-<prefix>, whose startup script
      fails at boot and whose systemd timer then writes about 2 MiB of
      counted filler lines to serial port 1, two minutes after boot and
      every 24 hours after. The 1 MiB serial buffer keeps only the filler,
      so the boot's failure lines rotate out minutes after boot. The
      reconcile does not reset this VM: the rotated console is its healthy
      state, and the VM's own daily pass renews it.

  - role: world-open-ingress
    slot: null # Project-scoped, in var.zone; not attached to any cluster.
    available_from_day: 0
    objects:
      - firewall/world-open-2379-<prefix>
      - instance/world-open-<prefix>
      - firewall/world-open-deny-remote-<prefix>
    defect: >-
      A firewall rule opening tcp:2379 to the internet on the one VM that
      carries its tag, which holds an external IP. Nothing listens on 2379.
      A deny rule blocks tcp:22 and tcp:3389 on that VM.

  - role: declared-mtu-peering
    slot: null # Project-scoped, global; not attached to any cluster.
    available_from_day: 0
    objects:
      - network/mtu-peer-declared
    defect: >-
      A custom-mode VPC at MTU 8896 with no subnet, peered both ways with
      `default` (MTU 1460), so the networking SOP's 2.4 reads the ACTIVE
      peering as an MTU mismatch. Not a defect: the pool project's GitOps
      knowledge/ note declares the peering on purpose, and the networking
      audit lists it under Declared intent rather than as a finding.

  - role: orphan-disks
    slot: null # Project-scoped, in var.zone; not attached to any cluster.
    available_from_day: 30
    objects:
      - disk/orphan-pd-1
      - disk/orphan-pd-2
    defect: >-
      Two unattached 10 GB persistent disks. The cost SOP's unattached-disk
      collector filters server-side on creationTimestamp<-P30D.

  - role: declared-orphan-snapshot
    slot: null # Project-scoped, a global object; not attached to any cluster.
    available_from_day: 91
    objects:
      - snapshot/declared-orphan-snap-<prefix>
    defect: >-
      A Persistent Disk snapshot whose source disk is gone: the stack's
      planter (orphan_snapshot.py) snapshots a 10 GB throwaway disk and
      deletes it, and no snapshot schedule took the snapshot. The GCE compute
      audit's orphaned-snapshots check flags it once
      (now - creationTimestamp).days > 90, so the role is not ready, rather
      than drifted, until day 91. The pool project's GitOps knowledge/ note
      declares the snapshot on purpose, so the compute audit lists it under
      Declared intent rather than as a finding.

  - role: orphan-snapshot
    slot: null # Project-scoped, a global object; not attached to any cluster.
    available_from_day: 91
    objects:
      - snapshot/orphan-snap-<prefix>
    defect: >-
      The second snapshot of the same throwaway disk, the same
      orphaned-snapshots shape, which no note declares: the control the
      compute audit keeps filing as a finding beside the declared one.
      Not ready, rather than drifted, until day 91, as its sibling.

  - role: version-laggard
    slot: b
    available_from_day: 0
    objects:
      - cluster/self
    defect: >-
      Control plane held one minor behind the REGULAR channel default, and
      enrolled in REGULAR, which is what makes the lag visible to the upgrade
      SOP's master-behind check at all. Held between reconciles by a
      NO_MINOR_UPGRADES maintenance exclusion. The pin is drawn from REGULAR's
      own list on a create and is the running version inside the lag minor,
      so once REGULAR moves past the running patch the version stays absent
      from REGULAR until GKE's own patch auto-upgrade moves it; while another
      roster or validMasterVersions still offers it (so on 2026-10-14; nothing
      in the stack keeps it) upgrade check 3.1 branch (a) does not fire and
      the cluster carries branch (b) at major. A held version newer than every
      REGULAR patch of its minor is drift (`not_ahead_of_channel` in
      fixtures.json): agents read it as current or ahead, not behind. See
      docs/designs/bench-fleet-catalog.md.

  - role: drift-outlier
    slot: c
    available_from_day: 1
    objects:
      - cluster/self
    defect: >-
      Master authorized networks absent, where slots a, b and d carry an
      open-for-eval block. The drift SOP excludes a cluster whose createTime is
      under 24 hours old from every cohort, and its cohort floor is three
      clusters: replacing c silences the finding for a day, and so does
      replacing any cluster on a project whose fleet predates slot d. The
      hourly scan reports a c under a day old as drift.

  - role: drift-pool-outlier
    slot: c
    available_from_day: 1
    objects:
      - cluster/self
    defect: >-
      Slot c's default pool on a 50 GB boot disk with kubeletConfig.podPidsLimit
      4096, where every other pool in the fleet runs a 20 GB disk and no
      kubelet block. The drift SOP's boot-disk facet reads the disk and its
      kubelet-config facet reads the kubelet block. Day 1 as for drift-outlier,
      the cohort's 24-hour age gate. A separate role, so this half drifting
      excuses nothing from the case that lists drift-outlier; until the
      reconcile rolls the change every project reads it drifted.

  - role: untargeted-compute-class-workload
    slot: c
    available_from_day: 0
    objects:
      - deployment/app-worker-a
      - computeclass/general-ccc
    namespace: seeded-compute-class
    defect: >-
      A three-replica Deployment with no cloud.google.com/compute-class
      nodeSelector and no compute-class affinity, in a namespace with no
      default class, on the cluster whose only untainted pool carries the
      general-ccc label: the untargeted workload the Cluster Autoscaler's
      ComputeClass pre-filter leaves out of its scale-up simulation. The pods
      run on the labelled node; the checks read the manifest, never the phase.

  - role: compute-class-affinity-workload
    slot: c
    available_from_day: 0
    objects:
      - deployment/app-worker-b
      - computeclass/general-ccc
    namespace: seeded-compute-class
    defect: >-
      A Deployment naming ComputeClass general-ccc only in a required
      nodeAffinity term and never in nodeSelector. A required nodeAffinity on
      the class key also requests the class, so this is the targeted control
      beside the untargeted workload and no check flags it.

  - role: compute-class-toleration-workload
    slot: c
    available_from_day: 0
    objects:
      - deployment/batch-worker-a
      - computeclass/general-ccc
    namespace: seeded-compute-class
    defect: >-
      A Deployment targeted through the nodeSelector with a hand-written
      toleration for the class taint that names key, value and effect and no
      operator. GKE adds its own toleration with operator Equal to a Pod
      that selects a class, and a live test ran this shape on a tainted class
      pool, hand-made and GKE-created (Standard 1.35.8, Autopilot 1.36.4;
      older versions not tested): no defect, and no case reads the role. The
      pool it targets carries no taint, so the pod runs.

  - role: no-ephemeral-limit-workload
    slot: c
    available_from_day: 0
    objects:
      - deployment/batch-worker-a
    namespace: seeded-compute-class
    defect: >-
      The same batch-worker-a Deployment, read for its defect: its
      container sets no ephemeral-storage request or limit, so its writable
      layer and logs can fill the node's boot disk until the kubelet evicts
      pods under DiskPressure. GKE Standard admission adds none, where
      Autopilot writes a 1Gi request and limit onto every container.

  - role: untainted-compute-class-pool
    slot: c
    available_from_day: 0
    objects:
      - nodepool/default-pool
      - computeclass/general-ccc
    defect: >-
      Slot c's default-pool labelled cloud.google.com/compute-class=general-ccc
      with no matching NoSchedule taint, so the scheduler fills it with
      untargeted pods before the pre-filter (GKE 1.35.6 and later) drops them.
      The label is also what leaves the cluster with no untainted pool without
      a class label, which the obtainability audit's 3.24 needs before it
      files anything.

  - role: manual-pools-compute-class
    slot: c
    available_from_day: 0
    objects:
      - computeclass/general-ccc
    defect: >-
      ComputeClass general-ccc with nodePoolAutoCreation off and priority
      rules across the nodepools rule default-pool backs and two machine
      families no pool backs, so a stockout on the first rule leaves pods with
      no fallback GKE can create.

  - role: missing-reservation-compute-class
    slot: c
    available_from_day: 0
    objects:
      - computeclass/reserved-ccc
    defect: >-
      ComputeClass reserved-ccc, whose first rule asks for one named
      reservation (affinity Specific, seeded-absent-reservation) that no
      reservation of the project carries, and whose second rule is a machine
      type that GKE can create. Node pool auto-creation is on and no workload
      selects the class, so GKE makes no node pool for it. One NoSchedule
      taint (dedicated=reserved-ccc) keeps the class out of the
      general-purpose classes that the obtainability audit counts. GKE marks
      the class misconfigured with the reason ReservationNotFound, and the
      stockout audit files that status.

  - role: no-nodelocal-dnscache
    slot: c
    available_from_day: 0
    objects:
      - cluster/self
    defect: >-
      The NodeLocal DNSCache add-on off on slot c, where GKE turns it on by
      default on Standard from 1.34.1 and Autopilot cannot turn it off, so it
      is the one cluster in a pool project without it. Inert for the other
      fixtures; GKE re-creates the pool's node once for the change, inside the
      maintenance window.

  - role: drift-peer-a
    slot: a
    available_from_day: 1
    objects:
      - cluster/self
    defect: >-
      Not a defect: slot a's master authorized networks on, with the
      open-for-eval block, one of the majority drift-outlier is outvoted by.
      The hourly scan asserts the block. Its age is not asserted: one new peer
      leaves seeded-c outvoted 2/3 by the other two.

  - role: drift-peer-b
    slot: b
    available_from_day: 1
    objects:
      - cluster/self
    defect: >-
      Not a defect: slot b's master authorized networks on, with the
      open-for-eval block, one of the majority drift-outlier is outvoted by.
      The hourly scan asserts the block. Its age is not asserted: one new peer
      leaves seeded-c outvoted 2/3 by the other two.

  - role: drift-peer-d
    slot: d
    available_from_day: 1
    objects:
      - cluster/self
    defect: >-
      Not a defect: slot d's master authorized networks on, with the
      open-for-eval block, one of the majority drift-outlier is outvoted by.
      The hourly scan asserts the block. Its age is not asserted: one new peer
      leaves seeded-c outvoted 2/3 by the other two.

  - role: readiness-surge-blocked
    slot: b
    available_from_day: 0
    objects:
      - nodepool/no-surge-pool
    defect: >-
      A node pool with maxSurge 0 and maxUnavailable 1, so an upgrade recreates
      its only node in place. Tainted seeded-role=no-surge so only the pinned
      workload lands there. Not a Blocker on its own: the gke-upgrades skill
      prescribes the setting for reservation-bound pools.

  - role: readiness-pinned-workload
    slot: b
    available_from_day: 0
    objects:
      - deployment/pinned-batch-runner
    namespace: seeded-upgrade
    defect: >-
      One replica whose nodeSelector names no-surge-pool alone, so it is down
      for the whole of each in-place node recreate.

  - role: readiness-drain-blocked
    slot: b
    available_from_day: 0
    objects:
      - poddisruptionbudget/pinned-batch-runner
    namespace: seeded-upgrade
    defect: >-
      A PodDisruptionBudget with maxUnavailable 0 over the pinned workload, so
      disruptionsAllowed is 0 permanently and no drain that touches it can
      finish.

  - role: readiness-lb-drain-timeout
    slot: b
    available_from_day: 0
    objects:
      - backendservice/drain-timeout-<prefix>-b
      - healthcheck/drain-timeout-<prefix>-b
    defect: >-
      A Compute Engine backend service on the default pool's instance group
      whose connection draining timeout is 720 seconds, a fifth over the 600
      seconds GKE waits per node during a pool upgrade, behind a TCP health
      check and no forwarding rule, so it routes nothing and costs nothing;
      every default-pool node recreate on this cluster waits the 720 seconds
      on it, which stays under the 30 minutes after which GKE fails the node
      step.

  - role: readiness-failclosed-webhook
    slot: b
    available_from_day: 0
    objects:
