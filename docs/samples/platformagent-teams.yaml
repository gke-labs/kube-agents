apiVersion: kubeagents.x-k8s.io/v1alpha1
kind: PlatformAgent
metadata:
  name: platform-agent-teams
  namespace: kube-agents-system
spec:
  credentialsSecretRef:
    name: platform-agent-credentials
  integration:
    teams:
      enabled: true
      appIdSecretRef:
        name: platform-agent-credentials
        key: TEAMS_APP_ID
      appPasswordSecretRef:
        name: platform-agent-credentials
        key: TEAMS_APP_PASSWORD
      tenantId: "11111111-1111-1111-1111-111111111111"
      allowedUsers:
        # Entra ID Object IDs (from.aadObjectId); an inbound Teams activity carries no UPN or email.
        - "22222222-2222-2222-2222-222222222222"
        - "33333333-3333-3333-3333-333333333333"
      allowAllUsers: false
      homeChannel: "19:sample-conversation-id@thread.v2"
      adaptiveCards: true
  harness:
    projectId: "demo-gcp-project"
  deployment:
    availability:
      replicas: 1
