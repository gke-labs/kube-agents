# The kubeconfig inside a sandbox. It holds no credential: the egress gateway replaces
# the placeholder token with the one it mints for the sandbox.
apiVersion: v1
kind: Config
clusters:
  - name: cluster
    cluster:
      # The three-label Service name, as in egress-rule.yaml and the certificate.
      server: https://k8s-api-proxy.sandbox-proxy.svc:8443
      # The trust bundle the sandbox runtime mounts for connections through its gateway.
      certificate-authority: /var/run/secrets/egress-gateway/ca.crt
users:
  - name: sandbox
    user:
      token: placeholder
contexts:
  - name: cluster
    context:
      cluster: cluster
      user: sandbox
current-context: cluster
