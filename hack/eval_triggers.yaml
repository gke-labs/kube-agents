# Maps changed files to the eval tasks that must run; hack/eval_triggers.py
# applies it. Buckets are written like a GitHub Actions path filter: an
# ordered `paths` list per bucket, `!` negates, the last matching pattern
# wins, `**` crosses slashes while `*` and `?` do not. The first bucket that
# owns a file decides it. Anything unmapped -- and any selector failure --
# runs the full matrix, so a gap costs time, never coverage.
#
# `extensions` narrows what a bucket's positive wildcard patterns may claim;
# other file types fall through. Literal patterns (no wildcard) skip the
# gate. The lists name what each directory holds in git today, so a new
# file type is a fallthrough until someone classifies it here -- unsure
# means run everything.

# Added to every non-empty selection: the cheapest task that proves the
# platform->cluster-agent chain.
floor:
  - cluster-agent-crashloop-debug

buckets:
  # Prose and images that cannot change agent behaviour. Paths mirror the
  # presubmit's skip_if_only_changed (oss-test-infra), but the extension
  # gate is narrower on purpose: docs-site build code and workflow yaml
  # fall through. agents/** markdown is absent -- it bakes into the image.
  docs:
    kind: no-tasks
    paths:
      - docs/**
      - .github/**
      - examples/**
      - "*.md"
      - LICENSE
      - OWNERS
      - OWNERS_ALIASES
      - bench/tasks/DRAFTS.md
    extensions: [md, mdx, txt, png, jpg, jpeg, svg, gif, css]

  # A task's directory triggers that task; inactive tasks trigger nothing.
  bench-task:
    kind: task-dir
    paths:
      - bench/tasks/*/**
    extensions: [yaml, md]

  # A prebuilt stack triggers the active tasks whose task.yaml declares it;
  # a stack no active task uses runs the full matrix.
  bench-stack:
    kind: stack-dir
    paths:
      - bench/tf/prebuilt/*/**
    extensions: [tf, tfvars, md]
