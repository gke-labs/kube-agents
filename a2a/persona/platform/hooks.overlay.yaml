# The bridge's activity door.
#
# Hermes' outbound webhooks (agent/outbound_webhooks.py) POST every tool call's
# start and end to this URL, fire-and-forget through a bounded queue, signed
# with HMAC-SHA256 when the variable secret_env names is set. The hermes-bridge
# sidecar listens on the loopback address below (the sidecar shares the pod's
# network namespace), sets a random per-task key in each child's environment
# under that variable, and turns the signed deliveries into the task's
# `activity` and `progress` artifacts (a2a/docs/hermes-bridge.md, "Activity").
#
# This file is not part of the platform profile's shipped config.yaml. The
# entrypoint merges it into the profile only under mode: next (step 2.6a-bis,
# gated on KUBEAGENTS_MODE from the managed scope), because in mode: today
# there is no bridge sidecar and every tool call would otherwise try a dead
# loopback port twice and log a warning. Processes under the same profile
# that are not the bridge's children - kanban workers, cron ticks - have no
# key in their environment, deliver unsigned, and the bridge drops those with
# a 204, so they cost one "deliveries will be UNSIGNED" line at their start
# and nothing per call.
#
# The URL's host:port and path, and the variable name, are pinned to the
# bridge's constants by a test (a2a/hermes-bridge/activity_test.go).
hooks:
  outbound:
    - name: a2a-bridge-activity
      url: http://127.0.0.1:8651/hermes/tool-events
      events: [pre_tool_call, post_tool_call]
      secret_env: A2A_ACTIVITY_SECRET
      # Longer than the bridge's publish budget (activityPublishTimeout),
      # because the door publishes on the delivery and a timed-out delivery
      # is retried, which would be a duplicate call in the trace.
      timeout: 10
