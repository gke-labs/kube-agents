# Local dev bus for a2a/web, mirroring the operator's rendered nats.conf on
# the points that matter to this UI: the websocket listener and the read-only
# `web` user's exact grant list, plus the writerless probe subject. It also
# carries the `console` user and a dev `gateway` user, so a local gateway
# binary can run the console door against it. Mirrored
# from the operator's render in
# k8s-operator/internal/controller/platformagent_a2a_manifests.go
# (spec-nats-deployment.md, "web read surface"), and from that render's
# consoleIdentity() and gatewayIdentity() for the console and gateway users
# below; re-mirror when that render changes, and re-run
# `npm test -- livebus` against it. The app users here are a dev convenience
# for seeding; the install's deny-by-default lists are the real ones.
#
# PLAYGROUND POSTURE, stated out loud: static plaintext credentials, plain ws,
# no TLS, localhost only. Production terminates TLS in front of the bus or
# keeps the listener off; nothing here is the product's auth story.
#
# Run:  nats-server -c dev/nats.conf
port: 4222
http: 8222

websocket {
  port: 9222
  no_tls: true
  # Defense in depth, not a boundary: Origin is browser-asserted and any
  # non-browser client omits it entirely. The boundary is the grant list
  # below. Vite is pinned to 5173 (vite.config.ts) so this list matches.
  allowed_origins: ["http://localhost:5173", "http://127.0.0.1:5173"]
}

jetstream {
  store_dir: /tmp/a2a-web-dev-js
}

accounts {
  APP: {
    jetstream: enabled
    users = [
      {
        # seed: provisions streams and publishes the replayed beat. Dev-only
        # convenience breadth, like the install's seed user.
        user: seed
        password: "dev-seed"
        permissions {
          publish {
            allow = [ "a2a.>", "$JS.API.>", "$JS.ACK.>", "$JS.FC.>", "_INBOX.seed.>" ]
            # a2a.topics.shared.probe is the refusal test's target and has NO
            # writer anywhere on the install, where every grant is enumerated
            # and simply omits it. Here the seed user's wildcard would cover
            # it, so it is denied explicitly — otherwise this bus would be
            # missing the property the install has, and a dev run could not
            # tell a working probe from a broken one.
            deny = [ "a2a.topics.shared.probe" ]
          }
          subscribe { allow = [ "a2a.>", "_INBOX.seed.>" ] }
        }
      }
      {
        # web: byte-for-byte the install's read surface. Subscribe-everything,
        # publish-nothing beyond the JetStream read API, enumerated per stream
        # so a wildcard cannot reach the KV buckets' own streams. No
        # $JS.ACK.> (ordered consumers ack none, and the grant would let a
        # browser +TERM another reader's in-flight message), no $JS.FC.>
        # (flow control is push-only), no NAMES/LIST, no DELETE.
        user: web
        password: "dev-web"
        permissions {
          publish { allow = [
            "$JS.API.INFO",
            "$JS.API.STREAM.INFO.TASKS",
            "$JS.API.STREAM.INFO.DIRECTORY",
            "$JS.API.STREAM.INFO.TOPICS-STATE",
            "$JS.API.STREAM.INFO.TOPICS-JOURNAL",
            "$JS.API.CONSUMER.CREATE.TASKS.>",
            "$JS.API.CONSUMER.CREATE.DIRECTORY.>",
            "$JS.API.CONSUMER.CREATE.TOPICS-STATE.>",
            "$JS.API.CONSUMER.CREATE.TOPICS-JOURNAL.>",
            "$JS.API.CONSUMER.INFO.TASKS.*",
            "$JS.API.CONSUMER.INFO.DIRECTORY.*",
            "$JS.API.CONSUMER.INFO.TOPICS-STATE.*",
            "$JS.API.CONSUMER.INFO.TOPICS-JOURNAL.*",
            "$JS.API.CONSUMER.MSG.NEXT.TASKS.*",
            "$JS.API.CONSUMER.MSG.NEXT.DIRECTORY.*",
            "$JS.API.CONSUMER.MSG.NEXT.TOPICS-STATE.*",
            "$JS.API.CONSUMER.MSG.NEXT.TOPICS-JOURNAL.*",
            "_INBOX.web.>"
          ] }
          subscribe { allow = [
            "a2a.>",
            "_INBOX.web.>"
          ] }
        }
      }
      {
        # console: the web console's credential, mirrored from the operator's
        # consoleIdentity(): web's read surface plus one publish,
        # chat.console.*.in. No verb on any KV_* stream: STREAM.INFO's
        # subjects_filter body would list every key.
        user: console
        password: "dev-console"
        permissions {
          publish { allow = [
            "$JS.API.INFO",
            "$JS.API.STREAM.INFO.TASKS",
            "$JS.API.STREAM.INFO.DIRECTORY",
            "$JS.API.STREAM.INFO.TOPICS-STATE",
            "$JS.API.STREAM.INFO.TOPICS-JOURNAL",
            "$JS.API.CONSUMER.CREATE.TASKS.>",
            "$JS.API.CONSUMER.CREATE.DIRECTORY.>",
            "$JS.API.CONSUMER.CREATE.TOPICS-STATE.>",
            "$JS.API.CONSUMER.CREATE.TOPICS-JOURNAL.>",
            "$JS.API.CONSUMER.INFO.TASKS.*",
            "$JS.API.CONSUMER.INFO.DIRECTORY.*",
            "$JS.API.CONSUMER.INFO.TOPICS-STATE.*",
            "$JS.API.CONSUMER.INFO.TOPICS-JOURNAL.*",
            "$JS.API.CONSUMER.MSG.NEXT.TASKS.*",
            "$JS.API.CONSUMER.MSG.NEXT.DIRECTORY.*",
            "$JS.API.CONSUMER.MSG.NEXT.TOPICS-STATE.*",
            "$JS.API.CONSUMER.MSG.NEXT.TOPICS-JOURNAL.*",
            "chat.console.*.in",
            "_INBOX.console.>"
          ] }
          subscribe { allow = [
            "a2a.>",
            "chat.console.*.out",
            "_INBOX.console.>"
          ] }
        }
      }
      {
        # gateway: enough of the install's gateway grants to run a local
        # gateway binary against this bus for the console door (the task
        # plane, the session registry, the console pair). Dev breadth on
        # the JetStream API; the install enumerates.
        user: gateway
        password: "dev-gateway"
        permissions {
          publish { allow = [ "a2a.tasks.*.*.in", "a2a.tasks.*.*.supervisor", "$KV.session-state.>", "chat.console.*.out", "$JS.API.>", "$JS.ACK.TASKS.>", "$JS.FC.>", "_INBOX.gateway.>" ] }
          subscribe { allow = [ "a2a.tasks.*.*.events", "a2a.tasks.*.*.supervisor", "a2a.agents.>", "$KV.session-state.>", "chat.console.*.in", "_INBOX.gateway.>" ] }
        }
      }
    ]
  }
}
