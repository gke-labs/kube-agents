[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kube-agents-bench"
version = "0.1.0"
description = "devops-bench agent harness for the kube-agents platform agent"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    # No PyPI release yet -- pin a kubernetes-sigs/devops-bench git SHA.
    # Bump the SHA deliberately; the eval harness contract is the pin.
    #
    # BLOCKED: this must be the merge commit of both
    #   kubernetes-sigs/devops-bench#48 (agent entry-point discovery)
    #   kubernetes-sigs/devops-bench#49 (BENCH_TF_ROOT override)
    # before this PR merges. Bumping it requires re-running `uv lock`.
    "devops-bench @ git+https://github.com/kubernetes-sigs/devops-bench@bef4468894593e76506685fafc7790cae3975d9d",
]

# The sole registration path. devops-bench scans this group lazily on the first
# unresolved agent lookup, so `devops-bench --agent-type kubeagents` works with
# no import of this package anywhere in the invocation -- which is what makes
# the two repos independently shippable. Requires devops-bench#48.
[project.entry-points."devops_bench.agents"]
kubeagents = "kube_agents_bench.harness:KubeAgentsHarness"

# Required for the git-URL dependency pin above.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["kube_agents_bench"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

# Pin the index explicitly so a machine-wide default (a corporate mirror, an
# internal proxy) cannot leak unreachable URLs into uv.lock. Without this, a
# `uv lock` run inherits whatever default the host is configured with and the
# committed lock stops resolving for everyone else.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
