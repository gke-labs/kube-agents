[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kube-agents-bench"
version = "0.1.0"
description = "devops-bench agent harness for the kube-agents platform agent"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    # No PyPI release yet -- pin a kubernetes-sigs/devops-bench git SHA.
    # Bump the SHA deliberately; the eval harness contract is the pin.
    # Carries #48 (agent entry-point discovery) and #49 (BENCH_TF_ROOT), which
    # this harness requires, plus #47's deterministic verification -- the
    # `resource_property` verifier the upstream tasks score with.
    "devops-bench @ git+https://github.com/kubernetes-sigs/devops-bench@4670d76dcc497e8f515d51c2bb6bad6ced7100b6",
    # Runtime, not test-only, since `bench-gate` landed: the gate parses
    # task.yaml itself (kube_agents_bench/cases.py) to decide a case's
    # deployer, whether it declares checks, and whether it is expected-fail.
    # The HARNESS still never parses one -- devops-bench has already done that
    # by the time it is called -- so the `dev` group's note below still holds
    # for the reason it was written.
    "pyyaml>=6.0",
]

# The presubmit's verdict, so `hack/ci-eval-pr.sh` can call a tested module
# instead of an inline `python3 -c` heredoc.
[project.scripts]
bench-gate = "kube_agents_bench.gate:main"

# The sole registration path. devops-bench scans this group lazily on the first
# unresolved agent lookup, so `devops-bench --agent-type kubeagents` works with
# no import of this package anywhere in the invocation -- which is what makes
# the two repos independently shippable.
[project.entry-points."devops_bench.agents"]
kubeagents = "kube_agents_bench.harness:KubeAgentsHarness"

# Same mechanism, the verifier registry: devops-bench scans this group on the
# first unresolved verifier lookup, so a task.yaml can name these check types
# without devops-bench ever importing this package by hand. Three of them read
# the per-run transcript stash (kube_agents_bench/transcript.py), which is what
# makes report-text, tool-trace and published-artifact checks possible without
# an upstream change; fleet_resource_property reads cluster state, but the
# cluster of a seeded-fleet fixture ROLE rather than the ambient one.
#
# A key already in the registry when the scan runs is SKIPPED (see
# devops_bench.core.registry), and upstream registers `resource_property` at
# import of devops_bench.verification.verifiers -- so this group cannot be used
# to override an upstream type, only to add one. Hence a distinct name rather
# than a drop-in replacement.
[project.entry-points."devops_bench.verifiers"]
fleet_resource_property = "kube_agents_bench.verifiers:FleetResourcePropertyVerifier"
ledger_issue_contains = "kube_agents_bench.verifiers:LedgerIssueContainsVerifier"
report_contains = "kube_agents_bench.verifiers:ReportContainsVerifier"
tool_called = "kube_agents_bench.verifiers:ToolCalledVerifier"

# Required for the git-URL dependency pin above.
[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "fastapi>=0.116,<1",
    "pytest>=8.0.0",
    # Test-only, and deliberately not a runtime dependency: the harness never
    # parses a task.yaml itself -- devops-bench does, before this package is
    # imported. The roster-collision sweep in tests/test_verifiers.py and the
    # fleet catalog-drift sweep in tests/test_fleet_verifier.py both read every
    # task spec directly, so the parser rides with the test runner.
    # `make test-bench-deps` installs the same thing for CI, which does not
    # use this group; keep the two in step.
    "pyyaml>=6.0",
    "uvicorn>=0.35,<1",
]

# Pin the index explicitly so a machine-wide default (a corporate mirror, an
# internal proxy) cannot leak into resolution -- `uv sync` on any machine
# resolves against public PyPI regardless of host-level uv configuration.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
