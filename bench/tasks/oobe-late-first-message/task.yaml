# Domain: fleet audits. Journey: a fresh install nobody has spoken to runs its four first-run
# audits, and the person who installed it sends the bot a first message only after all four have
# ended.
#
# Each audit posts its summary to the home channel, and a fresh install has none until the first
# message sets it (the bootstrap_onboarding plugin). So every summary is refused by the chat relay,
# its run records delivery_outcome=failed, and nothing posts it later. The report the `oobe` job's
# delivery stage (agents/chat/scripts/bootstrap_delivery.py) sends on that first message is the
# first thing the person reads, and it has to carry what the audits found: each audit whose summary
# was never posted, with the ledger link from its run's final message. Epic #1866's baseline run 1
# lost all four summaries this way.
#
# Nothing in a conversation drives this. bench/tf/prebuilt/oobe-late-first-message takes away the
# home channel (config.yaml and .env) and the delivery markers, arms the oobe stage with
# oobe-first-run-audits' arm.py, waits for the four audits to end, plants a stand-in onboarding
# report on the shell sandbox and touches `.user_aligned` as the plugin does on a first message,
# then waits for the delivery to claim the report. The verifier reads the saved `oobe` run that
# delivered it, and each audit's last run since the arm with its delivery outcome and the ledger
# link in its saved final message. The prompt asks for nothing; the grade comes from the stack.
#
# Isolation class: writes to the install under test. It replaces config.yaml and .env without the
# home channel for the run and puts both back byte for byte, with `.user_aligned`,
# `.bootstrap_completed`, the oobe markers and the sandbox's INVENTORY.delivered.md. A change
# another writer makes to config.yaml or .env during the run is lost at the restore. It refuses an
# install whose CR sets a homeChannel, and one whose oobe job is bound to a chat. The four audits
# are real runs: each writes its ledger issue in the install's GitOps repository, and none posts
# to chat. The runner holds their streams' locks for the unit (`audit_streams` below). It does not
# hold the infra lock (hack/ci-eval-pr.sh, infra_lock_exempt): the stack touches no task cluster
# and reaches the install through a kubeconfig of its own. The onboarding state lock
# (unit_state_lock) keeps it apart from the other cases that rewrite the onboarding markers.
# Eligible tier: nightly -- the four audits run one after another before the first message.
---
id: oobe-late-first-message
name: The first report carries the audit summaries that ended before anyone opened the chat

fixtures: []

infrastructure:
  deployer: "tofu"
  provider: "gcp"
  stack: "prebuilt/oobe-late-first-message"
  teardown: true
  # host_cluster_* arrive from the environment (TF_VAR_host_cluster_name /
  # TF_VAR_host_cluster_location, exported by hack/ci-eval-pr.sh).

validated: false

# Slug per docs/designs/domains.yaml: what the report carries is the fleet audits' results.
domain: fleet-audits

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: maintainers

audit_streams:
  [
    fleet-wide-cost-analysis,
    compliance-audit,
    obtainability-audit,
    stockout-prevention,
  ]

# The turn needs no tool call, so the liveness rung takes the reply as the evidence the agent ran.
tool_calls_optional: true

prompt: |
  In one or two sentences, say what you do on this install. Answer from what you
  already know: do not call any tool, and do not run, trigger or schedule
  anything.
expected_output: |
  critical requirements:
  - A one- or two-sentence description of the agent's role, with no tool call.
  - No job is run, triggered or scheduled.

verification_spec:
  # Reads the stacks' state files, the Platform Agent's cron/executions.db and saved runs, and the
  # default profile's saved oobe runs in the agent pod (kube_agents_bench/oobe_late.py).
  - name: late-report-carries-audit-summaries
    role: objective
    check:
      type: oobe_late_report
  # The turn must not start an audit itself: a run it started would be graded as the stage's.
  - name: turn-starts-no-job
    role: safeguard
    severity: catastrophic
    mode: assert
    check:
      type: none
      checks:
        - type: tool_called
          tool_names: ["kanban_create"]
