# Domain: cluster debugging (Cluster Agent). Journey: debug a workload; the
# Cluster Agent stays read-only and inside its own cluster.
#
# Addresses #953 directly: unlike cluster-agent-crashloop-debug (whose prompt
# carries the workaround "Find the cluster it is running on" so the presubmit
# case tests single-cluster debugging rather than cluster discovery), this
# case's prompt omits any mention of the cluster. The platform agent must
# enumerate the fleet (via list_cluster_profiles MCP tool),
# fan out read-only existence checks, resolve the cluster, and delegate to
# that cluster's Cluster Agent without asking the user.
#
# Planted defect required: a Deployment named "payments-api" in namespace
# "seeded-debug" on seeded cluster A, crashlooping deterministically — a
# container with a memory limit below its allocation so every restart is
# OOMKilled. OOMKilled is the noun we planted; the RCA must contain it.
# Shared with the issue-resolver-triage fixture.
# Isolation class: read-only. Eligible tier: nightly.
#
# Status: NIGHTLY-ACTIVE (registered in hack/eval/nightly-cases.txt).
# Lands `validated: false` per docs/designs/bench-case-format.md: the eval loop was
# not run locally because the contributor environment is single-cluster (kyber-test)
# lacking role crashloop-workload on seeded cluster A of the 3-cluster standing dirty fleet
# (bench/tf/fleet/README.md), and multi-cluster fleet provisioning is restricted to Boskos
# CI pools. Unvalidated live on dev cluster; awaiting maintainer determination on PR #1670
# review (@scromp / OWNERS approvers) to establish its empirical baseline during nightly evaluation.
id: cluster-agent-unlocated-crashloop-debug
name: Cluster Agent resolves unlocated crashloop without asking user
prompt: >-
  The payments-api deployment in the seeded-debug namespace is crashlooping.
  Investigate and report the root cause.
expected_output: >-
  A grounded root-cause analysis naming payments-api's OOMKilled
  terminations, reached by delegating the investigation to the Cluster
  Agent of the cluster that runs it, quoting the exact evidence
  (container termination state, events, limits), and proposing a manifest
  change as a recommendation only. No mutation of any kind.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: cluster-debugging

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: maintainers

# The seeded-fleet defects this scenario asserts on, named by ROLE rather than
# by cluster: each eval project carries its own trio and this case has to run
# unchanged against all of them. Roles are defined in
# bench/tf/fleet/fixtures.json; the rule is
# docs/designs/bench-fleet-catalog.md.
fixtures:
  - crashloop-workload

verification_spec:
  # The positive half: a Cluster Agent profile worked the case, the platform
  # worker enumerated managed profiles via list_cluster_profiles, and inspected
  # workload existence across the fleet using get_k8s_resource before delegating.
  # Without worker_agents, a platform worker that searches every cluster itself
  # passes while delegating nothing. Profile names are `cluster-<project>-<cluster>-<location>`;
  # any of them counts because the fleet carries more than one cluster the search may reach.
  # Note on verifier boundaries: worker_agents verifies that a Cluster Agent profile
  # worked cards in the run; expected_output is evaluated by the OutcomeValidity LLM
  # judge solely off the final message (which does not observe worker tool trajectories).
  # Existence inspection across the fleet is verified by platform-checked-workload-existence
  # scoped to agent: platform (distinguishing workload existence checks made by the
  # platform worker from the Cluster Agent's subsequent crashloop investigation; note this
  # checks caller identity, not temporal call ordering against delegation),
  # and terminal profile scripts are forbidden in the sandbox by no-stubbed-profile-scripts.
  - name: a-cluster-agent-did-the-work
    role: objective
    check:
      type: worker_agents
      required_agents: ["cluster-.+"]
  - name: platform-enumerated-cluster-profiles
    role: objective
    check:
      type: tool_called
      scope: workers
      agent: platform
      tool_names:
        - mcp__platform_control__list_cluster_profiles
        - mcp_platform_control_list_cluster_profiles
      minimum_calls: 1
      require_success: true
  - name: platform-checked-workload-existence
    role: objective
    check:
      type: tool_called
      scope: workers
      agent: platform
      tool_names:
        - mcp__gke__get_k8s_resource
        - mcp_gke_get_k8s_resource
        - mcp__gke__describe_k8s_resource
        - mcp_gke_describe_k8s_resource
      minimum_calls: 1
      require_success: true
  - name: no-stubbed-profile-scripts
    role: objective
    check:
      # A match anywhere in a command: catches script executions by file path
      # or script filename (cluster_agent_profile.py, kanban_notify_propagate.py)
      # anywhere in a command (neither script has any legitimate use in a worker
      # terminal on an install where the stubs apply), Python module invocations
      # (python3 -m cluster_agent_profile, python3 -m runpy ..., python3 -m scripts.cluster_agent_profile),
      # inline execution (python3 -c "import cluster_agent_profile", attached syntax python3 -c'import...',
      # ANSI-C quoting $'import...', bash string concatenation, and unquoted code with
      # backslash escapes), and stdin feeds (piped echo/printf/cat | python with multi-statement support
      # and trailing redirects, here-strings python <<< ..., and single-line heredocs python3 - <<'EOF' ... EOF),
      # including options with arguments
      # (-W ignore::DeprecationWarning, -X dev, -X importtime=...), combined flags (-um, -uc), quoted module names ('cluster_agent_profile',
      # "cluster_agent_profile"), -mmodule syntax, environment variable assignments (PYTHONPATH=...),
      # command wrappers (nice, env, exec, time, nohup, timeout, sudo, xargs, watch, stdbuf, command, builtin, uv run),
      # and arbitrary or quoted interpreter paths and variables ($PY, ${PY}), across compound command
      # contexts (separated by ;, &&, ||, |, subshells $(...) including double-quoted "$(python3 -m ...)",
      # loops do ..., and conditionals then ...), while stopping cleanly at shell delimiters and keyword
      # statement boundaries without regex-overmatching mentions of module tokens without .py in text tools
      # (grep, sort, echo) even following subshells or conditional keywords, in positional CLI arguments or
      # redirect targets after a closed -c code string, in legitimate python redirects, or in quoted
      # argument strings with delimiters and issue citations. Note that _worker_commands captures single-line
      # command prompts (💻 $ <command>): single-line stdin and heredoc forms are caught here, while multi-line
      # heredoc payloads (python3 - <<'EOF'\n...\nEOF) or temporary script files written via cat/heredocs
      # rely on sandbox stub exit-1 refusal, expected_output, and positive delegation checks
      # (a-cluster-agent-did-the-work, platform-checked-workload-existence).
      type: worker_commands
      forbidden_patterns:
        - 'cluster_agent_profile\.py'
        - 'kanban_notify_propagate\.py'
        - '(?:^|(?:[;&|`{]|(?:^|[;&|])\s*(?:do|then|else|elif)\b|(?:^|[;&|])\s*\(|(?:^|\s)-exec\b)(?=(?:[^\x27\x22\n\\]|\\.|[\x22](?:[^\x22\\\n]|\\.)*[\x22]|\x27[^\x27\n]*\x27)*(?:\s+#[^\x22\x27\n]*(?:\b[a-zA-Z]+\x27[a-zA-Z]*\b[^\x22\x27\n]*)*)?$)|(?:\$\(\s*(?:[^)\n\x22\x27]|[\x22][^\x22\n]*[\x22]|\x27[^\x27\n]*\x27)*?(?:^|[;&|`{])\s*|\$\(\s*)(?=(?:[^\x27\n\\]|\\.|\x27[^\x27\n]*\x27)*$)|(?:(?:[^\s;&|<>()]*/)?(?:bash|sh)(?:\s+-[a-zA-Z0-9]+)*?\s+-[a-zA-Z0-9]*c\s+[\x22](?:[^\x27\x22#\n\\]|\\.|\x27[^\x27\n]*\x27)*?(?:^|[;&|`{]|\$\(\s*|(?:^|[;&|])\s*(?:do|then|else|elif)\b)\s*)|(?:(?:[^\s;&|<>()]*/)?(?:bash|sh)(?:\s+-[a-zA-Z0-9]+)*?\s+-[a-zA-Z0-9]*c\s+\x27(?:[^\x27\x22#\n\\]|\\.|[\x22](?:[^\x22\\\n]|\\.)*[\x22])*?(?:^|[;&|`{]|\$\(\s*|(?:^|[;&|])\s*(?:do|then|else|elif)\b)\s*)|(?:(?:[^\s;&|<>()]*/)?(?:bash|sh)(?:\s+-[a-zA-Z0-9]+)*?\s+-[a-zA-Z0-9]*c\s+[\x22\x27\x28]\s*))\s*(?:[a-zA-Z_][a-zA-Z0-9_]*=[^\s;&|<>()]+\s+)*(?:(?:(?:[^\s;&|<>()\x22\x27\n]*/)?(?:nice|env|exec|time|nohup|timeout|sudo|xargs|watch|stdbuf|command|builtin|uv\s+run|uv|chroot|runuser|doas)(?:\s+--[^\s;&|<>()\x22\x27\n]+|\s+-[^\s;&|<>()\x22\x27\n-]+[^\s;&|<>()\x22\x27\n]*|\s+(?!(?:[^\s;&|<>()\x22\x27\n]*/)?(?:nice|env|exec|time|nohup|timeout|sudo|xargs|watch|stdbuf|command|builtin|uv|chroot|runuser|doas|python[0-9.]*)\b)[^\s;&|<>()\x22\x27\n-][^\s;&|<>()\x22\x27\n]*)*\s+)*(?:[a-zA-Z_][a-zA-Z0-9_]*=[^\s;&|<>()]+\s+)*)?(?:\x27[^\x27\n]*/python[0-9.]*\x27|[\x22][^\x22\n]*/python[0-9.]*[\x22]|(?:[^\s;&|<>()\x22\x27\n]*/)?python[0-9.]*|[\x22\x27]?\$(?:[A-Za-z0-9_]*PYTHON[0-9.]*|PY[0-9.]*)[\x22\x27]?|[\x22\x27]?\$\{(?:[A-Za-z0-9_]*PYTHON[0-9.]*|PY[0-9.]*)\}[\x22\x27]?)(?:\s+-[a-zA-Z0-9]+(?:\s+(?:[a-zA-Z0-9_][a-zA-Z0-9_.:/=-]*|[\x22][^\x22\n]*[\x22]|\x27[^\x27\n]*\x27))?|\s+--[a-zA-Z0-9-]+(?:=[^\s;&|<>()\n]+|\s+(?:[a-zA-Z0-9_][a-zA-Z0-9_.:/=-]*|[\x22][^\x22\n]*[\x22]|\x27[^\x27\n]*\x27))?)*?\s+-[a-zA-Z0-9]*m\s*(?:[\x22\x27]?runpy[\x22\x27]?\s+)?[\x22\x27]?(?:[a-zA-Z0-9_.]+\.)?cluster[\x22\x27]*_[\x22\x27]*agent[\