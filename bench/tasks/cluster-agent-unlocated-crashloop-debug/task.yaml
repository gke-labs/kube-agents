        - '(?:^|(?:[;&|`{]|(?:^|[;&|])\s*(?:do|then|else|elif)\b|(?:^|[;&|])\s*\(|(?:^|\s)-exec\b)(?=(?:[^\x27\x22\n\\]|\\.|[\x22](?:[^\x22\\\n]|\\.)*[\x22]|\x27[^\x27\n]*\x27)*(?:\s+#[^\x22\x27\n]*(?:\b[a-zA-Z]+\x27[a-zA-Z]*\b[^\x22\x27\n]*)*)?$)|(?:\$\(\s*(?:[^)\n\x22\x27]|[\x22][^\x22\n]*[\x22]|\x27[^\x27\n]*\x27)*?(?:^|[;&|`{])\s*|\$\(\s*)(?=(?:[^\x27\n\\]|\\.|\x27[^\x27\n]*\x27)*$)|(?:(?:[^\s;&|<>()]*/)?(?:bash|sh)(?:\s+-[a-zA-Z0-9]+)*?\s+-[a-zA-Z0-9]*c\s+[\x22](?:[^\x27\x22#\n\\]|\\.|\x27[^\x27\n]*\x27)*?(?:^|[;&|`{]|\$\(\s*|(?:^|[;&|])\s*(?:do|then|else|elif)\b)\s*)|(?:(?:[^\s;&|<>()]*/)?(?:bash|sh)(?:\s+-[a-zA-Z0-9]+)*?\s+-[a-zA-Z0-9]*c\s+\x27(?:[^\x27\x22#\n\\]|\\.|[\x22](?:[^\x22\\\n]|\\.)*[\x22])*?(?:^|[;&|`{]|\$\(\s*|(?:^|[;&|])\s*(?:do|then|else|elif)\b)\s*)|(?:(?:[^\s;&|<>()]*/)?(?:bash|sh)(?:\s+-[a-zA-Z0-9]+)*?\s+-[a-zA-Z0-9]*c\s+[\x22\x27\x28]\s*))\s*(?:[a-zA-Z_][a-zA-Z0-9_]*=[^\s;&|<>()]+\s+)*(?:(?:(?:[^\s;&|<>()\x22\x27\n]*/)?(?:nice|env|exec|time|nohup|timeout|sudo|xargs|watch|stdbuf|command|builtin|uv\s+run|uv|chroot|runuser|doas)(?:\s+--[^\s;&|<>()\x22\x27\n]+|\s+-[^\s;&|<>()\x22\x27\n-]+[^\s;&|<>()\x22\x27\n]*|\s+(?!(?:[^\s;&|<>()\x22\x27\n]*/)?(?:nice|env|exec|time|nohup|timeout|sudo|xargs|watch|stdbuf|command|builtin|uv|chroot|runuser|doas|python[0-9.]*)\b)[^\s;&|<>()\x22\x27\n-][^\s;&|<>()\x22\x27\n]*)*\s+)*(?:[a-zA-Z_][a-zA-Z0-9_]*=[^\s;&|<>()]+\s+)*)?(?:\x27[^\x27\n]*/python[0-9.]*\x27|[\x22][^\x22\n]*/python[0-9.]*[\x22]|(?:[^\s;&|<>()\x22\x27\n]*/)?python[0-9.]*|[\x22\x27]?\$(?:[A-Za-z0-9_]*PYTHON[0-9.]*|PY[0-9.]*)[\x22\x27]?|[\x22\x27]?\$\{(?:[A-Za-z0-9_]*PYTHON[0-9.]*|PY[0-9.]*)\}[\x22\x27]?)(?:\s+-[a-zA-Z0-9]+(?:\s+(?:[a-zA-Z0-9_][a-zA-Z0-9_.:/=-]*|[\x22][^\x22\n]*[\x22]|\x27[^\x27\n]*\x27))?|\s+--[a-zA-Z0-9-]+(?:=[^\s;&|<>()\n]+|\s+(?:[a-zA-Z0-9_][a-zA-Z0-9_.:/=-]*|[\x22][^\x22\n]*[\x22]|\x27[^\x27\n]*\x27))?)*?\s+-[a-zA-Z0-9]*m\s*(?:[\x22\x27]?runpy[\x22\x27]?\s+)?[\x22\x27]?(?:[a-zA-Z0-9_.]+\.)?kanban[\x22\x27]*_[\x22\x27]*notify[\