# A target patch the channel has withdrawn, or a running patch the channel has moved past (catalogue entry 10's version side).
#
# The rule reads a condition that cannot be planted on a healthy seeded cluster
# (the channel default the report targets is valid by construction, and which patches a channel lists is the provider's), so this case does not grade a detection: it grades the
# rule's declared report line for every seeded cluster in its "no finding" form,
# which is red on `main` (no rule prints such a line, and an agent cannot
# invent the numbers it carries) and green once the rule prints it; the rule's
# unit tests (scripts/test_readiness_rules.py) carry the positive detection on
# recorded inputs. The prompt asks for one declared line per seeded cluster in
# a fixed vocabulary copied from the rule's note in the report's note column
# (`<rule id>: <the rule's text>`) and its JSON (`readiness.notes`); the
# deterministic objectives read those lines and nothing else, the prose is the
# judge's.
#
# The patterns name the slots through `{cluster:<slot>}`, which the verifier
# expands to the cluster the runner recorded for the slot, so a fleet applied
# with another prefix is graded on its own names.
#
# Isolation class: read-only (chat prompt; the script reads with gcloud
# container, gcloud compute and kubectl get and writes only its own record and
# per-member kubeconfig files). Eligible tier: nightly from its first merge.
#
# No deterministic mutation safeguard, documented: nothing is planted for this
# case; the four roles below stand for their slots, so the declared-line
# objectives can tell a cluster the agent missed from a cluster the project
# does not have. No `worker_commands` objective either: it reads delegated
# workers' terminals only and errors on a run the router answered itself, so
# the report's own output is graded through the declared lines instead.
id: upgrades-readiness-target-patch-valid
name: Upgrade readiness re-reads the target patch against the channel's valid versions on every cluster

prompt: >-
  For every cluster in this project, run the upgrade readiness check against each cluster's release channel default and include, per cluster, its release channel, whether the target version is among the channel's valid versions at the cluster's location (valid) or not (withdrawn), and whether the running control-plane version is still listed there (listed or not listed), as the target-patch-valid rule's note in the report's note column or its JSON states them. Read only; change and upgrade nothing. A member may be blocked or carry
  risks from other rules on the same report; the slots are about this rule
  only. End your answer with one line per seeded cluster in exactly this
  form, no other words on the line: "<cluster>: target-patch-valid: channel <channel>; target <version> <valid|withdrawn>; control plane <version> <listed|not listed>".

expected_output: >-
  The version table and the readiness table read during this run, with every seeded cluster on the REGULAR channel, its target (the channel default) valid at its location, and its running control-plane version either listed in the channel's validVersions or, for the held-back cluster, not listed (the channel has moved past it, which the rule files as a risk naming the next active version). The answer says what a withdrawn target would mean (a node pool upgrade to it fails on an image the provider no longer serves; target the newest active patch) and that no target is withdrawn. It ends with the declared lines, each reading "target-patch-valid: channel REGULAR; target <version> valid; control plane <version> listed|not listed" copied from the report. It cites no CVE identifiers and performs no upgrade.

infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: upgrades

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: haoxuw

# No planted defect is read: the four roles are one per slot, and they are how the
# declared-line objectives tell a cluster the agent missed from a cluster the
# project does not have.
fixtures:
  - crashloop-workload
  - version-laggard
  - drift-outlier
  - zonal-skew-scheduling

verification_spec:
  # One line per seeded cluster, fixed vocabulary, the cluster named at the
  # start of the line; every pattern matches the whole declared frame, anchored
  # at both ends, with the line's decoration folded first.
  # The frame every cluster must satisfy, all three slots included.
  - name: every-seeded-cluster-has-a-declared-line
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - crashloop-workload
        - version-laggard
        - drift-outlier
        - zonal-skew-scheduling
      any_of_patterns:
        - '(?ms)\A(?=.*^{cluster:a}(?:\s*\([^)\n]*\))?: target-patch-valid: channel [^;\n]+; target [^;\n]+; control plane [^\n]+$)(?=.*^{cluster:b}(?:\s*\([^)\n]*\))?: target-patch-valid: channel [^;\n]+; target [^;\n]+; control plane [^\n]+$)(?=.*^{cluster:c}(?:\s*\([^)\n]*\))?: target-patch-valid: channel [^;\n]+; target [^;\n]+; control plane [^\n]+$)(?=.*^{cluster:d}(?:\s*\([^)\n]*\))?: target-patch-valid: channel [^;\n]+; target [^;\n]+; control plane [^\n]+$)'
  # Every seeded cluster is on REGULAR and its target, the channel default, is valid: a
  # withdrawn target here is a wrong read, not a finding.
  - name: the-declared-lines-find-the-target-valid-on-the-regular-channel
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - crashloop-workload
        - version-laggard
        - drift-outlier
        - zonal-skew-scheduling
      any_of_patterns:
        - '(?m)^{cluster:any}(?:\s*\([^)\n]*\))?: target-patch-valid: channel regular; target \d[^ ;\n]* valid; control plane \d[^ ;\n]* (?:listed|not listed)$'
      forbidden_patterns:
        - '(?m)^{cluster:any}(?:\s*\([^)\n]*\))?: target-patch-valid: channel [^;\n]+; target [^;\n]+ withdrawn; control plane [^\n]+$'
        - '(?m)^{cluster:any}(?:\s*\([^)\n]*\))?: target-patch-valid: channel (?!regular;)[^;\n]+; target [^\n]+$'

  - name: no-invented-cves
    role: objective
    mode: assert
    check:
      type: report_contains
      # No vulnerability feed; a CVE id in a readiness report is an invention.
      forbidden_phrases: ["CVE-"]
