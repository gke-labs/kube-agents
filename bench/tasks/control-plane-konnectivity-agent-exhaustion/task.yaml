# Control plane, setup, cost and CLI (gce-compute-fleet-audit): a cluster runs
# fewer konnectivity-agent replicas than GKE's size table gives, and
# control-plane-to-node calls (logs, exec, webhooks, the metrics API) fail. A
# declared gap: expected_fail until the check lands (gke-labs/kube-agents#5415,
# which proposes `konnectivity-agent-exhaustion`).
# What live tests showed (2026-11-20, one scratch cluster, GKE Standard 1.35.8,
# 1 agent against GKE's 6): on Standard a hand edit of the ConfigMap
# `konnectivity-agent-autoscaler-config` stays and the agent count follows it;
# a hand scale of the Deployment is undone; on a second cluster, Autopilot
# 1.36.4, a server-side dry run of the same edit was refused. With free CPU, 1
# agent carried heavy use with no error. With each node's CPU full under heavy
# use, the tunnel went dead with 1 agent until its pod was replaced, while the
# pod read Running and ready: one clean run and one on a node that had been
# crashed before; the cause is not known, and the run with 6 agents had another
# timing of the load. A hard restart of the one agent's node failed
# webhook-guarded writes for 35 seconds, and none with 6 agents (one run each).
# The agent's container has no CPU limit, so no limit throttles it.
# Nothing is planted. A fixture is possible: the size table set to 1 agent on
# one Standard fleet cluster, which leaves that cluster with the weakness
# above; the fleet's owner has not been asked. Signals that showed the dead
# tunnel and need no tunnel: the APIService `v1beta1.metrics.k8s.io` at
# `FailedDiscoveryCheck`, and the API server's webhook-rejection and egress
# dial-failure counters. The objective below keeps the form of the first plan,
# a finding that names the agent; it changes with the fixture decision.
# `fixtures: []`: the run plants nothing and reads no fixture, so no fixture's
# drift may excuse it; no safeguard reads a fixture because none exists. Domain
# `fleet-audits` as the other GCE compute cases.
# Isolation class: fleet-read-only, GitOps-repo write (the audit's ledger).
id: control-plane-konnectivity-agent-exhaustion
name: "Konnectivity agent count below GKE's size table (declared gap; nothing planted; a fixture waits for the fleet owner's decision)"
domain: fleet-audits
suite: validated-capabilities
suite_part: 2
expected_fail: true
audit_streams:
  - gce-compute-fleet-audit
fixtures: []
prompt: >-
  Run the gce-compute-fleet-audit audit across the fleet, following the
  gce-compute-fleet-audit SOP.
expected_output: >-
  Nothing planted. Customer failure, as live tests showed it: with 1
  konnectivity-agent where GKE's size table gives more, control-plane-to-node
  calls failed on CPU-full nodes under heavy use and for the time of a node
  restart. Validated needs a fixture and a check that names a cluster whose
  agent count is below the table; the ledger issue would then carry a finding on
  Deployment `konnectivity-agent` in namespace `kube-system`. The closing
  response is the SOP's one line with the ledger URL.
infrastructure:
  deployer: noop
validated: false

verification_spec:
  # The form a finding would take; it changes with the fixture decision. The
  # three slugs are the names the case accepts; the first is the one #5415
  # proposes.
  - name: ledger-reports-konnectivity-sizing-on-the-agent
    role: objective
    mode: assert
    check:
      type: ledger_issue_contains
      audit: gce-compute-fleet-audit
      scope: finding
      finding_check:
        [
          "konnectivity-agent-exhaustion",
          "konnectivity-tunnel-saturation",
          "control-plane-konnectivity",
        ]
      any_of_phrases: ["konnectivity-agent"]
