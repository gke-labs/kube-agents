# Domain: cluster debugging. Journey: a cluster-wide "what is failing?"
# question, answered with one scan per cluster, a fast exit where nothing is
# failing, and a root cause where something is (#3181).
#
# What this grades. Before #3181 the Cluster Agent had one workload skill,
# gke-workload-troubleshooting, written for one named workload. Asked about a
# whole cluster, the agent improvised a scan one kubectl command per model turn:
# in the traced benchmark of 2026-10-15 a healthy cluster took 34 commands and
# 561.5s, listed every pod four times, explored kube-system and waited on a new
# node with `sleep 15` loops. #3181 adds workload-triage-scan, which runs
# /opt/data/scripts/workload_triage.py once (pods, controllers and Warning
# events across all namespaces), finishes at once when it ends `unhealthy: 0`
# and `system unhealthy: 0`, and hands each finding to a focused skill
# (pod-crashloop-oom here).
#
# Two halves, both on the seeded fleet:
#
# (a) Fast exit. The prompt uses #3181's failing-workloads question across the
#     seeded clusters. `the-scan-ran-once-per-cluster-question` checks that
#     `workload_triage.py` ran (`required_runs`). Then
#     `the-scan-did-not-poll-or-explore` and `the-clean-scan-was-not-re-checked`
#     scope their checks to the healthy-cluster workers (`seeded-b` and
#     `seeded-c`, `agent: "cluster-.*-seeded-[bc]-.*"`) so they never flag the
#     Platform Agent coordinator card, the worker diagnosing the OOM on
#     `seeded-a`, or `seeded-d`. While structural `WorkerCommandsVerifier`
#     `kubectl` and per-lineage checks are tracked in follow-up #4208, these
#     leaves grade the enumerated command, `execute_code`, and `gke` MCP
#     spellings per worker profile (so a retried or re-carded healthy cluster is
#     graded red too): on `seeded-b` and `seeded-c`, no worker polls or waits
#     (`sleep`, `watch`, `ping`, `read -t`, `tail -f`, `select(undef/None, ...)`,
#     `while`/`until ... do`, `kubectl wait`/`attach`/`port-forward`/`proxy`/
#     `rollout status`, `kubectl -w`/`--watch`, `kubectl logs -f`/`--follow`),
#     fetches credentials (`gcloud ... get-credentials`), explores folded S1
#     system namespaces (`-n`/`ns`/`namespace` or direct references to
#     `kube-system`, `kube-public`, `kube-node-lease`, `gmp-system`,
#     `gmp-public`, `gke-*`, `config-management-*`, `cnrm-system`,
#     `configconnector-operator-system`, `krmapihosting-system`, `istio-system`,
#     `asm-system`, `anthos-identity-service`, `gatekeeper-system`,
#     `composer-system`, or `--include-system`), calls per-object `gke` MCP
#     reads (`get_k8s_resource`, `describe_k8s_resource`, `list_k8s_events`,
#     `get_k8s_logs`, `get_k8s_rollout_status`), exceeds 6 tool calls on the
#     profile (`minimum_calls: 7`), invokes `workload_triage.py` a second time
#     under the enumerated re-scan shapes (direct path, `python -m
#     workload_triage`, single- or double-quoted `python -c` importing
#     `workload_triage`, stdin redirect `< ...workload_triage.py`,
#     `/opt/data/scripts/w*.py` or `workload_*.py` globs, shell-variable
#     indirection `S=...; ... "$S"`, `find ... -exec`/`-execdir`, `eval`,
#     `sh`/`bash`/`dash`/`zsh`/`ksh -c`, `command -p`/`--`, `exec`, `time`,
#     `nohup`, `setsid`, `env`, `sudo`, `timeout`, `nice`, `ionice`, `stdbuf`,
#     `flock`, `xargs`, `for ... do`, or command substitution; unlisted wrappers
#     or arbitrary dynamic shell obfuscation await structural per-profile
#     `forbidden_runs` in #4208), or lists all namespaces with the enumerated
#     `kubectl -A`/`--all-namespaces`/cluster-scoped `--raw /api(s)/...`
#     spellings.
#
# (b) Root-cause depth. seeded-a carries the crashloop-workload fixture:
#     payments-api in seeded-debug is OOMKilled on every start with a 64Mi
#     limit. The answer must still name payments-api and OOMKilled, the same
#     phrases cluster-agent-crashloop-debug requires, so a faster scan that
#     drops the root cause fails here.
#
# RED ON MAIN (observed in `run_20261026_142843_red-main-3191-v4-fleet-health-triage`
# against `main` `3e5be2e0e`): `main` ships no `workload_triage.py`, so
# `the-scan-ran-once-per-cluster-question` fails (0 invocations across 26
# Cluster Agent commands), and `the-scan-did-not-poll-or-explore` and
# `the-clean-scan-was-not-re-checked` fail when the healthy-cluster workers run
# ad-hoc `-A` and `-n kube-system` `kubectl` reads. The depth objective
# (`rca-names-the-oom`) and read-only safeguard pass on `main`, confirming the
# speed-up preserves root-cause depth.
#
# Safeguard: the fixture came out the way it went in. Same check as
# cluster-agent-crashloop-debug.
id: cluster-agent-fleet-health-triage
name: A cluster-wide failing-workloads question scans once, exits fast when healthy, and still finds the OOM
prompt: >-
  What workloads are failing or degraded across the seeded clusters? For
  anything that is failing, tell me why.
expected_output: >-
  Clusters with no failing workload are reported as healthy with pod counts,
  without hitting the enumerated polling, system-namespace, per-object gke MCP,
  or re-scan shapes (direct/module/-c-import/stdin/glob/variable/find-exec/eval/
  allowlisted-exec-wrapper/loop/subshell) on the healthy cluster worker profiles
  (seeded-b and seeded-c).
  On the cluster carrying seeded-debug, payments-api is named as crashlooping
  because its container is OOMKilled against a 64Mi memory limit, with the
  evidence (last termination state, restart count, limit) and a raised limit
  proposed as a recommendation only. Nothing is changed.
infrastructure:
  deployer: noop
validated: false

domain: cluster-debugging

owner: fkc1e100

fixtures:
  - crashloop-workload

verification_spec:
  - name: the-scan-ran-once-per-cluster-question
    role: objective
    mode: assert
    check:
      type: worker_commands
      required_runs:
        - script: workload_triage.py
  - name: the-scan-did-not-poll-or-explore
    role: objective
    mode: assert
    check:
      type: none
      checks:
        - type: tool_called
