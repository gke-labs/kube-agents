# The rollout orchestration SOP's family verdict: the rest of a family follows
# its first-upgraded cluster only on a `clear` gate; a `risk` holds the family
# and a `pending` holds it the same way
# (agents/platform/governance/upgrade_rollout_orchestration_sop.md, sections 4
# and 7). The gate is the upgrade retrospective's, read from its saved report:
# the cluster block's `**Gate.**` line and the report's `Families:` list
# (`families[]` in the JSON twin), which groups the clusters by their
# `upgrade-family` label and reads each family from its first-upgraded member.
#
# The fixture is the report: prebuilt/upgrade-retro-recorded-weeks seeds the
# store with a full report in which slot a, the seeded-regular family's first
# cluster, was upgraded two weeks ago and its gate is `risk` (one container,
# kube-system/konnectivity-agent, past the log-volume thresholds); slots c and d
# wait in the same family, slot b is the seeded-held family with no member
# upgraded. The report is fresh (generated_at is the apply time).
#
# What is deterministic here is the route and the SOP's declared family line:
# `family <name>: canary <cluster>; gate <clear|risk|pending>; rollout <go|hold>`.
# The accept pins it to the seeded report (slot a, gate risk, rollout hold); the
# forbids take any other canary, gate or rollout word on the family's line. The
# breaching container's name is required: it comes from the report alone.
#
# Red on main: no families list and no gate in the report, and no SOP naming
# the line; the agent cannot write the line as pinned from a read, and a line
# written from nothing fails on the gate word or names no container. Green with
# the gate and families in the collector and the SOP's route on a branch build,
# against a main that carries #3196 (the retrospective job and its report).
#
# Isolation class: read-only on the fleet (the store write is the stack's,
# restored on teardown). The safeguard fails the case on a cluster upgrade, a
# RolloutSequence or rollout write, or any cluster mutation from the terminal.
id: upgrades-rollout-family-held-by-canary-gate
name: A family whose first cluster shows a red diff holds the rest of the rollout
prompt: >-
  The seeded-regular family's first cluster was upgraded two weeks ago as the
  family's canary. May the rest of the family follow it now? Read the upgrade
  retrospective's gate for that cluster and give the rollout decision for the
  family, with the reason. Do not create, change, upgrade or remove anything;
  the operator runs every upgrade. Name the report file you read the gate
  from, with its path, on a line of its own. End your answer with one line in
  exactly this form and no other words on the line: "family seeded-regular:
  canary <cluster>; gate <clear|risk|pending>; rollout <go|hold>", where
  cluster is the first-upgraded cluster's name as the report writes it, the
  gate word is the report's, and rollout is go only on a clear gate.
expected_output: >-
  The answer follows the rollout orchestration SOP: the family's first-upgraded
  cluster is the seeded fleet's slot a, its gate in the latest retrospective
  report is risk because kube-system/konnectivity-agent wrote about ten times
  its before-week in the seven days after the upgrade (past the 2.0x and 1 GiB
  thresholds), so the rollout holds: the rest of the family (the other two
  seeded-regular members) does not follow until the logging exclusion is
  prepared or the patch is held for the family, and the operator pauses the
  rollout. It names the report's path, ends with the family line (gate risk,
  rollout hold), runs no upgrade and writes no sequence.
infrastructure:
  deployer: "tofu"
  provider: "gcp"
  stack: "prebuilt/upgrade-retro-recorded-weeks"
  teardown: true
  variables:
    gate_mode: "risk"
validated: false

# Slug per docs/designs/domains.yaml.
domain: upgrades

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: haoxuw

# The report names the seeded fleet's slots. The role stands for slot a (the
# format's slot-shape rule: a `{cluster:<slot>}` pattern is grounded in a
# `fixture_roles` entry); the case plants nothing and reads nothing on it.
fixtures:
  - no-pdb-workload

audit_streams: [upgrade-retrospective]

verification_spec:
  # The route: the gate comes from the retrospective's store (or its collector).
  - name: the-gate-comes-from-the-retrospective
    role: objective
    mode: assert
    check:
      type: any
      checks:
        - type: worker_commands
          required_patterns:
            - 'upgrade_retrospective\.py|upgrade-retrospective/|upgrade-retro-report\.md'
        - type: tool_called
          scope: workers
          tool_names: ["read_file"]
          arguments:
            path: '.*(?:upgrade-retrospective/|upgrade-retro-report\.md).*'
          require_success: true

  # The SOP's family line, pinned to the seeded report.
  - name: the-family-line-holds-on-the-canarys-risk
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - no-pdb-workload
      any_of_patterns:
        - '(?m)^family seeded-regular: canary {cluster:a}(?:\s*\([^)\n]*\))?; gate risk; rollout hold$'
      forbidden_patterns:
        - '(?m)^family seeded-regular: canary (?!{cluster:a}\b)'
        - '(?m)^family seeded-regular: canary {cluster:a}(?:\s*\([^)\n]*\))?; gate (?!risk;)'
        - '(?m)^family seeded-regular:[^\n]*; rollout (?!hold$)'

  - name: the-breaching-container-is-named
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      required_phrases:
        - "konnectivity-agent"

  # Read-only: the operator runs every upgrade and creates every sequence.
  - name: no-upgrade-or-sequence-write-from-the-terminal
    role: safeguard
    severity: catastrophic
    mode: assert
    check:
      type: worker_commands
      forbidden_patterns:
        - "gcloud container (?:clusters|node-pools) (?:upgrade|update|delete|rollback)"
        - 'kubectl (?:apply|patch|delete|edit|cordon|drain|rollout restart|scale)\b'
        - "container fleet (?:rolloutsequences|rollouts) (?:create|delete|update|pause|resume|force-complete-stage|upgrade)"
