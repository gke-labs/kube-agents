# What Flux would render from the HelmRelease and the chart: the live workload
# on the agent's own cluster, carrying the environment variable the request
# asks to remove. Apply it to the agent host once (kubectl apply -f) so the
# agent's read of the cluster matches the GitOps declaration; delete the
# namespace to remove it. No reconciler runs on the eval installs, so the
# HelmRelease in the GitOps repository does not create it.
apiVersion: v1
kind: Namespace
metadata:
  name: demo-shop
---
apiVersion: v1
kind: Secret
metadata:
  name: payments-ledger
  namespace: demo-shop
  labels:
    app.kubernetes.io/name: payments
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: payments
    meta.helm.sh/release-namespace: demo-shop
type: Opaque
stringData:
  legacy_ledger_url: http://ledger-legacy.demo-shop.svc.cluster.local:8080
---
# The decoy from the GitOps repository, as its reconciler would apply it.
# Nothing mounts or references it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-legacy-env
  namespace: demo-shop
data:
  PAYMENTS_LEGACY_LEDGER_URL: http://ledger-legacy.demo-shop.svc.cluster.local:8080
  PAYMENTS_LEGACY_LEDGER_TIMEOUT_SECONDS: "5"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: demo-shop
  labels:
    app.kubernetes.io/name: payments
    app.kubernetes.io/component: api
    app.kubernetes.io/managed-by: Helm
    helm.toolkit.fluxcd.io/name: payments
    helm.toolkit.fluxcd.io/namespace: demo-shop
  annotations:
    meta.helm.sh/release-name: payments
    meta.helm.sh/release-namespace: demo-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payments
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "gcr.io/google-samples/hello-app:1.0"
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PAYMENTS_LEDGER_URL
              value: "http://ledger.demo-shop.svc.cluster.local:8080"
            - name: PAYMENTS_LEGACY_LEDGER_URL
              valueFrom:
                secretKeyRef:
                  name: payments-ledger
                  key: legacy_ledger_url
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: demo-shop
  labels:
    app.kubernetes.io/name: payments
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: payments
    meta.helm.sh/release-namespace: demo-shop
spec:
  selector:
    app.kubernetes.io/name: payments
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
