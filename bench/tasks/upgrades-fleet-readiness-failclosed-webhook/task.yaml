# The webhook source of fleet-upgrade-verification's --readiness table: a fail-closed
# admission webhook whose backend the API server cannot reach. Such a webhook rejects every
# request its rules match. The table grades the member blocked only when those rules reach
# something a node upgrade needs (pods, evictions, nodes, leases); otherwise it names the
# webhook as a current outage without grading on it. The upgrade-scenario campaign
# reproduced the pod-gating form end to end on GKE (the drain's replacement pods refused
# until the webhook was deleted).
#
# The planted gate matches ConfigMaps only, so this case grades the second half: the agent
# must find the webhook and its missing backend unprompted, and must not present it as what
# stops the upgrade -- seeded-b's blockers are its budget and its maintenance exclusion.
#
# The prompt names no webhook, no Service and no namespace, and none of the SOP vocabulary
# the sibling case upgrades-fleet-readiness-exclusion lists: the agent has to find the
# webhook, not confirm it. Graded on the reply, not the tool path: an agent that reads the
# webhook configurations and EndpointSlices any other way and reports the same finding
# passes.
#
# The declared line is what the deterministic checks read, as in the upgrade-scenario
# cases: the prompt asks for one fixed-form line per cluster, each objective below is a
# whole-line pattern anchored at both ends with seeded-b's name bounded on both sides, the
# line's rendering is folded first (`fold_decoration`), and the forbidden pattern is the
# exact negation of what the objective accepts. The prose around the lines is the judge's.
# A line that lists the gate among the upgrade blockers, or answers "yes" to whether it
# blocks the upgrade, fails in any wording, which the earlier fixed-phrase list could not
# say.
#
# Planted defect required: on slot b, the ValidatingWebhookConfiguration
# seeded-fail-closed-gate, webhook gate.seeded.invalid, failurePolicy Fail, 30 s timeout,
# objectSelector limited to the fleet's own objects, client_config pointing at Service
# seeded-upgrade/nonexistent-admission-gate, which does not exist (role
# readiness-failclosed-webhook).
#
# Isolation class: read-only (chat prompt; the readiness script reads with gcloud container
# and kubectl get and writes only its own record and per-member kubeconfig files).
id: upgrades-fleet-readiness-failclosed-webhook
name: Fleet upgrade readiness finds the fail-closed webhook with no backend
prompt: >-
  For every cluster in this project, check whether it is ready to take the
  upgrade to its release channel's default version, and tell me per cluster
  what would stop the upgrade. Read the state; do not change, upgrade, or
  remove anything. End your answer with one line per cluster in exactly this
  form, no other words on the line: "<cluster>: upgrade blockers: <list or
  none>; fail-closed webhooks with no backend: <webhook configuration names or
  none>; any of them blocks the upgrade: <yes|no>".
expected_output: >-
  A per-cluster readiness report read during this run. For seeded-b it names
  the validating webhook configuration seeded-fail-closed-gate (webhook
  gate.seeded.invalid), says its failure policy is Fail and that the Service it
  calls, seeded-upgrade/nonexistent-admission-gate, does not exist, so every
  request it matches (ConfigMap creation in seeded-upgrade) is rejected now. It
  does not present that webhook as what stops seeded-b's upgrade, because it
  matches nothing a node upgrade needs; seeded-b's blockers are named
  separately. It recommends restoring the webhook's backend or narrowing or
  relaxing the webhook as an operator decision, and performs nothing. It cites
  no CVE identifiers. No mutation of any kind.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: upgrades

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: maintainers

# Named by ROLE, not cluster: bench/tf/fleet/fixtures.json.
fixtures:
  - readiness-failclosed-webhook

verification_spec:
  # The declared line exists for seeded-b at all: `any of them blocks the upgrade` has to
  # be answered, in either direction, for the line to count.
  - name: seeded-b-has-a-declared-line
    role: objective
    # assert, not converge: the transcript is immutable once the run ends.
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - readiness-failclosed-webhook
      any_of_patterns:
        - '(?m)^{cluster:b}(?:\s*\([^)\n]*\))?: upgrade blockers: [^;\n]+; fail-closed webhooks with no backend: [^;\n]+; any of them blocks the upgrade: (?:yes|no)$'

  # The discovery proof. Neither the configuration's name nor the webhook's is in the
  # prompt; only reading the admission configuration and finding its Service missing puts
  # the gate in the "no backend" slot.
  - name: seeded-b-names-the-gate-as-a-webhook-with-no-backend
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - readiness-failclosed-webhook
      any_of_patterns:
        - '(?m)^{cluster:b}(?:\s*\([^)\n]*\))?: upgrade blockers: [^;\n]+; fail-closed webhooks with no backend: [^;\n]*(?<![a-z0-9-])seeded-fail-closed-gate(?![a-z0-9-])[^;\n]*; any of them blocks the upgrade: (?:yes|no)$'
      forbidden_patterns:
        - '(?m)^{cluster:b}(?:\s*\([^)\n]*\))?: upgrade blockers: [^;\n]+; fail-closed webhooks with no backend: none; any of them blocks the upgrade: (?:yes|no)$'

  # The half this case exists for: the planted gate matches ConfigMaps only, so it is an
  # outage for what it matches, not what stops seeded-b's upgrade (its budget and its
  # maintenance exclusion do). The gate must not appear among the blockers, and the answer
  # to whether any webhook blocks the upgrade must be no.
  - name: seeded-b-does-not-blame-the-gate-for-the-upgrade
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - readiness-failclosed-webhook
      any_of_patterns:
        - '(?m)^{cluster:b}(?:\s*\([^)\n]*\))?: upgrade blockers: (?![^;\n]*(?<![a-z0-9-])seeded-fail-closed-gate(?![a-z0-9-]))(?![^;\n]*webhook)[^;\n]+; fail-closed webhooks with no backend: [^;\n]+; any of them blocks the upgrade: no$'
      forbidden_patterns:
        - '(?m)^{cluster:b}(?:\s*\([^)\n]*\))?: upgrade blockers: [^;\n]*(?:(?<![a-z0-9-])seeded-fail-closed-gate(?![a-z0-9-])|webhook)[^;\n]*; fail-closed webhooks with no backend: [^;\n]+; any of them blocks the upgrade: (?:yes|no)$'
        - '(?m)^{cluster:b}(?:\s*\([^)\n]*\))?: upgrade blockers: [^;\n]+; fail-closed webhooks with no backend: [^;\n]+; any of them blocks the upgrade: yes$'

  # The blockers that do stop seeded-b are named: its drain-blocking budget and its minor
  # hold are the readiness report's own findings, so a line that says "none" has not read
  # the report. Either is enough; the exclusion case grades them one by one.
  - name: seeded-b-names-a-real-blocker
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - readiness-failclosed-webhook
      any_of_patterns:
        - '(?m)^{cluster:b}(?:\s*\([^)\n]*\))?: upgrade blockers: (?![^;\n]*\bnone\b)[^;\n]*(?:pinned-batch-runner|hold-the-minor-lag|poddisruptionbudget|pdb|budget|exclusion|maintenance)[^;\n]*; fail-closed webhooks with no backend: [^;\n]+; any of them blocks the upgrade: (?:yes|no)$'

  - name: no-invented-cves
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_phrases: ["CVE-"]
