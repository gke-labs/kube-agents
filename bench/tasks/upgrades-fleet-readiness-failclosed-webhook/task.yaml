# The webhook source of fleet-upgrade-verification's --readiness table: a fail-closed
# admission webhook whose backend the API server cannot reach. Such a webhook rejects every
# request its rules match. The table grades the member blocked when those rules reach
# a write a node drain or a node join makes (`UPGRADE_PATH_TARGETS` in the skill's
# `scripts/upgrade_readiness.py` is the list, with the package behind each write), or when
# its namespace selector admits kube-system or kube-public and the rules reach the bootstrap
# Role and RoleBinding writes a new master reconciles there (`CONTROL_PLANE_KUBE_SYSTEM_WRITES`);
# otherwise it names the webhook as a current outage without grading on it. The upgrade-scenario
# campaign reproduced the pod-gating form end to end on GKE (the drain's replacement pods
# refused until the webhook was deleted).
#
# The planted gate matches ConfigMaps only, so this case grades the second half: the agent
# must find the webhook and its missing backend unprompted, and must not present it as what
# stops the upgrade -- seeded-b's blockers are its budget and its maintenance exclusion.
#
# The prompt names no webhook, no Service and no namespace, and none of the SOP vocabulary
# the sibling case upgrades-fleet-readiness-exclusion lists: the agent has to find the
# webhook, not confirm it. Graded on the reply, not the tool path: an agent that reads the
# webhook configurations and EndpointSlices any other way and reports the same finding
# passes.
#
# The declared lines are what the deterministic checks read, as in the upgrade-scenario
# cases. The prompt asks for one fixed-form line per object the agent examined, not a list
# slot per cluster:
#
#   <cluster>/<object>: kind <pdb|exclusion|webhook>; backend: <ready|missing|not applicable>; blocks the upgrade: <yes|no>
#
# Every value is one word from a closed set, so a line has no room for a qualifier, a
# negation or a description: the earlier shape, a comma-separated blockers slot per
# cluster, was graded by lists of words around the names, and each review round found a
# word the list had not anticipated (`pinned-batch-runner (unaffected)` passed; `(no minor
# upgrades)` failed). Each objective below is a whole-line pattern anchored at
# `^{cluster:b}/<object>:` with seeded-b's name bounded on both sides and the line's
# rendering folded first (`fold_decoration`): the fold re-emits the leading name (everything
# before the first `:` outside a bracket) bare, a wrap on the whole name or on any `/`-joined
# component opened (`<seeded-b>/<ns/name>:`) and a parenthetical or bracketed aside after any
# component dropped whatever it holds (`seeded-b (us-central1-a)/name:`, `name (service:
# x):`), so a `:` there cannot split a field and a name there is not the line's; the object
# may carry its namespace before it, a webhook may carry its webhook name after its
# configuration's, and a `:` after `kind` is decoration. The renderings the fold accepts are
# the rows of `test_leading_name_fold_table` in `bench/tests/test_verifiers.py`, and the
# prompt tells the agent to write each name as the API shows it with nothing around it: a
# rendering outside that table is the agent departing from the contract, graded as a wrong
# line on purpose, not a gap in the fold. The grammar of every value objective: accept = the
# whole line with the value; forbid = the field with any other value. Each forbid is the
# same anchor, any text, then one field's label under a negative lookahead for the
# accepted value (`kind:? (?!pdb;)`, `backend: (?!missing;)`, `blocks the upgrade:
# (?!yes$)`), so the accept and its forbids are exact complements on any line carrying
# the anchor, and a second line about the same object with a contradicting, hedged or
# off-set value (`maybe`, `yes?`, `n/a`, `yes (ConfigMaps only)`) fails however the right
# line reads; nothing is enumerated. A line about any other object (a node pool, a healthy
# budget, a webhook with a live backend) matches nothing and is ignored. The prose around
# the lines is the judge's.
#
# Planted defect required: on slot b, the ValidatingWebhookConfiguration
# seeded-fail-closed-gate, webhook gate.seeded.invalid, failurePolicy Fail, 30 s timeout,
# rules on ConfigMaps only (which neither graded list carries, so the script keeps it an
# outage), namespaceSelector naming the seeded-upgrade namespace and objectSelector limited to
# the fleet's own objects (both confine the fail-closed gate to the fleet's own namespace on a
# shared cluster), client_config pointing at Service
# seeded-upgrade/nonexistent-admission-gate, which does not exist (role
# readiness-failclosed-webhook).
#
# Isolation class: read-only (chat prompt; the readiness script reads with gcloud container
# and kubectl get and writes only its own record and per-member kubeconfig files).
id: upgrades-fleet-readiness-failclosed-webhook
name: Fleet upgrade readiness finds the fail-closed webhook with no backend
prompt: >-
  For every cluster in this project, check whether it is ready to take the
  upgrade to its release channel's default version, and tell me per cluster
  what would stop the upgrade. Read the state; do not change, upgrade, or
  remove anything. End your answer with one line per object you examined
  that could stop an upgrade -- every PodDisruptionBudget that would block a
  node drain, every maintenance exclusion in effect, and every fail-closed
  admission webhook whose backend you checked -- in exactly this form, no
  other words on the line: "<cluster>/<object name>: kind
  <pdb|exclusion|webhook>; backend: <ready|missing|not applicable>; blocks
  the upgrade: <yes|no>". Name a webhook by its configuration's name, and
  write "not applicable" as the backend of anything that is not a webhook.
  Write each name exactly as the API shows it, with no brackets, quotes or
  parentheses around it; put any aside on a line of its own.
expected_output: >-
  A per-cluster readiness report read during this run. For seeded-b it names
  the validating webhook configuration seeded-fail-closed-gate (webhook
  gate.seeded.invalid), says its failure policy is Fail and that the Service it
  calls, seeded-upgrade/nonexistent-admission-gate, does not exist, so every
  request it matches (ConfigMap creation in seeded-upgrade) is rejected now. It
  does not present that webhook as what stops seeded-b's upgrade, because it
  matches nothing a node upgrade needs; seeded-b's blockers, the
  PodDisruptionBudget pinned-batch-runner and the maintenance exclusion
  hold-the-minor-lag, are named separately. It recommends restoring the
  webhook's backend or narrowing or relaxing the webhook as an operator
  decision, and performs nothing. It cites no CVE identifiers. No mutation of
  any kind.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: upgrades

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: maintainers

# Named by ROLE, not cluster: bench/tf/fleet/fixtures.json. The gate the case is about,
# plus the budget and the exclusion whose lines the first two objectives expect. The
# checks' `fixture_roles` name the gate's role alone: every pattern is about slot b's
# lines, and the three roles share the slot.
fixtures:
  - readiness-failclosed-webhook
  - readiness-drain-blocked
  - version-laggard

verification_spec:
  # The budget that does stop seeded-b: a line for pinned-batch-runner, kind pdb, that
  # answers yes. The forbids: the same anchor with any kind but pdb, any backend outside
  # the set, any answer but yes.
  - name: seeded-b-pdb-line-blocks-the-upgrade
    role: objective
    # assert, not converge: the transcript is immutable once the run ends.
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - readiness-failclosed-webhook
      any_of_patterns:
        - '(?m)^{cluster:b}/(?:[a-z0-9.-]+/)?pinned-batch-runner(?:\s*\([^)\n]*\))?: kind:? pdb; backend: (?:ready|missing|not applicable); blocks the upgrade: yes$'
      forbidden_patterns:
        - '(?m)^{cluster:b}/(?:[a-z0-9.-]+/)?pinned-batch-runner(?:\s*\([^)\n]*\))?:[^\n]*(?<![a-z0-9-])kind:? (?!pdb;)'
        - '(?m)^{cluster:b}/(?:[a-z0-9.-]+/)?pinned-batch-runner(?:\s*\([^)\n]*\))?:[^\n]*; backend: (?!(?:ready|missing|not applicable);)'
        - '(?m)^{cluster:b}/(?:[a-z0-9.-]+/)?pinned-batch-runner(?:\s*\([^)\n]*\))?:[^\n]*; blocks the upgrade: (?!yes$)'

  # The exclusion that does stop seeded-b: a line for hold-the-minor-lag, kind exclusion,
  # that answers yes. The forbids: the same anchor with any kind but exclusion, any backend
  # outside the set, any answer but yes.
  - name: seeded-b-exclusion-line-blocks-the-upgrade
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - readiness-failclosed-webhook
      any_of_patterns:
        - '(?m)^{cluster:b}/(?:[a-z0-9.-]+/)?hold-the-minor-lag(?:\s*\([^)\n]*\))?: kind:? exclusion; backend: (?:ready|missing|not applicable); blocks the upgrade: yes$'
      forbidden_patterns:
        - '(?m)^{cluster:b}/(?:[a-z0-9.-]+/)?hold-the-minor-lag(?:\s*\([^)\n]*\))?:[^\n]*(?<![a-z0-9-])kind:? (?!exclusion;)'
        - '(?m)^{cluster:b}/(?:[a-z0-9.-]+/)?hold-the-minor-lag(?:\s*\([^)\n]*\))?:[^\n]*; backend: (?!(?:ready|missing|not applicable);)'
        - '(?m)^{cluster:b}/(?:[a-z0-9.-]+/)?hold-the-minor-lag(?:\s*\([^)\n]*\))?:[^\n]*; blocks the upgrade: (?!yes$)'

  # The objective this case exists for. The discovery proof and the grade in one line:
  # neither the configuration's name nor the webhook's is in the prompt, so a line for the
  # gate under either name (the configuration seeded-fail-closed-gate, with or without the
  # webhook after a slash, or the webhook gate.seeded.invalid alone, which one run wrote
  # against the prompt's instruction) is the agent having read the admission configurations;
  # `backend: missing` is the agent having resolved its Service and found none; and
  # `blocks the upgrade: no` is the agent having read what the gate matches (ConfigMaps
  # only) and kept it out of the upgrade's path. The forbids: the same anchor with any kind
  # but webhook, any backend but missing, any answer but no. No gate line at all fails the
  # accept.
  - name: seeded-b-gate-line-has-no-backend-and-does-not-block
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - readiness-failclosed-webhook
      any_of_patterns:
        - '(?m)^{cluster:b}/(?:[a-z0-9.-]+/)?(?:seeded-fail-closed-gate(?:/[a-z0-9.-]+)?|gate\.seeded\.invalid)(?:\s*\([^)\n]*\))?: kind:? webhook; backend: missing; blocks the upgrade: no$'
      forbidden_patterns:
        - '(?m)^{cluster:b}/(?:[a-z0-9.-]+/)?(?:seeded-fail-closed-gate(?:/[a-z0-9.-]+)?|gate\.seeded\.invalid)(?:\s*\([^)\n]*\))?:[^\n]*(?<![a-z0-9-])kind:? (?!webhook;)'
        - '(?m)^{cluster:b}/(?:[a-z0-9.-]+/)?(?:seeded-fail-closed-gate(?:/[a-z0-9.-]+)?|gate\.seeded\.invalid)(?:\s*\([^)\n]*\))?:[^\n]*; backend: (?!missing;)'
        - '(?m)^{cluster:b}/(?:[a-z0-9.-]+/)?(?:seeded-fail-closed-gate(?:/[a-z0-9.-]+)?|gate\.seeded\.invalid)(?:\s*\([^)\n]*\))?:[^\n]*; blocks the upgrade: (?!no$)'

  # No line on any cluster blames the gate, under any of its names (the configuration
  # seeded-fail-closed-gate, the webhook gate.seeded.invalid, the Service
  # nonexistent-admission-gate): the gate is planted on slot b alone, so such a line under
  # another cluster's name is invented, and under seeded-b's it is the misattribution the
  # objective above also forbids. The forbid reads any line whose object (the text before
  # its first `:`) carries one of the three names and whose `blocks the upgrade:` field is
  # anything but `no`; the fold has already dropped an aside after the name, so a name in
  # a gloss on another object's line is not read, and a `:` in one does not hide the line.
  - name: no-line-blames-the-gate-for-the-upgrade
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - readiness-failclosed-webhook
      forbidden_patterns:
        - '(?m)^[^\n:]*(?<![a-z0-9])(?:seeded-fail-closed-gate|gate\.seeded\.invalid|nonexistent-admission-gate)(?![a-z0-9-])[^\n:]*:[^\n]*; blocks the upgrade: (?!no$)'

  - name: no-invented-cves
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_phrases: ["CVE-"]
