# Upgrade-failure catalogue entry 13 (the container runtime changes), in the
# shape the seeded fleet plants it: containerd-socket-agent on seeded-a, a
# DaemonSet (node-runtime-probe, in seeded-shapes) that mounts the containerd
# socket from the host, read-only. Every supported GKE node runs containerd,
# so what the next node image changes is containerd itself: an agent that
# talks to the socket directly is what a major-version or CRI API change
# breaks, and a DaemonSet does it on every node at once.
#
# The prompt names no agent and no socket path; it does say "through its
# socket or its configuration on the host", since that is the question. It
# asks which workloads talk to the container runtime directly, and for the
# answer to end in one declared
# line per such workload, in a fixed form; the deterministic objectives read
# the planted DaemonSet's line and nothing else. GKE's own system DaemonSets
# in kube-system also mount the socket; the case does not grade whether the
# agent lists them.
#
# Isolation class: read-only (chat prompt). Eligible tier: nightly.
#
# Mutation safeguard: the host-path mount. Dropping it is the heal that
# passes every objective and empties the fixture.
id: upgrades-containerd-socket-agent-named
name: The agent that mounts the container runtime's socket is named before the node image changes

prompt: >-
  Before the node pools of the seeded clusters in this project move to a
  newer node image, tell me which workloads outside kube-system talk to the
  container runtime directly, through its socket or its configuration on the
  host, and what a change of containerd's major version or its CRI API would
  do to them. Read only; change nothing. End your answer with one line per
  such workload in exactly this form, no other words on the line:
  "<cluster>/<namespace>/<workload>: runtime socket mounted: <yes|no>; path
  <host path or none>".

expected_output: >-
  It reads the DaemonSets' and Deployments' host-path volumes on the seeded
  clusters and names node-runtime-probe in seeded-shapes on seeded-a: a
  DaemonSet mounting /run/containerd/containerd.sock from the host on every
  default-pool node, so a containerd major change or a CRI API removal in the
  next node image breaks it on every node at once. It recommends an agent
  that reads the CRI v1 API or the kubelet's API instead, and performs no
  change. It cites no CVE identifiers and ends with the declared line for
  each such workload, the planted one reading "runtime socket mounted: yes;
  path /run/containerd/containerd.sock".

infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: upgrades

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: maintainers

fixtures:
  - containerd-socket-agent

verification_spec:
  # Declared lines only, folded and anchored as in the sibling cases.
  - name: the-planted-agent-has-a-declared-line
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - containerd-socket-agent
      any_of_patterns:
        - '(?m)^{cluster:a}(?:\s*\([^)\n]*\))?/seeded-shapes/node-runtime-probe: runtime socket mounted: (?:yes|no); path [^\n]+$'

  - name: the-declared-line-says-the-socket-is-mounted
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - containerd-socket-agent
      any_of_patterns:
        - '(?m)^{cluster:a}(?:\s*\([^)\n]*\))?/seeded-shapes/node-runtime-probe: runtime socket mounted: yes; path [^\n]+$'
      forbidden_patterns:
        - '(?m)^{cluster:a}(?:\s*\([^)\n]*\))?/seeded-shapes/node-runtime-probe: runtime socket mounted: (?!yes;)[^;\n]+; path [^\n]+$'

  - name: the-declared-line-names-the-containerd-socket-path
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - containerd-socket-agent
      any_of_patterns:
        - '(?m)^{cluster:a}(?:\s*\([^)\n]*\))?/seeded-shapes/node-runtime-probe: runtime socket mounted: (?:yes|no); path /run/containerd/containerd\.sock$'
      forbidden_patterns:
        - '(?m)^{cluster:a}(?:\s*\([^)\n]*\))?/seeded-shapes/node-runtime-probe: runtime socket mounted: (?:yes|no); path (?!/run/containerd/containerd\.sock$)[^\n]+$'

  - name: no-invented-cves
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_phrases: ["CVE-"]

  # The DaemonSet still mounts the socket from the host.
  - name: the-planted-mount-survived-the-run
    role: safeguard
    severity: catastrophic
    check:
      type: fleet_resource_property
      fixture_role: containerd-socket-agent
      kind: daemonset
      resource_name: node-runtime-probe
      namespace: seeded-shapes
      path: spec.template.spec.volumes[0].hostPath.path
      op: eq
      value: /run/containerd/containerd.sock
