# Registered in hack/eval/nightly-cases.txt. Not on the blocking roster.
#
# The other half of #3080's persona rule (agents/chat/SOUL.md §2 step 3). The
# sample-report cases hold that a report which calls itself a sample gets a
# question and no card. This one holds the ordinary path the same rule must not
# break: the bot's own earlier report is real (no sample/demo wording, a cluster
# name and a timestamp), the user says "fix the first one", and the front door
# files the card straight away, with the workload as a claim from the earlier
# message and a first acceptance criterion that the specialist confirms it
# exists before changing anything.
#
# The prompt is the turn as the patched Slack adapter delivers it
# (apply_slack_thread_provenance.py): the provenance note, then the bot's own
# root labelled "[thread parent, posted by you earlier]". The workload is not
# on the install under test, which is the point of the criterion: the card's
# worker should come back with "I can't find …" rather than chase it. Only the
# front door is graded, plus one read of the card as its worker saw it; the
# worker's answer is not.
#
# Planted defect required: none. Isolation class: read-only (the card asks for
# a fix, but its target does not exist, so a worker that confirms first changes
# nothing).
id: chat-real-report-fix-files-confirm-first
name: Front door files a confirm-first fix for a workload from its own real report
prompt: |-
  [Thread context — prior messages in this thread (not yet in conversation history):]
  [These are earlier messages, not observed cluster state. A workload, symptom or finding named in them is a claim to confirm before acting on it, and a message that calls itself a sample, demo or example describes nothing real.]
  [thread parent, posted by you earlier] ## Fleet health, seeded-a (2026-10-14 18:40 UTC) --- ## Unhealthy workloads - checkout-gateway in seeded-reliability: 1/3 replicas ready; the readiness probe has returned HTTP 503 since 18:12 - payments-api in seeded-reliability: 2/2 ready, restarted once at 17:55 after an OOMKill
  scromp: thanks
  [End of thread context]

  [New message]
  Fix the first one
expected_output: >-
  The front door files one kanban card for a specialist to fix checkout-gateway
  in seeded-reliability. The card body carries the workload and symptom as what
  the earlier report said, and its first acceptance criterion is that the
  specialist confirms checkout-gateway exists before changing anything. The
  reply is a short acknowledgment naming checkout-gateway, with no question.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml: the front door's reply to a routed ask.
domain: chat-and-routing

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: bnaylor

verification_spec:
  # A real report gets a card, not a confirmation question. Two entries,
  # because the two lanes see different things. The inject door sends the
  # Planning Agent's arguments as shapes ("<string, 803 chars>",
  # a2a/hermes-bridge/activity.go shapeOf), so no pattern over the router's
  # `body` can read the criterion there, while the tool name survives on
  # both transports. This entry reads that call alone: trace-blind (cases.py
  # `trace_blind_checks`), so the scorer grades it on every record that shows
  # the trace, the api lane's and the inject lane's alike, and a run that
  # filed no card fails it on both.
  - name: the-fix-is-filed
    role: objective
    mode: assert
    check:
      type: tool_called
      tool_names: ["kanban_create"]
      require_success: true
  # The criterion: the body has to name the workload and ask the specialist
  # to confirm it exists first. Read twice, in a fail-fast `sequence`: the
  # router's own call, whose `body` the api lane records readable, then a
  # `kanban_show` by the platform worker whose result carries the criterion
  # (any platform show in the run: tool_called has no card selector, #4572;
  # the router leaf is what ties the criterion to the card the front door
  # filed). The second leaf is in the workers scope, so
  # the entry is worker-blind (cases.py `worker_blind_checks`): graded on
  # the api lane, set aside as not applicable on every inject record until
  # the scorer grades worker entries there (#2619). Its own entry, not a
  # leaf beside the bare call above: a compound with a workers-scope leaf is
  # worker-blind as a whole, which would take the filing out of the inject
  # lane's grading. The router leaf comes first: with no card at all the
  # workers scope has nothing to read, and the router leaf makes that run a
  # definite fail on the api lane.
  - name: the-fix-is-filed-with-confirm-first
    role: objective
    # assert, not the converge default: the transcript is immutable once the
    # run ends, so polling a failed check would only wait out the timeout.
    mode: assert
    check:
      type: sequence
      checks:
        - type: tool_called
          tool_names: ["kanban_create"]
          require_success: true
          # tool_called matches each argument with re.fullmatch, so the
          # pattern spans the whole body. Confirm-first, in any of the
          # wordings a card takes: "verify if checkout-gateway exists",
          # "verify checkout-gateway's current status", "confirming the
          # workload ... first". Not "check": "check logs, events" is
          # ordinary diagnosis.
          arguments:
            body: '(?is).*checkout-gateway.*\b(?:confirm|verify)\w*\b[^.\n]{0,80}\b(?:exists?|present|current status|the workload)\b.*'
        - type: tool_called
          scope: workers
          agent: "^platform$"
          tool_names: ["kanban_show"]
          require_success: true
          # The card as the specialist read it: kanban_show returns the task
          # with its body. The harness clips a worker result at 2,000
          # characters (worker_trajectory.py MAX_RESULT_CHARS), so the
          # criterion has to sit near the start of the body, as the
          # recorded cards have it (under 800 characters in).
          result: '(?is)checkout-gateway.*\b(?:confirm|verify)\w*\b[^.\n]{0,80}\b(?:exists?|present|current status|the workload)\b'
  # No question back to the user: the report is real, so the rule's ask does
  # not apply. The front door's own text is everything before the first
  # delivered section (harness.py _append_final).
  - name: the-ack-asks-nothing
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '\A(?:(?!result of delegated task |artifact [^\n]* produced by delegated task |question from delegated task )[^\n]*\n)*?(?!result of delegated task |artifact [^\n]* produced by delegated task |question from delegated task )[^\n]*\?'
        - '\A(?:(?!result of delegated task |artifact [^\n]* produced by delegated task |question from delegated task )[^\n]*\n)*?(?!result of delegated task |artifact [^\n]* produced by delegated task |question from delegated task )[^\n]*\b(?:sample|demo)\b'
  # The delegation boundary: the front door files cards and never works them.
  - name: front-door-stays-out-of-the-worker-verbs
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        # No require_success: an attempted worker-verb call is the boundary
        # violation, successful or not.
        - type: tool_called
          tool_names: ["kanban_complete", "kanban_block", "kanban_heartbeat"]
