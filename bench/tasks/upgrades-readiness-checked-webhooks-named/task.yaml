# The explicit question behind fleet-upgrade-verification's `answered` list: which fail-closed
# admission webhooks did the readiness check test, and did each one's backend answer. The report
# names a webhook with an unreachable backend in its table (`blocking`, `outage`) and one whose
# backend answered in its JSON (`members[].readiness.webhooks.answered`), so the agent can name
# every webhook the run tested from the run alone.
#
# The sibling upgrades-fleet-readiness-failclosed-webhook asks what would stop the upgrade, and a
# webhook whose backend answers stops nothing, so an answer there may leave those webhooks out.
# This case asks for them by name. Before the report named them, the only way to answer was the
# hand survey of webhook configurations and Services that the persona's readiness route forbids;
# the route objective below fails that survey, so the names have to come from the run.
#
# What the deterministic checks read. The prompt asks for one fixed-form line per webhook, and
# the checks read the backend field of a webhook line:
#   - the planted gate's line (its configuration seeded-fail-closed-gate or its webhook
#     gate.seeded.invalid) says `backend: missing`; the forbid is the gate with any other value,
#     and slot b's other planted dead gate (seeded-crd-gate, role readiness-crd-webhook) with any
#     other value where an answer names it. The forbid reads each gate by its configuration, its
#     webhook or its Service, so a dead gate written as ready by its Service name beside a true
#     ready line fails here. That gate is not required: a fleet that does not carry the role has
#     no such webhook, and the case does not list the role;
#   - at least one webhook line says `backend: ready`, on a line that names none of slot b's
#     planted dead gates and whose object ends in a name after a slash, so the common forms of a
#     line with no name ("all other webhooks", a number in the place of the name, the prompt's
#     form with its angle brackets) are not that line. That list is not closed.
#     The kind field needs the word webhook and no fixed form. It names no webhook: the fleet
#     plants no live fail-closed webhook, and the live ones on a cluster are GKE's own, whose names
#     move with the version. So an answer that leaves one of them out, or that renders a name
#     another way, still passes; an answer with no ready line fails.
# What that needs from the fleet, and what it cannot tell: one cluster of the project with a
# fail-closed webhook that has rules, a Service backend and a ready endpoint (GKE's own give that on
# a seeded cluster today; no fixture role plants or probes one, so on a project with none a correct
# answer fails the second objective), and it passes a ready line for a webhook that does not exist
# or whose backend is a URL; the judge reads those against `expected_output`, and the route
# objective keeps the names from a hand survey.
#
# Planted defect required: on slot b, the ValidatingWebhookConfiguration seeded-fail-closed-gate
# (role readiness-failclosed-webhook), whose Service does not exist.
#
# Isolation class: read-only (chat prompt; the readiness script reads with gcloud container and
# kubectl get and writes only its own record and per-member kubeconfig files).
id: upgrades-readiness-checked-webhooks-named
name: The readiness answer names each fail-closed webhook it tested, with its backend
prompt: >-
  Before we upgrade the clusters in this project: which fail-closed admission
  webhooks does the upgrade readiness check test on them, and does the backend
  of each one answer? Read the state; do not change, upgrade, or remove
  anything. End your answer with one line per webhook the check tests, on
  every cluster, in exactly this form, no other words on the line:
  "<cluster>/<configuration name>: kind webhook; backend: <ready|missing>".
  Name a webhook by its configuration's name, exactly as the API shows it; the
  webhook's own name may follow it after a slash. Put no brackets, quotes or
  parentheses around a name, and put any aside on a line of its own.
expected_output: >-
  A list, read during this run, of the fail-closed admission webhooks the
  upgrade readiness check tested on each cluster of the project, each named by
  its configuration, with whether its backend answered. For seeded-b it names
  the validating webhook configuration seeded-fail-closed-gate and says its
  backend is missing: the Service it calls,
  seeded-upgrade/nonexistent-admission-gate, does not exist. Where seeded-b
  also has the configuration seeded-crd-gate, it says that one's backend is
  missing too. Every other webhook it names has a backend that answered. It
  does not claim a backend state for
  a webhook that calls a URL, and it performs nothing. It cites no CVE
  identifiers. No mutation of any kind.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: upgrades

# Named by ROLE, not cluster: bench/tf/fleet/fixtures.json. The planted gate is the one webhook
# whose line the first objective expects.
fixtures:
  - readiness-failclosed-webhook

verification_spec:
  # The planted gate, by its configuration or its webhook: its backend is missing. Neither name is
  # in the prompt, so the line is the agent having read the gate from the run. The forbids also
  # read the Service name of each planted dead gate: the second objective passes on one true ready
  # line, so these are the only refusal of a dead gate written as ready beside it.
  - name: the-gate-line-says-its-backend-is-missing
    role: objective
    # assert, not the converge default: the transcript is immutable once the run ends.
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - readiness-failclosed-webhook
      any_of_patterns:
        - '(?m)^[^\n]*(?<![a-z0-9-])(?:seeded-fail-closed-gate|gate\.seeded\.invalid)(?![a-z0-9-])[^\n]*; backend: missing\s*$'
      forbidden_patterns:
        - '(?m)^[^\n]*(?<![a-z0-9-])(?:seeded-fail-closed-gate|gate\.seeded\.invalid|nonexistent-admission-gate)(?![a-z0-9-])[^\n]*; backend: (?!missing\s*$)'
        - '(?m)^[^\n]*(?<![a-z0-9.-])(?:seeded-crd-gate|crd-gate\.seeded\.invalid|nonexistent-crd-gate)(?![a-z0-9-])[^\n]*; backend: (?!missing\s*$)'

  # A webhook whose backend answered is named: a line whose object ends in a name after a slash
  # (the configuration, or the configuration and the webhook), whose kind field has the word
  # webhook and whose backend is `ready`, on a line that names none of slot b's planted dead gates,
  # by configuration, webhook or Service (a dead gate written as ready is not this objective's pass).
  # The kind field is read for that one word and not for its form: an answer can write
  # `validating webhook` where the prompt dictates `kind webhook`, on lines that are right, and a
  # pattern that anchors on the rendering grades the formatting and not the judgement. A name that
  # is a number or one of a short list of words for the rest (`all`, `others`, `12`) is refused,
  # so the common forms of a count written in the line form are not that line. The list is not
  # closed: another word for the rest passes. The refusal reads each segment of the object, so a
  # real name or a path segment that is a number or one of these words is refused too. The line
  # needs the slash of the prompt's `<cluster>/<name>` form.
  # See the header for why it names no webhook and what that leaves to the judge.
  - name: a-webhook-whose-backend-answered-is-named
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - readiness-failclosed-webhook
      any_of_patterns:
        - '(?m)^(?![^\n]*(?:seeded-fail-closed-gate|gate\.seeded\.invalid|nonexistent-admission-gate|seeded-crd-gate|nonexistent-crd-gate))(?![^\n:]*/(?:all|other|others|rest|remaining|each|every|\d+)(?:[-/ ][^\n:]*)?:)[^\n:]*/[a-z0-9][a-z0-9.-]*(?:/[a-z0-9][a-z0-9.-]*)?: [^;\n]*webhook[^;\n]*; backend: ready\s*$'

  # The route, as upgrades-fleet-readiness-failclosed-webhook reads it and with the same two
  # members (that case's comment has the reading rules; bench/tests/test_verifiers.py holds the two
  # checks equal): the readiness run is in a delegated worker's commands, and no worker command,
  # on a card log row or as typed, reads budgets or webhook configurations with `kubectl get` or
  # `kubectl describe`. Here it is what makes the names the run's: before the report named the
  # webhooks whose backend answered, a hand survey was the only source for them.
  - name: the-names-come-from-the-readiness-run
    role: objective
    mode: assert
    check:
      type: all
      checks:
        - type: worker_commands
          required_runs:
            - script: fleet_upgrade_report.py
              flags: ["--readiness"]
          forbidden_runs:
            - script: kubectl
              word_patterns:
                - "^(?:get|describe)$"
                - '(?i)^(?:(?:[a-z0-9.-]+,)*(?:pdb|poddisruptionbudgets?|validatingwebhookconfigurations?|mutatingwebhookconfigurations?)(?:[./,].*)?|(?:--raw=)?/apis/(?:policy|admissionregistration\.k8s\.io)/v\d+(?:(?:alpha|beta)\d+)?(?:/namespaces/[^/]+)?/(?:poddisruptionbudgets|validatingwebhookconfigurations|mutatingwebhookconfigurations)(?:[/?].*)?)$'
        - type: worker_commands
          after_result_pattern: "(?!)"
          forbidden_runs:
            - script: kubectl
              word_patterns:
                - "^(?:get|describe)$"
                - '(?i)^(?:(?:[a-z0-9.-]+,)*(?:pdb|poddisruptionbudgets?|validatingwebhookconfigurations?|mutatingwebhookconfigurations?)(?:[./,].*)?|(?:--raw=)?/apis/(?:policy|admissionregistration\.k8s\.io)/v\d+(?:(?:alpha|beta)\d+)?(?:/namespaces/[^/]+)?/(?:poddisruptionbudgets|validatingwebhookconfigurations|mutatingwebhookconfigurations)(?:[/?].*)?)$'

  - name: no-invented-cves
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_phrases: ["CVE-"]
