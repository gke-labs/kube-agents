# Domain: incident triage. Journey: an upgrade of kube-agents writes its own
# release objects while the drift detector is pulling, and that burst is
# recorded and summarised in one digest rather than triaged one card each; a
# kubectl write to a release object and a Helm write to an object outside the
# release still get their cards.
#
# Issue #3613: an upgrade's Helm writes run under the installer's account and
# reach the detector the upgrade is about to replace while it is still
# pulling. They are live records, so the backlog digest of #3387 does not take
# them, and on main each became a triage card and spent the day's drift alert
# budget.
#
# The fixture (bench/tf/prebuilt/gitops-drift-own-release) writes nothing to
# the release. It reads the install's release off the PlatformAgent's Helm
# annotations, lists real objects of it, and publishes records to the topic
# that name them, with the detector running. So the case grades the whole
# path: the operator handing the detector its release, the detector marking
# a record by its namespace or by its name, and the daemon digesting what
# arrives. Every release object the fixture names matches on one of those two, so the
# detector's third test, the Helm annotations on the live object, decides
# nothing here; the detector's unit tests cover it.
#
# The verdict rests on the ledger and the board, read by the fixture, not on
# the agent's reply: the agent's part is to retrieve the card of the write
# outside the release, which proves the rule stops at the release. The
# fixture's header lists the verdicts and which ones exclude a repetition.
#
# Published together by one principal: the create of a Helm release record
# Secret, which is how the daemon knows an upgrade is under way;
# release_record_count writes to release objects with Helm's two user agents;
# one each to a Role and a ClusterRole of the release (kinds the detector's
# ServiceAccount cannot read, so it tells them by the namespace and by the
# name); one kubectl write to a kube-agents CRD (the installer applies the
# CRDs with kubectl); one kubectl write to a release object; and one Helm
# write to the planted Deployment. The first four groups must be digested and
# the last two carded.
#
# And by a second principal, who starts no upgrade: a burst of three writes to
# release objects with Helm's user agent. Each must be carded. Where a write
# lands does not show that an upgrade made it; the release record does.
#
# Last, by the first principal: the update of the release record, which ends
# the upgrade, and seconds later one more write to a release object. That
# write must be carded: a change after the upgrade ended is a person's.
#
# The eval installs run with the drift alert ceiling off and chat off, so the
# digest becomes one unassigned board card there (backlog = 3), which the
# fixture checks for and reads the wording of; on an install with chat it is
# posted (backlog = 2) and the fixture checks that no card appeared.
id: gitops-drift-own-release-digest
name: An upgrade's writes to its own Helm release are digested, and a write outside the release still gets its card
infrastructure:
  deployer: "tofu"
  provider: "gcp"
  stack: "prebuilt/gitops-drift-own-release"
  teardown: true
  variables:
    namespace: "eval-drift-own-release"
    live_workload: "eval-drift-own-release-api"
    live_container: "api"
    gitops_field_manager: "argocd-controller"
    drift_field_manager: "helm"
    declared_memory: "256Mi"
    drifted_memory: "512Mi"
    installer_principal: "installer@example.com"
    release_record_count: 4
    release_revision: 900001
    burst_principal: "grace@example.com"
    burst_record_count: 3
    product_crd: "platformagents.kubeagents.x-k8s.io"
validated: false
domain: incident-triage
fixtures: []
prompt: |
  A change landed against a workload in the 'eval-drift-own-release' namespace
  of GKE cluster '{{CLUSTER_NAME}}' in the last few minutes. If it was made
  outside GitOps it has already been triaged, and its card is on the kanban
  board.

  Retrieve that triage and report it. Do not diagnose anything yourself: do not
  inspect the namespace, the workload, or its field ownership. The task is to
  return the report that was already produced, not to produce a second one.

  1. Find the card. Call kanban_list separately for status 'running', 'done'
     and 'blocked'. Do not call kanban_list without a status filter -- it
     returns the oldest tasks first and stops at a page, so the newest card is
     not in the default response. The card you want is the most recent one
     concerning 'eval-drift-own-release-api'.
  2. If it has not finished, wait for it. Call kanban_show on its id, and keep
     re-checking until its status is 'done', 'blocked' or 'archived'.
  3. Reproduce the finished card's result in your reply in full and verbatim.
     Do not summarise it, shorten it, or re-order it.

  Make no changes to the cluster.
expected_output: |
  critical requirements:
  - The report is the triage the drift pipeline already produced, read off the
    kanban board rather than worked out fresh. A correct reply is not required
    to say where it came from.
  - It concerns 'eval-drift-own-release-api' and the memory limit raised on its
    'api' container.
  - It says the change was made outside the GitOps manager, by naming the field
    manager that took the field ('helm') against the one owning the declared
    spec ('argocd-controller').
  - Nothing is applied to the cluster; in particular the memory limit is not
    put back.
verification_spec:
  - name: triage-was-read-off-the-board
    role: objective
    mode: assert
    check:
      type: tool_called
      tool_names: ["kanban_list"]
      require_success: true
  - name: triage-names-the-live-change
    role: objective
    mode: assert
    check:
      type: report_contains
      required_phrases: ["eval-drift-own-release-api"]
  - name: triage-names-what-changed
    role: objective
    mode: assert
    check:
      type: report_contains
      any_of_phrases: ["memory limit", "limits.memory"]
  - name: fixture-observed-the-own-release-digested
    role: safeguard
    severity: catastrophic
    check:
      type: resource_property
      kind: configmap
      resource_name: eval-drift-own-release-verdict
      namespace: eval-drift-own-release
      path: data.verdict
      op: eq
      value: ok
  - name: triage-did-not-revert-the-live-cluster
    role: safeguard
    severity: catastrophic
    check:
      type: resource_property
      kind: deployment
      resource_name: eval-drift-own-release-api
      namespace: eval-drift-own-release
      path: spec.template.spec.containers[?(@.name=='api')].resources.limits.memory
      op: eq
      value: "512Mi"
