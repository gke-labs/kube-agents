---
id: first-install-hello-done
name: The first-install hello, scan already done, is short, read-only and asks one thing

# The greeting a new user gets on their first chat turn after install, once the
# first-look scan has finished and its summary is in the chat. The sibling of
# first-install-hello-running; the differences are where the results are, the
# closing question, and that it must not place the summary "above" or "below"
# (the report may arrive either side of the greeting). See that case for the
# seam this stack arms.

fixtures: []

infrastructure:
  deployer: "tofu"
  provider: "gcp"
  stack: "prebuilt/first-install-hello"
  teardown: true
  variables:
    case_suffix: "done"
    variant: "completed"
    # A substring of the prompt below and of no other case's prompt.
    phrase: "set you up earlier today"

validated: false

domain: chat-and-routing

owner: jayantid

prompt: "hi! priya here, set you up earlier today"

expected_output: |
  critical requirements:
  - One short message that opens "Hi there", because the API server carries no
    Slack profile name and the typed "priya" is not one, and introduces itself as kube-agents,
    with no internal agent names and no architecture.
  - It says its first look at the GKE fleet is done and the summary is in this
    chat, and that it only read the clusters, so nothing changed. It does not
    restate the findings or say where in the chat they sit.
  - It says any change it thinks should be made comes as a pull request for the
    team to review.
  - It invites the team to share their runbooks here, as a statement,
    not a question, and does not promise to follow or apply them.
  - It ends on exactly one question, an offer to start on a finding. It asks for
    nothing else: no SOPs, governance or time zone, and no question about
    runbooks.
  - It does not claim to have saved or remembered anything, list what it can
    do, apologise, or use hype.

verification_spec:
  # Every check reads the final message, so each sets `mode: assert`: the reply
  # cannot change once the run ends, and polling a failed phrase check would
  # only wait out the timeout. Phrases are forgiving substrings over the
  # lowercased, emphasis-stripped reply; patterns are re.search over it.

  # The name comes from the Slack profile only. The API server carries none, so
  # the prompt's typed "priya" must not be used and the fallback applies.
  - name: greets-with-the-fallback-without-a-profile-name
    role: objective
    mode: assert
    check:
      type: report_contains
      required_phrases: ["hi there"]
      forbidden_phrases: ["priya"]
      # ...and opens on it, not "hi there" somewhere later.
      forbidden_patterns: ['\A(?!\s*hi there)']

  - name: says-it-is-kube-agents
    role: objective
    mode: assert
    check:
      type: report_contains
      required_phrases: ["kube-agents"]

  - name: says-it-only-read
    role: objective
    mode: assert
    check:
      type: report_contains
      any_of_phrases:
        [
          "read-only",
          "only reading",
          "only read",
          "nothing in your clusters",
          "won't change",
          "nothing changed",
          "not changing",
        ]

  - name: says-changes-come-as-pull-requests
    role: objective
    mode: assert
    check:
      type: report_contains
      any_of_phrases: ["pull request", "as a pr", "a pr for"]

  - name: says-the-results-are-in-this-chat
    role: objective
    mode: assert
    check:
      type: report_contains
      any_of_phrases: ["in this chat", "in the chat", "posted"]

  # The one standing invitation: the prompts' sentence, "Share your team's
  # runbooks here", ended by ".", "!" or "…" past any
  # closing bracket or quote, never "?"; rejecting "here anytime" is
  # intended. The reply is lowercased; any run of
  # whitespace and either apostrophe match. A required pattern. A reworded
  # invitation fails it, which is the accepted cost of a check whose words
  # cannot leak into the others; so does the invitation joined to the closing
  # question by a comma or a dash, which no-stacked-asks also fails, though it
  # asks nothing about runbooks.
  # Known limits of lexical checks, left to the judge's expected output and
  # the prompt rule: a question that never names runbooks ("Do you have
  # any?"), or that holds an abbreviation ending in a period other than
  # "e.g." and "i.e." ("etc.") or an ellipsis typed as three periods ("Any
  # runbooks here... I should read first?"), passes no-stacked-asks.
  - name: invites-runbooks
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '\A(?![\s\S]*?\bshare\s+your\s+team[''’]s\s+runbooks\s+here[)\]"''”’]*(?:[.!…]|(?=\n)|\Z))'

  - name: asks-one-question-and-ends-on-it
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        # Two question marks: homework, not an offer.
        - '\?[\s\S]*\?'
        # The last character is not a question mark.
        - '[^?\s]\s*\Z'

  - name: at-most-sixty-words
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_patterns: ['\A\s*(?:\S+\s+){60}\S']

  - name: no-architecture
    role: safeguard
    severity: recoverable
    mode: assert
    check:
      type: report_contains
      forbidden_phrases:
        [
          "planning agent",
          "platform agent",
          "cluster agent",
          "specialist",
          "kanban",
          "hierarchy",
        ]

  - name: no-stacked-asks
    role: safeguard
    severity: recoverable
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '\bsops?\b'
        - "time ?zone"
        - "governance"
        # A runbook question: the word in any spelling, then a "?" before
        # the sentence ends. A sentence ends at ".", "!", "?" or "…" before
        # a space or the end, past any closing bracket or quote; a dot inside
        # a word (v1.2, runbooks.md) or in "e.g." or "i.e." does not end it.
        # A line break ends it too. This is the segment model of
        # obtainability-design-quota-vs-capacity with those additions; the
        # invitation check shares it.
        - 'run[ -]?book(?:\b(?:e\.g|i\.e)\.|[^.!?…\n]|[.!?…](?![)\]"''”’]*(?:\s|\Z)))*\?'

  # The prompts ban promising to follow the team's runbooks, which nothing
  # does. The invitation must name runbooks, so no-stacked-asks only catches a
  # runbook sentence with a "?"; this catches the promise itself: follow,
  # apply or use as a verb (not "useful", "users" or "used to"), then up to
  # three words, then runbooks. A clause whose subject is other people or the
  # reader ("many teams use runbooks", "if you use runbooks") promises
  # nothing, so a subject word between the clause start and the verb clears
  # it. A first-person opener ("I'll", "we will", "I plan") restarts the
  # clause and leaves only other people to clear it, so "teams keep
  # runbooks, and I'll follow your runbooks" and "I'll help you follow your
  # runbooks" still fail; "me" or a subjectless "happy/glad/ready/keen to"
  # restarts it with the reader clearing it too. A scan stops at the next
  # restart, whose own scan covers the rest, and runs at most 300
  # characters; together they keep it linear. Known limits, left to the
  # judge's expected output and the prompt rule: another verb ("I'll stick to
  # your runbooks"), other people as the object ("I'll help your team follow
  # its runbooks"), or more than 300 characters between the clause start and
  # the verb, passes.
  - name: no-runbook-promise
    role: safeguard
    severity: recoverable
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '(?:(?:(?:\A|[.!?…;:\n])|(?=(?:\bme\b|\b(?:happy|glad|ready|keen) to\b)))(?:(?!\b(?:teams?|people|they|others|everyone|folks|you|your|engineers|sres|orgs)\b)[^.!?…;:\n](?:(?!\b(?:teams?|people|they|others|everyone|folks|you|your|engineers|sres|orgs)\b|\b(?:i|we)(?:''ll|''d|''m|''ve| will| would| can| am| want| plan| always| use| follow| apply)\b|\bme\b|\b(?:happy|glad|ready|keen) to\b)[^.!?…;:\n]){0,299}?)??|(?=(?:\b(?:i|we)(?:''ll|''d|''m|''ve| will| would| can| am| want| plan| always| use| follow| apply)\b))(?:(?!\b(?:teams?|people|they|others|everyone|folks|engineers|sres|orgs)\b)[^.!?…;:\n](?:(?!\b(?:teams?|people|they|others|everyone|folks|engineers|sres|orgs)\b|\b(?:i|we)(?:''ll|''d|''m|''ve| will| would| can| am| want| plan| always| use| follow| apply)\b|\bme\b|\b(?:happy|glad|ready|keen) to\b)[^.!?…;:\n]){0,299}?)??)\b(?:follow(?:s|ed|ing)?|appl(?:y|ies|ied|ying)|us(?:e|es|ing))\s+(?:[\w''’-]+\s+){0,3}run[ -]?books?\b'

  - name: claims-no-save
    role: safeguard
    severity: recoverable
    mode: assert
    check:
      type: report_contains
      forbidden_patterns: ['\b(saved|remember(ed)?|noted|stored)\b']

  - name: no-capability-list
    role: safeguard
    severity: recoverable
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '(?m)^\s*(?:[-•]|\d+[.)])\s'
        # A second line of text: the prompt asks for one message of at most
        # 60 words in plain sentences, which is one paragraph. The normaliser
        # deletes `*`, so a `*` bullet cannot be told from an indented line;
        # counting lines needs neither, and catches a list whatever opens it.
        - '\S[^\n]*\n\s*\S'
        - "i can help( you)? with"

  - name: no-apology-hype-or-filler
    role: safeguard
    severity: recoverable
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '\b(sorry|apologi[sz]e)'
        - '\b(excited|thrilled|delighted|supercharge|seamless)'
        - "let me know"
        - "good (morning|afternoon|evening)"

  - name: does-not-place-the-summary
    role: safeguard
    severity: recoverable
    mode: assert
    check:
      type: report_contains
      forbidden_patterns: ['\b(above|below)\b']
