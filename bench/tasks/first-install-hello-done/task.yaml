---
id: first-install-hello-done
name: The first-install hello, scan already done, is short, read-only and asks one thing

# The greeting a new user gets on their first chat turn after install, once the
# first-look scan has finished and its summary is in the chat. The sibling of
# first-install-hello-running; the differences are where the results are, the
# closing question, and that it must not place the summary "above" or "below"
# (the report may arrive either side of the greeting). See that case for the
# seam this stack arms.

fixtures: []

infrastructure:
  deployer: "tofu"
  provider: "gcp"
  stack: "prebuilt/first-install-hello"
  teardown: true
  variables:
    case_suffix: "done"
    variant: "completed"
    # A substring of the prompt below and of no other case's prompt.
    phrase: "set you up earlier today"

validated: false

domain: chat-and-routing

owner: jayantid

prompt: "hi! priya here, set you up earlier today"

expected_output: |
  critical requirements:
  - One short message that opens "Hi there", because the API server carries no
    Slack profile name and the typed "priya" is not one, and introduces itself as kube-agents,
    with no internal agent names and no architecture.
  - It says its first look at the GKE fleet is done and the summary is in this
    chat, and that it only read the clusters, so nothing changed. It does not
    restate the findings or say where in the chat they sit.
  - It says any change it thinks should be made comes as a pull request for the
    team to review.
  - It invites the team to share their runbooks here, as a statement,
    not a question, and does not promise to follow or apply them.
  - It ends on exactly one question, an offer to start on a finding. It asks for
    nothing else: no SOPs, governance or time zone, and no question about
    runbooks.
  - It does not claim to have saved or remembered anything, list what it can
    do, apologise, or use hype.

verification_spec:
  # Every check reads the final message, so each sets `mode: assert`: the reply
  # cannot change once the run ends, and polling a failed phrase check would
  # only wait out the timeout. Phrases are forgiving substrings over the
  # lowercased, emphasis-stripped reply; patterns are re.search over it.

  # The name comes from the Slack profile only. The API server carries none, so
  # the prompt's typed "priya" must not be used and the fallback applies.
  - name: greets-with-the-fallback-without-a-profile-name
    role: objective
    mode: assert
    check:
      type: report_contains
      required_phrases: ["hi there"]
      forbidden_phrases: ["priya"]
      # ...and opens on it, not "hi there" somewhere later.
      forbidden_patterns: ['\A(?!\s*hi there)']

  - name: says-it-is-kube-agents
    role: objective
    mode: assert
    check:
      type: report_contains
      required_phrases: ["kube-agents"]

  - name: says-it-only-read
    role: objective
    mode: assert
    check:
      type: report_contains
      any_of_phrases:
        [
          "read-only",
          "only reading",
          "only read",
          "nothing in your clusters",
          "won't change",
          "nothing changed",
          "not changing",
        ]

  - name: says-changes-come-as-pull-requests
    role: objective
    mode: assert
    check:
      type: report_contains
      any_of_phrases: ["pull request", "as a pr", "a pr for"]

  - name: says-the-results-are-in-this-chat
    role: objective
    mode: assert
    check:
      type: report_contains
      any_of_phrases: ["in this chat", "in the chat", "posted"]

  # The one standing invitation. Point 5 of the prompts describes it, an
  # invitation as a statement to share the team's runbooks here; this check
  # grades that behaviour in the examples' words, "Share your team's runbooks
  # here", so a reworded invitation fails it, which is the accepted cost of a
  # check whose words cannot leak into the others. At most 40 characters
  # sit between the sentence's start and it ("And share...", "You can also
  # share...", "One more thing: share...", "📚 Share..."), with no negation
  # among them (no, not, n't, never, nor, neither, none, nothing, without,
  # cannot, unless), because a negation can withdraw it ("There's no need to
  # share...", "Please don't share...", "I can't read them if you
  # share..."), and none of the results checks' words (here, chat, or a word
  # starting post, shar or send), because the results checks read the
  # lead-in ("Here you can post or share...", "In this chat, share..."). A
  # negation that only qualifies it ("No pressure, but share...") fails it,
  # a known cost, and so does a results word in the lead-in of a reply that
  # also has a results sentence. A sentence opens at the start of the reply, after ".", "!",
  # "?" or "…" past any closing bracket or quote and a space, at a line
  # break, after "; ", ": " or ", and", or at a dash with a space on each
  # side. A longer lead-in fails it, a known cost; a lead-in that withdraws
  # it without a listed negation ("Only if you must, share..."), or a
  # negation before the join ("One thing you needn't do: share..."), passes,
  # a known limit. It ends with ".", "!" or "…" past any closing bracket or
  # quote, and no "?" in the run of marks that follows ("here...?" and
  # "here!?" fail); rejecting
  # "here anytime" is intended, and so is the invitation joined to the
  # closing question by a comma or a dash, which no-stacked-asks also fails,
  # though it asks nothing about runbooks. The reply is lowercased; any run
  # of whitespace and either apostrophe match. A required pattern.
  # Known limits of lexical checks, left to the judge's expected output and
  # the prompt rule: a question that never names runbooks ("Do you have
  # any?"), or that holds an abbreviation ending in a period other than
  # "e.g." and "i.e." ("etc.") or an ellipsis, typed as three periods or as
  # "…" ("Any runbooks here... I should read first?"), passes
  # no-stacked-asks. A known cost: a period with no space after it does not
  # end a sentence, so a runbook sentence run into the closing question
  # ("Share your team's runbooks here.Is there anything...?") fails it. A
  # second runbook ask with no "?" ("Send me your on-call runbooks too.")
  # passes it, a known limit.
  - name: invites-runbooks
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '\A(?![\s\S]*?(?:\A|[.!?…][)\]"''”’]*\s|\n|[;:]\s|,\s+and\s|\s[-–—]+\s)(?:(?!\b(?:no|not|never|nor|neither|none|nothing|without|cannot|unless|here|chat)\b|n[''’]t\b|\b(?:post|shar|send))[^.!?…\n]){0,40}?\bshare\s+your\s+team[''’]s\s+runbooks\s+here[)\]"''”’]*(?:[.!…](?![.!…)\]"''”’]*\?)|(?=\n)|\Z))'

  - name: asks-one-question-and-ends-on-it
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        # Two question marks: homework, not an offer.
        - '\?[\s\S]*\?'
        # The last character is not a question mark.
        - '[^?\s]\s*\Z'

  - name: at-most-sixty-words
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_patterns: ['\A\s*(?:\S+\s+){60}\S']

  - name: no-architecture
    role: safeguard
    severity: recoverable
    mode: assert
    check:
      type: report_contains
      forbidden_phrases:
        [
          "planning agent",
          "platform agent",
          "cluster agent",
          "specialist",
          "kanban",
          "hierarchy",
        ]

  - name: no-stacked-asks
    role: safeguard
    severity: recoverable
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '\bsops?\b'
        - "time ?zone"
        - "governance"
        # A runbook question: the word in any spelling, then a "?" before
        # the sentence ends. A sentence ends at ".", "!", "?" or "…" before
        # a space or the end, past any closing bracket or quote; a dot inside
        # a word (v1.2, runbooks.md) or in "e.g." or "i.e." does not end it.
        # A line break ends it too. This is the segment model of
        # obtainability-design-quota-vs-capacity with those additions.
        - 'run[ -]?book(?:\b(?:e\.g|i\.e)\.|[^.!?…\n]|[.!?…](?![)\]"''”’]*(?:\s|\Z)))*\?'

  # The prompts ban promising to follow the team's runbooks, which nothing
  # does. The invitation must name runbooks, so no-stacked-asks only catches a
  # runbook sentence with a "?"; this catches the promise itself: follow,
  # apply or use as a verb (not "useful", "users" or "used to", nor "use"
  # after a, an, the, no, any, its or their, which is the noun: "the use of
  # runbooks"), then up to six words, none of them "to", then runbooks ("use
  # this chat to share your team's runbooks" is not a promise). A clause
  # whose subject is other people or the reader ("many teams use runbooks",
  # "let me know if you use runbooks") promises nothing, so a subject word
  # between the clause start and the verb clears it. A clause starts at the
  # start of the reply, at a line break, or after ".", "!", "?", "…", ";",
  # ":" or ",", so a reader word in an earlier comma-joined clause ("if your
  # team agrees, fixes will follow your runbooks") clears nothing. The same word inside a prepositional phrase
  # (for, in, on, at, of, from, by, about, across or into, then optionally
  # the, your, their or its) is not the subject and clears nothing, so "pull
  # requests for your team to review that follow your runbooks" still fails;
  # after many, some, most, all, few or each it is the subject's head and
  # clears it ("many on your team use runbooks").
  # A first-person opener ("I'll", "we will", "I plan") restarts
  # the clause and leaves only other people to clear it, and so does
  # "happy/glad/ready/keen to" whatever precedes it, so "teams keep runbooks,
  # and I'll follow your runbooks", "I'll help you follow your runbooks" and
  # "happy to help you follow your runbooks" still fail; "me" restarts it with
  # the reader clearing it too. A scan stops at the next restart, whose own
  # scan covers the rest, and runs at most 300 characters; together they keep
  # it linear. It fails closed: where the reader after a first-person opener
  # may be the promise's object, it is read as one, so a false red costs a
  # rewrite where a miss would ship the promise. Known limits, left to the
  # judge's expected output and the prompt rule: another verb ("I'll stick to
  # your runbooks"), a pronoun standing for the runbooks ("I'll follow them"),
  # other people as the object, or the reader named alongside them ("I'll help
  # your team follow its runbooks", "help you and your team follow your
  # runbooks"), the reader after "me" ("let me help you use your runbooks"),
  # the reader after a first-person opener outside the restart list (I or we
  # with 'll, 'd, 'm, 've, will, would, can, am, want, plan, always, use,
  # follow or apply) (e.g. "I could help you follow...", "I shall...",
  # "let's help you..."), an opener other than happy/glad/ready/keen, or one
  # split from its "to" ("here to help you follow...", "pleased to help
  # you...", "happy, as always, to help you..."), a clearing word after "to"
  # or "with", which are not in the preposition list ("fixes sent to your
  # team follow your runbooks"), the reader or their team as the promise's
  # subject ("you'll get fixes that follow your runbooks"), more than six
  # words between the verb and
  # runbooks ("I'll follow the long list of incident and on-call runbooks"),
  # or more than 300 characters between the clause start and the verb,
  # passes. Known costs fail; these are examples of each kind, not every
  # case: after a first-person opener, the reader as an embedded subject
  # ("I'll see whether you use runbooks", "I can read them if you use
  # runbooks", "happy to hear how you use runbooks") or a negation ("I'm
  # read-only, so I won't follow runbooks on my own"); the reader as the
  # subject of happy/glad/ready/keen ("when you're ready to use runbooks
  # here, share them"); a subject outside the clearing list ("anyone who
  # follows runbooks"), or one whose clearing word sits in a prepositional
  # phrase ("changes from your team follow runbooks"), or one set off from
  # the verb by a parenthetical comma ("your team, like most, follows
  # runbooks"); the noun "use" after any
  # other word ("a good use of runbooks"); a gerund ("following runbooks is
  # common"); and an imperative to the reader ("Use this chat for
  # runbooks.").
  - name: no-runbook-promise
    role: safeguard
    severity: recoverable
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '(?:(?:(?:\A|[.!?…;:,\n])|(?=(?:\bme\b)))(?:(?:(?<!\bmany )(?<!\bsome )(?<!\bmost )(?<!\ball )(?<!\bfew )(?<!\beach )\b(?:for|in|on|at|of|from|by|about|across|into) +(?:(?:the|your|their|its) +)?(?:teams?|people|they|others|everyone|folks|you|your|engineers|sres|orgs)\b|(?!\b(?:teams?|people|they|others|everyone|folks|you|your|engineers|sres|orgs)\b)[^.!?…;:,\n])(?:(?<!\bmany )(?<!\bsome )(?<!\bmost )(?<!\ball )(?<!\bfew )(?<!\beach )\b(?:for|in|on|at|of|from|by|about|across|into) +(?:(?:the|your|their|its) +)?(?:teams?|people|they|others|everyone|folks|you|your|engineers|sres|orgs)\b|(?!\b(?:teams?|people|they|others|everyone|folks|you|your|engineers|sres|orgs)\b|\b(?:i|we)(?:''ll|''d|''m|''ve| will| would| can| am| want| plan| always| use| follow| apply)\b|\bme\b|\b(?:happy|glad|ready|keen) to\b)[^.!?…;:,\n]){0,299}?)??|(?=(?:\b(?:i|we)(?:''ll|''d|''m|''ve| will| would| can| am| want| plan| always| use| follow| apply)\b|\b(?:happy|glad|ready|keen) to\b))(?:(?:(?<!\bmany )(?<!\bsome )(?<!\bmost )(?<!\ball )(?<!\bfew )(?<!\beach )\b(?:for|in|on|at|of|from|by|about|across|into) +(?:(?:the|your|their|its) +)?(?:teams?|people|they|others|everyone|folks|engineers|sres|orgs)\b|(?!\b(?:teams?|people|they|others|everyone|folks|engineers|sres|orgs)\b)[^.!?…;:,\n])(?:(?<!\bmany )(?<!\bsome )(?<!\bmost )(?<!\ball )(?<!\bfew )(?<!\beach )\b(?:for|in|on|at|of|from|by|about|across|into) +(?:(?:the|your|their|its) +)?(?:teams?|people|they|others|everyone|folks|engineers|sres|orgs)\b|(?!\b(?:teams?|people|they|others|everyone|folks|engineers|sres|orgs)\b|\b(?:i|we)(?:''ll|''d|''m|''ve| will| would| can| am| want| plan| always| use| follow| apply)\b|\bme\b|\b(?:happy|glad|ready|keen) to\b)[^.!?…;:,\n]){0,299}?)??)\b(?:follow(?:s|ed|ing)?|appl(?:y|ies|ied|ying)|(?<!\ba )(?<!\ban )(?<!\bthe )(?<!\bno )(?<!\bany )(?<!\bits )(?<!\btheir )us(?:e|es|ing))\s+(?:(?!to\s)[\w''’-]+\s+){0,6}run[ -]?books?\b'

  - name: claims-no-save
    role: safeguard
    severity: recoverable
    mode: assert
    check:
      type: report_contains
      forbidden_patterns: ['\b(saved|remember(ed)?|noted|stored)\b']

  - name: no-capability-list
    role: safeguard
    severity: recoverable
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '(?m)^\s*(?:[-•]|\d+[.)])\s'
        # A second line of text: the prompt asks for one message of at most
        # 60 words in plain sentences, which is one paragraph. The normaliser
        # deletes `*`, so a `*` bullet cannot be told from an indented line;
        # counting lines needs neither, and catches a list whatever opens it.
        - '\S[^\n]*\n\s*\S'
        - "i can help( you)? with"

  - name: no-apology-hype-or-filler
    role: safeguard
    severity: recoverable
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '\b(sorry|apologi[sz]e)'
        - '\b(excited|thrilled|delighted|supercharge|seamless)'
        - "let me know"
        - "good (morning|afternoon|evening)"

  - name: does-not-place-the-summary
    role: safeguard
    severity: recoverable
    mode: assert
    check:
      type: report_contains
      forbidden_patterns: ['\b(above|below)\b']
