# Probe for rapid GKE Standard node-pool scaling bursts and kube-dns saturation
# (#5736, #7095): when a GKE Standard cluster scales from 15 to 180 nodes in
# under 5 minutes with default kube-dns-autoscaler settings (2 replicas) and
# NodeLocal DNSCache disabled, pods experience intermittent DNS lookup timeouts
# (`i/o timeout` to the kube-dns ClusterIP on port 53). The root cause is
# kube-dns saturation while kube-dns-autoscaler lags or under-provisions under
# default linear scaling parameters and every query traverses conntrack and
# kube-proxy to the central kube-dns pods; the two fixes are tuning
# kube-dns-autoscaler's linear scaling parameters (coresPerReplica,
# nodesPerReplica, min) and enabling NodeLocal DNSCache.
#
# The objective is a verdict line the prompt asks for plus the two required
# prescriptions. The verifier lowercases the report and drops emphasis and
# backticks, and fold_decoration folds leading list markers, quotes, headings
# and trailing stops before the patterns run.
# bench/tests/test_observability_kube_dns_scaling_verdict.py pins both sides.
#
# The prompt's sentence about a hand-off is for the Planning Agent, so a
# delegated card keeps the verdict-line instruction. The ClusterIP literal in
# the prompt is sanitized to RFC 5737 TEST-NET-2 (198.51.100.10:53) per
# bench/CONTRIBUTING.md.
#
# Planted defect required: none. deployer: noop, no fixture, no cluster read.
#
# Isolation class: read-only (no cluster touched at all).
# Tier: nightly (hack/eval/nightly-cases.txt).
id: observability-kube-dns-scaling-probe
name: Rapid GKE Standard node scale-up saturates underscaled kube-dns and is fixed by kube-dns-autoscaler tuning and NodeLocal DNSCache

domain: observability

prompt: >-
  During a CI/CD burst our GKE Standard cluster scales from 15 to 180 nodes in
  under 5 minutes. Pods start failing with intermittent DNS lookup timeouts
  (`i/o timeout` to `198.51.100.10:53`). `kube-dns` is running 2 replicas with
  default `kube-dns-autoscaler` settings and `NodeLocal DNSCache` is disabled.
  What is the root cause of the DNS saturation during the rapid scale-up, and
  what two changes fix it? Start your answer with `VERDICT:
  KUBE-DNS-UNDERSCALED` or `VERDICT: COREDNS-BUG` on its own line. If you hand
  this question to another agent, pass these instructions word for word, and
  keep its verdict line at the start of your reply. Do not change anything.
expected_output: >-
  VERDICT: KUBE-DNS-UNDERSCALED. Two kube-dns replicas cannot serve the burst
  of DNS queries and conntrack packet volume from 180 nodes when
  kube-dns-autoscaler is left at default parameters and NodeLocal DNSCache is
  disabled. Fix it with two changes: (1) tune the kube-dns-autoscaler
  ConfigMap's linear scaling parameters (lower nodesPerReplica and
  coresPerReplica, and raise min or set preventSinglePointFailure) so kube-dns
  scales replicas ahead of and proportionally to node bursts, and (2) enable
  NodeLocal DNSCache (NodeLocalDNS) so nodes serve cached DNS lookups locally
  and avoid per-query conntrack and kube-dns round-trips.
infrastructure:
  deployer: noop
validated: false

verification_spec:
  - name: verdict-and-two-dns-scaling-fixes-are-named
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      required_phrases: ["kube-dns-autoscaler"]
      required_patterns:
        - "(?m)^\\W*verdict:\\s*kube-dns-underscaled\\b"
        - "\\b(?:coresperreplica|nodesperreplica)\\b|\\bmin\\b[^\\n]{0,60}\\breplicas?\\b|\\breplicas?\\b[^\\n]{0,60}\\bmin\\b"
        - "\\b(?:nodelocal(?:\\s*dns(?:\\s*cache)?|-dns(?:cache)?)|node-local-dns(?:cache)?)\\b"
      forbidden_patterns:
        - "(?m)^\\W*verdict:\\s*coredns-bug\\b"
  - name: front-door-stays-out-of-the-worker-verbs
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        # Same delegation-boundary safeguard as knowledge-grounding-sources-probe.
        - type: tool_called
          tool_names: ["kanban_complete", "kanban_block", "kanban_heartbeat"]
