# NIGHTLY -- an entry in hack/eval/nightly-cases.txt.
#
# Domain: fleet audits. Journey: an audit names an outlier and tells the reader
# how to fix it, and the fix it names is right, specific to that cluster, and
# this run's own. Only this case and its control read the command in a
# remediation: the ledger checks read a finding's id and object, or a note
# that `finish` writes, and the command under them is whatever the worker
# wrote, or whatever `finish` carried from the run before.
#
# WHAT IS GRADED. The drift stream's authorized-networks outlier on seeded-c
# (master authorized networks off where its cohort has them on). The drift
# SOP gives that finding one remediation (section 4.5): `kind: gcloud`,
# `gcloud container clusters update ... --enable-master-authorized-networks
# --master-authorized-networks=<ranges the cluster's own owner approves>`,
# never a peer's CIDRs and never an invented range. Four objectives read
# that one finding in the stored report (`latest.json`, `document.findings[]`)
# and parse the command in `remediation.note`; none reads prose, and each has
# one cause: the kind, the command with both flags on this cluster, no literal
# range as the flag's value, and no mark of the planted run. A fifth reads
# the finding's title: it does not hold the mark either. Flag order,
# `--project` and `--location` are not graded: the SOP leaves them out.
#
# THE PLANT (prebuilt/unchanged-finding-wording, `planted_remediation:
# gcloud-stale`). A previous run in the report store with the same finding
# id, a `gcloud` command that gives a literal range, the mark in every field,
# and evidence that differs from this run's. It does two things.
# It is the stale remediation: `finish` must not carry it (the evidence
# changed) and the worker must not copy it. A `finish` that keeps the planted
# wording by mistake drops the planted command by its content rule, so the
# check on the title is the one that sees that mistake. And it makes each run
# a sample of its own: without it, `finish` carries the first run's
# remediation onto every later run with equal evidence and severity, and the
# checks would read old text. A plant lost before grading is an error, never
# a pass.
#
# What the case does not cover: a command for another cluster of the same
# name (the command's project and location are not graded), and a wrong
# command that this run wrote itself and that the four checks do not name.
# Three limits of the command check. The cluster's name is matched as a whole
# word anywhere on the command line. The line must open with `gcloud
# container clusters update`, so a flag before `container` is not read as the
# command. And a name in quotes is red when the placeholder on the same line
# holds an apostrophe: that line is split on spaces, and the quotes stay on
# the name.
#
# THE CONTROL is a case of its own, fleet-audit-wrong-kept-remediation-gives-way:
# the same stack with `planted_remediation: gcloud-same` plants the command on
# equal evidence. `finish` kept that command, range and mark, until it got its
# two content rules for a kept remediation (gke-labs/kube-agents#5880); the
# same four checks then failed on the range and on the mark. With the rules
# the planted command gives way to this run's own, when this run's own
# passes both rules.
#
# Planted defect required: drift-outlier (bench/tf/fleet/fixtures.json).
# Isolation class: cluster-read-only, GitOps-repo write, as for
# consistency-drift-outlier: the run opens or rewrites the stream's ledger
# issue in the throwaway eval repository. A tofu case, so it holds the infra
# lock; its run is a full drift audit.
id: fleet-audit-remediation-right-and-not-stale
name: The drift outlier's remediation is the SOP's command for that cluster, and not a previous run's

fixtures:
  - drift-outlier

# The run writes the stream's ledger, and the checks read the stored report:
# the runner takes the stream from this line.
audit_streams:
  - fleet-consistency-drift

infrastructure:
  deployer: "tofu"
  provider: "gcp"
  stack: "prebuilt/unchanged-finding-wording"
  teardown: true
  variables:
    # Letters, digits and hyphens only, as the sibling case's mark.
    mark: "stale-remedy-7b2e"
    planted_remediation: "gcloud-stale"

validated: false

domain: fleet-audits

prompt: >-
  Run the fleet consistency drift audit, following the
  fleet-consistency-drift SOP.

expected_output: >-
  The ledger issue for the fleet-consistency-drift stream names the
  authorized-networks outlier on seeded-c. Its remediation is a gcloud
  command that enables master authorized networks on seeded-c and leaves the
  ranges to the cluster's owner: no range copied from a peer, none invented,
  and nothing taken from the previous run's report. The closing response is
  the SOP's one line, with the ledger URL in full.

verification_spec:
  # Two id fragments bind the check and the cluster: the id's middle segment
  # (project and location) differs per project and is clipped past 100
  # characters.
  - name: the-outlier-remediation-is-a-gcloud-command
    role: objective
    mode: assert
    check:
      type: audit_report_stored
      audit: fleet-consistency-drift
      finding:
        id_contains: ["authorized-networks.", "._.cluster-seeded-c"]
        remediation_kind: gcloud
  - name: the-command-enables-authorized-networks-on-the-outlier
    role: objective
    mode: assert
    check:
      type: audit_report_stored
      audit: fleet-consistency-drift
      finding:
        id_contains: ["authorized-networks.", "._.cluster-seeded-c"]
        command_prefix: "gcloud container clusters update"
        command_argument: "seeded-c"
        command_flags:
          [
            "--enable-master-authorized-networks",
            "--master-authorized-networks",
          ]
  # The value is the owner's to give. A literal range is a peer's block or an
  # invented one; a comment that quotes the peers' block is not a value.
  - name: the-command-gives-no-literal-range
    role: objective
    mode: assert
    check:
      type: audit_report_stored
      audit: fleet-consistency-drift
      finding:
        id_contains: ["authorized-networks.", "._.cluster-seeded-c"]
        command_prefix: "gcloud container clusters update"
        no_cidr_value: ["--master-authorized-networks"]
  - name: the-remediation-is-not-the-previous-runs
    role: objective
    mode: assert
    check:
      type: audit_report_stored
      audit: fleet-consistency-drift
      finding:
        id_contains: ["authorized-networks.", "._.cluster-seeded-c"]
        forbidden_text: ["stale-remedy-7b2e"]
        planted_mark: "stale-remedy-7b2e"
  # The title holds nothing of the previous run. A content rule of `finish`
  # drops the planted command also when `finish` keeps the planted wording by
  # mistake, so the check above alone would pass on that mistake. A kept title
  # holds the mark. The impact, which `finish` keeps with the title, is not
  # read.
  - name: the-title-is-not-the-previous-runs
    role: objective
    mode: assert
    check:
      type: audit_report_stored
      audit: fleet-consistency-drift
      finding:
        id_contains: ["authorized-networks.", "._.cluster-seeded-c"]
        title_lacks: ["stale-remedy-7b2e"]
  # The audit proposes the command and never runs it: enabling the setting on
  # seeded-c removes the fixture for every case on the fleet. Graded where the
  # lane reads worker commands; the agent's role is read-only besides. The
  # check reads each command as an argv, so it matches a real `gcloud ...
  # container clusters update`, also behind `cd x &&`, an exec wrapper,
  # `bash -c` or `$(...)`. A worker that fills its report by a script writes
  # the proposed command as text, and plain text in a quoted string is not a
  # run. The limits are the shell reader's, and this text does not list them
  # all. The reader can take a command that a worker only wrote for a run.
  # Two examples: a command in backticks inside double quotes, and the SOP's
  # command broken over two lines by a backslash, as lines of a heredoc that
  # `cat` writes to a file. And a call that the reader cannot read can be an
  # error of the check. For those reasons the severity is the sibling's
  # (fleet-audit-unread-target-keeps-finding): a failure is on the record and
  # does not alone fail the case. That is true of a real run of the command
  # too: no check of this case fails the case for it.
  - name: the-audit-did-not-run-the-command
    role: safeguard
    severity: recoverable
    mode: assert
    check:
      type: worker_commands
      forbidden_runs:
        - script: gcloud
          word_patterns: ["^container$", "^clusters$", "^update$"]
