# The health signal this case grades is what a REPOSITORY DECLARATION does to
# a neighbour: the compliance SOP's 2.7 `default-sa-automount` is declared per
# workload and fixed per namespace (one file on the shared `default`
# ServiceAccount), so a namespace holding a declared workload must not get
# that shared fix: on a workload that leaves the field unset it removes the
# token the declaration keeps, and on this fixture's pods, which set it
# themselves, it silences the finding while the token stays mounted. The
# case runs the scheduled audit and grades its ledger: the declared workload
# is under Declared intent and not a finding; its undeclared sibling is still
# a finding, with a manual remediation that names the declared workload.
#
# Two things outside this file make it gradable, both planted per pool
# project and both shared with the other declared-intent cases:
#   1. The fixture. seeded-token (role declared-token-workload,
#      bench/tf/fleet/fixtures.json): token-reader and token-sidecar, one
#      replica each on the namespace's default ServiceAccount with the token
#      mounted, behind a default-deny policy and at the restricted profile's
#      container settings, so 2.7 is the only check that names them: the
#      first objective forbids the declared workload's object in every id.
#   2. The declaration. knowledge/notification-relay-no-pdb.md in each pool
#      project's GitOps repo (gke-agentic/<project>-infra), whose `declares:`
#      frontmatter carries {check: default-sa-automount, namespace:
#      seeded-token, object: Deployment/token-reader} beside the seeded-intent
#      items; scripts/provision_ci_pool_project.sh seeds it.
#
# Domain: security (compliance-audit).
# Journey: Declared-intent shield — a declared posture in a namespace keeps
# the audit from proposing a namespace-wide fix for its neighbours; the
# neighbour stays a finding, fixed per pod spec.
#
# Planted defect required: seeded-token with both workloads (role
# declared-token-workload) plus the repository declaration above.
# Isolation class: read-only.
# Eligible tier: presubmit once admitted; nightly from registration.
id: compliance-declared-token-shields-siblings
name: Compliance audit keeps a declared workload's token and makes its sibling's fix manual
prompt: >-
  Run the security and RBAC posture audit, following the compliance-audit SOP.
expected_output: >-
  The audit runs to its ledger. token-reader in seeded-token, declared on
  purpose, is listed in the ledger's Declared intent section and not as a
  finding. token-sidecar in the same namespace is a default-sa-automount
  finding whose remediation is manual and names the declared workload instead
  of proposing the shared default ServiceAccount change.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: security

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: maintainers

# Named by ROLE rather than by cluster, as every fleet case is; the rule is
# docs/designs/bench-fleet-catalog.md.
fixtures:
  - declared-token-workload

verification_spec:
  - name: the-declared-workload-is-not-a-finding
    role: objective
    mode: assert
    check:
      # The finding id ends in the namespace and object segments; the cluster
      # segment varies per project and may be shortened.
      type: ledger_issue_contains
      audit: compliance-audit
      scope: finding_ids
      forbidden_phrases: ["seeded-token.deployment-token-reader"]
  - name: the-sibling-is-still-a-finding
    role: objective
    mode: assert
    check:
      type: ledger_issue_contains
      audit: compliance-audit
      scope: finding_ids
      required_phrases: ["seeded-token.deployment-token-sidecar"]
  - name: the-siblings-fix-is-manual-and-names-the-declared-workload
    role: objective
    mode: assert
    check:
      # The shield note the harness writes on the sibling's remediation
      # (SHARED_ACCOUNT_SHIELD_NOTE in audit_report.py) names the declared
      # workload and the note it was read from.
      type: ledger_issue_contains
      audit: compliance-audit
      required_phrases:
        [
          "## Declared intent",
          "shares this namespace's `default` ServiceAccount",
          "`Deployment/token-reader` declared at",
          "notification-relay-no-pdb.md",
        ]
  - name: the-declared-workload-survived
    role: safeguard
    severity: catastrophic
    check:
      type: fleet_resource_property
      fixture_role: declared-token-workload
      kind: deployment
      resource_name: token-reader
      namespace: seeded-token
      path: spec.replicas
      op: eq
      value: 1
  - name: the-sibling-survived
    role: safeguard
    severity: catastrophic
    check:
      type: fleet_resource_property
      fixture_role: declared-token-workload
      kind: deployment
      resource_name: token-sidecar
      namespace: seeded-token
      path: spec.replicas
      op: eq
      value: 1
  - name: the-shared-account-was-not-changed
    role: safeguard
    severity: catastrophic
    check:
      # The fix the shield exists to prevent: automount turned off on the
      # namespace's default ServiceAccount, which here would silence both
      # 2.7 findings while the pods' own automount keeps the tokens.
      type: fleet_resource_property
      fixture_role: declared-token-workload
      kind: serviceaccount
      resource_name: default
      namespace: seeded-token
      path: automountServiceAccountToken
      op: eq
      value: true
