# WHAT THIS GRADES: agents/chat/SOUL.md §2 step 5's already-posted rule. When a
# specialist blocks on a question and KAGE_SLACK_UX is on, the gateway posts
# the question into the Slack thread itself and the wake the front door gets
# says so. The front door must answer that wake with exactly [SILENT], not
# restate the question, and route the user's typed answer back to the card
# (kanban_comment, then kanban_unblock: SOUL §1.5).
#
# HOW IT REACHES THE PATH WITHOUT SLACK. The prompt is a directive, not a
# message: kube_agents_bench/card_wake.py plants a blocked needs_input
# card on the install's board, posts its question through the image's own
# slack_ux_moments.needs_you with a stub Slack client, and builds the wake
# with the image's own notifier. The harness then sends that wake and the
# answer as two turns on one conversation. Grading reads the wake turn's
# reply as the final message, the merged trajectory of both turns, and the
# planted card's status and comments as the run left them, read before the
# harness archives it.
# What it does not reproduce: the turns arrive on /v1/responses instead of
# the Slack thread's session, and the flag is on only in the plant script's
# process.
#
# RED WITHOUT THE NOTE, GREEN WITH IT. On an image whose slack_ux_moments
# posts the question but leaves the blocked wake as upstream's, the wake does
# not say the question is posted, and the front door's SOUL says to surface
# what a blocked specialist needs, so it restates the question: the silence
# objective fails. The turn-two objectives may pass on both; they pin the
# routing half of the rule, and replay_card pins it to the planted card:
# tool_called passes on a kanban_unblock of any card.
#
# `fixtures: []`: the case plants and archives its own card and reads no
# cluster.
id: chat-question-wake-stays-silent
name: Front door stays silent on a question already posted, then routes the answer to the card
prompt: |-
  [bench:slack-question-wake]
  title: Check checkout-gateway's restarts
  question: Two clusters run checkout-gateway. Which should I look at?
  options: seeded-a | seeded-b
  answer: seeded-b
expected_output: >-
  To the wake saying the specialist's question is already posted to the user
  as its own message, the front door replies exactly [SILENT]. To the user's answer
  "seeded-b", it records the answer on the blocked card with kanban_comment
  and releases the card with kanban_unblock, without filing a new card.
infrastructure:
  deployer: noop
fixtures: []
validated: false

domain: chat-and-routing

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: jayantid

verification_spec:
  # The wake turn's reply is the final message (card_wake.merge), graded by
  # the gateway's own silence predicate: it passes only when the user would
  # see nothing. A blank reply fails; the gateway posts a warning for it.
  - name: the-wake-reply-is-silent
    role: objective
    mode: assert
    check:
      type: reply_is_silent
  # Names the restatement for a readable reason when the reply is posted.
  - name: the-wake-reply-does-not-restate-the-question
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_phrases: ["which should i look at", "seeded-a"]
  - name: the-answer-was-recorded-on-the-card
    role: objective
    mode: assert
    check:
      type: tool_called
      tool_names: ["kanban_comment"]
      require_success: true
  - name: the-card-was-released
    role: objective
    mode: assert
    check:
      type: tool_called
      tool_names: ["kanban_unblock"]
      require_success: true
  - name: the-planted-card-carries-the-answer-and-is-unblocked
    role: objective
    mode: assert
    check:
      type: replay_card
      status_not_in: ["blocked"]
      comment_phrases: ["seeded-b"]
  # recoverable, not catastrophic: a second card is a routing failure, not a
  # fleet mutation, and the catastrophic rung is admission-blind.
  - name: no-new-card-for-the-answer
    role: safeguard
    severity: recoverable
    check:
      type: none
      checks:
        - type: tool_called
          tool_names: ["kanban_create"]
