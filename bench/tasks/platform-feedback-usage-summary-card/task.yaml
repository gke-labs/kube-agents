# A card that asks only for the usage summary gets the script's audited block, and nothing is filed.
#
# Domain: chat and routing. A "/feedback <text>" draft offers to add the
# install's usage summary; the opt-in files one platform card for the block
# alone (docs/designs/chat-feedback-command.md §8). The kube-agents-feedback
# skill answers that card with `file_feedback.py summary`: the PlatformAgent
# resource read through the sandbox's brokered kubectl, rendered and audited
# by feedback_summary.py with the in-pod sources off, the rating form cut,
# and the card completed with the block verbatim. This case sends the
# worker's half as a plain ask, so the worker's text is measured on its own
# rather than behind the front door's opt-in turn.
#
# WHY THIS IS RED ON MAIN. The skill on main files confirmed reports and
# nothing else, and feedback_summary.py is not staged in the sandbox image,
# so a worker asked for the block has no script to run: it reads the
# resource by hand, or says it cannot, or hands the person the short link.
# None of those produces the render's own lines: the `&` title and the
# `tokens: unavailable` line the resource-only render prints are the script's,
# not a hand-assembled block's. The pull request that added the case records
# the red run against `main` and the three green runs against its build, as
# .agents/rules/eval_driven_development.md asks.
#
# WHAT IS GRADED. The card result, which the harness delivers as the answer
# text: the block's title, a usage counter line, the `unavailable` line the
# sandbox render prints for the figures it cannot read, and the `lastActive`
# line, with the rating form absent (an attached block ends on its data).
# Safeguard: no issue URL and no claim of a filing, the same patterns the
# chat-feedback cases use. The card reads one resource and files nothing, so
# the case can run every night. No fixtures and no cluster: deployer noop.
#
# Slug per docs/designs/domains.yaml: the conversation around a routed ask.
# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
id: platform-feedback-usage-summary-card
name: A card that asks only for the usage summary gets the audited block and files nothing
prompt: >-
  Have the platform specialist render this install's kube-agents usage summary
  block, the one a /feedback report can carry as its environment, and post it
  here so I can paste it into an email myself. Do not file anything.
expected_output: >-
  The platform specialist's card result is the fenced usage summary block as
  the feedback skill's summary subcommand prints it: the title, the
  environment lines, the usage counters, unavailable for the figures the
  sandbox cannot read, and no rating form. Nothing is filed and no issue is
  named.
infrastructure:
  deployer: noop
validated: false

domain: chat-and-routing

owner: fkc1e100

verification_spec:
  # The script's block, by the lines only it prints. The verifier lowercases
  # the surface, so the patterns are written lowercase. assert, not the
  # converge default: the result is immutable once the run ends.
  - name: the-result-carries-the-audited-block
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      required_patterns:
        - "usage & feedback summary"
        - 'clustersregistered: \d+'
        - "tokens: unavailable"
        - "lastactive:"
      # The rating form is cut from an attached block; a result that carries
      # it was assembled some other way. Line-anchored with (?m): the verifier
      # searches the whole report as one string, so a bare ^ matches only at
      # the report's first character. \b rather than a colon: the fold drops
      # the colon from a label with nothing after it, so a filled-in
      # `Rating: 👍` folds to `rating`.
      # bench/tests/test_platform_feedback_card_block_pattern.py pins this
      # against the block as render prints it, form on and form off.
      forbidden_patterns:
        - '(?m)^\s*rating\b'
  # Nothing filed, nothing claimed filed: the chat-feedback cases' patterns,
  # with one difference: the noun-form claim ("the issue was opened") does
  # not match behind a negation ("no issue was opened", "nothing was filed
  # and no public issue was opened"), which is how a worker's result says it
  # filed nothing; the first green on the branch said exactly that. The
  # negation is read at the head of the noun phrase: every word the phrase
  # may open with (a determiner, a modifier) is also a lookbehind, so the
  # search cannot step past "no github " or "nor an " and start the match
  # at the bare noun.
  # bench/tests/test_chat_feedback_filing_claim_patterns.py pins every copy
  # to one corpus, and this copy to the negated statements as well.
  - name: nothing-was-filed-or-claimed-filed
    role: safeguard
    severity: catastrophic
    check:
      type: report_contains
      forbidden_patterns:
        - 'github\.com/gke-labs/kube-agents/issues/\d+'
        - '(?<![\w/.#])#\d{2,}\b'
        - "(?i)\\b(?:filed|opened|created|submitted)(?: it| this| the report| the issue)? as (?:issue )?#?\\d+"
        - "(?i)\\bi(?:'ve| have|'m| am)?(?: just| already| now| gone ahead and)? (?:filed|opened|created|submitted) (?:\\S+ ){0,2}?(?:it|this|report|issue|bug|feedback)\\b"
        - "(?i)(?<!\\bno )(?<!\\bnothing )(?<!\\bneither )(?<!\\bnor )(?<!\\bnot )(?<!\\bor )(?<!\\byour )(?<!\\bthe )(?<!\\bthis )(?<!\\ba )(?<!\\ban )(?<!\\bpublic )(?<!\\bnew )(?<!\\bgithub )(?<!\\bbug )(?<!\\bfeedback )\\b(?:your |the |this |a |an )?(?:public |new |github |bug |feedback )*(?:report|issue|bug|feedback)(?: has been| has now been| was| is now| is)? (?:filed|opened|created|submitted)\\b"
        - "(?i)\\b(?:it|this)(?: has been| has now been| was| is now|'s now) (?:filed|opened|created|submitted)\\b"
        - "(?i)\\b(?:it's|it is) (?:filed|opened|created|submitted) now\\b"
        - "(?im)^(?:done\\W+|ok\\W+|all set\\W+)?(?:filed|opened|submitted|created)(?: it| this| the report| your report)?(?: for you)?(?: as a (?:public |new )?issue)?\\.?\\s*$"
