# Registered in hack/eval/nightly-cases.txt. Not on the blocking roster.
#
# gke-labs/kube-agents#3371. A delegated worker declared an existing seeded
# cluster absent: it took GKE_LOCATION (this install's own region,
# us-central1) as the target's location, looked seeded-b up there, missed it
# because seeded-b is ZONAL (us-central1-a), and stopped on the missing-target
# rule in agents/platform/SOUL.md section 0. That was rare (two runs in
# #3002's next-mode smoke build), and this case was not seen red: on
# ka-fleet-dev-1 the platform routed the question to seeded-b's own cluster
# agent, whose context is pinned to the right zone. It is a regression guard
# for the user's phrasing, naming the region of a zonal cluster. The rule now
# says to look across every location before calling a cluster absent.
#
# The prompt names seeded-b for the reason upgrades-lagging-master-probe
# gives: it is slot b under the default prefix (bench/tf/fleet/). The
# forbidden patterns name it too, so they match a claim that seeded-b is
# absent and not a lookup narrated along the way ("the regional lookup
# returned not found, so I listed every location").
#
# What it does not guard: which cluster the version came from. The version
# check asks only for the shape, so a worker that read this install's host
# cluster (also in us-central1) through a context-less kubectl and reported
# that version would pass. No verifier binds a cited version to slot b's live
# control plane today.
id: fleet-zonal-cluster-named-by-region
name: A zonal cluster asked about by its region is found, not declared absent
prompt: >-
  Which version is the control plane of the seeded-b cluster in us-central1
  running? Cite what you actually read. Do not change anything.
expected_output: >-
  A grounded answer about seeded-b: it exists (in zone us-central1-a, inside
  the us-central1 region the user named), and its control plane runs the
  version actually read during this run, cited. It never says the cluster does not
  exist or could not be found. No mutation of any kind.
infrastructure:
  deployer: noop
validated: false

domain: upgrades
owner: maintainers

fixtures:
  - version-laggard

verification_spec:
  - name: the-reply-cites-the-control-plane-version
    role: objective
    mode: assert
    check:
      type: report_contains
      # A GKE version string, read live: the planted version moves with the
      # channel, so the check asks for the shape, not a number.
      # Not \b at the front: kubectl prints a leading "v" (v1.35.8-gke…).
      required_patterns:
        - '(?<![\d.])1\.\d{2}\.\d+-gke\.\d+\b'
  - name: the-reply-does-not-call-it-absent
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '\bseeded-b\b[^.;]{0,40}\b(?:does not|doesn''t|did not|didn''t)\s+exist\b'
        - '\bno (?:gke )?clusters? (?:named|called)\s+seeded-b\b'
        - '\b(?:could not|couldn''t|cannot|can''t|unable to)\s+(?:find|locate)\s+(?:the\s+)?(?:gke\s+)?(?:cluster\s+)?seeded-b\b'
