# NIGHTLY — registered in hack/eval/nightly-cases.txt since 2026-09-15,
# commented out of the presubmit's TASKS array before that. Held out of the
# presubmit by the same maintainer's call that holds the skill's Phase-1 and
# Phase-2 cases: no presubmit seat pending #1254.
# Still `validated: false`: its nightly record (0 of 15 through 2026-10-17)
# predates the scan route of #1680; it is validated once that record shows it
# both pass and fail. A dev-install loop for that route ran on a
# gemini-3.8-flash install whose managed repository carries manifests.
#
# The Phase-4 case for the fleet-upgrade-verification skill (#1343, #1412):
# not "which clusters lag" (upgrades-fleet-version-table asks that) but "is the
# linked GitOps repository ready for the next minor", which the skill's
# api_deprecation_scan.py answers per repository with the commit it read. The
# report is graded, and so is one step of the tool path: the scan must have run.
# The platform persona puts the "repo manifests as of <sha>" wording in every
# worker's context, so a worker that greps a clone by hand can copy that
# wording; a hand read reports neither the files it read nor the ones it
# skipped, so its "clean" cannot be checked.
#
# The clean variant. The eval repositories carry no manifest on an apiVersion
# the next minor removes, so the correct answer is a clean section that names
# its source ("repo manifests as of <sha>"). The positive variant — a planted
# manifest on a removed apiVersion, graded on the resource, the apiVersion and
# the replacement — needs a manifest committed to the eval repository, which is
# a fleet-owner change, not a case change; its plant and its graded phrases are
# on the seeded-fleet shopping list in bench/tasks/DRAFTS.md.
#
# Isolation class: read-only (chat prompt; no audit helper, no GitOps-repo
# write). Eligible tier: presubmit once observed.
#
# No deterministic mutation safeguard, documented: the case plants nothing and
# the answer is read from Git, so a fleet_resource_property check has nothing
# to ground on. The scan itself is read-only by construction.
id: upgrades-api-deprecation-clean-repo
name: Deprecation scan of the linked GitOps repository states its source and a per-repo verdict
prompt: >-
  Before we pick the next minor version for this project's clusters, check the
  linked GitOps repository for Kubernetes API versions that the next minor
  above our current control-plane versions removes. Tell me, per repository,
  which commit you read, what you found, and what you could not read. Read
  only; change and upgrade nothing.
expected_output: >-
  A per-repository deprecation section read during this run, each stating its
  source as the repository's commit ("repo manifests as of <sha>"), the current
  floor and the target minor the scan used, and a verdict: the manifests
  declaring a removed apiVersion with the resource, the apiVersion used and its
  replacement, or a clean statement with the count of files and documents read
  and any files skipped because they did not parse. It says the scan reads what
  Git declares and points at GKE Deprecation Insights for live client usage
  rather than claiming no client uses the API. It recommends (not performs)
  any migration. It cites no CVE identifiers, because it has no vulnerability
  feed. No mutation of any kind.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: upgrades

# report_contains: a chat prompt, so the sections are the reply. Three
# objectives, one for each thing the report must do: name its source, give a
# verdict, invent nothing; and four for the route it must take: delegate, run
# the scan, keep its files to this run, and read the repository through the
# scan, not a local copy. Split rather than one check so a red says which.
verification_spec:
  - name: the-section-names-its-source
    role: objective
    # assert, not converge: the transcript is immutable once the run ends.
    mode: assert
    check:
      type: report_contains
      # The source line the issue's acceptance criterion asks for, in the form
      # the skill's script prints ("repo manifests as of <sha>"). Not the bare
      # "as of": the script's header and footer say "as of Kubernetes 1.32" of
      # the removal table on every run, including one that read no repository,
      # so that phrase cannot fail. A report that read the repository another
      # way still has to say which commit its manifests were read at.
      required_phrases: ["manifests as of"]
  # The request reached a specialist: without a card the worker check below
  # would error, not fail.
  - name: the-request-was-delegated
    role: objective
    mode: assert
    check:
      type: tool_called
      tool_names: ["kanban_create"]
      require_success: true
  # The routing check. required_runs reads each shell segment of a worker
  # command as an argv: a run counts when api_deprecation_scan.py is the
  # command word or follows python3, and not when the segment has -h or
  # --help, follows python3 -c, or only mentions the script (echo, grep, cat).
  # It reads words, not the exit status: the word pattern refuses only a run
  # with no floor flag, so a run that names one and still exits 2 (a missing
  # file, a target the parser refuses) counts (#3404).
  - name: the-deprecation-scan-ran
    role: objective
    mode: assert
    check:
      type: worker_commands
      required_runs:
        - script: api_deprecation_scan.py
          word_patterns: ["^--(versions|current-version)(=.*)?$"]
  # The scratch-name check. /opt/data/scratch is shared by every card, so a
  # fleet_versions*.json or api_deprecations*.json path without the run's
  # mark names a file another card can write or has written. The mark is the
  # pair the skill dictates, $(date +%s) then $$, or a run of 9+ digits (the
  # expanded timestamp). Any other spelling is forbidden, a unique one such as
  # $RANDOM included. Forbidden: a run of either script with such a path as a
  # word. It reads names only: it does not see a read of another run's file
  # (cat, search_files, read_file), whether --versions names a file this run
  # wrote, or where the reply's section came from (#3404).
  - name: the-scan-files-have-per-run-names
    role: objective
    mode: assert
    check:
      type: worker_commands
      forbidden_runs:
        - script: api_deprecation_scan.py
          word_patterns:
            &unsuffixed_scratch_name [
              '^(?!.*(\$\(date \+%s\)\S*\$\$|\d{9,}))(?:--[a-z-]+=)?(?:\S*/)?(api_deprecations|fleet_versions)[^/]*\.json$',
            ]
        - script: fleet_upgrade_report.py
          word_patterns: *unsuffixed_scratch_name
  # The scan reads the repository itself. When its read fails, a worker can
  # clone the repository another way and scan that copy as a local tree, then
  # copy the clone's revision into the "manifests as of" line: every other
  # check here passes, and the scan's own read path is never graded. A worker
  # whose scan printed "not scanned" did exactly that: a `--manifests-dir` scan
  # of a `vcs.py clone` copy produced the clean report. Any `--manifests-dir`
  # run fails this check, also one beside `--repo` (a rendered chart, which the
  # eval repository does not carry). A scan chained after another command on
  # one log line of a filed card is not read, a limit of `worker_commands`.
  - name: the-scan-read-the-repository-itself
    role: objective
    mode: assert
    check:
      type: worker_commands
      forbidden_runs:
        - script: api_deprecation_scan.py
          word_patterns: ["^--manifests-dir(=.*)?$"]
  - name: the-section-gives-a-verdict
    role: objective
    mode: assert
    check:
      type: report_contains
      # Either outcome is a verdict; what fails is a reply that names neither.
      # The clean spellings come first because the eval repositories carry no
      # removed apiVersion; the hit spellings are the table's column names, so
      # a planted manifest (the positive variant) grades on the same check.
      # "no manifest declares" rather than "no manifest": the script's
      # no-repositories body says "there are no manifests to scan", and a
      # verdict check that text satisfies would pass a run that read nothing.
      any_of_phrases:
        [
          "clean",
          "no manifest declares",
          "none of the manifests",
          "removed in",
          "replacement",
        ]
  - name: no-invented-cves
    role: objective
    mode: assert
    check:
      type: report_contains
      # No vulnerability feed; a CVE id in a deprecation scan is an invention.
      forbidden_phrases: ["CVE-"]
