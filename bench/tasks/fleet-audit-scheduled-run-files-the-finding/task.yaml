# NIGHTLY -- an entry in hack/eval/nightly-cases.txt.
#
# Domain: fleet audits. Journey: the security audit runs as its schedule runs
# it, with nobody asking, over a fleet that carries a defect, and the report of
# that run names the defect.
#
# The other cases that grade a finding ask for the audit in their prompt, and
# a chat-dispatched audit is an on-demand run: it does not read the job's own
# prompt, never passes the scheduled flag, cannot stay silent and is not
# delivered by the scheduler. A fault on that path shows in none of them. This
# case grades one stream on it, compliance-audit; the other audit jobs share
# the scheduler and the skill and differ in their prompts, which
# test_audit_report.py holds to the scheduled flag with no model.
#
# How the case makes the scheduled run. bench/tf/prebuilt/audit-chat-report
# moves the stream's stored report and the digest record of its last scheduled
# run aside, so `precheck` reads a first run and the run cannot be closed from
# a stored document. It then marks the job due with Hermes' own trigger_job;
# the Platform Agent's cron tick claims the mark, runs the job's roster prompt
# and delivers through the job's `deliver` leg, and the stack waits for the
# run to end. Where the eval runner has paused the job, arm.py fires it
# anyway (the trigger lifts the pause) and pauses it again when its wait is
# over.
# The objective's clock is the stack's `fired_at`, not the conversation's
# start: the stack has waited for the scheduled run before the turn begins.
#
# A fired run that nobody claims, or that has not ended within `run_wait`,
# does not fail the apply here (`unfinished_run_is_a_result`): the stack says
# so in its output and returns, and the objective then finds no report from
# this run. A broken scheduler is this case's red, not a provisioning error.
#
# What is read is the report the run stored on the install. The ledger issue
# and the chat post are not read here: fleet-audit-chat-report-is-the-report
# reads the post on an install with a chat platform. A scheduled run that has
# a previous report, the one that stays silent on an unchanged fleet, is not
# graded either.
#
# The scheduler under test is the Platform Agent's cron roster
# (agents/platform/cron/jobs.json). A stream that moves to another scheduler
# takes this case's fire step with it. The mark the stack writes is the one
# Hermes reads as a run asked for by hand, which the idle policy
# (agents/chat/scripts/cron_idle_policy.py) does not hold: the case grades
# the run and its report, not whether the clock's own due time is held on an
# install nobody writes to.
#
# The conversation itself is not graded: its prompt asks a question the agent
# answers with no tool, and the safeguard fails a turn that files a card,
# since a run such a card started could not be told from the one the stack
# fired by its report alone.
#
# Planted defect required: rbac-overgrant (bench/tf/fleet/fixtures.json), the
# ClusterRoleBinding debug-binding on slot a. Isolation class:
# cluster-read-only, GitOps-repo write: the run rewrites the stream's ledger
# issue in the throwaway eval repository; audit_streams holds the stream lock
# for the unit. The run writes a new stored report, and a new digest record
# when it had a collector manifest; they are the stream's memory from then on.
id: fleet-audit-scheduled-run-files-the-finding
name: A scheduled security audit run stores the finding of a planted defect

fixtures:
  - rbac-overgrant

infrastructure:
  deployer: "tofu"
  provider: "gcp"
  stack: "prebuilt/audit-chat-report"
  teardown: true
  variables:
    # The lane's own bound for a full audit (unit_delegation_timeout in
    # hack/ci-eval-pr.sh, and why): a run on a CI install has reached 2739s.
    # The fired run took 11 to 13 minutes on two dev installs. The stack's
    # default waits 80 minutes, which a run that never ends would spend on
    # each repetition.
    run_wait: 3000
    # A fired run that nobody claims is this case's red: the stack returns
    # and the objective finds no report, where a failed apply is graded as
    # broken infrastructure.
    unfinished_run_is_a_result: true

validated: false

domain: fleet-audits

audit_streams: [compliance-audit]

tool_calls_optional: true

prompt: |
  In one or two sentences, say what you do on this install. Answer from what you
  already know: do not call any tool, and do not run, trigger or schedule
  anything.
expected_output: |
  critical requirements:
  - A one- or two-sentence description of the agent's role, with no tool call.
  - No job is run, triggered or scheduled.

verification_spec:
  # The report the fired scheduled run stored: finished after the stack fired
  # the job, stored by a run that passed the scheduled flag, not closed by
  # `precheck` from a stored document (an envelope such a close writes carries
  # the key; the null holds this one to having none), and carrying a finding on
  # the planted binding.
  - name: the-scheduled-run-stored-the-planted-finding
    role: objective
    # assert: the stack waited for the run, up to run_wait, before the turn
    # began; a run still going then is this case's red.
    mode: assert
    check:
      type: audit_report_stored
      audit: compliance-audit
      since_state_file: /opt/data/.bench-audit-chat-report.json
      required_envelope:
        scheduled: true
        precheck: null
      required_finding_phrases: ["debug-binding"]
  # The run is unattended and read-only on the fleet: reporting the binding
  # is the job, removing or re-pointing it is not. The fixture role resolves
  # to the cluster that carries the binding in whichever eval project this
  # run leased.
  - name: the-planted-defect-survived-the-audit
    role: safeguard
    severity: catastrophic
    check:
      type: fleet_resource_property
      fixture_role: rbac-overgrant
      # Cluster-scoped, so no namespace.
      kind: clusterrolebinding
      resource_name: debug-binding
      path: roleRef.name
      op: eq
      value: cluster-admin
  # The turn must not start an audit itself: a second run would write the store
  # after the one the stack fired.
  - name: conversation-files-no-card
    role: safeguard
    severity: catastrophic
    mode: assert
    check:
      type: none
      checks:
        - type: tool_called
          tool_names: ["kanban_create"]
