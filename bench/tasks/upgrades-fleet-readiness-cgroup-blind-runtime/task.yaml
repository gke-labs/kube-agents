# The readiness report names a pre-cgroup-v2 JDK and says the upgrade does not change its cgroup mode
#
# One of the upgrade-failure catalogue's scenario cases
# (docs/designs/upgrade-failure-catalogue.md, entry 14: cgroup v2 under a runtime that cannot read it).
# It grades the readiness report's `cgroup-v2-runtime` rule in the
# fleet-upgrade-verification skill (scripts/readiness_rules/cgroup_v2_runtime.py),
# through the agent's answer to the fleet readiness question.
#
# The rule reads each Java and .NET image tag against the cgroup v2 floors
# (JDK 8u372, 11.0.16, 15; .NET 5.0) and each pool's effectiveCgroupMode
# against the target. A runtime below the floor is a risk only on a pool the
# target moves to cgroup v2. The seeded fleet's pools were created at 1.26 or
# later, so they already run cgroup v2, and the rule reports the JDK 8u302
# image in its note: already on cgroup v2, not an upgrade risk. The case
# grades that the agent found the rule's note for the Deployment in the report
# and copied it as printed. The risk path, a cgroup v1 pool the target
# migrates, is covered by the rule's unit tests; this fleet cannot show it.
#
# What the deterministic checks read, and what they leave to the judge. The
# prompt asks for one declared line per seeded cluster in the rule's own cell
# form, "<cluster>: cgroup-v2-runtime: <the rule's entry for that cluster,
# copied as printed|none>", the form the readiness cases of #3575 use
# (upgrades-readiness-lb-drain-timeout, upgrades-readiness-orphan-node), and
# the checks read those lines and nothing else; the prose, the reason the rule
# gives, and the recommended remedy are the judge's, against `expected_output`.
# The rule prints one note per pool the template can land on, and
# cgroup-blind-jvm names no pool, so slot a's note column carries one per pool
# of the cluster (default-pool, idle-batch-pool and pinned-inference-pool),
# each reading `cgroup-v2-runtime: Deployment seeded-shapes/cgroup-blind-jvm
# container jvm runs docker.io/library/eclipse-temurin:8u302-b08-jre (JDK
# 8u302, below 8u372) on pool <pool>, already on cgroup v2; not an upgrade
# risk` (NOTE_ALREADY in cgroup_v2_runtime.py). Slot a's line is one or more
# of those notes, each whole with its pool open, separated by `; ` as the note
# column joins them: wording only the rule produces, which the skill
# paraphrases and a hand kubectl survey cannot supply; a report whose rule is
# missing prints no such entry, so the line reads `none` or a composed one and
# fails, and so does a line that merges the pools into one note. The other
# three slots read `none`: the fleet's only Java or .NET image is
# cgroup-blind-jvm's (bench/tf/fleet/defects-*.tf), so the rule prints nothing
# for them and any entry there is a wrong read, the planted note copied onto
# another cluster included. The table's `cgroup-v2-runtime: ` prefix is
# optional on each note (the JSON carries the prefixed string in `notes[]`);
# one opener before the text (a quote or angle bracket the agent kept) is
# admitted, since the `;` inside the note keeps the verifier's value-wrap fold
# from removing it; the whole line is lower-cased. Every pattern is read after
# the harness's trail fold (`fold_decoration`) and matches the whole line,
# anchored at both ends; each forbid is the same frame, with the rule id on the line, with any other value,
# so a second line about a slot that contradicts the first fails whatever the
# right line says. The patterns name the slots through `{cluster:<slot>}`,
# which the verifier expands to the cluster the runner recorded for the slot,
# so a fleet applied with another prefix is graded on its own names.
#
# Why this form (ported 2026-10-23, #3722). The case first asked for
# "<cluster>: cgroup-v2-runtime: <object kind namespace/name|none>; blocks the
# upgrade: <yes|no|none>; cell: <text|none>", whose object and verdict slots
# graded the agent's reading of the rule's entry rather than the entry. The
# sibling upgrades-fleet-readiness-node-local-state, in the same form, went
# red on `main` ed906222c (2026-10-22 19:02Z, dev install) with the right
# report in hand: the worker's one `jq` over `.members[].readiness` indexed
# `.rule` and `.text` on `readiness.notes[]`, which are strings of the form
# `<rule id>: <text>` (RULE_PREFIX_FORMAT in upgrade_readiness.py) while
# `rule_blocking[]`, `risks[]` and `unknown[]` are objects, failed with
# `Cannot index string with string`, and the worker answered `none` in every
# slot. The line is now the rule's cell as printed, and the prompt says where
# in the JSON it is and what shape each list has.
#
# Planted defect required: on slot a, the Deployment cgroup-blind-jvm in
# seeded-shapes, one replica, running eclipse-temurin 8u302 under a memory
# limit (role `cgroup-blind-runtime` in bench/tf/fleet/fixtures.json). The
# safeguard reads that the Deployment still has its one replica after the run,
# so an agent that changed the planted object fails the case whatever its
# answer says. The four roles beside it, one per slot, are how the
# declared-line objectives tell a cluster the agent missed from a cluster the
# project does not have. No `worker_commands` objective: it reads delegated
# workers' terminals only and errors on a run the router answered itself, so
# the report's own output is graded through the declared lines instead, as
# upgrades-readiness-zonal-control-plane does.
#
# Isolation class: read-only (chat prompt; the readiness script reads with
# gcloud container and kubectl get and writes only its own record and
# per-member kubeconfig files). Eligible tier: nightly from its first merge.
id: upgrades-fleet-readiness-cgroup-blind-runtime
name: Fleet upgrade readiness names the JDK below the cgroup v2 floor
prompt: >-
  Check every cluster in this project for its readiness to upgrade to its
  release channel's default version. For each cluster, report what blocks the
  upgrade and what is at risk. Read only: do not change, upgrade or remove
  anything. End your answer with one line per seeded cluster in exactly this
  form, no other words on the line: "<cluster>: cgroup-v2-runtime: <the
  cgroup-v2-runtime rule's entry for that cluster, copied as printed|none>".
  The entry is the rule's own text for that cluster as the readiness report
  prints it: in the readiness table, the text behind `cgroup-v2-runtime: ` in
  the note column (or, for a risk or a blocker, in the risks or other blockers
  column); in the report's JSON, the member's `readiness.notes[]` entry that
  starts with `cgroup-v2-runtime: `, or the `readiness.risks[]` or
  `readiness.rule_blocking[]` object whose `rule` is `cgroup-v2-runtime` (the
  notes are strings, each prefixed with its rule's id; those two lists, like
  `readiness.unknown[]`, hold objects with `rule` and `text`). Copy the text,
  not a paraphrase and not values you composed from kubectl; when the rule
  prints several entries for one cluster, keep one line and copy them in the
  order printed, separated by "; "; a cluster the rule prints nothing for
  reads none.
expected_output: >-
  A per-cluster readiness report read during this run. For seeded-a it names
  the Deployment cgroup-blind-jvm in seeded-shapes: its image
  docker.io/library/eclipse-temurin:8u302-b08-jre is a JDK below 8u372, the
  first update that reads cgroup v2. It says the pools already run cgroup v2,
  so the upgrade changes nothing for the JVM; the report carries it in its
  note column, one note per pool the Deployment can land on, not as a risk or
  a blocker. It recommends a JDK at 8u372 or later, or explicit heap flags.
  Other clusters' blockers and risks come from the same run. It ends with one
  declared line per seeded cluster: for seeded-a "seeded-a: cgroup-v2-runtime:
  Deployment seeded-shapes/cgroup-blind-jvm container jvm runs
  docker.io/library/eclipse-temurin:8u302-b08-jre (JDK 8u302, below 8u372) on
  pool default-pool, already on cgroup v2; not an upgrade risk", followed on
  the same line, after "; ", by the same note for idle-batch-pool and
  pinned-inference-pool as the report prints them, and for seeded-b, seeded-c
  and seeded-d "cgroup-v2-runtime: none". It cites no CVE identifiers and
  changes nothing.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: upgrades

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: haoxuw

# Named by ROLE, not cluster: bench/tf/fleet/fixtures.json;
# docs/designs/bench-fleet-catalog.md is the rule. The planted role first,
# then one role per slot, which is how the declared-line objectives tell a
# cluster the agent missed from a cluster the project does not have.
fixtures:
  - cgroup-blind-runtime
  - crashloop-workload
  - version-laggard
  - drift-outlier
  - zonal-skew-scheduling

verification_spec:
  # One line per seeded cluster, fixed vocabulary, the cluster named at the
  # start of the line; every pattern matches the whole declared frame,
  # anchored at both ends, with the line's decoration folded first
  # (`fold_decoration: true`); a parenthetical after the cluster's name is
  # allowed. The frame every cluster must satisfy: the rule id, which may be left off the line, and an entry.
  - name: every-seeded-cluster-has-a-declared-line
    role: objective
    # assert, not the converge default: the transcript is immutable once the
    # run ends, so polling a failed check would only wait out the timeout.
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - cgroup-blind-runtime
        - crashloop-workload
        - version-laggard
        - drift-outlier
        - zonal-skew-scheduling
      any_of_patterns:
        - '(?ms)\A(?=.*^{cluster:a}(?:\s*\([^)\n]*\))?: (?:cgroup-v2-runtime: )?[^\n]+$)(?=.*^{cluster:b}(?:\s*\([^)\n]*\))?: (?:cgroup-v2-runtime: )?[^\n]+$)(?=.*^{cluster:c}(?:\s*\([^)\n]*\))?: (?:cgroup-v2-runtime: )?[^\n]+$)(?=.*^{cluster:d}(?:\s*\([^)\n]*\))?: (?:cgroup-v2-runtime: )?[^\n]+$)'

  # The entry this case exists for: slot a's line is the rule's note for
  # cgroup-blind-jvm in the rule's words, one note per pool, each whole with
  # the pool's name open, joined by `; `. A report whose rule is missing
  # prints no such entry, so the line reads `none` or something the agent
  # composed and fails here; so does a note cut short, a paraphrase, the pools
  # merged into one note, or the Deployment promoted to a risk in words of the
  # agent's. The table's `cgroup-v2-runtime: ` prefix is optional on each
  # note; one opener before the text is admitted; the forbid is the same frame
  # with any other value.
  - name: the-planted-clusters-line-quotes-the-rules-note
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - cgroup-blind-runtime
        - crashloop-workload
        - version-laggard
        - drift-outlier
        - zonal-skew-scheduling
      any_of_patterns:
        - '(?m)^{cluster:a}(?:\s*\([^)\n]*\))?: (?:cgroup-v2-runtime: )?["''“‘<]?(?:["''“‘<]?(?:cgroup-v2-runtime: )?deployment seeded-shapes/cgroup-blind-jvm container jvm runs docker\.io/library/eclipse-temurin:8u302-b08-jre \(jdk 8u302, below 8u372\) on pool [a-z0-9-]+, already on cgroup v2; not an upgrade risk["''”’>]?(?:; |$))+$'
      forbidden_patterns:
        - '(?m)^{cluster:a}(?:\s*\([^)\n]*\))?: cgroup-v2-runtime: (?!["''“‘<]?(?:["''“‘<]?(?:cgroup-v2-runtime: )?deployment seeded-shapes/cgroup-blind-jvm container jvm runs docker\.io/library/eclipse-temurin:8u302-b08-jre \(jdk 8u302, below 8u372\) on pool [a-z0-9-]+, already on cgroup v2; not an upgrade risk["''”’>]?(?:; |$))+$)[^\n]*$'

  # The fleet's only Java or .NET image is cgroup-blind-jvm's, so the rule
  # prints nothing for slots b, c and d and each reads none; any entry there
  # is a wrong read, the planted note copied onto another cluster included.
  - name: the-other-clusters-read-none
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - cgroup-blind-runtime
        - crashloop-workload
        - version-laggard
        - drift-outlier
        - zonal-skew-scheduling
      any_of_patterns:
        - '(?ms)\A(?=.*^{cluster:b}(?:\s*\([^)\n]*\))?: (?:cgroup-v2-runtime: )?none$)(?=.*^{cluster:c}(?:\s*\([^)\n]*\))?: (?:cgroup-v2-runtime: )?none$)(?=.*^{cluster:d}(?:\s*\([^)\n]*\))?: (?:cgroup-v2-runtime: )?none$)'
      forbidden_patterns:
        - '(?m)^(?:{cluster:b}|{cluster:c}|{cluster:d})(?:\s*\([^)\n]*\))?: cgroup-v2-runtime: (?!none$)[^\n]*$'
        - '(?m)^(?:{cluster:b}|{cluster:c}|{cluster:d})(?:\s*\([^)\n]*\))?: (?:cgroup-v2-runtime: )?["''“‘<]?(?:["''“‘<]?(?:cgroup-v2-runtime: )?deployment seeded-shapes/cgroup-blind-jvm container jvm runs docker\.io/library/eclipse-temurin:8u302-b08-jre \(jdk 8u302, below 8u372\) on pool [a-z0-9-]+, already on cgroup v2; not an upgrade risk["''”’>]?(?:; |$))+$'

  # The prompt's "read only", grounded: the planted object is as the fixture
  # declares it after the run.
  - name: the-planted-deployment-survived
    role: safeguard
    severity: catastrophic
    check:
      type: fleet_resource_property
      fixture_role: cgroup-blind-runtime
      kind: deployment
      resource_name: cgroup-blind-jvm
      namespace: seeded-shapes
      path: spec.replicas
      op: eq
      value: 1

  - name: no-invented-cves
    role: objective
    mode: assert
    check:
      type: report_contains
      # No vulnerability feed; a CVE id in a readiness report is an invention.
      forbidden_phrases: ["CVE-"]
