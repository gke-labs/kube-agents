# Probe for multi-pool Cluster Autoscaler scan delays on dynamic workloads
# (#2900, #3008, #7096): when a cluster runs 28 specialized/tainted GPU node
# pools and a controller spawns short-lived `render-<uuid>` Deployments without
# a nodeSelector or ComputeClass selector, Cluster Autoscaler must evaluate
# scheduling predicates across every pool on each scan, delaying scale-up by
# 10-14+ minutes. Because no manifest in Git describes generated UUID names,
# durable remediation sets namespace-level
# `cloud.google.com/default-compute-class` (or `-non-daemonset`) plus a
# `CapacityBuffer` (`capacitybuffers.autoscaling.x-k8s.io`, apiVersion
# `autoscaling.x-k8s.io/v1beta1`) for warm headroom.
#
# Per docs/designs/bench-case-format.md, the prompt gives no verdict slug and
# enumerates none of the answer terms so echoing the prompt cannot pass. Each
# objective grades one free-form labeled line (`CAUSE:`, `TARGETING:`,
# `HEADROOM:`) under `fold_decoration: true`:
# - `CAUSE:` must name per-pool / multi-pool evaluation, simulation, or
#   predicate scanning across the pools (not a prompt echo or stockout).
# - `TARGETING:` must name `cloud.google.com/default-compute-class` (or
#   `-non-daemonset`) on the `TARGETING:` line itself, unnegated and unhedged.
# - `HEADROOM:` must name `capacitybuffers.autoscaling.x-k8s.io` or
#   `CapacityBuffer` paired with the `autoscaling.x-k8s.io` API group on the
#   `HEADROOM:` line itself (prose "capacity buffer" without the API group
#   fails).
# `bench/tests/test_capacity_multipool_ca_scan_delay_verdict.py` pins all three
# objectives on both positive and negative replies.
#
# The prompt's sentence about a hand-off is for the Planning Agent, so a
# delegated card keeps the three labeled-line instructions.
#
# Planted defect required: none. deployer: noop, no fixture, no cluster read.
#
# Isolation class: read-only (no cluster touched at all).
# Tier: nightly (hack/eval/nightly-cases.txt).
id: capacity-multipool-ca-scan-delay-capacitybuffer
name: Multi-pool CA scan delays on dynamic UUID workloads are diagnosed as per-pool evaluation and fixed with namespace default ComputeClass and CapacityBuffer

owner: fkc1e100
domain: capacity

prompt: >-
  Our GKE cluster has 28 specialized and tainted GPU node pools. A controller
  creates short-lived Deployments named `render-<uuid>` in namespace
  `imaging-jobs` through the Kubernetes API with no `nodeSelector` or
  ComputeClass selector, and no manifest in Git describes them. During traffic
  bursts, Cluster Autoscaler takes 12 minutes to trigger a scale-up even though
  quota is available. What causes this scale-up delay, and what two
  Kubernetes/GKE mechanisms give durable targeting for these generated
  Deployments and warm node headroom during bursts? End your answer with three
  lines, each on its own line: `CAUSE: ` stating the root cause of the
  12-minute delay; `TARGETING: ` naming only the exact field, flag, or label
  key for durable targeting; and `HEADROOM: ` naming only the exact
  Kubernetes/GKE API resource (including its API group) or flag for warm
  headroom. If you hand this question to another agent, pass these instructions
  word for word, and keep its three lines in your reply. Do not run commands
  and do not apply anything.
expected_output: >-
  Untargeted pods force Cluster Autoscaler to evaluate scheduling predicates
  across all 28 specialized and tainted node pools on each scan loop, delaying
  scale-up by 10-14+ minutes. Because the controller creates ephemeral
  `render-<uuid>` Deployments outside Git, per-Deployment GitOps pull requests
  cannot keep up; fix it durably by setting the namespace label
  `cloud.google.com/default-compute-class` on `imaging-jobs` so new pods
  automatically inherit ComputeClass targeting, and provisioning a
  `CapacityBuffer` (`capacitybuffers.autoscaling.x-k8s.io`,
  `autoscaling.x-k8s.io/v1beta1`) to keep warm spare headroom during bursts.
  CAUSE: Untargeted pods force Cluster Autoscaler to evaluate scheduling
  predicates per node pool across all 28 pools on each scan loop.
  TARGETING: cloud.google.com/default-compute-class
  HEADROOM: capacitybuffers.autoscaling.x-k8s.io
infrastructure:
  deployer: noop
validated: false

verification_spec:
  - name: cause-names-per-pool-evaluation
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      required_patterns:
        - "(?m)^cause:(?=[^\\n]*\\b(?:evaluat(?:e|es|ed|ing|ion)|simulat(?:e|es|ed|ing|ion)|scan(?:s|ned|ning)?|predicates?|iterat(?:e|es|ed|ing|ion)|check(?:s|ed|ing)?|test(?:s|ed|ing)?|prob(?:e|es|ed|ing)|walk(?:s|ed|ing)?)\\b)(?=[^\\n]*(?:(?<![a-z0-9-])per[\\s-]+(?:node[\\s-]+)?pool(?![a-z0-9-])|\\b(?:every|each|all)(?:\\s+of)?(?:\\s+the)?(?:\\s+28)?(?:\\s+(?:specialized|tainted|gpu|node|candidate|eligible|matching|non-matching|unrelated|individual|separate|distinct))*\\s+(?:node[\\s-]+)?pools?\\b|\\bacross(?:\\s+all)?(?:\\s+the)?(?:\\s+28)?(?:\\s+(?:specialized|tainted|gpu|node|candidate|eligible|individual|separate|distinct))*\\s+(?:node[\\s-]+)?pools?\\b|\\bmulti[\\s-]+pool\\s+(?:evaluation|simulation|scan(?:ning)?|predicate)))[^\\n]+$"
      forbidden_patterns:
        - "(?m)^cause:[^\\n]*\\?"
        - "(?m)^cause:[^\\n]*\\b(?:not|no|never|isn't|aren't|doesn't)\\s+(?:a\\s+|caused\\s+by\\s+|due\\s+to\\s+)?(?:per[\\s-]+(?:node[\\s-]+)?pool|multi[\\s-]+pool|scan(?:\\s+loop)?|predicate|evaluation|simulation)"
  - name: targeting-names-namespace-default-compute-class
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      any_of_patterns:
        - "(?m)^targeting:\\s*(?:[^\\n]*[\\s\"'\\[(])?cloud\\.google\\.com/default-compute-class(?:-non-daemonset)?(?![a-z0-9-])"
      forbidden_patterns:
        - "(?m)^targeting:[^\\n]*(?:\\bnot\\b|\\bno\\b|\\bnever\\b|don't|\\binstead\\b|per-deployment|nodeselector|;|\\?)"
  - name: headroom-names-capacitybuffers-api-resource
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      any_of_patterns:
        - "(?m)^headroom:[^\\n]*(?<![a-z0-9.-])capacitybuffers\\.autoscaling\\.x-k8s\\.io(?:/v[0-9a-z]+)?(?![a-z0-9/-]|\\.[a-z0-9])"
        - "(?m)^headroom:(?=[^\\n]*(?<![a-z0-9-])capacitybuffers?(?![a-z0-9-]))(?=[^\\n]*(?<![a-z0-9.-])autoscaling\\.x-k8s\\.io(?:/v[0-9a-z]+)?(?![a-z0-9/-]|\\.[a-z0-9]))[^\\n]+$"
      forbidden_patterns:
        - "(?m)^headroom:[^\\n]*(?:\\bnot\\b|\\bno\\b|\\bnever\\b|don't|\\binstead\\b|--min-nodes|\\bmin-nodes\\b|;|\\?)"
  - name: front-door-stays-out-of-the-worker-verbs
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        # Same delegation-boundary safeguard as knowledge-grounding-sources-probe.
        - type: tool_called
          tool_names: ["kanban_complete", "kanban_block", "kanban_heartbeat"]
