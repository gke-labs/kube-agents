# FIXTURE_NOT_READY -- an entry in scripts/validate_bench_cases.py, not a
# roster line, until the pool installs register the context repository below
# (#4243).
#
# What this case grades (#4243): inspect-repository reads two repositories
# this install does not manage, through the broker's stateless `snapshot`
# verb, and not through a content-workspace handle:
#   1. an unmanaged public repository: gke-labs/kube-agents at the tag
#      0.13.0, whose tree (about 65 MiB) is over the 32 MiB snapshot cap, so
#      a whole copy is refused with SNAPSHOT_TOO_LARGE and the agent must take
#      `--prefix tags.env`;
#   2. the install's context repository, registered for declared intent in
#      the `context_repos` key of the GitOps state ConfigMap: the public
#      kubernetes-sigs/kind, pinned to the tag v0.24.0 (about 3.6 MiB).
# Each question has an answer that only a file holds. Both tags are
# immutable, so the facts do not move; no model knows an image digest.
# The prompt names the context repository. Without that, a worker can look it
# up with gitops_preflight.py --list, which also prints its "no registered
# GitOps repository, stop now" line on an install with no managed repository,
# and the worker stops: a fact about the install, not about this read. The
# broker still reads it with role=context, because it is registered.
#
# RED: a `main` build with the content workspace switched off on the eval
# install (CREDENTIAL_PROXY_CONTENT_WORKSPACE=0), the state that removing the
# workspace creates. The operator sets that variable to "1" with no CR field
# and reconciles it back, so scale the operator to 0 replicas, then set the
# variable on the broker Deployment, for the red run only. On `main`, inspect_repository.py asks the broker for
# content workspaces, finds none and falls back to a leased local checkout,
# which the sandbox cannot clone, so neither fact is read. A plain `main` run
# with the workspace on would pass the fact checks: the red needs the switch.
# GREEN: this branch's build, with the workspace still switched off.
#
# THE FIXTURE THIS CASE NEEDS (no pool install has it yet):
#   - one entry in the install's `context_repos`, and no other:
#       [{"type":"github","url":"https://github.com/kubernetes-sigs/kind","ref":"v0.24.0"}]
#   - nothing else: the repository is public, so the broker reads it with no
#     credential when the forge mints none for it.
# scripts/provision_ci_pool_project.sh, which already seeds each pool
# project's GitOps state, is the place to add it. Until then the case is
# FIXTURE_NOT_READY and runs only on a dev install that carries the entry.
#
# THE ROUTE CHECK reads the inspect_repository.py commands two ways. As
# argv runs: the required run is the script with the word `clone`, and a
# forbidden run is the script with a workspace verb (open, list, grep,
# fetch, close). As text: a row fails when it names the workspace route
# /v1/workspace, or names the script with a verb as the next word
# (`inspect_repository.py open`, after an optional quote, an optional `\ `
# that a continued line leaves, and an optional quote around the verb).
# The route is a text pattern, because a run must name every client that
# could carry it (curl, wget, python in any version and form, a heredoc, a
# wrapper such as timeout), and each one it misses is a workspace call that
# passes. The verb is a text pattern beside
# the runs, because a card log row of a shell heredoc (`bash <<'EOF' …
# EOF`) is one argv of `bash`, not a run of the script.
# An exemption (exempt_grep_patterns) reads the row as shell words and
# removes the pattern argument of a grep, egrep or fgrep (the first
# positional word, or each -e value), and nothing else. It applies only on a
# row that is that grep and nothing else: no ;, &, |, newline or parenthesis,
# no redirect but `>` to /dev/null, no comment, no `$(`, backquote, `<(` or
# other substitution anywhere, and the row is not a collapsed chain (a row
# ending ` + N command(s)`). Options end at the first operand, so an -e after
# a file is graded. The options, the file operands and any text that the
# rendering joined onto the row stay graded, and a row with anything else on
# it is graded whole. So `grep -rn /v1/workspace <skill dir>` and `grep
# "inspect_repository.py open" SKILL.md` pass, but a call typed on the line
# after a grep fails. No other command is exempt: echo, printf,
# cat, head, tail, less, ls, rg, sed and find can carry the route into a
# file or a pipe, and a card log row drops a redirection.
# Known limits:
#   - The check does not see a route that no row names: a script file that
#     names it (`python3 /tmp/call.py`), a program that the execute_code tool
#     runs, or a route held in a variable that an earlier row set. A call
#     chained behind a first command on a card log row is not on the row
#     either (`cat SKILL.md + 1 command(s)`): the rendering keeps only the
#     first command.
#   - A row that is not one grep and names the route or a verb counts as a
#     call, which is a spurious red: an echo, a cat or another command that
#     names it, a grep behind `if`, a wrapper such as timeout or an absolute
#     path (/usr/bin/grep), and a collapsed chain whose first command names
#     it. A `cd <dir> &&` step before a grep is the same on a worker-filed
#     card, which is read as typed; a card log row skips a leading `cd`.
#     A grep is also not exempt with a pipe (`| head -20`), with a long
#     option whose value is a separate word (`--include '*.md'`, `--context
#     3`: the value is read as the pattern), or with a `2>&1` or
#     `&>/dev/null` trailer, which a typed card keeps.
#   - A card log row joins a second typed line onto the grep with a space, so
#     a second line could read the removed pattern back from the shell. The
#     grep is graded whole when its pattern assigns a variable or an array
#     element as it expands (`${X:=...}`, `${A[0]=...}`), when another word on
#     the row reads the last argument (`$_`) or a variable through another
#     (`${!x}`), or when the row holds an ANSI-C quote (`$'...'`). A
#     single-quoted lookalike is graded whole too, and another read-back
#     (`declare -p`, `history`) is not seen.
#   - The required run also reads each card's tagged call as typed, so a
#     clone chained behind another command, or inside a shell heredoc
#     (`bash <<'EOF' … clone … EOF`), is credited when the call reached the
#     trajectory. A card whose call did not reach it is read from its log
#     row only, which keeps a chain's first command and reads a heredoc as
#     an argv of `bash`, so such a clone is missed: a spurious red.
#   - A typed call is read with each line as a command, also in a heredoc
#     body. So a note that a heredoc writes (`cat > notes.md <<'EOF'`) and
#     that quotes a clone run meets the required run on any card, and one
#     that quotes a verb run counts as that run on a worker-filed card.
#   - A workspace verb matches as any word after the script, not only as the
#     subcommand. So an option value that is a bare open, list, grep, fetch
#     or close (`clone … --into list`) counts as the verb and fails the
#     check; a run cannot name a word position. The verb text pattern also
#     fails `inspect_repository.py open -h`, which only prints the help.
#   - The route pattern reads the path as written. A path that a worker
#     writes another way to hide it passes: `/v1/./workspace`,
#     `/v1//workspace`, `works''pace` or `%77orkspace`, and a verb or a
#     path joined with `${IFS}` in place of a space
#     (`inspect_repository.py${IFS}open`).
#   - A row carries no result, so a clone the script refused still meets the
#     required run (#4363).
#
# Domain: source-control (a repository read through the version-control
# verbs, never a credentialed clone in the sandbox).
# Isolation class: read-only; it writes nothing to any repository or cluster.
# Eligible tier: nightly, once the fixture exists.
id: inspect-repository-unmanaged-and-context-read
name: Two repositories the install does not manage are read through the snapshot verb
prompt: >-
  Answer two questions from the source files, not from memory, and don't
  change anything.

  1. In the public GitHub repository gke-labs/kube-agents, at the tag 0.13.0,
  which Hermes agent image does the file tags.env pin? Give the full value,
  digest included.

  2. This install's context repository is the public GitHub repository
  kubernetes-sigs/kind, registered at the tag v0.24.0. At that tag, which
  default node image does the file pkg/apis/config/defaults/image.go set?
  Give the full value, digest included.
expected_output: >-
  The agent reads tags.env from gke-labs/kube-agents at the tag 0.13.0 with
  inspect-repository, narrowing the copy with --prefix when the whole tree is
  refused as too large, and reports HERMES_AGENT_TAG as
  v2026.9.14@sha256:99641e57ec762c59e54cb44aa6746b7fc68c18b3c5ddb088af54234c613d9294.
  It reads pkg/apis/config/defaults/image.go from the install's context
  repository, kubernetes-sigs/kind at v0.24.0, the same way, and reports
  kindest/node:v1.31.0@sha256:53df588e04085fd41ae12de0c3fe4c72f7013bba32a20e7325357a1ac94ba865.
  It changes nothing.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: source-control

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: Fuxiao-Gao

verification_spec:
  # The request reached a specialist: the front door holds no shell, and
  # without a card the worker check below would error, not fail.
  - name: the-request-was-delegated
    role: objective
    # assert: the transcript is immutable once the run ends.
    mode: assert
    check:
      type: tool_called
      tool_names: ["kanban_create"]
      require_success: true
  # The unmanaged public repository. The digest is the part no model can
  # know; the first twelve hex characters are enough to be unguessable.
  - name: the-public-fact-was-read
    role: objective
    mode: assert
    check:
      type: report_contains
      required_patterns: ["99641e57ec76"]
  # The context repository, at its registered tag. The digest, as above.
  - name: the-context-fact-was-read
    role: objective
    mode: assert
    check:
      type: report_contains
      required_patterns: ["53df588e0408"]
  # The route: some worker command runs `inspect_repository.py clone`, the
  # snapshot route, and none uses a broker workspace handle (the subcommands
  # this change removed, or the workspace route). A worker may also try a
  # direct download first: that habit exists on main, before any skill is
  # read, and a follow-up issue owns it. The runs read each shell segment of
  # hermes's one-line rendering of a command as an argv: it skips a leading
  # `cd` and keeps the first command of a chain. The required run also reads
  # the worker's tagged call as typed, so a `clone` chained behind another
  # command (`mkdir d && … clone`) is read. The rendering joins a continued
  # line with a space, so a backslash-newline before the verb leaves the word
  # ` clone`; the word patterns allow that one space. An objective, because a
  # safeguard cannot carry the red.
  - name: the-snapshot-route-and-no-workspace-handle
    role: objective
    mode: assert
    check:
      type: worker_commands
      required_runs:
        - script: inspect_repository.py
          word_patterns: ["^ ?clone$"]
      forbidden_runs:
        - script: inspect_repository.py
          word_patterns: ["^ ?(open|list|grep|fetch|close)$"]
      # One grep through its pattern argument, on a row that is that grep
      # and nothing else; the case header states the limits.
      exempt_grep_patterns: true
      # Any row that names the workspace route, or the script with a verb
      # as the next word.
      forbidden_patterns:
        - '/v1/workspace\b'
        - 'inspect_repository\.py["'']?\s+(?:\\\s+)?["'']?(open|list|grep|fetch|close)\b'
