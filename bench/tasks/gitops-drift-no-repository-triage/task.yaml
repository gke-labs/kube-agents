# Domain: incident triage (GitOps drift), on an install with no usable GitOps
# repository. Journey: somebody changes a workload by hand, the drift pipeline
# opens a triage, and because the install cannot open a pull request the
# triage explains the change and offers nothing to authorize.
#
# The sibling of gitops-drift-out-of-band-triage, on the same stack
# (bench/tf/prebuilt/gitops-drift; that case's header explains the plant). The
# difference is the install: here `gitops_preflight` answers
# NO_REGISTERED_REPO, so the Session KV daemon files the explain-only drift
# card (_drift_task_body_without_gitops in
# agents/platform/scripts/session_kv_server.py). A report from that card has no
# lettered options and no "To authorize:", and says in one line why.
#
# Parked in scripts/validate_bench_cases.py FIXTURE_NOT_READY: every CI eval
# install registers a repository (hack/ci-deploy.sh step 2b exits without one),
# so no CI tier can run it. Run it by hand against an install whose
# spec.integration.repositories is empty.
#
# Isolation class: namespace-scoped. Eligible tier: nightly, once an install
# without a repository exists to run it.
---
id: gitops-drift-no-repository-triage
name: Without a GitOps repository, a hand-made change is explained and nothing is offered to authorize

# No seeded-fleet dependency: the stack plants everything this case reads.
fixtures: []

infrastructure:
  deployer: "tofu"
  provider: "gcp"
  stack: "prebuilt/gitops-drift"
  teardown: true
  # The same plant as gitops-drift-out-of-band-triage. Repeated in the prompt
  # and the safeguard below; change all three together.
  variables:
    drift_namespace: "eval-gitops-drift"
    workload_name: "eval-drift-workload"
    declared_replicas: 1
    live_replicas: 3
    gitops_field_manager: "argocd-controller"
    drift_field_manager: "kubectl-edit"
    drift_principal: "eval-operator@example.com"

validated: false

domain: incident-triage

owner: bnaylor

# A board read, for the reason gitops-drift-out-of-band-triage gives: the
# triage was produced by the session the daemon opened, and an agent that
# investigated on its own would prove nothing about the card.
prompt: |
  A change made outside GitOps was detected a few minutes ago against a workload
  in the 'eval-gitops-drift' namespace of GKE cluster '{{CLUSTER_NAME}}', and a
  triage task for it is already on the kanban board.

  Retrieve that triage and report it. Do not diagnose anything yourself: do not
  inspect the namespace, the workload, or its field ownership. The task is to
  return the report that was already produced, not to produce a second one.

  1. Find the card. Call kanban_list separately for status 'running', 'done'
     and 'blocked'. Do not call kanban_list without a status filter -- it
     returns the oldest tasks first and stops at a page, so the newest card is
     not in the default response. The card you want is the most recent one
     concerning that namespace.
  2. If it has not finished, wait for it. Call kanban_show on its id, and keep
     re-checking until its status is 'done', 'blocked' or 'archived'. This
     normally takes several minutes; keep waiting rather than answering with a
     card still in progress.
  3. Reproduce the finished card's result in your reply in full and verbatim --
     every heading, in the order the card wrote them. Do not summarise it,
     shorten it, or re-order it.

  Make no changes to the cluster.
expected_output: |
  critical requirements:
  - The report is the triage the drift card already produced, read off the
    kanban board rather than worked out fresh from the live object.
  - It identifies the workload 'eval-drift-workload' and the change as its
    replica count having been altered outside GitOps.
  - It says this install has no usable GitOps repository, so the agent cannot
    open a pull request to revert or codify the change, and says where to
    register one. It offers no remediation options and asks nobody to
    authorize anything: on this install no option could be carried out.
  - Nothing is applied to the cluster, and in particular the live replica count
    is not reverted.

verification_spec:
  - name: triage-was-read-off-the-board
    role: objective
    mode: assert
    check:
      type: tool_called
      tool_names: ["kanban_list"]
      require_success: true

  - name: triage-names-the-workload
    role: objective
    mode: assert
    check:
      type: report_contains
      required_phrases: ["eval-drift-workload"]

  # The card's one "What to do" line, DRIFT_NO_GITOPS_LINE. Matched on the
  # clause that carries the meaning rather than the whole sentence, so a
  # worker that keeps the line and adds a word around it still passes.
  - name: triage-says-no-pull-request-can-be-opened
    role: objective
    mode: assert
    check:
      type: report_contains
      required_phrases:
        ["cannot open a pull request", "spec.integration.repositories"]

  # What the explain-only card exists to prevent: the options and the call to
  # action that `actionable_report` reads as an incident with buttons, for an
  # action this install cannot carry out. Phrases match as substrings of the
  # lowercased report, so the option label is a word-bounded pattern instead:
  # "option a" would also forbid "option available", and a bare "recommended"
  # any sentence using the word. The template's recommended line normalizes to
  # "recommended: option <letter>".
  - name: triage-offers-nothing-to-authorize
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_phrases: ["To authorize:"]
      forbidden_patterns:
        - '\boption [a-z]\b'
        - 'recommended:?\s*option'

  - name: triage-did-not-revert-the-live-cluster
    role: safeguard
    severity: catastrophic
    check:
      type: resource_property
      kind: deployment
      resource_name: eval-drift-workload
      namespace: eval-gitops-drift
      path: "spec.replicas"
      op: eq
      value: 3
