# NIGHTLY — registered in hack/eval/nightly-cases.txt since 2026-09-15,
# commented out of the presubmit's TASKS array before that. Same hold as upgrades-fleet-version-table
# and upgrades-fleet-rollout-stall, the skill's Phase-1 and Phase-2 cases: the
# maintainer's call on #1343 keeps them out until #1254 is closed, the open
# issue on the sibling probe upgrades-lagging-master-probe where a delegated
# run's acknowledgement is graded as the final answer on unrelated pull
# requests (the #1010 family that docs/eval-gate-roster.md holds two other
# cases out on). This case reads the same final answer over the same fixture,
# so it cannot be watched to both pass and fail until then; it stays
# `validated: false` and out of the presubmit. Its nightly record from #1254's
# close on is what earns a seat; nothing here changes.
#
# The Phase-3 case for the fleet-upgrade-verification skill (#1343 criterion
# 3, #1411): not which members lag (upgrades-fleet-version-table asks that)
# but WHY a member cannot take the upgrade, which is what the script's
# `--readiness` table adds: per member, drain-blocking PodDisruptionBudgets,
# maintenance exclusions and the window at the instant, and node-pool skew
# against the target. Both halves are now plantable: seeded-b carries the
# maintenance rule (its exclusion, in effect, at a scope covering exactly the
# upgrade its version row says it needs) AND a drain-blocking PDB,
# pinned-batch-runner at maxUnavailable: 0. Every other budget in the fleet is
# safe by spec, which is how the skill grades one: inference-server on seeded-a
# and zone-pinned-api on seeded-d at maxUnavailable: 1, capacity-starved-worker
# on seeded-d at minAvailable: 1 against four replicas; the reliability plant
# is a workload with NO PDB. inference-server's status does read
# disruptionsAllowed 0, because its pool holds fewer replicas than it wants
# (bench/tf/fleet/defects-a.tf), so a report naming that budget from status
# alone is wrong rather than thorough. The report is graded, not the tool
# path: an agent that reads the maintenance policy any other way and reports
# the same finding passes.
#
# Planted defect required: the seeded fleet's slot-b cluster held one minor
# version behind the REGULAR channel default, enrolled in REGULAR, held
# between reconciles by the maintenance exclusion `hold-the-minor-lag` at
# scope NO_MINOR_UPGRADES (role version-laggard, bench/tf/fleet/fixtures.json;
# bench/tf/fleet/main.tf re-stamps the exclusion's window from now on every
# apply). The version NUMBERS move with the channel, so nothing here asserts a
# version — only that the exclusion is named, with its scope, as what holds
# the minor upgrade.
#
# Isolation class: read-only (chat prompt; the script reads with gcloud
# container and kubectl get and writes only its own record and per-member
# kubeconfig files on the sandbox volume; no audit helper, no GitOps-repo
# write). Eligible tier: presubmit once #1254 is closed.
#
# No deterministic mutation safeguard, documented: the planted defect is a
# GKE maintenance policy, a GKE-level facet rather than a Kubernetes object,
# and the version-laggard role probes no objects, so a fleet_resource_property
# check has nothing to ground on. The fleet's scheduled reconcile owns the
# defect's integrity. Same documented residual as upgrades-fleet-version-table.
# readiness-drain-blocked is listed because expected_output names its budget.
# `fixtures:` is read by scripts/validate_bench_cases.py and by whoever greps
# for the cases a replaced cluster affects; nothing reads it at run time. So on
# a project whose fleet predates the budget the case still runs, its four
# report checks can pass, and the judge marks the report down for missing
# pinned-batch-runner -- the environment, not the agent; the CI health bot's
# fixture-state scan lists readiness-drain-blocked as not checked there. Its
# probe, poddisruptionbudget/pinned-batch-runner, could ground a
# fleet_resource_property safeguard that turns that absence into an error, and
# adding one changes what this case grades, which needs its own eval run.
id: upgrades-fleet-readiness-exclusion
name: Fleet upgrade readiness names the maintenance exclusion holding the laggard
prompt: >-
  For every cluster in this project, check whether it is ready to take the
  upgrade to its release channel's default version, and tell me per cluster
  what would stop the upgrade: a PodDisruptionBudget that would block a node
  drain, a maintenance exclusion or window, or node pools too far behind. Read
  the state; do not change, upgrade, or remove anything.
expected_output: >-
  The per-cluster version table and, after it, a readiness table read during
  this run: per cluster a verdict (ready, blocked or unknown), its
  drain-blocking PodDisruptionBudgets, its fail-closed webhooks with an unreachable
  backend, its maintenance exclusions and window, and its node-pool skew
  against the target. seeded-b is reported as blocked,
  naming its maintenance exclusion hold-the-minor-lag with scope
  NO_MINOR_UPGRADES and its end time, and stating that the exclusion holds
  back the automatic minor upgrade to its REGULAR channel default (a manual
  upgrade is not subject to it). The other members are graded against the
  same rule and are not reported as blocked by an exclusion. seeded-b is also
  reported as carrying a drain-blocking PodDisruptionBudget, pinned-batch-runner
  in seeded-upgrade, whose maxUnavailable of 0 leaves disruptionsAllowed at 0
  permanently, so a node drain of the pool that workload is pinned to cannot
  complete; no other cluster carries one. It says what an operator would have to change and does not
  propose deleting the exclusion. It recommends (not performs) the upgrade
  path. It cites no CVE identifiers, because it has no vulnerability feed. No
  mutation of any kind.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: upgrades

# Named by ROLE, not cluster: bench/tf/fleet/fixtures.json;
# docs/designs/bench-fleet-catalog.md is the rule.
fixtures:
  - version-laggard
  - readiness-drain-blocked

# report_contains: a chat prompt, so the reply is what is graded. Four
# objectives, one for each thing the reply must do: name the laggard, name the
# exclusion, name its scope, say what it holds; and one thing it must not do.
# Split so a red says which.
verification_spec:
  - name: the-report-names-the-lagging-member
    role: objective
    # assert, not converge: the transcript is immutable once the run ends.
    mode: assert
    check:
      type: report_contains
      # "seeded-b" is a rendering of slot b under the prefix's default, the same
      # contract upgrades-fleet-version-table carries: it survives the default
      # prefix and breaks loudly if the prefix changes. The prompt does not say
      # it; the report has to find it.
      required_phrases: ["seeded-b"]
  - name: the-report-names-the-exclusion-and-its-scope
    role: objective
    mode: assert
    check:
      type: report_contains
      # The exclusion's name and scope as the maintenance policy spells them
      # (bench/tf/fleet/main.tf). Both are on the cluster record; neither is in
      # the prompt.
      required_phrases: ["hold-the-minor-lag", "NO_MINOR_UPGRADES"]
  - name: the-report-says-the-exclusion-holds-the-upgrade
    role: objective
    mode: assert
    check:
      type: report_contains
      # The fact: the planted exclusion is what holds seeded-b's upgrade. Four
      # patterns admit every phrasing of it and exclude nothing. Each runs on
      # the verifier's line-preserving surface (lowercased, Markdown marks
      # dropped, so the scope reads "nominorupgrades" there).
      # Window: the claim sits within three lines of a token naming the
      # exclusion, its scope or seeded-b (a heading above the sentence, or
      # the name on the bullet below it). A sentence about another cluster
      # three or more lines from any such token is not the match. A span
      # stops at a period, a semicolon, a pipe or a line end and keeps the
      # dot of a version number.
      # 1. The exclusion as subject: "exclusion <...> blocks|prevents|holds
      #    back|held|defers|excludes|stops|pauses|suspends|postpones|delays
      #    <...> upgrade|minor|auto-|version bump"; a verb or object followed
      #    by a hyphen is a piece of the exclusion's own name, not the claim,
      #    and "blockers" is a noun, not the verb.
      # 2. The cluster or the upgrade as subject: "blocked|held|prevented|
      #    deferred|stopped|excluded <...> by <...> exclusion".
      # 3. The exclusion in force: "exclusion <...> active|runs|running|
      #    valid|set <...> until|from|through|now", or "exclusion <...> in
      #    effect|in place", the spelling the first green run on 2026-09-14
      #    (#1582, for issue #1411) wrote; the list gained it after that run
      #    failed this check.
      # 4. The upgrade as subject with no agent: "minor|automatic|auto
      #    upgrade(s) is|are|was|were|remains|stays excluded|blocked|held|
      #    prevented|deferred|paused|suspended".
      # Declared residue, each 0 of the 102 recorded answers (2026-11-02): a
      # negation written inside a window ("no exclusion blocks", "is not
      # blocked by the exclusion"), a past tense ("was active from"), an
      # exclusion in force whose scope does not cover the upgrade, a claim
      # about another cluster within two lines of a seeded-b row, and a
      # comma-joined sentence that names the exclusion and attributes the
      # block to the PDB. These shapes pass with no grader: a judged score
      # never fails a repetition on its own (docs/designs/eval-scorer.md,
      # "Judged quality is advisory"), so the residue is accepted at its real
      # cost, and the record's 0 of 102 is the measure of that cost. A
      # negation guard was tried and dropped: it failed a correct report that
      # mentions an absence first ("No PDB blocks the drain, but the
      # exclusion ... blocks the minor upgrade"), and a check that fails a
      # correct report costs more than one that admits a shape no recorded
      # answer writes. A table that puts the exclusion and its verb in
      # separate cells is not read; the readiness script writes both in one
      # cell.
      # Not the bare word "blocked": a version table on main already carries
      # "lagging", and an agent could write "blocked" of anything.
      # bench/tests/test_upgrades_readiness_exclusion_patterns.py pins the
      # nightly record's shapes and each clause bound through the whole check.
      any_of_patterns:
        - '(?m)^(?=(?:[^\n]*\n){0,2}[^\n]*(?:seeded-b|hold-the-minor-lag|nominorupgrades|no-minor-upgrades))(?:[^\n]*\n){0,2}[^\n]*(?:exclusion|hold-the-minor-lag)(?:[^.\n|;]|\.(?=\d)){0,80}?\b(?:block(?:s|ed|ing)?|prevent\w*|hold(?:s|ing)?(?: back)?|held(?: back)?|defer\w*|exclud\w*|stop\w*|paus\w*|suspend\w*|postpon\w*|delay\w*)\b(?!-)(?:[^.\n|;]|\.(?=\d)){0,60}?\b(?:upgrad\w*|minor(?!-)|auto\w*|version bump\w*)'
        - '(?m)^(?=(?:[^\n]*\n){0,2}[^\n]*(?:seeded-b|hold-the-minor-lag|nominorupgrades|no-minor-upgrades))(?:[^\n]*\n){0,2}[^\n]*\b(?:blocked|held(?: back)?|prevented|deferred|stopped|excluded)\b(?:[^.\n|;]|\.(?=\d)){0,60}?\bby\b(?:[^.\n|;]|\.(?=\d)){0,60}?(?:exclusion|hold-the-minor-lag)'
        - '(?m)^(?=(?:[^\n]*\n){0,2}[^\n]*(?:seeded-b|hold-the-minor-lag|nominorupgrades|no-minor-upgrades))(?:[^\n]*\n){0,2}[^\n]*(?:exclusion|hold-the-minor-lag)(?:[^.\n|;]|\.(?=\d)){0,80}?(?:\b(?:active|runs?|running|valid|set)\b(?:[^.\n|;]|\.(?=\d)){0,30}?\b(?:until|from|through|now)\b|\b(?:in effect|in place)\b)'
        - '(?m)^(?=(?:[^\n]*\n){0,2}[^\n]*(?:seeded-b|hold-the-minor-lag|nominorupgrades|no-minor-upgrades))(?:[^\n]*\n){0,2}[^\n]*\b(?:minor|automatic|auto-?)\s*upgrades?\s+(?:is|are|was|were|remains?|stays?)\s+(?:excluded|blocked|held(?: back)?|prevented|deferred|paused|suspended)\b'
  - name: no-invented-cves
    role: objective
    mode: assert
    check:
      type: report_contains
      # No vulnerability feed; a CVE id in a readiness report is an invention.
      forbidden_phrases: ["CVE-"]
