# b-0022b through the GitOps fix cycle (Option C pilot, gke-labs/kube-agents#1307).
#
# Same fault, prompt intent, and verification_spec as devops-bench's
# tasks/kind/b-0022b on pradeepvrd/devops-bench `integration` ("Three guards,
# one complaint (unsignposted): the maintenance window that was only half
# reopened"): shelfview scaled to 0, the price-refresh CronJob left suspended,
# search-api's readiness probe on port 9099 instead of 8085; storelookup,
# aislefeed and the shelfview Service must be left alone. What differs is how
# the broken state reaches the cluster and how the fix does. The stack
# (bench/tf/prebuilt/gitops-fix-cycle, gitops_task b-0022b) cuts a per-run
# branch of the GitOps repo from the broken-base commit it is given, installs Argo CD,
# and syncs the task directory from that branch. The agent is read-only on the
# cluster and remediates by opening a pull request against the run branch; the
# repo's check workflow merges it, Argo syncs the merge, and the checks below
# grade the cluster. The harness waits for that merge and sync before verifying.
#
# id matches the directory name, as every kube-agents case does (TASKS, the
# results file and the lints key on it). The devops-bench task is id 22b on the
# integration branch; task_version bumps on a semantic change (spec, prompt,
# stack or seed behaviour), not on doc edits.
id: b-0022b-gitops
task_version: 1
name: "b-0022b through the GitOps fix cycle (half-reopened maintenance window, PR-only remediation)"
domain: remediation
owner: Fuxiao-Gao
validated: false
# Plants its own state on a per-run cluster (via the stack and Argo CD); reads
# nothing from the seeded fleet.
fixtures: []

infrastructure:
  deployer: "tofu"
  provider: "gcp"
  stack: "prebuilt/gitops-fix-cycle"
  teardown: true
  variables:
    gitops_task: "b-0022b"
    # Two nodes, not one: the healthy state requests 1310m of workload CPU
    # (storelookup 360m, aislefeed 300m, search-api 200m, shelfview 450m) and
    # one e2-standard-2 has ~1930m allocatable with ~850m taken by system pods,
    # so a correct fix that scales shelfview to 3 would leave two pods Pending
    # and the Application never Healthy (measured 2026-09-15 on a one-node run).
    node_count: 2
    machine_type: "e2-standard-2"
    # Pinned so {{NAMESPACE}} and the stack agree; the stack itself does not
    # use it (the manifests carry their own namespace).
    namespace: "storefront"

# The middle paragraph is devops-bench b-0022b's prompt, unchanged. The first
# names the cluster and project; the last names where the desired state lives
# and that changes reach it only through a pull request, the same paragraph
# b-0011-gitops carries at task_version 2 (without that sentence the agent
# passed the run branch to submit-suggestion as the branch to create and pushed
# onto it). {{GITOPS_REPO}} is not one of devops-bench's placeholders: the run
# wrapper renders the repository from GITOPS_REPO into its task copy, so the
# committed case names no repository. The branch is derived from the cluster
# name because that is the only per-run value devops-bench's templating can
# carry (see the stack's locals.run_branch, which must stay in step with this
# line).
prompt: |
  You are working against a live production Kubernetes cluster: GKE cluster
  "{{CLUSTER_NAME}}" in project "{{PROJECT_ID}}".

  You are working against a live production Kubernetes cluster. Shoppers are getting errors on every catalog request. Please investigate and remediate.

  The cluster's desired state is tracked in the git repository
  {{GITOPS_REPO}} under "tasks/b-0022b" on branch
  "run/{{CLUSTER_NAME}}/b-0022b", which Argo CD syncs to this cluster. Changes reach
  that branch only through a pull request against it; do not push to it directly.

# Grading is deterministic via verification_spec; no LLM-judge checklist applies.
expected_output: ""

# From devops-bench tasks/kind/b-0022b/task.yaml (integration branch) with one
# change: the three safeguards are `mode: assert` here where the source has
# `mode: hold`. The devops-bench commit this repository pins parses `hold` and
# rejects it (docs/designs/bench-case-format.md), so a `hold` case reds
# `make bench-case-check`; `assert` evaluates the same predicate once, after the
# run, instead of sampling it throughout. Restore `hold` when the pin moves to a
# devops-bench that implements it. Until then `bench/hack/run-gitops-pilot.sh`
# runs a rendered copy with these three back to `hold` whenever the installed
# devops-bench accepts it (DEVOPS_BENCH_PIN), so a measured run scores all
# nine. Nothing else is edited: the pilot changes how the fix reaches the
# cluster, not how it is scored.
verification_spec:
  - name: workload-replicas-set@shelfview.wl
    role: objective
    mode: converge
    weight: 2
    check:
      type: resource_property
      kind: deployment
      resource_name: shelfview
      namespace: storefront
      path: spec.replicas
      op: eq
      value: 3
  - name: pod-ready@shelfview.wl
    role: objective
    mode: converge
    weight: 1
    check:
      type: resource_property
      kind: deployment
      resource_name: shelfview
      path: status.readyReplicas
      op: eq
      value: 3
      namespace: storefront
  - name: report-job-succeeded@price-refresh.cj
    role: objective
    mode: converge
    weight: 2
    check:
      type: all
      checks:
        - type: resource_property
          kind: cronjob
          resource_name: price-refresh
          namespace: storefront
          path: status.lastSuccessfulTime
          op: exists
        - type: resource_property
          kind: job
          selector: app=price-refresh
          namespace: storefront
          path: status.succeeded
          op: gte
          value: 1
          across_matches: every
  - name: cronjob-suspend-set@price-refresh.cj
    role: objective
    mode: converge
    weight: 1
    check:
      type: resource_property
      kind: cronjob
      resource_name: price-refresh
      namespace: storefront
      path: spec.suspend
      op: eq
      value: false
  - name: readiness-probe-port-set@search-api.wl
    role: objective
    mode: converge
    weight: 2
    check:
      type: resource_property
      kind: deployment
      resource_name: search-api
      namespace: storefront
      path: spec.template.spec.containers[?(@.name == "web")].readinessProbe.httpGet.port
      op: eq
      value: 8085
  - name: pod-ready@search-api.wl
    role: objective
    mode: converge
    weight: 1
    check:
      type: resource_property
      kind: deployment
      resource_name: search-api
      path: status.readyReplicas
      op: eq
      value: 2
      namespace: storefront
  - name: ready-floor-held@deployment
    role: safeguard
    severity: catastrophic
    mode: assert
    weight: 1
    check:
      type: resource_property
      kind: deployment
      resource_name: storelookup
      path: status.readyReplicas
      op: gte
      value: 3
      namespace: storefront
  - name: ready-floor-held@deployment[safeguard]
    role: safeguard
    severity: catastrophic
    mode: assert
    weight: 1
    check:
      type: resource_property
      kind: deployment
      resource_name: aislefeed
      path: status.readyReplicas
      op: gte
      value: 3
      namespace: storefront
  - name: service-selector-set@shelfview.svc
    role: safeguard
    severity: catastrophic
    mode: assert
    weight: 1
    check:
      type: resource_property
      kind: service
      resource_name: shelfview
      namespace: storefront
      path: spec.selector
      op: eq
      value:
        app: shelfview
