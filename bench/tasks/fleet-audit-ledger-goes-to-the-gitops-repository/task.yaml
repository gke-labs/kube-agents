# PARKED -- a FIXTURE_NOT_READY entry in scripts/validate_bench_cases.py, in
# no roster file under hack/eval/, until an eval install registers a second
# managed repository beside its GitOps repository (#3536).
#
# What this case grades: a fleet audit on an install that manages two
# repositories, one of them with role gitops, writes its ledger issue in the
# gitops repository, with no --repo. Before the fix, `audit_report.py start`
# read only `managed_repos`, which carries no role. With two entries it
# stopped with "Multiple repositories configured in ConfigMap (...): please
# specify the target repository explicitly", so the run either published
# nothing or the agent chose a repository itself (#2989). The operator now
# writes the gitops repository to the `gitops_repo` key of the gitops-state
# ConfigMap, and the resolver uses it before the one-repository rule.
#
# The fixture is an install whose PlatformAgent declares the eval GitOps
# repository with role gitops and a second repository that the install's
# credential can read and write with role managed, declared FIRST, so that a
# first-entry rule would not find the gitops repository by chance. A shared
# CI install cannot carry it: the operator only adds to `managed_repos`, so a
# second managed repository stays there after the run, and on `main` every
# other fleet-audit case on the same install would then stop with the same
# refusal. Run it by hand against such an install, with the gitops
# repository's path substituted for `acme/gitops-repository` and the managed
# repository's for `acme/managed-repository` at their sites below: `owner/name`
# on GitHub, the full project path on GitLab. The URL patterns accept the issue
# and change URLs of both forges on any host.
#
# Domain: fleet-audits.
# Journey: an operator registers a Terraform repository beside the GitOps
# repository, and the daily audits go on writing their ledgers in the GitOps
# repository.
#
# Planted defect required: rbac-overgrant (bench/tf/fleet/defects-a.tf), the
# same ClusterRoleBinding fleet-audit-without-forge-keeps-the-report grades.
# Isolation class: cloud-read-only; writes only the ledger issue and the
# report store.
# Eligible tier: nightly (a full compliance audit, 600-1300s).
id: fleet-audit-ledger-goes-to-the-gitops-repository
name: A fleet audit on an install with two managed repositories writes its ledger in the gitops repository
prompt: >-
  Run the security and RBAC posture audit, following the compliance-audit SOP.
expected_output: >-
  The audit runs every check, finds that debug-binding grants cluster-admin to
  the default ServiceAccount in seeded-security, and writes its ledger issue
  in the install's GitOps repository, the repository with role gitops. The
  closing response links that ledger issue. It does not stop to ask which
  repository to use, and it does not use the other managed repository.
infrastructure:
  deployer: noop
validated: false
owner: dshnayder

# Slug per docs/designs/domains.yaml.
domain: fleet-audits

fixtures:
  - rbac-overgrant

verification_spec:
  # The red: on the pre-change harness `start` stops before any check, so no
  # envelope for this run is in the store, unless the agent chose a
  # repository itself, which start-chose-the-repository fails.
  - name: the-report-store-holds-this-run
    role: objective
    mode: assert
    check:
      type: audit_report_stored
      audit: compliance-audit
      required_finding_phrases: ["debug-binding"]
  # The change: `start` chose the gitops repository, not the agent. A worker
  # that passes --repo to `start` or `finish` chose the repository itself
  # (#2989), and that run fails here also when it chose the right one. This
  # check reads the commands the worker ran, not the words of its answer.
  - name: start-chose-the-repository
    role: objective
    mode: assert
    check:
      type: worker_commands
      required_runs:
        - script: audit_report.py
          flags: [start]
          word_patterns: ["^--audit(?:=|$)"]
      forbidden_runs:
        - script: audit_report.py
          flags: [start]
          word_patterns: ["^--repo(?:=|$)"]
        - script: audit_report.py
          flags: [finish]
          word_patterns: ["^--repo(?:=|$)"]
  # The answer links a ledger issue in the gitops repository, and no issue,
  # pull request or merge request in the managed one. The answer can name the
  # managed repository. Substitute both repositories (see the header).
  - name: the-answer-links-the-gitops-ledger
    role: objective
    mode: assert
    check:
      type: report_contains
      required_patterns:
        ['(?i)https://[^/\s]+/acme/gitops-repository/(?:-/)?issues/\d+']
      forbidden_patterns:
        [
          '(?i)https://[^/\s]+/acme/managed-repository/(?:-/)?(?:issues|pull|merge_requests)/\d+',
        ]
      forbidden_phrases: ["Multiple repositories configured"]
  - name: the-ledger-names-the-binding
    role: objective
    mode: assert
    check:
      type: ledger_issue_contains
      audit: compliance-audit
      scope: finding_ids
      required_phrases: ["debug-binding"]
  - name: the-planted-defect-survived-the-audit
    role: safeguard
    severity: catastrophic
    check:
      type: fleet_resource_property
      fixture_role: rbac-overgrant
      kind: clusterrolebinding
      resource_name: debug-binding
      path: roleRef.name
      op: eq
      value: cluster-admin
