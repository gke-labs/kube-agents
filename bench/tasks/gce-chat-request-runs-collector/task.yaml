# FIXTURE_NOT_READY — an entry in scripts/validate_bench_cases.py under #2483,
# beside gce-startup-script-failure, because the VM below exists in no pool
# project yet. It moves to hack/eval/nightly-cases.txt with that case, once
# the fleet re-apply plants the VM on every pool project
# (docs/designs/bench-case-format.md, "Registration").
#
# What this case grades (#2386): a plain chat question about the fleet's
# Compute Engine VMs and instance groups, one that names no SOP, gets the
# checks the scheduled GCE compute audit runs, answered in chat with no
# ledger run. Main already does this: on main 8aabdadb all three runs loaded
# gce-compute-fleet-audit, ran compute_fleet_audit.py, answered in chat and
# opened no ledger (run_20261014_195809_279763, _202919_114569, _204137_182782), so the
# audit-stream table in agents/platform/SOUL.md has no row for this stream.
# This case guards that behaviour: a change that sends the question to a
# ledger run, or to improvised `gcloud compute` reads, fails it.
#
# The checks are the collector invocation (compute_fleet_audit.py) and the
# no-ledger-run objective beside it. A reply phrase cannot carry them alone:
# the VM's name is in `gcloud compute instances list`, so live reads can
# match it. An objective, not only the safeguard, forbids
# `audit_report.py start` and `finish`, since a recoverable safeguard does
# not gate.
#
# Fixture: the startup-fail-vm role (docs/designs/fleet-fixtures.yaml), the
# standalone VM startup-fail-<prefix> from bench/tf/fleet/main.tf
# `google_compute_instance.startup_fail`. Its startup script exits 1 on every
# boot, so the collector's gce-startup-script-status check (critical) flags
# it with no age gate. The role is project-scoped, with no cluster slot.
# CI: no pool project has the VM until #2483's fleet re-apply, so no CI tier
# can run the case. Dev: a targeted apply of bench/tf/fleet plants it in the
# dev project. The dev install declares a scope, so the chat command passes
# the fleet_scope tool's collector_args and the collector sweeps only the
# declared projects; the VM has to be in one of them. Every candidate this
# check emits carries needs_triage gke-managed-node, and the reply must not
# drop the VM on that flag.
#
# Not this route, and left to their own cases: a request that names the SOP
# or asks to run the audit (gce-startup-script-failure, form 1, which
# publishes its ledger), a question about one named VM or instance group
# (live reads), and what the last audit found (form 3).
#
# Domain: fleet-audits (docs/designs/domains.yaml; GCE compute has no row of
# its own, and its SOP-named case claims the same slug).
# Journey: ask a fleet-wide Compute Engine question in chat; the Platform
# Agent runs the GCE compute stream's collector once and answers in chat,
# publishing nothing.
# Isolation class: read-only on the project and on the GitOps repository.
# Eligible tier: nightly.
# Owner: Fuxiao-Gao.
#
# Expected cost: one collector sweep of the scoped projects plus one delegated
# card; priced with the 900s audit band.
id: gce-chat-request-runs-collector
name: A plain Compute Engine request runs the GCE compute audit's collector
prompt: >-
  Check the Compute Engine VMs and managed instance groups across our projects
  for problems. Don't change anything.
expected_output: >-
  The request is delegated to the Platform Agent, which runs the GCE compute
  stream's collector (compute_fleet_audit.py) rather than ad hoc gcloud reads
  or the audit's ledger run, and answers in chat without publishing a ledger
  issue or a pull request. The answer names the standalone VM
  startup-fail-<prefix> as a RUNNING instance whose startup script fails, with
  its zone and project.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: fleet-audits

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: Fuxiao-Gao

# Documentation only: nothing at run time reads this list
# (docs/designs/bench-case-format.md, `fixtures:`). The role is
# project-scoped, so no check below can address it by `fixture_role:`.
fixtures:
  - startup-fail-vm

verification_spec:
  # The request reached a specialist: the front door holds no infrastructure
  # tools, and without a card the worker checks below would error, not fail.
  - name: the-request-was-delegated
    role: objective
    # assert: the transcript is immutable once the run ends.
    mode: assert
    check:
      type: tool_called
      tool_names: ["kanban_create"]
      require_success: true
  # The guard check. required_runs reads each shell segment of a worker
  # command as an argv, as the shell splits it. A run counts when
  # compute_fleet_audit.py is the command word, or follows python3. VAR=value,
  # env, timeout, `cd ... &&` and `bash -c "..."` may stand in front. It does
  # not count when the segment has -h or --help, when the script follows
  # python3 -c, or when the command only mentions it (echo, grep, cat). The
  # basename must match exactly, so test_compute_fleet_audit.py does not
  # count.
  # bench/tests/test_chat_route_case_checks.py pins the samples.
  - name: the-compute-collector-ran
    role: objective
    mode: assert
    check:
      type: worker_commands
      required_runs:
        - script: compute_fleet_audit.py
  # The other half of the guard: the skill's workflow runs the collector inside
  # a ledger run, which a chat answer must not open. An objective, because a
  # safeguard cannot carry the red. forbidden_runs reads the argv as the red
  # check does, so a grep of the skill, a --help call or
  # `audit_report.py draft` does not count.
  - name: no-ledger-run-was-opened
    role: objective
    mode: assert
    check:
      type: worker_commands
      forbidden_runs:
        - script: audit_report.py
          word_patterns: ["^(?:start|finish)$"]
  # The planted VM, which the prompt deliberately does not name. By prefix,
  # because the suffix is the fleet's cluster_prefix.
  - name: the-answer-names-the-failing-vm
    role: objective
    mode: assert
    check:
      type: report_contains
      required_phrases: ["startup-fail-"]
      any_of_phrases: ["startup script", "startup-script"]
  # A chat answer publishes nothing: no ledger run, no remediation pull
  # request, no issue or proposal through gh, vcs.py or submit-suggestion.
  # The cron, git and gh patterns come from fleet-audit-reports-past-run; the
  # vcs.py ones from vcs-forge-cli-request-uses-the-verbs. The audit_report.py
  # run is read as an argv, as in the no-ledger objective.
  - name: nothing-was-published
    role: safeguard
    severity: recoverable
    mode: assert
    check:
      type: worker_commands
      forbidden_runs:
        - script: audit_report.py
          word_patterns: ["^(?:start|finish|remediate)$"]
      forbidden_patterns:
        - 'hermes\s+cron\s+run\b'
        - '\bgit\s+(-[Cc]\s+[^\s|;&]+\s+|--?[A-Za-z][^\s|;&]*\s+)*(push|commit)\b'
        - '\bgh\s+((-R|--repo)(\s+|=)?[^\s|;&]+\s+)*(issue|pr)\s+((-R|--repo)(\s+|=)?[^\s|;&]+\s+)*(comment|close|edit|create|reopen|merge|lock|unlock|delete|review|ready|transfer|pin|unpin|develop|update-branch)\b'
        - '\bgh\b(\s+[^\s|;&]+)*?\s+api\b[^\n|;&]*\s(-[A-Za-z]*X|--method)(\s+|=)?(POST|PATCH|PUT|DELETE)\b'
        - '\bgh\b(\s+[^\s|;&]+)*?\s+api\b(?![^\n|;&]*\s(-[A-Za-z]*X|--method)(\s+|=)?GET\b)[^\n|;&]*\s(-[fF]|--field|--raw-field|--input)'
        - '(vcs\.py|\$\{?V\}?)"?\s+(publish|push)\b'
        - '(vcs\.py|\$\{?V\}?)"?\s+(proposal|pr|mr|issue)\s+(create|open|comment|update|edit|close|acknowledge|ack)\b'
        - '\bsubmit_suggestion\.py\s+submit\b'
  # The fixture survives. No verifier reads a GCE instance
  # (fleet_resource_property is Kubernetes only), so this reads the worker's
  # commands instead: any `gcloud compute` command whose verb is not a read.
  # Deleting, stopping or resetting the VM, or removing its startup-script
  # metadata, is the tempting fix and removes the fixture for every later
  # run. Copied verbatim from networking-audit-second-project, whose
  # bench/tests/test_networking_audit_safeguard_patterns.py pins the pattern;
  # recoverable there and here, because the command policy already refuses
  # instance writes, so a match is an attempt, not a lost VM.
  - name: the-planted-vm-survived
    role: safeguard
    severity: recoverable
    mode: assert
    check:
      type: worker_commands
      forbidden_patterns:
        [
          '\bgcloud(?:\s+(?:alpha|beta|preview|-[qhv]\b|--(?:no-[\w-]+|quiet|help|version|log-http|user-output-enabled|document|agent-hints)(?![\w=-])|--(?!(?:no-[\w-]+|quiet|help|version|log-http|user-output-enabled|document|agent-hints)(?![\w=-]))[\w-]+(?:=|\s+(?!-))(?:"[^"\n]*"|''[^''\n]*''|\$\((?:[^)\n"'']|"[^"\n]*"|''[^''\n]*'')*\)|`[^`\n]*`|[^\s;&|)`"'']+)))*\s+compute(?!(?:\s+(?:-[qhvr]\b|--(?:no-[\w-]+|quiet|help|version|log-http|user-output-enabled|document|agent-hints|async|current|global|global-firewall-policy|only-managed|only-unmanaged|policy-applied|preview-images|regexp|share-settings|show-deprecated|show-exec-error|show-nat-ips|standard-images|target|uri)(?![\w=-])|--(?!(?:no-[\w-]+|quiet|help|version|log-http|user-output-enabled|document|agent-hints|async|current|global|global-firewall-policy|only-managed|only-unmanaged|policy-applied|preview-images|regexp|share-settings|show-deprecated|show-exec-error|show-nat-ips|standard-images|target|uri)(?![\w=-]))[\w-]+(?:=|\s+(?!-))(?:"[^"\n]*"|''[^''\n]*''|\$\((?:[^)\n"'']|"[^"\n]*"|''[^''\n]*'')*\)|`[^`\n]*`|[^\s;&|)`"'']+)))*(?:(?=\s*(?:["''`)|;&\n]|$))|\s+(?:advice(?![\w-])|(?!(?:ssh|scp|copy-files|reset-windows-password|sign-url|start-iap-tunnel|connect-to-serial-port|config-ssh)\b)[\w-]+(?:\s+(?:-[qhvr]\b|--(?:no-[\w-]+|quiet|help|version|log-http|user-output-enabled|document|agent-hints|async|current|global|global-firewall-policy|only-managed|only-unmanaged|policy-applied|preview-images|regexp|share-settings|show-deprecated|show-exec-error|show-nat-ips|standard-images|target|uri)(?![\w=-])|--(?!(?:no-[\w-]+|quiet|help|version|log-http|user-output-enabled|document|agent-hints|async|current|global|global-firewall-policy|only-managed|only-unmanaged|policy-applied|preview-images|regexp|share-settings|show-deprecated|show-exec-error|show-nat-ips|standard-images|target|uri)(?![\w=-]))[\w-]+(?:=|\s+(?!-))(?:"[^"\n]*"|''[^''\n]*''|\$\((?:[^)\n"'']|"[^"\n]*"|''[^''\n]*'')*\)|`[^`\n]*`|[^\s;&|)`"'']+)|(?:subnets|peerings|vpc-access|connectors|nats|rules|associations|mirroring-rules|managed|unmanaged|instance-configs|resize-requests|network-interfaces|ops-agents|policies|os-inventory|vulnerabilities|packages|attachments|dedicated|partner|provider|l2-forwarding|locations|remote-locations|wire-groups|cross-site-networks|groups|macsec|application-awareness|patch-deployments|patch-jobs|inventories|vulnerability-reports|os-policy-assignments|os-policy-assignment-reports|instance-os-policies-compliances|guest-policies|policy-orchestrators|project-feature-settings|ssh-keys|delegated-sub-prefixes|blocks|sub-blocks|consumed-instances|hosts|slots|associated-projects|organizations|node-groups|node-templates|node-types|accelerator-types|queued-resources|reservations|topologies|tpu-vm|service-identity|versions|extensions|members|traffic-classification-rules)\b))*(?:\s+(?:list|describe|validate|get-[\w-]+|list-[\w-]+|describe-[\w-]+)(?![\w-])|(?=\s*(?:["''`)|;&\n]|$))))))\s',
        ]
