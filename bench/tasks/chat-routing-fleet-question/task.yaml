# Registered in hack/eval/nightly-cases.txt (nightly tier) since 2026-09-15,
# commented out of the presubmit's TASKS array before that.
#
# Domain: chat and routing. Journey: ask the fleet a question through the
# front door; it must be routed to the right specialist via kanban, and the
# answer must come from observed evidence, not the front door's guess.
#
# Planted defect required: none. Needs the deployed chat agent (front door)
# and at least one platform specialist registered, plus the seeded fleet for
# the specialist to read.
# Isolation class: read-only (the testing plan's isolation rule: read-only or namespace-scoped is presubmit-eligible). Eligible tier: presubmit.
#
# NOT a presubmit candidate yet, but no longer for the routing reason this
# header used to give. hack/ci-eval-pr.sh exports a single AGENT_SERVICE_NAME
# ("platform-agent") and the runner port-forwards that one service -- and the
# 2026-08-31 measurement (chat-routing-board-read's activating run, build
# 2094517532634386432) settled that this endpoint serves the front-door
# (default) profile, the profile this prompt needs, so the harness can reach
# it. What holds it now is that it has never been run (validated: false
# below) -- a presubmit seat for a case nobody has watched pass is how a case
# that can only fail reds every pull request; the nightly is where it earns
# the record. See DRAFTS.md, blocker A2, for the measurement record.
#
# The front door holds no infrastructure tools by design (agents/chat/SOUL.md),
# so an answer that names the live fleet can only come from the specialist it
# routed the question to.
#
# ON SPEC.MODE NEXT (#4004). The case grades what the user sees: an answer that
# names the seeded clusters and their version, read from the live fleet. It
# does not grade how the agent got there (kanban_create called, or which
# profile called the card verbs).
id: chat-routing-fleet-question
name: Front door routes a fleet question to a specialist
prompt: >-
  How many GKE clusters are in my fleet right now, and what versions are
  they running?
expected_output: >-
  The front door acknowledges with one line naming what is being checked,
  with no attribution line and no task id. The answer the user receives, the
  platform specialist's, states the cluster count and versions as read from
  the live fleet; where the front door restates the specialist's work in its
  own words, it names the specialist in that sentence.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml: the front door's routing journey.
domain: chat-and-routing

# Exact checks on the answer.
verification_spec:
  # The answer the user receives is the fleet as read, not a guess: the
  # three seeded clusters (agent-kanban-smoke's rendering contract: slots
  # a/b/c under the fleet prefix's default) and a Kubernetes version in the
  # shape gcloud and kubectl report it, with its patch component (1.33.5,
  # v1.33.5, 1.33.5-gke.1080000): a bare 1.NN is too often a quantity.
  - name: the-answer-names-the-fleet-and-a-version
    role: objective
    # assert, not the converge default: the transcript is immutable once the
    # run ends, so polling a failed check would only wait out the timeout.
    mode: assert
    check:
      type: report_contains
      required_phrases: ["seeded-a", "seeded-b", "seeded-c"]
      required_patterns: ['(?<![\w.$])v?1\.\d{2}\.\d+(?!\d|\.\d)']
  # The same inside a delivered card result, the report the notifier posts
  # into the conversation on next: a front door that answered from memory,
  # with no specialist reading the fleet, does not pass.
  - name: the-specialists-answer-names-the-fleet-and-a-version
    role: objective
    mode: assert
    check:
      type: report_contains
      required_patterns:
        - 'result of delegated task \S+:\n(?=(?:(?!\n(?:result of delegated task |question from delegated task |artifact [^\n]* produced by delegated task ))[\s\S])*?seeded-a)(?=(?:(?!\n(?:result of delegated task |question from delegated task |artifact [^\n]* produced by delegated task ))[\s\S])*?seeded-b)(?=(?:(?!\n(?:result of delegated task |question from delegated task |artifact [^\n]* produced by delegated task ))[\s\S])*?seeded-c)(?=(?:(?!\n(?:result of delegated task |question from delegated task |artifact [^\n]* produced by delegated task ))[\s\S])*?(?<![\w.$])v?1\.\d{2}\.\d+(?!\d|\.\d))'
