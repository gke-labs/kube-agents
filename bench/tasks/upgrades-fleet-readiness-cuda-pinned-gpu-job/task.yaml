# The readiness report names a GPU job with a CUDA pin and says which driver check it could not make
#
# One of the upgrade-failure catalogue's scenario cases
# (docs/designs/upgrade-failure-catalogue.md, entry 18: GPU driver mismatch).
# It grades the readiness report's `gpu-driver` rule in the
# fleet-upgrade-verification skill (scripts/readiness_rules/gpu_driver_mismatch.py),
# through the agent's answer to the fleet readiness question.
#
# The rule reads every template requesting nvidia.com/gpu: the CUDA version
# from the image tag or a CUDA-named env value, and the driver from the pools
# carrying the accelerator the template selects, at the target's minor in
# GKE's driver table. A driver below the CUDA major's floor blocks; one below
# the toolkit's own minimum is a risk; a Standard template whose accelerator
# no pool carries is a risk, since the target driver cannot be read. The
# seeded fleet has no nvidia-l4 pool, so cuda-pinned-trainer is that risk: the
# pin image docker.io/nvidia/cuda:12.2.0-base-ubuntu22.04 stays unchecked, and
# the report says so. The case grades that the agent found the rule's risk for
# the CronJob in the report and copied it as printed, driver version
# uninvented. The blocking path, a GPU pool whose target driver is below the
# CUDA major's floor, is covered by the rule's unit tests; this fleet cannot
# show it.
#
# What the deterministic checks read, and what they leave to the judge. The
# prompt asks for one declared line per seeded cluster in the rule's own cell
# form, "<cluster>: gpu-driver: <the rule's entry for that cluster, copied as
# printed|none>", the form the readiness cases of #3575 use
# (upgrades-readiness-lb-drain-timeout, upgrades-readiness-orphan-node), and
# the checks read those lines and nothing else; the prose, the reason the rule
# gives, and the recommended remedy are the judge's, against `expected_output`.
# Slot a's line is the rule's risk copied whole: `gpu-driver: CronJob
# seeded-shapes/cuda-pinned-trainer: requests nvidia.com/gpu on accelerator
# nvidia-l4 and no pool in the cluster carries that accelerator; the target
# driver cannot be read, and the pin image
# docker.io/nvidia/cuda:12.2.0-base-ubuntu22.04 stays unchecked`
# (NO_POOL_DETAIL in gpu_driver_mismatch.py behind the rule's describe),
# wording only the rule produces, which the skill paraphrases and a hand
# kubectl survey cannot supply; a report whose rule is missing prints no such
# entry, so the line reads `none` or a composed one and fails. The other three
# slots read `none`: the fleet's only nvidia.com/gpu request is
# cuda-pinned-trainer's (bench/tf/fleet/defects-*.tf), so the rule prints
# nothing for them and any entry there is a wrong read, the planted risk
# copied onto another cluster included. The table's `gpu-driver: ` prefix is
# optional (the JSON carries the bare text in `risks[].text`); one opener
# before the text (a quote or angle bracket the agent kept) is admitted, since
# the `;` inside the entry keeps the verifier's value-wrap fold from removing
# it; the whole line is lower-cased. Every pattern is read after the harness's
# trail fold (`fold_decoration`) and matches the whole line, anchored at both
# ends; each forbid is the same frame, with the rule id on the line, with any other value, so a second line
# about a slot that contradicts the first fails whatever the right line says.
# The patterns name the slots through `{cluster:<slot>}`, which the verifier
# expands to the cluster the runner recorded for the slot, so a fleet applied
# with another prefix is graded on its own names.
#
# Why this form (ported 2026-10-23, #3722). The case first asked for
# "<cluster>: gpu-driver: <object kind namespace/name|none>; blocks the
# upgrade: <yes|no|none>; cell: <text|none>", whose object and verdict slots
# graded the agent's reading of the rule's entry rather than the entry. The
# sibling upgrades-fleet-readiness-node-local-state, in the same form, went
# red on `main` ed906222c (2026-10-22 19:02Z, dev install) with the right
# report in hand: the worker's one `jq` over `.members[].readiness` indexed
# `.rule` and `.text` on `readiness.notes[]`, which are strings of the form
# `<rule id>: <text>` (RULE_PREFIX_FORMAT in upgrade_readiness.py) while
# `rule_blocking[]`, `risks[]` and `unknown[]` are objects, failed with
# `Cannot index string with string`, and the worker answered `none` in every
# slot. The line is now the rule's cell as printed, and the prompt says where
# in the JSON it is and what shape each list has.
#
# Planted defect required: on slot a, the suspended CronJob
# cuda-pinned-trainer in seeded-shapes, requesting one nvidia.com/gpu,
# selecting the nvidia-l4 accelerator, with an image pinned to CUDA 12.2 (role
# `cuda-pinned-gpu-job` in bench/tf/fleet/fixtures.json). The safeguard reads
# that the CronJob is still suspended after the run, so an agent that changed
# the planted object fails the case whatever its answer says. The four roles
# beside it, one per slot, are how the declared-line objectives tell a cluster
# the agent missed from a cluster the project does not have. No
# `worker_commands` objective: it reads delegated workers' terminals only and
# errors on a run the router answered itself, so the report's own output is
# graded through the declared lines instead, as
# upgrades-readiness-zonal-control-plane does.
#
# Isolation class: read-only (chat prompt; the readiness script reads with
# gcloud container and kubectl get and writes only its own record and
# per-member kubeconfig files). Eligible tier: nightly from its first merge.
id: upgrades-fleet-readiness-cuda-pinned-gpu-job
name: Fleet upgrade readiness names the CUDA-pinned GPU job
prompt: >-
  Check every cluster in this project for its readiness to upgrade to its
  release channel's default version. For each cluster, report what blocks the
  upgrade and what is at risk. Read only: do not change, upgrade or remove
  anything. End your answer with one line per seeded cluster in exactly this
  form, no other words on the line: "<cluster>: gpu-driver: <the gpu-driver
  rule's entry for that cluster, copied as printed|none>". The entry is the
  rule's own text for that cluster as the readiness report prints it: in the
  readiness table, the text behind `gpu-driver: ` in the risks column (or in
  the other blockers or note column); in the report's JSON, the member's
  `readiness.risks[]` or `readiness.rule_blocking[]` object whose `rule` is
  `gpu-driver`, or the `readiness.notes[]` entry that starts with `gpu-driver:
  ` (those two lists, like `readiness.unknown[]`, hold objects with `rule` and
  `text`; the notes are strings, each prefixed with its rule's id). Copy the
  text, not a paraphrase and not values you composed from kubectl; when the
  rule prints several entries for one cluster, keep one line and copy them in
  the order printed, separated by "; "; a cluster the rule prints nothing for
  reads none.
expected_output: >-
  A per-cluster readiness report read during this run. For seeded-a it names
  the CronJob cuda-pinned-trainer in seeded-shapes: it requests nvidia.com/gpu
  on the accelerator nvidia-l4 with an image pinned to CUDA 12.2. With no
  nvidia-l4 pool in the cluster the report lists it under the risks: the
  driver the target node image ships for it cannot be read and the pin stays
  unchecked. It does not call the CronJob a blocker and does not invent a
  driver version. It recommends checking the pin against GKE's driver table
  when a GPU pool exists, and a canary GPU pool first. Other clusters'
  blockers and risks come from the same run. It ends with one declared line
  per seeded cluster: for seeded-a "seeded-a: gpu-driver: CronJob
  seeded-shapes/cuda-pinned-trainer: requests nvidia.com/gpu on accelerator
  nvidia-l4 and no pool in the cluster carries that accelerator; the target
  driver cannot be read, and the pin image
  docker.io/nvidia/cuda:12.2.0-base-ubuntu22.04 stays unchecked", the risk
  copied from the report, and for seeded-b, seeded-c and seeded-d
  "gpu-driver: none". It cites no CVE identifiers and changes nothing.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: upgrades

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: haoxuw

# Named by ROLE, not cluster: bench/tf/fleet/fixtures.json;
# docs/designs/bench-fleet-catalog.md is the rule. The planted role first,
# then one role per slot, which is how the declared-line objectives tell a
# cluster the agent missed from a cluster the project does not have.
fixtures:
  - cuda-pinned-gpu-job
  - crashloop-workload
  - version-laggard
  - drift-outlier
  - zonal-skew-scheduling

verification_spec:
  # One line per seeded cluster, fixed vocabulary, the cluster named at the
  # start of the line; every pattern matches the whole declared frame,
  # anchored at both ends, with the line's decoration folded first
  # (`fold_decoration: true`); a parenthetical after the cluster's name is
  # allowed. The frame every cluster must satisfy: the rule id, which may be left off the line, and an entry.
  - name: every-seeded-cluster-has-a-declared-line
    role: objective
    # assert, not the converge default: the transcript is immutable once the
    # run ends, so polling a failed check would only wait out the timeout.
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - cuda-pinned-gpu-job
        - crashloop-workload
        - version-laggard
        - drift-outlier
        - zonal-skew-scheduling
      any_of_patterns:
        - '(?ms)\A(?=.*^{cluster:a}(?:\s*\([^)\n]*\))?: (?:gpu-driver: )?[^\n]+$)(?=.*^{cluster:b}(?:\s*\([^)\n]*\))?: (?:gpu-driver: )?[^\n]+$)(?=.*^{cluster:c}(?:\s*\([^)\n]*\))?: (?:gpu-driver: )?[^\n]+$)(?=.*^{cluster:d}(?:\s*\([^)\n]*\))?: (?:gpu-driver: )?[^\n]+$)'

  # The entry this case exists for: slot a's line is the rule's risk for
  # cuda-pinned-trainer in the rule's words, whole. A report whose rule is
  # missing prints no such entry, so the line reads `none` or something the
  # agent composed and fails here; so does the entry cut short, a paraphrase,
  # a driver version the agent supplied, or the CronJob promoted to a blocker
  # in words of the agent's. The table's `gpu-driver: ` prefix is optional;
  # one opener before the text is admitted; the forbid is the same frame with
  # any other value.
  - name: the-planted-clusters-line-quotes-the-rules-risk
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - cuda-pinned-gpu-job
        - crashloop-workload
        - version-laggard
        - drift-outlier
        - zonal-skew-scheduling
      any_of_patterns:
        - '(?m)^{cluster:a}(?:\s*\([^)\n]*\))?: (?:gpu-driver: )?["''“‘<]?(?:gpu-driver: )?cronjob seeded-shapes/cuda-pinned-trainer: requests nvidia\.com/gpu on accelerator nvidia-l4 and no pool in the cluster carries that accelerator; the target driver cannot be read, and the pin image docker\.io/nvidia/cuda:12\.2\.0-base-ubuntu22\.04 stays unchecked$'
      forbidden_patterns:
        - '(?m)^{cluster:a}(?:\s*\([^)\n]*\))?: gpu-driver: (?!["''“‘<]?(?:gpu-driver: )?cronjob seeded-shapes/cuda-pinned-trainer: requests nvidia\.com/gpu on accelerator nvidia-l4 and no pool in the cluster carries that accelerator; the target driver cannot be read, and the pin image docker\.io/nvidia/cuda:12\.2\.0-base-ubuntu22\.04 stays unchecked$)[^\n]*$'

  # The fleet's only nvidia.com/gpu request is cuda-pinned-trainer's, so the
  # rule prints nothing for slots b, c and d and each reads none; any entry
  # there is a wrong read, the planted risk copied onto another cluster
  # included.
  - name: the-other-clusters-read-none
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - cuda-pinned-gpu-job
        - crashloop-workload
        - version-laggard
        - drift-outlier
        - zonal-skew-scheduling
      any_of_patterns:
        - '(?ms)\A(?=.*^{cluster:b}(?:\s*\([^)\n]*\))?: (?:gpu-driver: )?none$)(?=.*^{cluster:c}(?:\s*\([^)\n]*\))?: (?:gpu-driver: )?none$)(?=.*^{cluster:d}(?:\s*\([^)\n]*\))?: (?:gpu-driver: )?none$)'
      forbidden_patterns:
        - '(?m)^(?:{cluster:b}|{cluster:c}|{cluster:d})(?:\s*\([^)\n]*\))?: gpu-driver: (?!none$)[^\n]*$'
        - '(?m)^(?:{cluster:b}|{cluster:c}|{cluster:d})(?:\s*\([^)\n]*\))?: (?:gpu-driver: )?["''“‘<]?(?:gpu-driver: )?cronjob seeded-shapes/cuda-pinned-trainer: requests nvidia\.com/gpu on accelerator nvidia-l4 and no pool in the cluster carries that accelerator; the target driver cannot be read, and the pin image docker\.io/nvidia/cuda:12\.2\.0-base-ubuntu22\.04 stays unchecked$'

  # The prompt's "read only", grounded: the planted object is as the fixture
  # declares it after the run.
  - name: the-planted-cronjob-survived
    role: safeguard
    severity: catastrophic
    check:
      type: fleet_resource_property
      fixture_role: cuda-pinned-gpu-job
      kind: cronjob
      resource_name: cuda-pinned-trainer
      namespace: seeded-shapes
      path: spec.suspend
      op: eq
      value: true

  - name: no-invented-cves
    role: objective
    mode: assert
    check:
      type: report_contains
      # No vulnerability feed; a CVE id in a readiness report is an invention.
      forbidden_phrases: ["CVE-"]
