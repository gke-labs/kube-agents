# Smoke task: exercises the eval pipeline end to end without provisioning
# infrastructure. The endpoint the harness POSTs to serves the front-door
# (default) profile, whose platform_toolsets are mcp-router, kanban and
# memory and nothing else (agents/chat/config.yaml), so a question about
# live fleet state cannot be answered at the front door: it has to be filed
# as a kanban card, dispatched to a specialist worker, worked, and delivered
# back into the thread. One realistic question therefore smokes every stage
# this probe exists to cover — card creation, worker dispatch, the harness's
# delegation-wait, and result folding — which is the whole chat-and-routing
# journey through the kanban pipeline.
#
# REDESIGNED after the 2026-08-26 smoke failure (build 2092688354838581248).
# The previous prompt ordered a card titled exactly "devops-bench smoke
# probe" and graded the CHAT PROSE for that title with report_contains. On
# that run the board-side artifact was perfect — kanban_create succeeded
# with the exact title — but the router's receipt read "I've started this as
# task t_c30d5f68" instead of quoting the title back, and the substring gate
# failed a healthy pipeline on phrasing. The card body ("Perform
# devops-bench smoke probe.") was also a meaningless work order the worker
# could only improvise on: across five observed runs the task's agent time
# swung 50s to 1618s, and on the 1618s run the improvisation went as far as
# filing a REAL pull request against the eval GitOps repository. Grading
# chat prose for a fact that lived on the board, on top of a work order with
# no defined deliverable, was the flake. The board write is still asserted
# below; the title and the receipt's wording are not, anywhere.
#
# The deliverable is deterministic because the fleet is planted: every eval
# project carries the seeded trio (bench/tf/fleet/), and "seeded-a",
# "seeded-b" and "seeded-c" are renderings of slots a/b/c under
# var.cluster_prefix's default — the same contract the domain probes'
# seeded-name assertions carry (docs/designs/bench-fleet-catalog.md, "The
# rule is about where a check points"): it survives the default prefix and
# breaks loudly and correctly if the prefix ever changes. No `fixtures:`
# list, deliberately: both checks read the run's transcript, not a cluster,
# and no catalog role means "the trio exists" — the dependency is on the
# fleet stack itself and on the prefix rendering, stated here.
#
# Expected cost bracket: ~100-300s — one delegation round trip plus a single
# fleet read, the shape the six domain probes budget at 150-350s, instead of
# an open-ended work order.
id: agent-kanban-smoke
name: Agent kanban smoke test
prompt: >-
  Which GKE clusters are we running in this project right now? Give me the
  list.
expected_output: >-
  The front door files a kanban card for the question rather than guessing,
  and the specialist's answer is delivered back into the thread: a list of
  the project's GKE clusters read from the live fleet, naming the three
  seeded clusters (seeded-a, seeded-b and seeded-c) from observed evidence.
  Extra clusters in the list are expected — the agent's own host cluster is
  in the same project — and invented ones are not.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml: the probe exercises the chat front
# door's delegation plumbing -- receive, plan, file a kanban card, and fold
# the worker's delivered answer back into the thread.
domain: chat-and-routing

# The answer is graded, not the receipt. The three seeded names are planted
# facts we chose (see the header's rendering contract), so an exact match is
# fair, and required_phrases is substring-AND: extra clusters in the answer
# (the host cluster will usually appear) pass through it naturally. The
# default scope, final, is what the user ultimately receives — the closing
# message plus the delivered card results (see ReportContainsVerifier in
# bench/kube_agents_bench/verifiers.py) — so the worker's delivered answer
# is exactly the text under test.
#
# Deliberately NOT asserted: any card title, and any phrasing of the
# router's acknowledgement. Both are the model's to write, and gating them
# is the retired design this header describes. The card id stays a judged
# concern via expected_output; it is minted per run, and report_contains
# matches substrings only, so no literal phrase can check it.
verification_spec:
  - name: the-answer-names-the-planted-fleet
    role: objective
    # assert, not the converge default: the transcript is immutable once the
    # run ends, so polling a failed check would only wait out the timeout.
    mode: assert
    check:
      type: report_contains
      required_phrases: ["seeded-a", "seeded-b", "seeded-c"]
  - name: the-kanban-card-was-actually-filed
    role: objective
    # assert, not the converge default: the transcript is immutable once the
    # run ends, so polling a failed check would only wait out the timeout.
    mode: assert
    check:
      type: tool_called
      tool_names: ["kanban_create"]
      # An errored kanban_create filed no card, so only successful
      # calls count toward this objective.
      require_success: true
