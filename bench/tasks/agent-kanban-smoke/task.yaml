# Smoke task: exercises the eval pipeline end to end without provisioning
# infrastructure, using only capability the deployed agent actually ships
# with. The platform agent's config (both the image default and the
# operator-rendered production ConfigMap) denylists terminal/file/shell
# toolsets and enables kanban, so the probe must be a kanban action — a task
# that asks for shell access scores 0 against any real deployment.
id: agent-kanban-smoke
name: Agent kanban smoke test
prompt: >-
  Create a kanban task titled exactly "devops-bench smoke probe", then state in
  one sentence the id that was assigned to it.
expected_output: >-
  A kanban task titled "devops-bench smoke probe" is created via the kanban
  tooling, and the final message states the id assigned to it.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml (in review): the probe exercises the chat
# front door's delegation plumbing -- receive, plan, file a kanban card.
domain: chat-and-routing

# We chose the title, so an exact match is fair. The kanban_create call is the
# whole point of the probe: a green judge score with no kanban call would mean
# the agent talked about creating a task instead of creating it.
verification_spec:
  - name: report-states-the-probe-title
    role: objective
    # assert, not the converge default: the transcript is immutable once the
    # run ends, so polling a failed check would only wait out the timeout.
    mode: assert
    check:
      type: report_contains
      required_phrases: ["devops-bench smoke probe"]
  - name: the-kanban-card-was-actually-filed
    role: objective
    # assert, not the converge default: the transcript is immutable once the
    # run ends, so polling a failed check would only wait out the timeout.
    mode: assert
    check:
      type: tool_called
      tool_names: ["kanban_create"]
      # An errored kanban_create filed no card, so only successful
      # calls count toward this objective.
      require_success: true
