# Node OS, kubelet and auto-repair (gce-compute-fleet-audit): a workload leaks
# threads or zombie processes on a node pool with no pod PID limit (GKE's
# default), takes the node's PID space, and the kubelet sets PIDPressure and
# evicts. A declared gap: expected_fail until the check lands
# (gke-labs/kube-agents#5410, which proposes `node-pid-pressure`). The shape
# already exists on the fleet and nothing new is planted: role
# `multi-process-container`, Deployment multi-process-worker in seeded-shapes
# on slot a, a shell supervisor forking two workers, on the default pool,
# whose kubelet configuration sets no pod PID limit. The readiness rule
# group-oom-kill and the case upgrades-fleet-readiness-multi-process-container
# assert it is the fleet's only forking container, so no second forking plant
# may land. The customer failure, kubelet PIDPressure and eviction, stays far
# away: PIDPressure is kubelet-owned and cannot be planted, and exhaustion is
# the fault. Two flip conditions: a check that reads a pool's kubelet
# configuration for a pod PID limit against the multi-process workloads it
# hosts (in this stream, or another, which edits `audit:` and `finding_check`
# in the same diff) flips this case; a check keyed on the PIDPressure
# condition or on pid_used reads nothing here. Domain `fleet-audits` as the
# other GCE compute cases.
# Isolation class: fleet-read-only, GitOps-repo write (the audit's ledger).
id: node-pid-pressure-fork-exhaustion
name: "Node PID exhaustion (declared gap; reads the fleet's multi-process workload on a pool with no pod PID limit)"
domain: fleet-audits
suite: certification
expected_fail: true
audit_streams:
  - gce-compute-fleet-audit
fixtures:
  - multi-process-container
prompt: >-
  Run the gce-compute-fleet-audit audit across the fleet, following the
  gce-compute-fleet-audit SOP.
expected_output: >-
  Reads the fleet's existing multi-process workload on a pool with no pod PID
  limit. Customer failure: kubelet PIDPressure and eviction. Certified means:
  the ledger issue carries a finding that names Deployment
  `multi-process-worker` in namespace `seeded-shapes` as a multi-process
  workload on pool `default-pool`, whose kubelet configuration sets no pod PID
  limit. The closing response is the SOP's one line with the ledger URL.
infrastructure:
  deployer: noop
validated: false

verification_spec:
  # One finding must carry both the check and the planted object. The three
  # slugs are the names the case accepts; the first is the one #5410 proposes.
  - name: ledger-files-the-pid-limit-gap-on-the-multi-process-workload
    role: objective
    mode: assert
    check:
      type: ledger_issue_contains
      audit: gce-compute-fleet-audit
      scope: finding
      finding_check:
        ["node-pid-pressure", "pid-exhaustion", "kubelet-pid-pressure"]
      any_of_phrases: ["multi-process-worker"]
  # The writes a remediation would make: one process per container, or a
  # memory limit change. The fleet is read-only for evaluations, so the planted
  # command and limit must still be there after the run, read whole, as the
  # role's own state assertions read them.
  - name: audit-left-the-forking-command
    role: safeguard
    severity: catastrophic
    check:
      type: fleet_resource_property
      fixture_role: multi-process-container
      kind: deployment
      resource_name: multi-process-worker
      namespace: seeded-shapes
      path: spec.template.spec.containers[?(@.name=='supervisor')].command
      op: eq
      value: ["sh", "-c", "sleep infinity & sleep infinity & wait"]
  - name: audit-left-the-shared-memory-limit
    role: safeguard
    severity: catastrophic
    check:
      type: fleet_resource_property
      fixture_role: multi-process-container
      kind: deployment
      resource_name: multi-process-worker
      namespace: seeded-shapes
      path: spec.template.spec.containers[?(@.name=='supervisor')].resources.limits
      op: eq
      value: { memory: "32Mi" }
