# NIGHTLY-TIER: a full audit, the same cost band as the other fleet-audit
# cases, registered in hack/eval/nightly-cases.txt. The VM below is on every
# pool project. The fixture-state scan checks its failure line on the serial
# console, and each reconcile's reset of the VM keeps it there.
#
# The check this case grades is `gce-startup-script-status`, GCE compute SOP
# §2.1: a RUNNING instance whose startup script failed. The collector
# (skills/gce-compute-fleet-audit/scripts/compute_fleet_audit.py) reads the
# serial console of every instance that runs a startup script and flags the
# failure line.
#
# Planted state: bench/tf/fleet/main.tf `google_compute_instance.startup_fail`,
# `startup-fail-<cluster_prefix>` in the fleet's zone, whose script exits 1 on
# every boot. It is a project-level object, not a cluster's: the
# project-scoped startup-fail-vm role in bench/tf/fleet/fixtures.json
# (cluster_slot null), which the runner probes with gcloud. No check reads it
# by `fixture_role:`, because the role has no kubeconfig.
#
# The failure line is on the serial console only after a boot. The guest
# prints it once per boot, and the VM's serial buffer (about 1 MiB) rotates
# it out about three weeks later. Without the line the case has no finding to
# grade. hack/fleet_reconcile.py resets the VM after each project whose
# state it reads, and the fixture-state scan asserts the line on the
# console (`serial_contains`), so a rotated buffer is fixture drift. The case
# is recorded as infrastructure, not run, once the hourly scan has held the
# role drifted on its last two scans and the lease-time scan sees it drifted
# too (bench/kube_agents_bench/fixture_drift.py); otherwise it is graded. On
# a console without the line the collector finds no failure line and files
# nothing.
#
# Eval-driven development (.agents/rules/eval_driven_development.md): the
# case was red before the collector fix. The collector knew only the markers
# of the older guest agent (`startup-script exit status 1`, `Finished running
# startup scripts with error`). The current agent prints `Script
# "startup-script" failed with error: exit status 1` and a plain `Finished
# running startup scripts`, so no finding was filed. The collector now
# recognises the current line too, and the case is green.
#
# Isolation class: read-only on the project; writes the ledger issue to the
# eval GitOps repo, as every fleet-audit stream does.
id: gce-startup-script-failure
name: GCE compute audit files the VM whose startup script failed
prompt: >-
  Run the GCE compute fleet audit, following the gce-compute-fleet-audit SOP.
expected_output: >-
  The ledger issue carries a gce-startup-script-status finding against the
  standalone VM whose startup script exits 1. The closing response is the
  SOP's one line, carrying the ledger URL in full.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: fleet-audits

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: dshnayder

# Documentation, and the role the lease-time fixture-drift pass reads for
# this case (bench/kube_agents_bench/fixture_drift.py).
fixtures:
  - startup-fail-vm

verification_spec:
  # The slug against the LEDGER's finding ids (scope: finding_ids), as
  # consistency-no-environment-label explains: an id carries the check slug,
  # and the rendered body's evidence table restates every roster slug on every
  # run, so only a filed finding satisfies it. The VM's name cannot be graded
  # there: `_shorten_id` clips an id to MAX_FINDING_ID, and the zone in
  # `ComputeInstance/<zone>/<name>` pushes the clip into the name on every pool
  # project. It is graded against the body instead, as `/startup-fail-`: the
  # body also names the VM in the evidence appendix's serial-read commands
  # and in a limitations sentence, but always after a space, while only a
  # finding's object path (`ComputeInstance/<zone>/startup-fail-...`, in its
  # heading and its Where: line) puts it after a slash.
  - name: a-startup-script-finding-was-filed
    role: objective
    # assert, not converge: the ledger is written once, at `finish`.
    mode: assert
    check:
      type: ledger_issue_contains
      audit: gce-compute-fleet-audit
      scope: finding_ids
      required_phrases: ["gce-startup-script-status"]
  - name: the-ledger-names-the-planted-vm
    role: objective
    mode: assert
    check:
      type: ledger_issue_contains
      audit: gce-compute-fleet-audit
      required_phrases: ["/startup-fail-"]
