# Domain: fleet audits. Journey: a fresh install's onboarding discovery sweep
# has written its raw report, and the prioritization stage turns it into the
# ranked report onboarding delivers to the user, and the delivery job picks
# that report up.
#
# That stage is not started by a conversation. The sweep's worker files the
# `bootstrap-inventory-prioritize` card once INVENTORY.raw.md is written, and
# that card's worker follows agents/platform/governance/inventory_prioritize_sop.md,
# whose Step 2 runs `inventory_findings.py extract` through its terminal.
# With the shell sandbox on, that terminal is the sandbox pod, so the script
# has to be in the sandbox image and the files it writes land on the
# sandbox's data volume. Nothing a chat prompt says reaches that path, so the
# prompt below only reads the board; the grade comes from the stack and the
# verifiers.
#
# The ranked report lands on the sandbox too, and the delivery job
# (agents/chat/scripts/bootstrap_delivery.py) runs in the agent pod, so it
# reads the report through the sandbox rather than off its own disk.
#
# bench/tf/prebuilt/bootstrap-ranking plants a fixed raw report on the
# sandbox, files the prioritization card the way the sweep's worker does,
# waits until that card's worker has ended its run itself or the stack's
# `run_wait` (900s) has passed, and then arms delivery by touching
# `.user_aligned`, as the onboarding plugin does when a person first chats.
# The apply fails if no worker has picked the card up by then or no read of
# the board has succeeded. The first objective reads INVENTORY.items.json off
# the sandbox and compares its findings with the raw report's findings block;
# the second reads whether the delivery job claimed the report and moved it
# aside on the sandbox; the third reads whether the scheduler kept the run
# that did so, which it must for the report to be posted.
#
# The stack refuses an install where a person has connected or been greeted,
# onboarding has already delivered, either onboarding cron job is gone, or the
# delivery job is paused or bound to a chat: the ranked report this produces is
# the one onboarding sends to the user. It also refuses one whose gate has not filed its sweep,
# and one without exactly one shell sandbox pod. The checks are one read at
# the start, so run the case on an eval install nobody chats with: a first
# chat after the stack arms delivery and before the delivery job claims the
# report is sent the ranked report, and one before the arm fails it and is
# sent the report only if delivery claims it first.
#
# Isolation class: read-only on the cluster; it plants the raw report on the
# install under test, files one card and touches `.user_aligned`, and the
# destroy archives the onboarding cards, removes the INVENTORY files from both
# pods, removes `.user_aligned`, `.bootstrap_completed` and
# `.bootstrap_sandbox_unanswered`, and puts back whichever onboarding cron job
# the delivery removed. Eligible tier: nightly -- one card's worker runs the
# whole prioritization SOP, which takes a dispatcher slot for most of the
# stack's wait.
---
id: bootstrap-inventory-ranking-delivery
name: Onboarding extracts the sweep's findings in the shell sandbox and delivers the report from there

# No seeded-fleet dependency: the raw report is a fixed file the stack plants.
fixtures: []

infrastructure:
  deployer: "tofu"
  provider: "gcp"
  stack: "prebuilt/bootstrap-ranking"
  teardown: true
  # host_cluster_* arrive from the environment (TF_VAR_host_cluster_name /
  # TF_VAR_host_cluster_location, exported by hack/ci-eval-pr.sh), because they
  # name the install the runner deployed and no task may choose a different
  # one. The stack defaults everything else.

validated: false

# Slug per docs/designs/domains.yaml: the prioritization stage is the second
# half of the fleet-wide audit onboarding runs once.
domain: fleet-audits

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: maintainers

# A board read that leaves the card alone. The session this prompt reaches is
# the Platform Agent's API session, not the card's worker, and it must not
# start, retry or complete the card: the verifiers read what the worker wrote,
# and a file this session wrote would be graded as the worker's. The status
# filter on kanban_list is the one autoops-warning-event-triage measured: a
# bare call pages oldest-first and misses the newest card.
prompt: |
  The onboarding inventory prioritization card for this install was filed a
  few minutes ago as a kanban card with idempotency key
  'bootstrap-inventory-prioritize'.

  1. Find it. Call kanban_list separately for status 'running', 'blocked',
     'todo' and 'done'. Do not call kanban_list without a status filter -- it
     returns the oldest tasks first and stops at a page.
  2. Report its id, its status, and the summary of its latest run.

  Only read the board. Do not start, retry, unblock, archive, complete or
  create any card, and make no changes to the cluster.
expected_output: |
  critical requirements:
  - The reply names the prioritization card and reports its status and
    latest run, read off the kanban board.
  - No card is created, moved or archived, and nothing is changed on the
    cluster.

verification_spec:
  # Reads INVENTORY.items.json off the shell sandbox
  # (kube_agents_bench/onboarding.py), not the transcript. The pairs are the
  # findings block in bench/tf/prebuilt/bootstrap-ranking/inventory-raw.txt;
  # bench/tests/test_bootstrap_ranking.py keeps the two equal.
  - name: findings-extracted
    role: objective
    check:
      type: bootstrap_findings
      expected_findings:
        - { check: sa-key-in-secret, object: checkout }
        - { check: workload-identity-off, object: prod-east }
        - { check: probes-readiness, object: cart }
        - { check: probes-readiness, object: frontend }
        - { check: no-memory-limit, object: orders-db }
        - { check: managed-prometheus, object: prod-east }
  # Reads the agent pod's `.bootstrap_completed` and the sandbox's INVENTORY
  # files (kube_agents_bench/onboarding.py). The delivery job writes the
  # marker when it claims the report and renames INVENTORY.md to
  # INVENTORY.delivered.md on the sandbox once it has read it.
  - name: report-read-from-sandbox
    role: objective
    check:
      type: bootstrap_report_read
  # Reads the delivery job's runs in the agent pod's cron/executions.db
  # (kube_agents_bench/onboarding.py). The run that claimed the report has to
  # complete: the scheduler discards the output of a run whose job was removed
  # while it ran.
  - name: report-delivered
    role: objective
    check:
      type: bootstrap_delivered
