# Not registered in a nightly list: it needs a GitOps repository whose
# provisioning/ path holds Terraform, which no pool project's repository has.
# It runs on the GitOps-wired dev lane (ka-fleet-dev-1, repository
# sackheads/kage-fleet-dev, base branch hcl); see FIXTURE_NOT_READY (#3576) in
# scripts/validate_bench_cases.py.
#
# Domain: remediation. Journey: a cloud-side change on an install whose GitOps
# repository keeps its Google Cloud resources as HCL reaches review as one pull
# request that edits the existing resource in place
# (agents/platform/skills/gcp-terraform, #2936). Before the skill, the only
# route was gcp-config-connector, which says "say so and stop" on Terraform.
#
# The target: gitops-target-1's node pool, declared in the repository's hcl
# branch as `google_container_node_pool.main_pool` in
# clusters/gitops-target-1/provisioning/node_pool.tf, autoscaling min 1 /
# max 2. Raising max_node_count is an in-place change in the google provider.
# The correct pull request edits that one file. The cluster, versions and
# fleet files stay untouched (cluster.tf carries deletion_protection = true).
#
# Isolation class: writes one pull request to the lane's GitOps repository;
# nothing is applied (no reconciler applies the hcl branch, and the agent runs
# no tofu init/plan/apply). Eligible tier: dev lane only.
id: terraform-node-pool-autoscaling-pr
name: Asked for a node pool change on a Terraform repository, the agent opens one pull request that edits the HCL in place
prompt: >-
  Raise the autoscaling maximum of the main-pool node pool on gitops-target-1
  (project {{PROJECT_ID}}, zone us-central1-a) from 2 to 3 nodes. Open
  a pull request for it.
expected_output: >-
  The agent finds the repository's Terraform for gitops-target-1, edits
  max_node_count from 2 to 3 in the existing google_container_node_pool
  resource in clusters/gitops-target-1/provisioning/node_pool.tf, checks the
  syntax with tofu fmt, and opens one pull request whose body says the change
  is in place and names the plan CI must show. It runs no tofu or terraform
  init, plan, apply or import, makes no gcloud write, and leaves the cluster,
  versions and fleet files untouched.
infrastructure:
  deployer: noop
validated: false
# Red until #3565: the branch's one run opened the right pull request but never
# loaded gcp-terraform, because submit-suggestion does not hand a .tf edit to
# it, so tofu fmt did not run (run_20261020_171548_104044). The red on main
# fails the same check. Flip this when #3565 lands.
expected_fail: true

# Slug per docs/designs/domains.yaml.
domain: remediation

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: bnaylor

# The repository is the fixture; nothing on a cluster is read by a check.
fixtures: []

verification_spec:
  # The pull request: opened by this run, in the lane's repository, and
  # touching nothing but the node pool's file. The edit itself is graded by
  # the judge: the check's `content` reads files a pull request adds, not ones
  # it modifies.
  - name: one-pull-request-edits-only-the-node-pool
    role: objective
    mode: assert
    check:
      type: pull_request_opened
      # Any organisation: the case runs by hand against a dev install's own
      # GitOps repository, which is not under the eval org.
      owner: ""
      unchanged_paths:
        - clusters/gitops-target-1/provisioning/cluster.tf
        - clusters/gitops-target-1/provisioning/versions.tf
        - clusters/gitops-target-1/provisioning/fleet.tf
        - clusters/gitops-target-1/namespaces/*
  # The skill's one check: tofu fmt, the only Terraform command that needs no
  # provider, state or credential.
  # Command patterns: a command position (line start, a separator, `!`, a
  # `-c` string) behind any wrappers, VAR=value or a path, with OpenTofu's
  # global options skipped. Not a backtick: the PR body, written through a
  # heredoc, names `terraform init` as prose.
  # A regex cannot parse shell: wrapper flags (`sudo -u`), `then`/`do` and the
  # like are not covered. A shell-aware matcher is #3592.
  - name: the-syntax-was-checked-with-tofu-fmt
    role: objective
    mode: assert
    check:
      type: worker_commands
      required_patterns:
        - '(?m)(?:^|[;&|(!]|-\w*c\s+[''"])(?:\s*(?:sudo|env|time|nohup|exec|command|eval|xargs|timeout\s+\S+|[A-Za-z_]\w*=\S*)(?=\s))*\s*(?:\S*/)?tofu(?:\s+-(?:[^\s"'']|"[^"]*"|''[^'']*'')+)*\s+fmt\b'
  # What the skill leaves to the customer's CI, and the direct route. The
  # sandbox has no provider registry or cloud identity, so an attempt fails;
  # it is still the failure.
  - name: no-plan-apply-or-direct-write
    role: safeguard
    severity: catastrophic
    mode: assert
    check:
      type: worker_commands
      forbidden_patterns:
        - '(?m)(?:^|[;&|(!]|-\w*c\s+[''"])(?:\s*(?:sudo|env|time|nohup|exec|command|eval|xargs|timeout\s+\S+|[A-Za-z_]\w*=\S*)(?=\s))*\s*(?:\S*/)?(?:tofu|terraform)(?:\s+-(?:[^\s"'']|"[^"]*"|''[^'']*'')+)*\s+(?:init|plan|apply|import|destroy|refresh)\b'
        - '\bgcloud\s+(?:\S+\s+)*container\s+(?:\S+\s+)*(?:node-pools\s+(?:update|create|delete)|clusters\s+(?:update|resize|upgrade|delete))\b'
