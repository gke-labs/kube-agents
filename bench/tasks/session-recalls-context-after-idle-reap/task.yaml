# Domain: chat and routing. Journey: a user gives the agent a detail, steps
# away for longer than a coffee, and asks about it again in the same DM.
#
# WHAT THIS GRADES. The gateway reaps a single-turn DM's session pod after
# the DM idle TTL (5 minutes by default, gke-labs/kube-agents#2371), and every
# other session's after its idle TTL (30 minutes). The next message on the
# conversation spawns a fresh pod, which starts from a transcript primer the
# gateway builds from the conversation's history (a2a/gateway/reap.go,
# buildRehydrationPrimer). Under a 5-minute TTL, a multi-turn caller that
# pauses between turns lands on a rehydrated pod far more often than under
# 30, so the primer carrying the earlier turn is what this case holds.
#
# The opening starts with `/session`, so the conversation is session-routed
# on an install whose default addressee is still `platform` (a plain DM runs
# on platform there, holds no session pod, and is never reaped). Once the
# session route is the default, `/session <text>` runs the text unchanged.
#
# HOW IT REACHES THE PATH. The prompt is a directive
# (kube_agents_bench/idle_reply.py): the opening runs as turn one through
# the inject door, the harness waits idle_seconds with the conversation
# idle, then sends the reply on the same conversation. 480 seconds is past
# the 5-minute TTL plus a sweep (a live run reaped at 5m53s), so the reply
# reaches a rehydrated pod on a build with the DM TTL. On a build without
# it, the 30-minute TTL keeps the pod warm, and the rehydration objective
# fails: the harness checks the reply ran on a different pod from the
# opening's. So this case lands after the DM TTL (gke-labs/kube-agents#6127).
#
# RED WITHOUT THE PRIMER, GREEN WITH IT. The opening gives a change ticket
# that exists nowhere (KA-7741-ORCHID). A pod that starts from the primer
# answers with it; one that starts blank cannot know it, and no tool returns
# it, so it asks or says it has no such ticket: the objective fails.
#
# `fixtures: []`: the case reads no cluster. Needs the inject door, which
# every CI lane grades through.
id: session-recalls-context-after-idle-reap
name: A DM answered after an idle reap still has the earlier turn
prompt: |-
  [bench:reply-after-idle]
  opening: /session Tonight's change ticket is KA-7741-ORCHID; I'll ask about it later. For now reply with OK and nothing else.
  idle_seconds: 480
  reply: Which change ticket did I give you earlier in this conversation? Answer with the ticket alone, in one line.
expected_output: >-
  One line naming KA-7741-ORCHID, the ticket the user gave in the opening
  turn. No task is filed and no cluster is read.
infrastructure:
  deployer: noop
fixtures: []
validated: false

domain: chat-and-routing

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: bnaylor

verification_spec:
  - name: the-reply-names-the-ticket-from-the-earlier-turn
    role: objective
    mode: assert
    check:
      type: report_contains
      # A phrase, not a pattern: patterns run on the lowercased report, so an
      # uppercase pattern never matches. A phrase is normalised on both sides.
      required_phrases:
        - "KA-7741-ORCHID"
  # The reply ran on a fresh pod: the harness reads the conversation's session
  # pod after each turn, and its wait entry completes only when they differ.
  # A reply that reached the warm pod (no reap during the wait, as on a build
  # without the DM idle TTL) fails here rather than passing for the wrong
  # reason.
  - name: the-reply-ran-on-a-rehydrated-pod
    role: objective
    mode: assert
    check:
      type: tool_called
      tool_names: ["harness_idle_wait"]
      require_success: true
  # recoverable, not catastrophic: a card is a routing failure, not a fleet
  # mutation.
  - name: no-card-for-a-question-the-conversation-answers
    role: safeguard
    severity: recoverable
    check:
      type: none
      checks:
        - type: tool_called
          tool_names: ["kanban_create"]
