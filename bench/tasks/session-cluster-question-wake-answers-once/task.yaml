# WHAT THIS GRADES: a `/session` turn that delegates a cluster question ends
# in an answer, not in the delegation depth bound. A session pod without the
# session cluster view can't see the cluster, so it hands the question to the
# platform agent. (Since #6993 the session route turns the view on by
# default, and with it the session may answer from its own reads.) The platform agent often hands the work on
# and replies with an interim line ("checking cluster namespaces and pods").
# The session's wake turn read that as a reason to delegate again, and each
# wake did, until the chain ended on "delegation refused: this conversation
# has delegated as deep as it may (3)" with nothing answered (#2819). A wake
# now has no delegate tool, so the chain is one delegation and one wake.
#
# A second check counts the chain's child tasks (#7245): at most one. Once a
# wake may delegate again (#6861), a wake that loops gets no tool at the
# depth bound and just answers, so the chain can end without a refusal
# notice; the count still sees every delegation, the repeats the addressee
# list names once. It sets no minimum: a session pod with the cluster view can
# answer this question from its own reads without delegating at all. A batch
# of two children in one turn also counts two and fails: for this one
# question the expected shape is a single hand-off, and the count can't tell
# a batch from a wake that delegated again.
#
# What is checked first is the refusal itself. The wake's answer has no fixed
# wording, and it may honestly say only that the platform agent returned an
# interim line, so the answer's quality is left to the judge.
#
# TRANSPORT: this only means something under AGENT_TRANSPORT=inject against a
# `spec.mode: next` install, where the gateway routes `/session ...` to a
# session pod and the read route follows the chain to the wake. Under the api
# transport the text reaches the platform agent as an ordinary prompt, no
# delegation chain exists, and the refusal-phrase check passes without
# testing anything; it forbids phrases rather than requiring any so it can't
# red the api lane for a reason that lane can't show. The child-count check
# reports an error there instead, never a pass or a fail, since that lane has
# no chain to count.
id: session-cluster-question-wake-answers-once
name: A session's delegated cluster question ends in an answer, not the depth bound
prompt: >-
  /session what namespaces exist in this cluster, and which of them have pods
  that are not running?
expected_output: >-
  The session answers in one reply, either from its own reads (with the
  session cluster view) or after delegating the question to the platform agent
  at most once: either the namespaces and any pods that are not running, or a
  plain statement that the platform agent returned only an interim answer and
  the details will need another turn. It does not delegate again, and the
  conversation does not end on a delegation refusal.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml: a chat question routed to the agent that
# can answer it.
domain: chat-and-routing

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: bnaylor

verification_spec:
  - name: the-chain-does-not-end-on-the-depth-bound
    role: objective
    # assert, not the converge default: the transcript is immutable once the
    # run ends, so polling a failed check would only wait out the timeout.
    mode: assert
    check:
      type: report_contains
      # The gateway's refusal notices (a2a/gateway/delegation.go). Any
      # refusal fails the case; the depth bound's is the one the loop ended
      # on.
      forbidden_phrases: ["delegation refused", "delegated as deep as it may"]
  - name: the-chain-delegates-at-most-once
    role: objective
    mode: assert
    check:
      type: delegated_to
      # Every child task of the chain, repeats included (the read route's
      # childCount): one delegation and its wake's answer, never a second.
      max_children: 1
