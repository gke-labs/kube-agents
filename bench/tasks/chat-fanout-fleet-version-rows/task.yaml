# Registered in hack/eval/nightly-cases.txt. Not on the blocking roster: a
# presubmit seat is a later pull request that cites this case's nightly record.
#
# Domain: chat and routing. A question about every cluster reaches the front
# door, goes to platform as one card, and platform fans it out one card per
# cluster (agents/platform/SOUL.md, "Multi-cluster work (fan-out)"). With the
# Slack board view on, each per-cluster card shows as one row of the thread's
# plan, its title then the first line of its result, and its completion posts
# nothing else (deploy/docker/patches/kanban_progress_lines.py, the fold). So
# the title is what the user reads as the row's name: a card titled
# "Check version of seeded-a" renders a row that says so, where the plan wants
# "seeded-a · 1.33.4 = default".
#
# The objective therefore grades the shape of the fan-out, not only that it
# happened: three kanban_create calls by the platform worker, each titled with
# a bare seeded cluster name. The answer is graded on what the fleet plants
# (the version-laggard role holds slot b one minor behind its channel
# default), so a fan-out that reads nothing still fails. Version numbers move
# with the channel and are never asserted.
#
# The Slack rendering itself is not graded here: the harness talks to the API
# server, not Slack. The patch tests cover the rows' wiring; this case holds
# the agent to the inputs those rows are built from.
#
# Planted defect required: the seeded fleet's version-laggard role.
# Isolation class: read-only.
id: chat-fanout-fleet-version-rows
name: A fleet question fans out one card per cluster, titled with its name
prompt: >-
  which clusters are behind their release channel default?
expected_output: >-
  The front door files one card for the platform specialist and acks with one
  line naming what it is checking, such as "checking all 3 clusters." The
  platform worker files one card per seeded cluster, each titled with the bare
  cluster name (seeded-a, seeded-b, seeded-c), and each card's result opens
  with a one-line finding such as "1.33.4 = default". The answer leads with
  what differs: seeded-b is behind its REGULAR channel default, citing the
  versions as read, and names the current clusters in a clause. Nothing is
  changed or upgraded.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml: a fleet question routed and answered
# from observed evidence.
domain: chat-and-routing

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: jayantid

# Named by ROLE, not cluster: bench/tf/fleet/fixtures.json;
# docs/designs/bench-fleet-catalog.md is the rule.
fixtures:
  - version-laggard

verification_spec:
  # scope: workers with agent: platform reads the platform worker's own calls,
  # not the front door's one card. The title pattern is the bare name the
  # plan row renders; "Check seeded-a" or a card per namespace does not count.
  - name: one-card-per-cluster-titled-with-its-name
    role: objective
    # assert, not the converge default: the transcript is immutable once the
    # run ends, so polling a failed check would only wait out the timeout.
    mode: assert
    check:
      type: tool_called
      tool_names: ["kanban_create"]
      scope: workers
      agent: platform
      arguments:
        title: "seeded-[abc]"
      minimum_calls: 3
      require_success: true
  # "seeded-b" is slot b under the fleet prefix's default, the contract
  # upgrades-fleet-version-table carries; the lag phrases are its seven.
  - name: the-answer-names-the-lagging-cluster
    role: objective
    mode: assert
    check:
      type: report_contains
      required_phrases: ["seeded-b"]
      any_of_phrases:
        [
          "behind",
          "lagging",
          "not current",
          "out of date",
          "outdated",
          "one minor",
          "newer version",
        ]
  # The front door holds no infrastructure tools and never works a card
  # itself. No require_success: an attempted worker-verb call is the
  # violation, successful or not.
  - name: front-door-stays-out-of-the-worker-verbs
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        - type: tool_called
          tool_names: ["kanban_complete", "kanban_block", "kanban_heartbeat"]
