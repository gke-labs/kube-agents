# Smoke task: exercises the eval pipeline end to end without provisioning
# infrastructure. The agent is asked something it can answer from its own
# runtime, so a run validates transport, trajectory capture, and judging
# rather than any cluster behaviour.
#
# `expected_output` describes only what the final text should say. Whether the
# agent actually invoked the tool is scored from the trajectory by the
# ToolInvocation metric, so asserting it here as well penalises a correct run
# for something the output text cannot evidence.
id: agent-self-report
name: Agent self-report smoke test
prompt: >-
  Using your terminal tool, run `echo kube-agents-eval-ok` and then state, in
  one sentence, the exact output the command produced.
expected_output: >-
  A single sentence stating that the output was kube-agents-eval-ok.
infrastructure:
  deployer: noop
validated: false
