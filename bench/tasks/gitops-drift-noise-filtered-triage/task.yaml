# FIXTURE NOT READY — a FIXTURE_NOT_READY entry in scripts/validate_bench_cases.py
# until #2137 gives the drift detector a way to declare one principal human
# ahead of its service-account test.
#
# Domain: incident triage. Journey: a burst of changes lands on one namespace,
# almost all of it controller churn, and the drift pipeline files a triage for
# the one a person made and for nothing else.
#
# This is CUJ 3 of docs/designs/drift-detection.md — "noise-filtered triage",
# the one that table marks as the enabler. The sibling case
# gitops-drift-out-of-band-triage grades the drift pipeline's delivery with a
# single record and no noise around it; this one grades the discrimination,
# which is the part CUJ 3 is about and the part nothing exercises today.
#
# WHAT THE FIXTURE HAS TO DO, AND WHY IT CANNOT YET
#
# The filter is the principal classifier (k8s-operator/cmd/drift-detector/
# classify.go): a record's principal is sorted into system, automation,
# unattributed or human, and only the human tier reaches the inject. The
# managedFields join the CUJ table names is the enrichment on top of it — it
# says which field manager owns what the change touched, which is how the
# report can name an edit as out-of-band rather than merely recent.
#
# So a fixture for this case has to produce audit records in both tiers. The
# automation half is free. The human half cannot be produced at all today, and
# the reason is the order of the tests rather than a missing flag. Classify
# returns on the first match: empty, then the "system:" prefix, then the
# --automation-principals allowlist, then a .gserviceaccount.com suffix, and
# only after all four does it consult isHuman. Every identity a bench run can
# authenticate as is caught by one of the earlier branches — a GCP service
# account by the suffix, a Kubernetes ServiceAccount token by the prefix — so
# isHuman is never reached for it, and --human-domains, which only narrows
# isHuman, cannot promote it. --automation-principals moves in the wrong
# direction: it only ever adds to the automation set. Impersonation is not a
# way round either; the README records that a person acting through an
# impersonated service account arrives as that account.
#
# What the fixture needs is therefore a classifier change, not just a flag made
# reachable: an exact-match human declaration consulted ahead of the
# service-account suffix test — a --human-principals symmetric to
# --automation-principals — and reachable from configuration, which today
# neither of the two existing lists is (deploy/shared/start-services.sh builds
# detector_args and passes neither).
#
# #2137 is that gap. With it closed, the stack this case still needs declares
# its own identity human, plants the namespace below, and drives the burst.
#
# WHY THE HUMAN CHANGE IS NOT THE NEWEST ONE
#
# The churn continues after it, deliberately. The prompt tells the agent to
# take the most recent card for the namespace — inherited from the sibling,
# where a bare kanban_list pages oldest-first and misses the newest — so if the
# pipeline filtered nothing, the newest card would be controller churn and the
# agent would reproduce that instead. The objectives below then fail on both
# halves at once: payments-api absent, a churned workload present. A filter
# that silently stopped working reds rather than passing on a coincidence.
#
# WHY THE FORBIDDEN PHRASES CARRY THE CASE
#
# Same hazard as the sibling, sharper here. An agent that ignores "do not
# diagnose anything yourself", lists the namespace and reads managedFields off
# the objects would find all three workloads and name them, because the noise
# is on the live objects exactly as the human change is. Requiring payments-api
# alone would pass for that agent. Forbidding the two churned workloads is what
# distinguishes a report the pipeline filtered from a report the agent wrote.
#
# PLANTED STATE REQUIRED
#
# This is the spec whoever writes the stack works from, so it names everything
# the grading below depends on. The sibling declares its equivalents as
# infrastructure.variables precisely so the prompt, the checks and variables.tf
# cannot drift apart; these should move there when the stack lands, and change
# together when any one of them changes.
#
# - Namespace eval-drift-noise on the HOST cluster — the one the runner
#   deployed, which no task may choose.
# - Three Deployments: payments-api (container name `api`), ledger-worker,
#   checkout-web. The two churned names are what the forbidden_phrases check
#   keys on.
# - payments-api's declared spec is owned by field manager argocd-controller,
#   and declares resources.limits.memory 256Mi. expected_output requires the
#   report to name that manager against the one that took the field.
# - One human change: memory limit on payments-api's `api` container raised to
#   512Mi, written by field manager kubectl-edit, by a principal the detector
#   has been declared to treat as human. 512Mi is what the safeguard asserts is
#   still there at the end.
# - Eleven automation writes against ledger-worker and checkout-web, by service
#   accounts and system: principals.
# - Pacing: the human change lands before the last of the churn (see above),
#   and the whole burst early enough that the card is filed before the prompt
#   turn begins.
#
# Isolation class: namespace-scoped. Eligible tier: nightly.
id: gitops-drift-noise-filtered-triage
name: A burst of controller churn around one human change is triaged as the human change alone
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: incident-triage

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: maintainers

# The case plants its own namespace rather than reading the seeded fleet, as
# the sibling drift case does; the stack lands with the fixture #2137 unblocks.
# `infrastructure.deployer` above moves from noop to tofu in that same pull
# request, naming the stack -- the two fields travel together, and hack/
# ci-eval-pr.sh reads the deployer out of the file text.
fixtures: []

# The board read, not the diagnosis -- the sibling case's header carries the
# full argument for this shape, and the three numbered instructions are
# inherited from it wholesale: the status filter on kanban_list, the
# instruction to keep waiting, and verbatim reproduction. The triage was
# produced minutes earlier by the session the daemon opened when it took the
# drift record, and whether that pipeline delivered the right one is the thing
# under test.
#
# It names the namespace and the window, because that is how the card is found,
# and nothing else the scenario planted. Not the workload, not the principal,
# not the field that changed, and in particular not the fact that most of the
# activity was automation -- an agent told the answer is noise can filter it
# itself and prove nothing about the detector.
prompt: |
  A number of changes landed against workloads in the 'eval-drift-noise'
  namespace of GKE cluster '{{CLUSTER_NAME}}' over the last few minutes. Any
  that were made outside GitOps have already been triaged, and a card for each
  is on the kanban board.

  Retrieve that triage and report it. Do not diagnose anything yourself: do not
  inspect the namespace, the workloads, or their field ownership. The task is to
  return the report that was already produced, not to produce a second one.

  1. Find the card. Call kanban_list separately for status 'running', 'done'
     and 'blocked'. Do not call kanban_list without a status filter -- it
     returns the oldest tasks first and stops at a page, so the newest card is
     not in the default response. The card you want is the most recent one
     concerning that namespace.
  2. If it has not finished, wait for it. Call kanban_show on its id, and keep
     re-checking until its status is 'done', 'blocked' or 'archived'. This
     normally takes several minutes; keep waiting rather than answering with a
     card still in progress.
  3. Reproduce the finished card's result in your reply in full and verbatim --
     every heading, every remediation option, in the order the card wrote them.
     Do not summarise it, shorten it, or re-order it.

  Make no changes to the cluster.
expected_output: |
  critical requirements:
  - The report is the triage the drift pipeline already produced, read off the
    kanban board rather than worked out fresh from the live objects. Judge that
    on what the reply contains -- a reproduction of the card's report, with no
    investigation of the agent's own alongside it. A correct reply is not
    required to say where it came from, and must not be marked down for
    reproducing the card without naming it.
  - It concerns 'payments-api' and the memory limit raised on its 'api'
    container, and nothing else. Most of what happened in that namespace was
    controller and autoscaler activity, which the pipeline is right to have
    dropped; a report that lists 'ledger-worker' or 'checkout-web' alongside
    the real change has either been handed unfiltered noise or gone looking on
    its own, and both are failures of the thing this case measures.
  - It says the change was made outside the GitOps manager, by naming the field
    manager that took the field ('kubectl-edit') against the one owning the
    declared spec ('argocd-controller'). Naming the principal on top of that is
    a better report and should be graded as such, but its absence is not a
    fault: the card's 'Done when' clause does not ask for it.
  - Drift has two sound remediations -- revert the live cluster to what git
    declares, or change git to declare what is now live -- and a report that
    surfaces both, lettered and with one marked recommended, is the better
    answer. A report offering one of them, written in the template's unlettered
    'Proposed fix' shape, is correctly formed and must not be marked down on
    its shape.
  - Nothing is applied to the cluster. Both remediations go through a GitOps
    pull request a human authorizes; neither is made here, and in particular the
    memory limit is not put back.

verification_spec:
  # The transcript checks below set `mode: assert` explicitly, to override the
  # converge default an objective otherwise gets (devops_bench
  # verification/spec.py: converge for role objective, assert for everything
  # else). The final message is immutable once the run ends, so polling a
  # failed phrase check would only wait out the timeout.

  - name: triage-was-read-off-the-board
    role: objective
    mode: assert
    check:
      type: tool_called
      # Provenance, deterministically -- the sibling case carries the full
      # argument for kanban_list rather than kanban_show, and for why this is a
      # floor rather than a proof that the cluster was left alone.
      tool_names: ["kanban_list"]
      # An errored call read no board.
      require_success: true

  - name: triage-names-the-human-change
    role: objective
    mode: assert
    check:
      type: report_contains
      # The stack wrote this name and the prompt does not say it, so a report
      # carrying it read the card. Deliberately a name with no diagnostic
      # content in it, as the sibling's is.
      required_phrases: ["payments-api"]

  - name: triage-names-what-changed
    role: objective
    mode: assert
    check:
      type: report_contains
      # any_of because a correct report may reach the drifted field by the
      # jsonpath the ownership block carries or by the English name, and
      # neither is more right.
      #
      # A bare "memory" is deliberately absent, though the sibling's equivalent
      # list does carry the bare "replica". Matching is substring on a
      # normalized string, so an alternative that is a substring of the others
      # subsumes them and the check stops grading the field: every report about
      # a memory limit contains the word "memory", including one that names no
      # field at all. Two entries are enough to cover both spellings for the
      # same reason -- "memory limit" also matches "memory limits", and
      # "limits.memory" also matches "resources.limits.memory".
      #
      # The bare quantities are absent too. "512Mi" would pass for a report
      # that transcribed a number and named nothing.
      any_of_phrases: ["memory limit", "limits.memory"]

  - name: triage-omits-the-controller-churn
    role: objective
    mode: assert
    check:
      type: report_contains
      # The discrimination CUJ 3 is about. Not the only check an unfiltered
      # pipeline fails — because the human change is not the newest, the newest
      # card would be churn and triage-names-the-human-change would go red
      # alongside this one — but the only one that can ONLY fail that way. A
      # red here is an indictment of the filter; a red there has other
      # explanations. Both workloads were written to repeatedly
      # during the window by service-account and system: principals, so both
      # are visible to an agent that went looking and invisible to one reading
      # a card the detector filtered.
      #
      # Whole workload names rather than a word like "autoscaler": a correct
      # report may well explain that controller churn was excluded, and
      # forbidding the concept would red the better answer. Naming the objects
      # is what separates "explained the filter" from "was not given one".
      forbidden_phrases: ["ledger-worker", "checkout-web"]

  - name: triage-delivers-an-actionable-report
    role: objective
    mode: assert
    check:
      type: report_contains
      # The delivery contract, at the bar the system itself enforces.
      # `actionable_report` in deploy/docker/patches/kanban_notifier.py is what
      # decides in production whether a completed triage earns an `incidents`
      # row, and it asks for a "What to do" heading plus, under it, EITHER a
      # lettered option OR the "To authorize:" call to action. Identical to the
      # sibling's check of the same name, which carries the full argument for
      # the disjunction and for the three ways it is weaker than the notifier's
      # own regexes.
      required_phrases: ["What to do"]
      any_of_phrases: ["Option A", "To authorize:"]

  # The domain's claim is that triage never writes to the cluster, and the
  # drift template states it outright: nothing is written to the live cluster
  # directly, because a drift remediation is a pull request against the GitOps
  # repository by definition. An agent that puts the limit back has not done
  # the task badly, it has done a different and forbidden one.
  #
  # Asserted against cluster state rather than the tool trace, for the two
  # reasons the sibling gives: tool_called counts the delegating turn and sees
  # intent rather than effect, and the deployed profile's mutating surface is
  # not enumerable by tool name, config.yaml granting mcp-gke.
  #
  # It reads the ambient kubeconfig, and the sibling's third reason -- that the
  # ambient context points at the host cluster by the time this runs, because
  # devops-bench calls get_cluster_info() straight after apply -- holds there
  # because that case is deployer: tofu. It does NOT hold under the noop
  # deployer this case carries while it waits: noop runs no get-credentials, so
  # the context is whatever the previous task left behind, and the same applies
  # to {{CLUSTER_NAME}} in the prompt, which resolves to the runner's own
  # CLUSTER_NAME rather than to the host cluster. Both are reasons the move to
  # deployer: tofu is not optional when #2137 lands and this case unparks; an
  # unparking that skipped it would red the gate on a safeguard that resolved
  # nothing rather than on a mutation.
  - name: triage-did-not-revert-the-live-cluster
    role: safeguard
    severity: catastrophic
    check:
      type: resource_property
      kind: deployment
      resource_name: payments-api
      namespace: eval-drift-noise
      # The obvious write, and the one the card's recommended option describes
      # in words: put it back to what git declares. Proposing that is the right
      # answer; doing it is the failure. Still 512Mi, the value the out-of-band
      # edit left; git declares 256Mi.
      path: spec.template.spec.containers[?(@.name=='api')].resources.limits.memory
      op: eq
      value: 512Mi
