# Node OS, kubelet and auto-repair (gce-compute-fleet-audit): a DaemonSet or
# CSI driver that mounts host paths with mount propagation leaks mount entries
# across restarts until the kernel's fs.mount-max is reached, and no new pod on
# the node can mount a volume. A declared gap: expected_fail until the check
# lands (gke-labs/kube-agents#5408, which proposes `node-mount-table-leak`).
# The GCE compute collector reads serial consoles, MIG counters, sole-tenant
# groups and snapshots and no DaemonSet or node mount count; no other stream
# reads them on a schedule. Nothing is planted today: the shape (a DaemonSet
# `volume-mount-agent` in seeded-shapes with a read-only hostPath mounted
# HostToContainer) lands in the pull request that adds the check, which
# rebinds this case to its role and flips the marker in the same diff. The
# customer failure, a real leak with FailedMount events, is never reproduced:
# a synthetic event would open an incident on every install that onboards the
# fleet, and a real leak needs privilege. Two flip conditions: a check that
# reads a DaemonSet's mount propagation (in this stream, or another, which
# edits `audit:` and `finding_check` in the same diff) flips this case once
# the shape is planted; a check keyed on a kernel log line or a node condition
# reads nothing here. `fixtures: []`: the run plants nothing and reads no
# fixture, so no fixture's drift may excuse it; no safeguard reads a fixture
# because none exists yet. Domain
# `fleet-audits` as the other GCE compute cases.
# Isolation class: fleet-read-only, GitOps-repo write (the audit's ledger).
id: node-mount-table-leak-exhaustion
name: "Node mount-table leak (declared gap; planted as a propagation-mounting DaemonSet when its check lands)"
domain: fleet-audits
suite: certification
expected_fail: true
audit_streams:
  - gce-compute-fleet-audit
fixtures: []
prompt: >-
  Run the gce-compute-fleet-audit audit across the fleet, following the
  gce-compute-fleet-audit SOP.
expected_output: >-
  Planted as a DaemonSet with host mount propagation on a seeded Standard
  cluster, once its check lands. Customer failure: a real mount-table leak with
  FailedMount events. Certified means: the ledger issue carries a finding that
  names DaemonSet `volume-mount-agent` as a propagation-mounting DaemonSet on
  its node pool. The closing response is the SOP's one line with the ledger
  URL.
infrastructure:
  deployer: noop
validated: false

verification_spec:
  # One finding must carry both the check and the shape's object: a body
  # phrase alone matches every finding on the object, a slug among the ids
  # alone matches the check on any object. The three slugs are the names the
  # case accepts; the first is the one #5408 proposes.
  - name: ledger-files-the-mount-leak-shape-on-the-daemonset
    role: objective
    mode: assert
    check:
      type: ledger_issue_contains
      audit: gce-compute-fleet-audit
      scope: finding
      finding_check:
        [
          "node-mount-table-leak",
          "mount-table-exhaustion",
          "node-fs-mount-leak",
        ]
      any_of_phrases: ["volume-mount-agent"]
