# Node OS, kubelet and auto-repair (gce-compute-fleet-audit): a node agent with
# host mount propagation keeps mounts on a node. A declared gap: expected_fail
# until the check lands (gke-labs/kube-agents#5408, which proposes
# `node-mount-table-leak`).
# What live tests showed (2026-11-20, GKE Standard 1.35.8, one node): two
# faults. (A) An unprivileged pod that mounts `/var/lib/kubelet/pods` read-only
# with `HostToContainer` and holds a directory inside other pods' volumes kept
# those volumes' mounts on the node, the deleted pods in Terminating and their
# disks attached, until it let go (three rounds; 4 of 4 disks). The kubelet
# logged "target is busy" and wrote no event. An idle pod of that shape left
# nothing. (B) A privileged container with `Bidirectional` propagation that
# mounts and does not unmount left 5 of 5 mounts until the test removed them;
# by reasoning, this is the path on which `fs.mount-max` could be reached.
# Neither fault filled a table: (A) reached 240 entries against a limit of
# 100000. With the node's limit lowered in a separate step, a full table wrote
# FailedMount, "No space left on device".
# GKE documents one fault that does fill the table, on other versions than the
# test's: its known-issues page lists "Nodes that mount NFS volumes accumulate
# mount entries and stop creating containers" for 1.37.0-gke.2941000 and
# later, fixed in 1.37.1-gke.1131000
# (https://docs.cloud.google.com/kubernetes-engine/docs/troubleshooting/known-issues#nfs-mount-table-exhaustion,
# read 2026-11-23; not tested). The upgrade readiness rule
# `known-issues-matrix` names a cluster on those versions from
# `known_issues.json`; it reads versions, not mounts.
# The GCE compute collector reads serial consoles, MIG counters, sole-tenant
# groups and snapshots and no DaemonSet or node mount count; no other stream
# reads them on a schedule. Nothing is planted. A fixture for (A) is possible:
# a pod that holds, and a victim pod deleted after it. By reasoning, not
# tested: it does not survive a node's replacement, and the stuck pod can hold
# a drain. The fleet's owner has not been asked. The objective below keeps the
# form of the first plan: a finding that names `volume-mount-agent`, the first
# plan's DaemonSet, which is in no fleet file, so no check passes it today. A
# check on the pod template alone also names agents that hold nothing
# (`manifests/nodeExporter-daemonset.yaml` of kube-prometheus, read 2026-11-21,
# has the same propagation), so the objective changes with the fixture
# decision. The case stays on the lane with nothing planted, as before this
# change, until the fleet's owner answers on the fixture, a question that the
# case's owner posts after this change; a no parks it under fixture rule 9.
# `fixtures: []`: the run plants nothing and reads no fixture, so no fixture's
# drift may excuse it; no safeguard reads a fixture because none exists. Domain
# `fleet-audits` as the other GCE compute cases.
# Isolation class: fleet-read-only, GitOps-repo write (the audit's ledger).
id: node-mount-table-leak-exhaustion
name: "Node mounts held by an agent (declared gap; nothing planted; a fixture is possible; not decided)"
domain: fleet-audits
suite: validated-capabilities
suite_part: 2
expected_fail: true
audit_streams:
  - gce-compute-fleet-audit
fixtures: []
prompt: >-
  Run the gce-compute-fleet-audit audit across the fleet, following the
  gce-compute-fleet-audit SOP.
expected_output: >-
  Nothing planted. Customer failure, as live tests showed it: deleted pods that
  stay in Terminating and disks that stay attached while a node agent holds a
  directory in their volumes; neither tested fault filled a mount table.
  Validated needs a fixture and a check on that state; the present objective
  accepts a finding that names DaemonSet `volume-mount-agent`. The closing
  response is the SOP's one line with the ledger URL.
infrastructure:
  deployer: noop
validated: false

verification_spec:
  # One finding must carry both the check and the shape's object: a body
  # phrase alone matches every finding on the object, a slug among the ids
  # alone matches the check on any object. The three slugs are the names the
  # case accepts; the first is the one #5408 proposes.
  - name: ledger-files-the-mount-leak-shape-on-the-daemonset
    role: objective
    mode: assert
    check:
      type: ledger_issue_contains
      audit: gce-compute-fleet-audit
      scope: finding
      finding_check:
        [
          "node-mount-table-leak",
          "mount-table-exhaustion",
          "node-fs-mount-leak",
        ]
      any_of_phrases: ["volume-mount-agent"]
