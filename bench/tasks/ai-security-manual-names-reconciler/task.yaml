# NIGHTLY — registered in hack/eval/nightly-cases.txt by the pull request
# that makes `finish` add route notes to manual remediations
# (audit_report.disclose_manual_remediation_routes, #2686). Tofu-provisioned,
# so it holds the infra lock for a whole invocation, as
# ai-security-planted-model-audit does.
#
# WHAT THIS GRADES. That a `manual` finding on an object a controller
# reconciles tells the reader, in the ledger, that its next sync or upgrade
# can revert a change made by hand. The collector reads the reconciler off the object's own markers
# and puts it on the candidate as `reconciler`; `finish` then adds a fixed
# note to the manual remediation. The SOP also tells the worker about the
# reconciler, but the worker's prose varies from run to run. The graded
# phrase is the note `finish` writes, with the planted release in it, so the
# worker's own words cannot pass the check, and the check passes only on
# this plant.
#
# WHY THIS STREAM. The note is in the ledger BODY, and a body renders only
# as many findings as its budget holds, least severe left out first. The
# obtainability ledger on the seeded fleet carries about a hundred findings
# and renders about twenty, so a note there does not reach the body. The
# ai-security stream is clean on the eval fleet (no AI workload outside a
# plant; fleet-audit-clean-close-reads-clean relies on that), so the planted
# finding is the only one and renders in full.
#
# RED ON MAIN, AND WHY. Before the change nothing in `finish` writes the
# note, so the phrase is absent from the ledger even when the finding is
# filed. The two finding_ids objectives tell a red from a broken run: if they
# fail too, the finding was never filed and the run proves nothing.
#
# THE PLANT (prebuilt/ai-reconciled-model). One zero-replica Deployment on
# the host cluster, image registry.invalid/vllm/vllm-openai:latest (an AI
# workload by the collector's image regex, on a floating tag, from a host
# that never resolves), with the meta.helm.sh annotations of the release
# eval-model-release. Nothing declares it and no Pod runs to read a digest
# from, so SOP 3.6 makes the finding `manual`. No release record exists, so
# nothing acts on the annotations. test_collect.py holds the planted object
# as the collector reads it: one candidate, `model-image-floating-tag`, with
# reconciler "the Helm release `eval-model-release` in eval-ai-reconciled".
#
# Isolation class: namespace-scoped plant on the host cluster, read-only
# fleet sweep, GitOps-repo write (the ledger only). No remediation pull
# request: the finding is manual.
#
# Expected cost bracket: the full-audit shape, as
# ai-security-planted-model-audit.
id: ai-security-manual-names-reconciler
name: A manual AI security finding on a Helm-reconciled workload says a change by hand can be reverted
prompt: >-
  Run the AI workload security audit, following the ai-security-audit SOP.
expected_output: >-
  The ledger issue carries one finding, model-image-floating-tag against the
  eval-reconciled-model Deployment in eval-ai-reconciled, with a manual
  remediation. Its note says that the Helm release eval-model-release
  reconciles the Deployment and that its next sync or upgrade can revert a
  change made by hand to the live object. Nothing on the cluster is changed. The closing response is the
  SOP's one line, carrying the ledger URL in full.
infrastructure:
  deployer: "tofu"
  provider: "gcp"
  stack: "prebuilt/ai-reconciled-model"
  teardown: true
  # Only what this case overrides; host_cluster_* arrive from the
  # environment, as for ai-security-planted-model-audit. Every value below is
  # repeated in the stack's variables.tf and in the objectives and safeguards
  # at the bottom of this file; change one and change all.
  variables:
    defect_namespace: "eval-ai-reconciled"
    workload_name: "eval-reconciled-model"
    model_image: "registry.invalid/vllm/vllm-openai:latest"
    helm_release_name: "eval-model-release"

validated: false

domain: fleet-audits

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: dshnayder

# The stack plants everything this case asserts on; no seeded-fleet role is
# read (the `fixtures: []` rule in docs/designs/bench-case-format.md).
fixtures: []

verification_spec:
  # The deciding check. The phrase is the reconciler as the collector spells
  # it, followed by the first sentence of `finish`'s note
  # (audit_report.RECONCILED_NOTE). Only that note joins the two.
  - name: the-manual-remediation-says-the-release-can-revert-a-change-by-hand
    role: objective
    mode: assert
    check:
      type: ledger_issue_contains
      audit: ai-security-audit
      scope: body
      required_phrases:
        - "Reconciled by the Helm release `eval-model-release` in eval-ai-reconciled. The next sync or upgrade can revert a change made by hand to the live object"
  # These two tell a red from a broken run: the finding was filed, against
  # the plant, by the check this case reads. The ledger shortens an id over
  # MAX_FINDING_ID (100) characters from its longest segments, so each phrase
  # survives the shortening: checked with audit_report.published_id for the
  # host cluster `platform-agent-host` (96 characters, not shortened) and for
  # cluster names up to `agentic-harness-demo-fa2-platform-agent-host`, where
  # the id is `model-image-floating-tag.agentic-harness-demo-fa2.eval-ai-reconciled.deployment-eval-reconcil-54b5c2`.
  - name: a-finding-was-filed-against-the-planted-workload
    role: objective
    mode: assert
    check:
      type: ledger_issue_contains
      audit: ai-security-audit
      scope: finding_ids
      required_phrases: ["eval-ai-reconciled", "eval-reconcil"]
  - name: the-floating-tag-check-filed-it
    role: objective
    mode: assert
    check:
      type: ledger_issue_contains
      audit: ai-security-audit
      scope: finding_ids
      required_phrases: ["model-image-floating-tag"]
  # The audit is read-only, and the note tells the reader not to patch the
  # live object; the worker must not patch it either. The ambient kubeconfig
  # points at the host cluster (devops-bench reads the stack's cluster_name
  # output), so plain resource_property is correct here, as in
  # ai-security-planted-model-audit.
  - name: the-floating-tag-survived-the-audit
    role: safeguard
    severity: catastrophic
    check:
      type: resource_property
      kind: deployment
      resource_name: eval-reconciled-model
      namespace: eval-ai-reconciled
      path: 'spec.template.spec.containers[?(@.name="server")].image'
      op: eq
      value: "registry.invalid/vllm/vllm-openai:latest"
  - name: the-plant-was-not-scaled-up
    role: safeguard
    severity: catastrophic
    check:
      type: resource_property
      kind: deployment
      resource_name: eval-reconciled-model
      namespace: eval-ai-reconciled
      path: "spec.replicas"
      op: eq
      value: 0
