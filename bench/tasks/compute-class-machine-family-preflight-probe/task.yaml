# Skill-guidance and pre-flight validator probe for gke-compute-classes (#5733):
# before proposing a machine-family migration (such as migrating a legacy N1
# node pool to N4), the worker runs /opt/data/scripts/machine_family_preflight.py
# against the source pool configuration and target family (`n4`) and surfaces
# incompatible Shielded VM / Secure Boot / vTPM settings, Persistent Disk
# (`pd-standard`) versus Hyperdisk (`hyperdisk-balanced`), and Local SSD
# (`localSsdCount: 2`, unsupported on N4) blockers before generating any
# ComputeClass or NodePool YAML.
#
# On main, `machine_family_preflight.py` is neither staged in the sandbox image
# nor referenced in `gke-compute-classes/SKILL.md`, so the `worker_commands`
# objective (`the-machine-family-preflight-validator-ran`) fails red by
# construction.
#
# Planted defect required: none. deployer: noop, no fixture, no cluster read.
# Isolation class: read-only (no cluster touched at all).
# Tier: nightly (hack/eval/nightly-cases.txt).
id: compute-class-machine-family-preflight-probe
name: A machine-family migration proposal runs the pre-flight validator and rejects N1-to-N4 security, disk, and Local SSD incompatibilities before YAML generation

owner: fkc1e100
domain: capacity

prompt: >-
  We want to migrate our existing Standard GKE node pool `legacy-n1-pool` on
  cluster `prod-cluster` (control-plane and node version `1.35.3-gke.1290000`)
  from `n1-standard-8` to the `n4` machine family using a ComputeClass. Here is
  the source pool's `gcloud container node-pools describe` JSON:
  `{"name":"legacy-n1-pool","version":"1.35.3-gke.1290000","config":{"machineType":"n1-standard-8","diskType":"pd-standard","imageType":"COS_CONTAINERD","localSsdCount":2,"shieldedInstanceConfig":{"enableSecureBoot":false,"enableVtpm":false,"enableIntegrityMonitoring":true}}}`.
  Load the installed `gke-compute-classes` skill and run its pre-flight
  machine-family migration validator script against this source node pool JSON
  for target family `n4` before generating any YAML. If you delegate this task
  to another agent, pass the JSON and instructions verbatim. Report the
  validator's verdict (`VERDICT: INCOMPATIBLE` or `VERDICT: COMPATIBLE`), every
  security, disk, and Local SSD blocker rule ID and remediation, and what must
  change before migrating to `n4`. Do not apply anything.
expected_output: >-
  The Platform Agent loads `gke-compute-classes`, runs
  `/opt/data/scripts/machine_family_preflight.py` against `legacy-n1-pool`'s
  JSON with `--target-family n4`, and reports `VERDICT: INCOMPATIBLE` with four
  blockers before proposing any YAML:
  (1) `shielded-vtpm-disabled` (`shieldedInstanceConfig.enableVtpm=false` is
  rejected on `n4` and violates the security floor; enable vTPM),
  (2) `shielded-secure-boot-disabled` (`shieldedInstanceConfig.enableSecureBoot=false`
  violates the baseline node security floor; verify no unsigned kernel modules
  and enable Secure Boot),
  (3) `disk-type-pd-on-hyperdisk-only` (`pd-standard` is rejected on
  Hyperdisk-only `n4`; switch the boot disk to `hyperdisk-balanced` and use
  `dynamic-rwo` for cross-generation stateful PVs), and
  (4) `local-ssd-unsupported-on-n4` (`localSsdCount=2` is rejected because `n4`
  does not support Local SSD attachments; remove Local SSDs or use `c3`/`c4`
  `-lssd` shapes or `n2`/`n2d`).
infrastructure:
  deployer: noop
validated: false

verification_spec:
  - name: the-machine-family-preflight-validator-ran
    role: objective
    mode: assert
    check:
      type: worker_commands
      after_result_pattern: '[\s\S]'
      required_runs:
        - script: machine_family_preflight.py
      forbidden_result_patterns:
        - 'machine_family_preflight\.py[''"]?: (?:[Nn]o such file or directory|(?:command )?not found|[Pp]ermission denied)'
        - "can't open file '[^']*machine_family_preflight\\.py'"
  - name: the-report-flags-n1-to-n4-security-disk-and-local-ssd-blockers
    role: objective
    mode: assert
    check:
      type: all
      checks:
        - type: report_contains
          any_of_phrases:
            - "VERDICT: INCOMPATIBLE"
            - "shielded-vtpm-disabled"
            - "shielded-secure-boot-disabled"
          forbidden_phrases:
            - "VERDICT: COMPATIBLE"
        - type: report_contains
          any_of_phrases:
            - "enableVtpm"
            - "vTPM"
            - "shielded-vtpm-disabled"
        - type: report_contains
          any_of_phrases:
            - "enableSecureBoot"
            - "Secure Boot"
            - "shielded-secure-boot-disabled"
        - type: report_contains
          any_of_phrases:
            - "disk-type-pd-on-hyperdisk-only"
            - "hyperdisk-balanced"
            - "Hyperdisk"
        - type: report_contains
          any_of_phrases:
            - "local-ssd-unsupported-on-n4"
            - "localSsdCount"
            - "Local SSD"
  - name: front-door-stays-out-of-the-worker-verbs
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        - type: tool_called
          tool_names: ["kanban_complete", "kanban_block", "kanban_heartbeat"]
  - name: no-worker-spends-an-answer-query-call
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        - type: tool_called
          scope: workers
          tool_names:
            [
              "mcp__developer_knowledge__answer_query",
              "mcp_developer_knowledge_answer_query",
            ]
