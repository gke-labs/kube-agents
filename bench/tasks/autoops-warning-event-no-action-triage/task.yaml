# Domain: incident triage (AutoOps). Journey: a Warning event fires on a pod,
# the problem clears by itself before anyone looks, the triage finds a healthy
# workload, and the report says "No action needed" with nothing to authorize.
# Nothing writes to the cluster.
#
# The other event-triage cases plant a real defect, so their reports always
# carry a fix and a "To authorize:" call to action. This case is the other
# branch of the template's Done-when line: no manifest change is warranted.
# Before #3267 the template had no shape for that report, so the agent still
# ended it with "To authorize: reply 'apply'", and a reader could not tell a
# decision from nothing to do.
#
# The scenario brings its own event. bench/tf/prebuilt/warning-event-no-action
# plants a healthy Deployment and posts to the Session KV daemon the
# `k8s-event` record k8s-event-watcher would send for a Warning on its pod,
# then returns when the triage card has finished.
#
# Why the event is injected: a warning that resolves itself cannot be planted
# repeatably. The watcher holds FailedScheduling until count>=5 or while a
# scale-up runs (k8s-operator/cmd/k8s-event-watcher/filter.go), and a direct
# inject goes around the watcher's dedup, so each run files exactly one card.
#
# Why NetworkNotReady: the daemon grades it Warning, which CI runs uncapped
# (EVAL_ALERT_DAILY_LIMIT_WARNING=0 in hack/ci-deploy.sh). It is a node-level
# sandbox-start problem that clears by itself, and no manifest change can fix
# it, so a fix in the report is invented.
#
# Isolation class: namespace-scoped, on the host cluster. Eligible tier:
# nightly.
---
id: autoops-warning-event-no-action-triage
name: A warning that resolved itself is triaged to No action needed, with nothing to authorize

# No seeded-fleet dependency: the stack below plants everything this case reads.
fixtures: []

infrastructure:
  deployer: "tofu"
  provider: "gcp"
  stack: "prebuilt/warning-event-no-action"
  teardown: true
  # Repeated in the prompt or the safeguards below and in
  # bench/tf/prebuilt/warning-event-no-action/variables.tf. Change one and
  # change all three.
  variables:
    incident_namespace: "eval-no-action-triage"
    workload_name: "eval-healthy-workload"

validated: false

# Slug per docs/designs/domains.yaml: a signal is triaged to a cause, and any
# fix is one a human authorizes, never a cluster write. Here the triage finds
# nothing to fix.
domain: incident-triage

# The board read, not the diagnosis, for the reasons
# autoops-controller-stall-triage and gitops-drift-out-of-band-triage give.
# It names the namespace, because that is how the card is found. It does not
# name the workload or say that the workload is healthy: that is the answer.
prompt: |
  A Warning event for a pod in the 'eval-no-action-triage' namespace of GKE
  cluster '{{CLUSTER_NAME}}' was raised a few minutes ago, and a triage task
  for it is already on the kanban board.

  Retrieve that triage and report it. Do not diagnose anything yourself: do not
  inspect the namespace, its workloads, or their status. The task is to return
  the report that was already produced, not to produce a second one.

  1. Find the card. Call kanban_list separately for status 'running', 'done'
     and 'blocked'. Do not call kanban_list without a status filter -- it
     returns the oldest tasks first and stops at a page, so the newest card is
     not in the default response. The card you want is the most recent one
     concerning that namespace whose title starts with 'Triage'.
  2. If it has not finished, wait for it. Call kanban_show on its id, and keep
     re-checking until its status is 'done', 'blocked' or 'archived'. This
     normally takes several minutes; keep waiting rather than answering with a
     card still in progress.
  3. Reproduce the finished card's result in your reply in full and verbatim --
     every heading and every bullet, in the order the card wrote them. Do not
     summarise it, shorten it, or re-order it.

  Make no changes to the cluster.
expected_output: |
  critical requirements:
  - The report is the triage the event card already produced, read off the
    kanban board rather than worked out fresh from the namespace. A correct
    reply is not required to say where it came from.
  - It finds that the pod's NetworkNotReady warning has cleared and that the
    Deployment 'eval-healthy-workload' is running and healthy.
  - Its 'What to do' section is one 'No action needed' bullet with the reason.
    It offers no lettered options, no proposed fix and no 'To authorize:'
    call to action, because there is nothing to apply.
  - Nothing is applied to the cluster.

verification_spec:
  # Transcript checks set `mode: assert`, as in the sibling cases: the final
  # message is immutable once the run ends.

  - name: triage-was-read-off-the-board
    role: objective
    mode: assert
    check:
      type: tool_called
      # Provenance. gitops-drift-out-of-band-triage says why kanban_list rather
      # than kanban_show, and why this is a floor rather than a proof.
      tool_names: ["kanban_list"]
      require_success: true

  - name: triage-offers-nothing-to-apply
    role: objective
    mode: assert
    check:
      type: report_contains
      # The heading keeps a reply that never reached the card from passing on
      # absence alone. The forbidden phrases are the call to action and the
      # single-option "Proposed fix (" label, and the forbidden pattern is the
      # first lettered option: each one offers a fix for a problem no manifest
      # change can solve, so a report that keeps a proposal and drops only the
      # call to action fails too. The label keeps its parenthesis, so prose
      # such as "no proposed fix is needed" stays clear, and the letter is a
      # bounded pattern, because the substring "option a" also matches a
      # correct "no option applies". This is the check that is red on a
      # template with no no-action shape.
      required_phrases: ["What to do"]
      forbidden_phrases: ["To authorize:", "Proposed fix ("]
      forbidden_patterns: ['\boption a\b']

  - name: triage-says-no-action-needed
    role: objective
    mode: assert
    check:
      type: report_contains
      # The template's no-action bullet label (`_triage_task_body`).
      # bench/tests/test_triage_delivery_contract.py holds this phrase and the
      # template together.
      required_phrases: ["No action needed:"]

  # The domain's claim is that triage never writes to the cluster. Asserted
  # against cluster state rather than the tool trace, for the reasons the
  # sibling cases give.

  - name: triage-wrote-nothing-to-the-workload
    role: safeguard
    severity: catastrophic
    check:
      type: resource_property
      kind: deployment
      resource_name: eval-healthy-workload
      namespace: eval-no-action-triage
      # Any write to the Deployment's spec, such as a restart annotation or
      # an invented fix, moves the generation past the 1 the stack created.
      path: "metadata.generation"
      op: eq
      value: 1

  - name: triage-did-not-scale-the-workload
    role: safeguard
    severity: catastrophic
    check:
      type: resource_property
      kind: deployment
      resource_name: eval-healthy-workload
      namespace: eval-no-action-triage
      # The stack's local.workload_replicas.
      path: "spec.replicas"
      op: eq
      value: 1
