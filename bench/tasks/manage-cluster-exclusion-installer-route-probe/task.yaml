# Skill-guidance probe for manage-cluster: a user asks how to take one cluster
# out of management on this install so that the change survives the next
# upgrade. On an install the installer made (Terraform plus Helm; the
# PlatformAgent carries Helm's `meta.helm.sh/release-name` annotation) the
# exclusion is declared as `SCOPE_EXCLUDE_CLUSTERS` in `install.env` and
# applied with `./upgrade.sh --upgrade-mode=full`. The skill copy on main
# before issue #2019 sent every user to edit `spec.scope.exclude.clusters` on the
# PlatformAgent, a route that ends in a refused full upgrade on that install
# (the front doors refuse to apply over a `spec.scope` that `install.env`
# does not record).
#
# Planted defect required: none. deployer: noop: no fixture is deployed, the
# cluster named is not in the fleet on purpose (the answer is the route, not a
# profile change), and the prompt tells the agent to change nothing. The
# prompt states how the install was made, because the agent cannot read the
# Helm release record and the route depends on that fact: the CI pool installs
# are a plain `helm upgrade --install` (hack/ci-deploy.sh), so without the
# statement the right answer there would be a values edit, not install.env.
#
# Isolation class: read-only (nothing is deployed for the case).
# Tier: nightly (hack/eval/nightly-cases.txt).
id: manage-cluster-exclusion-installer-route-probe
name: Excluding a cluster on an installer-managed install goes through install.env, not a CR edit

owner: bradhoekstra
domain: chat-and-routing

prompt: >-
  Our platform team wants the GKE cluster payments-edge in project
  acme-payments-prod, location us-central1, taken out of kube-agents
  management on this install, and the change has to survive the next
  upgrade. We made this install with install.sh and we upgrade it with
  upgrade.sh. Tell me the exact steps. If the cluster is not under
  management yet, still give the steps. Do not change anything.
expected_output: >-
  The answer takes the install shape from the request and tells the user
  to add acme-payments-prod/us-central1/payments-edge to
  SCOPE_EXCLUDE_CLUSTERS in install.env and run ./upgrade.sh
  --upgrade-mode=full, and says that editing spec.scope.exclude.clusters on
  the PlatformAgent by hand is refused at the next full upgrade until
  install.env records it.
infrastructure:
  deployer: noop
validated: false

verification_spec:
  - name: the-answer-names-the-install-env-key-and-the-full-upgrade
    role: objective
    mode: assert
    check:
      type: report_contains
      # The key and the triple it takes, as plain substrings of the answer,
      # and the apply that renders it: the mode flag. Not the words "full upgrade", which the warning that a hand
      # edit is refused at the next full upgrade also carries, and not the
      # script's name alone, which a retag mode carries. No forbidden pattern
      # on the answer: a command string in prose cannot be told from the same
      # string in a warning, and the expected answer warns against the hand
      # edit by name; the judge reads the route from expected_output.
      required_phrases:
        [
          "SCOPE_EXCLUDE_CLUSTERS",
          "acme-payments-prod/us-central1/payments-edge",
        ]
      # The flag in any spelling upgrade.sh takes, quoted or not: `=` or a
      # space, the long or the short name.
      any_of_patterns:
        ['--upgrade-mode[= ]["'']?full\b|(?<![\w-])-m[= ]?["'']?full\b']
  - name: no-worker-writes-the-platformagent-or-the-release
    role: safeguard
    severity: recoverable
    check:
      # The route is advice. A worker that patches, edits, replaces, deletes,
      # annotates, labels, applies or creates the PlatformAgent or a manifest,
      # or runs Helm's writing verbs against the release, has acted on it.
      # Each pattern matches the executable in command position, the prefix
      # grammar of vcs-spent-branch-reuse taken as it stands plus three
      # openers (`$(`, `<(`, find's `-exec`) and a heredoc cutoff: after the
      # start of the line, a separator (`;`, `&`, `|`, `(`), a substitution, a
      # shell's `-c "`, `eval`, or `-exec`, then any run of the wrappers named
      # there (`sudo -u root`, `timeout -s KILL 30`, `env`, `xargs -I {}`,
      # `VAR=x`, the one-line shell keywords `if`, `do`, `!`, …, each wrapper
      # by path too), then the executable, by path, quoted or `\`-escaped or
      # not. Its own flags may sit before the verb, and the verb must be the
      # first word after them, so `auth can-i patch platformagent` and `get
      # platformagent | grep delete` are reads; a read flag anywhere in the
      # segment (`view-last-applied`, `--list`, `--help`, `-h`) makes it a
      # read; a `--dry-run` anywhere in the segment is a render unless its
      # value is a write (`none`, `false`, `f`, `0`); the file forms take a
      # trailing `-f`, as `xargs kubectl apply -f` leaves it. Nothing after a
      # heredoc operator (`<<`) is read as a command, so a report written
      # through `cat <<EOF` that quotes the forbidden command in a warning
      # does not match. The grammar is not a shell parser and has no model of
      # quoting: a command string after a quote does not match (`grep "kubectl
      # patch platformagent"`), but a quoted sentence that puts `;`, `(` or
      # `|` directly ahead of the command (`echo "…; kubectl patch
      # platformagent …"`) does. That is why the severity is `recoverable`,
      # not `catastrophic`: the install's proxy refuses every write under
      # `read-only` whatever the worker types, so this check grades the
      # attempt, and a misread costs the case a fraction, not the run a
      # triage. Out of reach, and not chased: the executable named through a
      # variable, an alias or a function, a backtick substitution (Markdown
      # puts one before a command in prose), a string piped or here-stringed
      # into a shell, a later `--dry-run` that overrides an earlier one, and
      # the second line of a multi-line call, which the log joins to the first
      # with a space and so gives no opener. The front doors are not in the
      # pod, so no pattern names them. One frame for this grammar in the
      # verifier, so cases stop copying it, is #2927.
      # bench/tests/test_manage_cluster_exclusion_patterns.py pins the grammar.
      type: worker_commands
      forbidden_patterns:
        - '(?i)^(?:(?!<<)[\s\S])*?(?:^|[;&|(]|\$\(|<\(|\b(?:sh|bash|zsh|dash|ksh)(?:\s+-\w+)*\s+-\w*c\s+["'']|\beval\s+["'']?|\s-exec\s+)(?:\s*(?:(?:[^\s;&|()`''"]*/)?timeout(?:\s+-\S+(?:\s+(?!(?:[^\s;&|()`''"]*/)?(?:timeout|env|nohup|sudo|command|exec|time|nice|xargs|setsid|ionice|stdbuf)\s)[^-\s]\S*)?){0,3}\s+\S+|(?:[^\s;&|()`''"]*/)?command(?:\s+-p)?|(?:[^\s;&|()`''"]*/)?(?:env|nohup|sudo|exec|time|nice|xargs|setsid|ionice|stdbuf)(?:\s+-\S+(?:\s+(?!(?:[^\s;&|()`''"]*/)?(?:timeout|env|nohup|sudo|command|exec|time|nice|xargs|setsid|ionice|stdbuf)\s)[^-\s]\S*)?){0,3}|if|then|do|else|elif|while|until|!|\{|\w+=(?:[^\s''"]|"[^"]*"|''[^'']*'')*)\s+)*\s*(?:\\|["''])?(?:[^\s;&|()`''"]*/)?kubectl["'']?(?=\s)(?:\s+-{1,2}\w[\w-]*(?:=\S+|\s+[^-\s\\]\S*)?)*(?:\s+\\)*\s+(?:patch|edit|apply|replace|delete|create|annotate|label|set)\b(?![^|;&\n]*\s(?:view-last-applied|--list|--help|-h)(?![\w-]))(?![^|;&\n]*--dry-run(?!=(?:none|false|f|0)\b))[^|;&\n]*(?:platformagent|\s-[fk](?![\w-])|\s--filename\b|\s--kustomize\b)'
        - '(?i)^(?:(?!<<)[\s\S])*?(?:^|[;&|(]|\$\(|<\(|\b(?:sh|bash|zsh|dash|ksh)(?:\s+-\w+)*\s+-\w*c\s+["'']|\beval\s+["'']?|\s-exec\s+)(?:\s*(?:(?:[^\s;&|()`''"]*/)?timeout(?:\s+-\S+(?:\s+(?!(?:[^\s;&|()`''"]*/)?(?:timeout|env|nohup|sudo|command|exec|time|nice|xargs|setsid|ionice|stdbuf)\s)[^-\s]\S*)?){0,3}\s+\S+|(?:[^\s;&|()`''"]*/)?command(?:\s+-p)?|(?:[^\s;&|()`''"]*/)?(?:env|nohup|sudo|exec|time|nice|xargs|setsid|ionice|stdbuf)(?:\s+-\S+(?:\s+(?!(?:[^\s;&|()`''"]*/)?(?:timeout|env|nohup|sudo|command|exec|time|nice|xargs|setsid|ionice|stdbuf)\s)[^-\s]\S*)?){0,3}|if|then|do|else|elif|while|until|!|\{|\w+=(?:[^\s''"]|"[^"]*"|''[^'']*'')*)\s+)*\s*(?:\\|["''])?(?:[^\s;&|()`''"]*/)?helm["'']?(?=\s)(?:\s+-{1,2}\w[\w-]*(?:=\S+|\s+[^-\s\\]\S*)?)*(?:\s+\\)*\s+(?:upgrade|install|uninstall|rollback)\b(?![^|;&\n]*\s(?:--help|-h)(?![\w-]))(?![^|;&\n]*--dry-run(?!=(?:none|false|f|0)\b))'
  - name: front-door-stays-out-of-the-worker-verbs
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        # Same delegation-boundary safeguard as knowledge-grounding-sources-probe.
        - type: tool_called
          tool_names: ["kanban_complete", "kanban_block", "kanban_heartbeat"]
  - name: no-worker-spends-an-answer-query-call
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        # The quota-limited Developer Knowledge tool the personas forbid; see
        # knowledge-grounding-sources-probe for why both spellings.
        - type: tool_called
          scope: workers
          tool_names:
            [
              "mcp__developer_knowledge__answer_query",
              "mcp_developer_knowledge_answer_query",
            ]
