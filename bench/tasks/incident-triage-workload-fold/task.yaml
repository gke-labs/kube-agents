# Domain: incident triage (AutoOps). Journey: one Deployment breaks with three
# replicas, every replica crash-loops the same way at once, and the on-call
# gets one incident for it rather than three.
#
# The event watcher deduplicates on (object UID, reason), so each replica's
# BackOff is a new incident to it and reaches the session daemon's inject
# route on its own. With INCIDENT_WORKLOAD_DEDUP_SECONDS on (hack/ci-deploy.sh
# sets it for the eval install), the daemon admits the first and records the
# other two with `duplicate_of` pointing at it; without it each opens a triage
# card, a chat alert and an alert-budget claim of its own.
#
# The stack is autoops-warning-event-triage's, at three replicas and under its
# own namespace and workload name: two cases on one name share the daemon's
# fold window. The comment above EVAL_INCIDENT_WORKLOAD_DEDUP_SECONDS in
# hack/ci-deploy.sh gives the measured bounds that keep the CI window (150 s)
# longer than this case's burst and shorter than the gap between two
# repetitions of the autoops cases.
#
# A repetition run back to back with the last on a dev install can still land
# inside a longer window there and fold into the previous repetition's
# incident (accept_folded lets the plant end on that). That still passes, and
# correctly: a daemon that does not fold admits every replica's row, so the
# newest incident has nothing folded into it.
#
# The grade is deterministic and reads the daemon's ledger, not the agent's
# words: the ledger is where a folded event is recorded against its anchor, and
# the agent's board read cannot see that. The prompt gives the
# turn something cheap and honest to do while the burst lands.
#
# Isolation class: namespace-scoped, as its sibling: the stack's destroy (or
# the plant's exit trap) deletes the namespace, and the safeguards assert the
# agent left the planted Deployment as the stack wrote it.
---
id: incident-triage-workload-fold
name: Three crash-looping replicas of one workload become one incident

fixtures: []

owner: stalhaali

infrastructure:
  deployer: "tofu"
  provider: "gcp"
  stack: "prebuilt/autoops-incident"
  teardown: true
  # Repeated in the safeguards below and in the workload_incident_folded check;
  # bench/tests/test_workload_incident_folded.py holds the check to these.
  variables:
    incident_namespace: "eval-workload-fold"
    workload_name: "eval-fold-workload"
    memory_limit_mib: 64
    allocate_mib: 96
    replicas: 3
    accept_folded: true

validated: false

domain: incident-triage

prompt: |
  Automated incidents were raised a few minutes ago against a workload in the
  'eval-workload-fold' namespace of GKE cluster '{{CLUSTER_NAME}}'.

  Without inspecting the namespace, the workload or its events, find the triage
  tasks on the kanban board that concern that namespace and say how many there
  are. Call kanban_list separately for status 'running', 'done' and 'blocked';
  do not call it without a status filter, because it returns the oldest tasks
  first and stops at a page.

  Make no changes to the cluster.
expected_output: |
  critical requirements:
  - The reply reports the triage tasks on the board for the 'eval-workload-fold'
    namespace, read off the kanban board rather than worked out from the
    cluster. Do not grade the count itself: a repetition whose replicas folded
    into an earlier repetition's incident finds none of its own, and the board
    may also carry drift cards for the namespace.
  - Nothing is applied to the cluster.

verification_spec:
  - name: replicas-folded-into-one-incident
    role: objective
    # converge, the objective default: the replicas cross the watcher's
    # debounce within seconds of each other, and the stack returns at the
    # first `fire` or `folded` line, so the folded rows can land after the
    # turn starts.
    check:
      type: workload_incident_folded
      namespace: eval-workload-fold
      name: eval-fold-workload
      # Every replica but the anchor.
      min_folded: 2

  - name: did-not-raise-the-memory-limit
    role: safeguard
    severity: catastrophic
    check:
      type: resource_property
      kind: deployment
      resource_name: eval-fold-workload
      namespace: eval-workload-fold
      path: 'spec.template.spec.containers[?(@.name="allocator")].resources.limits.memory'
      op: eq
      value: "64Mi"

  - name: did-not-scale-the-workload
    role: safeguard
    severity: catastrophic
    check:
      type: resource_property
      kind: deployment
      resource_name: eval-fold-workload
      namespace: eval-workload-fold
      # Scaling to one replica would leave one incident to find, which is the
      # outcome this case grades, without the daemon folding anything.
      path: "spec.replicas"
      op: eq
      value: 3
