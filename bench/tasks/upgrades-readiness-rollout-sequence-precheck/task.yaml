# The rollout-sequence precheck: before a rollout plan names a new fleet
# RolloutSequence, the agent reads the RolloutSequences the fleet host project
# already holds. The platform allows one RolloutSequence per host project, so a
# plan that creates a second is refused (FAILED_PRECONDITION); the precheck reads
# the list first and says whether the plan is clear or blocked, and a blocked plan
# adds the train as stages of the existing sequence or moves to another host
# project. The rule is the readiness rule rollout-sequence-precheck in
# fleet-upgrade-verification, and the step is the rollout orchestration SOP's
# precheck, before the plan.
#
# What is deterministic here is the route and the shape of the answer. The route
# is the read itself: a worker ran `gcloud container fleet rolloutsequences list`
# on the host project (the command as gcloud spells it, GA and beta alike; the
# pattern reads the command path, so a release track before it or a `--project`
# or `--format` around it is the same command). The answer ends in one declared
# line:
#
#   rollout-sequence precheck: host <project>; existing <n>; plan <clear|blocked>
#
# read as a whole-line pattern after the harness's fold (`fold_decoration`, which
# lowercases the reply): the host is the project id, existing an integer, plan one
# word from a closed set. The accept takes the line with every value in its set,
# and three forbids read the same anchor with any other value in a field, so a
# hedge or a qualifier on the verdict (`clear (once IAM lands)`), a count that is
# not a number, or a host that is not a project id fails the line. The fixture is
# a standing RolloutSequence, `seeded-train`, in the eval project (three stages:
# the canary and rest selectors on `upgrade_stage`, then a catch-all), so the
# answer the read gives is `existing 1; plan blocked`, and the line is pinned to
# it: `existing 0` or `plan clear` fails. Without a fixture the line could be
# written from nothing, which is what the 2026-10-23 run on `main` did: the proxy
# refused the read and the agent still answered `existing 0; plan clear`. The
# prose, the stage detail and the advice are the judge's.
#
# Red on main: the command policy admits no `container fleet` command, so the read
# is refused, and no SOP sends the agent to the precheck; the reply either states
# no precheck line or writes one from nothing (`existing 0; plan clear`), and the
# line objective fails either way. Green with the rule, the policy entry and the
# SOP on a branch build against the fixture. Independent of the retrospective job
# (#3196).
#
# Not registered in a roster file: the pool projects have neither
# gkehub.googleapis.com enabled nor roles/gkehub.viewer bound for the agent, nor
# a fleet and the standing sequence, so the read fails there for a reason that is
# not the case's; it waits in FIXTURE_NOT_READY (#3798) in
# scripts/validate_bench_cases.py until the pool reconcile lands them, and a later
# pull request moves it to the nightly file citing the reconcile report
# (docs/designs/bench-case-format.md, "Registration").
#
# Fixtures: the standing sequence above, a project-level object the fleet stack
# does not plant yet (#3798); the case reads it and plants nothing.
# `fixtures: []` is the declaration for a case with no cluster fixture.
#
# Isolation class: read-only (one project-level list; no cluster read, no cluster
# or sequence write). The safeguard fails the case on a RolloutSequence or rollout
# write, or any cluster mutation, from the worker's terminal.
id: upgrades-readiness-rollout-sequence-precheck
name: The rollout-sequence precheck reads the host project's RolloutSequences before a plan names a second one
prompt: >-
  We are planning the next patch rollout across the GKE clusters in this
  project with a fleet RolloutSequence named seeded-patch-train, with
  {{PROJECT_ID}} as the fleet host project. Before anyone writes the plan, run
  the rollout-sequence precheck: does the host project already hold a
  RolloutSequence, and may the plan create seeded-patch-train? Read only; do
  not create, change or remove anything. End your answer with one line in
  exactly this form and no other words on the line: "rollout-sequence
  precheck: host <project>; existing <n>; plan <clear|blocked>", where host is
  the host project's id as the API shows it, existing is the number of
  RolloutSequences the host project holds today, and plan is clear when the
  plan may create the sequence and blocked when it may not.
expected_output: >-
  The answer comes from a read of the host project's RolloutSequences (gcloud
  container fleet rolloutsequences list on the host project), names the
  sequences it found with their stages, soak and selector, and states the
  precheck's verdict: the host project already holds the RolloutSequence
  seeded-train, and the platform refuses a second one (FAILED_PRECONDITION), so
  the plan that names seeded-patch-train is blocked and the train goes in as
  stages of seeded-train or in another host project. The line reads existing 1
  and plan blocked. It creates, changes and removes nothing, and it does not
  answer with a readiness or version table in place of the precheck.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: upgrades

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: haoxuw

# Reads the eval project's fleet host state, not a seeded cluster; plants nothing.
fixtures: []

verification_spec:
  # The route: a worker listed the host project's RolloutSequences. The pattern
  # reads the command path gcloud spells, so `gcloud beta container fleet
  # rolloutsequences list --project <host> --format json` and the GA form are one
  # command; a quoted mention of it in a grep or an echo is also a match, which the
  # declared line below does not survive on its own.
  - name: the-host-projects-sequences-were-listed
    role: objective
    # assert, not converge: the transcript is immutable once the run ends.
    mode: assert
    check:
      type: worker_commands
      required_patterns:
        - "container fleet rolloutsequences list"

  # The declared line. The accept is the whole line with every value in its set;
  # each forbid is the same anchor, any text, then one field with any other value,
  # so the accept and its forbids are exact complements on any line carrying the
  # anchor. The verdict field ends the line: a qualifier after `clear` or `blocked`
  # is a hedge and fails.
  - name: the-precheck-line-has-the-declared-form
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      any_of_patterns:
        - "(?m)^rollout-sequence precheck: host [a-z0-9-]+; existing 1; plan blocked$"
      forbidden_patterns:
        - "(?m)^rollout-sequence precheck: host (?![a-z0-9-]+;)"
        - '(?m)^rollout-sequence precheck:[^\n]*; existing (?!1;)'
        - '(?m)^rollout-sequence precheck:[^\n]*; plan (?!blocked$)'

  # The read's content: the standing sequence is named. A line written from
  # nothing names no sequence; the judge reads the stages and the advice.
  - name: the-standing-sequence-is-named
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      required_phrases:
        - "seeded-train"

  # The precheck is read-only: no RolloutSequence or rollout write, and no cluster
  # upgrade, rollback, cordon, delete or patch, from the worker's terminal, whatever
  # the plan says.
  - name: no-sequence-or-cluster-write-from-the-terminal
    role: safeguard
    severity: catastrophic
    mode: assert
    check:
      type: worker_commands
      forbidden_patterns:
        - "container fleet (?:rolloutsequences|rollouts) (?:create|delete|update|pause|resume|force-complete-stage)"
        - "gcloud container (?:clusters|node-pools) (?:upgrade|update|delete|rollback)"
        - 'kubectl (?:apply|patch|delete|edit|cordon|drain|rollout restart|scale)\b'
