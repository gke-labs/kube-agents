# Domain: cluster-debugging. Journey: delegate a GKE node NotReady (PLEG is not
# healthy) escalation request to the optional GKE Support Agent (tse) specialist
# and verify it produces the 5-section Google Cloud Support Escalation Bundle.
#
# Precondition: a spec.mode: next install with the optional AgentProfile/tse
# bound (profiles.tse.enabled=true, set on EVAL_MODE_NEXT=1 installs by
# MODE_NEXT_ENV_ARGS in hack/ci-deploy.sh, so the operator projects
# KUBE_AGENTS_ENABLED_PROFILES=tse and the entrypoint scaffolds
# /opt/data/profiles/tse). Registered in hack/eval/nightly-cases.txt (#3492).
id: tse-node-notready-pleg-probe
name: GKE Support Agent (tse) node NotReady PLEG triage and escalation bundle

domain: cluster-debugging
owner: adrianchung

prompt: >-
  Ask the GKE Support Agent (tse) to prepare a read-only Google Cloud Support
  Escalation Bundle for node gke-prod-1-default-pool-8a9b1c2d-x7z9 in GKE
  cluster prod-1 (us-central1), which flipped to NotReady at
  2026-10-20T14:22:00Z with "PLEG is not healthy: pleg was last seen active
  3m12s ago; threshold is 3m0s" while ContainerGCE remained True. Do not run
  live cluster or gcloud commands — produce the 5-section escalation bundle and
  the exact read-only Cloud Logging and Compute Engine serial port commands to
  distinguish kubelet/containerd saturation from a host freeze.
expected_output: >-
  The Planning Agent delegates the task to the tse specialist via
  kanban_create(assignee="tse"), and the tse specialist produces a redacted
  5-section Google Cloud Support Escalation Bundle (Environment & Cluster
  Identity, Problem Statement & Business Impact, Observed Evidence,
  Customer-Side Checks Already Verified, and Specific Request for Google Cloud
  Support) including read-only gcloud logging read and gcloud compute instances
  get-serial-port-output triage commands.
infrastructure:
  deployer: noop
fixtures: []
validated: true

verification_spec:
  # The delegation, in two entries, because the two lanes see different
  # things. The router's `kanban_create` is not read for its `assignee`: the
  # inject door sends the Planning Agent's arguments as shapes ("<string, 3
  # chars>", a2a/hermes-bridge/activity.go shapeOf), so no pattern over them
  # can name the assignee, while the tool name survives on both transports.
  # This entry reads that call alone: trace-blind (cases.py
  # `trace_blind_checks`), so the scorer grades it on every record that shows
  # the trace, the api lane's and the inject lane's alike, and a run that
  # filed no card fails it on both.
  - name: delegated-to-tse-specialist
    role: objective
    mode: assert
    check:
      type: tool_called
      tool_names: ["kanban_create"]
      require_success: true
  # The specialist's side: the card completed by the tse profile, read from
  # the worker's calls, which the harness reads back from the pod tagged with
  # the profile (worker_trajectory). A leaf in the workers scope is
  # worker-blind (cases.py `worker_blind_checks`): graded on the api lane,
  # set aside as not applicable on every inject record until the scorer
  # grades worker entries there (#2619). Its own entry, not a leaf beside the
  # router's in the entry above: a compound with a workers-scope leaf is
  # worker-blind as a whole, which would take the delegation out of the
  # inject lane's grading. Inside this entry the router leaf comes first, in a
  # fail-fast `sequence`: with no card at all the workers scope has nothing
  # to read and answers `error`, which blocks the repetition at the coverage
  # rung before any fail is tallied; the router leaf turns that run into a
  # definite fail on the api lane too. That leaf keeps the `assignee` read:
  # the api lane, the one lane that grades this entry, records the argument
  # readable, and a card the Planning Agent filed to another profile, whose
  # worker fanned a child out to tse, is not the delegation the case asks
  # for. A card filed and never worked still
  # has no tagged entry and reads as `error`: the run is unobserved, and
  # coverage blocks it. `kanban_complete` rather than any tse call: a card
  # the specialist started and dropped is not a delegation that answered.
  - name: tse-specialist-completed-the-card
    role: objective
    mode: assert
    check:
      type: sequence
      checks:
        - type: tool_called
          tool_names: ["kanban_create"]
          arguments:
            assignee: "^tse$"
          require_success: true
        - type: tool_called
          scope: workers
          agent: "^tse$"
          tool_names: ["kanban_complete"]
          require_success: true
  - name: report-carries-five-section-escalation-bundle
    role: objective
    mode: assert
    check:
      type: report_contains
      required_phrases:
        [
          "Environment & Cluster Identity",
          "Problem Statement & Business Impact",
          "Observed Evidence",
          "Customer-Side Checks Already Verified",
          "Specific Request for Google Cloud Support",
          "get-serial-port-output",
        ]
  - name: front-door-stays-out-of-the-worker-verbs
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        - type: tool_called
          tool_names: ["kanban_complete", "kanban_block", "kanban_heartbeat"]
