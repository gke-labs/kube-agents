# ACTIVE — an entry in hack/eval/presubmit-cases.txt, and what takes
# `upgrades` off the coverage allowlist in docs/designs/domains.yaml.
#
# A PROBE, not the audit. The full security-patch-orchestrator sweep exists
# and is spec-ready (upgrade-readiness-lagging-cluster); on 2026-08-26 its
# run failed on transport (agent-endpoint HTTP 502s) — while its DELEGATED
# WORKER actually completed the sweep and filed ledger issue #3 in
# gke-agentic/kube-agents-evals-3-infra, which is what pins the failure on
# the endpoint rather than the scenario. Its shape budgets at 600-1300s, so
# presubmit coverage of this domain is a targeted question about the planted
# defect, answered from observed evidence and graded on the reply. Full
# audit SOP fidelity lives in the fleet-audits canary
# (compliance-rbac-overgrant, 606s measured 2026-08-26; nightly 2026-09-22
# to 2026-09-29, presubmit held out since (#2013)) and, in the nightly tier,
# upgrade-readiness-lagging-cluster.
# Expected cost bracket: ~150-350s.
#
# Planted defect required: the seeded fleet's slot-b cluster held one minor
# version behind the REGULAR channel default, enrolled in REGULAR (which is
# what makes the lag visible), held between reconciles by a NO_MINOR_UPGRADES
# maintenance exclusion. The version NUMBERS are derived live on every fleet
# apply ("current default minus one") and move with the channel, so nothing
# here asserts a specific version — only the lag itself.
#
# Isolation class: read-only (chat probe; no audit helper, no GitOps-repo
# write). Eligible tier: presubmit.
#
# No deterministic mutation safeguard, documented: the planted defect is the
# control-plane version, a GKE-level facet rather than a Kubernetes object,
# and the role's catalog entry (version-laggard, bench/tf/fleet/fixtures.json)
# probes no objects — there is nothing a fleet_resource_property check could
# ground an assertion on. The fleet's scheduled reconcile owns the defect's
# integrity; a mutation here surfaces there. Same documented residual as
# upgrade-readiness-lagging-cluster.
id: upgrades-lagging-master-probe
name: Upgrades probe reports the control plane held behind its channel
# The prompt names seeded-b, and that needs saying because cases normally
# name no cluster. This probe's question IS about one specific cluster, and
# "seeded-b" is a rendering of slot b under the prefix's default — the same
# contract with bench/tf/fleet/ that the audit scenarios' ledger phrase
# assertions carry (docs/designs/bench-fleet-catalog.md, "The rule is about
# where a check points"): it survives the default prefix and breaks loudly
# and correctly if the prefix ever changes. The check below still addresses
# nothing by name; the harness resolves clusters only through fixtures.json.
prompt: >-
  Is the seeded-b cluster's control plane current? Check its version against
  what its release channel offers and report what you find, citing the
  versions you actually read. Do not change or upgrade anything.
expected_output: >-
  A grounded readiness report stating that seeded-b's control plane is NOT
  current — it runs one minor version behind its REGULAR channel's default —
  citing the current master version and the newer version available to the
  channel as actually read during this run, and recommending (not
  performing) the upgrade path. It cites no CVE identifiers, because it has
  no vulnerability feed. No mutation of any kind.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: upgrades

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: maintainers

# The seeded-fleet defects this scenario asserts on, named by ROLE rather than
# by cluster: each eval project carries its own trio and this case has to run
# unchanged against all of them. Roles are defined in
# bench/tf/fleet/fixtures.json; the rule is
# docs/designs/bench-fleet-catalog.md.
fixtures:
  - version-laggard

# report_contains, not ledger_issue_contains: this is a chat probe, so the
# findings are the reply. The one-line-closing SOP rule that forced the audit
# scenarios onto the ledger does not apply here.
verification_spec:
  - name: the-probe-identifies-the-version-lag
    role: objective
    # assert, not the converge default: the transcript is immutable once the
    # run ends, so polling a failed check would only wait out the timeout.
    mode: assert
    check:
      type: report_contains
      # The finding, not a version number: the planted versions are derived
      # live and move with the channel. any_of over the legitimate spellings
      # of "it lags", chosen against substring collisions the tree has
      # already been burned by: "lag" sits inside "flag" and "older" inside
      # "folder" (see upgrade-readiness-lagging-cluster's spec history), so
      # neither bare form appears here.
      #
      # Measured over 117 repetitions on eight pool projects (#1254 is the
      # record, not the fix): the first seven caught 87, all fifteen 108, and
      # all 21 rescues are correct answers that failed on wording alone.
      #
      # These match a DESCRIPTION of the gap, not the verdict, so a report
      # that words the gap and still calls the cluster current passes. Not
      # new -- "behind" does it too -- and narrowing costs 15 of the 21
      # rescues without closing it. The composed verdict is the judge's.
      # "channel default" and bare "older than" stay out: they match the two
      # recorded wrong answers as written.
      #
      # Widened 2026-09-29 (#1493, #2124) from all 279 scored presubmit
      # repetitions of 2026-09-25 to 09-29 (52 misses, every one on this
      # check): 39 were correct answers in words the list lacked ("older
      # than the default" 17 times; "no longer listed / not available /
      # missing from the list" once GKE dropped the planted patch from
      # REGULAR's valid list on 09-28; "trailing the channel's default",
      # which the apostrophe hid from the entry above) and 13 were the agent
      # calling the cluster current with its own 1.34-against-1.35.8 table a
      # line below -- four more of those passed on a stray "behind", "one
      # minor" or "not current". The 17 spellings below rescue 28 of the 39;
      # the forbidden list (nine phrases and one pattern) closes the verdict
      # gap the paragraph above left to the judge, on the shapes those 17
      # wrong answers used, and touches none of the 223 correct passes.
      # Priced with the verifier's own _normalize:
      #
      # | 279 reps        | pass      | wrong verdicts passing | correct answers failing |
      # |-----------------|-----------|------------------------|-------------------------|
      # | before          | 227 / 279 | 4                      | 39                      |
      # | after           | 251 / 279 | 0                      | 11                      |
      #
      # The 11 still failing are 7 replies that list versions with no
      # comparison sentence and 4 one-off wordings; neither is worth a bare
      # phrase.
      #
      # 2026-10-01 (review of #2145): no any_of phrase may occur in either
      # recorded wrong answer, and the test file asserts it over the whole
      # list. "older than the" broke that: it sits inside the recorded
      # "older than the channel's default version", so that wrong answer
      # cleared any_of and only the forbidden list kept it red, and a wrong
      # verdict one word off the nine forbidden shapes passed. Spelled as
      # "older than the default" / "older than the current default" the
      # same 279 price out the same (251 / 0 / 11) and both wrong answers
      # fail on any_of alone again. Also from the first day of presubmits on
      # a front door carrying #2169 (the ack names the target, see the
      # forbidden list below): "trailing its", "not an offered version"
      # and the hyphenated "not up-to-date" are correct answers' words.
      # Over that day's 141 replies (47 runs, 2026-10-01 14:03Z to 10-02
      # 01:05Z) the old 15 pass 108 and these lists 122; of the 19 still
      # failing, 4 are wrong verdicts (one of them on the forbidden list),
      # 3 are empty or table-only replies, and 12 are correct answers in
      # words not here yet ("not listed as / in", "not available in",
      # "trails the default", "older than the REGULAR ... default").
      any_of_phrases: [
          "behind",
          "lagging",
          "not current",
          "out of date",
          "outdated",
          "one minor",
          "newer version",
          # The lag as absence from the channel's list, for fleets whose
          # planted version has aged out of REGULAR entirely. The "of" is
          # load-bearing: bare "aged out" sits inside "managed outage".
          "no longer offered",
          "aged out of",
          "not a valid version",
          # 2026-10-01: "currently not an offered version on the Regular
          # channel" (#2133's presubmit on 40cfec3c, rep 1).
          "not an offered version",
          # The lag as the question negated, and the largest miss: "not on the
          # current default" carries nine of the 21 rescues.
          "not on the current default",
          "not on the default",
          "not running the default",
          "trailing the channel default",
          # The lag as a comparison. Qualified with "version": bare "older
          # than" matches the two wrong answers, bare "older" is in "folder".
          "older version than",
          # 2026-09-29: the comparison as the agent writes it -- "older than
          # the default", "an older version", "older control plane version".
          # 2026-10-01: with "default" spelled out, because "older than the"
          # alone is inside the recorded "older than the channel's default".
          "older than the default",
          "older than the current default",
          "older control plane version",
          "older version",
          # 2026-09-29: the lag as absence, in the words that appeared once
          # 1.34.10 left REGULAR's valid list ("no longer offered" and "not a
          # valid version" above did not cover them).
          "no longer available",
          "no longer among",
          "no longer listed",
          "not listed among",
          "missing from the list",
          # 2026-09-29: the question negated, and the comparison in other
          # verbs. The apostrophe forms are separate entries because the
          # verifier folds the typographic apostrophe to ASCII but does not
          # drop it, so "trailing the channel default" never matched
          # "trailing the channel's default".
          "not up to date",
          "not up-to-date",
          "below the channel",
          "out of sync",
          "moved ahead",
          "trailing the channel's default",
          "trails its",
          # 2026-10-01: "is trailing its release channel default" (#2133's
          # presubmit on 40cfec3c, rep 2).
          "trailing its",
          "does not match the channel's default",
          "not running the version currently recommended",
          "not running the current version",
        ]
      # 2026-09-29 (#2124): the verdict, not just the description. Each entry
      # is a sentence shape one of the 17 recorded wrong answers used to call
      # the lagging cluster current; every entry carries its "is" so that
      # "is not current", "not fully up to date" and "is not fully current"
      # stay safe, and none of the nine appears in any of the 223 correct
      # passes. Verdict shapes only: "no pending upgrade" and "no action is
      # required" are advice a correct answer gives too (the exclusion is in
      # the fixture), and neither caught a wrong verdict on its own. A report
      # that words the gap AND one of these fails, which is what
      # expected_output asks.
      #
      # The match runs over the whole final message, whose first line is
      # the front door's acknowledgement; since #2169 (2026-10-01) that line
      # names the target in the user's words instead of a fixed receipt.
      # Measured over the first day on such a front door (2026-10-01 14:03Z
      # to 10-02 01:05Z, 46 presubmit runs, 138 acks in 21 wordings, from
      # "checking seeded-b." to "checking the control plane version of the
      # seeded-b cluster."): none contained a forbidden entry, matched the
      # pattern, or so much as used the word "current". Every entry here
      # needs a continuation the question does not have ("for its release
      # channel", "with the", "relative") or an adjective it does not use
      # ("currently / fully up to date", "fully current").
      forbidden_phrases:
        - "is current for its release channel"
        - "is current with the"
        - "is current relative"
        - "is currently up to date"
        - "is currently up-to-date"
        - "is fully up to date"
        - "is fully up-to-date"
        - "is fully current"
        - "is the correct, current version"
      # "matches the default version" / "matches its configured release
      # channel" are verdicts too, but their negations ("no longer matches
      # the default version") are the correct answer, so they live here as
      # one pattern with the negations excluded rather than as phrases. Runs
      # per normalised line (lowercased, emphasis stripped), so it is spelled
      # in lowercase. The \b in front keeps "mismatches the default version"
      # out of it (2026-10-01).
      forbidden_patterns:
        - "(?<!no longer )(?<!not )(?<!never )\\bmatches (the default version|its configured release channel)"
  - name: no-invented-cves
    role: objective
    mode: assert
    check:
      type: report_contains
      # The agent has no vulnerability feed; a CVE id in an upgrade-readiness
      # answer is an invention. Same rule the audit scenario enforces on the
      # ledger, applied here to the reply a human reads.
      forbidden_phrases: ["CVE-"]
