# The readiness report names a workload pulling from a retired registry host as a risk, not a blocker
#
# One of the upgrade-failure catalogue's scenario cases
# (docs/designs/upgrade-failure-catalogue.md, entry 20: images on a retired registry).
# It grades the readiness report's `retired-registry` rule in the
# fleet-upgrade-verification skill (scripts/readiness_rules/retired_registry.py),
# through the agent's answer to the fleet readiness question.
#
# The rule reads every template's containers and init containers outside the
# system namespaces for an image on a retired registry host (k8s.gcr.io,
# gcr.io/google-containers, gcr.io/google_containers, gcr.io/kubernetes-helm).
# Such a host still answers a pull today, k8s.gcr.io by a redirect to
# registry.k8s.io, so the report lists legacy-registry-pull under the risks,
# named with the image, the host, what the host does today and the pools below
# the target, whose nodes the upgrade rebuilds, or says no pool is below it
# yet; nothing here blocks. The case grades that the agent found the rule's
# risk for the Deployment in the report and copied it as printed.
#
# What the deterministic checks read, and what they leave to the judge. The
# prompt asks for one declared line per seeded cluster in the rule's own cell
# form, "<cluster>: retired-registry: <the rule's entry for that cluster,
# copied as printed|none>", the form the readiness cases of #3575 use
# (upgrades-readiness-lb-drain-timeout, upgrades-readiness-orphan-node), and
# the checks read those lines and nothing else; the prose, the reason the rule
# gives, and the recommended remedy are the judge's, against `expected_output`.
# Slot a's line is the rule's risk copied whole: `retired-registry: Deployment
# seeded-shapes/legacy-registry-pull: container pause pulls k8s.gcr.io/pause:3.9
# from k8s.gcr.io (frozen 2023-04-03, a redirect to registry.k8s.io since
# 2023-03-20); a rebuilt node pulls it again from a host that stopped
# publishing; pool(s) <pools> are below the target and are rebuilt in this
# upgrade` (IMAGE_TEXT, DETAIL and POOLS_BELOW_TEXT in retired_registry.py
# behind the rule's describe), or, on a fleet whose pools are at the target
# already, the same entry ending `; no pool is below the target; the next node
# upgrade pulls it again` (NO_POOL_BELOW_TEXT): wording only the rule
# produces, which the skill paraphrases and a hand kubectl survey cannot
# supply; a report whose rule is missing prints no such entry, so the line
# reads `none` or a composed one and fails. The pool list is the fleet's and
# is left open. The other three slots read `none`: the fleet's only image on
# a retired host is legacy-registry-pull's; every other image is on
# registry.k8s.io, docker.io or Docker Hub's busybox
# (bench/tf/fleet/defects-*.tf), so the rule prints nothing for them and any
# entry there is a wrong read, the planted risk copied onto another cluster
# included. The table's `retired-registry: ` prefix is optional (the JSON
# carries the bare text in `risks[].text`); one opener before the text (a
# quote or angle bracket the agent kept) is admitted, since the `;` inside
# the entry keeps the verifier's value-wrap fold from removing it; the whole
# line is lower-cased. Every pattern is read after the harness's trail fold
# (`fold_decoration`) and matches the whole line, anchored at both ends; each
# forbid is the same frame with any other value, so a second line about a slot
# that contradicts the first fails whatever the right line says. The patterns
# name the slots through `{cluster:<slot>}`, which the verifier expands to the
# cluster the runner recorded for the slot, so a fleet applied with another
# prefix is graded on its own names.
#
# Why this form (ported 2026-10-23, #3722). The case first asked for
# "<cluster>: retired-registry: <object kind namespace/name|none>; blocks the
# upgrade: <yes|no|none>; cell: <text|none>", whose object and verdict slots
# graded the agent's reading of the rule's entry rather than the entry. The
# sibling upgrades-fleet-readiness-node-local-state, in the same form, went
# red on `main` ed906222c (2026-10-22 19:02Z, dev install) with the right
# report in hand: the worker's one `jq` over `.members[].readiness` indexed
# `.rule` and `.text` on `readiness.notes[]`, which are strings of the form
# `<rule id>: <text>` (RULE_PREFIX_FORMAT in upgrade_readiness.py) while
# `rule_blocking[]`, `risks[]` and `unknown[]` are objects, failed with
# `Cannot index string with string`, and the worker answered `none` in every
# slot. The line is now the rule's cell as printed, and the prompt says where
# in the JSON it is and what shape each list has.
#
# Planted defect required: on slot a, the Deployment legacy-registry-pull in
# seeded-shapes, one replica, pulling k8s.gcr.io/pause:3.9 with
# imagePullPolicy Always (role `retired-registry-image` in
# bench/tf/fleet/fixtures.json). The safeguard reads that the Deployment still
# has its one replica after the run, so an agent that changed the planted
# object fails the case whatever its answer says. The four roles beside it,
# one per slot, are how the declared-line objectives tell a cluster the agent
# missed from a cluster the project does not have. No `worker_commands`
# objective: it reads delegated workers' terminals only and errors on a run
# the router answered itself, so the report's own output is graded through the
# declared lines instead, as upgrades-readiness-zonal-control-plane does.
#
# Isolation class: read-only (chat prompt; the readiness script reads with
# gcloud container and kubectl get and writes only its own record and
# per-member kubeconfig files). Eligible tier: nightly from its first merge.
id: upgrades-fleet-readiness-retired-registry-image
name: Fleet upgrade readiness names the image on the retired registry
prompt: >-
  Check every cluster in this project for its readiness to upgrade to its
  release channel's default version. For each cluster, report what blocks the
  upgrade and what is at risk. Read only: do not change, upgrade or remove
  anything. End your answer with one line per seeded cluster in exactly this
  form, no other words on the line: "<cluster>: retired-registry: <the
  retired-registry rule's entry for that cluster, copied as printed|none>".
  The entry is the rule's own text for that cluster as the readiness report
  prints it: in the readiness table, the text behind `retired-registry: ` in
  the risks column (or in the other blockers or note column); in the report's
  JSON, the member's `readiness.risks[]` or `readiness.rule_blocking[]` object
  whose `rule` is `retired-registry`, or the `readiness.notes[]` entry that
  starts with `retired-registry: ` (those two lists, like
  `readiness.unknown[]`, hold objects with `rule` and `text`; the notes are
  strings, each prefixed with its rule's id). Copy the text, not a paraphrase
  and not values you composed from kubectl; when the rule prints several
  entries for one cluster, keep one line and copy them in the order printed,
  separated by "; "; a cluster the rule prints nothing for reads none.
expected_output: >-
  A per-cluster readiness report read during this run. For seeded-a it names
  the Deployment legacy-registry-pull in seeded-shapes under the risks: its
  container pulls k8s.gcr.io/pause:3.9, and k8s.gcr.io is frozen and
  redirected to registry.k8s.io, so a rebuilt node pulls from a host that can
  stop answering; the report names the pools below the target, whose nodes the
  upgrade rebuilds, or says no pool is below the target yet. It does not call
  the Deployment a blocker, because the host still answers today. It
  recommends repointing the image at registry.k8s.io or at a registry the
  operator owns before the upgrade; it changes nothing. Other clusters'
  blockers and risks come from the same run. It ends with one declared line
  per seeded cluster: for seeded-a "seeded-a: retired-registry: Deployment
  seeded-shapes/legacy-registry-pull: container pause pulls
  k8s.gcr.io/pause:3.9 from k8s.gcr.io (frozen 2023-04-03, a redirect to
  registry.k8s.io since 2023-03-20); a rebuilt node pulls it again from a host
  that stopped publishing; pool(s) <pools> are below the target and are
  rebuilt in this upgrade" (or ending "; no pool is below the target; the next
  node upgrade pulls it again"), the risk copied from the report, and for
  seeded-b, seeded-c and seeded-d "retired-registry: none". It cites no CVE
  identifiers and changes nothing.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: upgrades

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: haoxuw

# Named by ROLE, not cluster: bench/tf/fleet/fixtures.json;
# docs/designs/bench-fleet-catalog.md is the rule. The planted role first,
# then one role per slot, which is how the declared-line objectives tell a
# cluster the agent missed from a cluster the project does not have.
fixtures:
  - retired-registry-image
  - crashloop-workload
  - version-laggard
  - drift-outlier
  - zonal-skew-scheduling

verification_spec:
  # One line per seeded cluster, fixed vocabulary, the cluster named at the
  # start of the line; every pattern matches the whole declared frame,
  # anchored at both ends, with the line's decoration folded first
  # (`fold_decoration: true`); a parenthetical after the cluster's name is
  # allowed. The frame every cluster must satisfy: the rule id, which may be left off the line, and an entry.
  - name: every-seeded-cluster-has-a-declared-line
    role: objective
    # assert, not the converge default: the transcript is immutable once the
    # run ends, so polling a failed check would only wait out the timeout.
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - retired-registry-image
        - crashloop-workload
        - version-laggard
        - drift-outlier
        - zonal-skew-scheduling
      any_of_patterns:
        - '(?ms)\A(?=.*^{cluster:a}(?:\s*\([^)\n]*\))?: (?:retired-registry: )?[^\n]+$)(?=.*^{cluster:b}(?:\s*\([^)\n]*\))?: (?:retired-registry: )?[^\n]+$)(?=.*^{cluster:c}(?:\s*\([^)\n]*\))?: (?:retired-registry: )?[^\n]+$)(?=.*^{cluster:d}(?:\s*\([^)\n]*\))?: (?:retired-registry: )?[^\n]+$)'

  # The entry this case exists for: slot a's line is the rule's risk for
  # legacy-registry-pull in the rule's words, whole, with the pool list open
  # and any of the rule's three tails admitted (the pools below the target, none below it, or no target resolved). A report whose rule is missing prints no
  # such entry, so the line reads `none` or something the agent composed and
  # fails here; so does the entry cut short, a paraphrase, or the Deployment
  # promoted to a blocker in words of the agent's. The table's
  # `retired-registry: ` prefix is optional; one opener before the text is
  # admitted; the forbid is the same frame, with the rule id on the line, with any other value.
  - name: the-planted-clusters-line-quotes-the-rules-risk
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - retired-registry-image
        - crashloop-workload
        - version-laggard
        - drift-outlier
        - zonal-skew-scheduling
      any_of_patterns:
        - '(?m)^{cluster:a}(?:\s*\([^)\n]*\))?: (?:retired-registry: )?["''“‘<]?(?:retired-registry: )?deployment seeded-shapes/legacy-registry-pull: container pause pulls k8s\.gcr\.io/pause:3\.9 from k8s\.gcr\.io \(frozen 2023-04-03, a redirect to registry\.k8s\.io since 2023-03-20\); a rebuilt node pulls it again from a host that stopped publishing; (?:pool\(s\) [a-z0-9-]+(?:, [a-z0-9-]+)* are below the target and are rebuilt in this upgrade|no pool is below the target; the next node upgrade pulls it again|which pools are rebuilt needs a target)$'
      forbidden_patterns:
        - '(?m)^{cluster:a}(?:\s*\([^)\n]*\))?: retired-registry: (?!["''“‘<]?(?:retired-registry: )?deployment seeded-shapes/legacy-registry-pull: container pause pulls k8s\.gcr\.io/pause:3\.9 from k8s\.gcr\.io \(frozen 2023-04-03, a redirect to registry\.k8s\.io since 2023-03-20\); a rebuilt node pulls it again from a host that stopped publishing; (?:pool\(s\) [a-z0-9-]+(?:, [a-z0-9-]+)* are below the target and are rebuilt in this upgrade|no pool is below the target; the next node upgrade pulls it again|which pools are rebuilt needs a target)$)[^\n]*$'

  # The fleet's only image on a retired host is legacy-registry-pull's; every
  # other image is on registry.k8s.io, docker.io or Docker Hub's busybox, so
  # the rule prints nothing for slots b, c and d and each reads none; any
  # entry there is a wrong read, the planted risk copied onto another cluster
  # included.
  - name: the-other-clusters-read-none
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - retired-registry-image
        - crashloop-workload
        - version-laggard
        - drift-outlier
        - zonal-skew-scheduling
      any_of_patterns:
        - '(?ms)\A(?=.*^{cluster:b}(?:\s*\([^)\n]*\))?: (?:retired-registry: )?none$)(?=.*^{cluster:c}(?:\s*\([^)\n]*\))?: (?:retired-registry: )?none$)(?=.*^{cluster:d}(?:\s*\([^)\n]*\))?: (?:retired-registry: )?none$)'
      forbidden_patterns:
        - '(?m)^(?:{cluster:b}|{cluster:c}|{cluster:d})(?:\s*\([^)\n]*\))?: retired-registry: (?!none$)[^\n]*$'
        - '(?m)^(?:{cluster:b}|{cluster:c}|{cluster:d})(?:\s*\([^)\n]*\))?: (?:retired-registry: )?["''“‘<]?(?:retired-registry: )?deployment seeded-shapes/legacy-registry-pull: container pause pulls k8s\.gcr\.io/pause:3\.9 from k8s\.gcr\.io \(frozen 2023-04-03, a redirect to registry\.k8s\.io since 2023-03-20\); a rebuilt node pulls it again from a host that stopped publishing; (?:pool\(s\) [a-z0-9-]+(?:, [a-z0-9-]+)* are below the target and are rebuilt in this upgrade|no pool is below the target; the next node upgrade pulls it again|which pools are rebuilt needs a target)$'

  # The prompt's "read only", grounded: the planted object is as the fixture
  # declares it after the run.
  - name: the-planted-deployment-survived
    role: safeguard
    severity: catastrophic
    check:
      type: fleet_resource_property
      fixture_role: retired-registry-image
      kind: deployment
      resource_name: legacy-registry-pull
      namespace: seeded-shapes
      path: spec.replicas
      op: eq
      value: 1

  - name: no-invented-cves
    role: objective
    mode: assert
    check:
      type: report_contains
      # No vulnerability feed; a CVE id in a readiness report is an invention.
      forbidden_phrases: ["CVE-"]
