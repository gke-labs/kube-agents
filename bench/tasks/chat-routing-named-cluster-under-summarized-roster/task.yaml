# Registered in hack/eval/nightly-cases.txt. Not on the blocking roster: a
# presubmit seat is a later pull request that cites this case's nightly record.
#
# Domain: chat and routing. Above KUBEAGENTS_ROSTER_SUMMARY_THRESHOLD Cluster
# Agents (20 unless set) the injected roster block counts the shared-role
# group by project and location instead of naming each agent
# (agents/chat/scripts/agent_roster.py), and agents/chat/SOUL.md §1 and §3
# tell the front door to find a named cluster's assignee through
# `list_agents(filter=<cluster>)` and route the card to it, calling again
# when the lookup says the roster could not be fully read and routing to
# `platform` only when it says no agent matches. This case grades that a
# question naming one seeded cluster still reaches that cluster's Cluster
# Agent under the counted block.
#
# Which form the case grades is the install's, not the case's: the counted
# block is reached only on an install whose threshold is set below its
# Cluster Agent count (`KUBEAGENTS_ROSTER_SUMMARY_THRESHOLD: "1"` in
# spec.deployment.env). No CI install sets it, so in CI the block names
# every agent and the lookup is never called; that route is also correct,
# and the case cannot go red on an install that never counts. The lookup
# route (`list_agents(filter=...)`, then the card to the assignee it
# returned) is graded only where the threshold is set, as the pull request
# that added this case did on its own install; admitting it to a CI lane
# is the eval install's setting to make.
#
# What it grades, and where: that a card was filed (kanban_create
# succeeded, read by tool name alone, which both transports keep); that the
# card went to seeded-a's Cluster Agent, read from kanban_create's
# `assignee` and then from the workers (worker_agents) in one entry, which
# the inject lane sets aside: the inject door sends the Planning Agent's
# arguments as shapes ("<string, 48 chars>", a2a/hermes-bridge/activity.go
# shapeOf, a2a/docs/hermes-bridge.md "What goes on the bus"), so no pattern
# over them can name the assignee, and the workers are not graded there
# until #2619. The route is therefore graded over the agent API only (a dev
# install; no CI lane runs this case over that transport today); on the
# nightly a card to `platform` whose
# answer named the namespaces passes until #2619 lands, with the worker
# evidence on the record. And that the answer names the cluster's
# namespaces, including seeded-debug, which only a read of seeded-a can
# name; and that no "which cluster" question was asked.
#
# No `fixtures:` list. seeded-debug is the crashloop-workload fixture's
# namespace on seeded-a's slot, named here so the fleet owner replacing that
# slot finds this case, but the case asserts nothing about the fixture's
# state: the namespace is created apart from its pods, and a one-role
# `fixtures:` list would tell the runner the grade depends on that role and
# have the nightly set the case aside whenever it drifts
# (bench/kube_agents_bench/fixture_drift.py, case_roles).
#
# Planted defect required: none. Isolation class: read-only. deployer: noop,
# one front-door turn plus the card round trip.
id: chat-routing-named-cluster-under-summarized-roster
name: A named cluster reaches its own Cluster Agent under a counted roster
prompt: >-
  Which namespaces exist in the seeded-a cluster?
expected_output: >-
  The front door files a card for seeded-a's Cluster Agent without asking
  which cluster is meant, and the answer lists seeded-a's namespaces,
  including kube-system and seeded-debug.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml: the front door's routing journey.
domain: chat-and-routing

verification_spec:
  # assert, not the converge default: the transcript is immutable once the
  # run ends, so polling a failed check would only wait out the timeout.
  # Read by tool name alone, which both transports keep: trace-blind
  # (kube_agents_bench.cases, trace_blind_checks), graded on the inject
  # lane and the agent API alike; a run that filed no card fails it on both.
  - name: work-was-delegated-through-kanban
    role: objective
    mode: assert
    check:
      type: tool_called
      tool_names: ["kanban_create"]
      require_success: true
  # The route, read from both sides in one fail-fast `sequence`: the
  # router's `kanban_create` with its `assignee` (profile names are
  # `cluster-<project>-<cluster>-<location>`,
  # cluster_agent_profile.profile_name; the project and location are the
  # install's), then seeded-a's Cluster Agent among the workers. One entry,
  # not a bare router entry: the inject door sends the router's arguments as
  # shapes (a2a/hermes-bridge/activity.go shapeOf), so an `assignee` pattern
  # never matches there and a plain router entry on it fails every inject
  # record. A compound with a workers-scope leaf is worker-blind as a whole
  # (kube_agents_bench.cases, _reads_the_workers): set aside on the inject
  # lane, graded over the agent API, where the argument is readable. The
  # router leaf comes first so a run that filed no card is a graded fail
  # there, not an unobserved `error` that blocks the repetition at the
  # coverage rung.
  - name: seeded-a-cluster-agent-did-the-work
    role: objective
    mode: assert
    check:
      type: sequence
      checks:
        - type: tool_called
          tool_names: ["kanban_create"]
          arguments:
            assignee: "cluster-.+-seeded-a-.+"
          require_success: true
        - type: worker_agents
          required_agents: ["cluster-.+-seeded-a-.+"]
  - name: the-answer-names-the-clusters-namespaces-without-asking
    role: objective
    mode: assert
    check:
      type: report_contains
      required_phrases: ["kube-system", "seeded-debug"]
      forbidden_patterns:
        - '(?i)\bwhich cluster\b'
