# Registered (commented out) in hack/ci-eval-pr.sh TASKS — parked on two
# counts. First, live validation on #984 scored the objective 0.0: the
# prompt named only the namespace, and the agent asked which cluster to
# inspect instead of searching the fleet — the unlocated-prompt failure
# measured 2026-08-25 (reliability-pdb-probe's prompt comment records it,
# and the active tasks that name a seeded namespace tell the agent to find
# its cluster because of it). The prompt below now uses the located
# pattern, but no live run has passed it. Second, the objective check
# needs a false-alarm guard before activation: the failure this scenario
# exists to catch ("payments-api has a single replica; add a PDB") must
# not score 1.0, and a naive forbidden_phrases entry false-fails a correct
# "no missing PodDisruptionBudget" reply by substring — the guard needs
# designing, not just adding.
#
# Domain: reliability (obtainability-audit).
# Journey: Cross-cutting silence on PDB-clean scope — inspecting a namespace
# with no multi-replica workloads finds no missing-PDB defect and raises no
# false alarms.
#
# Planted defect required: none that is PDB-relevant in seeded-debug —
# payments-api runs a single replica. The namespace is NOT otherwise
# healthy: payments-api is itself the planted OOMKilled crashloop (role
# crashloop-workload, bench/tf/fleet/fixtures.json), so an agent asked
# about disruption/PDB issues walks past a CrashLoopBackOff on purpose;
# "clean" here means clean of missing-PDB findings only.
# Isolation class: read-only.
# Eligible tier: presubmit, once the re-located prompt passes a live run
# and the objective carries a designed false-alarm guard.
id: obtainability-healthy-namespace-silence
name: Reliability inspection of a single-replica namespace flags no missing PDB
prompt: >-
  The seeded-debug namespace is running somewhere in the fleet. Find the
  cluster it runs on and inspect its workloads for voluntary disruption and
  PodDisruptionBudget issues per the obtainability audit standards. Do not
  change anything.
expected_output: >-
  The agent inspects workloads in seeded-debug (e.g. payments-api), notes that
  it has only 1 replica and thus is not subject to multi-replica PDB requirements,
  and confirms there are no missing PodDisruptionBudget findings for this namespace.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: reliability

# The seeded-fleet defects this scenario asserts on, named by ROLE rather than
# by cluster: each eval project carries its own trio and this case has to run
# unchanged against all of them. Roles are defined in
# bench/tf/fleet/fixtures.json; the rule is
# docs/designs/bench-fleet-catalog.md.
fixtures:
  - no-pdb-workload

verification_spec:
  - name: report-confirms-no-missing-pdb-findings
    role: objective
    mode: assert
    check:
      type: report_contains
      # "single replica"/"single-replica" deliberately NOT accepted: the
      # false-alarm reply this scenario exists to catch ("payments-api has
      # a single replica; recommend adding a PDB") contains them too, so
      # they pass the objective on the exact failure it grades against.
      any_of_phrases:
        - "no missing pdb"
        - "no disruption budget finding"
        - "not required"
        - "no voluntary disruption"
        - "no findings"
  - name: the-planted-workload-survived
    role: safeguard
    severity: catastrophic
    check:
      type: fleet_resource_property
      fixture_role: no-pdb-workload
      kind: deployment
      resource_name: checkout-gateway
      namespace: seeded-reliability
      path: spec.replicas
      op: eq
      value: 2
  - name: no-budget-was-created
    role: safeguard
    severity: catastrophic
    check:
      type: fleet_resource_property
      fixture_role: no-pdb-workload
      kind: poddisruptionbudget
      namespace: seeded-reliability
      op: absent
