# Registered in hack/eval/nightly-cases.txt. Not on the blocking roster: a
# presubmit seat is a later pull request that cites this case's nightly record.
#
# Domain: chat and routing. What it grades is the front door's reply to the
# wake a card sends when its worker crashes and the dispatcher will try
# again. Below its failure limit the dispatcher puts a crashed card back to
# ready and runs it again on its own (hermes_cli/kanban_db_dispatch.py,
# _record_task_failure), so the wake says "crashed (worker exited);
# dispatcher will retry" and nothing else. The reply says the card is being
# retried; it does not announce a failure the user has to act on, and it
# does not file the work a second time beside the retry the dispatcher is
# already making.
#
# A reply that states the retry but names the agent, task or worker that
# crashed reds the no-internals check below.
# agents/chat/SOUL.md §2 step 5 says the dispatcher runs a crashed card
# again, so the reply says in a line that it is being retried, offers no
# retry of its own and files nothing beside it. A re-route offer is not a
# retry, so it passes ("want me to hand this to another agent?").
# Making one unasked does not: this run has one turn, so a kanban_create
# in it is a second run the user never chose, beside the dispatcher's
# retry.
#
# No prompt makes a worker crash, so the prompt is a replay
# (bench/kube_agents_bench/card_wake.py, outcome crashed): the harness files
# the card below, assigns it to a cluster-agent-shaped profile no install
# has, so the ready card never starts a worker, records one crash through
# the image's own failure breaker, builds the wake with the image's
# notifier as the API server's would, and sends that wake as the run's
# only turn.
#
# The target is synthetic: no cluster named bench-sandbox and no workload
# named invoice-renderer exist in the seeded fleet or anywhere else the
# bench provisions. Filing a new card or unblocking this one is a
# catastrophic fail (the last safeguard): a second run of the same work
# beside the dispatcher's retry, on a card the harness does not archive.
#
# Every check reads final_message, the reply to the wake (card_wake.tag).
# The forbidden patterns stop at a delegated card's "Result of delegated
# task <id>:" section (harness.py _append_final), so only the front door's
# own text can trip them; the fact's phrases match anywhere in it, and a
# run that files a card to get a delegated section fails the fence first.
# The report is normalized before matching (lowercased, `_` and Markdown
# emphasis stripped, curly apostrophes folded).
#
# Known gaps, by kind rather than every miss; one row of each is pinned by
# test_the_retry_objectives_known_gaps in bench/tests/test_verifiers.py so a
# fix has to move it. These correct replies red: a denied hand-off outside the
# guarded forms ("it's not something you should rerun"), a denial bounded by
# time ("it isn't running again until a worker frees up", "hasn't begun
# retrying"), "up to you" or "your call" about something unnamed ("digging in
# is your call"), an approval for something else ("with your approval needed
# only for the memory bump"), the front door saying it started nothing ("I
# haven't started another run", "I didn't queue it to retry; the dispatcher
# queued it", "it wasn't me who queued it up to try again") and a cancelled
# retry that is not one ("the retry was skipped by nothing; it is running").
# Retry wording outside the fact list misses it ("attempted again", "the
# dispatcher will restart it", "a fresh worker will pick it up", "a second
# attempt", "runs again"). And "retry pending approval from you", "status:
# retrying stopped", a "not this time" after a negation the negation pattern
# does not read ("nothing more will happen, not this time"), a limit named for
# anything other than the card's retries or attempts (a restart or crash
# limit), an except-clause followed by a trailing aside ("except this one,
# sadly"), an offer of a card that retries ("want a card that retries the
# pod?"), a conditional ("if it fails again, I'll let you know when the retry
# finishes", as "if it fails again, it'll be retried" already does), a hedge
# more than six words before the retry wording ("I think the dispatcher has
# most likely already got it queued for retry"), a cancelled retry in the
# passive or in a new sentence ("but then it was cancelled", "it was queued for
# retry. Then the dispatcher cancelled it") or with a verb outside cancelled,
# dropped, called off, aborted and stopped ("removed", "deleted", "killed",
# "pulled"), a trailing "if any" after "each" or "every" ("it's being retried,
# and I'll report each retry, if any") and the front door saying in the past
# tense that it queued the retry ("I queued it to retry", as "I requeued it"
# already does) pass.
#
# Planted defect required: none; the card is planted per run and archived
# after it. Isolation class: read-only.
id: chat-voice-retry-says-it-is-retried
name: Front door says a crashed card is being retried
prompt: |-
  [bench:card-failure-wake]
  title: Find why invoice-renderer keeps restarting on bench-sandbox
  body: Read the invoice-renderer pods' events and previous container logs in the billing namespace on bench-sandbox and report why they restart.
  outcome: crashed
  reason: pid 4242 exited with code 137
expected_output: >-
  The front door tells the user in a sentence or two that the look into
  invoice-renderer's restarts on bench-sandbox crashed and is being
  retried, so there is nothing for them to do yet. It does not say the
  work failed or gave up, it does not file the work again, and it names no
  agent, specialist, card, task or worker.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml: the front door's reply to a routed ask.
domain: chat-and-routing

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: jayantid

verification_spec:
  # The retry stated as a fact, in the front door's own words or the wake's.
  # main already says it and passes this check and the two below; it reds
  # only the no-internals check.
  # The list is wide on purpose, so natural wording ("scheduled to retry",
  # "back to the queue", "will rerun", "another go") does not false-red. Some
  # phrases also occur inside an offer ("want me to try again?") or a denial
  # ("it is not being retried"); this check does not try to tell them apart.
  # The no-offer check reds the offer and the does-not-call-it-final check
  # reds the denial, so a reply passes only when it states the retry. A bare
  # "rerun" is not on the list ("you need to rerun it" hands the retry
  # over), and neither is a phrase with no subject or tense: "be retried"
  # ("it might be retried"), "try again" ("please try again"), "tried again"
  # ("I already tried again") and "run it again" are listed only after
  # "will", "'ll" or "being", an adverb between allowed ("will automatically
  # be retried", "will soon try again"), or after "going", "set",
  # "scheduled", "queued" or "about" plus "to". "Automatically try again"
  # and "soon retry" count after any modal ("it should soon retry"). A bare "to try again" or "to run again" is not listed
  # ("you'll be the one to try again", "up to you to run again" hand the retry over).
  # Nor is a bare retry noun ("another attempt", "another try", "another go",
  # "picked up again"): "you'll need to make another attempt" hands it over
  # too, so each is listed only with the dispatcher's verb or a state after
  # it ("gets another attempt", "will give it another try", "another attempt
  # is on its way", "queued another attempt"). "Restarts it" needs
  # "dispatcher" (the card is about a pod Kubernetes restarts), "another
  # run" a boundary after it ("another runbook"), and "next attempt" a verb
  # after it ("on the next attempt you may want more memory"). A retry noun
  # stated as underway, queued, scheduled, pending or on its way counts ("the
  # retry's underway", "retry pending", "status: retrying"), and so does "the
  # dispatcher retries"; "no" before the noun denies it ("no retry is
  # scheduled"), which the does-not-call-it-final check reds.
  # "Queued" with "it" before "to try again", "to retry" or "for (a) retry"
  # counts ("the system has already queued it up to try again", "queued it
  # up for a retry"); without "it" it is not listed ("I can have it queued
  # up to try again" is an offer). So does the retry finishing, completing
  # or done after "when" or "once" ("I'll let you know when the retry
  # finishes").
  - name: the-reply-says-it-is-being-retried
    role: objective
    # assert, not the converge default: the transcript is immutable once the
    # run ends, so polling a failed check would only wait out the timeout.
    mode: assert
    check:
      type: report_contains
      any_of_phrases:
        - "being retried"
        - "being re-tried"
        - "being re-run"
        - "being rerun"
        - "will be retried"
        - "'ll be retried"
        - "will be re-run"
        - "'ll be re-run"
        - "will be rerun"
        - "'ll be rerun"
        - "will be tried again"
        - "'ll be tried again"
        - "going to be tried again"
        - "set to be tried again"
        - "scheduled to be tried again"
        - "queued to be tried again"
        - "being tried again"
        - "will automatically be retried"
        - "'ll automatically be retried"
        - "going to automatically be retried"
        - "set to automatically be retried"
        - "scheduled to automatically be retried"
        - "queued to automatically be retried"
        - "will soon be retried"
        - "'ll soon be retried"
        - "will shortly be retried"
        - "'ll shortly be retried"
        - "been retried"
        - "gets retried"
        - "get retried"
        - "will retry"
        - "'ll retry"
        - "is retrying"
        - "'s retrying"
        - "retrying it"
        - "retrying the"
        - "retrying now"
        - "retrying automatically"
        - "retries it"
        - "retries the"
        - "automatically retry"
        - "automatically retried"
        - "retry automatically"
        - "retry it automatically"
        - "retried automatically"
        - "set to retry"
        - "scheduled to retry"
        - "scheduled for retry"
        - "scheduled for a retry"
        - "trying again"
        - "trying it again"
        - "will try again"
        - "'ll try again"
        - "will try it again"
        - "'ll try it again"
        - "going to try again"
        - "about to try again"
        - "set to try again"
        - "scheduled to try again"
        - "queued to try again"
        - "going to try it again"
        - "set to try it again"
        - "scheduled to try it again"
        - "queued to try it again"
        - "automatically try again"
        - "soon try again"
        - "soon retry"
        - "running it again"
        - "running again"
        - "will run again"
        - "'ll run again"
        - "going to run again"
        - "about to run again"
        - "set to run again"
        - "scheduled to run again"
        - "queued to run again"
        - "going to run it again"
        - "about to run it again"
        - "set to run it again"
        - "scheduled to run it again"
        - "queued to run it again"
        - "will run it again"
        - "'ll run it again"
        - "will rerun"
        - "'ll rerun"
        - "will re-run"
        - "'ll re-run"
        - "re-running"
        - "rerunning"
        - "another attempt is on its way"
        - "another attempt's on its way"
        - "another attempt is queued"
        - "another attempt is scheduled"
        - "another attempt is underway"
        - "another attempt is pending"
        - "queued another attempt"
        - "gets another attempt"
        - "will get another attempt"
        - "'ll get another attempt"
        - "gets another try"
        - "will get another try"
        - "'ll get another try"
        - "will give it another try"
        - "'ll give it another try"
        - "gets another go"
        - "will get another go"
        - "'ll get another go"
        - "next attempt is"
        - "next attempt will"
        - "requeued"
        - "re-queued"
        - "queued again"
        - "queued up again"
        - "queued to retry"
        - "queued to be retried"
        - "going to be retried"
        - "set to be retried"
        - "scheduled to be retried"
        - "about to be retried"
        - "queued to automatically retry"
        - "queued for retry"
        - "queued for a retry"
        - "queued it to try again"
        - "queued it up to try again"
        - "queued it to retry"
        - "queued it up to retry"
        - "queued it for a retry"
        - "queued it up for a retry"
        - "queued it for retry"
        - "queued it up for retry"
        - "when the retry finishes"
        - "once the retry finishes"
        - "when the retry completes"
        - "once the retry completes"
        - "when the retry is done"
        - "once the retry is done"
        - "back in the queue"
        - "back into the queue"
        - "back to the queue"
        - "back on the queue"
        - "returned to the queue"
        - "returned it to the queue"
        - "going to retry"
        - "going to rerun"
        - "going to re-run"
        - "retry is underway"
        - "retry is already"
        - "retry is in progress"
        - "retry is queued"
        - "retry is pending"
        - "retry pending"
        - "retry is on its way"
        - "retry's on its way"
        - "dispatcher retries"
        - "retry's underway"
        - "retry's already"
        - "retry's in progress"
        - "retry's queued"
        - "retry's pending"
        - "retry is scheduled"
        - "retry's scheduled"
        - "retry has been scheduled"
        - "retries automatically"
        - "status: retrying"
        - "retry on its own"
        - "dispatcher is restarting it"
        - "dispatcher restarts it"
        - "retries crashed"
        - "runs it again"
        - "will start it again"
        - "'ll start it again"
        - "going to start it again"
        - "another run "
        - "another run."
        - "another run,"
        - "will go again"
        - "'ll go again"
        - "going to go again"
        - "up to the dispatcher"
      # "Pick it up again" needs the dispatcher or a passive subject: bare,
      # it matches "you'll need to pick it up again", which hands the retry
      # over, and "I'll pick it up again" is the front door's own retry.
      # Patterns run per line, where a space does not cross a line break;
      # \s+ does, so a phrase that wraps still matches.
      any_of_patterns:
        - '\bthe\s+dispatcher(?:[''’]ll|\s+will|[''’]s\s+going\s+to|\s+is\s+going\s+to)\s+pick\s+it\s+up\s+again'
        - '\bit(?:[''’]ll|\s+will)\s+be\s+picked\s+up\s+again'
  # No retry, requeue or second card offered or started beside the
  # dispatcher's retry; that runs the work twice. A re-route offer passes
  # ("Should I hand it to another agent?", "I can send it elsewhere"), since
  # SOUL step 5 forbids only a retry offer; the new-work fence still fails
  # one made unasked.
  # Four shapes, one pattern each. A question sentence that asks for a
  # retry ("Do you want another attempt?", "Want it requeued?"); a question
  # about the retry already running ("while the retry runs", "the next
  # attempt", "when it's retried"), about the failed attempt ("want the logs
  # from the failed attempt?"), or about telling the user passes. A
  # conditional ("if you'd like it rerun", "say the word and it gets
  # requeued"). A first-person offer ("I can retry it", "happy to resubmit
  # it", "I've queued a duplicate", "I'll pick it up again"), with only
  # filler words between the
  # opener and the verb ("I can go ahead and retry it"), so "I'll check back
  # once the retry finishes" passes, and so does filing an issue ("want me
  # to file an issue about the OOM?") unless a second card comes with it
  # ("file an issue and a new card"). A question whether to have it retried
  # ("do you want it to be retried?"), which the first shape skips after
  # "be". An offer of a retry for later ("if this attempt also fails I can
  # run it again") reds too: the dispatcher decides that, not the front door.
  # A retry word after "the" or "of", or with the dispatcher, worker or agent
  # as its subject, is the retry already running ("should I look at the OOM
  # before the worker reruns?", "I can share the result of the retry if
  # you'd like"); so is one with the card or task as its subject, or the job,
  # pod, check or run after "while", "when", "once", "after", "until",
  # "before", "if" or "as"
  # ("should I pull the logs while the job retries?"), but "should I make the
  # job retry?" reds. A question that opens its own clause after a comma
  # ("it'll retry automatically, should I keep an eye on it?") is not about
  # it, nor is a retry noun naming what is offered ("retry status pings?").
  # The question and want-it-retried patterns scan each clause once from its
  # start, so a long line costs linear time; a question mark more than 200
  # characters past the retry word is not read, a second bound.
  - name: the-reply-does-not-offer-the-retry
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '\A(?:(?!result of delegated task |artifact [^\n]* produced by delegated task )[^\n]*\n)*?(?!result of delegated task |artifact [^\n]* produced by delegated task )[^\n]*?(?:(?<![^\n])|(?<=[.!?:;—] )|(?<=—)|(?<=, )(?=(?:but |so |and )?(?:should|shall|want|would|do|does|can|could|may|is|are)\b))(?!(?:(?!, (?:but |so |and )?(?:should|shall|want|would|do|does|can|could|may|is|are)\b)[^.!?;:—\n])*?\b(?:let you know|tell you|update you|ping you|notify you|keep you posted))(?:(?!\b(?<!the )(?<!dispatcher )(?<!worker )(?<!agent )(?<!the card )(?<!the task )(?<!(?:while|after|until) the (?:job|pod|run) )(?<!(?:when|once) the (?:job|pod|run) )(?<!(?:while|after|until) the check )(?<!(?:when|once) the check )(?<!before the (?:job|pod|run) )(?<!(?:if|as) the (?:job|pod|run) )(?<!before the check )(?<!(?:if|as) the check )(?<!on )(?<!next )(?<!this )(?<!that )(?<!its )(?<!while )(?<!when )(?<!after )(?<!until )(?<!once )(?<!before )(?<!during )(?<!''s )(?<!is )(?<!been )(?<!being )(?<!be )(?<!gets )(?<!before it )(?<!until it )(?<!once it )(?<!when it )(?<!after it )(?<!while it )(?<!whether a )(?<!if a )(?:re-?tr(?:y|ies|ied|ying)(?! (?:status|updates?|notifications?|pings?|results?|outcome)\b)|re-?run|rerun|try (?:it |that |this )?again|run (?:it |that |this )?again|(?:another|a new|a fresh|one more) (?:attempt|try|go|shot)|re-?queu|queue (?:it|this|that|another|a)\b|back (?:in|into|on|to) the queue|kick (?:it |that |this )?off|file (?:a|an|another|new)\b(?! (?:new |github |separate |bug )?(?:issue|bug|ticket|report|incident)\b(?! (?:card|task)s?\b)(?![^.!?;\n]{0,60}?\b(?:a|an|another|new|second|separate) (?:new |fresh |issue )*(?:card|task)\b))|filed\b(?! (?:a |an )?(?:new |github |separate |bug )?(?:issue|bug|ticket|report|incident)\b(?! (?:card|task)s?\b)(?![^.!?;\n]{0,60}?\b(?:a|an|another|new|second|separate) (?:new |fresh |issue )*(?:card|task)\b))|re-?dispatch\w*|spin (?:up|off)\b|(?:a |another )?(?:second|parallel|duplicate|separate) (?:card|task|run|worker|check|attempt|one|copy)\b|resubmit\w*|relaunch\w*|start (?:over|a new|another)\b|create (?:a |another )?(?:new |fresh )?(?:card|task)\b|another run\b))(?!, (?:but |so |and )?(?:should|shall|want|would|do|does|can|could|may|is|are)\b)[^.!?;:—\n])*\b(?<!the )(?<!dispatcher )(?<!worker )(?<!agent )(?<!the card )(?<!the task )(?<!(?:while|after|until) the (?:job|pod|run) )(?<!(?:when|once) the (?:job|pod|run) )(?<!(?:while|after|until) the check )(?<!(?:when|once) the check )(?<!before the (?:job|pod|run) )(?<!(?:if|as) the (?:job|pod|run) )(?<!before the check )(?<!(?:if|as) the check )(?<!on )(?<!next )(?<!this )(?<!that )(?<!its )(?<!while )(?<!when )(?<!after )(?<!until )(?<!once )(?<!before )(?<!during )(?<!''s )(?<!is )(?<!been )(?<!being )(?<!be )(?<!gets )(?<!before it )(?<!until it )(?<!once it )(?<!when it )(?<!after it )(?<!while it )(?<!whether a )(?<!if a )(?:re-?tr(?:y|ies|ied|ying)(?! (?:status|updates?|notifications?|pings?|results?|outcome)\b)|re-?run|rerun|try (?:it |that |this )?again|run (?:it |that |this )?again|(?:another|a new|a fresh|one more) (?:attempt|try|go|shot)|re-?queu|queue (?:it|this|that|another|a)\b|back (?:in|into|on|to) the queue|kick (?:it |that |this )?off|file (?:a|an|another|new)\b(?! (?:new |github |separate |bug )?(?:issue|bug|ticket|report|incident)\b(?! (?:card|task)s?\b)(?![^.!?;\n]{0,60}?\b(?:a|an|another|new|second|separate) (?:new |fresh |issue )*(?:card|task)\b))|filed\b(?! (?:a |an )?(?:new |github |separate |bug )?(?:issue|bug|ticket|report|incident)\b(?! (?:card|task)s?\b)(?![^.!?;\n]{0,60}?\b(?:a|an|another|new|second|separate) (?:new |fresh |issue )*(?:card|task)\b))|re-?dispatch\w*|spin (?:up|off)\b|(?:a |another )?(?:second|parallel|duplicate|separate) (?:card|task|run|worker|check|attempt|one|copy)\b|resubmit\w*|relaunch\w*|start (?:over|a new|another)\b|create (?:a |another )?(?:new |fresh )?(?:card|task)\b|another run\b)(?:(?!, (?:but |so |and )?(?:should|shall|want|would|do|does|can|could|may|is|are)\b)[^.!?;:—