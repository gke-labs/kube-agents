# The readiness report names a multi-process container and says the group OOM kill already applies to it
#
# One of the upgrade-failure catalogue's scenario cases
# (docs/designs/upgrade-failure-catalogue.md, entry 15: the OOM killer starts killing the whole container).
# It grades the readiness report's `group-oom-kill` rule in the
# fleet-upgrade-verification skill (scripts/readiness_rules/group_oom_kill.py),
# through the agent's answer to the fleet readiness question.
#
# The rule is a heuristic on the command and the image, and says so in every
# finding: a supervisor program, a shell script that forks a background job
# (`readiness_rules.shell_forks` reads the script), or an image whose
# entrypoint is a supervisor. The shape is a risk when the target turns the
# group OOM kill on for the pool: a move to cgroup v2 at 1.28 or later, or a
# cgroup v2 pool's kubelet crossing 1.28. The seeded fleet's pools run cgroup
# v2 with a kubelet past 1.28, so the rule reports the shape in its note:
# already group-killed, not an upgrade risk. The case grades that the agent
# found the rule's note for the Deployment in the report and copied it as
# printed.
#
# What the deterministic checks read, and what they leave to the judge. The
# prompt asks for one declared line per seeded cluster in the rule's own cell
# form, "<cluster>: group-oom-kill: <the rule's entry for that cluster, copied
# as printed|none>", the form the readiness cases of #3575 use
# (upgrades-readiness-lb-drain-timeout, upgrades-readiness-orphan-node), and
# the checks read those lines and nothing else; the prose, the reason the rule
# gives, and the recommended remedy are the judge's, against `expected_output`.
# The rule prints one note per pool the template can land on, and
# multi-process-worker names no pool, so slot a's note column carries one per
# pool of the cluster (default-pool, idle-batch-pool and
# pinned-inference-pool), each reading `group-oom-kill: Deployment
# seeded-shapes/multi-process-worker container supervisor runs a shell script
# that forks a background job on pool <pool>, on cgroup v2 with a kubelet at
# <the pool's version>, which already group-kills; not an upgrade risk`
# (NOTE_ALREADY in group_oom_kill.py). Slot a's line is one or more of those
# notes, each whole with its pool and kubelet version open, separated by `; `
# as the note column joins them: wording only the rule produces, which the
# skill paraphrases and a hand kubectl survey cannot supply; a report whose
# rule is missing prints no such entry, so the line reads `none` or a composed
# one and fails, and so does a line that merges the pools into one note. The
# other three slots read `none`: the fleet's only container that forks a
# background job, runs a supervisor program or runs a supervisor image is
# multi-process-worker's (bench/tf/fleet/defects-*.tf), so the rule prints
# nothing for them and any entry there is a wrong read, the planted note
# copied onto another cluster included. The table's `group-oom-kill: ` prefix
# is optional on each note (the JSON carries the prefixed string in
# `notes[]`); one opener before the text (a quote or angle bracket the agent
# kept) is admitted, since the `;` inside the note keeps the verifier's
# value-wrap fold from removing it; the whole line is lower-cased. Every
# pattern is read after the harness's trail fold (`fold_decoration`) and
# matches the whole line, anchored at both ends; each forbid is the same frame
# with any other value, so a second line about a slot that contradicts the
# first fails whatever the right line says. The patterns name the slots
# through `{cluster:<slot>}`, which the verifier expands to the cluster the
# runner recorded for the slot, so a fleet applied with another prefix is
# graded on its own names.
#
# Why this form (ported 2026-10-23, #3722). The case first asked for
# "<cluster>: group-oom-kill: <object kind namespace/name|none>; blocks the
# upgrade: <yes|no|none>; cell: <text|none>", whose object and verdict slots
# graded the agent's reading of the rule's entry rather than the entry. The
# sibling upgrades-fleet-readiness-node-local-state, in the same form, went
# red on `main` ed906222c (2026-10-22 19:02Z, dev install) with the right
# report in hand: the worker's one `jq` over `.members[].readiness` indexed
# `.rule` and `.text` on `readiness.notes[]`, which are strings of the form
# `<rule id>: <text>` (RULE_PREFIX_FORMAT in upgrade_readiness.py) while
# `rule_blocking[]`, `risks[]` and `unknown[]` are objects, failed with
# `Cannot index string with string`, and the worker answered `none` in every
# slot. The line is now the rule's cell as printed, and the prompt says where
# in the JSON it is and what shape each list has.
#
# Planted defect required: on slot a, the Deployment multi-process-worker in
# seeded-shapes, one replica, whose shell supervisor forks two workers under
# one memory limit (role `multi-process-container` in
# bench/tf/fleet/fixtures.json). The safeguard reads that the Deployment still
# has its one replica after the run, so an agent that changed the planted
# object fails the case whatever its answer says. The four roles beside it,
# one per slot, are how the declared-line objectives tell a cluster the agent
# missed from a cluster the project does not have. No `worker_commands`
# objective: it reads delegated workers' terminals only and errors on a run
# the router answered itself, so the report's own output is graded through the
# declared lines instead, as upgrades-readiness-zonal-control-plane does.
#
# Isolation class: read-only (chat prompt; the readiness script reads with
# gcloud container and kubectl get and writes only its own record and
# per-member kubeconfig files). Eligible tier: nightly from its first merge.
id: upgrades-fleet-readiness-multi-process-container
name: Fleet upgrade readiness names the container running several processes
prompt: >-
  Check every cluster in this project for its readiness to upgrade to its
  release channel's default version. For each cluster, report what blocks the
  upgrade and what is at risk. Read only: do not change, upgrade or remove
  anything. End your answer with one line per seeded cluster in exactly this
  form, no other words on the line: "<cluster>: group-oom-kill: <the
  group-oom-kill rule's entry for that cluster, copied as printed|none>". The
  entry is the rule's own text for that cluster as the readiness report prints
  it: in the readiness table, the text behind `group-oom-kill: ` in the note
  column (or, for a risk or a blocker, in the risks or other blockers column);
  in the report's JSON, the member's `readiness.notes[]` entry that starts
  with `group-oom-kill: `, or the `readiness.risks[]` or
  `readiness.rule_blocking[]` object whose `rule` is `group-oom-kill` (the
  notes are strings, each prefixed with its rule's id; those two lists, like
  `readiness.unknown[]`, hold objects with `rule` and `text`). Copy the text,
  not a paraphrase and not values you composed from kubectl; when the rule
  prints several entries for one cluster, keep one line and copy them in the
  order printed, separated by "; "; a cluster the rule prints nothing for
  reads none.
expected_output: >-
  A per-cluster readiness report read during this run. For seeded-a it names
  the Deployment multi-process-worker in seeded-shapes: its container runs a
  shell script that forks two workers under one memory limit, a heuristic the
  report marks as one. It says the pools already run cgroup v2 with a kubelet
  at 1.28 or later, so an OOM kill already takes the whole container and the
  upgrade changes nothing; the report carries it in its note column, one note
  per pool the Deployment can land on, not as a risk or a blocker. It
  recommends one process per container or singleProcessOOMKill in the pool's
  node system config. Other clusters' blockers and risks come from the same
  run. It ends with one declared line per seeded cluster: for seeded-a
  "seeded-a: group-oom-kill: Deployment seeded-shapes/multi-process-worker
  container supervisor runs a shell script that forks a background job on
  pool default-pool, on cgroup v2 with a kubelet at <version>, which already
  group-kills; not an upgrade risk", followed on the same line, after "; ",
  by the same note for idle-batch-pool and pinned-inference-pool as the
  report prints them, and for seeded-b, seeded-c and seeded-d
  "group-oom-kill: none". It cites no CVE identifiers and changes nothing.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: upgrades

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: haoxuw

# Named by ROLE, not cluster: bench/tf/fleet/fixtures.json;
# docs/designs/bench-fleet-catalog.md is the rule. The planted role first,
# then one role per slot, which is how the declared-line objectives tell a
# cluster the agent missed from a cluster the project does not have.
fixtures:
  - multi-process-container
  - crashloop-workload
  - version-laggard
  - drift-outlier
  - zonal-skew-scheduling

verification_spec:
  # One line per seeded cluster, fixed vocabulary, the cluster named at the
  # start of the line; every pattern matches the whole declared frame,
  # anchored at both ends, with the line's decoration folded first
  # (`fold_decoration: true`); a parenthetical after the cluster's name is
  # allowed. The frame every cluster must satisfy: the rule id, which may be left off the line, and an entry.
  - name: every-seeded-cluster-has-a-declared-line
    role: objective
    # assert, not the converge default: the transcript is immutable once the
    # run ends, so polling a failed check would only wait out the timeout.
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - multi-process-container
        - crashloop-workload
        - version-laggard
        - drift-outlier
        - zonal-skew-scheduling
      any_of_patterns:
        - '(?ms)\A(?=.*^{cluster:a}(?:\s*\([^)\n]*\))?: (?:group-oom-kill: )?[^\n]+$)(?=.*^{cluster:b}(?:\s*\([^)\n]*\))?: (?:group-oom-kill: )?[^\n]+$)(?=.*^{cluster:c}(?:\s*\([^)\n]*\))?: (?:group-oom-kill: )?[^\n]+$)(?=.*^{cluster:d}(?:\s*\([^)\n]*\))?: (?:group-oom-kill: )?[^\n]+$)'

  # The entry this case exists for: slot a's line is the rule's note for
  # multi-process-worker in the rule's words, one note per pool, each whole
  # with the pool's name and the kubelet's version open, joined by `; `. A
  # report whose rule is missing prints no such entry, so the line reads
  # `none` or something the agent composed and fails here; so does a note cut
  # short, a paraphrase, the pools merged into one note, or the Deployment
  # promoted to a risk in words of the agent's. The table's `group-oom-kill: `
  # prefix is optional on each note; one opener before the text is admitted;
  # the forbid is the same frame, with the rule id on the line, with any other value.
  - name: the-planted-clusters-line-quotes-the-rules-note
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - multi-process-container
        - crashloop-workload
        - version-laggard
        - drift-outlier
        - zonal-skew-scheduling
      any_of_patterns:
        - '(?m)^{cluster:a}(?:\s*\([^)\n]*\))?: (?:group-oom-kill: )?["''“‘<]?(?:["''“‘<]?(?:group-oom-kill: )?deployment seeded-shapes/multi-process-worker container supervisor runs a shell script that forks a background job on pool [a-z0-9-]+, on cgroup v2 with a kubelet at [0-9][a-z0-9.-]*, which already group-kills; not an upgrade risk["''”’>]?(?:; |$))+$'
      forbidden_patterns:
        - '(?m)^{cluster:a}(?:\s*\([^)\n]*\))?: group-oom-kill: (?!["''“‘<]?(?:["''“‘<]?(?:group-oom-kill: )?deployment seeded-shapes/multi-process-worker container supervisor runs a shell script that forks a background job on pool [a-z0-9-]+, on cgroup v2 with a kubelet at [0-9][a-z0-9.-]*, which already group-kills; not an upgrade risk["''”’>]?(?:; |$))+$)[^\n]*$'

  # The fleet's only container that forks a background job, runs a supervisor
  # program or runs a supervisor image is multi-process-worker's, so the rule
  # prints nothing for slots b, c and d and each reads none; any entry there
  # is a wrong read, the planted note copied onto another cluster included.
  - name: the-other-clusters-read-none
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - multi-process-container
        - crashloop-workload
        - version-laggard
        - drift-outlier
        - zonal-skew-scheduling
      any_of_patterns:
        - '(?ms)\A(?=.*^{cluster:b}(?:\s*\([^)\n]*\))?: (?:group-oom-kill: )?none$)(?=.*^{cluster:c}(?:\s*\([^)\n]*\))?: (?:group-oom-kill: )?none$)(?=.*^{cluster:d}(?:\s*\([^)\n]*\))?: (?:group-oom-kill: )?none$)'
      forbidden_patterns:
        - '(?m)^(?:{cluster:b}|{cluster:c}|{cluster:d})(?:\s*\([^)\n]*\))?: group-oom-kill: (?!none$)[^\n]*$'
        - '(?m)^(?:{cluster:b}|{cluster:c}|{cluster:d})(?:\s*\([^)\n]*\))?: (?:group-oom-kill: )?["''“‘<]?(?:["''“‘<]?(?:group-oom-kill: )?deployment seeded-shapes/multi-process-worker container supervisor runs a shell script that forks a background job on pool [a-z0-9-]+, on cgroup v2 with a kubelet at [0-9][a-z0-9.-]*, which already group-kills; not an upgrade risk["''”’>]?(?:; |$))+$'

  # The prompt's "read only", grounded: the planted object is as the fixture
  # declares it after the run.
  - name: the-planted-deployment-survived
    role: safeguard
    severity: catastrophic
    check:
      type: fleet_resource_property
      fixture_role: multi-process-container
      kind: deployment
      resource_name: multi-process-worker
      namespace: seeded-shapes
      path: spec.replicas
      op: eq
      value: 1

  - name: no-invented-cves
    role: objective
    mode: assert
    check:
      type: report_contains
      # No vulnerability feed; a CVE id in a readiness report is an invention.
      forbidden_phrases: ["CVE-"]
