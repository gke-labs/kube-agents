# Domain: fleet audits. Journey: a fresh install runs its onboarding discovery,
# the gate hands one survey card to each Cluster Agent instead of auditing
# every cluster from the Platform Agent's own seat, and once those cards settle
# the gate's hand-off writes the raw report and files the ranking card. One stack run grades both halves: stack cases run one at a time in the
# nightly, so a second case for the hand-off would cost a second re-armed sweep.
#
# The sweep is not started by a conversation. The `bootstrap-inventory-scan`
# cron job on the Planning Agent's profile files it once per install, together
# with one audit card per Cluster Agent. Nothing a chat prompt says reaches that
# path, so the prompt below only reads the board; the grade comes from the
# stack and the verifiers.
#
# bench/tf/prebuilt/bootstrap-discovery re-arms the gate, waits for the cron
# job to file a new sweep card, and returns once a card keyed
# `bootstrap-inventory-prioritize` and filed by the hand-off is on the board, or once
# the sweep and every Cluster Agent card filed for it have stayed in a final
# status for the stack's `settle_hold` (120s) without one, or at its
# `handoff_wait` (1800s). That settle rule is looser than the hand-off's own
# on purpose: a blocked sweep, which the hand-off waits on, ends the wait here
# and fails `ranking-card-keyed`, as does every cluster card archived, which
# the hand-off treats as cancelling the sweep.
# The apply fails if no worker has picked the sweep up by `run_wait` (900s) or
# no read of the board has succeeded. The fan-out objective compares the
# cluster cards filed for the sweep against the Cluster Agent roster, read
# straight from the profiles on the agent's disk rather than through the gate,
# so a build whose gate reads no roster fails here instead of erroring. The hand-off
# objectives parse the sandbox's raw report with the sandbox's own
# agents/platform/scripts/inventory_findings.py, and read the board for the
# keyed ranking card. The re-arm runbook in
# agents/chat/defaults/plugins/bootstrap_onboarding/README.md §5 says why
# re-arming archives the previous sweep's cards first.
#
# The stack refuses an install where a person has connected: a fresh sweep
# there ends in an onboarding report sent to their chat. It also refuses one
# whose `bootstrap-inventory-scan` job is missing or paused, where nothing
# would file the sweep.
#
# Isolation class: read-only on the cluster; it re-files the onboarding sweep
# on the install under test, and the destroy archives every
# `bootstrap-inventory-*` card. Eligible tier: nightly -- the fan-out's cards take dispatcher slots
# that other cases' cards running at the same time would use.
---
id: bootstrap-discovery-fanout
name: Onboarding files one survey card per Cluster Agent and its hand-off reaches ranking

# No seeded-fleet dependency: the roster is whatever Cluster Agents the install
# under test has, and the verifier reads it from there.
fixtures: []

infrastructure:
  deployer: "tofu"
  provider: "gcp"
  stack: "prebuilt/bootstrap-discovery"
  teardown: true
  # host_cluster_* arrive from the environment (TF_VAR_host_cluster_name /
  # TF_VAR_host_cluster_location, exported by hack/ci-eval-pr.sh), because they
  # name the install the runner deployed and no task may choose a different
  # one. The stack defaults everything else.

validated: false

# Slug per docs/designs/domains.yaml: the sweep is the fleet-wide audit that
# delegates to workers, run once at onboarding rather than on a schedule.
domain: fleet-audits

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: maintainers

# A board read that leaves the sweep alone. The session this prompt reaches is
# the Platform Agent's API session, not the worker running the sweep, and it
# must not start, retry or complete any of the sweep's cards: the verifiers
# read which cards were filed for the sweep, and a card this session filed or
# moved would be graded as the gate's. The status filter on kanban_list is the
# one autoops-warning-event-triage measured: a bare call pages oldest-first
# and misses the newest card.
prompt: |
  The onboarding discovery sweep for this install was filed a few minutes ago
  as a kanban card with idempotency key 'bootstrap-inventory-scan'.

  1. Find it. Call kanban_list separately for status 'running', 'blocked',
     'todo' and 'done'. Do not call kanban_list without a status filter -- it
     returns the oldest tasks first and stops at a page.
  2. Report its id and status, and for each card keyed
     'bootstrap-inventory-cluster-*' filed after it, that card's id, assignee
     and status.
  3. Say whether a card with idempotency key 'bootstrap-inventory-prioritize'
     is on the board, with its id and status.

  Only read the board. Do not start, retry, unblock, archive, complete or
  create any card, write no files, and make no changes to the cluster.
expected_output: |
  critical requirements:
  - The reply names the discovery sweep card, lists the cluster cards filed with
    their assignees and statuses, and says whether the prioritization card is
    on the board, read off the kanban board.
  - No card is created, moved or archived, no file is written, and nothing is
    changed on the cluster.

verification_spec:
  # The bootstrap_fanout entries read the board and the profiles on the agent's
  # disk (kube_agents_bench/discovery.py), not the transcript.

  - name: one-card-per-cluster-agent
    role: objective
    check:
      type: bootstrap_fanout
      require: one_card_per_cluster_agent

  # Reads INVENTORY.raw.md on the shell sandbox and the board on the agent pod
  # (kube_agents_bench/onboarding.py), not the transcript.
  - name: raw-report-has-findings-block
    role: objective
    check:
      type: bootstrap_handoff
      require: raw_report_has_findings_block

  # The prioritization stage's card is found by this key; one filed without
  # it is a second card the next sweep's hand-off would not deduplicate.
  - name: ranking-card-keyed
    role: objective
    check:
      type: bootstrap_handoff
      require: ranking_card_filed
