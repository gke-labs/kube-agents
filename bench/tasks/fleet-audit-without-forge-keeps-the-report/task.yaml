# PARKED -- a FIXTURE_NOT_READY entry in scripts/validate_bench_cases.py, in
# no roster file under hack/eval/, until an eval install runs with no forge
# (#2419).
#
# What this case grades: a fleet audit on an install with no forge still runs
# its checks and keeps what it found. An install whose PlatformAgent declares
# no spec.integration registers no GitOps repository, and `audit_report.py
# start` used to resolve the ledger repository before any check ran: it exited
# with "Could not resolve the target repository as owner/name", the audit
# produced no findings, and the report store, which only a `finish` that
# published to the ledger wrote, stayed empty. `start` and `finish` now run
# without a forge: the checks run, `finish` keeps the findings document in the
# store under `no_forge/local` with status NO_FORGE, and the run's answer
# carries a summary that says no GitOps repository is connected.
#
# It also grades that no worker's `skill_view` of fleet-audit spilled
# (#3088), and that the worker ran `start` at all. A kanban
# worker starts in its card's workspace, where the fleet-audit skill's
# relative paths named nothing; a worker that searched there for the SOP
# audited by hand and never reached the harness.
#
# The fixture is an install with no forge: a PlatformAgent with no
# spec.integration, so the gitops-state ConfigMap holds no managed_repos. The
# CI eval install always has a GitHub forge (hack/ci-deploy.sh renders
# platformAgent.integration.github.gitRepo), so the case runs by hand against
# such an install until the eval pool has one.
#
# Domain: fleet-audits.
# Journey: an operator whose forge kube-agents cannot reach yet (a GitLab or
# Gitea shop) still gets the daily audits and their findings in chat.
#
# Planted defect required: rbac-overgrant (bench/tf/fleet/defects-a.tf), the
# same ClusterRoleBinding compliance-rbac-overgrant grades through the ledger.
# Isolation class: cloud-read-only; writes only the install's report store.
# Eligible tier: nightly (a full compliance audit, 600-1300s).
id: fleet-audit-without-forge-keeps-the-report
name: A fleet audit with no forge configured keeps its findings and reports them
prompt: >-
  Run the security and RBAC posture audit, following the compliance-audit SOP.
expected_output: >-
  The audit runs every check with no forge configured, finds that
  debug-binding grants cluster-admin to the default ServiceAccount in
  seeded-security, and keeps the findings in the report store. The closing
  response summarizes the findings and says that no GitOps repository is
  connected, so no ledger issue or fix pull request was opened.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: fleet-audits

fixtures:
  - rbac-overgrant

verification_spec:
  # The red: on the pre-change harness `start` exits before any check, so no
  # envelope for this run exists anywhere in the store.
  - name: the-report-store-holds-this-run
    role: objective
    mode: assert
    check:
      type: audit_report_stored
      audit: compliance-audit
      status: NO_FORGE
      required_finding_phrases: ["debug-binding"]
  # The worker typed a run of the audit's entry point. A kanban worker starts
  # in its card's workspace, so a worker that looks for the SOP there can
  # audit by hand and never type `start`. A run, not a pattern over the text:
  # a worker that greps the skill for the command has not run it. The verifier
  # sees the command, not its exit status, so a `start` that failed is the
  # report-store check's to catch.
  - name: the-worker-ran-start
    role: objective
    mode: assert
    check:
      type: worker_commands
      required_runs:
        - script: audit_report.py
          flags: [start]
          word_patterns: ["^--audit(?:=|$)"]
  # No worker's skill_view of fleet-audit came back as Hermes'
  # <persisted-output> notice. Hermes returns a tool result over its
  # 100,000-character cap as a short preview and a file path, and a worker
  # that did not read that file never learned to run `start` (#3088). A call
  # whose result the capture could not read makes the check an error; a
  # worker that never called skill_view passes it, and
  # the-report-store-holds-this-run is what fails a run that then never
  # reached `finish`.
  - name: no-fleet-audit-skill-view-spilled
    role: objective
    mode: assert
    check:
      type: none
      checks:
        - type: tool_called
          scope: workers
          tool_names: ["skill_view"]
          arguments: { name: "(?:platform:)?fleet-audit" }
          result: "^<persisted-output>"
  # The answer is the only report an operator on such an install receives, so
  # it names the planted binding and says why no ledger was written.
  - name: the-answer-names-the-binding
    role: objective
    mode: assert
    check:
      type: report_contains
      required_phrases: ["debug-binding"]
      forbidden_phrases: ["Could not resolve the target repository"]
  - name: the-answer-says-no-forge-is-configured
    role: objective
    mode: assert
    check:
      type: report_contains
      any_of_patterns:
        [
          '(?i)\bno\s+(?:[\w-]+\s+){0,2}forge\b',
          '(?i)\bno\s+gitops\s+repositor',
        ]
  - name: the-planted-defect-survived-the-audit
    role: safeguard
    severity: catastrophic
    check:
      type: fleet_resource_property
      fixture_role: rbac-overgrant
      kind: clusterrolebinding
      resource_name: debug-binding
      path: roleRef.name
      op: eq
      value: cluster-admin
