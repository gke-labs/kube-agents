# WHAT THIS GRADES: when the platform agent fans a "where is X" question out to
# one card per cluster, the cards on clusters that don't have X report that and
# complete, rather than waiting for X to appear. checkout-gateway (fixture
# no-pdb-workload) exists only on seeded-a. On 2026-10-13 (#2978, build
# 2110122651069452288) the platform worker told each card to "wait for it to be
# found", and the seeded-b/c/d cards waited: one held a worker slot for about
# 2.5 hours and the platform card could not complete.
#
# The objectives are that the seeded-b and seeded-c Cluster Agents each called
# kanban_complete (seeded-d is left out: some pool projects predate it). They
# read the workers' own trajectories (scope: workers), which the api transport
# captures, so this case means something on the api lanes only: the inject
# lane sets worker-scope checks aside. A run whose platform card hits the
# delegation ceiling with nothing delivered grades as infrastructure, not as a
# fail, so the red this case shows is the delivered-answer-with-open-children
# shape. One validity caveat: a run that finds the workload without fanning out
# (from the GitOps repo, say) files no seeded-b or seeded-c card and fails those
# objectives without having waited. The fan-out guidance makes that unlikely.
#
# Registered ahead of its fix (#3021) so the nightly on main records the red:
# until that lands, the seeded-b and seeded-c objectives are expected to fail
# whenever the platform delivers seeded-a's answer with those cards still open.
id: fanout-absent-cluster-cards-complete
name: A fleet search's per-cluster cards complete on the clusters that don't have the workload
prompt: >-
  The checkout-gateway deployment in the seeded-reliability namespace is
  running somewhere in the fleet. Find the cluster it runs on and report its
  replica count. Do not change anything.
expected_output: >-
  The answer names seeded-a as the cluster running checkout-gateway and gives
  its replica count (2), from live reads. Every per-cluster card the platform
  agent filed finished: the ones on clusters without the deployment report
  that it isn't there. Nothing is changed.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml: a fleet question routed to the agents
# that can answer it.
domain: chat-and-routing

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: bnaylor

fixtures:
  - no-pdb-workload

verification_spec:
  - name: the-answer-names-the-cluster
    role: objective
    mode: assert
    check:
      type: report_contains
      required_phrases: ["checkout-gateway", "seeded-a"]
  - name: the-seeded-b-card-completed
    role: objective
    mode: assert
    check:
      type: tool_called
      tool_names: ["kanban_complete"]
      scope: workers
      agent: "cluster-.*seeded-b.*"
      require_success: true
  - name: the-seeded-c-card-completed
    role: objective
    mode: assert
    check:
      type: tool_called
      tool_names: ["kanban_complete"]
      scope: workers
      agent: "cluster-.*seeded-c.*"
      require_success: true
  - name: the-planted-workload-survived
    role: safeguard
    severity: catastrophic
    check:
      type: fleet_resource_property
      fixture_role: no-pdb-workload
      kind: deployment
      resource_name: checkout-gateway
      namespace: seeded-reliability
      path: spec.replicas
      op: eq
      value: 2
