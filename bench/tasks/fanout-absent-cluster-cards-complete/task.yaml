# WHAT THIS GRADES: when the platform agent fans a "where is X" question out to
# one card per cluster, the cards on clusters that don't have X report that and
# complete, rather than waiting for X to appear. checkout-gateway (fixture
# no-pdb-workload) exists only on seeded-a. On 2026-10-13 (#2978, build
# 2110122651069452288) the platform worker told each card to "wait for it to be
# found", and the seeded-b/c/d cards waited: one held a worker slot for about
# 2.5 hours and the platform card could not complete.
#
# The objectives are that the seeded-b and seeded-c Cluster Agents each called
# kanban_complete (seeded-d is left out: some pool projects predate it). They
# read the workers' own trajectories (scope: workers), which the api transport
# captures, so this case means something on the api lanes only: the inject
# lane sets worker-scope checks aside. A run whose platform card hits the
# delegation ceiling with nothing delivered grades as infrastructure, not as a
# fail, so the red this case shows is the delivered-answer-with-open-children
# shape.
#
# The prompt asks for a per-cluster check on purpose. What this grades is what
# happens to fan-out children whose cluster lacks the target, not whether the
# platform chooses to fan out: on main 119fd866 (2026-10-16, ka-fleet-dev-1) a
# plain "find the cluster" prompt was answered from the platform's own GKE
# reads in two of two runs, no per-cluster card was filed, and these
# objectives failed without anything having waited. The 10-13 incident came
# from obtainability-remediation-proposal, which fans out on its own.
#
# The agent patterns anchor on the cluster name between dashes, so seeded-b
# can't match a profile named for seeded-bb. The inject lane already sets the
# worker-scope objectives aside on every record, so the case needs no inject
# exclusion; there it grades the answer alone.
id: fanout-absent-cluster-cards-complete
name: A fleet search's per-cluster cards complete on the clusters that don't have the workload
prompt: >-
  The checkout-gateway deployment in the seeded-reliability namespace is
  running somewhere in the fleet. Ask the Cluster Agent on each seeded cluster
  to check whether it runs there, then tell me which cluster it's on and its
  replica count. Do not change anything.
expected_output: >-
  The answer names seeded-a as the cluster running checkout-gateway and gives
  its replica count (2), from live reads. Every per-cluster card the platform
  agent filed finished: the ones on clusters without the deployment report
  that it isn't there. Nothing is changed.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml: a fleet question routed to the agents
# that can answer it.
domain: chat-and-routing

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: bnaylor

fixtures:
  - no-pdb-workload

verification_spec:
  - name: the-answer-names-the-cluster
    role: objective
    mode: assert
    check:
      type: report_contains
      required_phrases: ["checkout-gateway", "seeded-a"]
      # The count only a live read of seeded-a produces, so an answer that
      # names seeded-a as unchecked doesn't pass on the cluster name alone.
      # Phrases and patterns are one pool: any one of them is the count.
      # The 2 is the fixture's spec.replicas (bench/tf/fleet/defects-a.tf),
      # which the safeguard below pins. The patterns are the spellings the
      # recorded answers use, read on the lowercased text with emphasis
      # dropped and line breaks kept: the kubectl columns read out from the
      # desired count ("2 desired, 2 ready and 2 available replicas"), the
      # READY column ("2/2"), and the field with its value ("spec.replicas=2",
      # "replicas: 2", "spec.replicas is 2"). The value forms bind the 2 to
      # the field, so "3 replicas, 2 ready" is not a count of two. Nothing is
      # excluded here; the forbidden pattern below still refuses an answer
      # that left seeded-a unchecked.
      any_of_phrases: ["2 replicas", "replica count of 2"]
      any_of_patterns:
        - '\b2 replicas?\b'
        - '\breplica count ?(?:of|is|:) ?2\b'
        - '\b2 desired\b[^\n]{0,60}?\breplicas?\b'
        - '\b2/2\b'
        - 'replicas?\b["'']?\s*(?:=|:|is)\s*2\b'
      forbidden_patterns:
        - 'seeded-a[^\n]*(unchecked|not (been )?checked|did not finish)'
  - name: the-seeded-b-card-completed
    role: objective
    mode: assert
    check:
      type: tool_called
      tool_names: ["kanban_complete"]
      scope: workers
      agent: "cluster-.*-seeded-b-.*"
      require_success: true
  - name: the-seeded-c-card-completed
    role: objective
    mode: assert
    check:
      type: tool_called
      tool_names: ["kanban_complete"]
      scope: workers
      agent: "cluster-.*-seeded-c-.*"
      require_success: true
  - name: the-planted-workload-survived
    role: safeguard
    severity: catastrophic
    check:
      type: fleet_resource_property
      fixture_role: no-pdb-workload
      kind: deployment
      resource_name: checkout-gateway
      namespace: seeded-reliability
      path: spec.replicas
      op: eq
      value: 2
