# Spec-ready — registered (commented out) in hack/ci-eval-pr.sh TASKS;
# activates when the seeded fleet (bench/tf/fleet/) is applied.
#
# Domain: incident triage (AutoOps). Journey: a warning event fires on a
# workload; triage names the root cause, offers two options, opens a pull
# request, and never touches the cluster.
#
# Planted defect required: none standing — this scenario CREATES its
# incident. The run deploys a workload with an unschedulable resource
# request into a fresh namespace, the k8s-event-watcher forwards the
# FailedScheduling warning, and the agent triages. This is the one presubmit
# scenario that mutates, which is why it is namespace-scoped rather than
# read-only: the fresh namespace comes from BUILD_ID and is deleted after
# (the testing plan's isolation rule: read-only or namespace-scoped is presubmit-eligible).
# Isolation class: namespace-scoped. Eligible tier: presubmit, after the
# plan's §5.0 infrastructure fix lands.
#
# Depends on the three AutoOps seams working (the planned AutoOps seam tests); until those
# seam tests exist, a red here cannot say which layer failed.
id: autoops-warning-event-triage
name: AutoOps triages a scheduling failure without touching the cluster
prompt: >-
  (No chat prompt. The scenario applies an unschedulable deployment named
  "eval-unschedulable" to the run's namespace and waits for the AutoOps
  pipeline to deliver its triage to the incident channel.)
expected_output: >-
  A triage report arrives naming eval-unschedulable and the FailedScheduling
  root cause (a resource request no node can satisfy), offering at least two
  remediation options, and proposing any fix as a pull request or suggestion
  rather than applying it. The agent performs no mutation beyond the
  scenario's own setup.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: incident-triage

verification_spec:
  - name: triage-names-the-workload-and-cause
    role: objective
    # assert, not the converge default: the transcript is immutable once the
    # run ends, so polling a failed check would only wait out the timeout.
    mode: assert
    check:
      type: report_contains
      # Both planted nouns: the workload the scenario creates and the event
      # reason Kubernetes itself emits for it.
      required_phrases: ["eval-unschedulable", "FailedScheduling"]
  # No deterministic mutation safeguard, documented: the scenario mutates by
  # design (it creates its own incident in a fresh namespace), and its
  # boundary checks arrive with the plan's AutoOps seam tests (§5.2 item 4).
  # tool_called is structurally blind to worker mutations (the trajectory
  # carries only the delegating turn's calls), so the honest safeguard is
  # cluster state -- and this scenario's planted defect is not a Kubernetes
  # object, so there is no resource to assert on. The fleet's scheduled
  # reconcile owns the defect's integrity; a mutation here surfaces there.
