# Pure Q&A probe for managed Cloud Service Mesh (ASM) release-channel downgrade
# risk (#2797, #7181): switching a GKE cluster's managed mesh channel directly
# from a newer channel (rapid, serving Istio 1.24 with sidecars injected at
# 1.24) to an older channel (stable, serving Istio 1.22) downgrades the managed
# control plane below the running sidecar proxies, creating unsupported
# sidecar-ahead-of-control-plane version skew and risking Envoy xDS NACK
# rejection loops.
#
# The objective grades the requested verdict line (VERDICT:
# BLOCK-CHANNEL-DOWNGRADE) and forbids the opposite verdict line (VERDICT:
# SAFE-TO-SWITCH), while also requiring the explanation to name the downgrade
# outside the verdict token itself and at least one of the sidecar, NACK, or
# xDS skew/mismatch terms. The verifier lowercases the report, strips emphasis
# and backticks, and with fold_decoration folds list markers, quotes, headings,
# and trailing stops before running the patterns;
# bench/tests/test_upgrades_managed_mesh_channel_downgrade_guard_verdict.py
# pins both passing and failing report shapes.
#
# Planted defect required: none. deployer: noop, no fixture, no cluster read.
#
# Isolation class: read-only (no cluster touched at all).
# Tier: nightly (hack/eval/nightly-cases.txt).
id: upgrades-managed-mesh-channel-downgrade-guard
name: Switching managed Cloud Service Mesh from rapid (1.24) to stable (1.22) is blocked to prevent control-plane downgrade, sidecar skew, and Envoy NACK loops

domain: upgrades

prompt: >-
  A production GKE cluster running managed Cloud Service Mesh (ASM) is
  currently on the rapid mesh release channel (revision asm-managed-rapid,
  Istio 1.24) with workload sidecars injected at 1.24. To standardize fleet
  channels, a team proposes switching the cluster's managed mesh channel
  directly to stable (currently serving 1.22) in one change. Is this safe to
  apply immediately, and what happens to the mesh control plane and existing
  workloads if we switch the channel? Start your answer with VERDICT:
  BLOCK-CHANNEL-DOWNGRADE or VERDICT: SAFE-TO-SWITCH. Do not change anything.
expected_output: >-
  VERDICT: BLOCK-CHANNEL-DOWNGRADE. Switching the managed Cloud Service Mesh
  channel directly from rapid (Istio 1.24) to stable (Istio 1.22) downgrades
  the managed mesh control plane to 1.22 while existing workload sidecars
  remain injected at 1.24. Running 1.24 Envoy sidecar proxies against an older
  1.22 control plane creates unsupported sidecar-ahead-of-control-plane
  version skew and risks xDS configuration mismatch or Envoy NACK rejection
  loops. Instead, hold the channel switch until stable reaches at least 1.24
  or migrate workloads through a coordinated canary revision transition.
infrastructure:
  deployer: noop
validated: false

verification_spec:
  - name: the-verdict-blocks-the-channel-downgrade-and-names-the-skew-risk
    role: objective
    mode: assert
    check:
      type: report_contains
      any_of_phrases: ["sidecar", "nack", "xds"]
      required_patterns:
        - "(?m)^verdict:\\s*[\"'\\u201c\\u2018]?block-channel-downgrade[\"'\\u201d\\u2019]?(?:$|[.:;\\u2014\\u2013-]\\s+\\S)"
        - "(?<!block-channel-)\\bdowngrad(?:e|es|ed|ing)\\b"
      forbidden_patterns:
        - "(?m)(?:^|[.;]\\s*)verdict:\\s*[\"'\\u201c\\u2018]?safe-to-switch\\b"
        - "(?m)^verdict:\\s*[\"'\\u201c\\u2018]?block-channel-downgrade\\b[^\\n]*(?:(?:\\b(?:or|and)\\b|/)\\s*(?:verdict:\\s*)?[\"'\\u201c\\u2018]?safe-to-switch\\b|\\bis\\s+(?:not|wrong|incorrect|false)\\b)"
      fold_decoration: true
  - name: front-door-stays-out-of-the-worker-verbs
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        # Same delegation-boundary safeguard as knowledge-grounding-sources-probe.
        - type: tool_called
          tool_names: ["kanban_complete", "kanban_block", "kanban_heartbeat"]
  - name: no-worker-spends-an-answer-query-call
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        # The quota-limited Developer Knowledge tool the personas forbid; see
        # knowledge-grounding-sources-probe for why both spellings.
        - type: tool_called
          scope: workers
          tool_names:
            [
              "mcp__developer_knowledge__answer_query",
              "mcp_developer_knowledge_answer_query",
            ]
