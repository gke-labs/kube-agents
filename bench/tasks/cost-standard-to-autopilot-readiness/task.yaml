# Standard-to-Autopilot workload migration readiness probe (#7094, ahead of
# #5734): checks whether the agent identifies workload constraints that block
# migrating a GKE Standard cluster's workloads to GKE Autopilot as-is.
#
# Three workloads are presented in the prompt:
#   1. A stateless web API Deployment with CPU and memory requests (compatible).
#   2. A log-collector DaemonSet mounting /var/log via hostPath with
#      securityContext.privileged: true (blocked: Autopilot rejects privileged
#      containers and hostPath node log mounts).
#   3. A batch Job using hostNetwork: true (blocked: Autopilot rejects pods
#      requesting hostNetwork).
#
# The objective requires the verdict line "VERDICT: MIGRATION-BLOCKED" on a
# line of its own, forbids "VERDICT: MIGRATION-READY" on a line of its own, and
# ties each blocking constraint to its workload on the same line
# (privileged/hostPath on the log-collector DaemonSet, and hostNetwork on the
# batch Job) while forbidding claims that either blocker is allowed on
# Autopilot, that only one workload blocks, or that repeat the prompt. The
# verifier lowercases the report, strips emphasis and code markers, and folds
# line decoration; bench/tests/test_cost_standard_to_autopilot_readiness_verdict.py
# pins passing and failing shapes. The lane appends the catastrophic none-wrapped
# github_writes safeguard (hack/eval/inject-lane-safeguards.yaml) on every CI
# run.
#
# Planted defect required: none. deployer: noop, no fixture, no cluster read.
#
# Isolation class: read-only (no cluster touched at all).
# Tier: nightly (hack/eval/nightly-cases.txt).
id: cost-standard-to-autopilot-readiness
name: Standard-to-Autopilot readiness probe flags privileged hostPath DaemonSet and hostNetwork batch Job as migration blockers

owner: Fuxiao-Gao
domain: cost

prompt: >-
  We want to migrate a GKE Standard cluster to GKE Autopilot to reduce
  node-management overhead. The cluster runs three workloads: (1) a stateless
  web API Deployment with CPU/memory requests, (2) a log-collector DaemonSet
  mounting `/var/log` via `hostPath` with `securityContext.privileged: true`,
  and (3) a batch Job using `hostNetwork: true`. Can we migrate these workloads
  to Autopilot as-is? Start your answer with exactly one line:
  `VERDICT: MIGRATION-BLOCKED` or `VERDICT: MIGRATION-READY`, then name each
  blocking workload and the specific constraint that blocks it. Do not change
  anything.
expected_output: >-
  VERDICT: MIGRATION-BLOCKED. The stateless web API Deployment with CPU and
  memory requests can run on GKE Autopilot as-is. Two workloads block an as-is
  migration: (1) the log-collector DaemonSet is rejected by Autopilot because
  securityContext.privileged: true and hostPath volume mounts (/var/log) are
  disallowed on Autopilot (replace node-level log collection with GKE's built-in
  Cloud Logging pipeline); and (2) the batch Job is rejected because
  hostNetwork: true is disallowed on Autopilot workloads.
infrastructure:
  deployer: noop
validated: false

verification_spec:
  - name: the-verdict-is-migration-blocked-and-names-both-blockers
    role: objective
    mode: assert
    check:
      type: report_contains
      any_of_patterns: ["(?m)^\\W*verdict:\\s*migration-blocked\\b"]
      forbidden_patterns:
        - "(?m)^\\W*verdict:\\s*migration-ready\\b"
        - "\\b(?:host[-\\s]?network(?:ing)?|privileged|host[-\\s]?path|daemon\\s*set|log[-\\s]?collector|(?:batch\\s+)?job)\\b(?:(?!\\b(?:not|no|never|neither|nor|cannot|can't|won't|disallow(?:ed|s)?|reject(?:ed|s)?|block(?:ed|s|ing)?|unsupported|incompatible|forbid(?:den|s)?|prohibit(?:ed|s)?)\\b|,\\s*(?:(?:while|whereas|but)\\s+)?(?:only\\s+)?(?:(?:the|a|an|this|our)\\s+)?(?:(?:(?:stateless|web\\s+api)\\s+)*deployment|(?:stateless\\s+)?web\\s+api(?!\\s+deployment\\b))\\b(?!(?:\\s+with\\s+cpu(?:[/\\s]+(?:and\\s+)?memory)?\\s+requests?)?,?\\s*(?:and|or|as\\s+well\\s+as|along\\s+with|together\\s+with)\\b)(?=(?![^,\\n;]*,)[^.\\n;]*\\b(?:is\\s+(?:allowed|supported|compatible|permitted|fine|ok|acceptable|not\\s+(?:a\\s+)?block(?:er|ers|ed|ing))|allowed\\s+on\\s+autopilot|supported\\s+on\\s+autopilot|compatible\\s+with\\s+autopilot|can\\s+(?:run|migrate|be\\s+migrated)|does\\s+not\\s+block|doesn't\\s+block|isn't\\s+(?:a\\s+)?block(?:er|ers|ed|ing)|has\\s+no\\s+(?:autopilot\\s+)?(?:issues?|blockers?|problems?|restrictions?|incompatibilit(?:y|ies)))\\b))[^.\\n;])*?\\b(?:(?:is|are)\\s+(?:allowed|supported|compatible|permitted|fine|ok|acceptable)|allowed\\s+on\\s+autopilot|supported\\s+on\\s+autopilot|compatible\\s+with\\s+autopilot|can\\s+(?:run|migrate|be\\s+migrated)|(?:does|do)\\s+not\\s+block|(?:doesn't|don't)\\s+block|(?:is|are)\\s+not\\s+(?:a\\s+)?block(?:er|ers|ed|ing)|(?:isn't|aren't)\\s+(?:a\\s+)?block(?:er|ers|ed|ing)|(?:has|have)\\s+no\\s+(?:autopilot\\s+)?(?:issues?|blockers?|problems?|restrictions?|incompatibilit(?:y|ies)))\\b"
        - "\\b(?:host[-\\s]?network(?:ing)?|privileged|host[-\\s]?path|daemon\\s*set|log[-\\s]?collector|(?:batch\\s+)?job)\\b(?:(?!\\b(?:not|no|never|neither|nor|cannot|can't|won't|disallow(?:ed|s)?|reject(?:ed|s)?|block(?:ed|s|ing)?|unsupported|incompatible|forbid(?:den|s)?|prohibit(?:ed|s)?)\\b)[^.\\n;])*?,\\s*(?:and|or|as\\s+well\\s+as|along\\s+with|together\\s+with)\\s+(?:(?:the|a|an|this|our)\\s+)?(?:(?:(?:stateless|web\\s+api)\\s+)*deployment|(?:stateless\\s+)?web\\s+api)\\b[^.\\n;]*?\\b(?:(?:is|are)\\s+(?:allowed|supported|compatible|permitted|fine|ok|acceptable)|allowed\\s+on\\s+autopilot|supported\\s+on\\s+autopilot|compatible\\s+with\\s+autopilot|can\\s+(?:run|migrate|be\\s+migrated)|(?:does|do)\\s+not\\s+block|(?:doesn't|don't)\\s+block|(?:is|are)\\s+not\\s+(?:a\\s+)?block(?:er|ers|ed|ing)|(?:isn't|aren't)\\s+(?:a\\s+)?block(?:er|ers|ed|ing)|(?:has|have)\\s+no\\s+(?:autopilot\\s+)?(?:issues?|blockers?|problems?|restrictions?|incompatibilit(?:y|ies)))\\b"
        - "\\bautopilot\\s+(?:allows|supports|permits|accepts)\\s+(?:the\\s+)?(?:host[-\\s]?network(?:ing)?|privileged|host[-\\s]?path|daemon\\s*set|log[-\\s]?collector|(?:batch\\s+)?job)\\b"
        - "\\bonly\\s+(?:the\\s+|one\\s+)?(?:[\\w-]+\\s+){0,2}(?:daemon\\s*set|log[-\\s]?collector|job|workload)\\b[^.\\n]*?\\b(?:blocks?|is\\s+blocked|cannot\\s+migrate|is\\s+rejected|is\\s+disallowed)\\b"
        - "\\b(?:we\\s+want\\s+to\\s+migrate\\s+a\\s+gke\\s+standard\\s+cluster|the\\s+cluster\\s+runs\\s+three\\s+workloads|can\\s+we\\s+migrate\\s+these\\s+workloads|start\\s+your\\s+answer\\s+with\\s+exactly\\s+one\\s+line|verdict:\\s*migration-blocked\\s+(?:or\\s+(?:verdict:\\s*)?migration-ready|is\\s+(?:wrong|incorrect|false|not|ruled\\s+out)))\\b"
      required_patterns:
        - "\\b(?:(?:daemon\\s*set|log[-\\s]?collector)\\b(?:(?!\\b(?:job|host[-\\s]?network(?:ing)?)\\b)[^\\n])*\\b(?:privileged|host[-\\s]?path)|(?:privileged|host[-\\s]?path)\\b(?:(?!\\b(?:job|host[-\\s]?network(?:ing)?)\\b)[^\\n])*\\b(?:daemon\\s*set|log[-\\s]?collector)|(?:daemon\\s*set|log[-\\s]?collector)\\b(?:(?!\\b(?:privileged|host[-\\s]?path|host[-\\s]?network(?:ing)?)\\b)(?:[^.;\\n]|\\.(?=\\w)))*\\bjob\\b(?:(?!\\b(?:daemon\\s*set|log[-\\s]?collector|job|host[-\\s]?network(?:ing)?)\\b)(?:[^.;\\n]|\\.(?=\\w)))*\\b(?:privileged|host[-\\s]?path)\\b(?:(?!\\b(?:daemon\\s*set|log[-\\s]?collector|job)\\b)(?:[^.;\\n]|\\.(?=\\w)))*\\bhost[-\\s]?network(?:ing)?|job\\b(?:(?!\\b(?:privileged|host[-\\s]?path|host[-\\s]?network(?:ing)?)\\b)(?:[^.;\\n]|\\.(?=\\w)))*\\b(?:daemon\\s*set|log[-\\s]?collector)\\b(?:(?!\\b(?:daemon\\s*set|log[-\\s]?collector|job|privileged|host[-\\s]?path)\\b)(?:[^.;\\n]|\\.(?=\\w)))*\\bhost[-\\s]?network(?:ing)?\\b(?:(?!\\b(?:daemon\\s*set|log[-\\s]?collector|job)\\b)(?:[^.;\\n]|\\.(?=\\w)))*\\b(?:privileged|host[-\\s]?path)|(?:privileged|host[-\\s]?path)\\b(?:(?!\\b(?:daemon\\s*set|log[-\\s]?collector|job)\\b)(?:[^.;\\n]|\\.(?=\\w)))*\\bhost[-\\s]?network(?:ing)?\\b(?:(?!\\b(?:job|privileged|host[-\\s]?path|host[-\\s]?network(?:ing)?)\\b)(?:[^.;\\n]|\\.(?=\\w)))*\\b(?:daemon\\s*set|log[-\\s]?collector)\\b(?:(?!\\b(?:privileged|host[-\\s]?path|host[-\\s]?network(?:ing)?)\\b)(?:[^.;\\n]|\\.(?=\\w)))*\\bjob|host[-\\s]?network(?:ing)?\\b(?:(?!\\b(?:daemon\\s*set|log[-\\s]?collector|job)\\b)(?:[^.;\\n]|\\.(?=\\w)))*\\b(?:privileged|host[-\\s]?path)\\b(?:(?!\\b(?:daemon\\s*set|log[-\\s]?collector|privileged|host[-\\s]?path|host[-\\s]?network(?:ing)?)\\b)(?:[^.;\\n]|\\.(?=\\w)))*\\bjob\\b(?:(?!\\b(?:privileged|host[-\\s]?path|host[-\\s]?network(?:ing)?)\\b)(?:[^.;\\n]|\\.(?=\\w)))*\\b(?:daemon\\s*set|log[-\\s]?collector))\\b"
        - "\\b(?:job\\b(?:(?!\\b(?:daemon\\s*set|log[-\\s]?collector|privileged|host[-\\s]?path)\\b)[^\\n])*\\bhost[-\\s]?network(?:ing)?|host[-\\s]?network(?:ing)?\\b(?:(?!\\b(?:daemon\\s*set|log[-\\s]?collector|privileged|host[-\\s]?path)\\b)[^\\n])*\\bjob|(?:daemon\\s*set|log[-\\s]?collector)\\b(?:(?!\\b(?:privileged|host[-\\s]?path|host[-\\s]?network(?:ing)?)\\b)(?:[^.;\\n]|\\.(?=\\w)))*\\bjob\\b(?:(?!\\b(?:daemon\\s*set|log[-\\s]?collector|job|host[-\\s]?network(?:ing)?)\\b)(?:[^.;\\n]|\\.(?=\\w)))*\\b(?:privileged|host[-\\s]?path)\\b(?:(?!\\b(?:daemon\\s*set|log[-\\s]?collector|job)\\b)(?:[^.;\\n]|\\.(?=\\w)))*\\bhost[-\\s]?network(?:ing)?|job\\b(?:(?!\\b(?:privileged|host[-\\s]?path|host[-\\s]?network(?:ing)?)\\b)(?:[^.;\\n]|\\.(?=\\w)))*\\b(?:daemon\\s*set|log[-\\s]?collector)\\b(?:(?!\\b(?:daemon\\s*set|log[-\\s]?collector|job|privileged|host[-\\s]?path)\\b)(?:[^.;\\n]|\\.(?=\\w)))*\\bhost[-\\s]?network(?:ing)?\\b(?:(?!\\b(?:daemon\\s*set|log[-\\s]?collector|job)\\b)(?:[^.;\\n]|\\.(?=\\w)))*\\b(?:privileged|host[-\\s]?path)|(?:privileged|host[-\\s]?path)\\b(?:(?!\\b(?:daemon\\s*set|log[-\\s]?collector|job)\\b)(?:[^.;\\n]|\\.(?=\\w)))*\\bhost[-\\s]?network(?:ing)?\\b(?:(?!\\b(?:job|privileged|host[-\\s]?path|host[-\\s]?network(?:ing)?)\\b)(?:[^.;\\n]|\\.(?=\\w)))*\\b(?:daemon\\s*set|log[-\\s]?collector)\\b(?:(?!\\b(?:privileged|host[-\\s]?path|host[-\\s]?network(?:ing)?)\\b)(?:[^.;\\n]|\\.(?=\\w)))*\\bjob|host[-\\s]?network(?:ing)?\\b(?:(?!\\b(?:daemon\\s*set|log[-\\s]?collector|job)\\b)(?:[^.;\\n]|\\.(?=\\w)))*\\b(?:privileged|host[-\\s]?path)\\b(?:(?!\\b(?:daemon\\s*set|log[-\\s]?collector|privileged|host[-\\s]?path|host[-\\s]?network(?:ing)?)\\b)(?:[^.;\\n]|\\.(?=\\w)))*\\bjob\\b(?:(?!\\b(?:privileged|host[-\\s]?path|host[-\\s]?network(?:ing)?)\\b)(?:[^.;\\n]|\\.(?=\\w)))*\\b(?:daemon\\s*set|log[-\\s]?collector))\\b"
      fold_decoration: true
  - name: front-door-stays-out-of-the-worker-verbs
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        # Same delegation-boundary safeguard as knowledge-grounding-sources-probe.
        - type: tool_called
          tool_names: ["kanban_complete", "kanban_block", "kanban_heartbeat"]
  - name: no-worker-spends-an-answer-query-call
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        # The quota-limited Developer Knowledge tool the personas forbid; see
        # knowledge-grounding-sources-probe for why both spellings.
        - type: tool_called
          scope: workers
          tool_names:
            [
              "mcp__developer_knowledge__answer_query",
              "mcp_developer_knowledge_answer_query",
            ]
