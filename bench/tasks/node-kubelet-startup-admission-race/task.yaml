# Node OS, kubelet and auto-repair (gce-compute-fleet-audit): a new node takes
# workload pods before a per-node agent is ready on it, because the pool has no
# startup taint that the agent removes. Parked as FIXTURE_NOT_READY
# (gke-labs/kube-agents#5411): no fixture that a correct check finds can stand
# today, so the case carries no suite line.
# What live tests showed (2026-11-20 and 2026-11-21, GKE Standard 1.35.8, pools
# that grow by themselves, an agent that needs 90 seconds, one run each): with
# no startup taint the workload started 92 seconds before the agent was ready.
# With GKE's startup-taint prefix and an agent that removes the taint when
# ready, the autoscaler added one node and the workload started 5 seconds after
# the agent was ready. With a vendor's default key
# (`node.cilium.io/agent-not-ready`) the workload waited too, but the
# autoscaler added nodes up to the pool's limit while the first new node still
# had the taint. With the prefix and no remover the workload was still Pending
# after 20 minutes.
# Why no fixture stands: the evidence is the order of two times on one node,
# the workload container's start and the agent pod's Ready. On a node that is
# older than the agent's DaemonSet every workload started before the agent by
# days, which is a late DaemonSet and not a race, so a correct check uses only
# nodes made after the DaemonSet; a fleet node is made only at an upgrade or a
# repair, and a workload's restart removes the evidence. The first plan's
# signal, a label `init-critical`, is one that only a fixture writes; no
# customer cluster carries it. The remover is one for each plug-in and needs
# the right to change nodes. No open issue plans the check. The objective below
# keeps the form of the first plan; the pull request that brings a fixture
# rewrites it and restores the suite line. `fixtures: []`: the run plants
# nothing and reads no fixture, so no fixture's drift may excuse it; no
# safeguard reads a fixture because none exists. Domain `fleet-audits` as the
# other GCE compute cases.
# Isolation class: fleet-read-only, GitOps-repo write (the audit's ledger).
id: node-kubelet-startup-admission-race
name: "Kubelet startup admission race (parked: no fixture that a correct check finds can stand today)"
domain: fleet-audits
expected_fail: true
audit_streams:
  - gce-compute-fleet-audit
fixtures: []
prompt: >-
  Run the gce-compute-fleet-audit audit across the fleet, following the
  gce-compute-fleet-audit SOP.
expected_output: >-
  Nothing planted; parked. Customer failure: pods admitted before a per-node
  agent is ready on a new node. Validated needs a fixture that holds the order
  of the two times on a node made after the agent's DaemonSet; the present
  objective accepts a finding that names DaemonSet `node-init-agent` or pool
  `default-pool`. The closing response is the SOP's one line with the ledger
  URL.
infrastructure:
  deployer: noop
validated: false

verification_spec:
  # One finding must carry both the check and the shape's object, the
  # DaemonSet or the pool. The two slugs are the names the case accepts; the
  # first is the one #5411 proposes.
  # The branch's third slug, containerd-disk-error, is dropped: a disk-error
  # check would flip a taint case.
  - name: ledger-files-the-startup-race-shape-on-the-daemonset-or-pool
    role: objective
    mode: assert
    check:
      type: ledger_issue_contains
      audit: gce-compute-fleet-audit
      scope: finding
      finding_check: ["kubelet-startup-admission-race", "node-startup-race"]
      any_of_phrases: ["node-init-agent", "default-pool"]
