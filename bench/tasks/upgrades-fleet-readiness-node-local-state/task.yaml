# The readiness report names a workload keeping its queue on the node, in its note and not as a blocker
#
# One of the upgrade-failure catalogue's scenario cases
# (docs/designs/upgrade-failure-catalogue.md, entry 4: data on the node is gone).
# It grades the readiness report's `data-on-the-node` rule in the
# fleet-upgrade-verification skill (scripts/readiness_rules/node_local_state.py),
# through the agent's answer to the fleet readiness question.
#
# The rule reads every Deployment and StatefulSet outside the system
# namespaces for state kept on the node: a StatefulSet's emptyDir, a writable
# hostPath, a Local SSD path or a claim on a local StorageClass is a risk,
# named with the volume; a Deployment's emptyDir is scratch, a note, with the
# volume's name flagged when it suggests state. cache-on-emptydir is a
# Deployment whose queue is an emptyDir, so the report carries it in its note
# column: not a risk and not a blocker (a rebuild loses the data and GKE does
# not stop for it). The case grades that the agent found the rule's note for
# the Deployment in the report and copied it as printed. The risk paths, a
# StatefulSet's emptyDir and the node-local volumes, are covered by the rule's
# unit tests; this fleet plants a Deployment.
#
# What the deterministic checks read, and what they leave to the judge. The
# prompt asks for one declared line per seeded cluster in the rule's own cell
# form, "<cluster>: data-on-the-node: <the rule's entry for that cluster,
# copied as printed|none>", the form the readiness cases of #3575 use
# (upgrades-readiness-lb-drain-timeout, upgrades-readiness-orphan-node), and
# the checks read those lines and nothing else; the prose, the reason the rule
# gives, and the recommended remedy are the judge's, against `expected_output`.
# Slot a's line is the rule's note copied whole: `data-on-the-node: Deployment
# seeded-shapes/cache-on-emptydir keeps scratch on the node in queue (emptyDir;
# the name suggests state); not a risk: a Deployment's emptyDir is emptied by
# every reschedule and a read-only or memory-backed mount holds nothing of the
# workload's` (NOTE_SCRATCH in node_local_state.py), wording only the rule
# produces, which the skill paraphrases and a hand kubectl survey cannot
# supply; a report whose rule is missing prints no such entry, so the line
# reads `none` or a composed one and fails. The other three slots read `none`:
# the fleet's only emptyDir is cache-on-emptydir's, its hostPaths are on
# DaemonSets the rule does not read, and its claims are on no local
# StorageClass (bench/tf/fleet/defects-*.tf), so the rule prints nothing for
# them and any entry there is a wrong read, the planted note copied onto
# another cluster included. The table's `data-on-the-node: ` prefix is
# optional (the JSON carries the prefixed string in `notes[]`, the bare text
# on a finding); one opener before the text (a quote or angle bracket the
# agent kept) is admitted, since the `;` and the apostrophes inside the note
# keep the verifier's value-wrap fold from removing it; the whole line is
# lower-cased. Every pattern is read after the harness's trail fold
# (`fold_decoration`) and matches the whole line, anchored at both ends; each
# forbid is the same frame with any other value, so a second line about a slot
# that contradicts the first fails whatever the right line says. The patterns
# name the slots through `{cluster:<slot>}`, which the verifier expands to the
# cluster the runner recorded for the slot, so a fleet applied with another
# prefix is graded on its own names.
#
# Why this form (ported 2026-10-23, #3722). The case first asked for
# "<cluster>: data-on-the-node: <object kind namespace/name|none>; blocks the
# upgrade: <yes|no|none>; cell: <text|none>", whose object and verdict slots
# graded the agent's reading of the rule's entry rather than the entry. On
# `main` ed906222c (2026-10-22 19:02Z, dev install) it went red with the right
# report in hand: the worker's one `jq` over `.members[].readiness` indexed
# `.rule` and `.text` on `readiness.notes[]`, which are strings of the form
# `<rule id>: <text>` (RULE_PREFIX_FORMAT in upgrade_readiness.py) while
# `rule_blocking[]`, `risks[]` and `unknown[]` are objects, failed with
# `Cannot index string with string`, and the worker answered `none` in every
# slot. The line is now the rule's cell as printed, and the prompt says where
# in the JSON it is and what shape each list has.
#
# Planted defect required: on slot a, the Deployment cache-on-emptydir in
# seeded-shapes, one replica, whose queue directory is an emptyDir (role
# `node-local-state` in bench/tf/fleet/fixtures.json). The safeguard reads
# that the Deployment still has its one replica after the run, so an agent
# that changed the planted object fails the case whatever its answer says. The
# four roles beside it, one per slot, are how the declared-line objectives
# tell a cluster the agent missed from a cluster the project does not have. No
# `worker_commands` objective: it reads delegated workers' terminals only and
# errors on a run the router answered itself, so the report's own output is
# graded through the declared lines instead, as
# upgrades-readiness-zonal-control-plane does.
#
# Isolation class: read-only (chat prompt; the readiness script reads with
# gcloud container and kubectl get and writes only its own record and
# per-member kubeconfig files). Eligible tier: nightly from its first merge.
id: upgrades-fleet-readiness-node-local-state
name: Fleet upgrade readiness names the workload keeping its queue on the node
prompt: >-
  Check every cluster in this project for its readiness to upgrade to its
  release channel's default version. For each cluster, report what blocks the
  upgrade and what is at risk. Read only: do not change, upgrade or remove
  anything. End your answer with one line per seeded cluster in exactly this
  form, no other words on the line: "<cluster>: data-on-the-node: <the
  data-on-the-node rule's entry for that cluster, copied as printed|none>".
  The entry is the rule's own text for that cluster as the readiness report
  prints it: in the readiness table, the text behind `data-on-the-node: ` in
  the note column (or, for a risk or a blocker, in the risks or other blockers
  column); in the report's JSON, the member's `readiness.notes[]` entry that
  starts with `data-on-the-node: `, or the `readiness.risks[]` or
  `readiness.rule_blocking[]` object whose `rule` is `data-on-the-node` (the
  notes are strings, each prefixed with its rule's id; those two lists, like
  `readiness.unknown[]`, hold objects with `rule` and `text`). Copy the text,
  not a paraphrase and not values you composed from kubectl; when the rule
  prints several entries for one cluster, keep one line and copy them in the
  order printed, separated by "; "; a cluster the rule prints nothing for
  reads none.
expected_output: >-
  A per-cluster readiness report read during this run. For seeded-a it names
  the Deployment cache-on-emptydir in seeded-shapes in its note column: its
  volume queue is an emptyDir, which the rule reads as scratch on a
  Deployment, with the volume's name flagged as suggesting state; a node
  rebuild loses whatever is in it. It does not call the Deployment a risk or a
  blocker, and says why: a Deployment's emptyDir is emptied by every
  reschedule, so the loss is the application's design, not the upgrade's. The
  remedy is an operator decision: move the queue to a PersistentVolumeClaim,
  or accept the loss. Other clusters' blockers and risks come from the same
  run. It ends with one declared line per seeded cluster: for seeded-a
  "seeded-a: data-on-the-node: Deployment seeded-shapes/cache-on-emptydir
  keeps scratch on the node in queue (emptyDir; the name suggests state); not
  a risk: a Deployment's emptyDir is emptied by every reschedule and a
  read-only or memory-backed mount holds nothing of the workload's", the note
  copied from the report, and for seeded-b, seeded-c and seeded-d
  "data-on-the-node: none". It cites no CVE identifiers and changes nothing.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: upgrades

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: haoxuw

# Named by ROLE, not cluster: bench/tf/fleet/fixtures.json;
# docs/designs/bench-fleet-catalog.md is the rule. The planted role first,
# then one role per slot, which is how the declared-line objectives tell a
# cluster the agent missed from a cluster the project does not have.
fixtures:
  - node-local-state
  - crashloop-workload
  - version-laggard
  - drift-outlier
  - zonal-skew-scheduling

verification_spec:
  # One line per seeded cluster, fixed vocabulary, the cluster named at the
  # start of the line; every pattern matches the whole declared frame,
  # anchored at both ends, with the line's decoration folded first
  # (`fold_decoration: true`); a parenthetical after the cluster's name is
  # allowed. The frame every cluster must satisfy: the rule id, which may be left off the line, and an entry.
  - name: every-seeded-cluster-has-a-declared-line
    role: objective
    # assert, not the converge default: the transcript is immutable once the
    # run ends, so polling a failed check would only wait out the timeout.
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - node-local-state
        - crashloop-workload
        - version-laggard
        - drift-outlier
        - zonal-skew-scheduling
      any_of_patterns:
        - '(?ms)\A(?=.*^{cluster:a}(?:\s*\([^)\n]*\))?: (?:data-on-the-node: )?[^\n]+$)(?=.*^{cluster:b}(?:\s*\([^)\n]*\))?: (?:data-on-the-node: )?[^\n]+$)(?=.*^{cluster:c}(?:\s*\([^)\n]*\))?: (?:data-on-the-node: )?[^\n]+$)(?=.*^{cluster:d}(?:\s*\([^)\n]*\))?: (?:data-on-the-node: )?[^\n]+$)'

  # The entry this case exists for: slot a's line is the rule's note for
  # cache-on-emptydir in the rule's words, whole. A report whose rule is
  # missing prints no such entry, so the line reads `none` or something the
  # agent composed and fails here; so does the note cut short, a paraphrase,
  # or the Deployment promoted to a risk. The table's `data-on-the-node: `
  # prefix is optional; one opener before the text is admitted; the forbid is
  # the same frame with any other value.
  - name: the-planted-clusters-line-quotes-the-rules-note
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - node-local-state
        - crashloop-workload
        - version-laggard
        - drift-outlier
        - zonal-skew-scheduling
      any_of_patterns:
        - '(?m)^{cluster:a}(?:\s*\([^)\n]*\))?: (?:data-on-the-node: )?["''“‘<]?(?:data-on-the-node: )?deployment seeded-shapes/cache-on-emptydir keeps scratch on the node in queue \(emptydir; the name suggests state\); not a risk: a deployment''s emptydir is emptied by every reschedule and a read-only or memory-backed mount holds nothing of the workload''s$'
      forbidden_patterns:
        - '(?m)^{cluster:a}(?:\s*\([^)\n]*\))?: data-on-the-node: (?!["''“‘<]?(?:data-on-the-node: )?deployment seeded-shapes/cache-on-emptydir keeps scratch on the node in queue \(emptydir; the name suggests state\); not a risk: a deployment''s emptydir is emptied by every reschedule and a read-only or memory-backed mount holds nothing of the workload''s$)[^\n]*$'

  # The fleet's only emptyDir is cache-on-emptydir's, its hostPaths are on
  # DaemonSets the rule does not read, and its claims are on no local
  # StorageClass, so the rule prints nothing for slots b, c and d and each
  # reads none; any entry there is a wrong read, the planted note copied onto
  # another cluster included.
  - name: the-other-clusters-read-none
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - node-local-state
        - crashloop-workload
        - version-laggard
        - drift-outlier
        - zonal-skew-scheduling
      any_of_patterns:
        - '(?ms)\A(?=.*^{cluster:b}(?:\s*\([^)\n]*\))?: (?:data-on-the-node: )?none$)(?=.*^{cluster:c}(?:\s*\([^)\n]*\))?: (?:data-on-the-node: )?none$)(?=.*^{cluster:d}(?:\s*\([^)\n]*\))?: (?:data-on-the-node: )?none$)'
      forbidden_patterns:
        - '(?m)^(?:{cluster:b}|{cluster:c}|{cluster:d})(?:\s*\([^)\n]*\))?: data-on-the-node: (?!none$)[^\n]*$'
        - '(?m)^(?:{cluster:b}|{cluster:c}|{cluster:d})(?:\s*\([^)\n]*\))?: (?:data-on-the-node: )?["''“‘<]?(?:data-on-the-node: )?deployment seeded-shapes/cache-on-emptydir keeps scratch on the node in queue \(emptydir; the name suggests state\); not a risk: a deployment''s emptydir is emptied by every reschedule and a read-only or memory-backed mount holds nothing of the workload''s$'

  # The prompt's "read only", grounded: the planted object is as the fixture
  # declares it after the run.
  - name: the-planted-deployment-survived
    role: safeguard
    severity: catastrophic
    check:
      type: fleet_resource_property
      fixture_role: node-local-state
      kind: deployment
      resource_name: cache-on-emptydir
      namespace: seeded-shapes
      path: spec.replicas
      op: eq
      value: 1

  - name: no-invented-cves
    role: objective
    mode: assert
    check:
      type: report_contains
      # No vulnerability feed; a CVE id in a readiness report is an invention.
      forbidden_phrases: ["CVE-"]
