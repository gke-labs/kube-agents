# NIGHTLY — an entry in hack/eval/nightly-cases.txt.
#
# Domain: cost (GKE Autopilot headroom invariant). Journey: a user asks for a
# compute optimization audit on the host Autopilot cluster after a naive cost
# scan flagged `kube-system/gke-system-balloon-pod` pods reserving whole vCPUs;
# the delegated worker recognizes `gke-system-balloon-pod` as normal GKE
# Autopilot scheduling headroom from its persona invariant without burning turns
# on per-pod inspection or documentation/web search rabbit holes, and scopes its
# live optimization read to non-system user workloads (#3141).
#
# What it catches. Without the Autopilot Headroom Invariant in the Cluster Agent
# and Platform Agent personas, workers dispatched to GKE Autopilot clusters
# investigate `gke-system-balloon-pod` pods through `kubectl` queries,
# `mcp-developer_knowledge` searches, and `web_search` loops, or flag them as
# idle waste. The route checks verify that work was delegated through kanban,
# no worker command inspects `balloon` pods, and no worker invokes
# `mcp-developer_knowledge` or `web_search` on this card; the report check
# verifies that `gke-system-balloon-pod` is explained as GKE Autopilot headroom
# rather than proposed for deletion or rightsizing.
#
# Command-guard scope (`no-deep-inspection-commands-target-balloon-pods`):
# `kubectl` (`get`, `describe`, `logs`, `top`), `jq`, `awk` (`awk`/`gawk`/`mawk`
# /`nawk`), and `sed` (`sed`/`gsed`) are graded as parsed shell argvs via
# `forbidden_runs` both on card-log / child-card commands and on typed worker
# `terminal` / `execute_code` calls (`after_result_pattern: "(?!)"`), so `;`,
# `&&`, `||`, and `|` pipelines collapsed by Hermes's one-line card-log summary
# are still read as per-segment argvs. Negative exclusions pass: `kubectl`
# selectors/JSONPath using `!=`, `notin (...)`, or `!<key>`; `jq` filters
# negating the balloon match via `!=` (either side), `... | not`, `== false`,
# `== null` (`index(...) == null`), `!= true`, `not(...)`, or `del(...)`
# (whether written inline or bound via `--arg` / `--argjson`); `awk` `!/.../`,
# `!~`, `!(...)`, `!func(...)` (`!index`, `!match`), `!=`, `== 0` (`index(...)
# == 0`), or `{next}`; and `sed` single-address or range `/.../d`, `{d;}`, or
# `/.../!p`. Cross-word flags (`grep -v` / `--invert-match` and `jq --arg` /
# `--argjson` bindings) are graded at segment level via `forbidden_patterns`
# paired with `none -> tool_called(terminal, scope: workers)`. Arbitrary inline
# Python filter logic (`python3 -c` / `execute_code`) that does not invoke those
# binaries is not graded.
#
# Lookup-guard scope (`no-doc-or-web-search-rabbit-hole`): worker MCP calls
# arrive wrapped inside Hermes's `tool_call` (`calls: [{name, arguments}]`), and
# `tool_called` does not inspect wrapped arguments one level down, so this check
# forbids any worker `web_search` or `developer_knowledge` call on the card
# rather than only balloon-worded queries. On the standing dev Autopilot
# cluster, non-system namespaces carry no user workloads needing GKE sizing-rule
# lookups; a legitimate user-workload sizing lookup on a fuller cluster is a
# known over-reach of this deterministic check.
#
# Report-guard scope (`report-identifies-balloon-pods-as-autopilot-headroom`):
# `fold_decoration: true` + `forbidden_patterns` deterministically grades
# line-opening and Markdown table-cell (`| ... |`) imperative removal actions
# (`delete`, `kubectl delete`/`scale`, `remove`, `evict`, `scale down`,
# `scale ... to 0/zero`, `set ... replicas to 0/zero`, `right-size`) and
# single or stacked affirmative recommendation leads (`recommend`, `suggest`,
# `propose`, `consider`, `you/we should`, `next`, `option N`, `fix`, `action`,
# `item`, `remediation`, `step`) in any verb/noun inflection (`-e`, `-ed`,
# `-ing`, `-al`/`-ation`, `removal of`) targeting either the literal
# `gke-system-balloon-pod` name or the `balloon pod(s)` shorthand, while
# exempting remediation bullets that remove/exclude the pods from the user's
# cost scan, waste list, or alerts (e.g. `remove gke-system-balloon-pod from
# the cost scan's waste list`, but NOT `from the cluster` / `from kube-system` /
# `from the node`). Recommendations embedded mid-sentence or phrased as bare
# gerund/noun subjects are left to `expected_output` (`OutcomeValidity`) so
# negated prose explanations never false-fail.
#
# Works whether the host cluster routes to its dedicated Cluster Agent profile
# or falls back to `platform` when the host profile has not yet been scaffolded
# (same routing contract as `chat-routing-this-cluster-namespaces`).
#
# Planted defect required: none. Isolation class: read-only. Eligible tier:
# nightly.
id: cluster-agent-autopilot-headroom-invariant
name: Autopilot optimization audit treats gke-system-balloon-pod as platform headroom without inspection loops
prompt: >-
  Audit compute optimization opportunities on this cluster. Our cost scan
  flagged kube-system/gke-system-balloon-pod pods reserving whole vCPUs —
  inspect this cluster's workloads and tell me whether gke-system-balloon-pod
  or any user workloads are idle waste or candidates for rightsizing. Do not
  change anything.
expected_output: >-
  The front door delegates the audit for this host cluster without asking which
  cluster is meant. The worker explains directly from the GKE Autopilot
  Headroom Invariant that gke-system-balloon-pod pods are normal GKE Autopilot
  spare scheduling headroom (preempted automatically when user pods need
  capacity) rather than idle waste or rightsizing candidates, does not
  recommend deleting, removing, evicting, scaling down, or rightsizing
  gke-system-balloon-pod anywhere in the report, runs no per-pod kubectl or
  filter queries targeting balloon pods, makes no documentation or web-search
  calls on this card, and scopes its live workload inspection strictly to
  non-system user namespaces.
infrastructure:
  deployer: noop
validated: false

domain: cost

