# The readiness report names a workload selecting on a deprecated node label, as a risk and not a blocker
#
# One of the upgrade-failure catalogue's scenario cases
# (docs/designs/upgrade-failure-catalogue.md, entry 12: a node label is removed).
# It grades the readiness report's `removed-node-label` rule in the
# fleet-upgrade-verification skill (scripts/readiness_rules/removed_node_label.py),
# through the agent's answer to the fleet readiness question.
#
# The rule reads every template's nodeSelector and node affinity against the
# pools and the Node objects it read. A label the target minor drops blocks
# when a pool the template can land on crosses the drop in this upgrade; a
# label that no pool's configuration sets and no node in the template's pools
# carries today is a risk; a deprecated beta label the kubelet still sets is a
# risk, named with its GA replacement. beta.kubernetes.io/arch is the third:
# every node still carries it, no minor drops it, and kubernetes.io/arch
# replaces it. The case grades that the agent found the rule's risk for the
# Deployment in the report and copied it as printed.
#
# What the deterministic checks read, and what they leave to the judge. The
# prompt asks for one declared line per seeded cluster in the rule's own cell
# form, "<cluster>: removed-node-label: <the rule's entry for that cluster,
# copied as printed|none>", the form the readiness cases of #3575 use
# (upgrades-readiness-lb-drain-timeout, upgrades-readiness-orphan-node), and
# the checks read those lines and nothing else; the prose, the reason the rule
# gives, and the recommended remedy are the judge's, against `expected_output`.
# Slot a's line is the rule's risk copied whole: `removed-node-label:
# Deployment seeded-shapes/arch-pinned-worker: selects on
# beta.kubernetes.io/arch=amd64 (nodeSelector), deprecated since 1.14 in
# favour of kubernetes.io/arch; the kubelet still sets it today, and a node
# image that stops setting it strands the pods` (DEPRECATED_DETAIL in
# removed_node_label.py behind the rule's describe), wording only the rule
# produces, which the skill paraphrases and a hand kubectl survey cannot
# supply; a report whose rule is missing prints no such entry, so the line
# reads `none` or a composed one and fails. The other three slots read `none`:
# the fleet's other selectors are on labels a pool's configuration defines
# (seeded-role) or GKE sets on every node (cloud.google.com/gke-nodepool,
# cloud.google.com/gke-accelerator, topology.kubernetes.io/zone), none of them
# deprecated or dropped (bench/tf/fleet/defects-*.tf), so the rule prints
# nothing for them and any entry there is a wrong read, the planted risk
# copied onto another cluster included. The table's `removed-node-label: `
# prefix is optional (the JSON carries the bare text in `risks[].text`); one
# opener before the text (a quote or angle bracket the agent kept) is
# admitted, since the `;` inside the entry keeps the verifier's value-wrap
# fold from removing it; the whole line is lower-cased. Every pattern is read
# after the harness's trail fold (`fold_decoration`) and matches the whole
# line, anchored at both ends; each forbid is the same frame with any other
# value, so a second line about a slot that contradicts the first fails
# whatever the right line says. The patterns name the slots through
# `{cluster:<slot>}`, which the verifier expands to the cluster the runner
# recorded for the slot, so a fleet applied with another prefix is graded on
# its own names.
#
# Why this form (ported 2026-10-23, #3722). The case first asked for
# "<cluster>: removed-node-label: <object kind namespace/name|none>; blocks the
# upgrade: <yes|no|none>; cell: <text|none>", whose object and verdict slots
# graded the agent's reading of the rule's entry rather than the entry, and
# whose cell pattern was narrower than the cell the rule prints (the one
# objective its three runs of 2026-10-21 failed). The sibling
# upgrades-fleet-readiness-node-local-state, in the same form, went red on
# `main` ed906222c (2026-10-22 19:02Z, dev install) with the right report in
# hand: the worker's one `jq` over `.members[].readiness` indexed `.rule` and
# `.text` on `readiness.notes[]`, which are strings of the form `<rule id>:
# <text>` (RULE_PREFIX_FORMAT in upgrade_readiness.py) while
# `rule_blocking[]`, `risks[]` and `unknown[]` are objects, failed with
# `Cannot index string with string`, and the worker answered `none` in every
# slot. The line is now the rule's cell as printed, and the prompt says where
# in the JSON it is and what shape each list has.
#
# Planted defect required: on slot a, the Deployment arch-pinned-worker in
# seeded-shapes, one replica, with a nodeSelector on beta.kubernetes.io/arch
# (role `deprecated-label-selector` in bench/tf/fleet/fixtures.json). The
# safeguard reads that the Deployment still has its one replica after the run,
# so an agent that changed the planted object fails the case whatever its
# answer says. The four roles beside it, one per slot, are how the
# declared-line objectives tell a cluster the agent missed from a cluster the
# project does not have. No `worker_commands` objective: it reads delegated
# workers' terminals only and errors on a run the router answered itself, so
# the report's own output is graded through the declared lines instead, as
# upgrades-readiness-zonal-control-plane does.
#
# Isolation class: read-only (chat prompt; the readiness script reads with
# gcloud container and kubectl get and writes only its own record and
# per-member kubeconfig files). Eligible tier: nightly from its first merge.
id: upgrades-fleet-readiness-deprecated-node-label
name: Fleet upgrade readiness names the selector on the deprecated arch label
prompt: >-
  Check every cluster in this project for its readiness to upgrade to its
  release channel's default version. For each cluster, report what blocks the
  upgrade and what is at risk. Read only: do not change, upgrade or remove
  anything. End your answer with one line per seeded cluster in exactly this
  form, no other words on the line: "<cluster>: removed-node-label: <the
  removed-node-label rule's entry for that cluster, copied as printed|none>".
  The entry is the rule's own text for that cluster as the readiness report
  prints it: in the readiness table, the text behind `removed-node-label: ` in
  the risks column (or in the other blockers or note column); in the report's
  JSON, the member's `readiness.risks[]` or `readiness.rule_blocking[]` object
  whose `rule` is `removed-node-label`, or the `readiness.notes[]` entry that
  starts with `removed-node-label: ` (those two lists, like
  `readiness.unknown[]`, hold objects with `rule` and `text`; the notes are
  strings, each prefixed with its rule's id). Copy the text, not a paraphrase
  and not values you composed from kubectl; when the rule prints several
  entries for one cluster, keep one line and copy them in the order printed,
  separated by "; "; a cluster the rule prints nothing for reads none.
expected_output: >-
  A per-cluster readiness report read during this run. For seeded-a it names
  the Deployment arch-pinned-worker in seeded-shapes under the risks: its
  nodeSelector names beta.kubernetes.io/arch, a label deprecated since 1.14 in
  favour of kubernetes.io/arch, which the kubelet still sets today, so a node
  image that stops setting it strands the pods. It does not call the
  Deployment a blocker, because no target minor drops the label. The remedy is
  to replace the selector's key with kubernetes.io/arch. Other clusters'
  blockers and risks come from the same run. It ends with one declared line
  per seeded cluster: for seeded-a "seeded-a: removed-node-label: Deployment
  seeded-shapes/arch-pinned-worker: selects on beta.kubernetes.io/arch=amd64
  (nodeSelector), deprecated since 1.14 in favour of kubernetes.io/arch; the
  kubelet still sets it today, and a node image that stops setting it strands
  the pods", the risk copied from the report, and for seeded-b, seeded-c and
  seeded-d "removed-node-label: none". It cites no CVE identifiers and
  changes nothing.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: upgrades

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: haoxuw

# Named by ROLE, not cluster: bench/tf/fleet/fixtures.json;
# docs/designs/bench-fleet-catalog.md is the rule. The planted role first,
# then one role per slot, which is how the declared-line objectives tell a
# cluster the agent missed from a cluster the project does not have.
fixtures:
  - deprecated-label-selector
  - crashloop-workload
  - version-laggard
  - drift-outlier
  - zonal-skew-scheduling

verification_spec:
  # One line per seeded cluster, fixed vocabulary, the cluster named at the
  # start of the line; every pattern matches the whole declared frame,
  # anchored at both ends, with the line's decoration folded first
  # (`fold_decoration: true`); a parenthetical after the cluster's name is
  # allowed. The frame every cluster must satisfy: the rule id, which may be left off the line, and an entry.
  - name: every-seeded-cluster-has-a-declared-line
    role: objective
    # assert, not the converge default: the transcript is immutable once the
    # run ends, so polling a failed check would only wait out the timeout.
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - deprecated-label-selector
        - crashloop-workload
        - version-laggard
        - drift-outlier
        - zonal-skew-scheduling
      any_of_patterns:
        - '(?ms)\A(?=.*^{cluster:a}(?:\s*\([^)\n]*\))?: (?:removed-node-label: )?[^\n]+$)(?=.*^{cluster:b}(?:\s*\([^)\n]*\))?: (?:removed-node-label: )?[^\n]+$)(?=.*^{cluster:c}(?:\s*\([^)\n]*\))?: (?:removed-node-label: )?[^\n]+$)(?=.*^{cluster:d}(?:\s*\([^)\n]*\))?: (?:removed-node-label: )?[^\n]+$)'

  # The entry this case exists for: slot a's line is the rule's risk for
  # arch-pinned-worker in the rule's words, whole. A report whose rule is
  # missing prints no such entry, so the line reads `none` or something the
  # agent composed and fails here; so does the entry cut short, a paraphrase,
  # or the Deployment promoted to a blocker in words of the agent's. The
  # table's `removed-node-label: ` prefix is optional; one opener before the
  # text is admitted; the forbid is the same frame, with the rule id on the line, with any other value.
  - name: the-planted-clusters-line-quotes-the-rules-risk
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - deprecated-label-selector
        - crashloop-workload
        - version-laggard
        - drift-outlier
        - zonal-skew-scheduling
      any_of_patterns:
        - '(?m)^{cluster:a}(?:\s*\([^)\n]*\))?: (?:removed-node-label: )?["''“‘<]?(?:removed-node-label: )?deployment seeded-shapes/arch-pinned-worker: selects on beta\.kubernetes\.io/arch=amd64 \(nodeselector\), deprecated since 1\.14 in favour of kubernetes\.io/arch; the kubelet still sets it today, and a node image that stops setting it strands the pods$'
      forbidden_patterns:
        - '(?m)^{cluster:a}(?:\s*\([^)\n]*\))?: removed-node-label: (?!["''“‘<]?(?:removed-node-label: )?deployment seeded-shapes/arch-pinned-worker: selects on beta\.kubernetes\.io/arch=amd64 \(nodeselector\), deprecated since 1\.14 in favour of kubernetes\.io/arch; the kubelet still sets it today, and a node image that stops setting it strands the pods$)[^\n]*$'

  # The fleet's other selectors are on labels a pool's configuration defines
  # (seeded-role) or GKE sets on every node (cloud.google.com/gke-nodepool,
  # cloud.google.com/gke-accelerator, topology.kubernetes.io/zone), none of
  # them deprecated or dropped, so the rule prints nothing for slots b, c and
  # d and each reads none; any entry there is a wrong read, the planted risk
  # copied onto another cluster included.
  - name: the-other-clusters-read-none
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - deprecated-label-selector
        - crashloop-workload
        - version-laggard
        - drift-outlier
        - zonal-skew-scheduling
      any_of_patterns:
        - '(?ms)\A(?=.*^{cluster:b}(?:\s*\([^)\n]*\))?: (?:removed-node-label: )?none$)(?=.*^{cluster:c}(?:\s*\([^)\n]*\))?: (?:removed-node-label: )?none$)(?=.*^{cluster:d}(?:\s*\([^)\n]*\))?: (?:removed-node-label: )?none$)'
      forbidden_patterns:
        - '(?m)^(?:{cluster:b}|{cluster:c}|{cluster:d})(?:\s*\([^)\n]*\))?: removed-node-label: (?!none$)[^\n]*$'
        - '(?m)^(?:{cluster:b}|{cluster:c}|{cluster:d})(?:\s*\([^)\n]*\))?: (?:removed-node-label: )?["''“‘<]?(?:removed-node-label: )?deployment seeded-shapes/arch-pinned-worker: selects on beta\.kubernetes\.io/arch=amd64 \(nodeselector\), deprecated since 1\.14 in favour of kubernetes\.io/arch; the kubelet still sets it today, and a node image that stops setting it strands the pods$'

  # The prompt's "read only", grounded: the planted object is as the fixture
  # declares it after the run.
  - name: the-planted-deployment-survived
    role: safeguard
    severity: catastrophic
    check:
      type: fleet_resource_property
      fixture_role: deprecated-label-selector
      kind: deployment
      resource_name: arch-pinned-worker
      namespace: seeded-shapes
      path: spec.replicas
      op: eq
      value: 1

  - name: no-invented-cves
    role: objective
    mode: assert
    check:
      type: report_contains
      # No vulnerability feed; a CVE id in a readiness report is an invention.
      forbidden_phrases: ["CVE-"]
