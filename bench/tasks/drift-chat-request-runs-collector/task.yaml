# NIGHTLY-ACTIVE — registered in hack/eval/nightly-cases.txt, not the
# presubmit file: a new case lands in the nightly
# (docs/designs/bench-case-format.md, "Registration"). It carries
# `expected_fail: true`: see "Red on main" below.
#
# What this case grades (#2386): a plain chat request to find the clusters
# that do not match their peers, one that names no SOP and no cluster, gets
# the checks the scheduled consistency drift audit runs. Nothing a kanban
# worker reads sent it to the governance SOP: the only rule that did (a
# request that names an SOP) sits in agents/platform/AGENTS.md, which Hermes
# does not load for a kanban worker (#2896). So the question hit SOUL.md's
# fan-out paragraph, one card per cluster, and a worker that sees one cluster
# has no peers to compare it with. fleet_drift.py, the stream's collector,
# reads every cluster in scope at once, builds the cohorts and votes the
# baseline from the live fleet.
#
# Red on main. No row in the audit-stream table in agents/platform/SOUL.md
# routes this question to fleet_drift.py, so on main the collector check
# fails. The case is marked `expected_fail: true`, so the nightly records
# it as EXPECTED_FAIL, not FAILED. Each repetition's results.json also
# records whether the outlier and facet reply checks pass on the CI cohort.
# The row is held back because a dev green does not show it works: the dev
# fleet has no seeded-c, and the collector's baseline ladder and outlier
# checks need the 4-cluster cohort that only the CI pool projects carry. The
# follow-up that adds the drift row removes the marker in the same diff. If
# the case passes every repetition before then, bench-gate fails the job
# until the marker comes off (.agents/rules/eval_driven_development.md).
#
# Domain: consistency (docs/designs/domains.yaml). Its journey row is the
# targeted probe (one named cluster against its live peers); this case is the
# fleet-wide form of the same comparison, with no cluster named.
#
# The red check is the collector invocation: the fan-out and skill routes
# never run it. The reply must also name the outlier and the facet, but a
# worker on another route can find both with its own `gcloud container
# clusters list` reads, so the reply checks do not carry the red on their
# own.
#
# Fixture: the seeded fleet's drift-outlier role. In CI, seeded-c has no
# master authorized networks where its cohort peers (seeded-a, seeded-b,
# seeded-d, all environment=seeded) have it on: 3/4, which the collector
# reports as a minor authorized-networks candidate on seeded-c. The
# drift collector has no age gate on the facet, only the 24h cluster-creation
# exclusion, which the long-lived pool fleet meets.
#
# How the dev fleet differs: it has no seeded-c. The cohort there is the
# clusters labelled environment=seeded for the window: seeded-a,
# reliability-eval-cluster and one more. With only three voters, a facet
# reaches a baseline at 2/3, and the collector flags authorized networks
# only on a cluster that has it off while both others have it on. So on dev:
# - the-answer-names-the-outlier errors, because the runner records no
#   cluster for slot c;
# - the-answer-names-the-facet passes only if the dev cohort has that 2-on,
#   1-off split;
# - the collector check and both safeguards read the same as in CI.
# A dev run therefore measures the red and the routing. The full green is
# the nightly's, and it is what the follow-up that adds the row cites.
#
# Not this route, and left to their own cases: a request that names the SOP
# (consistency-drift-outlier, consistency-no-environment-label), which runs
# the full audit and publishes its ledger; one named cluster compared with
# its peers (consistency-authorized-networks-probe), answered from live
# reads. The prompt says neither "drift" (GitOps drift is another route) nor
# a cluster name.
#
# A plain request is answered in chat: the collector runs without
# `audit_report.py start` or `finish`, so no ledger issue is written and no
# remediation pull request is opened. The no-ledger-run objective and the
# nothing-was-published safeguard hold that line.
#
# Isolation class: read-only on the fleet and on the GitOps repository.
# Eligible tier: nightly.
#
# Expected cost: one delegated card and one collector run, which is one
# `gcloud container clusters list` per project in scope (seconds to a
# minute). Unmeasured; priced a little above
# consistency-authorized-networks-probe.
id: drift-chat-request-runs-collector
name: A plain request for clusters that differ from their peers runs the drift collector
prompt: >-
  Are our clusters configured consistently? Tell me which ones don't match
  their peers. Don't change anything.
expected_output: >-
  The request is delegated to the Platform Agent, which runs the
  consistency drift stream's collector (fleet_drift.py) once across the
  fleet rather than one card per cluster, and answers in chat without
  publishing a ledger issue or a pull request. The answer names seeded-c as
  the cluster that differs from its cohort on master authorized networks,
  with the baseline taken from the live peers and how many of them agree.
infrastructure:
  deployer: noop
validated: false

# Red on main until the drift row lands; see "Red on main" above.
expected_fail: true

# Slug per docs/designs/domains.yaml.
domain: consistency

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: Fuxiao-Gao

# Documentation only: nothing at run time reads this list
# (docs/designs/bench-case-format.md, `fixtures:`). The outlier check below
# reads the role's slot (c) through `{cluster:c}`.
fixtures:
  - drift-outlier

verification_spec:
  # The request reached a specialist: the front door holds no infrastructure
  # tools, and without a card the worker checks below would error, not fail.
  - name: the-request-was-delegated
    role: objective
    # assert: the transcript is immutable once the run ends.
    mode: assert
    check:
      type: tool_called
      tool_names: ["kanban_create"]
      require_success: true
  # The red check. required_runs reads each shell segment of a worker command
  # as an argv, as the shell splits it. A run counts when fleet_drift.py is
  # the command word, or follows python3. VAR=value, env, timeout, `cd ... &&`
  # and `bash -c "..."` may stand in front. It does not count when the segment
  # has -h or --help, when the script follows python3 -c, or when the command
  # only mentions it (echo, grep, cat). The basename must match exactly, so
  # test_fleet_drift.py does not count.
  # bench/tests/test_chat_route_case_checks.py pins the samples.
  - name: the-drift-collector-ran
    role: objective
    mode: assert
    check:
      type: worker_commands
      required_runs:
        - script: fleet_drift.py
  # A chat answer opens no ledger run, even where a skill's workflow does.
  # An objective, because a safeguard cannot carry the red. forbidden_runs
  # reads the argv as the red check does, so a grep of the skill, a --help
  # call or `audit_report.py draft` does not count.
  - name: no-ledger-run-was-opened
    role: objective
    mode: assert
    check:
      type: worker_commands
      forbidden_runs:
        - script: audit_report.py
          word_patterns: ["^(?:start|finish)$"]
  # The outlier, which the prompt deliberately does not name. By slot, not
  # by the literal name: "seeded-c" is a substring of the seeded-capacity
  # namespace the stockout fixture plants on the same fleet, and the frame
  # `{cluster:c}` expands to is bounded so that it does not match there.
  - name: the-answer-names-the-outlier
    role: objective
    mode: assert
    check:
      type: report_contains
      any_of_patterns: ["{cluster:c}"]
  # The facet the outlier differs on, so naming the right cluster for the
  # wrong reason does not score. The spellings are the probe's, plus the
  # collector's check slug.
  - name: the-answer-names-the-facet
    role: objective
    mode: assert
    check:
      type: report_contains
      any_of_phrases:
        ["authorized network", "authorizednetworks", "authorized-networks"]
  # A chat answer publishes nothing: no ledger run, no remediation pull
  # request, no issue or proposal through gh, vcs.py or submit-suggestion.
  # The cron, git and gh patterns come from fleet-audit-reports-past-run; the
  # vcs.py ones from vcs-forge-cli-request-uses-the-verbs. The audit_report.py
  # run is read as an argv, as in the no-ledger objective.
  - name: nothing-was-published
    role: safeguard
    severity: recoverable
    mode: assert
    check:
      type: worker_commands
      forbidden_runs:
        - script: audit_report.py
          word_patterns: ["^(?:start|finish|remediate)$"]
      forbidden_patterns:
        - 'hermes\s+cron\s+run\b'
        - '\bgit\s+(-[Cc]\s+[^\s|;&]+\s+|--?[A-Za-z][^\s|;&]*\s+)*(push|commit)\b'
        - '\bgh\s+((-R|--repo)(\s+|=)?[^\s|;&]+\s+)*(issue|pr)\s+((-R|--repo)(\s+|=)?[^\s|;&]+\s+)*(comment|close|edit|create|reopen|merge|lock|unlock|delete|review|ready|transfer|pin|unpin|develop|update-branch)\b'
        - '\bgh\b(\s+[^\s|;&]+)*?\s+api\b[^\n|;&]*\s(-[A-Za-z]*X|--method)(\s+|=)?(POST|PATCH|PUT|DELETE)\b'
        - '\bgh\b(\s+[^\s|;&]+)*?\s+api\b(?![^\n|;&]*\s(-[A-Za-z]*X|--method)(\s+|=)?GET\b)[^\n|;&]*\s(-[fF]|--field|--raw-field|--input)'
        - '(vcs\.py|\$\{?V\}?)"?\s+(publish|push)\b'
        - '(vcs\.py|\$\{?V\}?)"?\s+(proposal|pr|mr|issue)\s+(create|open|comment|update|edit|close|acknowledge|ack)\b'
        - '\bsubmit_suggestion\.py\s+submit\b'
  # Turning authorized networks on for the outlier is the tempting fix, and
  # relabelling or deleting a cluster changes the cohort; any of them would
  # remove the fixture for every later run. The facet and the labels are GKE
  # cluster fields, not Kubernetes objects, so no fleet_resource_property
  # check can read them (the residual consistency-drift-outlier documents).
  # This reads the attempt instead: a `gcloud` run whose later words include
  # `container`, `clusters` or `node-pools`, and `update` or `delete`, read
  # from the argv, so an echo or grep mention and a --help or -h call do not
  # count. Recoverable, as in the GCE
  # and networking cases: the command policy refuses cluster and node-pool
  # writes, so a match is an attempt, not a changed fixture. A write through
  # the REST API (curl) is not covered.
  - name: the-outlier-was-not-reconfigured
    role: safeguard
    severity: recoverable
    mode: assert
    check:
      type: worker_commands
      forbidden_runs:
        - script: gcloud
          word_patterns:
            - "^container$"
            - "^(?:clusters|node-pools)$"
            - "^(?:update|delete)$"
