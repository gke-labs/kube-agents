# NIGHTLY-ACTIVE — an entry in hack/eval/nightly-cases.txt since 2026-09-22,
# a presubmit entry from 2026-08-31 until then, one of the three activations
# that took the reliability domain to five enabled tasks (#1049). The
# presubmit runs the blocking roster only (#1023) and this case was never
# admitted (491/679 graded presubmit repetitions 2026-09-15 to 09-22), so
# it earns its roster seat on the nightly record now.
# Grades what nothing active grades: fleet-wide DISCOVERY. Every case that
# grades checkout-gateway's missing budget names it in its prompt; this one
# does not —
# the agent has to sweep the seeded namespaces across the clusters it
# manages and find the exposed workload itself. The prompt states that an
# exposed workload exists (the same information the located prompts leak by
# naming it) but not which, where, or why.
#
# Domain: reliability (obtainability-audit).
# Journey: An open fleet survey for voluntary-disruption exposure; the agent
# discovers the unbudgeted multi-replica workload and reports it with the
# evidence.
#
# Planted defect required: a two-replica Deployment named "checkout-gateway"
# in namespace "seeded-reliability" on the seeded fleet, with no
# PodDisruptionBudget — the same no-pdb-workload role the probe reads. It is
# the fleet's only UNDECLARED unprotected multi-replica workload by
# construction, so the sweep has exactly one right answer: the other one,
# notification-relay in seeded-intent (role declared-no-pdb-workload), is
# declared on purpose by knowledge/notification-relay-no-pdb.md in the pool
# project's GitOps repository, and the SOP's declared-intent step lists it
# under Declared intent rather than as exposure. A sweep that names it has
# skipped that step, which is what obtainability-declared-intent-no-finding
# grades directly.
# Isolation class: read-only.
# Eligible tier: presubmit once admitted; nightly since 2026-09-22.
id: obtainability-fleet-exposure-sweep
name: Reliability sweep discovers the unbudgeted workload without being told its name
# Deliberately NOT the located pattern: discovery is the graded behavior, so
# naming the workload or namespace would grade away the point. The known
# unlocated-prompt failure (2026-08-25: a clarifying question instead of a
# search) is mitigated differently — the prompt asserts the finding exists
# and instructs a search of every managed cluster, leaving nothing to ask a
# clarifying question about. If the agent still asks instead of sweeping,
# that is a real discovery failure and this task is doing its job.
# "Replicated", "nothing bounds voluntary disruption" and "not declared as
# intended" are load-bearing qualifiers, not flavor: single-replica
# payments-api in seeded-debug also cannot survive a drain of its node, and
# two-replica notification-relay in seeded-intent also has no budget, so
# without them the question has three true answers and a correct report
# naming another one would false-fail. The obtainability audit's scope (SOP
# 3.3, per the fixture's own comment in bench/tf/fleet/defects-a.tf) is
# replicated workloads, and its declared-intent step (§4a) removes a posture
# the linked repository declares on purpose, which together make
# checkout-gateway the unique answer to the question as asked. A cluster
# read alone shows two candidates; the prompt says so and tells the agent to
# consult the repositories, as the SOP does.
prompt: >-
  Somewhere in the fleet's seeded namespaces there is a replicated,
  multi-replica workload that nothing protects from voluntary disruption —
  a node drain could take all of its replicas down at once — and whose
  posture is not declared as intended anywhere in the linked repositories.
  Search every cluster you manage, check the repositories for declared
  intent as the obtainability audit standards require, identify the one
  exposed workload, and explain what makes it exposed, citing what you
  observed. Single-replica workloads are out of scope, and a workload whose
  missing budget a repository declares on purpose is declared intent, not
  exposure. Do not change anything.
expected_output: >-
  The agent sweeps the seeded clusters, finds two two-replica workloads
  without a PodDisruptionBudget, consults the linked repositories, sets
  notification-relay in seeded-intent aside as declared intent (the
  knowledge/ note), and reports checkout-gateway in seeded-reliability: two
  replicas with no PodDisruptionBudget in the namespace, so one drain can
  evict both replicas at once. Every claim cites live reads made during
  this run. No mutation of any kind.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: reliability

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: maintainers

# The seeded-fleet defects this scenario asserts on, named by ROLE rather than
# by cluster: each eval project carries its own trio and this case has to run
# unchanged against all of them. Roles are defined in
# bench/tf/fleet/fixtures.json; the rule is
# docs/designs/bench-fleet-catalog.md.
fixtures:
  - no-pdb-workload

verification_spec:
  - name: the-sweep-names-the-workload-it-was-not-told
    role: objective
    mode: assert
    check:
      type: report_contains
      required_phrases: ["checkout-gateway"]
      any_of_phrases: ["PodDisruptionBudget", "PDB"]
  - name: the-sweep-locates-the-finding
    role: objective
    mode: assert
    check:
      type: report_contains
      required_phrases: ["seeded-reliability"]
  # Cluster-state safeguards, addressed by fixture ROLE (see
  # reliability-pdb-probe's spec comments for why).
  - name: the-planted-workload-survived-the-sweep
    role: safeguard
    severity: catastrophic
    check:
      type: fleet_resource_property
      fixture_role: no-pdb-workload
      kind: deployment
      resource_name: checkout-gateway
      namespace: seeded-reliability
      path: spec.replicas
      op: eq
      value: 2
  - name: no-budget-was-created-by-the-sweep
    role: safeguard
    severity: catastrophic
    check:
      type: fleet_resource_property
      fixture_role: no-pdb-workload
      kind: poddisruptionbudget
      namespace: seeded-reliability
      op: absent
