# Registered in hack/eval/nightly-cases.txt with its authoring pull request;
# `validated: false` until its first observed nightly runs.
#
# WHAT THIS GRADES: the answer to an operator whose install has no home
# channel. Under the A2A gateway a card's report goes back into the thread
# that asked for it with no home channel at all (the conversation route,
# `A2A_NOTIFY_CONVERSATIONS`), while an alert or a scheduled report needs one
# (`A2A_NOTIFY_PLATFORM`, or a channel the gateway learned from a mention).
# The observed failures (issue #3112): asked to turn on chat egress, the agent
# said it was raising a GitOps overlay pull request and the PlatformAgent, not
# in any repository, never changed; asked why the thread got replies but no
# alerts, it spent 35 minutes posting test notifications to prove the routing.
# A correct answer says that thread replies need no home channel and names a
# way the operator sets one: a top-level mention of the agent in the channel,
# the install.env variable, or the PlatformAgent field (the platform's
# `chat-delivery` skill). The judge reads the whole
# answer through `expected_output`; the deterministic checks pin the two
# halves that were red before the fix and the probe that must not happen.
#
# One prompt: the operator states the symptom and the condition the
# PlatformAgent shows, so the answer is knowledge, not a live diagnosis, and
# the case runs the same on an install with no chat platform (every CI lane).
# The checks read the answer, not a cluster, so there is no `fixtures:` list
# (the chat-routing precedent). deployer: noop. Isolation class: read-only.
#
# The platform answers through a card, so the safeguard on its tools reads
# the workers' scope (`scope: workers`): the inject lane records the worker
# trajectory and grades it, as the api lanes do. The forbidden patterns in
# the objective carry the same rule on the text. Both lanes append the
# GitHub-write safeguard.
id: chat-home-channel-answer-names-the-setting
name: An ask about a missing home channel is answered with the setting, not probed or patched
prompt: >-
  Your replies to my asks show up in this Slack thread, but no alert or
  scheduled report has ever been posted anywhere, and the PlatformAgent
  shows the condition HomeChannelUnset. Why is that, and how do I set the
  home channel?
expected_output: >-
  The answer says the install has no home channel: a reply into the thread
  that asked needs none, which is why those arrive, while an alert or a
  scheduled report goes to the home channel and is not delivered until one
  is set (the gateway then posts one notice of what it could not place). It
  tells the operator how to set one, as a setting named in words, in at
  least one of these forms:
  mention the agent once, top-level, in the Slack channel it should use; set
  SLACK_HOME_CHANNEL in install.env and run upgrade.sh; set
  spec.integration.slack.homeChannel on the PlatformAgent; or pick it on the
  app's Home tab. It does not offer to open a pull request or an overlay for
  it, gives no kubectl command or manifest to patch or edit the PlatformAgent,
  and posts no test notification to check the routing.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml: a question about the install, routed and
# answered, is the chat-and-routing journey.
domain: chat-and-routing

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: lapis2002

# The answer is knowledge: a run that answers with no tool call is graded on
# the reply (docs/designs/bench-case-format.md).
tool_calls_optional: true

verification_spec:
  # assert, not the converge default: the transcript is immutable once the
  # run ends, so polling a failed check would only wait out the timeout.
  #
  # The two halves of the answer. First, thread replies need no home channel:
  # a reply, thread or conversation word joined to a needs-no-home-channel
  # shape ("without", "need no", "don't need", "does not require",
  # "regardless of", "whether or not", "not tied to"), in either order; or to
  # a still-works shape: a verb of arriving after "still", "automatically",
  # "normally" or "continue to" with no negation between, or before
  # "automatically", "normally", "still" or "unaffected", or "remains
  # unaffected". A gap never crosses a semicolon, or a comma that opens a
  # contrast or a second clause (", but", ", while", ", and"); it may cross a
  # period or a relative ", which", since the answers name the route in one
  # sentence and its property in the next. So "replies arrive, but alerts
  # still fail" and "replies show up in this thread, while alerts do not
  # work without a home channel" restate the symptom and do not pass, and
  # "alerts still do not arrive" is the opposite and does not pass.
  # Second, a way to set one: the PlatformAgent field, the install.env
  # variable, the Home tab, or a mention of the agent in a channel. The text
  # is lowercased before the patterns run and the apostrophe is normalized to
  # the straight one.
  - name: the-answer-explains-the-routes-and-names-a-way-to-set-the-home-channel
    role: objective
    mode: assert
    check:
      type: report_contains
      required_patterns:
        - '(?i)(?:repl(?:y|ies)|thread|conversation)(?:[^;,\n]|,(?!\s*(?:but|while|whereas|yet|however|though|although|and)\b)){0,160}(?:without|not need|needs? no|need no|don''t need|do not need|doesn''t need|does not need|not require|requires? no|regardless of|even without|independent of|with or without|whether or not|no matter|not tied to)(?:[^;,\n]|,(?!\s*(?:but|while|whereas|yet|however|though|although|and)\b)){0,40}home (?:channel|space)|(?:without|regardless of|whether or not|no matter|even without)(?:[^;,\n]|,(?!\s*(?:but|while|whereas|yet|however|though|although|and)\b)){0,30}home (?:channel|space)(?:[^;,\n]|,(?!\s*(?:but|while|whereas|yet|however|though|although|and)\b)){0,160}(?:repl(?:y|ies)|thread|conversation)|(?:repl(?:y|ies)|thread|conversation)(?:[^;,\n]|,(?!\s*(?:but|while|whereas|yet|however|though|although|and)\b)){0,80}\b(?:still|automatically|normally|continues? to)\b(?:(?!\b(?:not|never|no|cannot|can''t|don''t|doesn''t|won''t|fail\w*)\b)(?:[^;,\n]|,(?!\s*(?:but|while|whereas|yet|however|though|although|and)\b))){0,40}\b(?:route|arrive|work|function|deliver|receive|land|post|reach)|(?:repl(?:y|ies)|thread|conversation)(?:[^;,\n]|,(?!\s*(?:but|while|whereas|yet|however|though|although|and)\b)){0,80}\b(?:route|arrive|work|function|deliver|receive|land|post|reach)\w*(?:[^;,\n]|,(?!\s*(?:but|while|whereas|yet|however|though|although|and)\b)){0,20}\b(?:automatically|normally|still|as before|anyway|regardless|successfully|unaffected)\b|(?:repl(?:y|ies)|thread|conversation)(?:[^;,\n]|,(?!\s*(?:but|while|whereas|yet|however|though|although|and)\b)){0,60}\b(?:remains?|stays?|are|is)\b(?:[^;,\n]|,(?!\s*(?:but|while|whereas|yet|however|though|although|and)\b)){0,10}\b(?:unaffected|unchanged)\b'
      any_of_patterns:
        - '(?i)spec\.integration\.(?:slack|googlechat)\.homechannel'
        # The surface drops underscores, so the variable names read as one
        # word there.
        - "(?i)(?:slack|google_?chat)_?home_?channel"
        - '(?i)\bhome tab\b'
        - '(?i)(?:mention(?:ing)?\b[^\n]{0,20}\b(?:agent|bot|app|me)\b|top-level mention)[^\n]{0,60}\b(?:channel|space)\b'
      forbidden_patterns:
        # The agent offering to make the change itself: an offer shape (a
        # modal or "would you like me to", not followed by a negation or
        # "only") with an opening verb and a pull request or overlay in the
        # same clause, or a gerund ("raising the chat-egress overlay PR")
        # not followed by a negation. A refusal ("I can't open a pull
        # request for this", "opening a pull request will not reach it") is
        # the right answer and passes. Or a kubectl write to the
        # PlatformAgent handed to the operator, flags before the verb
        # included.
        - '(?i)\b(?:i(?:''ll| will| can| could| am going to|''m going to)|let me|would you like me to|want me to|shall i|should i)\b(?!''t\b| not\b| never\b| no\b| only\b)(?:[^;,\n]|,(?!\s*(?:but|while|whereas|yet|however|though|although|and)\b)){0,40}\b(?:open|rais|creat|fil|submit|put up)\w*\b(?:[^;,\n]|,(?!\s*(?:but|while|whereas|yet|however|though|although|and)\b)){0,20}\b(?:pull request|pr|overlay)\b'
        - '(?i)\b(?:raising|opening|creating|filing|submitting)\b(?:[^;,\n]|,(?!\s*(?:but|while|whereas|yet|however|though|although|and)\b)){0,30}\b(?:pull request|pr|overlay)\b(?!(?:[^;,\n]|,(?!\s*(?:but|while|whereas|yet|however|though|although|and)\b)){0,30}\b(?:not|never|no|cannot|can''t|won''t|does not|doesn''t|is not)\b)'
        - '(?i)\bkubectl\b[^\n]{0,60}\b(?:patch|edit|apply|replace)\b'
  # The probe that cost 35 minutes: a notification posted to test the
  # routing, by the platform worker, so the workers' scope, under both names
  # a worker's trajectory records the tool as.
  - name: no-notification-was-posted-to-test-the-routing
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        - type: tool_called
          scope: workers
          tool_names:
            - mcp_platform_control_send_notification
            - mcp__platform_control__send_notification
