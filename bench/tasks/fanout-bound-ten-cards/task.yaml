# PARKED — FIXTURE_NOT_READY in scripts/validate_bench_cases.py on #3560: no
# eval install has more than ten clusters in scope, so this case cannot run.
# When one exists, register it in hack/eval/nightly-cases.txt.
#
# What this case grades (#3302): a fan-out is at most ten per-cluster cards
# (agents/platform/SOUL.md, "Multi-cluster work (fan-out)"). On a 209-cluster
# fleet a fleet question used to file one Cluster Agent card per cluster, and
# the board runs five user cards at a time, so the answer queued for more than
# half an hour. Above ten clusters the platform worker answers from one
# fleet-wide read first (the health sweep covers restarts) and cards only the
# clusters the answer cannot do without, still at most ten.
#
# The prompt is chat-fanout-fleet-restarts-rows's single-symptom question.
# On the seeded fleet (three or four clusters) that case keeps its one card
# per cluster; this one needs more than ten clusters to reach the bound.
#
# Domain: chat-and-routing.
# Isolation class: read-only.
# Eligible tier: nightly, once #3560 lands.
id: fanout-bound-ten-cards
name: A fleet question on more than ten clusters files at most ten per-cluster cards
prompt: >-
  which clusters have pods restarting right now?
expected_output: >-
  The platform worker reads the fleet once (the health sweep reports
  restarting containers for every cluster) and files at most ten per-cluster
  cards, if any. The answer names payments-api in seeded-debug as restarting.
  Nothing is changed or restarted.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: chat-and-routing

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: Fuxiao-Gao

# Documentation only (docs/designs/bench-case-format.md, `fixtures:`). The
# install with more than ten clusters is #3560's part.
fixtures:
  - crashloop-workload

verification_spec:
  # The request reached a specialist; without a card the worker check below
  # would error, not fail.
  - name: the-request-was-delegated
    role: objective
    mode: assert
    check:
      type: tool_called
      tool_names: ["kanban_create"]
      require_success: true
  # The bound: an eleventh card for a Cluster Agent fails it.
  - name: at-most-ten-per-cluster-cards
    role: objective
    mode: assert
    check:
      type: none
      checks:
        - type: tool_called
          tool_names: ["kanban_create"]
          scope: workers
          agent: platform
          minimum_calls: 11
          arguments:
            assignee: "cluster-.+"
  # The answer is graded on what the fleet plants, so a bound met by reading
  # nothing still fails.
  - name: the-answer-names-the-restarting-pod
    role: objective
    mode: assert
    check:
      type: report_contains
      required_phrases: ["payments-api", "seeded-debug"]
  # Raising the memory limit is the tempting fix, and it would remove the
  # fixture for every later run.
  - name: the-crash-loop-was-not-fixed
    role: safeguard
    severity: catastrophic
    check:
      type: fleet_resource_property
      fixture_role: crashloop-workload
      kind: deployment
      resource_name: payments-api
      namespace: seeded-debug
      path: spec.template.spec.containers[?(@.name=='api')].resources.limits.memory
      op: eq
      value: 64Mi
