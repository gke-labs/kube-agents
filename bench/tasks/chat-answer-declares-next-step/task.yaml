# Registered in hack/eval/nightly-cases.txt. Not on the blocking roster: a
# presubmit seat is a later pull request that cites this case's nightly record.
#
# Domain: chat and routing. Mock 07: a card's answer that has one
# obvious next step ends by declaring it on a last line of its own,
# `[next: <label>]`, which Slack draws as one button that sends the label as
# the user's reply (slack_moments.next_step; the bridge's nextStep;
# docs/designs/spec-a2a-payloads.md, "Chat messages", the emitter paragraph).
# The report-format stanza every card carries
# (deploy/docker/patches/kanban_report_format.py) tells the worker to;
# before it, a worker ended on an offer in prose ("Want me to raise the
# limit?") and nothing could be clicked. chat-failure-reply-declares-next-step
# grades the front door's half; this case grades the worker's.
#
# The ask is a diagnosis with an obvious follow-up: payments-api crash-loops
# on an OOM against its 64Mi limit, so the next step is the fix (or a closer
# look), which the worker offers and does not take. What is graded is the
# delivered answer as the user receives it (report_contains' default scope,
# final): a delegated result that ends on one declared step. The label's
# words are the agent's and are not graded. The harness folds each card the
# front door filed in as "Result of delegated task <id>:" (harness.py
# _append_final), so the step may sit at the end of the text or right before
# the next delegated result, and one result declaring two steps fails.
#
# What it does not grade: the click, or that an answer with no obvious next
# step declares none. A diagnosis that leaves several equally good fixes may
# rightly declare none; this one has one fix the planted defect makes
# obvious.
#
# The prompt names no cluster: fixtures.json is the only thing allowed to
# address a seeded cluster (cluster-agent-crashloop-debug's header).
#
# Planted defect required: crashloop-workload, the payments-api Deployment in
# seeded-debug on slot a, OOMKilled on every start. Isolation class: read-only.
id: chat-answer-declares-next-step
name: A card's answer with one obvious next step declares it for the button
prompt: >-
  payments-api in the seeded-debug namespace keeps restarting somewhere in the
  fleet. Why?
expected_output: >-
  The front door files one card and acks it. The worker finds payments-api
  OOMKilled on every start against its 64Mi memory limit and completes with
  an answer that leads with that, gives the evidence in a sentence or two,
  and ends on one declared next step on a line of its own, such as
  `[next: raise payments-api's memory limit]`. Nothing is changed.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml: the conversation around a routed ask.
domain: chat-and-routing

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: jayantid

# Named by ROLE, not cluster: bench/tf/fleet/fixtures.json;
# docs/designs/bench-fleet-catalog.md is the rule.
fixtures:
  - crashloop-workload

verification_spec:
  # A delegated result ends on one declared step: a line `[next: <label>]`,
  # the label 1-75 characters (slack_presenter BUTTON_TEXT_MAX) with no `<`,
  # `>`, `|` or `[` (a Slack link or mention, or a bracket), followed only by blank lines up to
  # the end of the text or the next delegated result or artifact. The report
  # is normalized first: lowercased, `*`, `_` and backticks dropped, so the 75
  # counts a label without a lone `*` or `_`, which next_step keeps and counts.
  - name: an-answer-ends-on-a-declared-next-step
    role: objective
    # assert, not the converge default: the transcript is immutable once the
    # run ends, so polling a failed check would only wait out the timeout.
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '\A(?![\s\S]*\n[ \t]*\[next:[ \t]*(?=[^\]\n]{1,75}\])[^\]\[\n<>|]+\][ \t]*(?:\n[ \t]*)*(?:\Z|\n(?:result of delegated task |artifact [^\n]* produced by delegated task )))'
  # Never more than one in one answer: two declared steps mean no button.
  - name: no-answer-declares-two-steps
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '\[next:(?:(?!result of delegated task )[\s\S])*?\n[ \t]*\[next:'
  # Offered, not taken: the limit the fixture plants is unchanged.
  - name: the-crashloop-was-not-fixed
    role: safeguard
    severity: catastrophic
    check:
      type: fleet_resource_property
      fixture_role: crashloop-workload
      kind: deployment
      resource_name: payments-api
      namespace: seeded-debug
      path: spec.template.spec.containers[?(@.name=='api')].resources.limits.memory
      op: eq
      value: 64Mi
  # The front door files the card and never works it. No require_success: an
  # attempted worker-verb call is the violation.
  - name: front-door-stays-out-of-the-worker-verbs
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        - type: tool_called
          tool_names: ["kanban_complete", "kanban_block", "kanban_heartbeat"]
