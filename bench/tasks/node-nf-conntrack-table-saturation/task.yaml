# Node OS, kubelet and auto-repair (gce-compute-fleet-audit): a node's
# connection tracking table is full, and the kernel drops new connections. A
# declared gap: expected_fail until the check lands (gke-labs/kube-agents#5409,
# which proposes `node-conntrack-saturation`).
# What a live test showed (2026-11-20, GKE Standard 1.35.8, one node, one
# minute): a fresh node used 432 of 131072 entries. With `nf_conntrack_max`
# lowered to just above the use, 400 new connections filled the table, and the
# kernel wrote "nf_conntrack: table full, dropping packet" 40 times; the line
# was in the node's serial console and in Cloud Logging within 90 seconds. No
# node condition and no event changed. GKE's system metrics have no series for
# the table, so a share of nf_conntrack_max cannot be read without a new data
# source, and the collection of the serial console log can be turned off for a
# cluster (node metadata `serial-port-logging-enable`) or for an organization
# (the constraint `compute.disableSerialPortLogging`), by GKE's logging and
# Autopilot troubleshooting pages. A real load at the default size was not
# tested.
# Nothing is planted. A fixture is possible: a privileged pod on a node of its
# own that lowers the limit and fills the table again and again. That repeating
# form was not run, and the fleet's owner has not been asked. The objective
# below keeps the form of the first plan, a finding on a default-pool node; it
# changes with the fixture decision. `fixtures: []`: the run plants nothing and
# reads no fixture, so no fixture's drift may excuse it; no safeguard reads a
# fixture because none exists. Domain `fleet-audits` as the other GCE compute
# cases.
# Isolation class: fleet-read-only, GitOps-repo write (the audit's ledger).
id: node-nf-conntrack-table-saturation
name: "Node conntrack table full (declared gap; nothing planted; a fixture waits for the fleet owner's decision)"
domain: fleet-audits
suite: validated-capabilities
suite_part: 2
expected_fail: true
audit_streams:
  - gce-compute-fleet-audit
fixtures: []
prompt: >-
  Run the gce-compute-fleet-audit audit across the fleet, following the
  gce-compute-fleet-audit SOP.
expected_output: >-
  Nothing planted. Customer failure: a node's conntrack table full, packets
  dropped; the kernel writes "nf_conntrack: table full, dropping packet" to the
  node's serial console. Validated needs a reader of that line, or of a count
  that GKE does not collect by default, and a fixture; the present objective
  accepts a finding that names the node's pool `default-pool`. The closing
  response is the SOP's one line with the ledger URL.
infrastructure:
  deployer: noop
validated: false

verification_spec:
  # One finding must carry both the check and the node's pool: the object of a
  # node finding carries the pool name inside the GKE node name. The three
  # slugs are the names the case accepts; the first is the one #5409 proposes.
  - name: ledger-files-conntrack-saturation-on-a-default-pool-node
    role: objective
    mode: assert
    check:
      type: ledger_issue_contains
      audit: gce-compute-fleet-audit
      scope: finding
      finding_check:
        [
          "node-conntrack-saturation",
          "nf-conntrack-exhaustion",
          "conntrack-table-full",
        ]
      any_of_phrases: ["default-pool"]
