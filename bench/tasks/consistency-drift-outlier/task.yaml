# BENCH_GITHUB_TOKEN, which is the credential the ledger_issue_contains
# objectives below read the published ledger issue with (A4).
#
# The A1/A4 path itself is proven — the 2026-08-26 run minted tokens, cloned
# *-infra workspaces and published ledgers for the sibling audits — but THIS
# stream has never completed a run: its one attempt died on endpoint 502s
# before any ledger was written.
#
# Domain: consistency (fleet-consistency-drift SOP). Journey per the
# strategy table: "Compares against the blueprint, not against its own
# recollection."
#
# CONTRADICTION WITH THE SOP, resolved in the SOP's favour: the SOP states
# there is no blueprint — "There is no Platform Master Blueprint, no
# standards document ... If you find yourself wanting an 'expected value'
# from outside the fleet, you have left this SOP." The baseline is the
# majority of comparable clusters, derived live. This draft tests what the
# SOP says; the strategy table's wording needs the fix.
#
# Planted defect required: with three comparable clusters on the seeded
# fleet, one differs on a majority facet — clusters a and b carry a master
# authorized-networks config and c has none, making c the outlier. NOTE: this scenario is the
# reason the seeded fleet needs THREE clusters, not two; two clusters have
# no majority and no outlier.
#
# NOT date-gated, unlike fleet-cost-idle-pool. The consistency SOP has no age
# threshold to wait out and drift-outlier is `available_from_day: 1` in
# docs/designs/fleet-fixtures.yaml, so a replant of the fixtures does not move
# this case's activation. Recorded here because the absence of a gate reads the
# same as a forgotten one.
# Isolation class: cluster-read-only, GitOps-repo write. NOT read-only, and
# the earlier claim that it was is the correction this line carries: step 0 of
# every fleet-audit stream (`audit_report.py start`) mints a repo-scoped
# GitHub token and clones the GitOps workspace named by the `Git Repo:` line
# of /opt/data/SETTINGS.md, and `finish` rewrites the ledger issue, opens
# remediation pull requests and closes findings that stopped reproducing.
# Presubmit-eligible because that write path is pinned per eval project to a
# throwaway GitOps repository, token-scoped -- see DRAFTS.md, activation
# blocker A1, now closed. Eligible tier: presubmit, and active there
# since 2026-08-25.
id: consistency-drift-outlier
name: Drift audit names the cluster that does not match its peers
# The prompt no longer asks for a summary in the final answer: the SOP's
# closing rule is one line that restates nothing, so asking for a summary
# asked the agent to break its own SOP in order to be graded. The findings go
# where the SOP puts them, and the verification reads them there.
prompt: >-
  Run the fleet consistency drift audit, following the
  fleet-consistency-drift SOP.
expected_output: >-
  The ledger issue names the outlier cluster and the facet on which it differs
  from the fleet majority, derives the baseline from the live fleet rather
  than any external standard, and says how many peers agree. The closing
  response is the SOP's one line, carrying the ledger URL in full.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: consistency

# The seeded-fleet defects this scenario asserts on, named by ROLE rather than
# by cluster: each eval project carries its own trio and this case has to run
# unchanged against all of them. Roles are defined in
# bench/tf/fleet/fixtures.json; the rule is
# docs/designs/bench-fleet-catalog.md.
fixtures:
  - drift-outlier

# Cluster C's name is a contract with bench/tf/fleet/ (the consistency
# outlier); the fleet stack owns the name and this spec must change with it.
verification_spec:
  # Graded against the LEDGER, not the chat reply: the fleet-consistency-drift
  # SOP mandates a one-line closing response that deliberately restates
  # nothing, so a report_contains check would fail a conformant run.
  #
  # scope: finding_ids, and that choice is the whole check. The ledger body's
  # rendered Scope table enumerates every audited cluster on every run, so
  # required_phrases: ["seeded-c"] against the body would pass a run that
  # swept the fleet and found nothing. The hidden delta block carries the
  # ids audit_report.py derived, "<check>.<cluster>.<namespace>.<object>", so
  # seeded-c appears there if and only if a finding was FILED against it.
  - name: a-finding-was-filed-against-the-outlier
    role: objective
    # assert, not the converge default: the ledger is written once, at
    # `finish`, before the run ends -- polling would only wait out the timeout.
    mode: assert
    check:
      type: ledger_issue_contains
      audit: fleet-consistency-drift
      scope: finding_ids
      required_phrases: ["seeded-c"]
      # Kept from the body-scoped version, because the collision survives the
      # move: "seeded-c" is a substring of the seeded-capacity namespace that
      # the stockout fixture plants on this same fleet, and an id's namespace
      # segment would carry it verbatim. A cluster-level drift finding has an
      # "_" namespace segment, so a drift id naming seeded-capacity means the
      # audit filed against a namespaced object in the capacity fixture --
      # nothing this scenario is about, and enough to satisfy the name check
      # for the wrong reason. Forbidding it removes the collision structurally
      # (the verifier has no proximity semantics).
      forbidden_phrases: ["seeded-capacity"]
  - name: an-authorized-networks-finding-was-filed
    role: objective
    mode: assert
    check:
      type: ledger_issue_contains
      audit: fleet-consistency-drift
      # Binds the finding to the planted difference (master authorized
      # networks: a and b carry an open-for-eval block, c has none -- c is
      # the outlier), so naming the right cluster for the wrong reason does
      # not score. That was the intent of the body-scoped version too, and on
      # the body it bound to nothing. `render_issue_body` always appends
      # `_render_check_evidence`, a {cluster, check, command} table over the
      # required `checks_run`, and "authorized-networks" is not merely a
      # substring of this stream's roster -- it IS a roster slug, verbatim.
      # A run that swept the fleet and filed nothing published the phrase in
      # its own evidence table and scored the objective. This was the worst of
      # the three body-scoped collisions: no near-miss, an exact match.
      #
      # scope: finding_ids fixes it the same way the check above is fixed.
      # `derive_finding_id` composes "<check>.<cluster>.<namespace>.<object>",
      # so the slug reaches the delta block only if a finding was FILED under
      # that check, and `_shorten_id` trims the longest segment and never the
      # leading check slug -- the phrase cannot be truncated away.
      #
      # The two prose spellings are dropped rather than kept as alternatives.
      # Ids are squeezed to [a-z0-9-] by `_id_segment`, so neither "authorized
      # networks" nor "masterAuthorizedNetworks" can ever appear in one; as
      # any_of alternatives under this scope they would be dead branches
      # implying a prose fallback that does not exist. The slug is the only
      # spelling this scope can see, and it is the reliable one.
      scope: finding_ids
      required_phrases: ["authorized-networks"]
  # No deterministic mutation safeguard, documented: the planted defect is a
  # GKE master authorized-networks facet, not a cluster object.
  # tool_called is structurally blind to worker mutations (the trajectory
  # carries only the delegating turn's calls), so the honest safeguard is
  # cluster state -- and this scenario's planted defect is not a Kubernetes
  # object, so there is no resource to assert on. The fleet's scheduled
  # reconcile owns the defect's integrity; a mutation here surfaces there.
