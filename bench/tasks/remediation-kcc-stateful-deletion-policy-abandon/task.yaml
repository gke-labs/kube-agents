# Registered in hack/eval/nightly-cases.txt.
#
# Domain: remediation (a change someone asked for, through the GitOps path).
# Journey: the user asks for a pre-merge review of a proposed production Config
# Connector SQLInstance manifest that lacks the mandatory
# `cnrm.cloud.google.com/deletion-policy: abandon` annotation and enables a
# public IPv4 address (`ipv4Enabled: true`). Existing Config Connector cases
# (`provisioning-kcc-cluster-without-crds-stops` and
# `fleet-audit-manifest-fix-names-stalled-config-connector`) only cover missing
# CRDs and stalled reconcilers; this probe checks that the agent flags both
# missing safeguards and leads with the requested verdict line (#1883, #7183).
#
# The objective reads a decision line (`VERDICT: MISSING-SAFEGUARDS`) with
# `fold_decoration: true`, forbids `VERDICT: SAFE-TO-MERGE`, requires the
# `cnrm.cloud.google.com/deletion-policy` annotation with `abandon`, and
# requires `ipv4Enabled: false` or private-only IP guidance.
# bench/tests/test_remediation_kcc_stateful_deletion_policy_abandon_verdict.py
# pins the pattern surface against positive and negative sample reports.
#
# Planted defect required: none. deployer: noop, no fixture, no cluster read.
# Isolation class: read-only (no cluster touched and no GitOps write requested).
# Tier: nightly (hack/eval/nightly-cases.txt).
id: remediation-kcc-stateful-deletion-policy-abandon
name: Config Connector SQLInstance manifest review flags missing deletion-policy abandon and public IP exposure

owner: fkc1e100
domain: remediation

prompt: |-
  Review this proposed production Config Connector manifest before we merge it into our GitOps repo:
  ```yaml
  apiVersion: sql.cnrm.cloud.google.com/v1beta1
  kind: SQLInstance
  metadata:
    name: prod-orders-db
  spec:
    databaseVersion: POSTGRES_15
    region: us-central1
    settings:
      tier: db-custom-4-16384
      ipConfiguration:
        ipv4Enabled: true
  ```
  Is this manifest safe to merge as-is for production, or is it missing mandatory deletion and network safeguards? Start your answer with `VERDICT: MISSING-SAFEGUARDS` or `VERDICT: SAFE-TO-MERGE`, then list the exact annotation and spec fixes required. Do not change anything.
expected_output: >-
  VERDICT: MISSING-SAFEGUARDS. The proposed production SQLInstance manifest is
  not safe to merge as-is. Add metadata.annotations with
  cnrm.cloud.google.com/deletion-policy: abandon (and
  cnrm.cloud.google.com/state-into-spec: absent) so deleting or pruning the
  manifest detaches the Cloud SQL instance instead of destroying it, and set
  spec.settings.deletionProtectionEnabled: true. Under
  spec.settings.ipConfiguration, set ipv4Enabled: false and configure a private
  network (privateNetworkRef) so the production database is not exposed on a
  public IPv4 address.
infrastructure:
  deployer: noop
validated: false

verification_spec:
  - name: the-review-flags-missing-deletion-policy-and-public-ip
    role: objective
    mode: assert
    check:
      type: report_contains
      required_phrases:
        - "cnrm.cloud.google.com/deletion-policy"
        - "abandon"
      required_patterns:
        - "(?m)^\\W*verdict:\\s*missing-safeguards\\b"
        - "(?m)cnrm\\.cloud\\.google\\.com/deletion-policy(?:[\\s\\S]{0,120}?)\\babandon\\b"
      any_of_patterns:
        - "\\bipv4enabled(?:\\s*[:=]\\s*true)?(?:\\s*[:=]\\s*|\\s+(?:to|as|must\\s+be|should\\s+be)\\s+)false\\b"
        - "\\b(?:disable|disabling|turn\\s+off)\\s+(?:the\\s+)?(?:(?:[a-z0-9_.-]+\\.)?ipv4enabled|public\\s+ip(?:v4)?)(?:\\s+address)?\\b"
        - "\\b(?:use|using|configure|configuring|require|requiring)\\s+(?:a\\s+)?(?:private(?:-only)?\\s+(?:ip(?:v4)?|network|vpc)|(?:[a-z0-9_.-]+\\.)?privatenetworkref)\\b"
        - "\\bwithout\\s+(?:a\\s+)?public\\s+ip(?:v4)?\\b"
      forbidden_patterns:
        - "(?m)^\\W*verdict:\\s*safe-to-merge\\b(?!(?:[^\\n]{0,40}\\b(?:does\\s+not|doesn't|is\\s+not|isn't|cannot|can't)\\b|\\s+(?:is\\s+(?:wrong|incorrect|unsafe|inappropriate)|would\\s+be\\s+(?:wrong|incorrect|unsafe))))"
        - "(?m)^\\W*verdict:\\s*missing-safeguards\\b[^\\n]*\\b(?:or\\s+safe-to-merge|safe-to-merge)\\b"
        - "(?m)^\\W*verdict:\\s*missing-safeguards[^\\n]*\\?"
        - "(?m)\\b(?:do\\s+not|don't|never|avoid)\\s+(?:set|setting|add|adding|use|using|configure|configuring)\\s+(?:the\\s+)?(?:metadata\\.annotations\\s+with\\s+)?cnrm\\.cloud\\.google\\.com/deletion-policy[\\s\\S]{0,120}?\\babandon\\b"
        - "(?m)cnrm\\.cloud\\.google\\.com/deletion-policy(?![^\\n.;]{0,60}\\b(?:does\\s+not|doesn't|will\\s+not|won't)\\s+abandon\\s+(?:the|this|your|its)\\b)[\\s\\S]{0,120}?(?:\\(\\s*not\\s+abandon\\s*\\)|\\b(?:not|never)\\s+(?:to\\s+|as\\s+)?abandon\\b|\\b(?:do\\s+not|don't|never)\\s+(?:set|use)\\s+(?:it\\s+to\\s+)?abandon\\b)"
        - "(?m)\\b(?:do\\s+not|don't|never|avoid)\\s+(?:(?:set|setting|change|changing|flip|flipping)\\s+(?:[a-z0-9_.-]*ipv4enabled)(?:\\s*[:=]\\s*true)?(?:\\s*[:=]\\s*|\\s+(?:to|as)\\s+)false|(?:disable|disabling|turn\\s+off|turning\\s+off)\\s+(?:the\\s+)?(?:[a-z0-9_.-]*ipv4enabled|public\\s+ip(?:v4)?)|(?:use|using|configure|configuring|require|requiring)\\s+(?:a\\s+)?(?:private(?:-only)?\\s+(?:ip(?:v4)?|network|vpc)|(?:[a-z0-9_.-]+\\.)?privatenetworkref))\\b"
        - "(?m)\\b(?:keep|leave)\\s+[a-z0-9_.-]*ipv4enabled(?:\\s*[:=]\\s*|\\s+(?:at|as)\\s+)true\\b"
      fold_decoration: true
  - name: front-door-stays-out-of-the-worker-verbs
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        # Same delegation-boundary safeguard as knowledge-grounding-sources-probe.
        - type: tool_called
          tool_names: ["kanban_complete", "kanban_block", "kanban_heartbeat"]
