# PARKED — FIXTURE_NOT_READY in scripts/validate_bench_cases.py on #6905: it
# needs a no-PDB workload of its own and a Config Sync reconciler on the seeded
# fleet. When they exist, register it in hack/eval/nightly-cases.txt.
# Case 1 of gke-labs/kube-agents#6343:
# the eval record for the post-merge check #6311 turned on.
#
# WHAT THIS GRADES. The verify-after-merge loop: once a no-pdb fix the install
# opened merges and is applied, the post-merge check notices the merge, sees
# the budget applied, waits out the health window, re-runs the audit's check,
# stores `verified_fixed` in Session KV's post_merge_records and reports it.
# CI installs run the check `silent` (hack/ci-deploy.sh), so the report is a
# `silent:` stamp and no comment: a `report` install would comment on every
# agent pull request a tick finds merged, writes no other case asked for. The
# comment's text is post_merge_report's unit tests' to cover.
#
# WHAT THE HARNESS PLAYS. post_merge_outcome (bench/kube_agents_bench/
# post_merge.py) merges the agent's pull request with a token the ledger App
# mints for the job's GitOps repository (hack/ci-eval-pr.sh), because nothing
# merges inside a run; waits, up to five minutes, for Config Sync on the
# fixture's cluster to apply the budget, as observed by the budget appearing
# (bench/tf/fleet/post-merge-sync.tf); and runs the `post-merge-check` cron
# job's script back to back in the agent container rather than waiting on its
# five-minute schedule. The schedule itself is graded: the check requires the
# job in the platform profile's jobs.json. The harness writes nothing to the
# cluster. Afterwards it reverts the merged file on the default branch.
#
# THE SETUP. The fixture is budgeted at steady state: order-ledger-pdb.yaml is
# merged and Config Sync keeps it applied, so no other audit finds it. This
# case's stack (bench/tf/prebuilt/post-merge-sync-budget) removes the file and
# waits for the prune before the agent runs, and its destroy, after the
# checks on every path, puts the seeded file back and waits for the budget.
# A run killed between the two leaves the file off; the repository reset
# before the next writer unit (hack/ci_reset_agent_pulls.py) puts it back.
# The case requests a pull request, so it runs in the fan-out's writers
# phase, one unit at a time after every other unit (unit_phase in
# hack/ci-eval-pr.sh), and no other case reads the namespace while the
# budget is off.
#
# RED BEFORE #6311. Without that change the platform profile has no
# post-merge-check job, so the check fails at that gate, before it merges
# anything; nor does post_merge_check.py take a tick that could store an
# outcome.
#
# THE FIXTURE is order-ledger in seeded-post-merge (post-merge-sync-workload),
# which only this case uses: checkout-gateway, which eight cases read as
# unbudgeted, is never merged or applied. The audit writes order-ledger's
# budget beside its declaration, in the directory Config Sync syncs, and
# `remediate` opens it. The prompt asks for that one fix, so the reply names
# one pull request. hack/ci-deploy.sh sets KUBEAGENTS_POST_MERGE_CHECK=silent
# on every CI install, so the pr_opened plugin records the fix.
#
# Isolation class: writes the ledger issue and one remediation pull request,
# which the harness merges and then undoes: each file the pull request touched
# goes back to its content at the base, and the merged pull request loses its
# audit: labels so the next audit does not bind the finding to it. Plus the
# setup's removal and restore of order-ledger-pdb.yaml, which Config Sync
# prunes and applies in seeded-post-merge.
#
# THE RECIPE'S CASE. This is no-pdb's primary end-to-end case: its recipe.yaml
# names it (eval_case), and the check grades a record of that kind (recipe:
# no-pdb). bench/tests/test_recipe_eval_cases.py holds the link.
#
# THE RECIPE'S CASE. This is no-pdb's primary end-to-end case: its recipe.yaml
# names it (eval_case), and the check grades a record of that kind (recipe:
# no-pdb). bench/tests/test_recipe_eval_cases.py holds the link.
#
# ONE FIX, THIS RUN'S. post_merge_outcome merges the single pull request the
# reply names, and needs the record this install's pr_opened plugin wrote for
# it. So the case accepts no earlier run's pull request (no
# accepts_stream_pull_request): the reset closes those before each unit, and
# a reply that names two errors the repetition rather than grading it.
id: post-merge-verified-fixed
name: A merged no-pdb fix is verified fixed and reported once
prompt: >-
  Run the workload reliability audit against the fleet, following the
  obtainability-audit SOP. Then open the PodDisruptionBudget the audit wrote
  itself for the order-ledger Deployment in the seeded-post-merge namespace
  as a remediation pull request: I am asking for that fix directly, so use
  the fleet-audit skill's `remediate` command if `finish` did not open it.
  Open no other remediation pull request. Put the URL of that pull request
  on your closing line after the ledger URL.
expected_output: >-
  The audit writes a PodDisruptionBudget for order-ledger in
  seeded-post-merge and opens it as a remediation pull request whose URL the
  closing line carries. Once that pull request merges and the budget is
  applied, the install's post-merge check records the fix as verified_fixed
  and reports it silently, with no comment on the pull request.
audit_streams: [obtainability-audit]
infrastructure:
  deployer: "tofu"
  provider: "gcp"
  stack: "prebuilt/post-merge-sync-budget"
  teardown: true
  # gitops_repo, bench_gitops_write_token_file and host_cluster_* arrive from the
  # environment (TF_VAR_*, exported by hack/ci-eval-pr.sh).
validated: false

domain: reliability

owner: jayantid

fixtures:
  - post-merge-sync-workload

verification_spec:
  # One fail-fast sequence: pull_request_opened checks that the reply names a
  # pull request from this run before post_merge_outcome merges, waits for and
  # ticks it, so a run that opened no pull request is a graded fail at the
  # first leaf, not a post_merge_outcome setup error at the coverage rung.
  # One assert call of the second leaf does the merge, the sync wait and the
  # ticks; see the header.
  - name: the-merged-fix-is-verified-fixed-and-reported-silently
    role: objective
    mode: assert
    check:
      type: sequence
      checks:
        - type: pull_request_opened
          owner: gke-agentic
        - type: post_merge_outcome
          owner: gke-agentic
          outcome: verified_fixed
          report: silent
          apply_fixture_role: post-merge-sync-workload
          synced_directory: clusters/*-a/seeded-post-merge
          synced_namespace: seeded-post-merge
          recipe: no-pdb
