# WHAT THIS GRADES: a `/session` turn that asks for an AgentProfile by name
# delegates to that profile, not to the platform agent (#5191). The session's
# `delegate` tool names the agents the turn may delegate to, each with its
# description and parameters, from the per-turn list the gateway attaches
# (#5192, #5194). Before that, the tool's addressee was the fixed text "Today
# only \"platform\"", and a session asked for a profile delegated to
# platform or filed a Kanban card instead.
#
# The profile is `tse`, the built-in GKE support specialist every next-mode
# eval install renders (`profiles.tse.enabled=true`, hack/ci-deploy.sh), so the
# case needs no fixture and creates no profile. It is unpinned and takes no
# target, so the delegation records it as `tse`.
#
# What is checked is whom the chain delegated to, read from the inject read
# route's `childAddressees` (`delegated_to`, #5340). The answer's wording
# depends on what the tse agent finds, so it is left to the judge.
#
# TRANSPORT: inject only, against a `spec.mode: next` install, where the
# gateway routes `/session ...` to a session pod. The api transport has no
# delegation chain to read, so `delegated_to` errors there.
#
# DISPATCHER: the tse child runs only where the AgentProfile dispatcher does.
# Without it the child never starts, the run ends on the gateway's first-event
# grace as an infrastructure failure, and the check errors. The CI next lane
# gets the dispatcher from #5394, which registers this case in the nightly and
# on hack/eval/api-lane-exclusions.txt; until then it is KNOWN_UNREGISTERED.
id: session-delegates-to-the-profile-asked-for
name: A session asked for an agent profile by name delegates to that profile
prompt: >-
  /session ask the tse agent to check whether any pods in the kube-system
  namespace are failing, and tell me what it finds
expected_output: >-
  The session delegates the question to the tse agent profile, not to the
  platform agent, and then answers with what the tse agent reported about the
  kube-system pods: which are failing and why, or that none are.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml: a chat question routed to the agent that
# can answer it.
domain: chat-and-routing

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: bnaylor

verification_spec:
  - name: the-session-delegates-to-the-named-profile
    role: objective
    # assert, not the converge default: the record is fixed once the run
    # ends, so polling a failed check would only wait out the timeout.
    mode: assert
    check:
      type: delegated_to
      required_addressees: ["tse"]
