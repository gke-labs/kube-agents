---
id: first-install-hello-running
name: The first-install hello, scan still running, is short, read-only and asks one thing

# The greeting a new user gets on their first chat turn after install, while the
# first-look scan is still running: who it is in one word, that it only reads,
# where the results will appear, that changes come as reviewed pull requests,
# an invitation to share runbooks, and one question
# (agents/chat/defaults/onboarding/scan_in_progress.md). The stack arms the bootstrap_onboarding plugin's eval seam, because
# the bench reaches the agent over the API server, which the real greeting
# excludes, on an install that greeted long ago.

fixtures: []

infrastructure:
  deployer: "tofu"
  provider: "gcp"
  stack: "prebuilt/first-install-hello"
  teardown: true
  variables:
    case_suffix: "running"
    variant: "in_progress"
    # A substring of the prompt below and of no other case's prompt.
    phrase: "just installed you"

validated: false

domain: chat-and-routing

owner: jayantid

prompt: "hi! priya here, just installed you"

expected_output: |
  critical requirements:
  - One short message that opens "Hi there", because the API server carries no
    Slack profile name and the typed "priya" is not one, and introduces itself as kube-agents,
    with no internal agent names and no architecture.
  - It says it is taking a first look at the GKE fleet and only reading, so
    nothing in the clusters changes, and that it will post what it finds in
    this chat when it is done, without promising a time.
  - It says any change it thinks should be made comes as a pull request for the
    team to review.
  - It invites the team to share their runbooks here, as a statement,
    not a question.
  - It ends on exactly one question, an offer of what to look at first. It asks
    for nothing else: no SOPs, governance or time zone, and no question
    about runbooks.
  - It does not claim to have saved or remembered anything, list what it can
    do, apologise, or use hype.

verification_spec:
  # Every check reads the final message, so each sets `mode: assert`: the reply
  # cannot change once the run ends, and polling a failed phrase check would
  # only wait out the timeout. Phrases are forgiving substrings over the
  # lowercased, emphasis-stripped reply; patterns are re.search over it.

  # The name comes from the Slack profile only. The API server carries none, so
  # the prompt's typed "priya" must not be used and the fallback applies.
  - name: greets-with-the-fallback-without-a-profile-name
    role: objective
    mode: assert
    check:
      type: report_contains
      required_phrases: ["hi there"]
      forbidden_phrases: ["priya"]
      # ...and opens on it, not "hi there" somewhere later.
      forbidden_patterns: ['\A(?!\s*hi there)']

  - name: says-it-is-kube-agents
    role: objective
    mode: assert
    check:
      type: report_contains
      required_phrases: ["kube-agents"]

  - name: says-it-only-reads
    role: objective
    mode: assert
    check:
      type: report_contains
      any_of_phrases:
        [
          "read-only",
          "only reading",
          "only read",
          "nothing in your clusters",
          "won't change",
          "nothing changed",
          "not changing",
        ]

  - name: says-changes-come-as-pull-requests
    role: objective
    mode: assert
    check:
      type: report_contains
      any_of_phrases: ["pull request", "as a pr", "a pr for"]

  # The two results checks read the reply with the invitation, "Share your
  # team's runbooks here", taken out: the patterns step over it whole,
  # so a word inside it is never reached however it is joined to the rest.
  # It carries "share" and "here", so on the whole reply it satisfied both
  # with no results sentence present. Each pattern is forbidden when its word
  # appears nowhere else, which is a required pattern.
  - name: says-results-will-be-posted
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '\A(?!(?>share\s+your\s+team[''’]s\s+runbooks\s+here|(?!share\s+your\s+team[''’]s\s+runbooks\s+here)[\s\S])*?(?!share\s+your\s+team[''’]s\s+runbooks\s+here)\b(?:post(?:s|ed|ing)?|shar(?:e|es|ed|ing)|send(?:s|ing)?)\b)'

  - name: says-results-come-to-this-chat
    role: objective
    mode: assert
    check:
      type: report_contains
      # main's list: a space before "here" and a mark after it, so neither
      # "there" nor "here's" or "here?" counts. A line break counts as the
      # space or the mark: main matched a reply collapsed to one line, and
      # these patterns run line by line.
      forbidden_patterns:
        - '\A(?!(?>share\s+your\s+team[''’]s\s+runbooks\s+here|(?!share\s+your\s+team[''’]s\s+runbooks\s+here)[\s\S])*?(?!share\s+your\s+team[''’]s\s+runbooks\s+here)(?:\shere(?:[ .,!;:)]|\n)|\(here\)|this\s+chat))'

  # The one standing invitation: the prompts' sentence, "Share your team's
  # runbooks here", ended by ".", "!" or "…" past any
  # closing bracket or quote, never "?". The reply is lowercased; any run of
  # whitespace and either apostrophe match. A required pattern, like the
  # results checks. A reworded invitation fails it, which is the accepted cost
  # of a check whose words cannot leak into the others; so does the invitation
  # joined to the closing question by a comma or a dash, which no-stacked-asks
  # also fails, though it asks nothing about runbooks.
  # Known limits of lexical checks, left to the judge's expected output and
  # the prompt rule: a question that never names runbooks ("Do you have
  # any?"), or that holds an abbreviation ending in a period other than
  # "e.g." and "i.e." ("etc.") or an ellipsis typed as three periods ("Any
  # runbooks here... I should read first?"), passes no-stacked-asks.
  - name: invites-runbooks
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '\A(?![\s\S]*?\bshare\s+your\s+team[''’]s\s+runbooks\s+here[)\]"''”’]*(?:[.!…]|(?=\n)|\Z))'

  - name: asks-one-question-and-ends-on-it
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        # Two question marks: homework, not an offer.
        - '\?[\s\S]*\?'
        # The last character is not a question mark.
        - '[^?\s]\s*\Z'

  - name: at-most-sixty-words
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_patterns: ['\A\s*(?:\S+\s+){60}\S']

  - name: no-architecture
    role: safeguard
    severity: recoverable
    mode: assert
    check:
      type: report_contains
      forbidden_phrases:
        [
          "planning agent",
          "platform agent",
          "cluster agent",
          "specialist",
          "kanban",
          "hierarchy",
        ]

  - name: no-stacked-asks
    role: safeguard
    severity: recoverable
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '\bsops?\b'
        - "time ?zone"
        - "governance"
        # A runbook question: the word in any spelling, then a "?" before
        # the sentence ends. A sentence ends at ".", "!", "?" or "…" before
        # a space or the end, past any closing bracket or quote; a dot inside
        # a word (v1.2, runbooks.md) or in "e.g." or "i.e." does not end it.
        # A line break ends it too. This is the segment model of
        # obtainability-design-quota-vs-capacity with those additions.
        - 'run[ -]?book(?:\b(?:e\.g|i\.e)\.|[^.!?…\n]|[.!?…](?![)\]"''”’]*(?:\s|\Z)))*\?'

  # The prompts ban promising to follow the team's runbooks, which nothing
  # does. The invitation must name runbooks, so no-stacked-asks only catches a
  # runbook sentence with a "?"; this catches the promise itself: follow,
  # apply or use as a verb (not "useful", "users" or "used to"), then up to
  # three words, then runbooks.
  - name: no-runbook-promise
    role: safeguard
    severity: recoverable
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '\b(?:follow(?:s|ed|ing)?|appl(?:y|ies|ied|ying)|us(?:e|es|ing))\s+(?:[\w''’-]+\s+){0,3}run[ -]?books?\b'

  - name: claims-no-save
    role: safeguard
    severity: recoverable
    mode: assert
    check:
      type: report_contains
      forbidden_patterns: ['\b(saved|remember(ed)?|noted|stored)\b']

  - name: no-capability-list
    role: safeguard
    severity: recoverable
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '(?m)^\s*(?:[-•]|\d+[.)])\s'
        # A second line of text: the prompt asks for one message of at most
        # 60 words in plain sentences, which is one paragraph. The normaliser
        # deletes `*`, so a `*` bullet cannot be told from an indented line;
        # counting lines needs neither, and catches a list whatever opens it.
        - '\S[^\n]*\n\s*\S'
        - "i can help( you)? with"

  - name: no-apology-hype-or-filler
    role: safeguard
    severity: recoverable
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '\b(sorry|apologi[sz]e)'
        - '\b(excited|thrilled|delighted|supercharge|seamless)'
        - "let me know"
        - "good (morning|afternoon|evening)"
