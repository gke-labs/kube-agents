---
id: first-install-hello-running
name: The first-install hello, scan still running, is short, read-only and asks one thing

# The greeting a new user gets on their first chat turn after install, while the
# first-look scan is still running: who it is in one word, that it only reads,
# where the results will appear, that changes come as reviewed pull requests,
# an invitation to share runbooks, and one question
# (agents/chat/defaults/onboarding/scan_in_progress.md). The stack arms the bootstrap_onboarding plugin's eval seam, because
# the bench reaches the agent over the API server, which the real greeting
# excludes, on an install that greeted long ago.

fixtures: []

infrastructure:
  deployer: "tofu"
  provider: "gcp"
  stack: "prebuilt/first-install-hello"
  teardown: true
  variables:
    case_suffix: "running"
    variant: "in_progress"
    # A substring of the prompt below and of no other case's prompt.
    phrase: "just installed you"

validated: false

domain: chat-and-routing

owner: jayantid

prompt: "hi! priya here, just installed you"

expected_output: |
  critical requirements:
  - One short message that opens "Hi there", because the API server carries no
    Slack profile name and the typed "priya" is not one, and introduces itself as kube-agents,
    with no internal agent names and no architecture.
  - It says it is taking a first look at the GKE fleet and only reading, so
    nothing in the clusters changes, and that it will post what it finds in
    this chat when it is done, without promising a time.
  - It says any change it thinks should be made comes as a pull request for the
    team to review.
  - It invites the team to share their runbooks here anytime, as a statement,
    not a question.
  - It ends on exactly one question, an offer of what to look at first. It asks
    for nothing else: no SOPs, governance or time zone, and no question
    about runbooks.
  - It does not claim to have saved or remembered anything, list what it can
    do, apologise, or use hype.

verification_spec:
  # Every check reads the final message, so each sets `mode: assert`: the reply
  # cannot change once the run ends, and polling a failed phrase check would
  # only wait out the timeout. Phrases are forgiving substrings over the
  # lowercased, emphasis-stripped reply; patterns are re.search over it.

  # The name comes from the Slack profile only. The API server carries none, so
  # the prompt's typed "priya" must not be used and the fallback applies.
  - name: greets-with-the-fallback-without-a-profile-name
    role: objective
    mode: assert
    check:
      type: report_contains
      required_phrases: ["hi there"]
      forbidden_phrases: ["priya"]
      # ...and opens on it, not "hi there" somewhere later.
      forbidden_patterns: ['\A(?!\s*hi there)']

  - name: says-it-is-kube-agents
    role: objective
    mode: assert
    check:
      type: report_contains
      required_phrases: ["kube-agents"]

  - name: says-it-only-reads
    role: objective
    mode: assert
    check:
      type: report_contains
      any_of_phrases:
        [
          "read-only",
          "only reading",
          "only read",
          "nothing in your clusters",
          "won't change",
          "nothing changed",
          "not changing",
        ]

  - name: says-changes-come-as-pull-requests
    role: objective
    mode: assert
    check:
      type: report_contains
      any_of_phrases: ["pull request", "as a pr", "a pr for"]

  - name: says-results-will-be-posted
    role: objective
    mode: assert
    check:
      type: report_contains
      # A required shape, written as a forbidden lookahead like the greeting
      # check above. A sentence counts only if it never names runbooks, so the
      # runbook invitation cannot stand in for it however it is worded.
      # Some such sentence says it will post, send, share or report.
      forbidden_patterns:
        - '\A(?![\s\S]*?(?:\A|[.?!;:\n\u2026\u2013\u2014\u2190-\u2bff\U0001f000-\U0001faff])(?![^.?!;:\n\u2026\u2013\u2014\u2190-\u2bff\U0001f000-\U0001faff]*run ?books?)[^.?!;:\n\u2026\u2013\u2014\u2190-\u2bff\U0001f000-\U0001faff]*?\b(?:post|send|share|report|let you know|update you))'

  - name: says-results-come-to-this-chat
    role: objective
    mode: assert
    check:
      type: report_contains
      # A required shape, written as a forbidden lookahead like the greeting
      # check above. A sentence counts only if it never names runbooks, so the
      # runbook invitation cannot stand in for it however it is worded.
      # Some such sentence puts the results here: a results word ("what I
      # find", "summary", "update") before "here" or "in this chat", or one of
      # those beside the scan finishing ("here when it's done").
      forbidden_patterns:
        - '\A(?![\s\S]*?(?:\A|[.?!;:\n\u2026\u2013\u2014\u2190-\u2bff\U0001f000-\U0001faff])(?![^.?!;:\n\u2026\u2013\u2014\u2190-\u2bff\U0001f000-\U0001faff]*run ?books?)[^.?!;:\n\u2026\u2013\u2014\u2190-\u2bff\U0001f000-\U0001faff]*?(?:\b(?:what i (?:find|see|learn)|findings?|results?|summary|update|report|picture|let you know)\b[^.?!;:\n\u2026\u2013\u2014\u2190-\u2bff\U0001f000-\U0001faff]*?\b(?:here|in (?:this|the) (?:chat|thread)|to (?:this|the) chat|back)\b|\b(?:here|in (?:this|the) (?:chat|thread)|to (?:this|the) chat|back)\b[^.?!;:\n\u2026\u2013\u2014\u2190-\u2bff\U0001f000-\U0001faff]*?\b(?:when|once|as soon as|after) (?:(?:it|the scan|i)(?:''s|''m| is| am)? )?(?:done|finish|complete|ready|wrap)|\b(?:when|once|as soon as|after) (?:(?:it|the scan|i)(?:''s|''m| is| am)? )?(?:done|finish|complete|ready|wrap)[^.?!;:\n\u2026\u2013\u2014\u2190-\u2bff\U0001f000-\U0001faff]*?\b(?:here|in (?:this|the) (?:chat|thread)|to (?:this|the) chat|back)\b))'

  # The one standing invitation, stated rather than asked.
  - name: invites-runbooks
    role: objective
    mode: assert
    check:
      type: report_contains
      # Any mention will do: no-stacked-asks fails one that asks.
      any_of_phrases: ["runbook", "run book"]

  - name: asks-one-question-and-ends-on-it
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        # Two question marks: homework, not an offer.
        - '\?[\s\S]*\?'
        # The last character is not a question mark.
        - '[^?\s]\s*\Z'

  - name: at-most-sixty-words
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_patterns: ['\A\s*(?:\S+\s+){60}\S']

  - name: no-architecture
    role: safeguard
    severity: recoverable
    mode: assert
    check:
      type: report_contains
      forbidden_phrases:
        [
          "planning agent",
          "platform agent",
          "cluster agent",
          "specialist",
          "kanban",
          "hierarchy",
        ]

  - name: no-stacked-asks
    role: safeguard
    severity: recoverable
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '\bsops?\b'
        - "time ?zone"
        - "governance"
        # A question about runbooks, either spelling. Two shapes: the word, then
        # a question mark before its clause ends; or a clause that opens on a
        # question word and names runbooks. A period, semicolon, colon, dash,
        # ellipsis, emoji, " -- " or a comma join (", and") ends a clause, so the
        # invitation passes however it meets the closing question; one of them
        # directly before the "?" ends nothing. A question that never names
        # runbooks ("Do you have any?") is beyond a phrase check; the judge's
        # expected output covers it.
        - 'run ?books?(?:(?!,\s*(?:and|but|so|or|then|plus)\s|\s--?\s)[^.?!;:\n\u2026\u2013\u2014\u2190-\u2bff\U0001f000-\U0001faff]|[.?!;:\n\u2026\u2013\u2014\u2190-\u2bff\U0001f000-\U0001faff](?=\s*\?))*\?'
        - '(?:\A|[.?!;:\n\u2026\u2013\u2014\u2190-\u2bff\U0001f000-\U0001faff]|,\s*(?:and|but|so|or|then|plus)\s|\s--?\s)\s*(?:could|can|would|will|do|does|did|have|has|is|are|any|what|where|which|how|should|may|might)\b(?:(?!,\s*(?:and|but|so|or|then|plus)\s|\s--?\s)[^.?!;:\n\u2026\u2013\u2014\u2190-\u2bff\U0001f000-\U0001faff])*run ?books?'

  - name: claims-no-save
    role: safeguard
    severity: recoverable
    mode: assert
    check:
      type: report_contains
      forbidden_patterns: ['\b(saved|remember(ed)?|noted|stored)\b']

  - name: no-capability-list
    role: safeguard
    severity: recoverable
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '(?m)^\s*(?:[-•]|\d+[.)])\s'
        # A second line of text: the prompt asks for one message of at most
        # 60 words in plain sentences, which is one paragraph. The normaliser
        # deletes `*`, so a `*` bullet cannot be told from an indented line;
        # counting lines needs neither, and catches a list whatever opens it.
        - '\S[^\n]*\n\s*\S'
        - "i can help( you)? with"

  - name: no-apology-hype-or-filler
    role: safeguard
    severity: recoverable
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '\b(sorry|apologi[sz]e)'
        - '\b(excited|thrilled|delighted|supercharge|seamless)'
        - "let me know"
        - "good (morning|afternoon|evening)"
