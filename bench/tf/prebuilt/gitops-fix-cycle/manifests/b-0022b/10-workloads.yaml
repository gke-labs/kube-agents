apiVersion: batch/v1
kind: CronJob
metadata:
  name: price-refresh
  namespace: storefront
  labels:
    app: price-refresh
    owner: storefront-team
spec:
  schedule: "*/1 * * * *"
  suspend: true
  successfulJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: price-refresh
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: price-refresh
        spec:
          restartPolicy: Never
          containers:
            - name: worker
              image: busybox:1.36
              args:
                - sh
                - -c
                - echo settlement report written && exit 0
