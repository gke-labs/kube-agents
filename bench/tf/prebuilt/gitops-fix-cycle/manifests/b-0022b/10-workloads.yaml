apiVersion: apps/v1
kind: Deployment
metadata:
  name: shelfview
  namespace: storefront
  labels:
    app: shelfview
    owner: storefront-team
spec:
  replicas: 0
  selector:
    matchLabels:
      app: shelfview
  template:
    metadata:
      labels:
        app: shelfview
        owner: storefront-team
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0
          args:
            - -listen=:8080
            - -text=ok
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 150m
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: shelfview
  namespace: storefront
  labels:
    app: shelfview
    owner: storefront-team
spec:
  selector:
    app: shelfview
  ports:
    - port: 80
      targetPort: 8080
---
