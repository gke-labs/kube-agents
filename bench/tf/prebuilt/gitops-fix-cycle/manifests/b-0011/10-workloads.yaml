apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-api
  namespace: ledger
  labels:
    app: ledger-api
    owner: ledger-team
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ledger-api
  template:
    metadata:
      labels:
        app: ledger-api
        owner: ledger-team
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0
          args:
            - -listen=:8080
            - -text=ok
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-api
  namespace: ledger
  labels:
    app: ledger-api
    owner: ledger-team
spec:
  selector:
    app: ledger-api
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Secret
metadata:
  name: credentials
  namespace: ledger
  labels:
    app: ledger-db
    owner: ledger-team
type: Opaque
stringData:
  password: changeme
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-db
  namespace: ledger
  labels:
    app: ledger-db
    owner: ledger-team
spec:
  clusterIP: None
  selector:
    app: ledger-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ledger-db
  namespace: ledger
  labels:
    app: ledger-db
    owner: ledger-team
spec:
  serviceName: ledger-db
  replicas: 3
  selector:
    matchLabels:
      app: ledger-db
  template:
    metadata:
      labels:
        app: ledger-db
        owner: ledger-team
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          args:
            - sh
            - -c
            - sleep 100000
          envFrom:
            - secretRef:
                name: credentials
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ledger-db-pdb
  namespace: ledger
  labels:
    app: ledger-db
    owner: ledger-team
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: ledger-db
