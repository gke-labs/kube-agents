# Stress beyond fair use for real-install-test-plan.md: 100 failing Pods for 30 minutes (an event
# storm), then a burst of brokered commands from 32 workers in the sandbox shell during the storm.
# Run with --only-factor combined.
phase: real-install-stress-load
target:
  host_cluster: scale-host
  host_location: us-central1-c
  namespace: kubeagents-system
  zone: us-central1-f
  cluster_prefix: scale-
  cluster_label: purpose=harness-scale
  mode: next
  data_file: harness-limits.json

base:
  clusters: 2
  nodes: 2
  objects: 100
  churn_per_minute: 10
  failing_pods: 1
  concurrent: 1
  listing_pods: 100
  proxy_concurrency: 1

factors:
  combined: [1]

combined:
  - clusters: 40
    objects: 1200
    churn_per_minute: 3
    failing_pods: 100
    proxy_concurrency: 32

settings:
  settle_seconds: 180
  pods_per_node: 60
  fixture_pool: scale-pool
  fixture_machine_type: e2-small
  default_pool_pods: 150
  test_cluster_machine_type: e2-standard-2
  churn_pod_lifetime_seconds: 30
  cluster_registration_timeout_seconds: 5400
  trigger_reconcile: true
  cluster_create_parallelism: 10
  watcher_wait_seconds: 600
  lease_ttl_minutes: 1440

operations:
  storm_100:
    kind: soak
    factors: [combined]
    runs: 1
    window_seconds: 1800
  proxy_burst:
    kind: proxy_load
    factors: [combined]
    runs: 1
    window_seconds: 300
    command:
      - kubectl
      - --kubeconfig
      - "{kubeconfig}"
      - get
      - pods
      - --all-namespaces
      - --no-headers
