# The real-install test (bench/scale/real-install-test-plan.md): one fleet point on a new install at the
# L container size. `runner apply real-install.yaml --factor combined --level 1` builds it; the
# questions and the first-run flow are driven and measured outside the plan's matrix.
# Step 6 of real-install-test-plan.md: the Step 1 fleet with 20 failing Pods for one hour, to see
# whether the event watcher's triage sessions grow without bound. Run with --only-factor combined.
phase: real-install-failing
target:
  host_cluster: scale-host
  host_location: us-central1-c
  namespace: kubeagents-system
  zone: us-central1-f
  cluster_prefix: scale-
  cluster_label: purpose=harness-scale
  mode: next
  data_file: harness-limits.json

base:
  clusters: 2
  nodes: 2
  objects: 100
  churn_per_minute: 10
  failing_pods: 1
  concurrent: 1
  listing_pods: 100

factors:
  combined: [1]

# 40 clusters of about 1,200 objects; about 3 Pods created per minute and 5 failing at once, an XL
# fleet's share for one install of 40 clusters, below the 10 to 30 failing Pods where sessions start.
combined:
  - clusters: 40
    objects: 1200
    churn_per_minute: 3
    failing_pods: 20

settings:
  settle_seconds: 180
  pods_per_node: 60
  fixture_pool: scale-pool
  fixture_machine_type: e2-small
  default_pool_pods: 150
  test_cluster_machine_type: e2-standard-2
  churn_pod_lifetime_seconds: 30
  cluster_registration_timeout_seconds: 5400
  trigger_reconcile: true
  cluster_create_parallelism: 10
  watcher_wait_seconds: 600
  lease_ttl_minutes: 1440

operations:
  failing_20:
    kind: soak
    factors: [combined]
    runs: 1
    window_seconds: 3600
