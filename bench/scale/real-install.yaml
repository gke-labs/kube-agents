# The real-install test (bench/scale/real-install-test-plan.md): one fleet point on a new install at the
# L container size. `runner apply real-install.yaml --factor combined --level 1` builds it; the
# questions and the first-run flow are driven and measured outside the plan's matrix.
phase: real-install
target:
  host_cluster: scale-host
  host_location: us-central1-c
  namespace: kubeagents-system
  zone: us-central1-f
  cluster_prefix: scale-
  cluster_label: purpose=harness-scale
  mode: next
  data_file: harness-limits.json

base:
  clusters: 2
  nodes: 2
  objects: 100
  churn_per_minute: 10
  failing_pods: 1
  concurrent: 1
  listing_pods: 100

factors:
  combined: [1]

# 40 clusters of about 1,200 objects; about 3 Pods created per minute and 5 failing at once, an XL
# fleet's share for one install of 40 clusters, below the 10 to 30 failing Pods where sessions start.
combined:
  - clusters: 40
    objects: 1200
    churn_per_minute: 3
    failing_pods: 5
  # Step 5's fair use: the same fleet with 2 and then 3 questions at once.
  - clusters: 40
    objects: 1200
    churn_per_minute: 3
    failing_pods: 5
    concurrent: 2
  - clusters: 40
    objects: 1200
    churn_per_minute: 3
    failing_pods: 5
    concurrent: 3

settings:
  settle_seconds: 180
  pods_per_node: 60
  fixture_pool: scale-pool
  fixture_machine_type: e2-small
  default_pool_pods: 150
  test_cluster_machine_type: e2-standard-2
  churn_pod_lifetime_seconds: 30
  cluster_registration_timeout_seconds: 5400
  trigger_reconcile: true
  cluster_create_parallelism: 10
  watcher_wait_seconds: 600
  lease_ttl_minutes: 1440

operations:
  # Step 3: the install's state volumes reset, so its first-run flow starts as on a new install, with
  # the fleet's churn and failing Pods running; the window covers the whole flow.
  first_run:
    kind: reset_soak
    factors: [combined]
    runs: 1
    window_seconds: 18000
  # Step 5 (A): an upgrade readiness report, once alone on the first point (3 runs), and with
  # question (B) beside it on the points with 2 and 3 questions at once.
  upgrade_report:
    kind: prompt
    factors: [combined]
    runs: 3
    timeout_seconds: 3600
    prompt: Prepare an upgrade readiness report for my whole fleet. Which clusters are behind, what blocks their upgrade, and in what order should they be upgraded?
    follow_up: Analyse my fleet's health. Which clusters and workloads carry the heaviest traffic, is the load skewed toward one zone, and what looks anomalous?
  # Step 5 (B): fleet health, alone (3 runs) on the first point.
  fleet_health:
    kind: prompt
    factors: [combined]
    runs: 3
    timeout_seconds: 3600
    prompt: Analyse my fleet's health. Which clusters and workloads carry the heaviest traffic, is the load skewed toward one zone, and what looks anomalous?
    follow_up: Prepare an upgrade readiness report for my whole fleet. Which clusters are behind, what blocks their upgrade, and in what order should they be upgraded?
