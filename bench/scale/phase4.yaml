# Phase 4 of docs/designs/agent-harness-bottlenecks.md: ongoing operations only, at more cluster
# counts, to size installs for the largest example fleet (XL, 2,500 clusters).
#
# No onboarding: each level measures what an install runs every day once onboarded. A 10-minute
# window starts Stall Watch (its read of every cluster), a second window starts one daily audit and
# the runner waits for it to finish, and two fan-out questions follow. The test clusters are created
# beforehand, outside the runner, each with its own subnet and small Pod and Service ranges, so the
# project's default network does not cap their number; the levels then only delete clusters.
#
# Run with the credential proxy's limits at 4 CPU and 4 GiB and the agent's at 6 CPU and 12 GiB, so
# their peaks show the need rather than the default limits; the sandbox shell keeps its fixed 2 CPU.
phase: phase4
base_last: true

target:
  host_cluster: scale-host
  host_location: us-central1-c
  namespace: kubeagents-system
  zone: us-central1-f
  cluster_prefix: scale-
  cluster_label: purpose=harness-scale
  mode: next
  data_file: harness-limits.json

base:
  clusters: 2
  nodes: 2
  objects: 100
  churn_per_minute: 10
  failing_pods: 1
  concurrent: 1
  listing_pods: 100

# The combined point runs first, on the full fleet, then the cluster levels shrink it. Level 2 is
# this plan's point; level 1 is Phase 2's, listed so that the records' keys (which carry the level)
# stay apart in the shared data file.
factors:
  combined: [2]
  clusters: [40, 32, 24, 16, 8]

combined:
  - clusters: 8
    objects: 4000
  - clusters: 40
    objects: 1000

settings:
  settle_seconds: 180
  pods_per_node: 60
  fixture_pool: scale-pool
  fixture_machine_type: e2-small
  default_pool_pods: 150
  test_cluster_machine_type: e2-standard-2
  churn_pod_lifetime_seconds: 30
  cluster_registration_timeout_seconds: 5400
  trigger_reconcile: true
  cluster_create_parallelism: 10
  watcher_wait_seconds: 600
  trigger_drain_seconds: 2400

operations:
  steady_10m:
    kind: trigger_soak
    factors: [clusters, combined]
    runs: 1
    window_seconds: 600
    jobs_home: /opt/data/profiles/platform
    jobs: [stall-watch]
  daily_audit:
    kind: trigger_soak
    factors: [clusters, combined]
    runs: 1
    window_seconds: 1500
    jobs_home: /opt/data/profiles/platform
    jobs: [compliance-audit]
  fan_out:
    kind: prompt
    factors: [clusters, combined]
    runs: 2
    timeout_seconds: 2400
    prompt: Which of my clusters, if any, are stressed right now? Check every cluster.
    follow_up: Which clusters do you monitor?
