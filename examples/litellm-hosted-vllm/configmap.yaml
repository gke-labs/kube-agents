apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: kubeagents-system
data:
  config.yaml: |
    model_list:
      - model_name: model-default
        litellm_params:
          # LiteLLM's provider for a self-hosted vLLM server. No api_key: the
          # server checks none, and the address is HOSTED_VLLM_API_BASE on the
          # Deployment rather than an api_base here.
          model: hosted_vllm/google/gemma-4-E2B-it
    litellm_settings:
      callbacks: ["otel", "prometheus"]
