apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-gemma-deployment
  namespace: kubeagents-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gemma-server
  template:
    metadata:
      labels:
        app: gemma-server
        ai.gke.io/model: gemma-4-e2b-it
        ai.gke.io/inference-server: vllm
        examples.ai.gke.io/source: user-guide
    spec:
      containers:
        - name: inference-server
          image: us-docker.pkg.dev/vertex-ai/vertex-vision-model-garden-dockers/pytorch-vllm-serve:gemma4
          resources:
            requests:
              cpu: "2"
              memory: "10Gi"
              ephemeral-storage: "10Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: "10Gi"
              ephemeral-storage: "10Gi"
              nvidia.com/gpu: "1"
          command: ["python3", "-m", "vllm.entrypoints.api_server"]
          args:
            - --model=$(MODEL_ID)
            - --host=0.0.0.0
            - --port=8000
            - --tensor-parallel-size=1
            - --enable-log-requests
            - --enable-chunked-prefill
            - --enable-prefix-caching
            - --enable-auto-tool-choice
            - --generation-config=auto
            - --tool-call-parser=gemma4
            - --dtype=bfloat16
            - --max-num-seqs=16
            - --max-model-len=32768
            - --gpu-memory-utilization=0.95
            - --reasoning-parser=gemma4
            - --trust-remote-code
            - --otlp-traces-endpoint=opentelemetry-collector.gke-managed-otel.svc.cluster.local:4317
          env:
            - name: LD_LIBRARY_PATH
              value: ${LD_LIBRARY_PATH}:/usr/local/nvidia/lib64
            - name: MODEL_ID
              value: google/gemma-4-E2B-it
            - name: OTEL_SERVICE_NAME
              value: vllm-gemma

          # /health is vLLM's own endpoint and answers only once the model is
          # resident on the GPU. That is the whole point here: pulling and
          # loading Gemma takes minutes, and without a readinessProbe the
          # Service publishes this pod immediately and every request in the
          # meantime fails. The startupProbe carries that load — 60 failures at
          # 10s is a 10-minute budget — so readiness can stay tight afterwards.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-rtx-pro-6000
        cloud.google.com/gke-gpu-driver-version: latest
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vllm-gemma
  namespace: kubeagents-system
spec:
  # One replica pinned to a single GPU node, so there is no second pod to keep
  # up. maxUnavailable: 1 states the intent — this workload may be evicted —
  # while a minAvailable here would allow zero disruptions and hang every node
  # drain, which is `blocking-pdb` in
  # agents/platform/governance/obtainability_audit_sop.md §3.4.
  maxUnavailable: 1
  # Copied from the Deployment's own spec.selector: a PDB is matched to its
  # workload by selector, never by name.
  selector:
    matchLabels:
      app: gemma-server
