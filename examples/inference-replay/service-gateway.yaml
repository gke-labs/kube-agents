apiVersion: v1
kind: Service
metadata:
  name: inference-gateway-upstream # Exposes the upstream gateway pod under the name inference-replay forwards to
  namespace: kubeagents-system
spec:
  selector:
    app: litellm # Routes to the original LiteLLM deployment
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
