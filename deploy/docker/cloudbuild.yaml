steps:
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - "docker pull $_IMAGE_URI_LATEST || true"
  - name: "gcr.io/cloud-builders/docker"
    env:
      - "DOCKER_BUILDKIT=1"
    args:
      - "build"
      # Deployment targets are always amd64 GKE nodes; the multi-arch bases
      # otherwise resolve to the build host (#560).
      - "--platform"
      - "linux/amd64"
      - "-t"
      - "$_IMAGE_URI"
      - "-t"
      - "$_IMAGE_URI_LATEST"
      - "--cache-from"
      - "$_IMAGE_URI_LATEST"
      - "-f"
      - "deploy/docker/Dockerfile"
      - "--target"
      - "$_TARGET"
      - "--build-arg"
      - "BUILDKIT_INLINE_CACHE=1"
      - "--build-arg"
      - "HERMES_AGENT_TAG=$_HERMES_AGENT_TAG"
      - "."
  # Publish a mode=max build cache beside the image: inline cache above covers
  # only the final image's layers, so presubmits re-ran every intermediate
  # stage. Writing needs a container-driver builder; reading does not.
  # Fail-open on purpose: empty _BUILDCACHE_URI, any failure, or a HANG skips
  # with a warning, and presubmits fall back to the inline cache. The inner
  # `timeout` is what makes the hang case true: a stalled multi-GB cache push
  # would otherwise ride to the build-level 3600s backstop, an external kill
  # that fires after `images:` is already lost.
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [ -z "$_BUILDCACHE_URI" ]; then
          echo "no _BUILDCACHE_URI; skipping mode=max cache publish"
          exit 0
        fi
        if ! docker buildx version >/dev/null 2>&1; then
          echo "WARNING: buildx unavailable on this worker; skipping mode=max cache publish (consumers fall back to inline cache)"
          exit 0
        fi
        docker buildx create --name cachepub --driver docker-container >/dev/null 2>&1 || true
        timeout 1500 docker buildx build --builder cachepub \
          --platform linux/amd64 \
          -f deploy/docker/Dockerfile \
          --target "$_TARGET" \
          --build-arg HERMES_AGENT_TAG="$_HERMES_AGENT_TAG" \
          --cache-from "type=registry,ref=$_BUILDCACHE_URI" \
          --cache-from "type=registry,ref=$_IMAGE_URI_LATEST" \
          --cache-to "type=registry,ref=$_BUILDCACHE_URI,mode=max" \
          . \
          || echo "WARNING: mode=max cache publish failed or timed out; consumers fall back to inline cache"

# The cache-publish step's cold case (first publish) outlives the 600s
# default, and a build killed there never pushes `images:`.
timeout: 3600s

images:
  - "$_IMAGE_URI"
  - "$_IMAGE_URI_LATEST"
substitutions:
  _IMAGE_URI: ""
  _IMAGE_URI_LATEST: ""
  _TARGET: ""
  _HERMES_AGENT_TAG: ""
  _BUILDCACHE_URI: ""
