# CI-only build of all four images in a single Cloud Build.
#
# Why this exists next to cloudbuild.yaml rather than replacing it: that config
# builds exactly one --target and is called with a different one by
# .github/workflows/docker-publish-gcp.yml and
# scripts/dev/dev_rebuild_agent.sh. Only hack/ci-deploy.sh needs
# all four at once, so the multi-image shape lives here and the single-target
# contract those two depend on stays untouched.
#
# What this buys, and why one build instead of three submits: the two agent
# images share the whole `agent-base` chain, which is nearly all of either
# build. As its own submit, credential-proxy lands on a fresh worker with a cold
# daemon and rebuilds that chain from scratch before it can run any of its own
# instructions. Built on the same worker right after platform, agent-base is
# already in the daemon's cache and only the delta runs
# (gke-labs/kube-agents#635).
steps:
  # No eager cache pull: BuildKit resolves --cache-from remotely and pulls
  # only the blobs it needs; the old full pull cost 70-100s per presubmit.
  # This probe just makes a missing cache loud, and fatal under
  # _REQUIRE_CACHE — keyed on the platform sources alone, since a reachable
  # proxy cache must not green a run whose platform build would go cold.
  - id: cache-probe
    name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        probe() {
          docker manifest inspect "$1" >/dev/null 2>&1 && return 0
          sleep 5
          docker manifest inspect "$1" >/dev/null 2>&1
        }
        found=false
        for ref in "$_BUILDCACHE_IMAGE" "$_CACHE_IMAGE"; do
          [ -n "$ref" ] || continue
          if probe "$ref"; then
            echo "✓ platform cache source reachable: $ref"
            found=true
          else
            echo "⚠ platform cache source missing or unreadable: $ref"
          fi
        done
        if [ -n "$_PROXY_BUILDCACHE_IMAGE" ]; then
          probe "$_PROXY_BUILDCACHE_IMAGE" \
            && echo "✓ proxy cache source reachable: $_PROXY_BUILDCACHE_IMAGE" \
            || echo "⚠ proxy cache source missing or unreadable (informational): $_PROXY_BUILDCACHE_IMAGE"
        fi
        if [ "$found" != "true" ]; then
          echo "WARNING: CACHE MISS — no cache source is reachable."
          echo "Check that docker-publish-gcp.yml is green on main and that Cloud Build"
          echo "holds roles/artifactregistry.reader on kube-agents-prow."
          if [ "$_REQUIRE_CACHE" = "true" ]; then
            echo "ERROR: _REQUIRE_CACHE is set to true. Failing build."
            exit 1
          fi
          echo "Building cold without cache."
        fi

  - id: platform
    name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    env:
      - "DOCKER_BUILDKIT=1"
    args:
      - "-c"
      - |
        # Best source first: the postsubmit's mode=max buildcache covers the
        # intermediate stages inline cache cannot; :latest is the fallback.
        # BARE refs on purpose — a pre-buildx CLI comma-splits the extended
        # `type=registry,ref=…` form into garbage and silently imports
        # nothing, while a bare ref works on every CLI generation.
        CACHE_ARGS=()
        if [ -n "$_BUILDCACHE_IMAGE" ]; then
          CACHE_ARGS+=(--cache-from "$_BUILDCACHE_IMAGE")
        fi
        if [ -n "$_CACHE_IMAGE" ]; then
          CACHE_ARGS+=(--cache-from "$_CACHE_IMAGE")
        fi

        # Deployment targets are always amd64 GKE nodes; the multi-arch bases
        # otherwise resolve to the build host (#560).
        #
        # KUBE_AGENTS_VERSION is the User-Agent this image's remote MCP calls
        # send. hack/ci-deploy.sh passes the pull-request tag, so an evaluation
        # cluster's traffic reads as `kube-agents/pr-1234-abc1234` in the
        # serving team's logs rather than being counted as a release.
        docker build \
          --platform linux/amd64 \
          -t "$_PLATFORM_URI" \
          "$${CACHE_ARGS[@]}" \
          -f deploy/docker/Dockerfile \
          --target platform \
          --build-arg HERMES_AGENT_TAG="$_HERMES_AGENT_TAG" \
          --build-arg KUBE_AGENTS_VERSION="$_KUBE_AGENTS_VERSION" \
          .

  # No waitFor: this runs straight after platform on the same worker, which is
  # the entire point of collapsing the submits. What it inherits locally is
  # agent-base, the ancestor the two images share -- it does not build on the
  # platform image itself, and has not since the proxy-tools stage landed. Its
  # buildcache ref covers the proxy-only stages the daemon state cannot.
  - id: credential-proxy
    name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    env:
      - "DOCKER_BUILDKIT=1"
    args:
      - "-c"
      - |
        # Bare ref for the same pre-buildx-CLI reason as the platform step.
        CACHE_ARGS=()
        if [ -n "$_PROXY_BUILDCACHE_IMAGE" ]; then
          CACHE_ARGS+=(--cache-from "$_PROXY_BUILDCACHE_IMAGE")
        fi
        docker build \
          --platform linux/amd64 \
          -t "$_PROXY_URI" \
          "$${CACHE_ARGS[@]}" \
          -f deploy/docker/Dockerfile \
          --target credential-proxy \
          --build-arg HERMES_AGENT_TAG="$_HERMES_AGENT_TAG" \
          .

  # The shell sandbox every agent pod now talks to over ssh. Like the operator
  # it shares no stage with the agent images, so it starts immediately; its
  # context is the repository root rather than deploy/sandbox because it ships
  # the same credential-proxy client and PATH script the agent image does (the
  # root Makefile's docker-build-sandbox says why copying them would let the
  # two drift). No cache ref: the base is a python image and the build is
  # short enough that a cold one costs less than maintaining the ref.
  - id: sandbox
    name: "gcr.io/cloud-builders/docker"
    waitFor: ["-"]
    env:
      - "DOCKER_BUILDKIT=1"
    args:
      - "build"
      - "--platform"
      - "linux/amd64"
      - "-t"
      - "$_SANDBOX_URI"
      - "-f"
      - "deploy/sandbox/Dockerfile"
      - "."

  # k8s-operator/Dockerfile shares no stage with the agent images, so it starts
  # immediately instead of queueing behind them. It is much the shorter build
  # and finishes well inside theirs, so it costs no wall clock of its own.
  - id: operator
    name: "gcr.io/cloud-builders/docker"
    waitFor: ["-"]
    env:
      - "DOCKER_BUILDKIT=1"
    args:
      - "build"
      - "--platform"
      - "linux/amd64"
      - "-t"
      - "$_OPERATOR_URI"
      - "-f"
      - "k8s-operator/Dockerfile"
      - "k8s-operator"

# Presubmits push only PR-scoped immutable tags, avoiding cross-PR cache pollution
# (gke-labs/kube-agents#635).
images:
  - "$_PLATFORM_URI"
  - "$_PROXY_URI"
  - "$_SANDBOX_URI"
  - "$_OPERATOR_URI"

# No `options.machineType` here on purpose. The operator step only genuinely
# overlaps the agent builds if the worker has cores to spare, but a private
# worker pool defines its own machine and cannot be told one, so the two
# settings are mutually exclusive. hack/ci-deploy.sh passes --machine-type only
# when no pool is configured, which keeps that exclusion structural rather than
# a comment someone has to notice.

# Stated rather than inherited: this is now one build doing the work of four,
# so the ceiling should be visible here instead of depending on whatever
# `gcloud builds submit` defaults to.
timeout: 3600s

substitutions:
  _PLATFORM_URI: ""
  _PROXY_URI: ""
  _SANDBOX_URI: ""
  _OPERATOR_URI: ""
  _CACHE_IMAGE: ""
  _BUILDCACHE_IMAGE: ""
  _PROXY_BUILDCACHE_IMAGE: ""
  _HERMES_AGENT_TAG: ""
  _KUBE_AGENTS_VERSION: "dev"
  _REQUIRE_CACHE: "false"
