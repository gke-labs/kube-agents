# Names the profile a worker speaks for to the shell sandbox, on every
# connection Hermes' ssh backend opens from the agent pod.
#
# In the agent container HERMES_HOME is the *profile* home: a Platform Agent
# worker's is <root>/profiles/platform, a Cluster Agent's is its own. Nothing in
# Hermes' ssh backend forwards a process environment, and the sandbox's sshd
# sets HERMES_HOME itself, to the root, through a SetEnv that sshd applies over
# anything a client sends -- so a forwarded HERMES_HOME would be discarded on
# arrival. The value travels under its own name instead. HERMES_PROFILE_HOME is
# what deploy/sandbox/sshd_config accepts for the `agent` account, and
# deploy/sandbox/session-command.sh reads the profile name out of it and
# exports HERMES_HOME and the pinned KUBECONFIG only when <sandbox
# root>/profiles/<name> exists on that side. The client can pick among the
# homes the sandbox already has, and nothing else.
#
# ssh expands ${HERMES_HOME} from its own environment when it connects, so what
# arrives is the worker's HERMES_HOME at the moment of the call. The Match line
# is load-bearing twice over:
#
#   - `host *-shell-0.*-shell.*` is the sandbox's name as the operator builds
#     it, <agent>-shell-0.<agent>-shell.<namespace>.svc.cluster.local
#     (shellSandboxHost in k8s-operator/internal/controller/
#     shell_sandbox_manifests.go). A connection to any other host sends nothing.
#   - `exec` runs `test ${HERMES_HOME:+1}` under the shell. Set and non-empty,
#     the shell substitutes a 1 and the test passes; unset or empty it
#     substitutes nothing, `test` with no argument fails, and the block is
#     skipped. Without the guard an unset HERMES_HOME does not send nothing, it
#     fails the connection outright ("vdollar_percent_expand: env var
#     ${HERMES_HOME} has no value"). The value itself never reaches a command
#     line: the shell sees a literal 1 or nothing, and the expansion in SetEnv
#     is ssh's own.
#
# Only Hermes' backend reads this file. The two trusted agent-pod callers,
# agents/platform/scripts/sandbox_exec.py and deploy/shared/sandbox_mirror.py,
# pass -F /dev/null and connect as `hermes`, which has no profile to name.
#
# Shipped in the image rather than written by the entrypoint onto the model's
# volume: the rule is static, and a file that steers the connection does not
# belong where the runtime uid can edit it. The base image's /etc/ssh/ssh_config
# includes this directory; deploy/docker/Dockerfile checks at build time that
# the include still reaches this file and that it parses on the image's ssh.
Match host *-shell-0.*-shell.* exec "test ${HERMES_HOME:+1}"
    SetEnv HERMES_PROFILE_HOME=${HERMES_HOME}
