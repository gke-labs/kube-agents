static_resources:
  listeners:
    - name: credential_proxy
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 8765
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: credential_proxy
                # How long a stream may go without a byte in either direction
                # before Envoy resets it. The default is five minutes, which is
                # also the broker's request deadline
                # (CREDENTIAL_PROXY_TIMEOUT_SECONDS, 300 s), and the broker writes
                # nothing to the stream until a request is answered. All the
                # commands one request runs share that deadline -- a vcs publish's
                # several network git commands, a first kubectl's credential
                # fetch and the kubectl itself -- so the silent worst case is the
                # deadline plus up to a minute queued for a slot, two seconds of
                # SIGTERM grace and five of drain: a little over six minutes at
                # the defaults, after which the broker's answer, partial output
                # and the "timed out" notice included, would arrive on a stream
                # Envoy had already reset. Twenty minutes covers that three times
                # over; an operator raising the broker's deadline keeps this above
                # the deadline plus the minute, with room.
                stream_idle_timeout: 1200s
                route_config:
                  name: credential_proxy
                  virtual_hosts:
                    - name: credential_proxy
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: credential_runtime
                            timeout: 0s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    # The kubelet's readiness probe, and nothing else. The credentialed listener
    # above sends every path through credential_runtime, so a probe arriving
    # while the fleet's open cluster watches hold that cluster's connections is
    # refused with the watches' 503, three of those remove the pod from the
    # Service, and every caller loses the broker. This listener answers one
    # exact path, /healthz, through a cluster of its own on the same socket,
    # with a breaker no watch can fill; any other path is Envoy's 404. The
    # operator declares the port (credentialProxyHealthPort) and points the
    # readinessProbe at it; the Service and the NetworkPolicy do not admit it.
    # start-services.sh rebinds every loopback listener address to the one
    # the operator passes (0.0.0.0 in the broker Pod) and refuses a render
    # that leaves one behind, so this listener moves with the credentialed one.
    - name: credential_health
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 8768
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: credential_health
                route_config:
                  name: credential_health
                  virtual_hosts:
                    - name: credential_health
                      domains: ["*"]
                      routes:
                        - match: { path: "/healthz" }
                          route:
                            cluster: credential_health
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: credential_runtime
      connect_timeout: 1s
      type: STATIC
      # Envoy's defaults are 1024 connections and 1024 requests per priority.
      # Each brokered command and each open cluster watch is one upstream
      # connection, held for as long as the command runs, so a fleet of a
      # thousand watched clusters sat at the ceiling and every further request,
      # the readiness probe's included, was refused with 503 UO. Declared for
      # both priorities so that neither inherits the default. The broker's
      # listen backlog (LISTEN_BACKLOG in credential_proxy.py) is sized to
      # max_connections, so this breaker, never the backlog, refuses first.
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 4096
            max_pending_requests: 1024
            max_requests: 4096
          - priority: HIGH
            max_connections: 4096
            max_pending_requests: 1024
            max_requests: 4096
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          # The broker speaks HTTP/1.1 and keeps a connection open between
          # requests, so Envoy reuses one upstream connection per concurrent
          # request instead of opening one per request. How long Envoy holds
          # an idle one before closing it. Under the broker's own idle timeout
          # (KEEPALIVE_IDLE_SECONDS, 60 s) on purpose: the side that closes
          # an idle connection must be the side that would otherwise send on
          # it, or a request lands on a connection the broker closed in the
          # same instant and Envoy answers the caller with a 503. Envoy's
          # default here is an hour.
          common_http_protocol_options:
            idle_timeout: 30s
          explicit_http_config:
            http_protocol_options: {}
      load_assignment:
        cluster_name: credential_runtime
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    pipe:
                      path: /var/run/credential-proxy/backend.sock
    # The readiness probe's cluster: the same socket, so ready still means the
    # broker answers, behind a breaker of its own that the watches above cannot
    # fill. Sixty-four is one kubelet's probes many times over.
    - name: credential_health
      connect_timeout: 1s
      type: STATIC
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 64
            max_pending_requests: 64
            max_requests: 64
          - priority: HIGH
            max_connections: 64
            max_pending_requests: 64
            max_requests: 64
      # The same idle timeout as credential_runtime's, for the same reason:
      # Envoy pools this cluster's connection to the broker between probes,
      # and the broker closes an idle one at 60 s, so Envoy has to close first
      # or a probe lands on a connection the broker just closed and reads 503.
      # The test holds every cluster to the socket to it.
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          common_http_protocol_options:
            idle_timeout: 30s
          explicit_http_config:
            http_protocol_options: {}
      load_assignment:
        cluster_name: credential_health
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    pipe:
                      path: /var/run/credential-proxy/backend.sock

admin:
  address:
    pipe:
      path: /var/run/credential-proxy/envoy-admin.sock
