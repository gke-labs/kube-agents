apiVersion: networking.gke.io/v1alpha1
kind: FQDNNetworkPolicy
metadata:
  name: platform-agent-fqdn-netpol
  namespace: kubeagents-system
  labels:
    app: platform-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: platform-agent
  egress:
    - matches:
        # Google APIs & GCP Services (Vertex AI, GKE, Cloud Logging/Monitoring, Workload Identity)
        - pattern: "googleapis.com"
        - pattern: "*.googleapis.com"
        - pattern: "accounts.google.com"
        - pattern: "*.gstatic.com"
        # GKE DNS-based control plane endpoints. get-credentials prefers these
        # over the IP endpoint wherever a cluster publishes one that accepts
        # external traffic, so the kubeconfig names a Google frontend rather
        # than a control-plane IP, and the API-server egress rule does not
        # cover it.
        #
        # A pattern wildcard spans one label and no dots, so the two-label form
        # is what actually matches an endpoint: the hostname is
        # <cluster-hash>-<project-number>.<region>.gke.goog.
        - pattern: "*.gke.goog"
        - pattern: "*.*.gke.goog"
        # Container & Artifact Registries (Plugin OCI images)
        - pattern: "gcr.io"
        - pattern: "*.gcr.io"
        - pattern: "pkg.dev"
        - pattern: "*.pkg.dev"
        # GitOps & Source Control
        - pattern: "github.com"
        - pattern: "*.github.com"
        - pattern: "*.githubusercontent.com"
        # Chat Integrations
        - pattern: "slack.com"
        - pattern: "*.slack.com"
        - pattern: "*.slack-edge.com"
        - pattern: "*.slack-msgs.com"
        - pattern: "login.microsoftonline.com"
        - pattern: "*.login.microsoftonline.com"
        - pattern: "botframework.com"
        - pattern: "*.botframework.com"
      ports:
        - protocol: "TCP"
          port: 443
