apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-agent-internal-egress
  namespace: kubeagents-system
  labels:
    app: platform-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: platform-agent
  policyTypes:
    - Egress
  egress:
    # 1. LiteLLM Gateway in the agent namespace (Service port 80, container port 4000, and standalone-replay port 8080)
    - ports:
        - port: 80
          protocol: TCP
        - port: 4000
          protocol: TCP
        - port: 8080
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app: litellm
        - podSelector:
            matchLabels:
              app: standalone-replay
    # 2. vLLM Gemma Gateway in the agent namespace (Service port 80 and container port 8000)
    - ports:
        - port: 80
          protocol: TCP
        - port: 8000
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app: gemma-server
    # 3. GKE Managed OpenTelemetry Collector (Trace Export)
    - ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gke-managed-otel
    # 4. GitHub Token Minter (Minty)
    - ports:
        - port: 8080
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app: github-token-minter
